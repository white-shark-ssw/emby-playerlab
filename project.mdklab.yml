name: EmbyPlayerLab

options:
  bundleIdPrefix: com.embyplayerlab
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true

packages:
  SwiftMDK:
    url: https://github.com/wang-bin/swift-mdk.git
    revision: f112a85f2f51c5352439465204c1ae0fa51a9f18
  KSPlayerShim:
    path: MDKLab/KSPlayerShim

# MDK Lab 0.13.5 truthful-buffer and latest-wins seek baseline. Keep the pinned SDK fixed for this comparison round.
# Rapid user taps remain immediate at the UI layer; only native MDK seek dispatch is coalesced latest-wins.
# The MDK lab CI audits both LC_BUILD_VERSION and legacy LC_VERSION_MIN_IPHONEOS slices.
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CLANG_ENABLE_MODULES: "YES"
    MARKETING_VERSION: "0.13.5"
    CURRENT_PROJECT_VERSION: "72"

targets:
  EmbyPlayerLab:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
        excludes:
          - AVIO/KSAVIOOptions.swift
          - AVIO/KSPlayerSparseAVIOContext.swift
          - AVIO/KTVKSPlayerOptions.swift
          - Player/KSAVIOPlayerEngine.swift
      - path: MDKLab/App
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: SwiftMDK
        product: swift-mdk
      - package: KSPlayerShim
        product: KSPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.embyplayerlab.app
        MARKETING_VERSION: "0.13.5"
        CURRENT_PROJECT_VERSION: "72"
        PRODUCT_NAME: "OnePlayer"
        PRODUCT_MODULE_NAME: EmbyPlayerLab
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: OnePlayerIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "OnePlayerAltIcon"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        SWIFT_OBJC_BRIDGING_HEADER: Config/EmbyPlayerLab-Bridging-Header.h
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MDK_LAB"
    scheme:
      testTargets: []
      gatherCoverageData: false
