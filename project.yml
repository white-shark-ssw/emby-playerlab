name: EmbyPlayerLab

options:
  bundleIdPrefix: com.embyplayerlab
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true

packages:
  MPVKit:
    url: https://github.com/streamyfin/MPVKit.git
    exactVersion: 0.40.0-av
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    exactVersion: 2.3.4

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    CLANG_ENABLE_MODULES: "YES"
    MARKETING_VERSION: "0.5.1"
    CURRENT_PROJECT_VERSION: "25"


targets:
  EmbyPlayerLab:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: MPVKit
        product: MPVKit-GPL
      - package: KSPlayer
        product: KSPlayer
    info:
      path: Config/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.embyplayerlab.app
        MARKETING_VERSION: "0.5.1"
        CURRENT_PROJECT_VERSION: "25"
        PRODUCT_NAME: EmbyPlayerLab
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: "NO"
    scheme:
      testTargets: []
      gatherCoverageData: false
