name: Temp sync Build187 project docs

on:
  push:
    branches: [perf/home-carousel-drag-cadence-build187]
    paths:
      - ".github/workflows/temp-sync-build187-docs.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync Build187 authority docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ps = Path('docs/project/PROJECT_STATE.md')
          s = ps.read_text()
          s = s.replace(
              '_Last updated after OnePlayer 0.14.17 / Build184 was accepted on iPhone 15 Pro Max / iOS 17.0 and merged to `main` through PR #255. Build184 is now the accepted overall functional baseline, including the frozen Build182 detail scroll/cold-relaunch presentation architecture and the accepted Build184 visual hierarchy. Build185 remains an independent home-carousel candidate pending real-device validation._',
              '_Last updated after Build185 home-carousel EX comparison was rejected on iPhone 15 Pro Max / iOS 17.0 and Build187 / OnePlayer 0.14.20 completed dedicated Release CI/IPA as the current drag-cadence diagnostic candidate. Build184 / OnePlayer 0.14.17 remains the accepted overall functional baseline on `main`; Build187 does not replace it until target-device evidence is accepted._')
          s = s.replace(
              'Build180 / OnePlayer 0.14.13 is a **historical partial-improvement carousel build**: real-device testing confirmed reversal continuity improved, but initial motion still felt coarse, so it was not accepted. Build185 / OnePlayer 0.14.18 is the current independent home-carousel candidate pending target-device validation.',
              'Build180 / OnePlayer 0.14.13 is a **historical partial-improvement carousel build**: real-device testing confirmed reversal continuity improved, but initial motion still felt coarse, so it was not accepted. Build185 / OnePlayer 0.14.18 restored the required page-slide interaction but was also **real-device rejected**: first visible movement remained about 10/12/16 px versus EX about 1/1/2 px, and ongoing drag still felt materially less fine. Build187 / OnePlayer 0.14.20 is now the independent carousel diagnostic candidate with CI/IPA evidence; it preserves Build185 interaction semantics and only adds exportable drag-cadence diagnostics.')
          section = '''### Build187 / OnePlayer 0.14.20 — home-carousel drag cadence diagnostic\n\n`DEV-home-carousel-drag-smoothness` remains Active. Build187 preserves Build185 page-slide behavior and adds exportable timing evidence rather than another threshold tweak.\n\n- accepted runtime base: Build184 `main@dcd6cc6d01319e13ccb991967a190ae1f915053b`\n- branch: `perf/home-carousel-drag-cadence-build187`\n- dedicated CI source: `6d562b2f5cf76be41cb0e763c8f3c50c4f0d724f`\n- workflow-restored branch head: `468986492f639959f7f31129dadf5b49e781d37f`\n- CI run: `32860057516` — **success**\n- artifact: `OnePlayer-0.14.20-build187-home-carousel-drag-timing`; ID `9567940931`; digest `sha256:0eb2a44b736a84e8237415465f064f6a23a163b5ef802875b483cda672b19766`\n- IPA SHA-256: `5fa04513919b5e2928ee2ca09cf45dddc79c91d64858971f571b423dbb2d50f8`; source ZIP SHA-256: `70ef0df0ef48c9be558674cfd892a39e9836780602992e482f2f0d806d24d40a`\n- MinOS: 15.0\n- diagnostic summary: first/lock/transition translations, sample count/duration, avg callback Hz, max gap, maximumFramesPerSecond and Low Power Mode; emitted once at gesture end through the exported playback-log channel\n- evidence level: **Code written / CI passed / IPA produced / real-device pending / not stable**\n\n'''
          if '### Build187 / OnePlayer 0.14.20 — home-carousel drag cadence diagnostic' not in s:
              s = s.replace('## Current parallel feature candidates\n\n', '## Current parallel feature candidates\n\n' + section, 1)
          old_dir = 'Build178 / OnePlayer 0.14.11 remains the current real-device accepted `main` runtime baseline. Build179 carousel is explicitly rejected by real-device evidence. Build180 / OnePlayer 0.14.13 is the current carousel test candidate with CI/IPA evidence. Build181 / OnePlayer 0.14.14 is a real-device-tested partial-success detail reference: scroll is clearly improved but cold-relaunch warm start failed. Build182 / OnePlayer 0.14.15 is the current detail cold-relaunch test candidate with CI/IPA evidence. Build180 and Build182 both require iPhone 15 Pro Max / iOS 17.0 validation before acceptance.'
          new_dir = 'Build184 / OnePlayer 0.14.17 remains the real-device accepted overall `main` runtime baseline. Build179, Build180 and Build185 carousel candidates are rejected by real-device evidence; Build183 is rejected as the default direction because it changed the established foreground page-slide interaction. Build187 / OnePlayer 0.14.20 is the current carousel drag-cadence diagnostic candidate with CI/IPA evidence and requires iPhone 15 Pro Max / iOS 17.0 recording plus exported playback log before any further rendering change. `DEV-detail-episode-selection-navigation` is a separate active task and currently does not overlap Home carousel files/state owners.'
          s = s.replace(old_dir, new_dir)
          ps.write_text(s)

          bi = Path('docs/project/BUILD_TEST_INDEX.md')
          s = bi.read_text()
          s = s.replace('| **Build185 / 0.14.18** | Restore carousel page-slide semantics + refine initial axis acquisition | Dedicated Release CI passed and IPA produced. Restores Logo/rating/year/type/overview horizontal page travel, removes the old initial 1.08 horizontal-dominance gate, and locks horizontal/vertical once at first meaningful 0.5pt movement while preserving 0pt drag delivery and continuous reversal. **Real-device EX comparison pending.** |', '| **Build185 / 0.14.18** | Restore carousel page-slide semantics + refine initial axis acquisition | Dedicated Release CI passed and IPA produced. **Real-device rejected:** page-slide interaction/reversal were correct, but first visible movement remained about 10/12/16 px versus EX about 1/1/2 px and ongoing drag remained visibly coarser. |')
          if '| **Build187 / 0.14.20** | Exportable carousel drag-cadence diagnostic |' not in s:
              marker = '| **Build185 / 0.14.18** | Restore carousel page-slide semantics + refine initial axis acquisition | Dedicated Release CI passed and IPA produced. **Real-device rejected:** page-slide interaction/reversal were correct, but first visible movement remained about 10/12/16 px versus EX about 1/1/2 px and ongoing drag remained visibly coarser. |'
              s = s.replace(marker, marker + '\n| **Build186 / 0.14.19** | Carousel drag-cadence instrumentation | Dedicated Release CI/IPA succeeded from accepted Build184 integration; passive timing was implemented, but its generic category routed to App logs and the package was not distributed for diagnosis. |\n| **Build187 / 0.14.20** | Exportable carousel drag-cadence diagnostic | Same drag behavior as Build186; routes `HomeCarouselDragTiming` through the existing playback-log export. Dedicated Release CI passed, IPA produced and downloaded checksums verified. **Current carousel diagnostic candidate; real-device evidence pending.** |')
          s = s.replace('Build182 remains real-device accepted/frozen for the two detail performance/cache requirements and is inherited by Build184. Build184 / 0.14.17 is now the accepted overall runtime baseline merged to `main`; Build185 home-carousel interaction is the remaining independent Active candidate.', 'Build182 remains real-device accepted/frozen for the two detail performance/cache requirements and is inherited by Build184. Build184 / 0.14.17 is the accepted overall runtime baseline merged to `main`; Build185 is real-device rejected and Build187 / 0.14.20 is the current independent home-carousel diagnostic candidate pending recording plus exported playback log.')
          if '## Build186 / Build187 home-carousel cadence evidence' not in s:
              marker = '## Build181 detail-page evidence'
              evidence = '''## Build186 / Build187 home-carousel cadence evidence\n\n- Build186 CI source `80d7b8b503d10bd8d10d62714afa9557a5988ab4`; run `32858062142` success; artifact `9567101523`; IPA SHA-256 `08cdf0398e024f8cc64dd75b2e6dfecab2b26833807feb810e280034b345f780`. Build186 preserved Build185 behavior and added passive timing, but was not distributed after confirming its generic timing log was outside the existing playback-log export.\n- Build187 branch `perf/home-carousel-drag-cadence-build187`; only runtime delta vs Build186 is `DiagnosticsLogger.shared.playback("HomeCarouselDragTiming", ...)`; version 0.14.20 / Build187.\n- Build187 CI source `6d562b2f5cf76be41cb0e763c8f3c50c4f0d724f`; restored head `468986492f639959f7f31129dadf5b49e781d37f`; run **`32860057516` success**.\n- Artifact `OnePlayer-0.14.20-build187-home-carousel-drag-timing`; ID **`9567940931`**; digest `sha256:0eb2a44b736a84e8237415465f064f6a23a163b5ef802875b483cda672b19766`; IPA SHA-256 **`5fa04513919b5e2928ee2ca09cf45dddc79c91d64858971f571b423dbb2d50f8`**; source ZIP SHA-256 `70ef0df0ef48c9be558674cfd892a39e9836780602992e482f2f0d806d24d40a`; MinOS 15.0.\n- Evidence: Build186 = **Code written / CI passed / IPA produced / not distributed for diagnosis**; Build187 = **Code written / CI passed / IPA produced / real-device pending / not stable**.\n\n'''
              s = s.replace(marker, evidence + marker, 1)
          s = s.replace('- evidence level: **Code written / CI passed / IPA produced / real-device pending / not stable**\n\n## Build186 / Build187 home-carousel cadence evidence', '- real-device result: **rejected** after OP vs EX recordings quantified first visible movement around 10/12/16 px vs 1/1/2 px and coarser ongoing increments.\n- evidence level: **Code written / CI passed / IPA produced / real-device tested and rejected / not stable**\n\n## Build186 / Build187 home-carousel cadence evidence')
          bi.write_text(s)

          td = Path('docs/project/TECHNICAL_DECISIONS.md')
          s = td.read_text()
          if 'Build187 / OnePlayer 0.14.20 changes only that diagnostic channel' not in s:
              anchor = '## D013 — Detail high-rate scroll and warm presentation stay scoped and presentation-only'
              note = '''Build185 was subsequently **real-device rejected** despite preserving the required page-slide semantics. Paired 30fps recordings measured first visible OnePlayer foreground movement around 10/12/16 px across three starts versus EX around 1/1/2 px; ongoing increments were also coarser. Because OnePlayer already opts into high refresh with `CADisableMinimumFrameDurationOnPhone = true`, arbitrary gesture-threshold tuning is no longer evidence-supported.\n\nThe next decision is diagnostic: preserve Build185 interaction behavior and measure first `onChanged`, axis-lock and transition-start translation plus callback Hz/max-gap/maxFPS/Low-Power state, emitting only one summary at gesture end. If the first delivered sample is already ~8–15pt, investigate `DragGesture`/vertical-`ScrollView` delivery and arbitration; if it is ~0–1pt with healthy cadence while the visual still jumps, investigate atomic transition publication and Hero/persistent-backdrop invalidation/compositing. Only then may the dual full-screen `.blur(radius: 30)` backdrop become the next GPU target.\n\nBuild186 / OnePlayer 0.14.19 implemented that passive diagnostic and passed CI/IPA, but its generic category was not part of the existing playback-log export. Build187 / OnePlayer 0.14.20 changes only that diagnostic channel to `DiagnosticsLogger.shared.playback(...)`; drag behavior is unchanged. Run `32860057516` passed, artifact `9567940931` was produced, and downloaded IPA SHA-256 is `5fa04513919b5e2928ee2ca09cf45dddc79c91d64858971f571b423dbb2d50f8`. Evidence: Build185 = **real-device rejected**; Build186 = **CI/IPA, not distributed for diagnosis**; Build187 = **Code written / CI passed / IPA produced / real-device pending / not stable**.\n\n'''
              s = s.replace(anchor, note + anchor, 1)
          s = s.replace('**Build185 / OnePlayer 0.14.18 = Code written / CI passed / IPA produced / real-device pending / not stable**', '**Build185 / OnePlayer 0.14.18 = Code written / CI passed / IPA produced / real-device tested and rejected / not stable**')
          td.write_text(s)

          cp = Path('docs/project/current/dev/DEV-home-carousel-drag-smoothness.md')
          s = cp.read_text()
          if '## Build187 final diagnostic package' not in s:
              s += '''\n\n## Build187 final diagnostic package\n\n- Build186 CI/IPA succeeded but was not distributed after confirming `HomeCarouselDragTiming` generic logging would not be included in the existing playback-log export.\n- Build187 / OnePlayer 0.14.20 keeps Build186/Build185 drag behavior unchanged and routes only that summary through `DiagnosticsLogger.shared.playback(...)`.\n- branch `perf/home-carousel-drag-cadence-build187`; CI source `6d562b2f5cf76be41cb0e763c8f3c50c4f0d724f`; restored head `468986492f639959f7f31129dadf5b49e781d37f`; run `32860057516` success.\n- artifact `9567940931`; IPA SHA-256 `5fa04513919b5e2928ee2ca09cf45dddc79c91d64858971f571b423dbb2d50f8`; source ZIP SHA-256 `70ef0df0ef48c9be558674cfd892a39e9836780602992e482f2f0d806d24d40a`; MinOS 15.0.\n- validation: **Code written / CI passed / IPA produced / real-device pending / not stable**.\n- next exact action: reproduce tiny starts/slow drags/reversals on iPhone 15 Pro Max / iOS 17.0, record screen, then use Settings → 导出播放日志 and provide the log containing `HomeCarouselDragTiming`.\n'''
          s = s.replace('- Build186 = **Code written / CI passed / IPA produced / real-device pending / not stable**.', '- Build186 = **Code written / CI passed / IPA produced / not distributed for diagnosis / not stable**.\n- Build187 = **Code written / CI passed / IPA produced / real-device pending / not stable**.')
          cp.write_text(s)

          ms = Path('docs/project/MODULE_STATUS.md')
          s = ms.read_text()
          for line in s.splitlines():
              if line.startswith('| Home carousel interaction |'):
                  s = s.replace(line, '| Home carousel interaction | **Active Build187 diagnostic candidate; Build185 real-device rejected** | Build185 restored the required full-page slide but target-device EX recordings still showed 10/12/16 px first visible movement vs EX 1/1/2 px and coarser ongoing increments. Build186 added passive cadence timing but its generic log was not exportable through the existing playback-log UI. Build187 / 0.14.20 changes only that log channel to playback; dedicated Release CI passed and IPA was produced. Real-device recording + exported `HomeCarouselDragTiming` evidence is pending. |')
                  break
          ms.write_text(s)
          PY
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add docs/project/PROJECT_STATE.md docs/project/BUILD_TEST_INDEX.md docs/project/TECHNICAL_DECISIONS.md docs/project/MODULE_STATUS.md docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          git diff --cached --check
          git commit -m "Record Build187 carousel diagnostic baseline"
          git push origin HEAD:main
