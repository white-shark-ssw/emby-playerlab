name: Fix Build191 final doc collisions

on:
  push:
    branches: [feat/detail-episode-selection-navigation]
    paths:
      - ".github/workflows/temp-fix-build191-final-doc-collisions.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/detail-episode-selection-navigation
          fetch-depth: 0
      - name: Fix final Build191 documentation collisions
        run: |
          set -euo pipefail
          cp scripts/temp_fix_build191_final_doc_collisions.py /tmp/temp_fix_build191_final_doc_collisions.py
          git fetch origin main
          git checkout -B main origin/main
          python3 /tmp/temp_fix_build191_final_doc_collisions.py
          git diff --check
          git config user.name "OnePlayer CI"
          git config user.email "actions@users.noreply.github.com"
          git add docs/project/TECHNICAL_DECISIONS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md
          git commit -m "Resolve Build191 final doc collisions"
          git push origin HEAD:main
