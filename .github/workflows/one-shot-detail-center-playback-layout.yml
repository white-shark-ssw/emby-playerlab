name: Apply centered detail playback layout

on:
  push:
    branches:
      - feat/detail-center-playback-layout

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/detail-center-playback-layout
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/apply_detail_center_playback_layout.py
      - name: Run focused regression checks
        run: |
          python3 scripts/check_v0134_detail_navigation.py
          python3 scripts/check_adaptive_hero_reveal.py
      - name: Commit formal source changes
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add Sources/UI/EmbyMediaDetailView.swift Sources/UI/ImmersiveUIComponents.swift scripts/check_adaptive_hero_reveal.py
          git commit -m "feat: center detail playback controls in viewport"
          git push origin HEAD:feat/detail-center-playback-layout
