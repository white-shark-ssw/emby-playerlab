name: Temp Sync Build229 Home Vertical Evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sync-build229-home-vertical-evidence.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a2b4604b66b7a7b3d4b2ee537e02b00c2884744e"
          python3 scripts/temp_sync_build229_home_vertical_evidence.py
          git diff --check
      - name: Commit docs and self-clean
        run: |
          set -euo pipefail
          git config user.name white-shark-ssw
          git config user.email houstools@gmail.com
          git rm scripts/temp_sync_build229_home_vertical_evidence.py .github/workflows/temp-sync-build229-home-vertical-evidence.yml
          git add docs/project/current/dev/DEV-poster-grid-smoothness.md docs/project/current/dev/DEV-home-carousel-drag-smoothness.md docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md
          git commit -m "Record Build229 Home vertical supporting evidence"
          git push origin HEAD:main
