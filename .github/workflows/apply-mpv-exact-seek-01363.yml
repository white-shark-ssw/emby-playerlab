name: Apply MPV Exact Seek 0.13.63

on:
  push:
    branches: [diag/mpv-exact-seek-0.13.63]
    paths:
      - "scripts/migrate_mpv_exact_seek_01363.py"
      - ".github/workflows/apply-mpv-exact-seek-01363.yml"
      - "Sources/Core/AppIdentity.swift"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/mpv-exact-seek-0.13.63
          fetch-depth: 0
      - name: Apply MPV exact seek experiment
        run: |
          set -euo pipefail
          python3 scripts/migrate_mpv_exact_seek_01363.py
          grep -Fq 'let mode = "absolute+exact"' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'hr-seek-framedrop", "yes"' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'exactCommandOverride=true' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'sourceVersion = "0.13.63"' Sources/Core/AppIdentity.swift
          git diff --check
      - name: Commit Build130 runtime source
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No runtime source change required'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Sources/Player/MPVPlayerEngine.swift
          git commit -m 'mpv: test exact seek with hr frame dropping'
          git push origin HEAD:diag/mpv-exact-seek-0.13.63
