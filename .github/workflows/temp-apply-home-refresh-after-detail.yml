name: Temp Apply Home Refresh After Detail

on:
  push:
    branches:
      - fix/home-refresh-after-detail
    paths:
      - .github/workflows/temp-apply-home-refresh-after-detail.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-refresh-after-detail
          fetch-depth: 0
      - name: Apply exact Home lifecycle edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/UI/EmbyHomeCoreV3.swift')
          s = p.read_text()

          replacements = [
              ('@State var isHomeActive = false\n', '@State var isHomeActive = false\n    @State var homeAppearanceGeneration = 0\n'),
              ('''                .onAppear {\n                    isHomeActive = true\n                    synchronizeCarouselItems()''', '''                .onAppear {\n                    homeAppearanceGeneration &+= 1\n                    isHomeActive = true\n                    synchronizeCarouselItems()'''),
              ('''                        V3HomeScrollOffsetObserver { value in\n                            guard immersive, isHomeActive else { return }\n                            let clampedValue = max(-heroTrackingLimit, value)\n                            heroScrollState.update(clampedValue)\n                        }\n                        V3HomeRefreshControlStyler(immersive: immersive)''', '''                        V3HomeScrollOffsetObserver(lifecycleGeneration: homeAppearanceGeneration) { value in\n                            guard immersive, isHomeActive else { return }\n                            let clampedValue = max(-heroTrackingLimit, value)\n                            heroScrollState.update(clampedValue)\n                        }\n                        V3HomeRefreshControlStyler(immersive: immersive, lifecycleGeneration: homeAppearanceGeneration)'''),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly 1 match, found {count}: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          rm -f .github/workflows/temp-apply-home-refresh-after-detail.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reset Home refresh bridges after detail"
          git push origin HEAD:fix/home-refresh-after-detail
