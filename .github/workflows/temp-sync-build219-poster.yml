name: Temp sync Build219 poster with accepted main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sync-build219-poster.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync exact poster candidate onto accepted Build216 main
        shell: bash
        run: |
          set -euo pipefail
          BASE_MAIN=aebc025c5a42df9de056b7e8d1e7b4f14c98c169
          OLD_POSTER=65d03585d9913aef7c8414f2040c787488f2edc8
          git fetch origin main perf/poster-grid-smoothness
          test "$(git rev-parse origin/perf/poster-grid-smoothness)" = "$OLD_POSTER"
          git checkout -B perf/poster-grid-smoothness origin/perf/poster-grid-smoothness
          set +e
          git merge --no-commit "$BASE_MAIN"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "Sources/Core/AppIdentity.swift"
            git checkout --ours Sources/Core/AppIdentity.swift
            git add Sources/Core/AppIdentity.swift
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          rm -f docs/changelog/CHANGELOG_v0_14_49_build216.md
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Build219 poster candidate with accepted main"
          python3 scripts/check_poster_grid_smoothness.py
          git diff --check "$BASE_MAIN" HEAD
          actual="$(git diff --name-only "$BASE_MAIN" HEAD | sort)"
          expected="$(printf '%s\n' \
            Sources/Core/AppIdentity.swift \
            Sources/UI/EmbyPersonMediaView.swift \
            Sources/UI/EmbyPosterGrid.swift \
            Sources/UI/EmbyServerSharedV3.swift \
            Sources/UI/EmbySharedImageAndNavigation.swift \
            docs/changelog/CHANGELOG_v0_14_52_build219.md \
            scripts/check_poster_grid_smoothness.py | sort)"
          printf 'Build219 tree diff:\n%s\n' "$actual"
          test "$actual" = "$expected"
          grep -F 'static let sourceVersion = "0.14.52"' Sources/Core/AppIdentity.swift
          grep -F 'backgroundColor = image == nil ? .secondarySystemBackground : .clear' Sources/UI/EmbySharedImageAndNavigation.swift
          for forbidden in Sources/UI/EmbyHomeCoreV3.swift Sources/UI/EmbyHomeHeroV3.swift Sources/UI/EmbyHomeCarouselStateV3.swift Sources/UI/EmbyHomeCarouselInteractionV3.swift Sources/Player Sources/Transport; do
            if printf '%s\n' "$actual" | grep -F "$forbidden"; then exit 1; fi
          done
          git push origin HEAD:perf/poster-grid-smoothness
          git rev-parse HEAD
