name: Apply Unified Player Core Patch

on:
  push:
    branches: [fix/unified-layout-demand-scheduler]
    paths:
      - '.github/workflows/apply-unified-core.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-layout-demand-scheduler
          fetch-depth: 0

      - name: Apply staged patch
        run: |
          set -euo pipefail
          git apply --check .github/patches/unified-layout-demand.patch
          git apply .github/patches/unified-layout-demand.patch
          rm -f .github/patches/unified-layout-demand.patch .github/workflows/apply-unified-core.yml

      - name: Commit core scheduler changes
        run: |
          set -euo pipefail
          git config user.name 'oneplayer-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add Sources/UI/PlayerScreen.swift Sources/Transport/UnifiedMediaTransportSession.swift .github/patches/unified-layout-demand.patch .github/workflows/apply-unified-core.yml
          git commit -m 'Unify video layout and playback demand scheduling'
          git push origin HEAD:fix/unified-layout-demand-scheduler
