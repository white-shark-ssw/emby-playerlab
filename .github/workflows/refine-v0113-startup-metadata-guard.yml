name: Refine v0.11.3 Startup Metadata Guard

on:
  push:
    branches: [chatgpt/v0.11.3-startup-lane-health]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.11.3-startup-lane-health
      - name: Apply guard
        run: |
          set -euo pipefail
          python3 scripts/refine_v0113_startup_metadata_guard.py
          if git diff --quiet; then
            echo "already applied"
            exit 0
          fi
          git config user.name "ChatGPT CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources/Transport/UnifiedMediaTransportSession.swift
          git commit -m "Do not treat user startup seek as metadata"
          git push origin HEAD:chatgpt/v0.11.3-startup-lane-health
