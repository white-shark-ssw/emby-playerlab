name: Apply detail media metadata

on:
  push:
    branches:
      - feature/detail-media-metadata

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/detail-media-metadata
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/apply_detail_media_metadata.py
      - name: Run focused regressions
        run: |
          python3 scripts/check_detail_media_metadata.py
          python3 scripts/check_adaptive_hero_reveal.py
          python3 scripts/check_v0134_detail_navigation.py
          python3 scripts/check_detail_episode_range_jump.py
      - name: Commit formal changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add Sources/Models/EmbyModels.swift Sources/Networking/EmbyAPIClient.swift Sources/Session/SessionStore.swift Sources/UI/EmbyMediaDetailView.swift scripts/check_detail_media_metadata.py
          git commit -m "feat: add foldable detail media metadata"
          git push origin HEAD:feature/detail-media-metadata
