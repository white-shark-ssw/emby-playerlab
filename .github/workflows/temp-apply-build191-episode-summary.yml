name: Apply Build191 episode summary owner

on:
  push:
    branches: [feat/detail-episode-selection-navigation]
    paths:
      - ".github/workflows/temp-apply-build191-episode-summary.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/detail-episode-selection-navigation
          fetch-depth: 0
      - name: Apply exact Build191 source change
        run: |
          set -euo pipefail
          python3 scripts/temp_apply_build191_episode_summary_owner.py
          git diff --check
          python3 scripts/check_detail_episode_selection_navigation.py
          python3 scripts/check_detail_episode_range_jump.py
          python3 scripts/check_detail_resume_button.py
      - name: Commit Build191 source change
        run: |
          git config user.name "OnePlayer CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources/UI/EmbyMediaDetailView.swift Sources/Core/AppIdentity.swift scripts/check_detail_episode_selection_navigation.py docs/changelog/CHANGELOG_v0_14_24_build191.md
          git commit -m "Unify selected episode summary title"
          git push origin HEAD:feat/detail-episode-selection-navigation
