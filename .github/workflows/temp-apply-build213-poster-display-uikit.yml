name: One-shot Apply Build213 Poster Display UIKit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/poster-grid-smoothness
          fetch-depth: 0
      - name: Guard exact Build212 source
        run: |
          test "$(git rev-parse HEAD)" = "4f0a89ab026cd2103f66e5854a1f352d34852e45"
      - name: Apply minimal display-only UIKit surface
        run: |
          python3 - <<'PY'
          from pathlib import Path

          identity = Path('Sources/Core/AppIdentity.swift')
          text = identity.read_text(encoding='utf-8')
          old = '    static let sourceVersion = "0.14.45"\n    static let version = Bundle.main.object(forInfoDictionaryKey: "CFBundleShortVersionString") as? String ?? "0.14.45"'
          new = '    static let sourceVersion = "0.14.46"\n    static let version = Bundle.main.object(forInfoDictionaryKey: "CFBundleShortVersionString") as? String ?? "0.14.46"'
          if text.count(old) != 1:
              raise SystemExit('AppIdentity Build212 anchor mismatch')
          identity.write_text(text.replace(old, new), encoding='utf-8')

          source = Path('Sources/UI/EmbySharedImageAndNavigation.swift')
          text = source.read_text(encoding='utf-8')
          anchor = '''struct EmbyCachedRemoteImage: View {
'''
          insertion = '''private final class EmbyCachedDisplayImageSurfaceView: UIView {
    let imageView = UIImageView(frame: .zero)

    override init(frame: CGRect) {
        super.init(frame: frame)
        backgroundColor = .clear
        isUserInteractionEnabled = false
        imageView.backgroundColor = .clear
        imageView.clipsToBounds = true
        imageView.frame = bounds
        imageView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
        addSubview(imageView)
    }

    required init?(coder: NSCoder) { nil }
}

private struct EmbyCachedDisplayImageSurface: UIViewRepresentable {
    let loader: EmbyCachedImageLoader
    let contentMode: ContentMode

    func makeCoordinator() -> Coordinator { Coordinator(loader: loader) }

    func makeUIView(context: Context) -> EmbyCachedDisplayImageSurfaceView {
        let view = EmbyCachedDisplayImageSurfaceView(frame: .zero)
        view.imageView.contentMode = contentMode == .fill ? .scaleAspectFill : .scaleAspectFit
        context.coordinator.attach(view)
        return view
    }

    func updateUIView(_ uiView: EmbyCachedDisplayImageSurfaceView, context: Context) {
        uiView.imageView.contentMode = contentMode == .fill ? .scaleAspectFill : .scaleAspectFit
    }

    static func dismantleUIView(_ uiView: EmbyCachedDisplayImageSurfaceView, coordinator: Coordinator) { coordinator.detach() }

    final class Coordinator {
        private let loader: EmbyCachedImageLoader
        private weak var surface: EmbyCachedDisplayImageSurfaceView?
        private var imageCancellable: AnyCancellable?

        init(loader: EmbyCachedImageLoader) {
            self.loader = loader
            imageCancellable = loader.$image.sink { [weak self] image in self?.surface?.imageView.image = image }
        }

        func attach(_ surface: EmbyCachedDisplayImageSurfaceView) {
            self.surface = surface
            surface.imageView.image = loader.image
        }

        func detach() {
            surface = nil
            imageCancellable?.cancel()
            imageCancellable = nil
        }
    }
}

private struct EmbyCachedDisplayRemoteImage: View {
    let url: URL?
    let contentMode: ContentMode
    let placeholderSystemImage: String
    @State private var loader = EmbyCachedImageLoader()

    var body: some View {
        ZStack {
            Color(uiColor: .secondarySystemBackground)
            Image(systemName: placeholderSystemImage).font(.system(size: 24, weight: .medium)).foregroundColor(.secondary.opacity(0.62))
            EmbyCachedDisplayImageSurface(loader: loader, contentMode: contentMode)
        }
        .onAppear { loader.load(url, reportsLoadingState: false, diagnosticRole: "display") }
        .onDisappear { loader.cancel(reportsLoadingState: false) }
        .onChange(of: url) { loader.load($0, reportsLoadingState: false, diagnosticRole: "display") }
    }
}

struct EmbyCachedRemoteImage: View {
'''
          if text.count(anchor) != 1:
              raise SystemExit('EmbyCachedRemoteImage anchor mismatch')
          text = text.replace(anchor, insertion)

          old_init = '''        _loader = StateObject(wrappedValue: EmbyCachedImageLoader(initialURL: onImageLoaded == nil ? url : nil))
'''
          new_init = '''        _loader = StateObject(wrappedValue: EmbyCachedImageLoader(initialURL: onImageLoaded == nil && showsLoadingIndicator ? url : nil))
'''
          if text.count(old_init) != 1:
              raise SystemExit('loader init anchor mismatch')
          text = text.replace(old_init, new_init)

          old_body = '''    var body: some View {
        if let onImageLoaded {
            imageBody.onReceive(loader.$image.compactMap { $0 }) { image in
                let identifier = ObjectIdentifier(image)
                guard reportedImageIdentifier != identifier else { return }
                reportedImageIdentifier = identifier
                let startedAt = CACurrentMediaTime()
                onImageLoaded(image)
                let durationMS = (CACurrentMediaTime() - startedAt) * 1000
                let publishContext = loader.lastPublishContext
                EmbyPosterScrollHitchDiagnostics.shared.imageCallbackDidComplete(url: publishContext?.url ?? url, source: publishContext?.source ?? "unknown", durationMS: durationMS)
            }
        } else {
            imageBody
        }
    }
'''
          new_body = '''    var body: some View {
        if onImageLoaded == nil && !showsLoadingIndicator {
            EmbyCachedDisplayRemoteImage(url: url, contentMode: contentMode, placeholderSystemImage: placeholderSystemImage)
        } else if let onImageLoaded {
            imageBody.onReceive(loader.$image.compactMap { $0 }) { image in
                let identifier = ObjectIdentifier(image)
                guard reportedImageIdentifier != identifier else { return }
                reportedImageIdentifier = identifier
                let startedAt = CACurrentMediaTime()
                onImageLoaded(image)
                let durationMS = (CACurrentMediaTime() - startedAt) * 1000
                let publishContext = loader.lastPublishContext
                EmbyPosterScrollHitchDiagnostics.shared.imageCallbackDidComplete(url: publishContext?.url ?? url, source: publishContext?.source ?? "unknown", durationMS: durationMS)
            }
        } else {
            imageBody
        }
    }
'''
          if text.count(old_body) != 1:
              raise SystemExit('EmbyCachedRemoteImage body anchor mismatch')
          text = text.replace(old_body, new_body)
          source.write_text(text, encoding='utf-8')

          checker = Path('scripts/check_poster_grid_smoothness.py')
          text = checker.read_text(encoding='utf-8')
          old_req = '''    "_loader = StateObject(wrappedValue: EmbyCachedImageLoader(initialURL: onImageLoaded == nil ? url : nil))",
    "if let onImageLoaded {\\n            imageBody.onReceive(loader.$image.compactMap { $0 })",
    "} else {\\n            imageBody\\n        }",
'''
          new_req = '''    "_loader = StateObject(wrappedValue: EmbyCachedImageLoader(initialURL: onImageLoaded == nil && showsLoadingIndicator ? url : nil))",
    "private struct EmbyCachedDisplayRemoteImage: View",
    "@State private var loader = EmbyCachedImageLoader()",
    "EmbyCachedDisplayImageSurface(loader: loader, contentMode: contentMode)",
    "imageCancellable = loader.$image.sink",
    "if onImageLoaded == nil && !showsLoadingIndicator {",
    "if let onImageLoaded {\\n            imageBody.onReceive(loader.$image.compactMap { $0 })",
'''
          if text.count(old_req) != 1:
              raise SystemExit('checker required-image anchor mismatch')
          text = text.replace(old_req, new_req)

          anchor = '''if image_source.count("imageBody.onReceive(loader.$image.compactMap { $0 })") != 1:
    raise SystemExit("image-loaded publisher must exist only on the real callback path")
'''
          addition = '''if image_source.count("imageBody.onReceive(loader.$image.compactMap { $0 })") != 1:
    raise SystemExit("image-loaded publisher must exist only on the real callback path")
display_fast_path = image_source[image_source.index("private struct EmbyCachedDisplayRemoteImage"):image_source.index("struct EmbyCachedRemoteImage")]
if "@StateObject" in display_fast_path or ".onReceive(" in display_fast_path:
    raise SystemExit("display-only poster fast path must not observe loader.objectWillChange through SwiftUI")
for needle in [
    'loader.load(url, reportsLoadingState: false, diagnosticRole: "display")',
    'loader.cancel(reportsLoadingState: false)',
    'loader.$image.sink',
]:
    if needle not in display_fast_path:
        raise SystemExit(f"missing UIKit display-image fast-path contract: {needle}")
'''
          if text.count(anchor) != 1:
              raise SystemExit('checker callback-count anchor mismatch')
          text = text.replace(anchor, addition)
          checker.write_text(text, encoding='utf-8')

          changelog = Path('docs/changelog/CHANGELOG_v0_14_46_build213.md')
          if changelog.exists():
              raise SystemExit('Build213 changelog already exists')
          changelog.write_text('''# OnePlayer 0.14.46 / Build213\n\n## Poster display presentation candidate\n\n- Based directly on Build212 target-device grid evidence: 11 real dragging hitches landed 0–20.1 ms after newly visible 378px network/display poster publication.\n- Pure display images with no loading indicator and no `onImageLoaded` callback keep the existing loader, disk cache, decoded-image pool, request size and immediate delivery, but stop observing loader `objectWillChange` through SwiftUI.\n- The existing loader publisher now feeds a UIKit image surface directly for that display-only path, so a completed poster no longer invalidates and rebuilds the surrounding SwiftUI poster cell merely to present the decoded `UIImage`.\n- Callback/loading-indicator paths remain on the existing SwiftUI implementation; Home carousel callback ownership is unchanged.\n- No image-quality reduction, timer, debounce, throttle, retry, fallback, navigation change, page-data cache change or scroll-physics change.\n- Player / MPV / PiP / UnifiedTransport / playback Cache / Emby Session / STRM→302→115/CDN client-direct paths are untouched. Deployment Target remains iOS 15.0.\n''', encoding='utf-8')
          PY
      - name: Validate source contract and scope
        run: |
          python3 scripts/check_poster_grid_smoothness.py
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "Sources/Core/AppIdentity.swift Sources/UI/EmbySharedImageAndNavigation.swift docs/changelog/CHANGELOG_v0_14_46_build213.md scripts/check_poster_grid_smoothness.py "
          ! git diff --name-only | grep -E 'Sources/(Player|Transport|Cache)/|EmbyHome(Core|Hero|CarouselState|CarouselInteraction)V3\.swift'
      - name: Commit Build213 candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Core/AppIdentity.swift Sources/UI/EmbySharedImageAndNavigation.swift scripts/check_poster_grid_smoothness.py docs/changelog/CHANGELOG_v0_14_46_build213.md
          git commit -m "Route display-only posters through UIKit surface"
          git push origin HEAD:perf/poster-grid-smoothness
