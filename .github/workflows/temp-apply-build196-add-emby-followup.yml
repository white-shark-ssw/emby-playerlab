name: Apply Build196 Add Emby Follow-up

on:
  push:
    branches: [feat/add-emby-page-optimization]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/add-emby-page-optimization
          fetch-depth: 0
      - name: Apply product patch once
        run: |
          set -euo pipefail
          if [[ "$(git log -1 --pretty=%s)" != "Run Build196 Add Emby follow-up" ]]; then
            echo "Not the applicator trigger commit; nothing to do."
            exit 0
          fi
          test "$(git rev-parse HEAD~2)" = "b8073b6a4fb65f34f80109c872c719c135ece739" || { echo "::error::unexpected helper ancestry"; exit 1; }
          python3 .github/temp-build196-add-emby-followup.py
          git diff --check
          git config user.name "OnePlayer CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources/UI/ServerListView.swift Sources/Session/SessionStore.swift Sources/App/RootView.swift Sources/UI/EmbyServerRootViewV3.swift
          git commit -m "Add cached auto-start and editable password"
          git push origin HEAD:feat/add-emby-page-optimization
