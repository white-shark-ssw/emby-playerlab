name: Temp sync Build282 device decay evidence

on:
  push:
    branches: [docs/carousel-build282-device-decay-20260901]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/carousel-build282-device-decay-20260901
          fetch-depth: 0
      - name: Apply docs patch
        run: python3 scripts/temp_sync_carousel_build282_device.py
      - name: Guard docs-only scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(docs/project/(PROJECT_STATE\.md|MODULE_STATUS\.md|TECHNICAL_DECISIONS\.md|BUILD_TEST_INDEX\.md|current/dev/DEV-home-carousel-drag-smoothness\.md))$'; then
            echo 'Unexpected path in docs patch' >&2
            exit 1
          fi
      - name: Commit docs
        run: |
          set -euo pipefail
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add docs/project/PROJECT_STATE.md docs/project/MODULE_STATUS.md docs/project/TECHNICAL_DECISIONS.md docs/project/BUILD_TEST_INDEX.md docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          git commit -m 'Record Build282 sustained FPS decay result'
          git push origin HEAD:docs/carousel-build282-device-decay-20260901
