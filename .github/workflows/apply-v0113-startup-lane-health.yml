name: Apply v0.11.3 Startup Lane Health

on:
  push:
    branches: [chatgpt/v0.11.3-startup-lane-health]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.11.3-startup-lane-health
      - name: Apply source patch
        run: |
          set -euo pipefail
          python3 scripts/apply_v0113_startup_lane_health.py
          if git diff --quiet; then
            echo "already applied"
            exit 0
          fi
          git config user.name "ChatGPT CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources/Transport/UnifiedMediaTransportSession.swift Sources/Transport/RangeHTTPClient.swift Sources/Player/PlayerController.swift
          git commit -m "Fix startup metadata and rotate degraded lanes"
          git push origin HEAD:chatgpt/v0.11.3-startup-lane-health
