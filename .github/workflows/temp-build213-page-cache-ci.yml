name: One-shot Build213 Page Cache IPA

on:
  push:
    branches: ["perf/page-cache-optimization"]
    paths:
      - ".github/workflows/temp-build213-page-cache-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout exact Build213 source
        uses: actions/checkout@v4
        with:
          ref: c8c238816c34ba3d8834ac37bdf7b234cd596458
          fetch-depth: 0

      - name: Validate exact source and task scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c8c238816c34ba3d8834ac37bdf7b234cd596458"
          git diff --check 9b46d1d4a1755c229d52dd2ae8dccb4f06b71181..HEAD
          changed="$(git diff --name-only 9b46d1d4a1755c229d52dd2ae8dccb4f06b71181..HEAD)"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" = "6"
          for file in Sources/Core/AppIdentity.swift Sources/UI/EmbyPagePersistentCache.swift Sources/UI/EmbyServerBrowseV3.swift docs/changelog/CHANGELOG_v0_14_46_build213.md docs/project/MODULE_STATUS.md docs/project/current/dev/DEV-page-cache-optimization.md; do printf '%s\n' "$changed" | grep -Fx "$file" >/dev/null; done
          ! printf '%s\n' "$changed" | grep -E 'Sources/(Player|Transport|Session|Cache)/|Sources/UI/(Player|MPV|EmbyHome|PlayerPiP|EmbySharedImageAndNavigation|EmbyPosterGrid)' >/dev/null
          grep -F 'static let sourceVersion = "0.14.46"' Sources/Core/AppIdentity.swift >/dev/null
          grep -F 'PagePresentation' Sources/UI/EmbyPagePersistentCache.swift >/dev/null
          grep -F 'V3PagePersistentCache.shared.librarySnapshot' Sources/UI/EmbyServerBrowseV3.swift >/dev/null
          grep -F 'V3PagePersistentCache.shared.favoritesSnapshot' Sources/UI/EmbyServerBrowseV3.swift >/dev/null
          ! grep -F '"SortBy"' Sources/UI/EmbyPagePersistentCache.swift >/dev/null

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Prepare app and dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Release build
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            MARKETING_VERSION=0.14.46 \
            CURRENT_PROJECT_VERSION=213 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build.log

      - name: Locate and validate built app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          /usr/bin/plutil -p "$APP_PATH/Info.plist"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id "com.embyplayerlab.app" --version "0.14.46" --build "213" --display-name "OnePlayer" --minimum-os "15.0" --primary-icon "OnePlayerIcon" --alternate-icon "OnePlayerAltIcon"

      - name: Validate MinOS
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" min-os-report.log build.log

      - name: Package exact IPA and source
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-0.14.46-build213-page-cache-unsigned.ipa"
          SOURCE_NAME="OnePlayer-0.14.46-build213-source.zip"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          git archive --format=zip --output "$SOURCE_NAME" HEAD
          /usr/bin/unzip -t "$IPA_NAME"
          /usr/bin/unzip -t "$SOURCE_NAME"
          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"
          shasum -a 256 "$SOURCE_NAME" | tee "$SOURCE_NAME.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_NAME=$SOURCE_NAME" >> "$GITHUB_ENV"

      - name: Upload Build213 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.46-build213-page-cache
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_NAME }}
            ${{ env.SOURCE_NAME }}.sha256
            build.log
            min-os-report.log
          if-no-files-found: error
          retention-days: 30
