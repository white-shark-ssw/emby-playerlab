name: Temp Sync Build184 Project Docs

on:
  push:
    branches: [feat/detail-episode-page-optimization]
    paths:
      - ".github/workflows/temp-sync-build184-project-docs.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch current project evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('docs/project/BUILD_TEST_INDEX.md')
          t = p.read_text()
          old = '| **Build182 / 0.14.15** | Persistent detail presentation cache | Extends Build181\'s safe presentation snapshot from process-only `NSCache` to `Library/Caches` while retaining live Emby refresh and playback/session boundaries. Dedicated standard MPV Release CI passed and IPA produced. **Real-device cold-relaunch validation pending; not stable yet.** |'
          new = '| **Build182 / 0.14.15** | Persistent detail presentation cache | Extends Build181\'s safe presentation snapshot to `Library/Caches` while retaining live Emby refresh and playback/session boundaries. Dedicated Release CI/IPA succeeded; user accepted detail scrolling plus force-quit/relaunch restoration on target device. **Frozen for these two requirements.** |'
          if old in t: t = t.replace(old, new, 1)
          row184 = '| **Build184 / 0.14.17** | Detail visual hierarchy refinement | Moves “视频信息” below “更多类似” and above the bottom glass media-source card and reduces main detail section headers to 19 pt bold. Dedicated Release CI passed and IPA produced; Build182 scroll/cache and P0 contracts remain unchanged. **Real-device visual validation pending.** |'
          if row184 not in t:
              marker = new if new in t else '| **Build182 / 0.14.15**'
              if marker == new: t = t.replace(new, new + '\n' + row184, 1)
              else:
                  lines = t.splitlines(); i = next(i for i,x in enumerate(lines) if x.startswith(marker)); lines.insert(i+1,row184); t='\n'.join(lines)+'\n'
          h = '### Build182 / OnePlayer 0.14.15 — persistent detail presentation cache'
          if h in t:
              s=t.index(h); e=t.find('\n### ',s+4); e=len(t) if e<0 else e
              sec=t[s:e]
              sec=sec.replace('- evidence level: **Code written / CI passed / IPA produced / real-device pending / not stable**','- real-device evidence: user accepted the detail scrolling and force-quit/relaunch restoration and explicitly froze both issues on iPhone 15 Pro Max / iOS 17.0.\n- evidence level: **Code written / CI passed / IPA produced / real-device accepted / frozen for these two requirements**')
              t=t[:s]+sec+t[e:]
          sec184='''\n### Build184 / OnePlayer 0.14.17 — detail visual hierarchy refinement\n\n- task: `DEV-detail-episode-page-optimization` — Active, pending visual acceptance\n- branch: `feat/detail-episode-page-optimization`\n- frozen base: Build182 workflow-restored head `6352671ba843e692c671c66c663c01a43b7848fb`\n- UI product commit: `583d156d51e46ca4f913cbd268d18f8cbdb05b2f`\n- dedicated CI source: `0238f2c8fd202df6e7ba52d582b1614c9230eef9`\n- workflow-restored branch head: `8ea6fc2347f899bd65bda315305a8091e38b1c3d`\n- CI run: `32851745960` — success\n- artifact: `OnePlayer-0.14.17-build184-detail-visual-refinement`\n- artifact ID: `9564647845`\n- IPA SHA-256: `d89953c76b678fe1bc0b9f3fcc8b5b5b3ea430ec74bdd420834b427c91d47eb4`\n- MinOS: app/runtime Mach-O validated at iOS 15.0\n- product delta: “视频信息” follows “更多类似” and precedes the bottom glass media-source summary; main section headers are 19 pt bold; card body text/Hero/spacing are unchanged.\n- frozen evidence: Build182 detail performance/persistent cache and Build176/178/P0 Frozen contracts passed unchanged.\n- evidence level: **Code written / CI passed / IPA produced / real-device pending / not stable**\n'''
          if '### Build184 / OnePlayer 0.14.17 — detail visual hierarchy refinement' not in t:
              marker='\n## Main integration evidence'
              t=t.replace(marker,sec184+marker,1) if marker in t else t+sec184
          p.write_text(t)

          p=Path('docs/project/PROJECT_STATE.md'); t=p.read_text()
          old='Build182 / OnePlayer 0.14.15 is the current **detail-page cold-relaunch test candidate**. It preserves Build181 scroll isolation and extends only the safe presentation snapshot to `Library/Caches`; dedicated Release CI passed and IPA was produced. Target-device cold-relaunch validation is pending, so it does not replace Build178.'
          new='Build182 / OnePlayer 0.14.15 is **real-device accepted and frozen for detail scrolling plus force-quit/relaunch presentation restoration** on iPhone 15 Pro Max / iOS 17.0. It remains a feature-line reference while Build178 stays the overall merged baseline.\n\nBuild184 / OnePlayer 0.14.17 is the current **detail visual-hierarchy test candidate**. It only reorders/renames the media-information section and slightly reduces main section-header typography; dedicated Release CI passed and IPA was produced. Real-device visual acceptance is pending.'
          if old in t: t=t.replace(old,new,1)
          if '### Build182 / OnePlayer 0.14.15 — persistent detail presentation cache' in t:
              s=t.index('### Build182 / OnePlayer 0.14.15 — persistent detail presentation cache'); e=t.find('\n### ',s+4); e=len(t) if e<0 else e
              sec=t[s:e].replace('- evidence level: **Code written / CI passed / IPA produced / real-device pending / not stable**','- real-device evidence: user accepted and froze the detail scrolling and force-quit/relaunch restoration on iPhone 15 Pro Max / iOS 17.0.\n- evidence level: **Code written / CI passed / IPA produced / real-device accepted / frozen for these two requirements**')
              t=t[:s]+sec+t[e:]
          sec184='''\n### Build184 / OnePlayer 0.14.17 — detail visual hierarchy refinement\n\n`DEV-detail-episode-page-optimization` remains Active for UI refinement while Build182 performance/cache behavior stays frozen.\n\n- branch: `feat/detail-episode-page-optimization`\n- dedicated CI source: `0238f2c8fd202df6e7ba52d582b1614c9230eef9`\n- workflow-restored branch head: `8ea6fc2347f899bd65bda315305a8091e38b1c3d`\n- CI run: `32851745960` — success\n- artifact ID: `9564647845`\n- IPA SHA-256: `d89953c76b678fe1bc0b9f3fcc8b5b5b3ea430ec74bdd420834b427c91d47eb4`\n- MinOS: 15.0\n- evidence level: **Code written / CI passed / IPA produced / real-device pending / not stable**\n\nBuild184 changes only the detail visual hierarchy: “视频信息” is below “更多类似” and directly above the bottom glass media-source summary, and main section headers use 19 pt bold. Build182 Hero scroll/persistent presentation cache and playback/order/transport contracts remain unchanged.\n'''
          if '### Build184 / OnePlayer 0.14.17 — detail visual hierarchy refinement' not in t:
              marker='\n### Build179 / OnePlayer 0.14.12 — rejected carousel candidate'
              t=t.replace(marker,sec184+marker,1) if marker in t else t+sec184
          p.write_text(t)
          PY
          git diff --check
      - name: Commit project docs to main
        run: |
          set -euo pipefail
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md
          git commit -m "Record Build182 acceptance and Build184 evidence"
          git push origin HEAD:main
