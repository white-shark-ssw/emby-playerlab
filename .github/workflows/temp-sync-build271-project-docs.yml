name: Sync Build271 project docs

on:
  push:
    branches: [docs/build271-state-sync-20260831]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          ref: docs/build271-state-sync-20260831
          path: helper

      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: repo

      - name: Patch docs
        run: python3 helper/scripts/temp_sync_build271_docs.py repo

      - name: Verify docs-only diff
        working-directory: repo
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'docs/project/BUILD_TEST_INDEX.md\ndocs/project/PROJECT_STATE.md'
          grep -F 'Build271 / 0.15.4' docs/project/PROJECT_STATE.md
          grep -F '| **Build271 / 0.15.4** | Home-carousel frame-pipeline boundary benchmark |' docs/project/BUILD_TEST_INDEX.md
          grep -F 'User result on 2026-08-31: without screen recording' docs/project/BUILD_TEST_INDEX.md

      - name: Commit docs to main
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add docs/project/PROJECT_STATE.md docs/project/BUILD_TEST_INDEX.md
          git commit -m 'docs: record Build271 carousel pipeline baseline'
          git push origin HEAD:main
