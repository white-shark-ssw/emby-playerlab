name: Build OnePlayer 0.13.62 Build129 MDK Quarantine Audio Fix

on:
  push:
    branches: [fix/mdk-quarantine-audio-0.13.62]
    paths:
      - ".github/workflows/build-mdk-quarantine-audio-01362.yml"
      - "MDKLab/**"
      - "Sources/**"
      - "project.mdklab.yml"
  pull_request:
    branches: [diag/mdk-decoder-drop-trace-0.13.59]
    paths:
      - ".github/workflows/build-mdk-quarantine-audio-01362.yml"
      - "MDKLab/**"
      - "Sources/**"
      - "project.mdklab.yml"
  workflow_dispatch:

concurrency:
  group: mdk-quarantine-audio-build129-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify quarantine-audio-only contract
        run: |
          set -euo pipefail
          grep -Fq 'sourceVersion = "0.13.62"' Sources/Core/AppIdentity.swift
          grep -Fq 'swift_mdk.logLevel = .All' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'requestedPolicy=unchanged-default-auto' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          ! grep -Fq 'player.setProperty(name: "video.decoder"' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'OnePlayer.MDK.QuarantineAudio' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'MDKQuarantineAudio' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'player.mute = true' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'quarantineMuted=true' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'action=switch-mpv skipNativeStop=true quarantineMuted=true' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'case AccurateFromStartInCache = 1026' MDKLab/SwiftMDKOnePlayer/Sources/swift-mdk/global.swift
          grep -Fq 'case FastFromStartInCache = 1282' MDKLab/SwiftMDKOnePlayer/Sources/swift-mdk/global.swift
          grep -Fq 'case Default = 258' MDKLab/SwiftMDKOnePlayer/Sources/swift-mdk/global.swift
          grep -Fq 'dispatchedIntent.fastPreview ? .AccurateFromStartInCache : .FromStart' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'private let relativeSeekBufferMinMs: Int64 = 50' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'private let seekBufferMinMs: Int64 = 200' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'private let normalBufferMinMs: Int64 = 1_000' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'private let avioRequestSizeBytes = 2 * 1_048_576' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'action=queue-latest-single-native' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'actualPosition: renderResult' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'authority=health-coordinator' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'private let seekBufferingUIGraceSeconds: TimeInterval = 0.5' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          test ! -e scripts/migrate_mdk_quarantine_audio_01362.py
          test ! -e .github/workflows/apply-mdk-quarantine-audio-01362.yml
          git diff --check

      - name: Select Xcode and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodebuild -version
          swift --version

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build Release for generic iOS device
        id: release_build
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.62 CURRENT_PROJECT_VERSION=129 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Report compiler failure
        if: steps.release_build.outcome == 'failure'
        run: |
          set -euo pipefail
          grep -nE '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|SwiftCompile|CompileSwift|EmitSwiftModule' build.log | tail -300 || true
          tail -220 build.log || true
          exit 1

      - name: Locate built app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Validate app identity
        run: |
          set -euo pipefail
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.62' --build '129' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log

      - name: Validate minimum OS
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.62-build129-mdk-quarantine-audio-fix-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build129 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.62-build129-mdk-quarantine-audio-fix
          path: |
            OnePlayer-0.13.62-build129-mdk-quarantine-audio-fix-unsigned.ipa
            OnePlayer-0.13.62-build129-mdk-quarantine-audio-fix-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
            build.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.62-build129-mdk-quarantine-audio-fix-diagnostics
          path: |
            app-validation.log
            min-os-report.log
            build.log
          if-no-files-found: warn
          retention-days: 14
