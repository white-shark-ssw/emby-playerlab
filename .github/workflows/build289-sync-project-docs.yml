name: Build290 Rejection Handoff Sync

on:
  push:
    branches: [ci/build289-doc-sync-20261005]
    paths: [.github/workflows/build289-sync-project-docs.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded handoff sync
        run: |
          set -euo pipefail
          EXPECTED_MAIN=b247d796a65e4a21b3f20ae2408edd0b97ff8391
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          git fetch origin ci/build289-doc-sync-20261005
          git show origin/ci/build289-doc-sync-20261005:tools/build290_handoff_sync.py > /tmp/build290_handoff_sync.py
          python3 /tmp/build290_handoff_sync.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/current/dev/DEV-home-carousel-drag-smoothness.md | sort)"
          test "$changed" = "$expected"
          git diff --check
          grep -F 'Build289 and Build290 are both target-device rejected' docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          grep -F 'Build290 / 0.15.23 is now target-device rejected' docs/project/PROJECT_STATE.md
          grep -F 'Build289 + Build290 target-device rejected' docs/project/MODULE_STATUS.md
          grep -F '## D033 — Build290 rejects both the root-frame correction' docs/project/TECHNICAL_DECISIONS.md
          grep -F 'Build290 result rejected' docs/project/BUILD_TEST_INDEX.md

      - name: Commit handoff authority to main
        run: |
          set -euo pipefail
          git config user.name 'OnePlayer CI'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          git commit -m 'docs: hand off rejected Build290 Home candidate'
          git push origin HEAD:main
