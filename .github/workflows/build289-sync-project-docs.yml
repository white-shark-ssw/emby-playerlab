name: Build290 Sync Project Docs

on:
  push:
    branches: [ci/build289-doc-sync-20261005]
    paths: [.github/workflows/build289-sync-project-docs.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard and update Build290 authority
        run: |
          set -euo pipefail
          EXPECTED_MAIN=6cddd407454575c20a07d52517220b6b4b91093d
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          python3 - <<'PY'
          from pathlib import Path
          import re

          build_index = Path('docs/project/BUILD_TEST_INDEX.md')
          project_state = Path('docs/project/PROJECT_STATE.md')
          module_status = Path('docs/project/MODULE_STATUS.md')
          technical = Path('docs/project/TECHNICAL_DECISIONS.md')
          task = Path('docs/project/current/dev/DEV-home-carousel-drag-smoothness.md')

          # BUILD_TEST_INDEX: record user real-device rejection of Build289 and packaged Build290 candidate.
          text = build_index.read_text()
          assert '## Build290 — Home native carousel Dock layout regression fix candidate' not in text
          text += '''\n\n## Build290 — Home native carousel Dock layout regression fix candidate\n\n- User real-device evidence on 2026-10-05 **rejects Build289** (`0.15.22 / 289`, exact source `0f5a1893988e20e0dcfe21d0395abe194c2340e6`): the uploaded target-device screen recording shows the Home bottom Dock pushed below the visible screen after the native carousel change. This is direct iPhone evidence and outranks the prior CI/IPA-only pending status.\n- The recording is 30 FPS capture evidence and is used qualitatively for layout/visual regression review; it is **not** treated as a numerical 120 Hz frame-pacing measurement. Other visible carousel-transition concerns remain pending target-device follow-up rather than being converted into speculative code changes.\n- Source inspection found the Dock owner unchanged. Build289 added a Home-private native surface sized to `geometry.size.height + topSafeArea + bottomSafeArea` and offset it upward while the Dock remained a `.bottom` overlay of the Home root `ZStack`. That oversized child could enlarge the Home root alignment rectangle and move the Dock overlay below the viewport, matching the recording.\n- Build290 applies the minimal ownership-preserving correction: constrain the Home root `ZStack` layout rectangle to `geometry.size.width × geometry.size.height` with top alignment, while leaving the oversized native surface free to render into the safe-area region. The Dock implementation itself is not changed.\n- Identity: **OnePlayer 0.15.23 / Build290**. Exact product source: **`9e0bb371fe65c29524b92ac1892bab84b6684444`** on Draft PR #289 / `perf/home-carousel-progress-scope-build286`.\n- Build289→Build290 source delta is exactly two files: `Sources/Core/AppIdentity.swift` (0.15.22→0.15.23) and `Sources/UI/EmbyHomeCoreV3.swift` (one root `.frame(width:height:alignment:)` line). No Player/MPV/PiP/Transport/Cache/Session/shared Poster-image code changed.\n- Dedicated Xcode 16.4 Release run/job: **`37325862505 / 111816942719`** — exact-source guard, dependency preparation, Release compile, identity/MinOS validation, IPA integrity packaging and artifact upload all passed.\n- Artifact: **`OnePlayer-0.15.23-build290-home-carousel-dock-fix`**, ID **`11352810860`**, digest **`sha256:70806c4d5fed5ef48b3e71dea887f5f0867c55b4a962bde0cb4ff9c4d357904f`**.\n- Independently downloaded artifact digest matches GitHub. IPA SHA-256: **`734e2f40fd3d6c694c79feb060d675128927cd0ff2c9c541791be1b1a5a1cf2e`**; source ZIP SHA-256: **`1a3d3b50abaf3707193da427ed3512d223fb0005e7fe33ef891486916ddf7de4`**; both match CI checksum files and IPA `unzip -t` passes.\n- Package identity verified: `com.embyplayerlab.app`, `0.15.23 (290)`, `MinimumOSVersion=15.0`; runtime app Mach-O MinOS audit passes at 15.0.\n- Required next gate: iPhone 15 Pro Max / iOS 17.0 real-device verification that the Dock is restored and that carousel slow/rapid/reversal/release/cancel/settle-takeover, visual continuity, tap-to-detail and Home vertical scrolling remain correct.\n- Evidence: **Code written ✅ / exact-scope guarded ✅ / CI passed ✅ / IPA produced+independently verified ✅ / Build289 real-device rejected ✅ / Build290 real-device tested ❌ / stable-frozen ❌**.\n'''
          build_index.write_text(text)

          # PROJECT_STATE: Build289 is no longer pending; Build290 is current test candidate.
          text = project_state.read_text()
          text, count = re.subn(r'_Last updated 2026-10-05:.*?_\n', '_Last updated 2026-10-05: target-device recording rejects Home carousel Build289 because its native Home surface pushed the bottom Dock below the visible viewport. Build290 / 0.15.23 applies the minimal Home-root layout constraint, passed exact-source CI and was independently packaged/verified; Build290 target-device validation is pending, so no smoothness/stable claim is made. Build216 remains the accepted packaged overall baseline; Poster/Aether remain separate active lines; Search Build256 and all P0 playback/transport contracts remain protected._\n', text, count=1, flags=re.S)
          assert count == 1
          start = text.index('## Active: Home carousel — Build289 native presentation candidate packaged; target-device pending')
          end = text.index('## Historical accepted interaction foundation: Home carousel — Build241 / 0.14.74', start)
          replacement = '''## Active: Home carousel — Build289 rejected on device; Build290 Dock-layout correction packaged, target-device pending\n\nUser target-device recording on 2026-10-05 rejects Build289 (`0.15.22 / 289`, exact source `0f5a1893988e20e0dcfe21d0395abe194c2340e6`): after the native carousel presentation change, the Home bottom Dock is pushed below the visible screen. The recording is 30 FPS capture evidence, so it is authoritative for the visible layout regression but is not used as a numerical 120 Hz performance trace.\n\nExact source review confirms the server Dock owner was not changed. Build289 introduced `V3HomeCarouselNativeSurface` with a layout height equal to Home geometry plus top and bottom safe-area insets, then offset it upward, while the Dock remained the Home root `ZStack`'s bottom overlay. That oversized child could expand the root alignment rectangle and push the Dock overlay offscreen, matching the recording. Build290 therefore changes only the responsible Home layout boundary: the root `ZStack` is constrained back to `geometry.size.width × geometry.size.height` with top alignment; the native surface can still render into the safe-area region and the Dock owner itself is untouched.\n\nCurrent Draft PR remains **#289** on `perf/home-carousel-progress-scope-build286`; exact Build290 product source is **`9e0bb371fe65c29524b92ac1892bab84b6684444`**, identity **OnePlayer 0.15.23 / Build290**. Build289→Build290 changes exactly `Sources/Core/AppIdentity.swift` and `Sources/UI/EmbyHomeCoreV3.swift`; the HomeCore delta is one layout-frame line. The Build289 bounded native presentation runtime otherwise remains unchanged for this candidate.\n\nDedicated Xcode 16.4 run/job **`37325862505 / 111816942719`** passed exact-source guards, Release compile, bundle/MinOS checks, IPA integrity and artifact upload. Artifact **`OnePlayer-0.15.23-build290-home-carousel-dock-fix`**, ID **`11352810860`**, digest `sha256:70806c4d5fed5ef48b3e71dea887f5f0867c55b4a962bde0cb4ff9c4d357904f`; independently verified IPA SHA-256 **`734e2f40fd3d6c694c79feb060d675128927cd0ff2c9c541791be1b1a5a1cf2e`**, source ZIP SHA-256 **`1a3d3b50abaf3707193da427ed3512d223fb0005e7fe33ef891486916ddf7de4`**, bundle `com.embyplayerlab.app`, version/build `0.15.23 (290)`, built/runtime MinOS 15.0.\n\nNo shared Poster image pipeline, Player/MPV/PiP, UnifiedTransport, playback Cache/Session, STRM/302/115/CDN path or Seek contract was changed. Build290 is the current Home test candidate, but **CI/IPA does not prove the Dock regression or carousel smoothness is resolved**. Required next evidence is target-device confirmation of Dock visibility plus slow/rapid swipe, reversal, release/cancel, repeated immediate settle takeover, visual continuity, tap-to-detail and Home vertical interaction. Home remains Active and not Frozen.\n\n'''
          text = text[:start] + replacement + text[end:]
          project_state.write_text(text)

          # MODULE_STATUS: make Build289 rejection and Build290 pending explicit.
          text = module_status.read_text()
          lines = text.splitlines()
          home = [i for i, line in enumerate(lines) if line.startswith('| Home carousel interaction / presentation cadence |')]
          assert len(home) == 1
          lines[home[0]] = '| Home carousel interaction / presentation cadence | **Active — Build289 device-rejected; Build290 CI/IPA verified, target-device pending** | 2026-10-05 target-device recording rejects Build289 / 0.15.22 because the Home bottom Dock is pushed below the visible viewport. Exact source inspection ties this to the oversized Build289 native Home surface changing the Home root bottom-overlay alignment rectangle while the Dock owner itself remained unchanged. Build290 / 0.15.23 exact source `9e0bb371fe65c29524b92ac1892bab84b6684444`, Draft PR #289, adds only a Home-root geometry frame plus identity bump relative to Build289. Run/job `37325862505 / 111816942719` passed; artifact `11352810860`; IPA SHA `734e2f40fd3d6c694c79feb060d675128927cd0ff2c9c541791be1b1a5a1cf2e`; source ZIP SHA `1a3d3b50abaf3707193da427ed3512d223fb0005e7fe33ef891486916ddf7de4`; MinOS 15.0. Shared Poster/image infrastructure and all Player/Transport/Cache/Session/P0 contracts are untouched. Build290 device verification is pending; not Frozen. |'
          other = [i for i, line in enumerate(lines) if line.startswith('| Other product modules |')]
          assert len(other) == 1
          lines[other[0]] = '| Other product modules | Active parallel work | Build216 / 0.14.49 remains the accepted packaged overall runtime identity. Search Build256 is stable/merged. Home Build289 is device-rejected for the Dock regression; Home Build290 / 0.15.23 is the current unmerged CI/IPA-verified correction candidate awaiting target-device validation and is not stable/frozen. Detail immersive navigation remains completed/frozen from Build288 acceptance; Poster Build283 remains a separate target-device-positive active task; Aether remains separate. |'
          module_status.write_text('\n'.join(lines) + '\n')

          # TECHNICAL_DECISIONS: record the regression boundary and exact correction.
          text = technical.read_text()
          assert '## D032 — Build289 native surface must not own Home root layout extent; Build290 restores the Dock alignment boundary' not in text
          text += '''\n\n## D032 — Build289 native surface must not own Home root layout extent; Build290 restores the Dock alignment boundary\n\nThe 2026-10-05 target-device recording is direct evidence that Build289's Home layout regressed: the bottom Dock is displaced below the visible screen. The Dock owner in `EmbyServerRootViewV3` was not changed. The new Build289 Home-private native presentation surface, however, was explicitly sized to the Home geometry plus top and bottom safe-area insets and offset upward inside the same root `ZStack` whose `.bottom` overlay hosts the Dock. Allowing that oversized presentation surface to determine the root layout extent changed the Dock overlay's alignment basis.\n\nThe accepted correction is ownership-scoped rather than a Dock rewrite: the Home root `ZStack` owns the viewport layout rectangle and is constrained to `geometry.size.width × geometry.size.height` with top alignment; the native presentation surface remains free to overflow/render into the safe-area region. No clipping, alternate Dock state, timer, compatibility shim or duplicate inset owner is added. Build289→Build290 changes only that HomeCore frame line plus AppIdentity `0.15.22→0.15.23`.\n\nBuild290 exact source is `9e0bb371fe65c29524b92ac1892bab84b6684444`. Xcode 16.4 run/job `37325862505 / 111816942719` passed exact-scope guards, Release compile, identity/MinOS validation, IPA integrity and artifact upload. Artifact `11352810860`; IPA SHA `734e2f40fd3d6c694c79feb060d675128927cd0ff2c9c541791be1b1a5a1cf2e`; source ZIP SHA `1a3d3b50abaf3707193da427ed3512d223fb0005e7fe33ef891486916ddf7de4`; app/runtime MinOS remains 15.0. This is **Code written / CI passed / IPA produced+verified**, not proof that the device regression is resolved. Build290 requires target-device acceptance before this layout correction or the broader Home native runtime can be called stable/frozen.\n\nThe uploaded recording is 30 FPS and therefore must not be used to derive a numerical 120 Hz frame-pacing result. Visible transition concerns may guide the next device test, but no additional carousel animation change is justified from this capture alone without stronger evidence.\n'''
          technical.write_text(text)

          # Active task checkpoint: replace stale plan-only identity/status with current implementation state.
          text = task.read_text()
          text, count = re.subn(r'- \*\*Status:\*\* .*\n', '- **Status:** Active — Build289 real-device rejected for bottom-Dock displacement; Build290 / 0.15.23 minimal Home-root layout correction is code-complete, CI/IPA verified, and awaiting target-device validation.\n', text, count=1)
          assert count == 1
          text, count = re.subn(r'- \*\*Scope of this handoff:\*\* .*\n', '- **Scope of this checkpoint:** Build289 native presentation implementation, the 2026-10-05 target-device rejection, Build290 minimal Dock-layout correction, CI/package evidence, and the next exact real-device gate are recorded here.\n', text, count=1)
          assert count == 1
          start = text.index('## Controlling baseline / identity')
          end = text.index('Build288 exact source', start)
          current = '''## Controlling baseline / identity\n\n- **Behavior foundation:** merged Build241 interaction contracts remain protected; Build289 introduced the bounded Home-private native presentation runtime.\n- **Current product branch:** `perf/home-carousel-progress-scope-build286`\n- **Draft PR:** #289 — open, unmerged.\n- **Build289 rejected source:** `0f5a1893988e20e0dcfe21d0395abe194c2340e6`, OnePlayer `0.15.22 / 289`; 2026-10-05 target-device recording shows the bottom Dock displaced below the visible screen.\n- **Current Build290 source:** `9e0bb371fe65c29524b92ac1892bab84b6684444`, OnePlayer `0.15.23 / 290`. Build289→Build290 delta is exactly AppIdentity plus one Home-root `.frame(width: geometry.size.width, height: geometry.size.height, alignment: .top)` line.\n- **Build290 CI run / job:** `37325862505 / 111816942719` — success.\n- **Build290 artifact:** `OnePlayer-0.15.23-build290-home-carousel-dock-fix`, ID `11352810860`, digest `sha256:70806c4d5fed5ef48b3e71dea887f5f0867c55b4a962bde0cb4ff9c4d357904f`.\n- **Build290 IPA SHA-256:** `734e2f40fd3d6c694c79feb060d675128927cd0ff2c9c541791be1b1a5a1cf2e`; source ZIP SHA-256: `1a3d3b50abaf3707193da427ed3512d223fb0005e7fe33ef891486916ddf7de4`.\n- **Bundle / version / MinOS:** `com.embyplayerlab.app / 0.15.23 (290) / iOS15.0`.\n- **Target device:** iPhone 15 Pro Max / iOS 17.0.\n- **Evidence boundary:** Build289 is device-rejected; Build290 has Code written + CI passed + IPA produced/independently verified, but no Build290 real-device acceptance yet.\n- **Recording interpretation:** uploaded capture is 30 FPS; use it for qualitative layout/visual evidence, not numerical 120 Hz measurement.\n\n'''
          text = text[:start] + current + text[end:]

          comp_start = text.index('## Completed')
          pending_start = text.index('## Pending', comp_start)
          next_start = text.index('## Next exact action', pending_start)
          completed_pending = '''## Completed\n\n- Build289 bounded native presentation runtime implemented and packaged.\n- User target-device recording reviewed; Build289 rejected because the bottom Dock is pushed below the visible viewport.\n- Exact layout ownership traced without changing the Dock owner: the oversized native Home surface was allowed to determine the root `ZStack` layout extent.\n- Build290 minimal correction committed at exact source `9e0bb371fe65c29524b92ac1892bab84b6684444`; no speculative animation/network/cache/P0 changes added.\n- Build290 exact-source CI run/job `37325862505 / 111816942719` passed and artifact `11352810860` was independently downloaded and verified.\n\n## Validation state\n\n| Evidence | Build289 | Build290 |\n|---|---|---|\n| Code written | yes | yes |\n| CI passed | yes | yes |\n| IPA produced + independently verified | yes | yes |\n| Real-device tested | **rejected — Dock offscreen** | pending |\n| Stable / frozen | no | no |\n\n## Pending\n\n- Install Build290 on iPhone 15 Pro Max / iOS 17.0 and verify the bottom Dock is restored to the accepted position.\n- Recheck carousel slow/rapid/reversal/release/cancel/immediate-settle-takeover behavior, visual continuity, tap-to-detail and Home vertical scrolling.\n- Treat the 30 FPS recording qualitatively; do not claim a numerical 120 Hz result from it.\n- If further carousel defects remain, inspect exact Build290 source/state ownership and new device evidence before any additional code change.\n\n'''
          text = text[:comp_start] + completed_pending + text[next_start:]

          next_start = text.index('## Next exact action')
          rejected_start = text.index('## Rejected / do not repeat', next_start)
          next_text = '''## Next exact action\n\nInstall and exercise Build290 (`0.15.23 / 290`, exact source `9e0bb371fe65c29524b92ac1892bab84b6684444`) on the target iPhone. First confirm Dock visibility/position, then run the existing Home carousel qualitative matrix. Build290 must not be described as resolved/stable until that target-device result exists. If the Dock is fixed but other carousel problems remain, use the new recording/log evidence to isolate the next issue; do not add speculative fixes from the current 30 FPS capture alone.\n\n'''
          text = text[:next_start] + next_text + text[rejected_start:]
          task.write_text(text)
          PY

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/current/dev/DEV-home-carousel-drag-smoothness.md | sort)"
          test "$changed" = "$expected"
          git diff --check
          git diff --stat

      - name: Commit Build290 authority to main
        run: |
          set -euo pipefail
          git config user.name 'OnePlayer CI'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          git commit -m 'docs: record Build289 device rejection and Build290 candidate'
          git push origin HEAD:main
