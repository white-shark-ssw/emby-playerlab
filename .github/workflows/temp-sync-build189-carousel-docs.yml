name: Temp sync Build189 carousel docs

on:
  push:
    branches: [perf/home-carousel-native-touch-build189-from187]
    paths:
      - ".github/workflows/temp-sync-build189-carousel-docs.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync Build189 carousel authority docs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Current task checkpoint.
          p = Path('docs/project/current/dev/DEV-home-carousel-drag-smoothness.md')
          s = p.read_text()
          stale = '- next exact action: reproduce tiny starts/slow drags/reversals on iPhone 15 Pro Max / iOS 17.0, record screen, then use Settings → 导出播放日志 and provide the log containing `HomeCarouselDragTiming`.'
          confirmed = '''- **Build187 real-device result — DIAGNOSIS CONFIRMED**：iPhone 15 Pro Max / iOS 17.0 真机导出日志显示每次触摸先出现 `first=0.00,0.00`，但第一次真正可用的 horizontal / axis-lock / transition 位移已经分别约为 **4.33pt / 8.00pt / 15.67pt / 11.00pt**；`lock` 与 `transition` 位移相同，说明 carousel 第一次能够建立横向 transition 时，手指位移已经累计了数点到十余点。日志同时确认 `maximumFramesPerSecond=120`、Low Power Mode = false。\n- **Build187 conclusion**：0.5pt 阈值没有机会成为实际首段响应粒度；当前纵向 `ScrollView` 场景下 SwiftUI `DragGesture` 没有向 carousel 提供 0.5/1/2pt 级别的有效首段横向样本。停止继续做 0.2pt/0.1pt 等阈值微调，后续只针对输入采样层做最小替换。'''
          if stale in s:
              s = s.replace(stale, confirmed)
          elif 'Build187 real-device result — DIAGNOSIS CONFIRMED' not in s:
              s += '\n\n' + confirmed + '\n'

          build189 = '''\n## Build188 identity collision / Build189 native-touch candidate\n\n- **Identity guard**：并行 Active `DEV-detail-episode-selection-navigation` 已正式占用 **OnePlayer 0.14.21 / Build188**，并已有独立成功 CI/IPA。因此此前 carousel native-touch 的 0.14.21 / Build188 包发生 Build 身份冲突，**不得分发、不得用于真机或日志归因**；其产品逻辑虽通过 CI，但该身份作废。\n- **Valid carousel identity**：carousel native-touch 候选顺延为唯一的 **OnePlayer 0.14.22 / Build189**；GitHub 搜索及并行 checkpoint 核对时 Build189 未被其他 Active task 占用。\n- **Architecture**：只替换手动拖动的输入采样层。新增 UIKit `UIGestureRecognizer` 从 `touchesMoved` 读取 `event.coalescedTouches(for:)`，第一次约 0.5pt 有效向量锁定横向/纵向；横向仍按 `abs(translation) / width` 一对一驱动既有 transition progress。recognizer 不 cancel/delay touches，并允许与纵向 ScrollView simultaneous recognition。\n- **Release semantics unchanged**：原 SwiftUI `DragGesture(minimumDistance: 0)` 保留，继续使用原 `predictedEndTranslation.width`、0.28 progress / 0.48×width predicted commit 门槛以及原 complete/cancel settle；Logo、评分、年份、类型、剧情简介继续与所属轮播页整页横向平移。没有 debounce、throttle、插值、累计补偿、timer、watchdog、retry 或 fallback。\n- **Branch**：`perf/home-carousel-native-touch-build189-from187`；PR = none。\n- **Build identity**：**OnePlayer 0.14.22 / Build189**。\n- **Product head before temporary CI helper**：`36bfd4c1600add86dccc0f9917eea28dc39173f4`。\n- **Dedicated CI source / run**：`7ddb4453abdf671c936a7f42d72fb837d943cc73`；run **`32868634314` success**。\n- **Workflow-restored branch head**：`c3b122f6f2934dc5c32c67e0fcae392a5c13cd14`。\n- **Artifact**：`OnePlayer-0.14.22-build189-home-carousel-native-touch`；artifact ID **`9571260479`**；artifact digest `sha256:e33fdc0b4b185b3062e43ee3e506ff40399a8dbee8872c5344a1b7a4a9b65726`。\n- **IPA**：`OnePlayer-0.14.22-build189-home-carousel-native-touch-unsigned.ipa`；下载后二次 SHA-256 = **`50c74bd43935a31ca3dda781c04a1113c2ce616c7da9e24e438cba78988c3a6d`**，与 artifact 内 `.sha256` 一致。Source ZIP SHA-256 = **`ae7b226aa20063700f3a0964714b2a89fe5e7c0eee4bf8b5cae371e432c791e4`**。\n- **CI coverage**：native/coalesced touch、simultaneous ScrollView、原 page-slide/predicted release commit、Build183 fixed-foreground 拒绝合同、ProMotion opt-in、Build184 detail 与 P0/Frozen zero-diff、Xcode 16.4 Release、0.14.22 (189) identity、MinOS 15.0、IPA packaging/upload 均通过。\n- **Evidence**：**Code written / CI passed / IPA produced / real-device pending / not stable**。\n- **Next exact action**：安装 Build189，在 iPhone 15 Pro Max / iOS 17.0 重点验证极小起滑、慢短拖、正常/快速拖、按住左右反向穿越中心、Hero 区纵向滚动和详情点击。核心判据是第一段可见位移是否从“累计 4–16pt 后才动”变为立即、细粒度跟手。\n'''
          if '## Build188 identity collision / Build189 native-touch candidate' not in s:
              s += build189
          s = s.replace('- Build187 = **Code written / CI passed / IPA produced / real-device pending / not stable**.', '- Build187 = **Code written / CI passed / IPA produced / real-device tested / diagnostic gate confirmed / not stable**.\n- Build189 = **Code written / CI passed / IPA produced / real-device pending / not stable**.')
          p.write_text(s)

          # Build/Test index.
          p = Path('docs/project/BUILD_TEST_INDEX.md')
          s = p.read_text()
          old187 = '| **Build187 / 0.14.20** | Exportable carousel drag-cadence diagnostic | Same drag behavior as Build186; routes `HomeCarouselDragTiming` through the existing playback-log export. Dedicated Release CI passed, IPA produced and downloaded checksums verified. **Current carousel diagnostic candidate; real-device evidence pending.** |'
          new187 = '| **Build187 / 0.14.20** | Exportable carousel drag-cadence diagnostic | Dedicated Release CI/IPA succeeded. **Real-device diagnostic confirmed:** first useful SwiftUI horizontal samples were already about 4.33/8.00/15.67/11.00pt with maxFPS=120 and Low Power Mode off, proving threshold tuning cannot recover fine initial sampling in this ScrollView/DragGesture path. |'
          s = s.replace(old187, new187)
          row189 = '| **Build189 / 0.14.22** | Carousel native raw/coalesced-touch input | Replaces only manual drag sampling with UIKit raw/coalesced touches while preserving full-page slide semantics and the existing SwiftUI predicted release commit. Dedicated Release CI passed, IPA produced and downloaded checksums verified. **Real-device pending.** |'
          if row189 not in s:
              marker = '| **Build188 / 0.14.21** | Detail episode selection semantics + full picker return | Detail horizontal cards select-only with blue outline and compact selected-episode summary; main Play/Resume plays the selected episode. Full picker no longer dismisses before playback, so closing player should reveal the same picker/scroll position. Dedicated Release CI/IPA succeeded; **real-device evidence pending.** |'
              s = s.replace(marker, marker + '\n' + row189)
          s = s.replace('Build182 remains real-device accepted/frozen for the two detail performance/cache requirements and is inherited by Build184. Build184 / 0.14.17 is the accepted overall runtime baseline merged to `main`; Build185 is real-device rejected, Build187 / 0.14.20 is the independent home-carousel diagnostic candidate, and Build188 / 0.14.21 is the independent detail/episode-selection candidate. Both newer candidates remain real-device pending and do not replace Build184.', 'Build182 remains real-device accepted/frozen for the two detail performance/cache requirements and is inherited by Build184. Build184 / 0.14.17 is the accepted overall runtime baseline merged to `main`; Build187 has now completed the carousel diagnostic gate on real device, Build189 / 0.14.22 is the current independent home-carousel native-touch candidate, and Build188 / 0.14.21 remains the independent detail/episode-selection candidate. Build188 and Build189 remain real-device pending and neither replaces Build184.')
          if '## Build189 home-carousel native-touch evidence' not in s:
              insert = '''\n## Build189 home-carousel native-touch evidence\n\n- task: `DEV-home-carousel-drag-smoothness` — Active\n- Build187 real-device gate: first useful SwiftUI samples about 4.33/8.00/15.67/11.00pt; maxFPS=120; Low Power Mode=false; threshold tuning retired.\n- conflicted carousel Build188 / 0.14.21: CI/IPA existed but identity is owned by `DEV-detail-episode-selection-navigation`; **invalid for distribution/attribution**.\n- branch: `perf/home-carousel-native-touch-build189-from187`\n- product head before temporary CI helper: `36bfd4c1600add86dccc0f9917eea28dc39173f4`\n- dedicated Release CI source: `7ddb4453abdf671c936a7f42d72fb837d943cc73`\n- workflow-restored branch head: `c3b122f6f2934dc5c32c67e0fcae392a5c13cd14`\n- CI run: **`32868634314` — success**\n- artifact: `OnePlayer-0.14.22-build189-home-carousel-native-touch`; ID **`9571260479`**\n- artifact digest: `sha256:e33fdc0b4b185b3062e43ee3e506ff40399a8dbee8872c5344a1b7a4a9b65726`\n- IPA SHA-256: **`50c74bd43935a31ca3dda781c04a1113c2ce616c7da9e24e438cba78988c3a6d`**\n- source ZIP SHA-256: **`ae7b226aa20063700f3a0964714b2a89fe5e7c0eee4bf8b5cae371e432c791e4`**\n- MinOS: 15.0\n- implementation: UIKit raw/coalesced touch samples drive manual transition progress; original SwiftUI predicted release commit, foreground page-slide, auto-advance and P0/Frozen contracts remain unchanged.\n- evidence level: **Code written / CI passed / IPA produced / real-device pending / not stable**.\n\n'''
              marker = '## Build181 detail-page evidence'
              s = s.replace(marker, insert + marker, 1)
          p.write_text(s)

          # Module status.
          p = Path('docs/project/MODULE_STATUS.md')
          s = p.read_text()
          old = '| Home carousel interaction | **Active Build187 diagnostic candidate; Build185 real-device rejected** | Build185 restored the required full-page slide but target-device EX recordings still showed 10/12/16 px first visible movement vs EX 1/1/2 px and coarser ongoing increments. Build186 added passive cadence timing but its generic log was not exportable through the existing playback-log UI. Build187 / 0.14.20 changes only that log channel to playback; dedicated Release CI passed and IPA was produced. Real-device recording + exported `HomeCarouselDragTiming` evidence is pending. |'
          new = '| Home carousel interaction | **Active Build189 native-touch candidate; Build187 diagnostic confirmed** | Build187 target-device logs showed first useful SwiftUI horizontal samples already about 4.33/8.00/15.67/11.00pt with maxFPS=120 and Low Power Mode off, so threshold tuning is retired. Build189 / 0.14.22 changes only manual drag sampling to UIKit raw/coalesced touches while preserving full-page slide and original predicted release commit; dedicated Release CI passed and IPA was produced. Real-device validation is pending. |'
          if old not in s:
              raise SystemExit('Home carousel MODULE_STATUS row changed unexpectedly')
          s = s.replace(old, new)
          s = s.replace('| Other product modules | Active parallel work | Build184 / 0.14.17 is the accepted overall runtime baseline on `main`. Build187 / 0.14.20 carousel diagnostic and Build188 / 0.14.21 detail episode-selection candidate are independent real-device-pending lines; neither replaces Build184 until accepted. |', '| Other product modules | Active parallel work | Build184 / 0.14.17 is the accepted overall runtime baseline on `main`. Build189 / 0.14.22 carousel native-touch and Build188 / 0.14.21 detail episode-selection are independent real-device-pending lines; neither replaces Build184 until accepted. |')
          p.write_text(s)

          # Technical decision D012.
          p = Path('docs/project/TECHNICAL_DECISIONS.md')
          s = p.read_text()
          addition = '''\nBuild187 target-device logs resolved that diagnostic gate. Although SwiftUI reported an initial `first=0.00,0.00`, the first useful horizontal/axis-lock/transition translations across actual drags were already approximately **4.33pt / 8.00pt / 15.67pt / 11.00pt**, with lock and transition occurring at the same translation. The same logs reported `UIScreen.main.maximumFramesPerSecond = 120` and Low Power Mode disabled. Therefore the remaining long first-motion distance is not evidence for another 0.5/0.2/0.1pt threshold tweak; in this vertical-ScrollView path the SwiftUI `DragGesture` simply is not supplying sufficiently fine initial horizontal samples to the carousel.\n\nThe next evidence-supported architecture is consequently limited to the input layer: UIKit raw `touchesMoved` plus `coalescedTouches` drives manual progress, with one-time axis acquisition, no touch cancellation/delay, and simultaneous recognition with the vertical ScrollView. The established page-slide mapping remains unchanged, and the existing SwiftUI `DragGesture` remains solely to preserve its current `predictedEndTranslation` release commit/cancel behavior. This is not a rendering rewrite and does not reopen blur, auto-advance, Player, Transport, Cache or PiP.\n\nA carousel package was initially compiled as 0.14.21 / Build188, but the parallel Active `DEV-detail-episode-selection-navigation` had already formally allocated **0.14.21 / Build188** and produced its own CI/IPA. Under the project identity guard, the carousel Build188 identity is invalid and must not be distributed or used for attribution. The valid carousel native-touch candidate is **Build189 / OnePlayer 0.14.22** on `perf/home-carousel-native-touch-build189-from187`. Dedicated Release run `32868634314` passed and artifact `9571260479` was produced; downloaded IPA SHA-256 is `50c74bd43935a31ca3dda781c04a1113c2ce616c7da9e24e438cba78988c3a6d`. Evidence: Build187 = **real-device diagnostic confirmed / not stable**; Build189 = **Code written / CI passed / IPA produced / real-device pending / not stable**.\n'''
          if 'Build187 target-device logs resolved that diagnostic gate.' not in s:
              marker = '\n## D013 — Detail high-rate scroll and warm presentation stay scoped and presentation-only'
              if marker not in s:
                  raise SystemExit('D013 marker missing')
              s = s.replace(marker, '\n' + addition + marker, 1)
          p.write_text(s)

          # Project state.
          p = Path('docs/project/PROJECT_STATE.md')
          s = p.read_text()
          old_top = '_Last updated after Build187 / OnePlayer 0.14.20 completed dedicated Release CI/IPA as the current exportable home-carousel diagnostic candidate and Build188 / OnePlayer 0.14.21 completed dedicated Release CI/IPA as the current detail/episode-selection navigation candidate. Build184 / OnePlayer 0.14.17 remains the accepted overall functional baseline on `main`; neither candidate replaces it until target-device evidence is accepted._'
          new_top = '_Last updated after Build187 real-device diagnostics confirmed that the home-carousel first useful SwiftUI drag samples already arrive at roughly 4–16pt, and Build189 / OnePlayer 0.14.22 completed dedicated Release CI/IPA as the valid native-touch carousel candidate. Build188 / OnePlayer 0.14.21 remains the independent detail/episode-selection navigation candidate. Build184 / OnePlayer 0.14.17 remains the accepted overall functional baseline on `main`; neither Build188 nor Build189 replaces it until target-device evidence is accepted._'
          s = s.replace(old_top, new_top)
          s = s.replace('Build180 / OnePlayer 0.14.13 is a **historical partial-improvement carousel build**: real-device testing confirmed reversal continuity improved, but initial motion still felt coarse, so it was not accepted. Build185 / OnePlayer 0.14.18 restored the required page-slide interaction but was also **real-device rejected**: first visible movement remained about 10/12/16 px versus EX about 1/1/2 px, and ongoing drag still felt materially less fine. Build187 / OnePlayer 0.14.20 is now the independent carousel diagnostic candidate with CI/IPA evidence; it preserves Build185 interaction semantics and only adds exportable drag-cadence diagnostics.', 'Build180 / OnePlayer 0.14.13 is a **historical partial-improvement carousel build**: real-device testing confirmed reversal continuity improved, but initial motion still felt coarse, so it was not accepted. Build185 / OnePlayer 0.14.18 restored the required page-slide interaction but was also **real-device rejected**: first visible movement remained about 10/12/16 px versus EX about 1/1/2 px, and ongoing drag still felt materially less fine. Build187 / OnePlayer 0.14.20 then completed the diagnostic gate on real device: first useful SwiftUI horizontal samples were already about 4.33/8.00/15.67/11.00pt with maxFPS=120 and Low Power Mode off. Build189 / OnePlayer 0.14.22 is now the valid independent carousel native-touch candidate with CI/IPA evidence.')
          old187_evidence = '- evidence level: **Code written / CI passed / IPA produced / real-device pending / not stable**'
          # Only replace inside Build187 section by using a bounded split.
          marker187 = '### Build187 / OnePlayer 0.14.20 — home-carousel drag cadence diagnostic'
          if marker187 in s:
              before, rest = s.split(marker187, 1)
              if old187_evidence in rest:
                  rest = rest.replace(old187_evidence, '- real-device evidence: first useful horizontal/lock/transition samples about 4.33/8.00/15.67/11.00pt; maxFPS=120; Low Power Mode=false; diagnostic gate confirmed.\n- evidence level: **Code written / CI passed / IPA produced / real-device tested / diagnostic confirmed / not stable**', 1)
              s = before + marker187 + rest
          section189 = '''### Build189 / OnePlayer 0.14.22 — home-carousel native-touch input\n\n`DEV-home-carousel-drag-smoothness` remains Active. Build189 directly follows the Build187 real-device proof that SwiftUI's first useful drag sample already arrives several points into the gesture.\n\n- Build188 identity note: carousel 0.14.21 / Build188 is invalid because the parallel detail-selection task already owns Build188; do not distribute or attribute that carousel package\n- branch: `perf/home-carousel-native-touch-build189-from187`\n- product head before temporary CI helper: `36bfd4c1600add86dccc0f9917eea28dc39173f4`\n- dedicated CI source: `7ddb4453abdf671c936a7f42d72fb837d943cc73`\n- workflow-restored branch head: `c3b122f6f2934dc5c32c67e0fcae392a5c13cd14`\n- CI run: **`32868634314` — success**\n- artifact: `OnePlayer-0.14.22-build189-home-carousel-native-touch`; ID `9571260479`; digest `sha256:e33fdc0b4b185b3062e43ee3e506ff40399a8dbee8872c5344a1b7a4a9b65726`\n- IPA SHA-256: `50c74bd43935a31ca3dda781c04a1113c2ce616c7da9e24e438cba78988c3a6d`; source ZIP SHA-256: `ae7b226aa20063700f3a0964714b2a89fe5e7c0eee4bf8b5cae371e432c791e4`\n- MinOS: 15.0\n- implementation boundary: UIKit raw/coalesced touch samples drive manual progress; existing full-page foreground travel and SwiftUI predicted release commit/cancel remain unchanged; P0/Frozen files zero-diff\n- evidence level: **Code written / CI passed / IPA produced / real-device pending / not stable**\n\n'''
          if '### Build189 / OnePlayer 0.14.22 — home-carousel native-touch input' not in s:
              marker = '### Build187 / OnePlayer 0.14.20 — home-carousel drag cadence diagnostic'
              s = s.replace(marker, section189 + marker, 1)
          p.write_text(s)
          PY

          git config user.name "OnePlayer Docs Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md docs/project/PROJECT_STATE.md docs/project/MODULE_STATUS.md docs/project/TECHNICAL_DECISIONS.md docs/project/BUILD_TEST_INDEX.md
          if git diff --cached --quiet; then
            echo "No doc changes needed"
            exit 0
          fi
          git commit -m "Sync Build189 carousel authority docs"
          git push origin HEAD:main
