name: Record Build216 index

on:
  push:
    branches: [fix/detail-episode-range-inertia-build216]
    paths:
      - ".github/workflows/temp-record-build216-index.yml"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record Build216 candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/project/BUILD_TEST_INDEX.md')
          text = path.read_text()
          row = '| **Build216 / 0.14.49** | Detail episode-range inertia interruption | **CI/IPA verified; real-device pending.** Range-pill taps now synchronously stop active native episode-row deceleration at the current offset before the accepted Build191 range-first selection and existing 0.32 s target scroll. Tested source `dc00cac9f35ee4a3b950e4bb030bb324baf90b18`; run/job `33064051545 / 98489652724`; artifact `9643031850`; IPA SHA-256 `e3054a53398e1df48134fecd8c30671e10ecaa8a93df5483936adcf10e055075`; MinOS 15.0 verified. Build182/Build191/Build195/Build178 and P0 playback/transport remain untouched. **Not accepted/stable until target-device test.** |\n'
          if row in text:
              raise SystemExit('Build216 row already present')
          marker = '| **Build215 / 0.14.48** | Acquisition-relative Home-carousel render + foreground-alpha decoupling | **Real-device tested; partial success, not accepted.** Initial drag is now about as fine as EX and foreground blur/ghosting is gone, confirming acquisition-relative render baseline + opaque foreground. Overall tactile smoothness still trails EX (user: EX feels like smooth glass, OnePlayer like rough paper). 30fps video no longer shows the old macro hold/jump; residual micro-continuity/cadence cause remains unresolved and backdrop timing is only a hypothesis. |\n'
          if text.count(marker) != 1:
              raise SystemExit('Build215 index marker changed')
          path.write_text(text.replace(marker, marker + row, 1))
          PY
          git diff --check
          git diff -- docs/project/BUILD_TEST_INDEX.md
          git config user.name "OnePlayer CI"
          git config user.email "actions@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md
          git commit -m "Record Build216 detail inertia candidate"
          git push origin HEAD:main
