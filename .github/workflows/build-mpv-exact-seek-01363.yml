name: Build OnePlayer 0.13.63 Build130 MPV Exact Seek A/B

on:
  push:
    branches: [diag/mpv-exact-seek-0.13.63]
    paths:
      - ".github/workflows/build-mpv-exact-seek-01363.yml"
      - "MDKLab/**"
      - "Sources/**"
      - "project.mdklab.yml"
  pull_request:
    branches: [fix/mdk-quarantine-audio-0.13.62]
    paths:
      - ".github/workflows/build-mpv-exact-seek-01363.yml"
      - "MDKLab/**"
      - "Sources/**"
      - "project.mdklab.yml"
  workflow_dispatch:

concurrency:
  group: mpv-exact-seek-build130-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated MPV exact seek contract
        run: |
          set -euo pipefail
          grep -Fq 'sourceVersion = "0.13.63"' Sources/Core/AppIdentity.swift
          grep -Fq 'let mode = "absolute+exact"' Sources/Player/MPVPlayerEngine.swift
          ! grep -Fq 'let mode = "absolute+keyframes"' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'mpv_set_option_string(handle, "hr-seek", "no")' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'mpv_set_option_string(handle, "hr-seek-framedrop", "yes")' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'exactCommandOverride=true' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'event=playback-restart' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'player.mute = true' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'quarantineMuted=true' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'private let avioRequestSizeBytes = 2 * 1_048_576' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          test ! -e scripts/migrate_mpv_exact_seek_01363.py
          test ! -e .github/workflows/apply-mpv-exact-seek-01363.yml
          ! grep -R -Fq 'SeekPrefetchCoordinator' Sources MDKLab || true
          git diff --check

      - name: Select Xcode and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodebuild -version
          swift --version

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build Release for generic iOS device
        id: release_build
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.63 CURRENT_PROJECT_VERSION=130 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Report compiler failure
        if: steps.release_build.outcome == 'failure'
        run: |
          set -euo pipefail
          grep -nE '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|SwiftCompile|CompileSwift|EmitSwiftModule' build.log | tail -300 || true
          tail -220 build.log || true
          exit 1

      - name: Locate built app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Validate app identity
        run: |
          set -euo pipefail
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.63' --build '130' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log

      - name: Validate minimum OS
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.63-build130-mpv-exact-seek-ab-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build130 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.63-build130-mpv-exact-seek-ab
          path: |
            OnePlayer-0.13.63-build130-mpv-exact-seek-ab-unsigned.ipa
            OnePlayer-0.13.63-build130-mpv-exact-seek-ab-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
            build.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.63-build130-mpv-exact-seek-ab-diagnostics
          path: |
            app-validation.log
            min-os-report.log
            build.log
          if-no-files-found: warn
          retention-days: 14
