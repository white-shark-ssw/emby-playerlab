name: Temp Apply Home Immersive Carousel

on:
  push:
    branches: [feat/immersive-home-carousel]
    paths:
      - '.github/workflows/temp-apply-home-immersive-carousel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply immersive home patch
        run: python3 .github/apply_home_immersive_carousel.py

      - name: Run immersive home regression check
        run: python3 scripts/check_home_immersive_carousel.py

      - name: Commit source changes and remove staging files
        run: |
          set -euo pipefail
          git config user.name 'os-player-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/apply_home_immersive_carousel.py .github/workflows/temp-apply-home-immersive-carousel.yml
          git add Sources/UI/EmbyServerRootViewV3.swift scripts/check_home_immersive_carousel.py
          git commit -m 'feat: add immersive home carousel and glass dock'
          git push origin HEAD:feat/immersive-home-carousel
