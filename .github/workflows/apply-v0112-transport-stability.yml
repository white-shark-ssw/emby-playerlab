name: Apply v0.11.2 Transport Stability

on:
  push:
    branches: [chatgpt/v0.11.2-transport-stability]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.11.2-transport-stability
      - name: Finalize source
        run: |
          set -euo pipefail
          python3 scripts/apply_v0112_transport_stability.py
          python3 scripts/finalize_v0112.py
          if git diff --quiet; then
            echo "already finalized"
            exit 0
          fi
          git config user.name "ChatGPT CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources/Transport/UnifiedMediaTransportSession.swift Sources/Transport/TransportTypes.swift Sources/Player/PlayerController.swift Sources/Core/AppIdentity.swift Config/Info.plist project.yml .github/workflows/validate-source.yml .github/workflows/build-unsigned-ipa.yml scripts/check_transport_v3_invariants.py
          git commit -m "Finalize v0.11.2 transport stability fixes"
          git push origin HEAD:chatgpt/v0.11.2-transport-stability
