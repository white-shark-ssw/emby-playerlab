name: Apply v0.11.2 Transport Stability

on:
  push:
    branches: [chatgpt/v0.11.2-transport-stability]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.11.2-transport-stability
      - name: Apply source patch
        run: |
          set -euo pipefail
          python3 scripts/apply_v0112_transport_stability.py
          if git diff --quiet; then
            echo "already applied"
            exit 0
          fi
          git config user.name "ChatGPT CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources/Transport/UnifiedMediaTransportSession.swift Sources/Transport/TransportTypes.swift Sources/Player/PlayerController.swift
          git commit -m "Stabilize foreground reads and full-cache timeline"
          git push origin HEAD:chatgpt/v0.11.2-transport-stability
