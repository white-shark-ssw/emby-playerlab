name: One-shot sync Build206 poster diagnostic evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-sync-build206-poster-docs.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Patch current poster task authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: anchor count {s.count(old)} for {old[:80]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # MODULE_STATUS
          path = 'docs/project/MODULE_STATUS.md'
          old = '| Poster 3-column / poster-heavy scroll smoothness | **Active — Build202 real-device rejected; Build204 CI/IPA verified; real-device pending** | Build202 / 0.14.35 passed CI/IPA, but the latest target-device recording still shows the required failure signature around 4.067 s: vertical motion about `-6.36 px → 0 px → -26.19 px`, so Build202 is real-device tested and rejected for smoothness, not stable. Build204 / 0.14.37 keeps the existing lazy containers and all Build202 reductions, and targets only two deterministic ordinary-poster cell-entry costs: no-callback poster views no longer install a no-op `loader.$image` Combine subscriber, and ordinary warm-cache cells seed the loader from the existing decoded-memory cache so `onAppear` does not synchronously publish a second `image = rendered` invalidation. Hero/detail/carousel callback paths retain their previous publication/callback semantics. Exact CI source `e6a97b5083691ed10795a402edc0fd30f996cffc`; run/job `32996847597` / `98268250117` passed; artifact ID `9617026984`; IPA/source integrity, `0.14.37 (204)` identity and MinOS 15.0 independently verified. No Player/MPV/PiP/Transport/Cache/Session or carousel-owner file changed. Build204 has not yet been real-device tested. |'
          new = '| Poster 3-column / poster-heavy scroll smoothness | **Active — Build204 real-device rejected; Build206 diagnostic CI/IPA verified; real-device log capture pending** | Build204 / 0.14.37 was tested on iPhone 15 Pro Max / iOS 17.0 and still visibly hitches on both Home poster-heavy scrolling and library 3×3 pages. The latest recording again shows stop/catch-up events around 5.900 s (`-1.56 px → 0 → -10.33 px`) and 7.133 s (`-1.99 px → 0 → -20.27 px`), so the warm-cache/no-op-subscriber reductions are not the main root cause. Build206 / 0.14.39 is therefore diagnostic-only: one shared `CADisplayLink` records `PosterScrollHitch` only when the main display interval reaches ≥30 ms and tags the most recent poster-cell appearance, image commit and grid load-ahead event; it does not change scrolling, navigation, image policy, carousel ownership or any Player/MPV/PiP/Transport/Cache/Session path. Exact Build206 source `351c62694ac25404c2bd4eb36a03314dd58ffed2`; run/job `33000992493` / `98282482225` passed; artifact ID `9618646972`; IPA SHA-256 `ee981133777c316305c4890aaa1a99b8906792783cad1496d880bf786611e18c`; source ZIP SHA-256 `68fcde68a4fbf157bfe50a3ae5957e67e6664c461c067132d8d33f73553239ab`; bundle `com.embyplayerlab.app`, version/build `0.14.39 (206)`, MinOS 15.0 independently verified. Real-device diagnostic capture is still pending; Build206 is not a claimed fix. |'
          replace_once(path, old, new)

          # BUILD_TEST_INDEX milestone rows
          path = 'docs/project/BUILD_TEST_INDEX.md'
          replace_once(path,
              '| **Build204 / 0.14.37** | Poster warm-cache cell-entry reduction | **Owned by poster-scroll.** CI/IPA passed and independently verified; target-device validation pending. A separately-created carousel Build204 package was retired because this identity was already occupied and must not be used for attribution. |',
              '| **Build204 / 0.14.37** | Poster warm-cache cell-entry reduction | **Owned by poster-scroll.** CI/IPA passed; target-device tested on Home and library 3×3 and rejected because visible stop/catch-up hitching remains. A separately-created carousel Build204 package was retired because this identity was already occupied and must not be used for attribution. |')
          replace_once(path,
              '| **Build206 / 0.14.39** | Poster-scroll diagnostic line | **Owned by the independent poster task.** Carousel must not use this identity. |',
              '| **Build206 / 0.14.39** | Poster-scroll hitch diagnostics | **Owned by the independent poster task.** Diagnostic-only shared `CADisplayLink` logs ≥30 ms display gaps plus nearest poster-cell/image/load-ahead event; CI/IPA produced+verified, real-device log capture pending. Carousel must not use this identity. |')
          old = '''### Build204 — current poster-scroll candidate

- identity: **0.14.37 / 204**; this is the canonical Build204 owner.
- exact CI source: `e6a97b5083691ed10795a402edc0fd30f996cffc`.
- durable cleanup head: `170778c3934a280d9b539fb45f0bfef673687825`.
- runtime delta from Build202 is limited to `AppIdentity.swift` and `EmbySharedImageAndNavigation.swift`.
- ordinary images without `onImageLoaded` no longer install a no-op `loader.$image` Combine subscriber.
- ordinary warm-cache cells initialize from the existing decoded-memory cache so `onAppear` avoids a second synchronous cached-image publication.
- run/job: `32996847597` / `98268250117` — success.
- artifact ID: `9617026984`.
- IPA SHA-256: `b4ba266086674f95a09ef92500c78926b4bc9cfd022c637075985cd55c598130`.
- evidence: **Code written / exact scope+Frozen guard / CI passed / IPA produced+verified / real-device pending / not stable.**
'''
          new = '''### Build204 — real-device rejected

- identity: **0.14.37 / 204**; canonical Build204 owner.
- exact CI source: `e6a97b5083691ed10795a402edc0fd30f996cffc`; durable cleanup head `170778c3934a280d9b539fb45f0bfef673687825`.
- run/job `32996847597` / `98268250117` — success; artifact ID `9617026984`; IPA SHA-256 `b4ba266086674f95a09ef92500c78926b4bc9cfd022c637075985cd55c598130`.
- target-device result: visible hitching remains on both Home poster-heavy scrolling and library 3×3 pages.
- latest 30 fps recording contains at least two stop/catch-up events: ~5.900 s (`-1.56 px → 0 → -10.33 px`) and ~7.133 s (`-1.99 px → 0 → -20.27 px`).
- conclusion: no-op image-subscriber removal and warm-cache first-body seeding are retained source reductions but are **not** sufficient to explain/fix the cross-page hitch.
- evidence: **Code written / exact scope+Frozen guard / CI passed / IPA produced+verified / real-device tested / smoothness rejected / not stable.**

### Build206 — current poster diagnostic candidate

- identity: **0.14.39 / 206**; Build205 belongs to carousel and Build207 is its later candidate, so Build206 remains poster-owned.
- exact diagnostic source: **`351c62694ac25404c2bd4eb36a03314dd58ffed2`**.
- runtime diagnostic scope: shared poster path only; one `CADisplayLink` while poster cells are visible, logging `PosterScrollHitch` only for display gaps **≥30 ms**, with nearest cell-appear, image-commit and grid-load-ahead timestamps.
- no change to scroll mechanics, lazy-container semantics, image request sizing/caching policy, NavigationLink behavior, carousel input/state owner, Player/MPV/PiP/Transport/Cache/Session.
- source/Frozen/carousel-owner guard: PASS.
- run/job: **`33000992493` / `98282482225` — success**.
- artifact: `OnePlayer-0.14.39-build206-poster-hitch-diagnostics`; artifact ID **`9618646972`**; artifact digest `sha256:eb780276e88fcd6ce41df5e962168dec5976913a0f9e9a829350efc89ea29dbe`.
- independently downloaded IPA SHA-256: **`ee981133777c316305c4890aaa1a99b8906792783cad1496d880bf786611e18c`**.
- source ZIP SHA-256: **`68fcde68a4fbf157bfe50a3ae5957e67e6664c461c067132d8d33f73553239ab`**.
- independent package validation: ZIP integrity OK; `** BUILD SUCCEEDED **`; bundle `com.embyplayerlab.app`; OnePlayer **0.14.39 (206)**; `MinimumOSVersion=15.0`; MinOS audit OK.
- evidence: **Code written ✅ / exact scope+Frozen guard ✅ / CI passed ✅ / IPA produced+verified ✅ / real-device diagnostic capture pending / not stable.**
'''
          replace_once(path, old, new)

          # Task checkpoint
          path = 'docs/project/current/dev/DEV-poster-grid-smoothness.md'
          replace_once(path,
              '**Active — Build202 target-device tested and rejected; Build204 CI/IPA produced+verified; real-device pending**',
              '**Active — Build204 target-device tested and rejected; Build206 diagnostic CI/IPA produced+verified; real-device log capture pending**')
          replace_once(path,
              '- Current candidate：**OnePlayer 0.14.37 / Build204**。',
              '- Build204：**0.14.37 / 204** — target-device rejected; Home and library 3×3 still visibly hitch。\n- Current diagnostic candidate：**OnePlayer 0.14.39 / Build206**。')
          insert_anchor = '## Parallel safety\n'
          insertion = '''## Build204 target-device result — rejected — 2026-08-27

User reported that Build204 still visibly hitches and explicitly reproduced the same problem on the library 3×3 page as well as Home poster-heavy scrolling.

Latest recording lower-bound evidence (30 fps):

- around **5.900 s**: tracked vertical motion approximately **-1.56 px → 0 px → -10.33 px**;
- around **7.133 s**: approximately **-1.99 px → 0 px → -20.27 px**;
- both are the same stop-recorded-frame → catch-up-next-frame signature seen before.

Conclusion: Build204's ordinary-poster no-op subscriber removal and warm-cache first-body seeding are not the main cross-page root cause. Build204 is **real-device tested and rejected for smoothness**, not stable.

## Build206 — diagnostic-only candidate

Identity：**OnePlayer 0.14.39 / Build206**。

Exact diagnostic source：`351c62694ac25404c2bd4eb36a03314dd58ffed2`。

Build206 deliberately does not attempt another speculative rendering fix. It adds only a low-noise shared poster hitch diagnostic:

- one `CADisplayLink` exists only while poster cells are visible;
- normal frames produce no log;
- only a main display interval **≥30 ms** writes `PosterScrollHitch`;
- the hitch record includes the nearest poster-cell appearance, image commit and grid load-ahead timestamps/identifiers;
- existing diagnostics export UI is reused; no new logging screen is added;
- scrolling, navigation, image policy, carousel ownership and all P0 playback/transport/cache/session paths are unchanged.

### Build206 CI / IPA evidence

- exact-source run/job：**`33000992493` / `98282482225` — success**；
- source contract / exact five-file scope / Frozen / carousel-owner guards：passed；
- Xcode 16.4 Release build：passed；
- artifact：`OnePlayer-0.14.39-build206-poster-hitch-diagnostics`；artifact ID **`9618646972`**；
- artifact digest：`sha256:eb780276e88fcd6ce41df5e962168dec5976913a0f9e9a829350efc89ea29dbe`；
- independently downloaded IPA SHA-256：**`ee981133777c316305c4890aaa1a99b8906792783cad1496d880bf786611e18c`**；
- source ZIP SHA-256：**`68fcde68a4fbf157bfe50a3ae5957e67e6664c461c067132d8d33f73553239ab`**；
- IPA ZIP integrity：passed；build log contains `** BUILD SUCCEEDED **`；
- bundle/version/build：`com.embyplayerlab.app`, OnePlayer **0.14.39 (206)**；
- `MinimumOSVersion=15.0` and MinOS audit：passed。

Evidence level：**Code written ✅ / exact scope+Frozen guard ✅ / CI passed ✅ / IPA produced+verified ✅ / real-device diagnostic capture pending / not stable.**

'''
          s = Path(path).read_text(encoding='utf-8')
          if s.count(insert_anchor) != 1 or '## Build206 — diagnostic-only candidate' in s:
              raise SystemExit('checkpoint insertion anchor mismatch or Build206 section already present')
          Path(path).write_text(s.replace(insert_anchor, insertion + insert_anchor, 1), encoding='utf-8')

          old = '''## Validation state

- Build202 existing-problem / rejection recording：✅
- Build202 CI / IPA：✅
- Build202 target-device smoothness：❌ rejected
- Build204 code written：✅
- Build204 exact scoped diff / source contract：✅
- Build204 CI passed：✅
- Build204 IPA produced + independently verified：✅
- Build204 real-device：❌ pending
- Stable：❌

## Next exact action

1. Install/test Build204 on the target device using the same Home poster-row scroll path first, especially while lower poster rows enter the viewport。
2. Repeat library 3×3, favorites/more, search, tag search and actor/person results。
3. If Build204 still shows the same stop/catch-up event, do **not** immediately rewrite NavigationLink or lazy containers. Obtain new evidence for the next synchronous cell-entry/layout/compositing cost first。
4. Acceptance requires the user to report materially smoother continuous scrolling; CI/IPA alone cannot close the task。
'''
          new = '''## Validation state

- Build202 target-device smoothness：❌ rejected
- Build204 code / scope / CI / IPA：✅
- Build204 target-device smoothness：❌ rejected on Home + library 3×3
- Build206 code / exact diagnostic scope：✅
- Build206 CI passed：✅
- Build206 IPA produced + independently verified：✅
- Build206 real-device diagnostic capture：❌ pending
- Stable：❌

## Next exact action

1. Install Build206 on iPhone 15 Pro Max / iOS 17.0 and reproduce the hitch on Home poster-heavy scrolling and library 3×3 first; favorites/more, search, tag search and actor/person results can follow if needed.
2. Immediately after reproduction, use the existing **“导出播放日志”** action and collect the diagnostics containing `PosterScrollHitch`.
3. Correlate each ≥30 ms display gap with the recorded nearest cell-appear / image-commit / grid-load-ahead event before changing code again.
4. Do not claim Build206 improves smoothness; it is a diagnostic baseline only. A subsequent fix still requires separate CI/IPA and target-device acceptance.
'''
          replace_once(path, old, new)

          for p in ['docs/project/MODULE_STATUS.md','docs/project/BUILD_TEST_INDEX.md','docs/project/current/dev/DEV-poster-grid-smoothness.md']:
              if Path(p).read_text(encoding='utf-8').count('ee981133777c316305c4890aaa1a99b8906792783cad1496d880bf786611e18c') != 1:
                  raise SystemExit(f'{p}: Build206 IPA evidence missing/duplicated')
          PY
          git diff --check
          git diff -- docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/current/dev/DEV-poster-grid-smoothness.md

      - name: Commit synced authority docs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/current/dev/DEV-poster-grid-smoothness.md
          git commit -m "Docs: record Build204 rejection and Build206 diagnostic IPA"
          git push origin HEAD:main
