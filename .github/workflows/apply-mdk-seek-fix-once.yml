name: Apply MDK Seek Fix Once

on:
  push:
    branches: [feat/mdk-engine-lab]
    paths:
      - ".github/workflows/apply-mdk-seek-fix-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/mdk-engine-lab
          fetch-depth: 0

      - name: Apply reviewed patch
        run: |
          set -euo pipefail
          git apply --check scripts/mdk-seek-fix-once.patch
          git apply scripts/mdk-seek-fix-once.patch
          git diff --check

      - name: Validate patched Swift and contracts
        run: |
          set -euo pipefail
          xcrun swiftc -frontend -parse Sources/Transport/UnifiedMediaTransportSession.swift
          xcrun swiftc -frontend -parse MDKLab/App/MDKKSAVIOPlayerEngine.swift
          python3 - <<'PY'
          from pathlib import Path
          engine = Path('MDKLab/App/MDKKSAVIOPlayerEngine.swift').read_text()
          transport = Path('Sources/Transport/UnifiedMediaTransportSession.swift').read_text()
          checks = {
              '500ms MDK seek buffering grace': 'seekBufferingUIGraceSeconds: TimeInterval = 0.5' in engine and 'MDKBuffering' in engine,
              '2s MDK seek watchdog': 'seekWatchdogSeconds: TimeInterval = 2.0' in engine and 'MDKSeekWatchdog' in engine,
              'seek generation guards stale callbacks': 'pending.id == seekID' in engine,
              'concrete EOF metadata stays metadata': 'isConcreteTailMetadataRead' in transport and 'concrete-tail-metadata' in transport and 'blocked-tail-metadata' in transport,
              'real near-end user seek remains playback': 'duration * 0.97' in transport and 'duration - position <= 30' in transport,
          }
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL'), name)
              if not ok: raise SystemExit(name)
          PY

      - name: Commit source fix and remove one-shot files
        run: |
          set -euo pipefail
          rm -f scripts/mdk-seek-fix-once.patch .github/workflows/apply-mdk-seek-fix-once.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: harden MDK cached seek transport"
          git push origin HEAD:feat/mdk-engine-lab
