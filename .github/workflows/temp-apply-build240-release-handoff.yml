name: TEMP Apply Build240 Carousel Release Handoff

on:
  push:
    branches: [diag/home-carousel-release-handoff-build240]
    paths: [.github/build240-apply-trigger.txt]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/home-carousel-release-handoff-build240
      - run: python3 scripts/temp_apply_build240_release_handoff.py
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Sources/Core/AppIdentity.swift Sources/UI/EmbyHomeCarouselCadenceDiagnosticsV3.swift Sources/UI/EmbyHomeCarouselInteractionV3.swift docs/changelog/CHANGELOG_v0_14_73_build240.md
          git commit -m "Diag: measure carousel release handoff Build240"
          git push origin HEAD:diag/home-carousel-release-handoff-build240
