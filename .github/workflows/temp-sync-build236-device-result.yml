name: TEMP Sync Build236 Device Result

on:
  push:
    branches: [perf/home-carousel-post-acquisition-baseline-build236]
    paths: [.github/build236-device-result-trigger.txt]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build236 branch
        uses: actions/checkout@v4
        with:
          ref: perf/home-carousel-post-acquisition-baseline-build236
          fetch-depth: 0
      - name: Update feature checkpoint
        run: |
          python3 scripts/temp_sync_build236_device_result.py branch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          git diff --cached --quiet || git commit -m "Docs: record Build236 target-device result"
          git push origin HEAD:perf/home-carousel-post-acquisition-baseline-build236
      - name: Sync authoritative project docs to main
        run: |
          cp scripts/temp_sync_build236_device_result.py /tmp/temp_sync_build236_device_result.py
          git fetch origin main
          git checkout -B main origin/main
          python3 /tmp/temp_sync_build236_device_result.py main
          git add docs/project/PROJECT_STATE.md docs/project/MODULE_STATUS.md docs/project/TECHNICAL_DECISIONS.md docs/project/BUILD_TEST_INDEX.md docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          git diff --cached --quiet || git commit -m "Docs: sync Build236 target-device result"
          git push origin main
