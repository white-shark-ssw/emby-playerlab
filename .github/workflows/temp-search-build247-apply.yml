name: Temp Search Build247 Apply

on:
  push:
    branches: ["feat/search-page-optimization"]
    paths:
      - ".github/search-build247-apply-trigger.txt"

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-page-optimization
          fetch-depth: 0
      - name: Apply Search Build247 patch
        run: |
          set -euo pipefail
          python3 .github/search-build247-apply.py
          swiftc -parse Sources/UI/EmbySearchExperienceV3.swift
          swiftc -parse Sources/UI/EmbySearchRecommendationPreloader.swift
          swiftc -parse Sources/UI/EmbyServerRootViewV3.swift
          swiftc -parse Sources/App/RootView.swift
          git diff --check
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add Sources/UI/EmbySearchExperienceV3.swift
          git commit -m "Search Build247 preload and fixed Dock owner"
          git push origin HEAD:feat/search-page-optimization
