name: TEMP Sync Build270 Carousel Evidence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, 'TEMP sync Build270 carousel evidence')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync Build269 and Build270 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          module = Path('docs/project/MODULE_STATUS.md')
          lines = module.read_text().splitlines()
          replacement = '| Home carousel interaction | **Active — Build269 blur A/B rejected; Build270 CI/IPA verified, target-device pending** | Build265 / 0.14.98 exact source `af92164890e7dc1c869bd586577b39177335df5f` is the normal-behavior baseline: rapid-swipe takeover is functional, but the user reports the system FPS HUD without screen recording peaks only around ~90 FPS. Screen recording can raise the observed HUD to 120, so recording-state 120 and `CADisplayLink` callback intervals are not acceptance evidence for final presented FPS. Build269 / 0.15.2 exact source `28d09e1cf7b3932e9033c370df12026889033197` disabled only the persistent full-screen real-time blur; target-device no-recording max remained ~90, rejecting blur30 as the primary limiter. Build270 / 0.15.3 exact source `cee2031aa7dc2abb59fb371196e22fbce56e32ee` instead reduces foreground title/logo/metadata residency from all up-to-6 carousel pages to the existing current/previous/next window while retaining the Build231 per-page `compositingGroup()`, blur30 and all Build265 interaction/image behavior. CI run/job `33327653253 / 99300535892`; artifact `9736735731`; IPA SHA `169fb53bd3012c7b864912638f9f627e68282b3f6fb2dd18be58e48edca56b8d`; source ZIP SHA `f586270e852d09623cf5af38d6cd3b8bbaea85d4b8475bc4512e6a816f4ef98a`; MinOS 15.0. Build270 is Code/CI/IPA verified, real-device pending, not stable. |'
          found = False
          for i, line in enumerate(lines):
              if line.startswith('| Home carousel interaction |'):
                  lines[i] = replacement
                  found = True
                  break
          if not found: raise SystemExit('Home carousel module row not found')
          module.write_text('\n'.join(lines) + '\n')

          index = Path('docs/project/BUILD_TEST_INDEX.md')
          lines = index.read_text().splitlines()
          build265 = '| **Build265 / 0.14.98** | Home-carousel decoded-image analysis dedupe | **Target-device tested; rapid-swipe path remains functional, but no-screen-recording presentation still peaks around ~90 FPS; not stable.** Exact source `af92164890e7dc1c869bd586577b39177335df5f`; run/job `33318027714 / 99274932594`; artifact `9734083764`; IPA SHA `cf381c823e863562b1f21d40d61926e693b76fac3ba4d5023e7ce2c154ffa100`; MinOS 15.0. The system FPS HUD can climb to 120 only after screen recording is enabled, while carousel `CADisplayLink` callbacks are already around 8.4–9 ms, so callback cadence / recording-state 120 are no longer treated as final presented-FPS acceptance evidence. PR #274 closed without merge. |'
          build269 = '| **Build269 / 0.15.2** | Persistent full-screen blur30 isolation A/B | **Target-device tested; blur-primary hypothesis rejected; diagnostic-only.** Exact product source `28d09e1cf7b3932e9033c370df12026889033197`; corrected CI run/job `33324520023 / 99292189686`; artifact `9735866507`; artifact ZIP SHA `0ef920811a06f762d7544e001c4d05628ce9f58e09ae9df81b6fa578f2e22d18`; IPA SHA `89ff7b1be43f7cefccfe9a4e5d32bab64ed45a4d9543c54ba8905200de3c1b8f`; MinOS 15.0. Removing only persistent `.blur(radius: 30)` left the no-recording system FPS HUD maximum around ~90, same as Build265. Do not inherit blur-off behavior or continue blur-specific tuning from this result. |'
          build270 = '| **Build270 / 0.15.3** | Carousel foreground residency A/B | **Exact-source CI/IPA verified; target-device pending; not stable.** Exact product source `cee2031aa7dc2abb59fb371196e22fbce56e32ee`; relative Build265 only AppIdentity and one foreground enumeration change: up-to-6 mounted foreground pages → existing current/previous/next resident window. Build231 `.compositingGroup()`, blur30, rapid-swipe ownership, 500/0.28 gates and all P0/Frozen paths remain unchanged. Run/job `33327653253 / 99300535892`; artifact `9736735731`; artifact digest `sha256:3a8ab81ccce3b4e6fc10928b829bad053a5060c3130c5ceced9398f85af4ad2b`; IPA SHA `169fb53bd3012c7b864912638f9f627e68282b3f6fb2dd18be58e48edca56b8d`; source ZIP SHA `f586270e852d09623cf5af38d6cd3b8bbaea85d4b8475bc4512e6a816f4ef98a`; MinOS 15.0. Test controlling FPS without screen recording. |'
          out = []
          inserted = False
          saw265 = False
          for line in lines:
              if line.startswith('| **Build265 / 0.14.98**'):
                  out.append(build265)
                  saw265 = True
                  if not any(x.startswith('| **Build269 / 0.15.2**') for x in lines): out.append(build269)
                  if not any(x.startswith('| **Build270 / 0.15.3**') for x in lines): out.append(build270)
                  inserted = True
              elif line.startswith('| **Build269 / 0.15.2**'):
                  out.append(build269)
              elif line.startswith('| **Build270 / 0.15.3**'):
                  out.append(build270)
              else:
                  out.append(line)
          if not saw265: raise SystemExit('Build265 index row not found')
          index.write_text('\n'.join(out) + '\n')

          tech = Path('docs/project/TECHNICAL_DECISIONS.md')
          text = tech.read_text()
          marker = '## Home carousel presented-FPS control and blur A/B — 2026-08-31'
          if marker not in text:
              text += '''\n## Home carousel presented-FPS control and blur A/B — 2026-08-31\n\nTarget-device system FPS HUD **without screen recording** is the controlling presentation-cadence condition for the current carousel performance work. The user reports Build265 peaks only around ~90 FPS without recording, while enabling screen recording can make the same HUD climb to 120. At the same time `HomeCarouselCadence` can report ~8.4–9 ms `CADisplayLink` callback intervals before the HUD reaches 120. Therefore `CADisplayLink` callback cadence is main-run-loop callback evidence, not direct proof of final compositor/screen presented FPS, and screen-recording 120 must not be used as acceptance evidence.\n\nBuild269 directly removed only the persistent full-screen real-time `.blur(radius: 30)` while preserving Build265 interaction/presentation structure. On iPhone 15 Pro Max / iOS 17.0, the no-recording system FPS HUD still topped out around ~90 FPS. This rejects real-time blur30 as the **primary** limiter; it does not prove blur has zero cost. Do not continue blur-specific surgery or inherit Build269 blur-off behavior.\n\nExact Build265 source shows clear Hero artwork already uses current/previous/next residency while foreground title/logo/metadata mounts all up-to-6 carousel pages, each with the retained Build231 `.compositingGroup()`. Every interactive target is the immediate neighbor of the settled current page, including rapid settle takeover. Build270 therefore tests the narrower compositor hypothesis by mounting foreground only in the same current/previous/next window while retaining the proven per-page compositing group, blur30 and all interaction contracts. If Build270 does not materially raise the no-recording FPS ceiling, reject foreground residency as the primary limiter rather than stacking speculative optimizations.\n'''
              tech.write_text(text)

          state = Path('docs/project/PROJECT_STATE.md')
          text = state.read_text()
          marker = '## Active correction: Home carousel presented performance — Build269 / Build270'
          if marker not in text:
              text += '''\n## Active correction: Home carousel presented performance — Build269 / Build270\n\nThe Home-carousel whole task is active for presentation performance even though Build241 remains the merged interaction/presentation foundation. Current target-device control is the system FPS HUD **without screen recording**: Build265 peaks around ~90 FPS in that condition; screen recording can itself lift the HUD to 120, so recording-state 120 and raw `CADisplayLink` callback cadence are not acceptance evidence for final presented FPS.\n\nBuild269 / 0.15.2 target-device A/B removed only persistent full-screen blur30 and still peaked around ~90 FPS without recording, rejecting blur30 as the primary limiter. Build269 remains diagnostic-only and its blur-off appearance is not inherited. Build270 / 0.15.3 exact source `cee2031aa7dc2abb59fb371196e22fbce56e32ee` instead limits foreground title/logo/metadata residency to current/previous/next while retaining Build231 per-page `compositingGroup()`, normal blur30 and all Build265 rapid-swipe/image behavior. Run/job `33327653253 / 99300535892` passed; artifact `9736735731`; IPA SHA `169fb53bd3012c7b864912638f9f627e68282b3f6fb2dd18be58e48edca56b8d`; MinOS 15.0. Evidence is Code written / CI passed / IPA produced+independently verified; target-device pending; not stable.\n'''
              state.write_text(text)

          checkpoint = Path('docs/project/current/dev/DEV-home-carousel-drag-smoothness.md')
          text = checkpoint.read_text()
          text = text.replace('Build270 / 0.15.3 is now the next single-variable foreground-residency diagnostic from exact Build265 behavior; code written, CI/IPA pending.', 'Build270 / 0.15.3 is the current single-variable foreground-residency diagnostic from exact Build265 behavior; exact-source CI/IPA passed and independent artifact verification passed; target-device pending.')
          text = text.replace('- **Current candidate:** OnePlayer `0.15.3 (270)` — foreground-residency diagnostic; CI/IPA pending.', '- **Current candidate:** OnePlayer `0.15.3 (270)` — foreground-residency diagnostic; CI/IPA verified, target-device pending.')
          text = text.replace('- Build270 CI passed: ❌ pending.\n- Build270 IPA produced: ❌ pending.', '- Build270 CI passed: ✅ run/job `33327653253 / 99300535892`.\n- Build270 IPA produced: ✅ artifact `9736735731`; digest `sha256:3a8ab81ccce3b4e6fc10928b829bad053a5060c3130c5ceced9398f85af4ad2b`; IPA SHA `169fb53bd3012c7b864912638f9f627e68282b3f6fb2dd18be58e48edca56b8d`; source ZIP SHA `f586270e852d09623cf5af38d6cd3b8bbaea85d4b8475bc4512e6a816f4ef98a`; Info.plist `0.15.3 (270)`, MinOS 15.0; unzip clean.')
          text = text.replace('Run exact-source CI/IPA for Build270 / `0.15.3 (270)`, verify the tested source remains `cee2031aa7dc2abb59fb371196e22fbce56e32ee`, validate bundle/version/build/MinOS and package hashes, then hand off for a **no-screen-recording** system-FPS-HUD A/B versus Build265.', 'Hand off Build270 / `0.15.3 (270)` for a **no-screen-recording** system-FPS-HUD A/B versus Build265. Exact tested product source is `cee2031aa7dc2abb59fb371196e22fbce56e32ee`; CI/IPA identity and hashes are verified. If the ~90 ceiling does not materially move, reject the foreground-residency hypothesis and switch direction again rather than stacking speculative optimizations.')
          checkpoint.write_text(text)
          PY
          git diff --check
          rm .github/workflows/temp-sync-build270-carousel-evidence.yml

      - name: Commit synchronized project evidence and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add -A
          git commit -m 'docs: record Build269 result and Build270 test package'
          git push origin HEAD:main
