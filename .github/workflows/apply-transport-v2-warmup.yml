name: Apply Transport v2 Warmup Refinement

on:
  push:
    branches: [chatgpt/v0.10.0-transport-v2]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.10.0-transport-v2
      - name: Apply warmup refinement
        run: |
          set -euo pipefail
          python3 scripts/fix_transport_v2_warmup.py
          if git diff --quiet; then
            echo "Warmup refinement already applied"
            exit 0
          fi
          git config user.name "ChatGPT CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources/Cache/KTVCachePlaybackSession.swift
          git commit -m "Defer Transport v2 dual warmup across foreground priority"
          git push origin HEAD:chatgpt/v0.10.0-transport-v2
