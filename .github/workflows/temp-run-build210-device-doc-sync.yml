name: One-shot run Build210 device docs sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-run-build210-device-doc-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Apply Build210 target-device docs
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 scripts/temp_sync_build210_device_evidence.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/current/dev/DEV-poster-grid-smoothness.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md
          git commit -m "Record Build210 target-device diagnostic result"
          git push origin HEAD:main
