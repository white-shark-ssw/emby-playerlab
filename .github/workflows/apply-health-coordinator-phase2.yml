name: Apply Health Coordinator Phase2

on:
  pull_request:
    branches: [ci/mdk-seek-audio-ui-0.13.51]
    paths:
      - "scripts/migrate_flat_health_coordinator_phase2.py"
      - ".github/workflows/apply-health-coordinator-phase2.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply health coordinator phase2
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/migrate_flat_health_coordinator_phase2.py
          python3 scripts/migrate_flat_health_coordinator_phase2.py
          git diff --check
          grep -Fq 'private let healthCoordinator = MDKPlaybackHealthCoordinator()' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'authority=health-coordinator' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          test "$(grep -Fo 'quarantineCurrentGeneration(' MDKLab/App/MDKKSAVIOPlayerEngine.swift | wc -l | tr -d ' ')" = "2"
          ! grep -Fq 'MDKSeekPreempt' MDKLab/App/MDKKSAVIOPlayerEngine.swift

      - name: Commit migrated source
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add -- MDKLab/App/MDKKSAVIOPlayerEngine.swift
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: centralize MDK fallback health ownership"
          git push origin "HEAD:${HEAD_BRANCH}"
