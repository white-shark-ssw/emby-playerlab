name: TEMP Sync Build234 Device Result

on:
  push:
    branches: [diag/home-carousel-acquisition-coalesced-diagnostics-build234]
    paths:
      - ".github/build234-device-result-trigger.txt"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build234 branch
        uses: actions/checkout@v4
        with:
          ref: diag/home-carousel-acquisition-coalesced-diagnostics-build234
          fetch-depth: 0
          persist-credentials: true

      - name: Update feature checkpoint
        run: |
          set -euo pipefail
          git fetch origin main
          python3 scripts/temp_sync_build234_docs.py branch
          python3 scripts/temp_sync_build234_device_result.py branch
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          if ! git diff --cached --quiet; then
            git commit -m "Docs: record Build234 target-device diagnosis"
            git push origin HEAD:diag/home-carousel-acquisition-coalesced-diagnostics-build234
          fi

      - name: Sync authoritative project docs to main
        run: |
          set -euo pipefail
          cp scripts/temp_sync_build234_docs.py /tmp/temp_sync_build234_docs.py
          cp scripts/temp_sync_build234_device_result.py /tmp/temp_sync_build234_device_result.py
          git fetch origin main diag/home-carousel-acquisition-coalesced-diagnostics-build234
          git checkout -B main origin/main
          python3 /tmp/temp_sync_build234_docs.py main
          python3 /tmp/temp_sync_build234_device_result.py main
          git diff --check
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md
          if ! git diff --cached --quiet; then
            git commit -m "Docs: sync carousel Build234 device diagnosis [skip ci]"
            git push origin HEAD:main
          fi
