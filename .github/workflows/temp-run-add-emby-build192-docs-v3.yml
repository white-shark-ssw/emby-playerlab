name: Run Corrected Build192 Docs Sync

on:
  push:
    branches: [feat/add-emby-page-optimization]

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature helper
        uses: actions/checkout@v4
        with:
          ref: feat/add-emby-page-optimization
          fetch-depth: 0

      - name: Extract corrected docs update script
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/temp-sync-add-emby-build192-docs.yml').read_text()
          start_marker = "      - name: Update authoritative project docs\n        run: |\n"
          end_marker = "\n      - name: Guard main and commit docs\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          old = 'text = text.rstrip() + "\\n\\n" + section'
          new = 'text = text.rstrip() + "\\n\\n" + section.rstrip() + "\\n"'
          if old not in script:
              raise SystemExit('TECHNICAL_DECISIONS newline anchor missing')
          script = script.replace(old, new, 1)
          Path('/tmp/update-build192-docs.sh').write_text(script)
          PY
          chmod +x /tmp/update-build192-docs.sh

      - name: Checkout latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rev-parse HEAD

      - name: Apply Build192 docs update
        run: /tmp/update-build192-docs.sh

      - name: Guard main and commit docs
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "::error::main advanced during docs update; refusing to overwrite"; exit 1; }
          git config user.name "OnePlayer CI"
          git config user.email "actions@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/MODULE_STATUS.md docs/project/current/dev/DEV-add-emby-page-optimization.md
          git commit -m "Record Build192 Add Emby candidate"
          git push origin HEAD:main
