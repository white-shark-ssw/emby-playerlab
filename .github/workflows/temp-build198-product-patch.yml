name: Temp Build198 Carousel Product Patch

on:
  push:
    branches: [perf/home-carousel-single-owner-build198]
    paths:
      - ".github/workflows/temp-build198-product-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Build198 single-owner integration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              'Sources/UI/EmbyHomeCarouselInteractionV3.swift',
              'import SwiftUI\nimport UIKit\n',
              'import SwiftUI\nimport Combine\nimport UIKit\n'
          )

          replace(
              'Sources/Core/AppIdentity.swift',
              'static let sourceVersion = "0.14.28"\n    static let version = Bundle.main.object(forInfoDictionaryKey: "CFBundleShortVersionString") as? String ?? "0.14.28"',
              'static let sourceVersion = "0.14.31"\n    static let version = Bundle.main.object(forInfoDictionaryKey: "CFBundleShortVersionString") as? String ?? "0.14.31"'
          )

          replace(
              'Sources/UI/EmbyHomeCoreV3.swift',
              '''    @State var currentCarouselItemID: String?\n    @State var transitionFromID: String?\n    @State var transitionToID: String?\n    @State var transitionProgress: CGFloat = 0\n    @State var transitionDirection = 1\n    @State var isCarouselDragging = false\n    @State var carouselLastSettledAt = Date()''',
              '''    @State var currentCarouselItemID: String?\n    @State var carouselTransitionState = V3HomeCarouselTransitionState()\n    @State var carouselLastSettledAt = Date()'''
          )
          replace(
              'Sources/UI/EmbyHomeCoreV3.swift',
              '    @State var carouselTapSuppressedUntil = Date.distantPast\n',
              ''
          )
          replace(
              'Sources/UI/EmbyHomeCoreV3.swift',
              '''                    if immersive { persistentCarouselBackdrop(size: CGSize(width: geometry.size.width, height: geometry.size.height + geometry.safeAreaInsets.bottom)) }\n                    else { Color(uiColor: .systemBackground).ignoresSafeArea() }''',
              '''                    if immersive {\n                        V3HomeCarouselTransitionScope(state: carouselTransitionState) {\n                            persistentCarouselBackdrop(size: CGSize(width: geometry.size.width, height: geometry.size.height + geometry.safeAreaInsets.bottom))\n                        }\n                    } else {\n                        Color(uiColor: .systemBackground).ignoresSafeArea()\n                    }'''
          )
          replace(
              'Sources/UI/EmbyHomeCoreV3.swift',
              '                        if immersive { V3HomeHeroScrollScope(state: heroScrollState) { immersiveCarouselHero(width: width, viewportHeight: viewportHeight) } }\n',
              '''                        if immersive {\n                            V3HomeHeroScrollScope(state: heroScrollState) {\n                                V3HomeCarouselTransitionScope(state: carouselTransitionState) {\n                                    immersiveCarouselHero(width: width, viewportHeight: viewportHeight)\n                                }\n                            }\n                        }\n'''
          )

          state_path = Path('Sources/UI/EmbyHomeCarouselStateV3.swift')
          state = state_path.read_text()
          start = state.index('    func carouselDragGesture(width: CGFloat) -> some Gesture {')
          end = state.index('\n    func suppressCarouselTap()', start)
          accessors = '''    var transitionFromID: String? {\n        get { carouselTransitionState.fromID }\n        nonmutating set { carouselTransitionState.fromID = newValue }\n    }\n\n    var transitionToID: String? {\n        get { carouselTransitionState.toID }\n        nonmutating set { carouselTransitionState.toID = newValue }\n    }\n\n    var transitionProgress: CGFloat {\n        get { carouselTransitionState.progress }\n        nonmutating set { carouselTransitionState.progress = newValue }\n    }\n\n    var transitionDirection: Int {\n        get { carouselTransitionState.direction }\n        nonmutating set { carouselTransitionState.direction = newValue }\n    }\n\n    var isCarouselDragging: Bool {\n        get { carouselTransitionState.isDragging }\n        nonmutating set { carouselTransitionState.isDragging = newValue }\n    }\n\n    var carouselTapSuppressedUntil: Date {\n        get { carouselTransitionState.tapSuppressedUntil }\n        nonmutating set { carouselTransitionState.tapSuppressedUntil = newValue }\n    }\n'''
          state = state[:start] + accessors + state[end:]
          old_blend = '''    func carouselBackdropBlendProgress(_ rawProgress: CGFloat) -> CGFloat {\n        let raw = min(1, max(0, rawProgress))\n        let delayed = min(1, max(0, (raw - 0.08) / 0.92))\n        return delayed * delayed * (3 - 2 * delayed)\n    }'''
          new_blend = '''    func carouselBackdropBlendProgress(_ rawProgress: CGFloat) -> CGFloat { min(1, max(0, rawProgress)) }'''
          if old_blend not in state:
              raise SystemExit('missing old carouselBackdropBlendProgress')
          state_path.write_text(state.replace(old_blend, new_blend, 1))

          replace(
              'Sources/UI/EmbyHomeHeroV3.swift',
              '''        .frame(width: width, height: baseHeight)\n        .contentShape(Rectangle())\n        .onTapGesture { openCurrentCarouselDetailIfAllowed() }\n        .simultaneousGesture(carouselDragGesture(width: width))''',
              '''        .frame(width: width, height: baseHeight)\n        .overlay {\n            V3HomeCarouselInteractionSurface(\n                shouldBeginHorizontal: { translation in shouldBeginNativeCarouselDrag(translation) },\n                onHorizontalChanged: { translation in handleNativeCarouselDrag(translation, width: width) },\n                onHorizontalEnded: { translation, predictedTranslation in finishNativeCarouselDrag(translation, predictedTranslation: predictedTranslation, width: width) },\n                onHorizontalCancelled: { cancelNativeCarouselDrag() },\n                onTap: { openCurrentCarouselDetailIfAllowed() }\n            )\n        }'''
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Core/AppIdentity.swift Sources/UI/EmbyHomeCarouselInteractionV3.swift Sources/UI/EmbyHomeCoreV3.swift Sources/UI/EmbyHomeCarouselStateV3.swift Sources/UI/EmbyHomeHeroV3.swift
          git commit -m "Integrate Build198 single-owner carousel lifecycle"
          git push origin HEAD
