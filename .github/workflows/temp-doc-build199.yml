name: Sync Build199 Project Evidence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-doc-build199.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main and update project docs
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 <<'PY'
          from pathlib import Path
          import re

          checkpoint = Path('docs/project/current/dev/DEV-add-emby-page-optimization.md')
          checkpoint.write_text('''# DEV-add-emby-page-optimization

## Status

**Active — Build199 IPA produced / target-device validation pending**

- **Work ID**：`DEV-add-emby-page-optimization`
- **Routing aliases / keywords**：添加 Emby 页面 / 添加服务器 / Emby 服务器添加 / Add Emby / Add Server
- **Task**：重做 OnePlayer 的 Add/Edit Emby 页面，并实现一键粘贴、自动启动、iCloud 同步、同服多线路选优，以及用户最新要求的密码保留与 iCloud 跨设备同步。

## Current user acceptance contract

1. Add/Edit Emby 使用现代 iOS 卡片式 UI；保留服务器地址、用户名、密码；不恢复多余副标题/helper/安全说明。
2. 一键粘贴可解析服务器、账号、密码和多线路；新 parser 变化必须以真实样例为依据，禁止继续猜格式。
3. `自动启动` 在冷启动直接构造目标 Emby 根内容；已有 Home 快照/图片缓存时先显示缓存，再并行做同服线路选优和联网刷新；线路失败不得退回一级服务器页。
4. 同一 Emby 可配置多条入口；仅 Add/Edit 页面显示真实线路延迟/失败/不匹配/最快；其它页面和自动启动过程不显示测速数字。
5. 同服校验继续使用 Emby Server ID；运行时赢家成为当前 API `serverURL`，以保持 Home 图片磁盘缓存 host key 的命中连续性。
6. **密码必须保留并可在 Edit 页面查看/修改。** Build199 从 SessionStore 的密码 Keychain 读取后预填 Edit 密码框；眼睛按钮控制显示/隐藏。
7. **密码也必须随 `iCloud 同步` 跨设备同步。** Build199 将密码放在独立的本机 Keychain account，并在该服务器开启 iCloud 同步时写入独立 `kSecAttrSynchronizable` Keychain account；关闭 iCloud 同步移除 synchronizable 密码副本，删除服务器同时清理本机与 synchronizable 密码。
8. 密码不得写入 UserDefaults、普通服务器 JSON registry 或诊断日志；AccessToken 的既有本机 Keychain authority 不变。
9. 编辑时密码未改变不额外重新认证；改变密码时只对 stored username 重新认证，并要求同一 Server ID / User ID 后才替换 AccessToken 和保存新密码。
10. 多线路只改变 Emby API/server entry；媒体仍为 `Emby / STRM → 302 → 115/CDN → iPhone`，NAS 绝不承载媒体字节。
11. Deployment Target 保持 iOS 15.0；Player/PiP/UnifiedTransport/Cache/Seek/Resume/episode ordering 等 Frozen/P0 合同不变。

## Baseline / identity guard

- Accepted overall real-device runtime remains **OnePlayer 0.14.28 / Build195** on `main`; Build199 does not replace it before target-device acceptance.
- Working branch：`feat/add-emby-page-optimization`。
- Draft PR：**#256** — `Add modern Emby server editor and multi-route startup`。
- Exact Build199 source / current feature head：`2b5f3bef073754371443c6c7a345657dbfa2a09a`。
- PR #256 head was rechecked at the same exact SHA before build evidence was recorded.
- Parallel `DEV-home-carousel-drag-smoothness` owns **Build198 / 0.14.31** on a different branch; Build199 identity is unique to this Add Emby task.
- Current candidate：**OnePlayer 0.14.32 / Build199**。

## Source ownership / verified implementation

- `Sources/UI/ServerListView.swift` is the real Add/Edit owner. Edit receives `initialPassword: sessionStore.password(for:)`, initializes the password field with that value, exposes eye show/hide, and sends a password update only when the edited value actually differs from the initial value.
- `Sources/Session/SessionStore.swift` remains the single session/server-config owner. `persistPassword(...)` stores the password in a dedicated local Keychain account and conditionally mirrors it to a dedicated synchronizable Keychain account; `password(for:)` reads local first, then synchronizable. Server deletion removes both.
- `Sources/Core/KeychainStore.swift` keeps ordinary local secrets at `kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly`; synchronizable entries use `kSecAttrSynchronizable = true` with `kSecAttrAccessibleAfterFirstUnlock`.
- Existing cached-first auto-start, same-server multi-route selection, runtime winner persistence and Home/image cache ownership remain unchanged from the prior Add Emby implementation.
- No Player, PiP, UnifiedTransport, media Cache, Range/206, STRM/302/115 direct path, Resume or episode-order owner was changed for Build199.

## Build199 evidence

- Dedicated workflow：`Build199 Add Emby Password Sync`。
- Exact source：`2b5f3bef073754371443c6c7a345657dbfa2a09a`。
- GitHub Actions run：**`32942618979` — success**。
- Artifact：`OnePlayer-0.14.32-build199-add-emby-password-sync`。
- Artifact ID：**`9597143667`**。
- Artifact archive digest：`sha256:94d19775fc82d42232d1d5f3efe40b0f04719e599cb5cfb7317746490ca51972`。
- IPA：`OnePlayer-0.14.32-build199-add-emby-password-sync-unsigned.ipa`。
- IPA SHA-256：**`8f0f43f62705e5e13ae666cc54d32fd047c596df1d0e9335668b01a25b6eb003`**。
- Exact source ZIP SHA-256：`72b690f1f38898c3fdfa82834a06baa4cbb875cbc99b33c1c7b87eaf4848fe18`。
- App identity validation：**OnePlayer 0.14.32 (199) PASS**。
- App + main runtime Mach-O MinOS：**15.0 PASS**；required target-device ceiling remains iOS 17.0。
- Dedicated contract log：`Build199 accepted Build195 + Add Emby password sync/frozen contracts: OK`。
- Evidence level：**Code written / CI passed / IPA produced / real-device Build199 pending / not stable**。
- Same-head KSPlayer lab success is auxiliary only. Generic `Validate Source` and MDK lab failures are not Build199 acceptance authority and do not overturn the dedicated standard MPV success; no product/Frozen changes are justified by those unrelated checks.

## Prior task evidence retained

- Build192 / 0.14.25：real-device tested; modern editor direction and route diagnostics worked, but Edit password row was missing; not accepted.
- Build196 / 0.14.29：cached-first/password-action follow-up compiled and produced IPA on an older tree; later retired as a distributable baseline after tree identity review.
- Build197 / 0.14.30：Build191 accepted tree + Add Emby five-file changes; dedicated CI/IPA produced, but later user requirement superseded its empty Edit password semantics by requiring the password to remain visible/editable and sync through iCloud.

## Next exact action

1. Install **OnePlayer 0.14.32 / Build199** on iPhone 15 Pro Max / iOS 17.0.
2. Open Edit Server and verify the existing password is prefilled; eye button reveals/hides it; saving without changing the password does not unnecessarily reauthenticate.
3. Change to the correct password and verify token/password refresh succeeds; wrong or different-user credentials must fail without destroying the existing valid session.
4. With `iCloud 同步` ON, verify the password is available on a second device signed into the intended iCloud Keychain environment; this cross-device behavior is **not** proven by CI alone.
5. Toggle iCloud sync OFF and delete/re-add as needed to verify synchronizable password cleanup semantics.
6. Recheck cached-first auto-start under normal network and temporarily unreachable Emby; cached Home should remain available and online recovery should refresh through the winning route.
7. Recheck normal STRM/302 → 115/CDN playback remains iPhone client-direct; NAS must not relay media bytes.

## Rejected / do-not-repeat

- AppShell first renders, then fullScreenCover/quick-switches into Emby.
- Auto-start waits for best-route networking before constructing cached Home.
- Route failure dismisses a valid cached auto-start Home back to the first-level server list.
- Fake local-only iCloud toggle.
- Password stored in UserDefaults/plain configuration/ordinary sync registry/logs.
- Password field visible but ignored, or password always blank after the user explicitly required retention.
- Per-poster multi-route duplicate downloads.
- Background retry/timer/watchdog/reconciliation added without a concrete failure mode.
- NAS/media proxying as part of route aggregation.
- Reusing another Active task's Build/version identity.
''', encoding='utf-8')

          module = Path('docs/project/MODULE_STATUS.md')
          text = module.read_text(encoding='utf-8')
          lines = text.splitlines()
          replaced = False
          for i, line in enumerate(lines):
              if line.startswith('| Emby server management / multi-route |'):
                  lines[i] = '| Emby server management / multi-route | **Active Build199 candidate; IPA produced / device pending** | Build199 supersedes the earlier password-exclusion policy after the user explicitly required retained/editable passwords and iCloud cross-device password sync. SessionStore remains the owner: password is kept in a dedicated local Keychain item and, only when iCloud sync is enabled, a separate synchronizable Keychain item; Edit preloads it and unchanged saves avoid extra reauth. Cached-first auto-start and same-server route selection remain intact. Dedicated standard MPV Build199 run `32942618979` passed and IPA was produced; real-device/cross-device validation is pending. Frozen STRM/302/115 client-direct media path remains untouched. |'
                  replaced = True
              elif line.startswith('| Other product modules |'):
                  lines[i] = '| Other product modules | Active parallel work | Build195 / 0.14.28 remains the accepted overall runtime baseline on `main`. Build199 / 0.14.32 is the independent Add/Edit Emby password-sync candidate with dedicated CI/IPA complete and target-device validation pending. Home-carousel Build198 / 0.14.31 remains a separate Active task/identity. |'
          assert replaced, 'Emby module-status row not found'
          module.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          build_index = Path('docs/project/BUILD_TEST_INDEX.md')
          text = build_index.read_text(encoding='utf-8')
          build199_row = '| **Build199 / 0.14.32** | Add/Edit Emby retained password + iCloud password sync | Exact source `2b5f3bef073754371443c6c7a345657dbfa2a09a`. Dedicated Xcode 16.4 standard MPV workflow `Build199 Add Emby Password Sync`, run `32942618979`, passed; app identity 0.14.32 (199), app/runtime MinOS 15.0 and frozen-contract checks passed; artifact `OnePlayer-0.14.32-build199-add-emby-password-sync` ID `9597143667`; IPA SHA-256 `8f0f43f62705e5e13ae666cc54d32fd047c596df1d0e9335668b01a25b6eb003`. Password is retained in local Keychain and mirrored to a separate synchronizable Keychain item when iCloud sync is enabled; Edit preloads it. **Code written / CI passed / IPA produced / real-device + cross-device pending / not stable; Build195 remains accepted overall baseline.** |'
          if build199_row not in text:
              marker = '| **Build196 / 0.14.29** |'
              pos = text.find(marker)
              assert pos >= 0, 'Build196 row not found'
              line_end = text.find('\n', pos)
              assert line_end >= 0, 'Build196 row end not found'
              text = text[:line_end+1] + build199_row + '\n' + text[line_end+1:]
          text = text.replace('Build196 / 0.14.29 is the current Add/Edit Emby cached-first candidate with CI/IPA complete and real-device validation pending.', 'Build199 / 0.14.32 is the current Add/Edit Emby retained-password/iCloud-password-sync candidate with dedicated CI/IPA complete and real-device plus cross-device validation pending.')
          build_index.write_text(text, encoding='utf-8')

          tech = Path('docs/project/TECHNICAL_DECISIONS.md')
          text = tech.read_text(encoding='utf-8')
          old = '- Opt-in iCloud server sync uses a separate `kSecAttrSynchronizable` Keychain record. It may contain server configuration, AccessToken and auto-start flag; it must never contain the user\'s password. Existing local AccessToken storage keeps its prior `ThisDeviceOnly` accessibility contract.'
          new = '- Opt-in iCloud server sync continues to use `kSecAttrSynchronizable` Keychain storage, but **Build199 supersedes Build192\'s password-exclusion rule because the user explicitly requires retained/editable passwords and cross-device password sync**. Server configuration/AccessToken/auto-start stay in the existing synchronizable registry; the password uses a separate local Keychain account plus a separate synchronizable password account when that server has iCloud sync enabled. The password must not enter UserDefaults, the ordinary server JSON registry or diagnostics. Turning sync off removes the synchronizable password copy; deleting the server removes both local and synchronizable password items. Existing local AccessToken storage keeps its prior `ThisDeviceOnly` accessibility contract.'
          assert old in text, 'D014 old password decision not found'
          text = text.replace(old, new, 1)
          old_evidence = 'Build192 / OnePlayer 0.14.25 passed dedicated Xcode 16.4 standard MPV Release CI and produced an iOS 15.0-compatible IPA. This confirms implementation/build evidence only. Route behavior, root auto-start presentation and synchronizable Keychain behavior—especially cross-device behavior under TrollStore/ad-hoc signing—remain **real-device pending** and are not frozen.'
          new_evidence = old_evidence + '\n\nBuild199 / OnePlayer 0.14.32 adds the user-required password-retention/sync contract without changing D014\'s media boundary: Edit preloads `SessionStore.password(for:)`; `SessionStore.persistPassword(...)` writes a dedicated local Keychain item and conditionally a dedicated synchronizable Keychain item; unchanged Edit password does not force reauthentication, while changed password must authenticate the stored username and preserve Server ID/User ID. Dedicated standard MPV run `32942618979` succeeded from exact source `2b5f3bef073754371443c6c7a345657dbfa2a09a` and produced the Build199 IPA with MinOS 15.0. **This is Code written / CI passed / IPA produced only; password visibility/edit behavior and actual second-device iCloud propagation remain real-device pending.**'
          assert old_evidence in text, 'D014 evidence paragraph not found'
          text = text.replace(old_evidence, new_evidence, 1)
          tech.write_text(text, encoding='utf-8')

          state = Path('docs/project/PROJECT_STATE.md')
          text = state.read_text(encoding='utf-8')
          text = re.sub(r'^_Last updated.*_$', '_Last updated after the independent Add/Edit Emby task produced OnePlayer **0.14.32 / Build199** from exact source `2b5f3bef073754371443c6c7a345657dbfa2a09a`: dedicated standard MPV run `32942618979` passed, artifact/IPA were produced, and MinOS remains 15.0. Build199 implements the user-superseded password contract (retain/edit password locally and sync it through a separate synchronizable Keychain item when iCloud sync is enabled). **Build195 / 0.14.28 remains the latest real-device accepted overall baseline** until Build199 is tested on device. Home-carousel Build198 remains a separate Active candidate._', text, count=1, flags=re.M)
          start = text.find('### Build196 / OnePlayer 0.14.29 — Add/Edit Emby cached-first follow-up')
          end = text.find('### Build193 / OnePlayer 0.14.26 — home-carousel native movement + SwiftUI release ownership')
          assert start >= 0 and end > start, 'PROJECT_STATE Add Emby candidate section not found'
          section = '''### Build199 / OnePlayer 0.14.32 — Add/Edit Emby retained password + iCloud password sync\n\n`DEV-add-emby-page-optimization` remains Active.\n\n- latest user contract supersedes the old “password is never persisted/synced” rule: Edit must retain/show the existing password and `iCloud 同步` must include the password across devices\n- exact source / feature head: `2b5f3bef073754371443c6c7a345657dbfa2a09a`; draft PR #256 points to the same head\n- password owner remains SessionStore + Keychain: local password uses a dedicated ordinary Keychain account; iCloud-enabled servers also use a separate `kSecAttrSynchronizable` password account; password is not written into UserDefaults/plain server configuration/logs\n- Edit receives `sessionStore.password(for:)`, preloads the field, provides eye reveal/hide, and only sends a password update when the value changed; changed credentials must still match stored Server ID/User ID before token replacement\n- prior cached-first auto-start, same-server multi-route selection and runtime winner persistence remain unchanged; Player/Transport/Cache/PiP/P0 media contracts are untouched\n- dedicated standard MPV CI run: **`32942618979` — success**\n- artifact: `OnePlayer-0.14.32-build199-add-emby-password-sync`; ID `9597143667`; archive digest `sha256:94d19775fc82d42232d1d5f3efe40b0f04719e599cb5cfb7317746490ca51972`\n- IPA SHA-256: `8f0f43f62705e5e13ae666cc54d32fd047c596df1d0e9335668b01a25b6eb003`; source ZIP SHA-256: `72b690f1f38898c3fdfa82834a06baa4cbb875cbc99b33c1c7b87eaf4848fe18`\n- app identity: 0.14.32 (199); app/main runtime MinOS: 15.0\n- evidence level: **Code written / CI passed / IPA produced / real-device + second-device iCloud pending / not stable**\n\n'''
          text = text[:start] + section + text[end:]
          text = text.replace('Build196 / OnePlayer 0.14.29 remains the independent Add/Edit Emby cached-first/password candidate with CI/IPA evidence and target-device validation pending.', 'Build199 / OnePlayer 0.14.32 is the independent Add/Edit Emby retained-password/iCloud-password-sync candidate with dedicated CI/IPA evidence and target-device plus second-device iCloud validation pending.')
          text = text.replace('Build196 / 0.14.29 is the current Add/Edit Emby cached-first candidate with CI/IPA complete and real-device validation pending.', 'Build199 / 0.14.32 is the current Add/Edit Emby retained-password/iCloud-password-sync candidate with dedicated CI/IPA complete and real-device plus second-device iCloud validation pending.')
          state.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/temp-doc-build199.yml

      - name: Commit documentation evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/project/PROJECT_STATE.md docs/project/MODULE_STATUS.md docs/project/TECHNICAL_DECISIONS.md docs/project/BUILD_TEST_INDEX.md docs/project/current/dev/DEV-add-emby-page-optimization.md .github/workflows/temp-doc-build199.yml
          git diff --cached --check
          git commit -m "Record Build199 Add Emby IPA evidence"
          git push origin HEAD:main
