name: Sync Build199 Global Project Indexes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append Build199 superseding evidence
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          if ! grep -q 'Build199 superseding Add/Edit Emby update' docs/project/PROJECT_STATE.md; then
            printf '%s\n' '' '## Build199 superseding Add/Edit Emby update' '' '- OnePlayer **0.14.32 / Build199** is the current independent Add/Edit Emby candidate; exact source/feature head `2b5f3bef073754371443c6c7a345657dbfa2a09a`, draft PR #256.' '- Dedicated standard MPV run `32942618979` succeeded; artifact `OnePlayer-0.14.32-build199-add-emby-password-sync` ID `9597143667`; IPA SHA-256 `8f0f43f62705e5e13ae666cc54d32fd047c596df1d0e9335668b01a25b6eb003`; app/runtime MinOS 15.0.' '- This supersedes earlier Add/Edit candidate text that said password is never persisted/synced: the user now requires the existing password to remain editable/viewable and to sync across devices when `iCloud 同步` is enabled.' '- Build199 uses a dedicated local Keychain password item plus a separate synchronizable Keychain password item; password does not enter UserDefaults/plain server registry/diagnostic logs. Edit preloads `SessionStore.password(for:)`; unchanged password avoids extra reauthentication.' '- **Evidence: Code written / CI passed / IPA produced / real-device + second-device iCloud pending / not stable. Build195 / 0.14.28 remains the accepted overall real-device baseline until Build199 is accepted on device.**' '- Home-carousel Build198 / 0.14.31 remains a separate Active task and identity.' >> docs/project/PROJECT_STATE.md
          fi
          if ! grep -q 'Build199 supersedes the D014 password-exclusion rule' docs/project/TECHNICAL_DECISIONS.md; then
            printf '%s\n' '' '## Build199 superseding note for D014' '' '**Build199 supersedes the D014 password-exclusion rule** because the user explicitly requires retained/editable passwords and iCloud cross-device password sync.' '' '- SessionStore remains the credential owner.' '- The password is stored in a dedicated local Keychain account.' '- When a server has iCloud sync enabled, the password is also stored in a separate `kSecAttrSynchronizable` Keychain account; turning sync off removes that synchronizable password copy, and deleting the server removes both password items.' '- Password must not be written to UserDefaults, the ordinary server JSON registry, or diagnostics.' '- Edit preloads `SessionStore.password(for:)`; unchanged password does not force reauthentication; changed password must authenticate the stored username and preserve Server ID/User ID before token replacement.' '- This does not change the media boundary: `Emby / STRM → 302 → 115/CDN → iPhone`; NAS never relays media bytes.' '- Dedicated standard MPV run `32942618979` succeeded from exact source `2b5f3bef073754371443c6c7a345657dbfa2a09a`, producing OnePlayer 0.14.32 (199), MinOS 15.0.' '- **Evidence remains Code written / CI passed / IPA produced; password visibility/edit behavior and actual second-device iCloud propagation are real-device pending.**' >> docs/project/TECHNICAL_DECISIONS.md
          fi
          if ! grep -q 'Build199 / 0.14.32 — Add/Edit Emby retained password' docs/project/BUILD_TEST_INDEX.md; then
            printf '%s\n' '' '## Build199 / 0.14.32 — Add/Edit Emby retained password + iCloud password sync' '' '- exact source: `2b5f3bef073754371443c6c7a345657dbfa2a09a`' '- dedicated standard MPV run: `32942618979` — success' '- artifact: `OnePlayer-0.14.32-build199-add-emby-password-sync`; ID `9597143667`; archive digest `sha256:94d19775fc82d42232d1d5f3efe40b0f04719e599cb5cfb7317746490ca51972`' '- IPA SHA-256: `8f0f43f62705e5e13ae666cc54d32fd047c596df1d0e9335668b01a25b6eb003`' '- source ZIP SHA-256: `72b690f1f38898c3fdfa82834a06baa4cbb875cbc99b33c1c7b87eaf4848fe18`' '- app identity: OnePlayer 0.14.32 (199); app/main runtime MinOS 15.0' '- change: retain/edit password via local Keychain and sync password via separate synchronizable Keychain item when iCloud sync is enabled' '- result: **Code written / CI passed / IPA produced / real-device + cross-device pending / not stable; Build195 remains accepted overall baseline.**' >> docs/project/BUILD_TEST_INDEX.md
          fi
          rm .github/workflows/temp-doc-build199.yml
      - name: Commit project evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/BUILD_TEST_INDEX.md .github/workflows/temp-doc-build199.yml
          git diff --cached --check
          git commit -m 'Record Build199 global project evidence'
          git push origin HEAD:main
