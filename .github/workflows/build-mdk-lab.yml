name: Build184 Carousel Axis Acquisition IPA

on:
  workflow_dispatch:
  push:
    branches: [perf/home-carousel-drag-smoothness-build184]
    paths:
      - "Sources/**"
      - "Config/**"
      - "Resources/**"
      - "scripts/**"
      - "project.yml"
      - "Podfile"
      - "docs/changelog/CHANGELOG_v0_14_17_build184.md"
      - ".github/workflows/build-mdk-lab.yml"

permissions:
  contents: read

concurrency:
  group: build184-carousel-axis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build184 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Build184 carousel and inherited contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          accepted_base = "967b743c88d68b05205eb39f1de75cab41362e8b"
          build180 = "452ba27a661b4427471a975de99bb30e5e59a469"
          app = Path("Sources/Core/AppIdentity.swift").read_text()
          core = Path("Sources/UI/EmbyHomeCoreV3.swift").read_text()
          carousel = Path("Sources/UI/EmbyHomeCarouselStateV3.swift").read_text()
          hero = Path("Sources/UI/EmbyHomeHeroV3.swift").read_text()
          project = Path("project.yml").read_text()
          checks = {
              "Build184 source version": 'sourceVersion = "0.14.17"' in app,
              "iOS 15 deployment": 'iOS: "15.0"' in project and 'deploymentTarget: "15.0"' in project,
              "single carousel transition owner": 'final class V3HomeCarouselTransitionState: ObservableObject' in carousel and '@State var carouselTransitionState = V3HomeCarouselTransitionState()' in core,
              "root progress state removed": '@State var transitionProgress' not in core and '@State var transitionFromID' not in core and '@State var transitionToID' not in core,
              "zero-point drag delivery": 'DragGesture(minimumDistance: 0, coordinateSpace: .local)' in carousel,
              "one-time axis state": 'var dragAxis: V3HomeCarouselDragAxis?' in carousel,
              "sub-point initial acquisition": 'guard max(abs(horizontal), abs(vertical)) >= 0.5 else { return }' in carousel,
              "first-vector axis lock": 'carouselTransitionState.dragAxis = abs(horizontal) >= abs(vertical) ? .horizontal : .vertical' in carousel,
              "horizontal-only carousel ownership": 'guard carouselTransitionState.dragAxis == .horizontal else { return }' in carousel,
              "old 1.08 gate removed": 'abs(vertical) * 1.08' not in carousel,
              "old 4pt gate removed": 'abs(horizontal) > 4' not in carousel and 'minimumDistance: 4' not in carousel,
              "raw manual artwork progress": 'func carouselBackdropBlendProgress(_ rawProgress: CGFloat) -> CGFloat { min(1, max(0, rawProgress)) }' in carousel and '(raw - 0.08)' not in carousel,
              "foreground slide restored": 'if itemID == fromID { return -direction * progress * width }' in carousel and 'if itemID == toID { return direction * (1 - progress) * width }' in carousel,
              "foreground crossfade rejected": 'func carouselForegroundOffset(for itemID: String, width: CGFloat) -> CGFloat { 0 }' not in carousel,
              "existing commit threshold preserved": 'transitionProgress >= 0.28 || predicted >= width * 0.48' in carousel,
              "existing auto advance preserved": 'timeIntervalSince(carouselLastSettledAt) >= 6' in carousel and '.easeInOut(duration: 0.62)' in carousel,
              "persistent blur visual preserved": '.blur(radius: 30)' in hero,
          }
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL"), name)
              if not ok: raise SystemExit(f"::error::{name}")
          subprocess.run(["python3", "scripts/check_home_immersive_carousel.py"], check=True)
          subprocess.run(["python3", "scripts/check_scroll_performance.py"], check=True)
          subprocess.run(["python3", "scripts/check_series_episode_ordering.py"], check=True)

          allowed = {
              "Sources/Core/AppIdentity.swift",
              "Sources/UI/EmbyHomeCarouselStateV3.swift",
              "docs/changelog/CHANGELOG_v0_14_17_build184.md",
              "scripts/check_home_immersive_carousel.py",
              ".github/workflows/build-mdk-lab.yml",
          }
          changed = subprocess.run(["git", "diff", "--name-only", build180, "HEAD"], capture_output=True, text=True, check=True).stdout.splitlines()
          unexpected = [path for path in changed if path and path not in allowed]
          if unexpected: raise SystemExit(f"::error::unexpected Build184 delta vs Build180: {unexpected}")
          print("PASS Build184 delta limited to axis acquisition + identity/checks")

          frozen = [
              "Sources/Player/PlayerController.swift", "Sources/Player/MPVPlayerEngine.swift", "Sources/App/AppOrientationCoordinator.swift",
              "Sources/Player/PlayerSurfacePresentationGate.swift", "Sources/UI/MPVPlayerSurface.swift", "Sources/UI/PlayerPiPSessionCoordinator.swift",
              "Sources/UI/PlayerPiPSamplePipeline.swift", "Sources/UI/PlayerPiPInlineRendererAdapter.swift", "Sources/Transport/TransportSettings.swift",
              "Sources/Transport/UnifiedMediaTransportSession.swift", "Sources/Transport/RangeHTTPClient.swift", "Sources/UI/CacheSettingsView.swift",
              "Sources/UI/PlayerEpisodeSelection.swift", "Sources/UI/PlayerScreen.swift", "Sources/UI/PlayerControlPanelViews.swift",
              "Sources/UI/PlayerSettings.swift", "Sources/UI/PlayerSettingsView.swift", "Sources/Networking/EmbyAPIClient.swift",
          ]
          diff = subprocess.run(["git", "diff", "--name-only", accepted_base, "HEAD", "--", *frozen], capture_output=True, text=True, check=True).stdout.strip()
          if diff: raise SystemExit(f"::error::accepted/frozen files changed: {diff}")
          print("PASS Build176/178 inherited contracts and P0 frozen files unchanged")
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Release
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache MARKETING_VERSION=0.14.17 CURRENT_PROJECT_VERSION=184 IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build184.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-Build184-errors-${{ github.sha }}
          path: |
            build184.log
            package-resolution.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate and validate app
        if: success()
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id "com.embyplayerlab.app" --version "0.14.17" --build "184" --display-name "OnePlayer" --minimum-os "15.0" --primary-icon "OnePlayerIcon" --alternate-icon "OnePlayerAltIcon"

      - name: Validate MinOS
        if: success()
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" build184-min-os.log build184.log

      - name: Package unsigned IPA
        if: success()
        run: |
          set -euo pipefail
          rm -rf Payload && mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-0.14.17-build184-home-carousel-axis-acquisition-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          SOURCE_ZIP="OnePlayer-0.14.17-build184-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Upload Build184 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.17-build184-home-carousel-axis-acquisition
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            build184.log
            build184-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30
