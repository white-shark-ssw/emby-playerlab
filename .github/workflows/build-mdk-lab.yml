name: Build190 Carousel Native Release IPA

on:
  workflow_dispatch:
  push:
    branches: [fix/home-carousel-native-release-build190]
    paths:
      - "Sources/**"
      - "Config/**"
      - "Resources/**"
      - "scripts/**"
      - "project.yml"
      - "Podfile"
      - "docs/changelog/CHANGELOG_v0_14_23_build190.md"
      - ".github/workflows/build-mdk-lab.yml"

permissions:
  contents: read

concurrency:
  group: build190-carousel-native-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build190 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Build190 carousel ownership and inherited contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          build189 = "44c5958190a48ea45a75a6f89176410700359744"
          app = Path("Sources/Core/AppIdentity.swift").read_text()
          native = Path("Sources/UI/EmbyHomeCarouselNativeDragV3.swift").read_text()
          carousel = Path("Sources/UI/EmbyHomeCarouselStateV3.swift").read_text()
          hero = Path("Sources/UI/EmbyHomeHeroV3.swift").read_text()
          info = Path("Config/Info.plist").read_text()
          project = Path("project.yml").read_text()
          gesture = carousel[carousel.index("func carouselDragGesture"):carousel.index("func suppressCarouselTap")]

          checks = {
              "Build190 source version": 'sourceVersion = "0.14.23"' in app,
              "iOS15 deployment": 'iOS: "15.0"' in project and 'deploymentTarget: "15.0"' in project,
              "ProMotion opt-in preserved": '<key>CADisableMinimumFrameDurationOnPhone</key>' in info,
              "native raw touch recognizer preserved": 'final class V3HomeCarouselImmediateDragRecognizer: UIGestureRecognizer' in native,
              "native coalesced samples preserved": 'event.coalescedTouches(for: touch) ?? [touch]' in native,
              "native progress one-to-one": 'abs(horizontal) / max(1, width)' in native,
              "native horizontal stays passive": 'if axis == .horizontal { state = .began }' not in native and 'state = .changed' not in native,
              "native cannot prevent SwiftUI release": 'override func canPrevent(_ preventedGestureRecognizer: UIGestureRecognizer) -> Bool { false }' in native,
              "native cannot be prevented": 'override func canBePrevented(by preventingGestureRecognizer: UIGestureRecognizer) -> Bool { false }' in native,
              "native end never claims gesture": 'override func touchesEnded(_ touches: Set<UITouch>, with event: UIEvent) { state = .failed }' in native,
              "native no touch cancellation/delay": 'recognizer.cancelsTouchesInView = false' in native and 'recognizer.delaysTouchesBegan = false' in native and 'recognizer.delaysTouchesEnded = false' in native,
              "SwiftUI has no movement owner": '.onChanged {' not in gesture,
              "SwiftUI release prediction preserved": 'DragGesture(minimumDistance: 0, coordinateSpace: .local)' in gesture and 'value.predictedEndTranslation.width' in gesture,
              "existing release threshold preserved": 'transitionProgress >= 0.28 || predicted >= width * 0.48' in gesture,
              "foreground page slide preserved": 'if itemID == fromID { return -direction * progress * width }' in carousel and 'if itemID == toID { return direction * (1 - progress) * width }' in carousel,
              "fixed foreground remains rejected": 'func carouselForegroundOffset(for itemID: String, width: CGFloat) -> CGFloat { 0 }' not in carousel,
              "persistent blur preserved": '.blur(radius: 30)' in hero,
          }
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL"), name)
              if not ok: raise SystemExit(f"::error::{name}")

          subprocess.run(["python3", "scripts/check_home_immersive_carousel.py"], check=True)
          subprocess.run(["python3", "scripts/check_scroll_performance.py"], check=True)
          subprocess.run(["python3", "scripts/check_series_episode_ordering.py"], check=True)
          subprocess.run(["python3", "scripts/check_detail_page_performance.py"], check=True)
          subprocess.run(["python3", "scripts/check_detail_visual_hierarchy.py"], check=True)

          allowed = {
              "Sources/Core/AppIdentity.swift",
              "Sources/UI/EmbyHomeCarouselNativeDragV3.swift",
              "Sources/UI/EmbyHomeCarouselStateV3.swift",
              "scripts/check_home_immersive_carousel.py",
              "docs/changelog/CHANGELOG_v0_14_23_build190.md",
              ".github/workflows/build-mdk-lab.yml",
          }
          changed = subprocess.run(["git", "diff", "--name-only", build189, "HEAD"], capture_output=True, text=True, check=True).stdout.splitlines()
          unexpected = [path for path in changed if path and path not in allowed]
          if unexpected: raise SystemExit(f"::error::unexpected Build190 delta vs Build189: {unexpected}")
          print("PASS Build190 delta limited to carousel release ownership + identity/check/changelog")

          frozen = [
              "Sources/Player/PlayerController.swift", "Sources/Player/MPVPlayerEngine.swift", "Sources/App/AppOrientationCoordinator.swift",
              "Sources/Player/PlayerSurfacePresentationGate.swift", "Sources/UI/MPVPlayerSurface.swift", "Sources/UI/PlayerPiPSessionCoordinator.swift",
              "Sources/UI/PlayerPiPSamplePipeline.swift", "Sources/UI/PlayerPiPInlineRendererAdapter.swift", "Sources/Transport/TransportSettings.swift",
              "Sources/Transport/UnifiedMediaTransportSession.swift", "Sources/Transport/RangeHTTPClient.swift", "Sources/UI/CacheSettingsView.swift",
              "Sources/UI/PlayerEpisodeSelection.swift", "Sources/UI/PlayerScreen.swift", "Sources/UI/PlayerControlPanelViews.swift",
              "Sources/UI/PlayerSettings.swift", "Sources/UI/PlayerSettingsView.swift", "Sources/Networking/EmbyAPIClient.swift",
              "Sources/UI/EmbyMediaDetailView.swift", "Sources/UI/EmbyDetailOverlayViews.swift", "Sources/UI/EmbyEpisodePickerView.swift",
          ]
          diff = subprocess.run(["git", "diff", "--name-only", build189, "HEAD", "--", *frozen], capture_output=True, text=True, check=True).stdout.strip()
          if diff: raise SystemExit(f"::error::P0/frozen files changed: {diff}")
          print("PASS Build189 inherited P0/frozen files unchanged")
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Release
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache MARKETING_VERSION=0.14.23 CURRENT_PROJECT_VERSION=190 IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build190.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-Build190-errors-${{ github.sha }}
          path: |
            build190.log
            package-resolution.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate and validate app
        if: success()
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id "com.embyplayerlab.app" --version "0.14.23" --build "190" --display-name "OnePlayer" --minimum-os "15.0" --primary-icon "OnePlayerIcon" --alternate-icon "OnePlayerAltIcon"

      - name: Validate MinOS
        if: success()
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" build190-min-os.log build190.log

      - name: Package unsigned IPA
        if: success()
        run: |
          set -euo pipefail
          rm -rf Payload && mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-0.14.23-build190-home-carousel-native-release-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          SOURCE_ZIP="OnePlayer-0.14.23-build190-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Upload Build190 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.23-build190-home-carousel-native-release
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            build190.log
            build190-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30
