name: Build180 Detail Page Performance IPA

on:
  workflow_dispatch:
  push:
    branches: [feat/detail-episode-page-optimization]
    paths:
      - "Sources/**"
      - "Config/**"
      - "Resources/**"
      - "scripts/**"
      - "project.yml"
      - "Podfile"
      - "docs/changelog/CHANGELOG_v0_14_13_build180.md"
      - ".github/workflows/build-mdk-lab.yml"

permissions:
  contents: read

concurrency:
  group: build180-detail-page-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build180 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Build180 detail performance and inherited contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = "967b743c88d68b05205eb39f1de75cab41362e8b"
          app = Path("Sources/Core/AppIdentity.swift").read_text()
          detail = Path("Sources/UI/EmbyMediaDetailView.swift").read_text()
          state = Path("Sources/UI/EmbyDetailPerformanceState.swift").read_text()
          project = Path("project.yml").read_text()
          checks = {
              "Build180 source version": 'sourceVersion = "0.14.13"' in app,
              "iOS 15 deployment": 'iOS: "15.0"' in project and 'deploymentTarget: "15.0"' in project,
              "detail root offset state removed": '@State private var heroRawScrollMinY' not in detail,
              "detail Hero scope installed": '@State private var heroScrollState = EmbyDetailHeroScrollState()' in detail and 'EmbyDetailHeroScrollScope(state: heroScrollState)' in detail,
              "native offset routed to Hero owner": 'heroScrollState.update(value)' in detail,
              "warm metadata hit": 'EmbyMediaDetailWarmCache.shared.snapshot' in detail,
              "warm metadata store": 'EmbyMediaDetailWarmCache.shared.store' in detail,
              "live item refresh preserved": 'let refreshed = try await client.libraryItem(itemId: item.id)' in detail,
              "live episode refresh preserved": 'episodes = try await client.seriesEpisodes(seriesId: refreshed.id)' in detail,
              "live image metadata refresh preserved": 'imageInfos = try await client.imageInfos(itemId: refreshed.id)' in detail,
              "warm cache excludes playback authority": all(token not in state for token in ['MediaSource', 'ResolvedPlaybackSource', 'PlaySession', 'playSession', 'PlaybackInfo', 'directStreamURL']),
          }
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL"), name)
              if not ok: raise SystemExit(f"::error::{name}")
          subprocess.run(["python3", "scripts/check_detail_page_performance.py"], check=True)
          subprocess.run(["python3", "scripts/check_adaptive_hero_reveal.py"], check=True)
          subprocess.run(["python3", "scripts/check_detail_episode_range_jump.py"], check=True)
          subprocess.run(["python3", "scripts/check_detail_media_metadata.py"], check=True)
          subprocess.run(["python3", "scripts/check_detail_resume_button.py"], check=True)
          subprocess.run(["python3", "scripts/check_series_episode_ordering.py"], check=True)
          expected_sources = {
              "Sources/Core/AppIdentity.swift",
              "Sources/UI/EmbyDetailPerformanceState.swift",
              "Sources/UI/EmbyMediaDetailView.swift",
          }
          changed_sources = set(filter(None, subprocess.run(["git", "diff", "--name-only", base, "HEAD", "--", "Sources"], capture_output=True, text=True, check=True).stdout.splitlines()))
          if changed_sources != expected_sources:
              raise SystemExit(f"::error::unexpected source diff: {sorted(changed_sources)}")
          print("PASS source diff limited to AppIdentity + detail performance files")
          frozen = [
              "Sources/Networking/EmbyAPIClient.swift", "Sources/UI/EmbySharedImageAndNavigation.swift", "Sources/UI/ImmersiveUIComponents.swift",
              "Sources/UI/EmbyEpisodePickerView.swift", "Sources/UI/PlayerEpisodeSelection.swift", "Sources/UI/PlayerScreen.swift", "Sources/UI/PlayerControlPanelViews.swift",
              "Sources/UI/PlayerSettings.swift", "Sources/UI/PlayerSettingsView.swift", "Sources/Player/PlayerController.swift", "Sources/Player/MPVPlayerEngine.swift",
              "Sources/App/AppOrientationCoordinator.swift", "Sources/Player/PlayerSurfacePresentationGate.swift", "Sources/UI/MPVPlayerSurface.swift",
              "Sources/UI/PlayerPiPSessionCoordinator.swift", "Sources/UI/PlayerPiPSamplePipeline.swift", "Sources/UI/PlayerPiPInlineRendererAdapter.swift",
              "Sources/Transport/TransportSettings.swift", "Sources/Transport/UnifiedMediaTransportSession.swift", "Sources/Transport/RangeHTTPClient.swift",
              "Sources/UI/CacheSettingsView.swift",
          ]
          diff = subprocess.run(["git", "diff", "--name-only", base, "HEAD", "--", *frozen], capture_output=True, text=True, check=True).stdout.strip()
          if diff: raise SystemExit(f"::error::accepted/frozen files changed: {diff}")
          print("PASS Build176/178 episode/player and P0 frozen files unchanged")
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Release
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache MARKETING_VERSION=0.14.13 CURRENT_PROJECT_VERSION=180 IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build180.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-Build180-errors-${{ github.sha }}
          path: |
            build180.log
            package-resolution.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate and validate app
        if: success()
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id "com.embyplayerlab.app" --version "0.14.13" --build "180" --display-name "OnePlayer" --minimum-os "15.0" --primary-icon "OnePlayerIcon" --alternate-icon "OnePlayerAltIcon"

      - name: Validate MinOS
        if: success()
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" build180-min-os.log build180.log

      - name: Package unsigned IPA
        if: success()
        run: |
          set -euo pipefail
          rm -rf Payload && mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-0.14.13-build180-detail-page-performance-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          SOURCE_ZIP="OnePlayer-0.14.13-build180-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Upload Build180 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.13-build180-detail-page-performance
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            build180.log
            build180-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30
