name: Build186 Carousel Drag Timing IPA

on:
  workflow_dispatch:
  push:
    branches: [perf/home-carousel-drag-cadence-build186]
    paths:
      - "Sources/**"
      - "Config/**"
      - "Resources/**"
      - "scripts/**"
      - "project.yml"
      - "Podfile"
      - "docs/changelog/CHANGELOG_v0_14_19_build186.md"
      - ".github/workflows/build-mdk-lab.yml"

permissions:
  contents: read

concurrency:
  group: build186-carousel-drag-timing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build186 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Build186 carousel and accepted baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          accepted_base = "dcd6cc6d01319e13ccb991967a190ae1f915053b"
          app = Path("Sources/Core/AppIdentity.swift").read_text()
          core = Path("Sources/UI/EmbyHomeCoreV3.swift").read_text()
          carousel = Path("Sources/UI/EmbyHomeCarouselStateV3.swift").read_text()
          hero = Path("Sources/UI/EmbyHomeHeroV3.swift").read_text()
          info = Path("Config/Info.plist").read_text()
          project = Path("project.yml").read_text()

          checks = {
              "Build186 source version": 'sourceVersion = "0.14.19"' in app,
              "iOS 15 deployment": 'iOS: "15.0"' in project and 'deploymentTarget: "15.0"' in project,
              "ProMotion opt-in preserved": '<key>CADisableMinimumFrameDurationOnPhone</key>' in info,
              "single carousel transition owner": 'final class V3HomeCarouselTransitionState: ObservableObject' in carousel and '@State var carouselTransitionState = V3HomeCarouselTransitionState()' in core,
              "root progress state removed": '@State var transitionProgress' not in core and '@State var transitionFromID' not in core and '@State var transitionToID' not in core,
              "zero-point drag delivery": 'DragGesture(minimumDistance: 0, coordinateSpace: .local)' in carousel,
              "one-time axis state": 'var dragAxis: V3HomeCarouselDragAxis?' in carousel,
              "Build185 axis acquisition preserved": 'guard max(abs(horizontal), abs(vertical)) >= 0.5 else { return }' in carousel and 'carouselTransitionState.dragAxis = abs(horizontal) >= abs(vertical) ? .horizontal : .vertical' in carousel,
              "old gates removed": 'abs(vertical) * 1.08' not in carousel and 'abs(horizontal) > 4' not in carousel and 'minimumDistance: 12' not in carousel,
              "raw manual artwork progress": 'func carouselBackdropBlendProgress(_ rawProgress: CGFloat) -> CGFloat { min(1, max(0, rawProgress)) }' in carousel and '(raw - 0.08)' not in carousel,
              "foreground full-page slide preserved": 'if itemID == fromID { return -direction * progress * width }' in carousel and 'if itemID == toID { return direction * (1 - progress) * width }' in carousel,
              "Build183 fixed foreground rejected": 'func carouselForegroundOffset(for itemID: String, width: CGFloat) -> CGFloat { 0 }' not in carousel,
              "passive first-sample timing": 'carouselTransitionState.recordDragSample(value.translation)' in carousel and 'carouselTransitionState.recordDragAxisLock(value.translation)' in carousel and 'carouselTransitionState.recordDragTransitionStart(value.translation)' in carousel,
              "one end-of-gesture timing log": carousel.count('DiagnosticsLogger.shared.log("HomeCarouselDragTiming"') == 1 and 'avgHz=' in carousel and 'maxGapMs=' in carousel,
              "display capability logged": 'UIScreen.main.maximumFramesPerSecond' in carousel and 'isLowPowerModeEnabled' in carousel,
              "existing commit threshold preserved": 'transitionProgress >= 0.28 || predicted >= width * 0.48' in carousel,
              "existing auto advance preserved": 'timeIntervalSince(carouselLastSettledAt) >= 6' in carousel and '.easeInOut(duration: 0.62)' in carousel,
              "persistent blur visual preserved": '.blur(radius: 30)' in hero,
          }
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL"), name)
              if not ok: raise SystemExit(f"::error::{name}")

          subprocess.run(["python3", "scripts/check_home_immersive_carousel.py"], check=True)
          subprocess.run(["python3", "scripts/check_scroll_performance.py"], check=True)
          subprocess.run(["python3", "scripts/check_series_episode_ordering.py"], check=True)
          subprocess.run(["python3", "scripts/check_detail_page_performance.py"], check=True)
          subprocess.run(["python3", "scripts/check_detail_visual_hierarchy.py"], check=True)

          allowed = {
              "Sources/Core/AppIdentity.swift",
              "Sources/UI/EmbyHomeCarouselStateV3.swift",
              "Sources/UI/EmbyHomeCoreV3.swift",
              "docs/changelog/CHANGELOG_v0_14_19_build186.md",
              "scripts/check_home_immersive_carousel.py",
              "scripts/check_scroll_performance.py",
              ".github/workflows/build-mdk-lab.yml",
          }
          changed = subprocess.run(["git", "diff", "--name-only", accepted_base, "HEAD"], capture_output=True, text=True, check=True).stdout.splitlines()
          unexpected = [path for path in changed if path and path not in allowed]
          if unexpected: raise SystemExit(f"::error::unexpected Build186 delta vs accepted Build184 main: {unexpected}")
          print("PASS Build186 delta limited to carousel integration/diagnostics + identity/checks")
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Release
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache MARKETING_VERSION=0.14.19 CURRENT_PROJECT_VERSION=186 IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build186.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-Build186-errors-${{ github.sha }}
          path: |
            build186.log
            package-resolution.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate and validate app
        if: success()
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id "com.embyplayerlab.app" --version "0.14.19" --build "186" --display-name "OnePlayer" --minimum-os "15.0" --primary-icon "OnePlayerIcon" --alternate-icon "OnePlayerAltIcon"

      - name: Validate MinOS
        if: success()
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" build186-min-os.log build186.log

      - name: Package unsigned IPA
        if: success()
        run: |
          set -euo pipefail
          rm -rf Payload && mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-0.14.19-build186-home-carousel-drag-timing-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          SOURCE_ZIP="OnePlayer-0.14.19-build186-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Upload Build186 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.19-build186-home-carousel-drag-timing
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            build186.log
            build186-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30
