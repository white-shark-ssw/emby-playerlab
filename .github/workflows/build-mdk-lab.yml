name: Build189 Carousel Native Touch IPA

on:
  workflow_dispatch:
  push:
    branches: [perf/home-carousel-native-touch-build189-from187]
    paths:
      - "Sources/**"
      - "Config/**"
      - "Resources/**"
      - "scripts/**"
      - "project.yml"
      - "Podfile"
      - "docs/changelog/CHANGELOG_v0_14_22_build189.md"
      - ".github/workflows/build-mdk-lab.yml"

permissions:
  contents: read

concurrency:
  group: build189-carousel-native-touch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build189 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Build189 native carousel input and inherited contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          build187 = "468986492f639959f7f31129dadf5b49e781d37f"
          accepted_main = "7e3523ce3aaab281ddb2d7df295dbf4f05c1520c"
          app = Path("Sources/Core/AppIdentity.swift").read_text()
          native = Path("Sources/UI/EmbyHomeCarouselNativeDragV3.swift").read_text()
          core = Path("Sources/UI/EmbyHomeCoreV3.swift").read_text()
          carousel = Path("Sources/UI/EmbyHomeCarouselStateV3.swift").read_text()
          hero = Path("Sources/UI/EmbyHomeHeroV3.swift").read_text()
          info = Path("Config/Info.plist").read_text()
          project = Path("project.yml").read_text()

          checks = {
              "Build189 source version": 'sourceVersion = "0.14.22"' in app,
              "conflicted carousel Build188 changelog removed": not Path("docs/changelog/CHANGELOG_v0_14_21_build188.md").exists(),
              "inherited Build187 docs helper removed": not Path(".github/workflows/temp-sync-build187-docs.yml").exists(),
              "Build189 changelog present": Path("docs/changelog/CHANGELOG_v0_14_22_build189.md").exists(),
              "iOS 15 deployment": 'iOS: "15.0"' in project and 'deploymentTarget: "15.0"' in project,
              "ProMotion opt-in preserved": '<key>CADisableMinimumFrameDurationOnPhone</key>' in info,
              "native capture mounted on Hero scope": 'V3HomeCarouselNativeDragCapture(' in core and 'handleNativeCarouselDrag(translation, width: width)' in core,
              "native raw touch recognizer": 'final class V3HomeCarouselImmediateDragRecognizer: UIGestureRecognizer' in native,
              "native coalesced samples": 'event.coalescedTouches(for: touch) ?? [touch]' in native,
              "native no touch cancellation": 'recognizer.cancelsTouchesInView = false' in native,
              "native no touch delays": 'recognizer.delaysTouchesBegan = false' in native and 'recognizer.delaysTouchesEnded = false' in native,
              "native simultaneous with ScrollView": 'shouldRecognizeSimultaneouslyWith' in native and '-> Bool { true }' in native,
              "subpoint native axis acquisition": 'guard max(abs(horizontal), abs(vertical)) >= 0.5 else { return nil }' in native,
              "native progress remains one-to-one": 'abs(horizontal) / max(1, width)' in native,
              "SwiftUI end prediction preserved": 'DragGesture(minimumDistance: 0, coordinateSpace: .local)' in carousel and 'value.predictedEndTranslation.width' in carousel,
              "existing commit threshold preserved": 'transitionProgress >= 0.28 || predicted >= width * 0.48' in carousel,
              "foreground full-page slide preserved": 'if itemID == fromID { return -direction * progress * width }' in carousel and 'if itemID == toID { return direction * (1 - progress) * width }' in carousel,
              "Build183 fixed foreground rejected": 'func carouselForegroundOffset(for itemID: String, width: CGFloat) -> CGFloat { 0 }' not in carousel,
              "persistent blur visual preserved": '.blur(radius: 30)' in hero,
          }
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL"), name)
              if not ok: raise SystemExit(f"::error::{name}")

          subprocess.run(["python3", "scripts/check_home_immersive_carousel.py"], check=True)
          subprocess.run(["python3", "scripts/check_scroll_performance.py"], check=True)
          subprocess.run(["python3", "scripts/check_series_episode_ordering.py"], check=True)
          subprocess.run(["python3", "scripts/check_detail_page_performance.py"], check=True)
          subprocess.run(["python3", "scripts/check_detail_visual_hierarchy.py"], check=True)

          allowed = {
              "Sources/Core/AppIdentity.swift",
              "Sources/UI/EmbyHomeCarouselNativeDragV3.swift",
              "Sources/UI/EmbyHomeCoreV3.swift",
              "docs/changelog/CHANGELOG_v0_14_22_build189.md",
              ".github/workflows/build-mdk-lab.yml",
          }
          changed = subprocess.run(["git", "diff", "--name-only", build187, "HEAD"], capture_output=True, text=True, check=True).stdout.splitlines()
          unexpected = [path for path in changed if path and path not in allowed]
          if unexpected: raise SystemExit(f"::error::unexpected Build189 delta vs Build187: {unexpected}")
          print("PASS Build189 delta limited to native carousel input + identity/changelog")

          frozen = [
              "Sources/Player/PlayerController.swift", "Sources/Player/MPVPlayerEngine.swift", "Sources/App/AppOrientationCoordinator.swift",
              "Sources/Player/PlayerSurfacePresentationGate.swift", "Sources/UI/MPVPlayerSurface.swift", "Sources/UI/PlayerPiPSessionCoordinator.swift",
              "Sources/UI/PlayerPiPSamplePipeline.swift", "Sources/UI/PlayerPiPInlineRendererAdapter.swift", "Sources/Transport/TransportSettings.swift",
              "Sources/Transport/UnifiedMediaTransportSession.swift", "Sources/Transport/RangeHTTPClient.swift", "Sources/UI/CacheSettingsView.swift",
              "Sources/UI/PlayerEpisodeSelection.swift", "Sources/UI/PlayerScreen.swift", "Sources/UI/PlayerControlPanelViews.swift",
              "Sources/UI/PlayerSettings.swift", "Sources/UI/PlayerSettingsView.swift", "Sources/Networking/EmbyAPIClient.swift",
              "Sources/UI/EmbyMediaDetailView.swift", "Sources/UI/EmbyDetailOverlayViews.swift",
          ]
          diff = subprocess.run(["git", "diff", "--name-only", accepted_main, "HEAD", "--", *frozen], capture_output=True, text=True, check=True).stdout.strip()
          if diff: raise SystemExit(f"::error::accepted/frozen files changed: {diff}")
          print("PASS accepted Build184 detail and P0 frozen files unchanged")
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Release
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache MARKETING_VERSION=0.14.22 CURRENT_PROJECT_VERSION=189 IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build189.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-Build189-errors-${{ github.sha }}
          path: |
            build189.log
            package-resolution.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate and validate app
        if: success()
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id "com.embyplayerlab.app" --version "0.14.22" --build "189" --display-name "OnePlayer" --minimum-os "15.0" --primary-icon "OnePlayerIcon" --alternate-icon "OnePlayerAltIcon"

      - name: Validate MinOS
        if: success()
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" build189-min-os.log build189.log

      - name: Package unsigned IPA
        if: success()
        run: |
          set -euo pipefail
          rm -rf Payload && mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-0.14.22-build189-home-carousel-native-touch-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          SOURCE_ZIP="OnePlayer-0.14.22-build189-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Upload Build189 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.22-build189-home-carousel-native-touch
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            build189.log
            build189-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30
