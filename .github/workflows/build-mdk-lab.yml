name: Build MDK Lab IPA

on:
  workflow_dispatch:
  push:
    branches: [feat/mdk-engine-lab]
    paths:
      - "Sources/**"
      - "MDKLab/**"
      - "Config/**"
      - "Resources/**"
      - "project.mdklab.yml"
      - "Podfile"
      - ".github/workflows/build-mdk-lab.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app
      - name: Install tools
        run: |
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
      - name: Prepare assets
        run: python3 scripts/generate_oneplayer_icons.py
      - name: Validate MDK local-file contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          spec=Path('project.mdklab.yml').read_text(); local=Path('Sources/UI/LocalMDKFileLabView.swift').read_text(); shell=Path('Sources/UI/AppShellView.swift').read_text(); engine=Path('MDKLab/App/MDKKSAVIOPlayerEngine.swift').read_text()
          checks={'iOS15':'iOS: "15.0"' in spec and 'deploymentTarget: "15.0"' in spec,'MDK condition':'SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MDK_LAB"' in spec,'swift-mdk linked':'product: swift-mdk' in spec,'MDK source':'- path: MDKLab/App' in spec,'real local MDK':'#if MDK_LAB && canImport(swift_mdk)' in local and 'KSAVIOPlayerEngine' in local,'settings entry':'LocalMDKFileLabView()' in shell,'bypass transport':'sharedTransportSession: nil' in local and 'unifiedTransport=false' in local,'no fallback':'fallback=false' in local,'diagnostics':'DiagnosticsLogger.shared.playback("LocalMDKLab"' in local,'same MDK condition':'#if MDK_LAB && canImport(swift_mdk)' in engine}
          for n,v in checks.items():
            print(('PASS' if v else 'FAIL'),n)
            if not v: raise SystemExit(n)
          PY
      - run: xcodegen generate --spec project.mdklab.yml
      - run: pod install --repo-update
      - name: Resolve packages
        run: xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -resolvePackageDependencies
      - name: Build
        run: xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee mdk-build.log
      - name: Validate binary and package
        run: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP_PATH"; test -f "$APP_PATH/OnePlayer"
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist"); test "$MIN_OS" = "15.0"
          strings "$APP_PATH/OnePlayer" | grep -F 'MDK 本地文件实验'
          strings "$APP_PATH/OnePlayer" | grep -F 'LocalMDKLab'
          if strings "$APP_PATH/OnePlayer" | grep -F '当前构建未包含 MDK 实验引擎。'; then exit 1; fi
          mkdir Payload; cp -R "$APP_PATH" Payload/; zip -qry OnePlayer-local-mdk.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-local-mdk-${{ github.sha }}
          path: |
            OnePlayer-local-mdk.ipa
            mdk-build.log
          retention-days: 14
