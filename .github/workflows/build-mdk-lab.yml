name: Build187 Carousel Drag Timing IPA

on:
  workflow_dispatch:
  push:
    branches: [perf/home-carousel-drag-cadence-build187]
    paths:
      - "Sources/**"
      - "Config/**"
      - "Resources/**"
      - "scripts/**"
      - "project.yml"
      - "Podfile"
      - "docs/changelog/CHANGELOG_v0_14_20_build187.md"
      - ".github/workflows/build-mdk-lab.yml"

permissions:
  contents: read

concurrency:
  group: build187-carousel-drag-timing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build187 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Build187 diagnostics and inherited contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          build186 = "2ba1ad1f1d9e05b0fe8075226de3695a7b2a2b71"
          app = Path("Sources/Core/AppIdentity.swift").read_text()
          carousel = Path("Sources/UI/EmbyHomeCarouselStateV3.swift").read_text()
          project = Path("project.yml").read_text()
          checks = {
              "Build187 source version": 'sourceVersion = "0.14.20"' in app,
              "iOS 15 deployment": 'iOS: "15.0"' in project and 'deploymentTarget: "15.0"' in project,
              "playback-exportable timing log": 'DiagnosticsLogger.shared.playback("HomeCarouselDragTiming"' in carousel,
              "old app-channel timing log removed": 'DiagnosticsLogger.shared.log("HomeCarouselDragTiming"' not in carousel,
              "zero-point drag preserved": 'DragGesture(minimumDistance: 0, coordinateSpace: .local)' in carousel,
              "axis lock preserved": 'guard max(abs(horizontal), abs(vertical)) >= 0.5 else { return }' in carousel,
              "full-page slide preserved": 'if itemID == fromID { return -direction * progress * width }' in carousel and 'if itemID == toID { return direction * (1 - progress) * width }' in carousel,
              "timing fields preserved": 'avgHz=' in carousel and 'maxGapMs=' in carousel and 'first=' in carousel and 'lock=' in carousel and 'transition=' in carousel and 'maxFPS=' in carousel,
          }
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL"), name)
              if not ok: raise SystemExit(f"::error::{name}")
          subprocess.run(["python3", "scripts/check_home_immersive_carousel.py"], check=True)
          subprocess.run(["python3", "scripts/check_scroll_performance.py"], check=True)
          subprocess.run(["python3", "scripts/check_series_episode_ordering.py"], check=True)
          subprocess.run(["python3", "scripts/check_detail_page_performance.py"], check=True)
          subprocess.run(["python3", "scripts/check_detail_visual_hierarchy.py"], check=True)
          allowed = {
              "Sources/Core/AppIdentity.swift",
              "Sources/UI/EmbyHomeCarouselStateV3.swift",
              "docs/changelog/CHANGELOG_v0_14_20_build187.md",
              "scripts/check_home_immersive_carousel.py",
              ".github/workflows/build-mdk-lab.yml",
          }
          changed = subprocess.run(["git", "diff", "--name-only", build186, "HEAD"], capture_output=True, text=True, check=True).stdout.splitlines()
          unexpected = [p for p in changed if p and p not in allowed]
          if unexpected: raise SystemExit(f"::error::unexpected Build187 delta vs Build186: {unexpected}")
          print("PASS Build187 delta limited to diagnostics export channel + identity/checks")
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Release
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache MARKETING_VERSION=0.14.20 CURRENT_PROJECT_VERSION=187 IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build187.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-Build187-errors-${{ github.sha }}
          path: |
            build187.log
            package-resolution.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate and validate app
        if: success()
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id "com.embyplayerlab.app" --version "0.14.20" --build "187" --display-name "OnePlayer" --minimum-os "15.0" --primary-icon "OnePlayerIcon" --alternate-icon "OnePlayerAltIcon"

      - name: Validate MinOS
        if: success()
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" build187-min-os.log build187.log

      - name: Package unsigned IPA
        if: success()
        run: |
          set -euo pipefail
          rm -rf Payload && mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-0.14.20-build187-home-carousel-drag-timing-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          SOURCE_ZIP="OnePlayer-0.14.20-build187-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Upload Build187 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.20-build187-home-carousel-drag-timing
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            build187.log
            build187-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30
