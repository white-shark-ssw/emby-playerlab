name: Build237 Carousel Fling WhiteFlash IPA

on:
  push:
    branches: [perf/home-carousel-fling-whiteflash-build237]
    paths:
      - ".github/build237-carousel-ci-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build237 branch
        uses: actions/checkout@v4
        with:
          ref: perf/home-carousel-fling-whiteflash-build237
          fetch-depth: 0

      - name: Validate exact Build237 scope and retained contracts
        run: |
          set -euo pipefail
          base='f85333b58980af26af5f28ca842277f22a289347'
          git diff --check "$base"...HEAD
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = 'f85333b58980af26af5f28ca842277f22a289347'
          allowed = {
              '.github/build237-apply-trigger.txt',
              '.github/build237-carousel-ci-trigger.txt',
              '.github/workflows/temp-apply-build237-fling-whiteflash.yml',
              '.github/workflows/temp-build237-carousel-fling-whiteflash.yml',
              'scripts/temp_apply_build237_fling_whiteflash.py',
              'Sources/Core/AppIdentity.swift',
              'Sources/UI/EmbyHomeCarouselInteractionV3.swift',
              'Sources/UI/EmbyHomeHeroV3.swift',
              'docs/changelog/CHANGELOG_v0_14_70_build237.md',
              'docs/project/current/dev/DEV-home-carousel-drag-smoothness.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', f'{base}...HEAD'], text=True).splitlines())
          extra = sorted(changed - allowed)
          if extra: raise SystemExit(f'Unexpected Build237 files: {extra}')
          required = {'Sources/Core/AppIdentity.swift', 'Sources/UI/EmbyHomeCarouselInteractionV3.swift', 'Sources/UI/EmbyHomeHeroV3.swift', 'docs/changelog/CHANGELOG_v0_14_70_build237.md'}
          missing = sorted(required - changed)
          if missing: raise SystemExit(f'Missing Build237 files: {missing}')
          frozen_prefixes = ('Sources/Player/', 'Sources/Transport/', 'Sources/Cache/', 'Sources/Session/', 'Sources/AVIO/')
          touched_frozen = sorted(path for path in changed if path.startswith(frozen_prefixes))
          if touched_frozen: raise SystemExit(f'Build237 touched Frozen/P0 paths: {touched_frozen}')

          identity = Path('Sources/Core/AppIdentity.swift').read_text()
          assert 'sourceVersion = "0.14.70"' in identity

          interaction = Path('Sources/UI/EmbyHomeCarouselInteractionV3.swift').read_text()
          assert 'actualProgress >= 0.28 || max(actualDistance, predictedDistance) >= width * 0.24' in interaction
          assert 'width * 0.48' not in interaction
          assert 'pendingPostAcquisitionBaseline = acquisitionSample.status == "none" && acquisitionSample.count == 1' in interaction
          assert 'postAcquisitionRenderBaselineSample' in interaction
          assert interaction.count('event.coalescedTouches(for: touch)') == 2
          assert '$0.timestamp > acquisitionTimestamp + 0.000001' in interaction
          assert '$0.timestamp < touch.timestamp - 0.000001' in interaction
          assert 'delta * horizontalAcquisitionDirectionTranslation > 0' in interaction
          assert 'return CGSize(width: translation.width - acquisitionTranslation, height: 0)' in interaction
          assert 'Timer' not in interaction and 'DispatchQueue.main.asyncAfter' not in interaction

          hero = Path('Sources/UI/EmbyHomeHeroV3.swift').read_text()
          assert hero.count('.compositingGroup()') == 1
          assert 'ForEach(carouselHeroResidentItems) { item in\n                carouselHeroArtwork' in hero
          assert 'if let item = currentCarouselItem {\n                carouselPersistentImage(item: item, size: size)\n            }' in hero
          assert 'if let item = transitionTargetCarouselItem {\n                carouselPersistentImage(item: item, size: size).opacity(Double(carouselBackdropBlendProgress(transitionProgress)))\n            }' in hero
          assert 'carouselPersistentImage(item: item, size: size).opacity(carouselOpacity(for: item.id))' not in hero
          assert 'Color(uiColor: .systemBackground).opacity(colorScheme == .dark ? 0.18 : 0.26)' in hero
          assert 'UIScreen.main.scale' not in hero

          state = Path('Sources/UI/EmbyHomeCarouselStateV3.swift').read_text()
          assert 'withAnimation(.easeOut(duration: 0.22))' in state
          assert 'withAnimation(.easeOut(duration: 0.18))' in state
          assert 'V3HomeCarouselCadenceDiagnostics.shared.end(reason: "settled")' in state
          assert 'V3HomeCarouselCadenceDiagnostics.shared.end(reason: "cancelled-settled")' in state
          assert 'UIScreen.main.scale' not in state

          cadence = Path('Sources/UI/EmbyHomeCarouselCadenceDiagnosticsV3.swift').read_text()
          assert 'link.preferredFrameRateRange = CAFrameRateRange(minimum: requested, maximum: requested, preferred: requested)' in cadence
          print('Build237 scope/contracts: PASS')
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Prepare OnePlayer app icons
        run: python3 scripts/generate_oneplayer_icons.py

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache | tee package-resolution.log

      - name: Build Release
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            MARKETING_VERSION=0.14.70 \
            CURRENT_PROJECT_VERSION=237 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build237.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id com.embyplayerlab.app --version 0.14.70 --build 237 --display-name OnePlayer --minimum-os 15.0 --primary-icon OnePlayerIcon --alternate-icon OnePlayerAltIcon

      - name: Validate MinOS
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" 15.0 17.0 build237-min-os.log build237.log

      - name: Package unsigned IPA and source snapshot
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA="OnePlayer-0.14.70-build237-fling-whiteflash-unsigned.ipa"
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA"
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          SOURCE="OnePlayer-0.14.70-build237-source.zip"
          git archive --format=zip --output "$SOURCE" HEAD
          shasum -a 256 "$SOURCE" | tee "$SOURCE.sha256"
          git rev-parse HEAD | tee build237-source-sha.txt
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"

      - name: Upload Build237 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.70-build237-fling-whiteflash
          path: |
            ${{ env.IPA }}
            ${{ env.IPA }}.sha256
            ${{ env.SOURCE }}
            ${{ env.SOURCE }}.sha256
            build237-source-sha.txt
            build237.log
            build237-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30
