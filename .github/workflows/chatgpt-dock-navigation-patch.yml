name: ChatGPT Dock Navigation Patch

on:
  push:
    paths:
      - '.github/workflows/chatgpt-dock-navigation-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch dock ownership and hit areas
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('Sources/UI/EmbyServerRootViewV3.swift')
          s = p.read_text()

          s = s.replace('    @StateObject private var dockVisibility = ServerDockVisibilityController()\n', '')

          pattern = re.compile(r'''                GeometryReader \{ geometry in\n                    let contentHeight = geometry\.size\.height \+ \(dockVisibility\.isHidden \? geometry\.safeAreaInsets\.bottom : 0\)\n                    ZStack\(alignment: \.top\) \{.*?\n                \}\n            \} else \{''', re.S)
          replacement = '''                ZStack {
                    V3EmbyHomeView(session: session, client: client, refreshToken: homeRefreshToken, scrollToTopToken: homeScrollToTopToken, onClose: close, dock: AnyView(serverTabBar))
                        .opacity(selectedTab == .home ? 1 : 0)
                        .allowsHitTesting(selectedTab == .home)
                        .accessibilityHidden(selectedTab != .home)

                    V3EmbyFavoritesView(client: client, onClose: close, dock: AnyView(serverTabBar))
                        .opacity(selectedTab == .favorites ? 1 : 0)
                        .allowsHitTesting(selectedTab == .favorites)
                        .accessibilityHidden(selectedTab != .favorites)

                    V3EmbySearchView(client: client, onClose: close, dock: AnyView(serverTabBar))
                        .opacity(selectedTab == .search ? 1 : 0)
                        .allowsHitTesting(selectedTab == .search)
                        .accessibilityHidden(selectedTab != .search)

                    V3EmbyServerSettingsView(session: session, onClose: close, dock: AnyView(serverTabBar))
                        .opacity(selectedTab == .settings ? 1 : 0)
                        .allowsHitTesting(selectedTab == .settings)
                        .accessibilityHidden(selectedTab != .settings)
                }
                .frame(maxWidth: .infinity, maxHeight: .infinity)
                .background(Color(uiColor: .systemBackground).ignoresSafeArea())
            } else {'''
          s, n = pattern.subn(replacement, s, count=1)
          assert n == 1, f'root container replacement count={n}'

          old = '''        .frame(height: 34)
        .background(Color(uiColor: .secondarySystemBackground).ignoresSafeArea(edges: .bottom))'''
          new = '''        .frame(height: 40)
        .background(Color(uiColor: .secondarySystemBackground).ignoresSafeArea(edges: .bottom))'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        } label: {
            VStack(spacing: 0) {
                Image(systemName: selectedTab == tab && tab != .search ? systemImage + ".fill" : systemImage).font(.system(size: 19))
                Text(title).font(.system(size: 10))
            }
            .foregroundColor(selectedTab == tab ? .blue : .secondary)
            .frame(maxWidth: .infinity, minHeight: 34, maxHeight: 34)
            .offset(y: 10)
        }
        .buttonStyle(.plain)'''
          new = '''        } label: {
            ZStack {
                Color.clear
                VStack(spacing: 0) {
                    Image(systemName: selectedTab == tab && tab != .search ? systemImage + ".fill" : systemImage).font(.system(size: 19))
                    Text(title).font(.system(size: 10))
                }
                .foregroundColor(selectedTab == tab ? .blue : .secondary)
                .offset(y: 7)
            }
            .frame(maxWidth: .infinity, maxHeight: .infinity)
            .contentShape(Rectangle())
        }
        .frame(maxWidth: .infinity, minHeight: 40, maxHeight: 40)
        .contentShape(Rectangle())
        .buttonStyle(.plain)'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    let scrollToTopToken: Int
    let onClose: () -> Void
    @StateObject private var model: V3EmbyHomeViewModel'''
          new = '''    let scrollToTopToken: Int
    let onClose: () -> Void
    let dock: AnyView
    @StateObject private var model: V3EmbyHomeViewModel'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    init(session: EmbySession, client: EmbyAPIClient, refreshToken: Int, scrollToTopToken: Int, onClose: @escaping () -> Void) {
        self.session = session
        self.client = client
        self.refreshToken = refreshToken
        self.scrollToTopToken = scrollToTopToken
        self.onClose = onClose
        _model = StateObject(wrappedValue: V3EmbyHomeViewModel(session: session, client: client))
    }'''
          new = '''    init(session: EmbySession, client: EmbyAPIClient, refreshToken: Int, scrollToTopToken: Int, onClose: @escaping () -> Void, dock: AnyView) {
        self.session = session
        self.client = client
        self.refreshToken = refreshToken
        self.scrollToTopToken = scrollToTopToken
        self.onClose = onClose
        self.dock = dock
        _model = StateObject(wrappedValue: V3EmbyHomeViewModel(session: session, client: client))
    }'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            .background(Color(uiColor: .systemBackground).ignoresSafeArea())
            .onAppear { if !model.hasLoaded { Task { await model.refresh() } } }'''
          new = '''            .background(Color(uiColor: .systemBackground).ignoresSafeArea())
            .overlay(alignment: .bottom) { dock }
            .onAppear { if !model.hasLoaded { Task { await model.refresh() } } }'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''private struct V3EmbyFavoritesView: View {
    let client: EmbyAPIClient
    let onClose: () -> Void
    @StateObject private var model: V3FavoritesViewModel'''
          new = '''private struct V3EmbyFavoritesView: View {
    let client: EmbyAPIClient
    let onClose: () -> Void
    let dock: AnyView
    @StateObject private var model: V3FavoritesViewModel'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    init(client: EmbyAPIClient, onClose: @escaping () -> Void) {
        self.client = client
        self.onClose = onClose
        _model = StateObject(wrappedValue: V3FavoritesViewModel(client: client))
    }'''
          new = '''    init(client: EmbyAPIClient, onClose: @escaping () -> Void, dock: AnyView) {
        self.client = client
        self.onClose = onClose
        self.dock = dock
        _model = StateObject(wrappedValue: V3FavoritesViewModel(client: client))
    }'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            .background(Color(uiColor: .systemBackground).ignoresSafeArea())
            .refreshable { await model.load() }'''
          new = '''            .background(Color(uiColor: .systemBackground).ignoresSafeArea())
            .overlay(alignment: .bottom) { dock }
            .refreshable { await model.load() }'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''private struct V3EmbySearchView: View {
    let client: EmbyAPIClient
    let onClose: () -> Void
    @StateObject private var model: V3SearchViewModel'''
          new = '''private struct V3EmbySearchView: View {
    let client: EmbyAPIClient
    let onClose: () -> Void
    let dock: AnyView
    @StateObject private var model: V3SearchViewModel'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    init(client: EmbyAPIClient, onClose: @escaping () -> Void) {
        self.client = client
        self.onClose = onClose
        _model = StateObject(wrappedValue: V3SearchViewModel(client: client))
    }'''
          new = '''    init(client: EmbyAPIClient, onClose: @escaping () -> Void, dock: AnyView) {
        self.client = client
        self.onClose = onClose
        self.dock = dock
        _model = StateObject(wrappedValue: V3SearchViewModel(client: client))
    }'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            .frame(maxWidth: .infinity, maxHeight: .infinity)
            .background(Color(uiColor: .systemBackground).ignoresSafeArea())
            .navigationBarHidden(true)'''
          new = '''            .frame(maxWidth: .infinity, maxHeight: .infinity)
            .background(Color(uiColor: .systemBackground).ignoresSafeArea())
            .overlay(alignment: .bottom) { dock }
            .navigationBarHidden(true)'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''private struct V3EmbyServerSettingsView: View {
    let session: EmbySession
    let onClose: () -> Void
    @State private var shareURL: URL?'''
          new = '''private struct V3EmbyServerSettingsView: View {
    let session: EmbySession
    let onClose: () -> Void
    let dock: AnyView
    @State private var shareURL: URL?'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            .background(Color(uiColor: .systemGroupedBackground).ignoresSafeArea())
            .navigationBarHidden(true)'''
          new = '''            .background(Color(uiColor: .systemGroupedBackground).ignoresSafeArea())
            .overlay(alignment: .bottom) { dock }
            .navigationBarHidden(true)'''
          assert old in s
          s = s.replace(old, new, 1)

          assert 'dockVisibility' not in s
          p.write_text(s)
          PY

          git diff --check
          git diff -- Sources/UI/EmbyServerRootViewV3.swift
          git config user.name 'chatgpt-dev'
          git config user.email 'chatgpt-dev@users.noreply.github.com'
          git add Sources/UI/EmbyServerRootViewV3.swift
          git commit -m 'refactor: make server dock part of root tab pages'
          git push origin HEAD:main
