name: Validate Source

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Stage single navigation refactor
        id: navigation_refactor
        if: github.event_name == 'pull_request' && github.head_ref == 'chatgpt/single-navigation-immersive-fix-20260811'
        run: |
          set -euo pipefail
          if [[ -f docs/.single-navigation-layout-patched ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          server_path = Path('Sources/UI/EmbyServerRootViewV3.swift')
          source = server_path.read_text()

          old_root_start = '''            if let client {
                GeometryReader { geometry in
'''
          new_root_start = '''            if let client {
                NavigationView {
                    GeometryReader { geometry in
'''
          if source.count(old_root_start) != 1:
              raise SystemExit('unexpected EmbyServerRootViewV3 root start')
          source = source.replace(old_root_start, new_root_start, 1)

          old_root_end = '''                    .background(Color(uiColor: .systemBackground).ignoresSafeArea())
                }
            } else {
'''
          new_root_end = '''                    .background(Color(uiColor: .systemBackground).ignoresSafeArea())
                }
                .navigationBarHidden(true)
                }
                .navigationViewStyle(StackNavigationViewStyle())
                .ignoresSafeArea(.container, edges: .bottom)
            } else {
'''
          if source.count(old_root_end) != 1:
              raise SystemExit('unexpected EmbyServerRootViewV3 root end')
          source = source.replace(old_root_end, new_root_end, 1)

          def matching_brace(text: str, open_index: int) -> int:
              depth = 0
              for index in range(open_index, len(text)):
                  char = text[index]
                  if char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          return index
              raise RuntimeError('unmatched brace')

          def unwrap_navigation_view(text: str, struct_name: str) -> str:
              struct_marker = f'private struct {struct_name}: View {{'
              struct_start = text.index(struct_marker)
              body_start = text.index('    var body: some View {', struct_start)
              nav_line_start = text.index('        NavigationView {', body_start)
              if nav_line_start - body_start > 80:
                  raise RuntimeError(f'{struct_name}: NavigationView is not the body root')
              open_brace = text.index('{', nav_line_start)
              close_brace = matching_brace(text, open_brace)
              nav_line_end = text.index('\n', nav_line_start) + 1
              inner = text[nav_line_end:close_brace]
              dedented = ''.join(line[4:] if line.startswith('    ') else line for line in inner.splitlines(True))
              tail = '\n        .navigationViewStyle(StackNavigationViewStyle())\n        .ignoresSafeArea(.container, edges: .bottom)'
              tail_start = close_brace + 1
              if not text.startswith(tail, tail_start):
                  preview = text[tail_start:tail_start + 180]
                  raise RuntimeError(f'{struct_name}: unexpected NavigationView tail: {preview!r}')
              return text[:nav_line_start] + dedented + text[tail_start + len(tail):]

          for name in ('V3EmbyHomeView', 'V3EmbyFavoritesView', 'V3EmbySearchView', 'V3EmbyServerSettingsView'):
              source = unwrap_navigation_view(source, name)
          server_path.write_text(source)

          for file_name in ('Sources/UI/EmbyMediaDetailView.swift', 'Sources/UI/EmbyEpisodePickerView.swift'):
              path = Path(file_name)
              text = path.read_text()
              marker = '        .hidesServerDockWhileVisible()\n'
              if text.count(marker) != 1:
                  raise SystemExit(f'unexpected immersive dock modifier count in {file_name}: {text.count(marker)}')
              path.write_text(text.replace(marker, '', 1))

          immersive_path = Path('Sources/UI/ImmersiveUIComponents.swift')
          immersive = immersive_path.read_text()
          for token in ('ServerDockVisibilityController', 'serverDockVisibilityController', 'hidesServerDockWhileVisible()'):
              external = []
              for path in Path('Sources').rglob('*.swift'):
                  if path == immersive_path:
                      continue
                  if token in path.read_text():
                      external.append(str(path))
              if external:
                  raise SystemExit(f'{token} still used outside ImmersiveUIComponents: {external}')

          obsolete_start = immersive.index('final class ServerDockVisibilityController: ObservableObject {')
          backdrop_start = immersive.index('struct ImmersiveBackdrop: View {')
          immersive = immersive[:obsolete_start] + immersive[backdrop_start:]
          obsolete_extension = '    func hidesServerDockWhileVisible() -> some View { modifier(ServerDockHiddenWhileVisibleModifier()) }\n'
          if immersive.count(obsolete_extension) != 1:
              raise SystemExit('unexpected hidesServerDockWhileVisible extension count')
          immersive_path.write_text(immersive.replace(obsolete_extension, '', 1))
          Path('docs/.single-navigation-layout-patched').write_text('single shared Emby NavigationView\n')
          PY

          git diff --check
          git diff -- Sources/UI/EmbyServerRootViewV3.swift Sources/UI/EmbyMediaDetailView.swift Sources/UI/EmbyEpisodePickerView.swift Sources/UI/ImmersiveUIComponents.swift
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Initialize diagnostic logs
        run: |
          : > validate-build.log
          : > build-settings.log
          : > package-resolution.log
          : > mpv-module-maps.log
          : > pods-install.log
          : > source-audit.log

      - name: Validate current source configuration
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee source-audit.log
          import plistlib
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(f"::error::{message}")

          project = Path("project.yml").read_text()
          require('iOS: "15.0"' in project, "project.yml deploymentTarget.iOS must remain 15.0")
          require('deploymentTarget: "15.0"' in project, "app deploymentTarget must remain 15.0")
          require('PRODUCT_BUNDLE_IDENTIFIER: com.embyplayerlab.app' in project, "unexpected bundle identifier")
          require('PRODUCT_NAME: "OS player"' in project, "unexpected product name")
          require('exactVersion: 1.0.0' in project, "MPVKit version changed unexpectedly")

          with Path("Config/Info.plist").open("rb") as handle:
              info = plistlib.load(handle)
          require(info.get("CFBundleDisplayName") == "OS player", "source display name must be OS player")
          require(str(info.get("CFBundleShortVersionString")) == "0.13.3", "source version must be 0.13.3")
          require(str(info.get("CFBundleVersion")) == "69", "source build must be 69")

          required = [
              "Sources/Player/PlayerController.swift",
              "Sources/Player/AVPlayerEngine.swift",
              "Sources/Player/MPVPlayerEngine.swift",
              "Sources/Transport/UnifiedMediaTransportSession.swift",
              "Sources/Transport/RangeHTTPClient.swift",
              "scripts/check_min_os.sh",
              "scripts/validate_built_app.py",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          require(not missing, f"required current source files are missing: {missing}")
          print("Current source configuration: OK")
          PY

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Generate OS player app icons
        run: |
          python3 scripts/generate_os_player_icons.py
          python3 scripts/version_os_player_icons.py

      - name: Generate project
        run: xcodegen generate

      - name: Validate contiguous RangeMap
        run: |
          set -euo pipefail
          swiftc \
            Sources/Transport/SparseByteRangeSet.swift \
            Sources/Cache/PlaybackRangeMap.swift \
            scripts/RangeMapSmoke.swift \
            -o /tmp/emby-range-map-smoke
          /tmp/emby-range-map-smoke

      - name: Install KTVHTTPCache 3.1.0
        run: |
          set -euo pipefail
          set -o pipefail
          pod install --repo-update 2>&1 | tee pods-install.log

      - name: Restore Swift package cache
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: ${{ runner.os }}-mpvkit-1.0.0-ktv-3.1.0-${{ hashFiles('project.yml', 'Podfile') }}

      - name: Resolve MPVKit
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Inspect package module maps
        if: always()
        run: |
          set -u
          if [[ ! -d .spm-cache ]]; then
            echo ".spm-cache does not exist after package resolution." | tee mpv-module-maps.log
            exit 0
          fi
          MODULE_MAP_LIST="$(mktemp)"
          find .spm-cache \( -path '*/Modules/module.modulemap' -o -path '*/module.modulemap' \) -type f | sort > "$MODULE_MAP_LIST"
          if [[ ! -s "$MODULE_MAP_LIST" ]]; then
            echo "No module.modulemap files found under .spm-cache." | tee mpv-module-maps.log
            rm -f "$MODULE_MAP_LIST"
            exit 0
          fi
          {
            while IFS= read -r file; do
              echo "===== $file ====="
              sed -n '1,120p' "$file"
            done < "$MODULE_MAP_LIST"
          } | tee mpv-module-maps.log
          rm -f "$MODULE_MAP_LIST"

      - name: Check project settings
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -showBuildSettings \
            -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee build-settings.log
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0' build-settings.log
          grep -q 'SWIFT_VERSION = 5.0' build-settings.log
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.embyplayerlab.app' build-settings.log
          grep -q 'PRODUCT_NAME = OS player' build-settings.log
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME = OSPlayerIcon' build-settings.log

      - name: Compile for generic iOS device
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build 2>&1 | tee validate-build.log

      - name: Commit validated navigation refactor
        if: success() && steps.navigation_refactor.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add Sources/UI/EmbyServerRootViewV3.swift Sources/UI/EmbyMediaDetailView.swift Sources/UI/EmbyEpisodePickerView.swift Sources/UI/ImmersiveUIComponents.swift docs/.single-navigation-layout-patched
          git commit -m 'refactor: unify Emby navigation host [layout-patched]'
          git push origin HEAD:${{ github.head_ref }}

      - name: Summarize compiler errors
        if: failure()
        run: |
          {
            echo "## First validation/compiler errors"
            echo '```text'
            grep -nE '(^|[[:space:]])(error:|fatal error:)|::error::' source-audit.log validate-build.log build-settings.log package-resolution.log pods-install.log mpv-module-maps.log | head -160 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmbyPlayerLab-validation-logs-${{ github.sha }}
          path: |
            source-audit.log
            validate-build.log
            build-settings.log
            package-resolution.log
            pods-install.log
            mpv-module-maps.log
          if-no-files-found: error
          retention-days: 14
