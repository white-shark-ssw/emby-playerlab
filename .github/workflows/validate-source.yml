name: Validate Source

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # BEGIN V0126 BOOTSTRAP
      - name: Finalize v0.12.6 Build 64
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          python3 scripts/finalize_v0126_main.py
          python3 scripts/check_transport_scheduler_invariants.py
          python3 scripts/check_transport_v3_invariants.py
          python3 scripts/check_seek_stall_invariants.py
          python3 scripts/check_transport_stability_invariants.py
          python3 scripts/check_scheduler_v2_invariants.py
          python3 scripts/check_live_lane_startup_invariants.py
          python3 scripts/check_v0122_regressions.py
          python3 scripts/check_v0123_regressions.py
          python3 scripts/check_v0124_regressions.py
          python3 scripts/check_v0126_frontier_rescue.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/validate-source.yml')
          s = p.read_text()
          s = s.replace('permissions:\n  contents: write\n\n', '', 1)
          start = s.index('      # BEGIN V0126 BOOTSTRAP\n')
          marker = '      # END V0126 BOOTSTRAP\n'
          end = s.index(marker, start) + len(marker)
          p.write_text(s[:start] + s[end:])
          PY
          rm -f scripts/finalize_v0126_main.py .github/workflows/finalize-v0126-main.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'v0.12.6 Build 64: frontier rescue and urgent hedge [v0.12.6-final]'
          git push origin HEAD:main
      # END V0126 BOOTSTRAP

      - name: Initialize diagnostic logs
        run: |
          : > validate-build.log
          : > build-settings.log
          : > package-resolution.log
          : > mpv-module-maps.log
          : > pods-install.log

      - name: Audit transport scheduler invariants
        run: python3 scripts/check_transport_scheduler_invariants.py

      - name: Audit Transport v3 invariants
        run: python3 scripts/check_transport_v3_invariants.py

      - name: Audit seek stall invariants
        run: python3 scripts/check_seek_stall_invariants.py

      - name: Audit transport stability invariants
        run: python3 scripts/check_transport_stability_invariants.py

      - name: Audit Scheduler v2 invariants
        run: python3 scripts/check_scheduler_v2_invariants.py

      - name: Audit live lane/startup invariants
        run: python3 scripts/check_live_lane_startup_invariants.py

      - name: Audit retained v0.12.2 regressions
        run: python3 scripts/check_v0122_regressions.py

      - name: Audit v0.12.3 seek/cache/MPV regressions
        run: python3 scripts/check_v0123_regressions.py

      - name: Audit v0.12.4 scheduler regressions
        run: python3 scripts/check_v0124_regressions.py

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Generate project
        run: xcodegen generate

      - name: Validate contiguous RangeMap
        run: |
          set -euo pipefail
          swiftc \
            Sources/Transport/SparseByteRangeSet.swift \
            Sources/Cache/PlaybackRangeMap.swift \
            scripts/RangeMapSmoke.swift \
            -o /tmp/emby-range-map-smoke
          /tmp/emby-range-map-smoke

      - name: Install KTVHTTPCache 3.1.0
        run: |
          set -euo pipefail
          set -o pipefail
          pod install --repo-update 2>&1 | tee pods-install.log

      - name: Restore Swift package cache
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: ${{ runner.os }}-mpvkit-0.41.0-n8.1.2-ktv-3.1.0-${{ hashFiles('project.yml', 'Podfile') }}

      - name: Resolve MPVKit
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Inspect package module maps
        if: always()
        run: |
          set -u
          if [[ ! -d .spm-cache ]]; then
            echo ".spm-cache does not exist after package resolution." | tee mpv-module-maps.log
            exit 0
          fi
          MODULE_MAP_LIST="$(mktemp)"
          find .spm-cache \( -path '*/Modules/module.modulemap' -o -path '*/module.modulemap' \) -type f | sort > "$MODULE_MAP_LIST"
          if [[ ! -s "$MODULE_MAP_LIST" ]]; then
            echo "No module.modulemap files found under .spm-cache." | tee mpv-module-maps.log
            rm -f "$MODULE_MAP_LIST"
            exit 0
          fi
          {
            while IFS= read -r file; do
              echo "===== $file ====="
              sed -n '1,120p' "$file"
            done < "$MODULE_MAP_LIST"
          } | tee mpv-module-maps.log
          rm -f "$MODULE_MAP_LIST"

      - name: Check project settings
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -showBuildSettings \
            -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee build-settings.log
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0' build-settings.log
          grep -q 'SWIFT_VERSION = 5.0' build-settings.log
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.embyplayerlab.app' build-settings.log

      - name: Compile for generic iOS device
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build 2>&1 | tee validate-build.log

      - name: Summarize compiler errors
        if: failure()
        run: |
          {
            echo "## First compiler errors"
            echo '```text'
            grep -nE '(^|[[:space:]])(error:|fatal error:)' validate-build.log build-settings.log package-resolution.log pods-install.log mpv-module-maps.log | head -100 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmbyPlayerLab-validation-logs-${{ github.sha }}
          path: |
            validate-build.log
            build-settings.log
            package-resolution.log
            pods-install.log
            mpv-module-maps.log
          if-no-files-found: error
          retention-days: 14
