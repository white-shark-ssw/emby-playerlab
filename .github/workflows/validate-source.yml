name: Validate Source

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Initialize diagnostic logs
        run: |
          : > validate-build.log
          : > build-settings.log
          : > package-resolution.log
          : > mpv-module-maps.log

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Restore Swift package cache
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: ${{ runner.os }}-mpvkit-1.0.0-${{ hashFiles('project.yml') }}

      - name: Resolve MPVKit 1.0.0
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project EmbyPlayerLab.xcodeproj \
            -scheme EmbyPlayerLab \
            -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Inspect MPV module maps
        if: always()
        run: |
          set -u
          if [[ ! -d .spm-cache ]]; then
            echo ".spm-cache does not exist after package resolution." | tee mpv-module-maps.log
            exit 0
          fi

          MODULE_MAP_LIST="$(mktemp)"
          find .spm-cache \( -path '*/Modules/module.modulemap' -o -path '*/module.modulemap' \) -type f | sort > "$MODULE_MAP_LIST"

          if [[ ! -s "$MODULE_MAP_LIST" ]]; then
            echo "No module.modulemap files found under .spm-cache." | tee mpv-module-maps.log
            rm -f "$MODULE_MAP_LIST"
            exit 0
          fi

          {
            while IFS= read -r file; do
              echo "===== $file ====="
              sed -n '1,120p' "$file"
            done < "$MODULE_MAP_LIST"
          } | tee mpv-module-maps.log

          rm -f "$MODULE_MAP_LIST"

      - name: Check project settings
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -project EmbyPlayerLab.xcodeproj \
            -scheme EmbyPlayerLab \
            -showBuildSettings \
            -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee build-settings.log
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0' build-settings.log
          grep -q 'SWIFT_VERSION = 5.0' build-settings.log
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.embyplayerlab.app' build-settings.log

      - name: Compile for generic iOS device
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -project EmbyPlayerLab.xcodeproj \
            -scheme EmbyPlayerLab \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build 2>&1 | tee validate-build.log

      - name: Summarize compiler errors
        if: failure()
        run: |
          {
            echo "## First compiler errors"
            echo '```text'
            grep -nE '(^|[[:space:]])(error:|fatal error:)' \
              validate-build.log build-settings.log package-resolution.log mpv-module-maps.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmbyPlayerLab-validation-logs-${{ github.sha }}
          path: |
            validate-build.log
            build-settings.log
            package-resolution.log
            mpv-module-maps.log
          if-no-files-found: error
          retention-days: 14
