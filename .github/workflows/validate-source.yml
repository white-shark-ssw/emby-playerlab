name: Validate Source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: build158-via-validator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build158:
    if: github.event.pull_request.head.ref == 'helper/build158-main-run'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout Build158 source
        uses: actions/checkout@v4
        with:
          ref: refactor/pip-session-0.13.91
          fetch-depth: 0

      - name: Materialize final Build158 architecture
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          c = Path('Sources/UI/PlayerPiPSessionCoordinator.swift')
          text = c.read_text()
          text = text.replace('private var bridge: PlayerSampleBufferPiPBridge?', 'private var pipeline: PlayerPiPSamplePipeline?')
          text = text.replace('let bridge = PlayerSampleBufferPiPBridge(session: session, startPosition: position)', 'let pipeline = PlayerPiPSamplePipeline(session: session, startPosition: position)')
          text = text.replace('self.bridge = bridge', 'self.pipeline = pipeline')
          text = text.replace('bridge.onReady', 'pipeline.onReady').replace('bridge.onFailure', 'pipeline.onFailure').replace('bridge.onSample', 'pipeline.onSample')
          text = text.replace('bridge.setPaused', 'pipeline.setPaused').replace('activeGeneration = bridge.start()', 'activeGeneration = pipeline.start()')
          text = text.replace('private func enqueue(_ envelope: PlayerSampleBufferPiPBridge.SampleEnvelope)', 'private func enqueue(_ envelope: PlayerPiPSamplePipeline.SampleEnvelope)')
          text = text.replace('bridge?.stop()', 'pipeline?.stop()').replace('bridge?.setPaused', 'pipeline?.setPaused')
          text = text.replace('bridge?.stop(); bridge = nil', 'pipeline?.stop(); pipeline = nil')
          text = text.replace('guard let playbackController, let bridge, let displayLayer, let timebase = controlTimebase else', 'guard let playbackController, let pipeline, let displayLayer, let timebase = controlTimebase else')
          text = text.replace('activeGeneration = bridge.seek(to: target)', 'activeGeneration = pipeline.seek(to: target)')
          text = text.replace('        firstVisibleSampleEnqueued = true\n        activeGeneration = pipeline.seek(to: target)', '        activeGeneration = pipeline.seek(to: target)')
          text = text.replace('''        DiagnosticsLogger.shared.playback("PiPSession", "system-start begin homePolicy=same-main-runloop")
        controller.startPictureInPicture()
        DispatchQueue.main.async { [weak self] in
            guard let self, self.state == .startingSystem || self.state == .active else { return }
            let requested = self.homeCoordinator.requestHome()
            DiagnosticsLogger.shared.playback("PiPSession", "home-request issued=\(requested) state=\(self.state.rawValue)")
        }''', '''        DiagnosticsLogger.shared.playback("PiPSession", "system-start begin homePolicy=willStart")
        controller.startPictureInPicture()''')
          old = '''        if pendingSkipGeneration == envelope.generation {
            let completion = pendingSkipCompletion
            pendingSkipCompletion = nil
            pendingSkipGeneration = nil
            controller?.invalidatePlaybackState()
            DiagnosticsLogger.shared.playback("PiPSession", "seek-visible targetPts=\(String(format: "%.3f", envelope.pts)) generation=\(envelope.generation)")
            completion?()
        }'''
          new = '''        if pendingSkipGeneration == envelope.generation {
            let completion = pendingSkipCompletion
            pendingSkipCompletion = nil
            pendingSkipGeneration = nil
            if let timebase = controlTimebase {
                CMTimebaseSetTime(timebase, time: CMTime(seconds: envelope.pts, preferredTimescale: 60000))
                CMTimebaseSetRate(timebase, rate: playbackController?.playbackControlIsPlaying == true ? 1 : 0)
            }
            controller?.invalidatePlaybackState()
            DiagnosticsLogger.shared.playback("PiPSession", "seek-visible targetPts=\(String(format: "%.3f", envelope.pts)) generation=\(envelope.generation) rateRestored=\(playbackController?.playbackControlIsPlaying == true)")
            completion?()
        }'''
          if old in text: text = text.replace(old, new)
          if 'pictureInPictureControllerWillStartPictureInPicture' not in text:
              anchor = '    func pictureInPictureControllerDidStartPictureInPicture(_ pictureInPictureController: AVPictureInPictureController) {'
              assert anchor in text
              method = '''    func pictureInPictureControllerWillStartPictureInPicture(_ pictureInPictureController: AVPictureInPictureController) {
        let requested = homeCoordinator.requestHome()
        DiagnosticsLogger.shared.playback("PiPSession", "system-will-start home-request=\(requested) appState=\(UIApplication.shared.applicationState.rawValue)")
    }

'''
              text = text.replace(anchor, method + anchor, 1)
          c.write_text(text)

          old_bridge = Path('Sources/UI/PlayerSampleBufferPiPBridge.swift')
          if old_bridge.exists(): old_bridge.unlink()

          p = Path('Sources/Player/MPVPlayerEngine.swift')
          text = p.read_text()
          text = text.replace('final class MPVPlayerEngine: PlayerEngine, PlaybackPresentationEngineAdapter {', 'final class MPVPlayerEngine: PlayerEngine, PlaybackPresentationEngineAdapter, PlayerPiPInlineRendererControlling {')
          anchor = '    private var lastPresentationTimingSignature: PresentationTimingSignature?\n'
          if 'private var pictureInPictureRendererSuspended = false' not in text:
              assert text.count(anchor) == 1
              text = text.replace(anchor, anchor + '    private var pictureInPictureRendererSuspended = false\n', 1)
          if 'func suspendInlineRendererForPictureInPicture' not in text:
              anchor2 = '    func play() { setPropertyAsync(name: "pause", value: "no") }\n    func pause() { setPropertyAsync(name: "pause", value: "yes") }\n\n    func setPlaybackRate(_ rate: Double) {'
              assert text.count(anchor2) == 1
              methods = '''    func play() { setPropertyAsync(name: "pause", value: "no") }
    func pause() { setPropertyAsync(name: "pause", value: "yes") }

    func suspendInlineRendererForPictureInPicture(completion: @escaping (Bool) -> Void) {
        queue.async { [weak self] in
            guard let self, let handle = self.mpv, !self.isStopping else { DispatchQueue.main.async { completion(false) }; return }
            if self.pictureInPictureRendererSuspended { DispatchQueue.main.async { completion(true) }; return }
            let previousVO = self.getStringProperty(handle: handle, name: "current-vo") ?? self.getStringProperty(handle: handle, name: "vo") ?? "unknown"
            let success = self.setPropertyChecked(handle: handle, name: "vo", value: "null")
            if success { self.pictureInPictureRendererSuspended = true }
            DiagnosticsLogger.shared.log("MPVPiP", "inline-renderer suspend success=\(success) previousVO=\(previousVO) targetVO=null decoderPreserved=true")
            DispatchQueue.main.async { completion(success) }
        }
    }

    func resumeInlineRendererAfterPictureInPicture(completion: @escaping (Bool) -> Void) {
        queue.async { [weak self] in
            guard let self, let handle = self.mpv, !self.isStopping else { DispatchQueue.main.async { completion(false) }; return }
            guard self.pictureInPictureRendererSuspended else { DispatchQueue.main.async { completion(true) }; return }
            let success = self.setPropertyChecked(handle: handle, name: "vo", value: "gpu-next")
            guard success else { DispatchQueue.main.async { completion(false) }; return }
            self.pollPictureInPictureRendererRestore(handle: handle, attempt: 0, completion: completion)
        }
    }

    private func pollPictureInPictureRendererRestore(handle: OpaquePointer, attempt: Int, completion: @escaping (Bool) -> Void) {
        guard let currentHandle = mpv, currentHandle == handle, !isStopping else { DispatchQueue.main.async { completion(false) }; return }
        let currentVO = getStringProperty(handle: handle, name: "current-vo") ?? "unknown"
        if let viewport = rendererViewportSize(handle: handle), currentVO != "null" {
            pictureInPictureRendererSuspended = false
            DiagnosticsLogger.shared.log("MPVPiP", "inline-renderer restore ready=true vo=\(currentVO) viewport=\(Int(viewport.width))x\(Int(viewport.height)) attempts=\(attempt)")
            DispatchQueue.main.async { completion(true) }
            return
        }
        guard attempt < 60 else {
            pictureInPictureRendererSuspended = false
            DiagnosticsLogger.shared.log("MPVPiP", "inline-renderer restore ready=false vo=\(currentVO) attempts=\(attempt)")
            DispatchQueue.main.async { completion(false) }
            return
        }
        queue.asyncAfter(deadline: .now() + 0.025) { [weak self] in self?.pollPictureInPictureRendererRestore(handle: handle, attempt: attempt + 1, completion: completion) }
    }

    func setPlaybackRate(_ rate: Double) {'''
              text = text.replace(anchor2, methods, 1)
              fallback = '    func play() {}\n    func pause() {}\n    func setVideoGeometry(panscan: Double, aspectOverride: String?) {}'
              assert text.count(fallback) == 1
              text = text.replace(fallback, '    func play() {}\n    func pause() {}\n    func suspendInlineRendererForPictureInPicture(completion: @escaping (Bool) -> Void) { completion(false) }\n    func resumeInlineRendererAfterPictureInPicture(completion: @escaping (Bool) -> Void) { completion(false) }\n    func setVideoGeometry(panscan: Double, aspectOverride: String?) {}', 1)
          p.write_text(text)
          PY
          git diff --check
          git add -A Sources
          git commit -m 'Build158: finalize modular PiP session' || true
          git push origin HEAD:refactor/pip-session-0.13.91

      - name: Verify Build158 contracts
        run: |
          set -euo pipefail
          test ! -e Sources/UI/PlayerSampleBufferPiPBridge.swift
          grep -Fq 'final class PlayerPiPSamplePipeline' Sources/UI/PlayerPiPSamplePipeline.swift
          grep -Fq 'kCMSampleAttachmentKey_DoNotDisplay' Sources/UI/PlayerPiPSamplePipeline.swift
          grep -Fq 'private var pipeline: PlayerPiPSamplePipeline?' Sources/UI/PlayerPiPSessionCoordinator.swift
          grep -Fq 'pictureInPictureControllerWillStartPictureInPicture' Sources/UI/PlayerPiPSessionCoordinator.swift
          grep -Fq 'targetVO=null decoderPreserved=true' Sources/Player/MPVPlayerEngine.swift
          ! grep -Fq 'vid", value: "no"' Sources/Player/MPVPlayerEngine.swift
          git fetch origin lab/pip-samplebuffer-0.13.89 --depth=1
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          def seek_body(text):
              s=text.index('    func seek(to seconds: Double, direction: SeekDirection)')
              e=text.index('\n    private func claimKeyframeLookupIndex()', s)
              return text[s:e]
          head=Path('Sources/Player/MPVPlayerEngine.swift').read_text()
          base=subprocess.check_output(['git','show','origin/lab/pip-samplebuffer-0.13.89:Sources/Player/MPVPlayerEngine.swift'],text=True)
          assert seek_body(head)==seek_body(base)
          PY
          git diff --check

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: |
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Build Build158 Release
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache >/dev/null
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.91 CURRENT_PROJECT_VERSION=158 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Validate and package
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.91' --build '158' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log
          rm -rf Payload && mkdir Payload && cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.91-build158-pip-session-unsigned.ipa'
          zip -qry "$IPA" Payload
          shasum -a 256 "$IPA" > "$IPA.sha256"

      - name: Upload Build158
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.91-build158-pip-session
          path: |
            OnePlayer-0.13.91-build158-pip-session-unsigned.ipa
            OnePlayer-0.13.91-build158-pip-session-unsigned.ipa.sha256
            build.log
            app-validation.log
            min-os-report.log
          retention-days: 14
