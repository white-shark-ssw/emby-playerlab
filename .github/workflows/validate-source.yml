name: Validate Source

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch-detail-immersive:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chatgpt/detail-immersive-toggle-navigation-race-20260811'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply exact detail/root patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('Sources/UI/EmbyServerRootViewV3.swift')
          text = root.read_text()
          old = '''                    }
                    .frame(width: geometry.size.width, height: fullHeight, alignment: .top)
                    .ignoresSafeArea(.container, edges: .bottom)
'''
          new = '''                    }
                    .environment(\\.serverDockContent, AnyView(serverTabBar))
                    .frame(width: geometry.size.width, height: fullHeight, alignment: .top)
                    .ignoresSafeArea(.container, edges: .bottom)
'''
          if '.environment(\\.serverDockContent, AnyView(serverTabBar))' not in text:
              if text.count(old) != 1: raise SystemExit(f'root patch mismatch: {text.count(old)}')
              text = text.replace(old, new, 1)
              root.write_text(text)

          detail = Path('Sources/UI/EmbyMediaDetailView.swift')
          text = detail.read_text()
          if 'let fullHeight = geometry.size.height + geometry.safeAreaInsets.bottom' in text:
              text = text.replace('            let fullHeight = geometry.size.height + geometry.safeAreaInsets.bottom\n', '', 1)
              count = text.count('.frame(width: geometry.size.width, height: fullHeight)')
              if count != 2: raise SystemExit(f'detail frame mismatch: {count}')
              text = text.replace('.frame(width: geometry.size.width, height: fullHeight)', '.frame(width: geometry.size.width, height: geometry.size.height)')
          if '.hidesServerDockWhileVisible()' in text:
              if text.count('        .hidesServerDockWhileVisible()\n') != 1: raise SystemExit('detail modifier mismatch')
              text = text.replace('        .hidesServerDockWhileVisible()\n', '        .detailPagePresentation()\n        .onAppear { DiagnosticsLogger.shared.log("NavigationRace", "event=detail-appear item=\\(model.item.id)") }\n        .onDisappear { DiagnosticsLogger.shared.log("NavigationRace", "event=detail-disappear item=\\(model.item.id)") }\n', 1)
          detail.write_text(text)

          staged = Path('.github/workflows/one-shot-detail-immersive-patch.yml')
          if staged.exists(): staged.unlink()
          PY
          git diff --check
          if git diff --quiet; then
            echo 'Feature branch already patched.'
            exit 0
          fi
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add -A
          git commit -m 'feat: wire immersive detail viewport and dock mode [detail-immersive-patched]'
          git push origin HEAD:chatgpt/detail-immersive-toggle-navigation-race-20260811

  validate:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Initialize diagnostic logs
        run: |
          : > validate-build.log
          : > build-settings.log
          : > package-resolution.log
          : > mpv-module-maps.log
          : > pods-install.log
          : > source-audit.log

      - name: Validate current source configuration
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee source-audit.log
          import plistlib
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(f"::error::{message}")

          project = Path("project.yml").read_text()
          require('iOS: "15.0"' in project, "project.yml deploymentTarget.iOS must remain 15.0")
          require('deploymentTarget: "15.0"' in project, "app deploymentTarget must remain 15.0")
          require('PRODUCT_BUNDLE_IDENTIFIER: com.embyplayerlab.app' in project, "unexpected bundle identifier")
          require('PRODUCT_NAME: "OS player"' in project, "unexpected product name")
          require('exactVersion: 1.0.0' in project, "MPVKit version changed unexpectedly")

          with Path("Config/Info.plist").open("rb") as handle:
              info = plistlib.load(handle)
          require(info.get("CFBundleDisplayName") == "OS player", "source display name must be OS player")
          require(str(info.get("CFBundleShortVersionString")) == "0.13.3", "source version must be 0.13.3")
          require(str(info.get("CFBundleVersion")) == "69", "source build must be 69")

          required = [
              "Sources/Player/PlayerController.swift",
              "Sources/Player/AVPlayerEngine.swift",
              "Sources/Player/MPVPlayerEngine.swift",
              "Sources/Transport/UnifiedMediaTransportSession.swift",
              "Sources/Transport/RangeHTTPClient.swift",
              "scripts/check_min_os.sh",
              "scripts/validate_built_app.py",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          require(not missing, f"required current source files are missing: {missing}")
          print("Current source configuration: OK")
          PY

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Generate OS player app icons
        run: |
          python3 scripts/generate_os_player_icons.py
          python3 scripts/version_os_player_icons.py

      - name: Generate project
        run: xcodegen generate

      - name: Validate contiguous RangeMap
        run: |
          set -euo pipefail
          swiftc \
            Sources/Transport/SparseByteRangeSet.swift \
            Sources/Cache/PlaybackRangeMap.swift \
            scripts/RangeMapSmoke.swift \
            -o /tmp/emby-range-map-smoke
          /tmp/emby-range-map-smoke

      - name: Install KTVHTTPCache 3.1.0
        run: |
          set -euo pipefail
          set -o pipefail
          pod install --repo-update 2>&1 | tee pods-install.log

      - name: Restore Swift package cache
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: ${{ runner.os }}-mpvkit-1.0.0-ktv-3.1.0-${{ hashFiles('project.yml', 'Podfile') }}

      - name: Resolve MPVKit
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Inspect package module maps
        if: always()
        run: |
          set -u
          if [[ ! -d .spm-cache ]]; then
            echo ".spm-cache does not exist after package resolution." | tee mpv-module-maps.log
            exit 0
          fi
          MODULE_MAP_LIST="$(mktemp)"
          find .spm-cache \( -path '*/Modules/module.modulemap' -o -path '*/module.modulemap' \) -type f | sort > "$MODULE_MAP_LIST"
          if [[ ! -s "$MODULE_MAP_LIST" ]]; then
            echo "No module.modulemap files found under .spm-cache." | tee mpv-module-maps.log
            rm -f "$MODULE_MAP_LIST"
            exit 0
          fi
          {
            while IFS= read -r file; do
              echo "===== $file ====="
              sed -n '1,120p' "$file"
            done < "$MODULE_MAP_LIST"
          } | tee mpv-module-maps.log
          rm -f "$MODULE_MAP_LIST"

      - name: Check project settings
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -showBuildSettings \
            -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee build-settings.log
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0' build-settings.log
          grep -q 'SWIFT_VERSION = 5.0' build-settings.log
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.embyplayerlab.app' build-settings.log
          grep -q 'PRODUCT_NAME = OS player' build-settings.log
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME = OSPlayerIcon' build-settings.log

      - name: Compile for generic iOS device
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build 2>&1 | tee validate-build.log

      - name: Summarize compiler errors
        if: failure()
        run: |
          {
            echo "## First validation/compiler errors"
            echo '```text'
            grep -nE '(^|[[:space:]])(error:|fatal error:)|::error::' source-audit.log validate-build.log build-settings.log package-resolution.log pods-install.log mpv-module-maps.log | head -160 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmbyPlayerLab-validation-logs-${{ github.sha }}
          path: |
            source-audit.log
            validate-build.log
            build-settings.log
            package-resolution.log
            pods-install.log
            mpv-module-maps.log
          if-no-files-found: error
          retention-days: 14
