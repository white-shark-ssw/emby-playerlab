name: Patch Build288 Navigation Evidence Docs

on:
  push:
    branches: [docs/build288-nav-evidence-20261005]

permissions:
  contents: write

concurrency:
  group: patch-build288-nav-evidence
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove superseded Build287 module-status row
        run: |
          set -euo pipefail
          EXPECTED_MAIN=07368c868deda7092281010f4632293aee0bad53
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/project/MODULE_STATUS.md')
          text = path.read_text()
          stale_prefix = '| Detail immersive navigation appearance | **Active — Build287 CI/IPA verified; real-device repair pending** |'
          lines = text.splitlines()
          matches = [line for line in lines if line.startswith(stale_prefix)]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one stale Build287 module row, found {len(matches)}')
          lines = [line for line in lines if not line.startswith(stale_prefix)]
          updated = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          required = '| Detail immersive navigation / still viewer | **Active — Build287 rejected; Build288 diagnostic CI/IPA ready** |'
          if required not in updated:
              raise SystemExit('Build288 replacement row missing')
          path.write_text(updated)
          PY
          git diff --check
          git diff -- docs/project/MODULE_STATUS.md

      - name: Commit cleanup to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/MODULE_STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m "Remove superseded Build287 module status"
          git push origin HEAD:main
