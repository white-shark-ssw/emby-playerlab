name: Patch Build288 Navigation Evidence Docs

on:
  push:
    branches: [docs/build288-nav-evidence-20261005]

permissions:
  contents: write

concurrency:
  group: patch-build288-nav-evidence
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify expected main and patch project evidence
        run: |
          set -euo pipefail
          EXPECTED_MAIN=4b6c9204beef22c3ec580a91dbbc442b4d981f51
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('docs/project/BUILD_TEST_INDEX.md')
          index = index_path.read_text()
          marker = '## Build287 / Build288 — Detail immersive navigation regression'
          if marker not in index:
              index += '''\n\n## Build287 / Build288 — Detail immersive navigation regression\n\n- **Build287 / OnePlayer 0.15.20** — target-device **rejected** on 2026-10-05. Exact source `5b8806a0de63618e4f520b70f2e353952f327ecc`, draft PR #290, stacked on exact Build286 `7e7b2ec944f5c0e74bc291e37683f1529e3d46b4`. It changed still-viewer close ordering so UIKit host dismissal completed before clearing `selectedStillIndex`. Although its CI/IPA had passed, the user reported a materially worse target-device regression: a small downward detail scroll could now reveal the opaque system navigation bar/native back title, whereas Build286 required additional conditions. **Evidence: Code written ✅ / CI passed ✅ / IPA produced ✅ / real-device rejected ❌ / stable ❌.** The dismiss-first hypothesis is retired.\n- **Build288 / OnePlayer 0.15.21** — diagnostic candidate only; no repair claim. Exact product source `ce565996e37dcb750117c9de4607b23b673edce3` restores Build286 still-viewer ordering and adds only narrow `StillViewer` present/close/dismiss lifecycle logs in `EmbyDetailOverlayViews.swift` plus AppIdentity. `ImmersiveUIComponents.swift`, `EmbyMediaDetailView.swift`, `EmbyServerBrowseV3.swift`, Home runtime and Player/Transport/Cache/Session remain unchanged. Xcode 16.4 run/job `37296666668 / 111719392128` succeeded. Artifact `OnePlayer-0.15.21-build288-detail-nav-diagnostics`, ID `11340525765`, digest `sha256:9bbc4b5636f446f882025531bf33ac9a6b99512963f560fa9039ca0c0e111449`; IPA SHA-256 `f1100a6b2b344c6615ad20c2328cf096d52c84b46bf10a0402dad52ae5fa7eed`; source ZIP SHA-256 `ea963fe5f8d7d0a9303a8dcef48ddc1b2fe2947b376b527988eb06a6655d8609`; built `MinimumOSVersion=15.0`. Independent archive/identity/source-order verification passed. **Evidence: Code written ✅ / exact scope ✅ / CI passed ✅ / IPA produced+verified ✅ / target-device diagnostic pending ❌ / stable ❌.**\n'''
              index_path.write_text(index)

          status_path = Path('docs/project/MODULE_STATUS.md')
          status = status_path.read_text()
          row = '| Detail immersive navigation / still viewer | **Active — Build287 rejected; Build288 diagnostic CI/IPA ready** | Build287/0.15.20 worsened the target-device opaque top-bar/native-back-title regression and is rejected. Build288/0.15.21 exact source `ce565996e37dcb750117c9de4607b23b673edce3` restores Build286 still-viewer ordering and adds lifecycle diagnostics only; run/job `37296666668 / 111719392128`, artifact `11340525765`, IPA SHA `f1100a6b2b344c6615ad20c2328cf096d52c84b46bf10a0402dad52ae5fa7eed`, MinOS 15.0. Real-device diagnostic pending; native system navigation ownership and Build182/184/191/216 remain protected. |'
          if row not in status:
              anchor = '| Native navigation | Frozen principle | System owns push/pop and interactive pop. |\n'
              if anchor not in status:
                  raise SystemExit('MODULE_STATUS native navigation anchor missing')
              status = status.replace(anchor, anchor + row + '\n', 1)
              status_path.write_text(status)
          PY
          git diff --check
          git diff -- docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md

      - name: Commit evidence docs to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m "Index Build287 rejection and Build288 diagnostic candidate"
          git push origin HEAD:main
