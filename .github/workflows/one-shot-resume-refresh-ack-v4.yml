name: One-shot resume refresh acknowledgement patch v4

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/resume-refresh-ack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fix patch scopes and apply source patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/one_shot_resume_refresh_ack.py')
          text = p.read_text()

          old_state = '''if "private var resumeDirty = false" not in tail:
              tail = replace_once(
                  tail,
                  ''' + "'''" + '''    private(set) var hasLoaded = false\n''' + "'''" + ''',
                  ''' + "'''" + '''    private(set) var hasLoaded = false\n    private var resumeDirty = false\n    private var dirtyResumeItemIDs = Set<String>()\n''' + "'''" + ''',
                  "home dirty state",
              )
          '''
          new_state = '''if "private var resumeDirty = false" not in tail:
              old_state = "    private(set) var hasLoaded = false\\n"
              new_state = "    private(set) var hasLoaded = false\\n    private var resumeDirty = false\\n    private var dirtyResumeItemIDs = Set<String>()\\n"
              state_index = tail.find(old_state)
              if state_index < 0:
                  raise SystemExit("home dirty state: marker missing")
              tail = tail[:state_index] + new_state + tail[state_index + len(old_state):]
          '''
          if old_state in text:
              text = text.replace(old_state, new_state, 1)

          old_full = '''# Clear dirty markers when the full refresh succeeds.
          full_marker = ''' + "'''" + '''            resumeItems = uniqueItems(resume).filter { ["movie", "episode"].contains($0.type?.lowercased() ?? "") }\n''' + "'''" + '''
          if "resumeDirty = false" not in tail[tail.index("func refresh(userInitiated"):tail.index("private func refreshResumeOnly")]:
              tail = replace_once(
                  tail,
                  full_marker,
                  full_marker + ''' + "'''" + '''            resumeDirty = false\n            dirtyResumeItemIDs.removeAll()\n''' + "'''" + ''',
                  "home full resume assignment",
              )
          '''
          new_full = '''# Clear dirty markers when the full refresh succeeds.
          full_marker = "            resumeItems = uniqueItems(resume).filter { [\\\"movie\\\", \\\"episode\\\"].contains($0.type?.lowercased() ?? \\\"\\\") }\\n"
          refresh_start = tail.index("    func refresh(userInitiated: Bool = false) async {")
          refresh_end = tail.index("    private func refreshResumeOnly() async", refresh_start)
          refresh_block = tail[refresh_start:refresh_end]
          if "resumeDirty = false" not in refresh_block:
              marker_index = refresh_block.find(full_marker)
              if marker_index < 0:
                  raise SystemExit("home full resume assignment: marker missing")
              replacement = full_marker + "            resumeDirty = false\\n            dirtyResumeItemIDs.removeAll()\\n"
              refresh_block = refresh_block[:marker_index] + replacement + refresh_block[marker_index + len(full_marker):]
              tail = tail[:refresh_start] + refresh_block + tail[refresh_end:]
          '''
          if old_full not in text:
              raise SystemExit('runner full assignment block not found')
          text = text.replace(old_full, new_full, 1)
          p.write_text(text)
          PY
          python3 scripts/one_shot_resume_refresh_ack.py
          rm -f .github/workflows/one-shot-resume-refresh-ack-v3.yml .github/workflows/one-shot-resume-refresh-ack-v4.yml
          git diff --check
          grep -q 'playbackStoppedReason' Sources/Core/EmbyUserDataChange.swift
          grep -q 'refresh(userInitiated: true)' Sources/UI/EmbyServerRootViewV3.swift
          grep -q 'refreshPlaybackUserData' Sources/UI/EmbyMediaDetailView.swift
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add -A
          git commit -m 'fix: synchronize resume refresh after playback stop'
          git push origin HEAD:fix/resume-refresh-ack
