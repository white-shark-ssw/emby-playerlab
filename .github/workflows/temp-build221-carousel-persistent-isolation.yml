name: Build221 Carousel Persistent Isolation IPA

on:
  push:
    branches: [diag/home-carousel-persistent-drag-isolation-build221]
    paths:
      - ".github/build221-carousel-persistent-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build221 branch
        uses: actions/checkout@v4
        with:
          ref: diag/home-carousel-persistent-drag-isolation-build221
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact Build221 patch
        run: |
          set -euo pipefail
          python3 scripts/temp_apply_build221.py
          git diff --check
          python3 scripts/check_home_carousel_single_owner.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Diag: isolate persistent backdrop during carousel drag"
          git push origin HEAD:diag/home-carousel-persistent-drag-isolation-build221
          echo "BUILD221_SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate exact Build221 scope and Frozen contracts
        run: |
          set -euo pipefail
          base='a5050075ccceaf46196696bfa3b812293800f340'
          git diff --check "$base"...HEAD
          python3 scripts/check_home_carousel_single_owner.py
          python3 - <<'PY'
          import subprocess
          base = 'a5050075ccceaf46196696bfa3b812293800f340'
          allowed = {
              '.github/build221-carousel-persistent-trigger.txt',
              '.github/workflows/temp-build221-carousel-persistent-isolation.yml',
              'Sources/Core/AppIdentity.swift',
              'Sources/UI/EmbyHomeHeroV3.swift',
              'docs/changelog/CHANGELOG_v0_14_54_build221.md',
              'scripts/check_home_carousel_single_owner.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', f'{base}...HEAD'], text=True).splitlines())
          extra = sorted(changed - allowed)
          if extra:
              raise SystemExit(f'Unexpected Build221 files: {extra}')
          required = {
              'Sources/Core/AppIdentity.swift',
              'Sources/UI/EmbyHomeHeroV3.swift',
              'docs/changelog/CHANGELOG_v0_14_54_build221.md',
              'scripts/check_home_carousel_single_owner.py',
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(f'Missing Build221 files: {missing}')
          frozen_prefixes = ('Sources/Player/', 'Sources/Transport/', 'Sources/Cache/', 'Sources/Session/', 'Sources/AVIO/')
          touched_frozen = sorted(path for path in changed if path.startswith(frozen_prefixes))
          if touched_frozen:
              raise SystemExit(f'Build221 touched Frozen/P0 paths: {touched_frozen}')
          forbidden = {
              'Sources/UI/EmbyHomeCarouselInteractionV3.swift',
              'Sources/UI/EmbyHomeCarouselStateV3.swift',
              'Sources/UI/EmbyHomeCoreV3.swift',
              'Sources/UI/EmbySharedImageAndNavigation.swift',
              'Sources/UI/EmbyHomeCarouselCadenceDiagnosticsV3.swift',
          }
          touched_forbidden = sorted(changed & forbidden)
          if touched_forbidden:
              raise SystemExit(f'Build221 unexpectedly changed retained/shared owners: {touched_forbidden}')
          print('Build221 exact persistent-drag isolation scope: PASS')
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Prepare OnePlayer app icons
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache | tee package-resolution.log

      - name: Build Release
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            MARKETING_VERSION=0.14.54 \
            CURRENT_PROJECT_VERSION=221 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build221.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id com.embyplayerlab.app --version 0.14.54 --build 221 --display-name OnePlayer --minimum-os 15.0 --primary-icon OnePlayerIcon --alternate-icon OnePlayerAltIcon

      - name: Validate MinOS
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" 15.0 17.0 build221-min-os.log build221.log

      - name: Package unsigned IPA and source snapshot
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA="OnePlayer-0.14.54-build221-home-carousel-persistent-isolation-unsigned.ipa"
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA"
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          SOURCE="OnePlayer-0.14.54-build221-source.zip"
          git archive --format=zip --output "$SOURCE" HEAD
          shasum -a 256 "$SOURCE" | tee "$SOURCE.sha256"
          printf '%s\n' "$BUILD221_SOURCE" > build221-source-sha.txt
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"

      - name: Upload Build221 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.54-build221-home-carousel-persistent-isolation
          path: |
            ${{ env.IPA }}
            ${{ env.IPA }}.sha256
            ${{ env.SOURCE }}
            ${{ env.SOURCE }}.sha256
            build221-source-sha.txt
            build221.log
            build221-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30
