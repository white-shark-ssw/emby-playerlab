name: Temp sync Build218 real-device

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sync-build218-realdevice.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct poster shared display transparency
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin perf/poster-grid-smoothness
          git checkout -B perf/poster-grid-smoothness origin/perf/poster-grid-smoothness
          test "$(git rev-parse HEAD)" = "ccc3a69f3b77c56a730593f072a2c7dfde599073"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Sources/UI/EmbySharedImageAndNavigation.swift')
          text = path.read_text()
          old = '''    func setImage(_ image: UIImage?) {
              imageView.image = image
              placeholderView.isHidden = image != nil
          }
          '''
          new = '''    func setImage(_ image: UIImage?) {
              imageView.image = image
              backgroundColor = image == nil ? .secondarySystemBackground : .clear
              placeholderView.isHidden = image != nil
          }
          '''
          if old not in text:
              raise SystemExit('expected Build218 setImage block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 scripts/check_poster_grid_smoothness.py
          git diff --check
          test "$(git diff --name-only)" = "Sources/UI/EmbySharedImageAndNavigation.swift"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/UI/EmbySharedImageAndNavigation.swift
          git commit -m "Preserve transparent shared display images"
          git push origin HEAD:perf/poster-grid-smoothness
          git rev-parse HEAD > /tmp/poster_head

      - name: Sync Build218 project evidence
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          POSTER_HEAD="$(cat /tmp/poster_head)"
          export POSTER_HEAD
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          poster_head = os.environ['POSTER_HEAD']

          task_path = Path('docs/project/current/dev/DEV-poster-grid-smoothness.md')
          task = task_path.read_text()
          task = task.replace(
              '**Active — Build212 / 0.14.45 target-device source-aware diagnostics captured. Home and grid now separate into two evidence-backed paths: Home dragging hitches are tied to memory-hit callback-role 1400px carousel image publishes while callback/contrast work itself is only 1–3 ms; grid has 11 real dragging hitches tied to newly visible 378px network display-image publishes. The earlier single cross-page-root-cause assumption is rejected. No runtime fix is claimed yet; Home changes require reconciliation with the active carousel task, while grid needs a minimal display-image publish/render fix candidate.**',
              '**Active — Build218 / 0.14.51 CI/IPA was verified and has now been target-device tested on Home. The user still feels obvious Home vertical hitching, and the supplied 30fps recording retains the stop-frame → catch-up signature, so Build218 does not solve Home. Grid 3×3 A/B remains unreported and must not be inferred from the Home result. Build218 also exposed a visual regression: the new shared UIKit display surface left `secondarySystemBackground` behind transparent carousel Logo images. Exact source inspection proves the carousel owner file itself was unchanged; the regression came from poster-task shared infrastructure. The poster branch now contains only the minimal shared-surface transparency correction; no carousel owner file is modified. This correction is code-written only and has no new CI/IPA evidence yet.**'
          )
          marker = '## Parallel safety\n'
          if '## Build218 / 0.14.51 — target-device result' not in task:
              section = f'''## Build218 / 0.14.51 — target-device result\n\nExact tested source: **`ccc3a69f3b77c56a730593f072a2c7dfde599073`**. CI run/job **`33066739271 / 98498551491`** succeeded; artifact ID **`9644109849`**; artifact ZIP SHA-256 `16096a2c3a1b4dcb4ed3bcfa8524e3839f9114eb040e7ee419279555c1e71c4e`; IPA SHA-256 `104eb5266c304102c912eaa2b9e95a4f0ae6183b0bf071fd377b3a52ea8d57bc`; source ZIP SHA-256 `41dfb97a0bfd38cb65ed000b3f9fc2679dc7bf471abe7635020895a5f4f12b90`; OnePlayer 0.14.51 (218), MinOS 15.0 independently verified.\n\nTarget-device evidence supplied 2026-08-27:\n\n- User report: **Home still has obvious vertical jitter**. This is the highest-priority evidence and Build218 must not be described as a Home fix.\n- Recording `RPReplay_Final1787833032.mp4`: 510×1108, 30fps, 691 frames, ~23.03s. Frame-to-frame crop translation retains clear stop/catch-up examples: around 6.50s movement is ~2.85 recorded px, 6.53s ~0, 6.57s ~11.98px; around 20.13s ~1.14px, 20.17–20.20s ~0, then 20.23s ~9.07px. 30fps remains only a lower-bound observation of the 120Hz device.\n- This test only establishes the Home result. The user did not provide a 3×3 grid A/B result in this turn, so Build218 grid effectiveness remains pending.\n- Screenshot shows a rectangular background behind the carousel movie Logo. Exact source proves `Sources/UI/EmbyHomeHeroV3.swift` is byte-identical between accepted Build216 main and Build218 (`8a2d5ec00cdd2daa3ef116930e388f18791b580b`). The Logo call uses `EmbyCachedRemoteImage(... contentMode: .fit, showsLoadingIndicator: false)` with no callback, so Build218 routed it through the new poster-task UIKit display surface. That surface kept `backgroundColor = .secondarySystemBackground` even after a transparent Logo loaded, unlike the prior SwiftUI path where that background existed only while no image was present. Therefore the white rectangle **is a Build218 shared-image regression**, not a carousel-owner change.\n- Minimal correction now written on poster branch head **`{poster_head}`**: when the UIKit surface has an image, its background becomes `.clear`; when image is nil it keeps `.secondarySystemBackground`. No Home carousel owner source is touched.\n\n**Evidence now: Build218 code/CI/IPA ✅ / Build218 Home target-device tested and still hitches ❌ / Build218 grid A/B pending / Build218 distributed package has a confirmed transparent-Logo regression ❌ / transparency correction code written ✅ / corrected source CI/IPA pending / not stable.**\n\n'''
              task = task.replace(marker, section + marker, 1)
          task = re.sub(
              r'## Next exact action\n.*?\n## Do not repeat',
              '''## Next exact action\n\n1. Do not modify Home carousel owner files from this task. Build218 Home still hitches, while Build212 already established Home as the separate 1400px carousel-image path owned jointly with the active carousel work.\n2. Treat Build218 as not acceptable for distribution because of the transparent-Logo regression, even though the regression is in shared poster-task infrastructure rather than carousel owner code.\n3. Validate the one-line shared-surface transparency correction with the poster source checker and exact diff, then allocate a new unique poster Build only after checking all Active task identities.\n4. The next poster package should preserve the same grid UIKit-display experiment plus the transparency correction; target-device testing must explicitly cover Library 3×3 / Favorites / More / Search / Tag / Person-Actor grids. Home should be checked only for regression, not used to claim the grid candidate failed.\n5. Preserve all P0 playback/transport/cache/session contracts and iOS 15.0 deployment.\n\n## Do not repeat''',
              task,
              flags=re.S,
          )
          task_path.write_text(task)

          module_path = Path('docs/project/MODULE_STATUS.md')
          module = module_path.read_text()
          module = re.sub(
              r'^\| Poster 3-column / poster-heavy scroll smoothness \|.*$',
              f'| Poster 3-column / poster-heavy scroll smoothness | **Active — Build218 Home target-device still hitches; grid A/B pending; shared transparency regression corrected in source only** | Build218 / 0.14.51 exact tested source `ccc3a69f3b77c56a730593f072a2c7dfde599073` passed CI/IPA (`33066739271 / 98498551491`, artifact `9644109849`, IPA SHA-256 `104eb5266c304102c912eaa2b9e95a4f0ae6183b0bf071fd377b3a52ea8d57bc`, MinOS 15.0). Target-device Home recording still shows obvious stop/catch-up hitching, so Build218 is not a Home fix. Grid 3×3 effectiveness remains unreported. The screenshot white rectangle behind the carousel Logo is confirmed to be a Build218 shared-image regression: carousel owner source is unchanged, but its transparent Logo matched the new no-callback/no-spinner UIKit display path whose background stayed `secondarySystemBackground` after load. Poster branch head `{poster_head}` now only restores clear background while an image is present; no carousel owner file changed. Corrected source has no CI/IPA yet and is not stable. |',
              module,
              flags=re.M,
          )
          module_path.write_text(module)

          build_path = Path('docs/project/BUILD_TEST_INDEX.md')
          build = build_path.read_text()
          if '| **Build218 / 0.14.51** |' not in build:
              row = '| **Build218 / 0.14.51** | Poster grid UIKit display candidate | **CI/IPA verified; Home target-device still visibly hitches; grid A/B not yet reported; distributed package has a confirmed transparent-Logo regression.** Exact source `ccc3a69f3b77c56a730593f072a2c7dfde599073`; run/job `33066739271 / 98498551491`; artifact `9644109849`; IPA SHA-256 `104eb5266c304102c912eaa2b9e95a4f0ae6183b0bf071fd377b3a52ea8d57bc`; MinOS 15.0. The carousel owner file was unchanged, but its transparent Logo entered the poster-task shared UIKit display path and exposed the surface background. Poster branch head `' + poster_head + '` now contains only the transparency-semantic correction; corrected source has no CI/IPA yet. Not stable. |\n'
              anchor = '| **Build216 / 0.14.49** | Detail episode-range inertia interruption |'
              pos = build.find(anchor)
              if pos == -1:
                  raise SystemExit('Build216 row anchor not found')
              end = build.find('\n', pos)
              build = build[:end+1] + row + build[end+1:]
          build_path.write_text(build)

          state_path = Path('docs/project/PROJECT_STATE.md')
          state = state_path.read_text()
          state = re.sub(
              r'^_Last updated.*_$',
              '_Last updated after Build218 / 0.14.51 poster-grid candidate target-device Home testing. Build216 remains the latest real-device accepted overall runtime baseline for merged product work; Home-carousel Build217 remains an independent diagnostic line, while poster Build218 is CI/IPA verified but not accepted: Home still visibly hitches, grid A/B is pending, and a shared transparent-Logo presentation regression was identified and corrected in source only._',
              state,
              count=1,
              flags=re.M,
          )
          poster_section = f'''## Active: Poster-heavy scrolling smoothness\n\nWork: `DEV-poster-grid-smoothness`.\n\n- Build212 remains the controlling route-split diagnostic: Home dragging hitches correlate with 1400px carousel callback-role image publication, while 11 true grid dragging hitches correlate with newly visible `network/display/Primary/378` publication. Home and grid remain separate runtime paths.\n- Build218 / 0.14.51 exact tested source `ccc3a69f3b77c56a730593f072a2c7dfde599073`; run/job `33066739271 / 98498551491` success; artifact ID `9644109849`; artifact SHA-256 `16096a2c3a1b4dcb4ed3bcfa8524e3839f9114eb040e7ee419279555c1e71c4e`; IPA SHA-256 `104eb5266c304102c912eaa2b9e95a4f0ae6183b0bf071fd377b3a52ea8d57bc`; source ZIP SHA-256 `41dfb97a0bfd38cb65ed000b3f9fc2679dc7bf471abe7635020895a5f4f12b90`; MinOS 15.0.\n- Build218 changed only the pure display-image presentation path: no callback/no spinner images receive the existing loader output through a UIKit `UIImageView` surface so surrounding SwiftUI poster cells do not observe the loader's image publication. Carousel owner files were not modified.\n- 2026-08-27 target-device result: the user still feels **obvious Home vertical jitter**. The supplied 510×1108@30fps recording retains stop/catch-up frames, so Build218 must not be claimed as a Home fix. This turn does not provide a Library/Favorites/Search/Tag/Person 3×3 A/B result; grid effectiveness is still pending.\n- The same target-device screenshot exposed a white rectangle behind a transparent carousel movie Logo. Exact source inspection proves `EmbyHomeHeroV3.swift` is unchanged from Build216, but its Logo call matches Build218's new shared UIKit display path. The new surface retained `secondarySystemBackground` after the image loaded, unlike the old path, so transparent pixels exposed a rectangular background. This is a poster-task shared-image regression, not a carousel-owner edit.\n- Poster branch head `{poster_head}` contains the minimal source correction: loaded images set the shared UIKit surface background to clear; nil-image placeholder state remains `secondarySystemBackground`. No carousel owner source is touched. This corrected head is only **Code written**; no new CI/IPA or target-device evidence exists yet.\n- Current evidence: **Build218 CI/IPA verified / Build218 Home real-device still hitches / Build218 grid A/B pending / Build218 package visual regression confirmed / transparency correction code written / corrected-source CI+IPA pending / not stable**.\n\nNext: keep Home runtime ownership with the active carousel task; validate/package the corrected grid UIKit-display candidate under a new unique Build identity, then explicitly A/B the real 3×3 routes. Do not infer grid failure from the Home-only Build218 test.\n\n## Parallel integration rule'''
          state = re.sub(
              r'## Active: Poster-heavy scrolling smoothness\n.*?\n## Parallel integration rule',
              poster_section,
              state,
              flags=re.S,
          )
          state_path.write_text(state)
          PY
          git diff --check
          rm .github/workflows/temp-sync-build218-realdevice.yml
          git add docs/project/current/dev/DEV-poster-grid-smoothness.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md .github/workflows/temp-sync-build218-realdevice.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record Build218 target-device result"
          git push origin main
