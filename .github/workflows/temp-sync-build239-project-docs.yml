name: TEMP Sync Build239 Project Docs

on:
  push:
    branches: [perf/home-carousel-velocity-fling-build239]
    paths: [.github/build239-docs-sync-trigger.txt]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build239 branch
        uses: actions/checkout@v4
        with:
          ref: perf/home-carousel-velocity-fling-build239
          fetch-depth: 0
      - name: Prepare helper and latest main
        run: |
          set -euo pipefail
          cp scripts/temp_sync_build239_docs.py /tmp/temp_sync_build239_docs.py
          git fetch origin main
          git checkout -B main origin/main
      - name: Apply Build239 project docs
        run: python3 /tmp/temp_sync_build239_docs.py
      - name: Validate docs scope and commit
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={
            'docs/project/current/dev/DEV-home-carousel-drag-smoothness.md',
            'docs/project/current/dev/DEV-home-carousel-build238-release-result.md',
            'docs/project/MODULE_STATUS.md','docs/project/PROJECT_STATE.md',
            'docs/project/TECHNICAL_DECISIONS.md','docs/project/BUILD_TEST_INDEX.md'
          }
          extra=changed-allowed
          if extra: raise SystemExit(f'unexpected docs changes: {sorted(extra)}')
          required={
            'docs/project/current/dev/DEV-home-carousel-drag-smoothness.md',
            'docs/project/MODULE_STATUS.md','docs/project/PROJECT_STATE.md',
            'docs/project/TECHNICAL_DECISIONS.md','docs/project/BUILD_TEST_INDEX.md'
          }
          missing=required-changed
          if missing: raise SystemExit(f'missing docs changes: {sorted(missing)}')
          print('Build239 docs scope: PASS')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A docs/project
          git commit -m "Docs: record Build239 velocity fling candidate"
          git push origin HEAD:main
