name: Temp sync Build193 docs v2

on:
  push:
    branches: [fix/home-carousel-native-release-build193]
    paths:
      - ".github/workflows/temp-sync-build193-docs-v2.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply docs patch to main
        run: |
          set -euo pipefail
          cp scripts/temp_sync_build193_docs.py /tmp/temp_sync_build193_docs.py
          git fetch origin main
          git checkout -B main origin/main
          python3 /tmp/temp_sync_build193_docs.py
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add docs/project
          git diff --cached --check
          git commit -m "Sync Build193 carousel test baseline"
          git push origin HEAD:main
