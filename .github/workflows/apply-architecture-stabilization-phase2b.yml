name: Apply Architecture Stabilization Phase2B

on:
  pull_request:
    branches: [ci/mdk-seek-audio-ui-0.13.51]
    paths:
      - "scripts/migrate_architecture_stabilization_phase2b.py"
      - ".github/workflows/apply-architecture-stabilization-phase2b.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply architecture stabilization Phase2B
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/migrate_architecture_stabilization_phase2b.py scripts/migrate_flat_health_coordinator_phase2.py
          python3 scripts/migrate_architecture_stabilization_phase2b.py
          git diff --check
          grep -Fq 'private let healthCoordinator = MDKPlaybackHealthCoordinator()' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'authority=health-coordinator' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          test "$(grep -Fo 'quarantineCurrentGeneration(' MDKLab/App/MDKKSAVIOPlayerEngine.swift | wc -l | tr -d ' ')" = "2"
          ! grep -Fq 'MDKSeekPreempt' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          ! grep -Fq 'cacheByteRanges' Sources/UI/BufferedTimelineSlider.swift
          grep -Fq 'Color.white.opacity(0.48)' Sources/UI/BufferedTimelineSlider.swift
          grep -Fq 'livePlayableRanges = bufferState.livePlayableRanges.filter' Sources/Player/PlayerController.swift
          ! grep -Fq 'native-seek-absolute-limit' MDKLab/App/MDKPlaybackHealthCoordinator.swift
          ! grep -Fq 'seek-frame-absolute-limit' MDKLab/App/MDKPlaybackHealthCoordinator.swift

      - name: Commit stabilized runtime source
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add -- MDKLab/App/MDKKSAVIOPlayerEngine.swift MDKLab/App/MDKPlaybackHealthCoordinator.swift Sources/Player/PlayerController.swift Sources/UI/BufferedTimelineSlider.swift Sources/UI/PlayerScreen.swift
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: unify player health and timeline ownership"
          git push origin "HEAD:${HEAD_BRANCH}"
