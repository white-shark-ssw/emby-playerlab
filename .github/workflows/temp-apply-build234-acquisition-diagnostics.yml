name: TEMP Apply Build234 Acquisition Diagnostics

on:
  push:
    branches: [diag/home-carousel-acquisition-coalesced-diagnostics-build234]
    paths:
      - ".github/build234-apply-trigger.txt"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/home-carousel-acquisition-coalesced-diagnostics-build234
          fetch-depth: 0
          persist-credentials: true
      - name: Apply measurement-only Build234 patch
        run: |
          set -euo pipefail
          python3 scripts/temp_apply_build234_acquisition_diagnostics.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          identity = Path('Sources/Core/AppIdentity.swift').read_text()
          interaction = Path('Sources/UI/EmbyHomeCarouselInteractionV3.swift').read_text()
          cadence = Path('Sources/UI/EmbyHomeCarouselCadenceDiagnosticsV3.swift').read_text()
          assert 'sourceVersion = "0.14.67"' in identity
          assert 'acquisitionRenderBaselineSample' in interaction
          assert interaction.count('event.coalescedTouches(for: touch)') == 1
          assert '"accepted"' in interaction and '"none"' in interaction and '"zero"' in interaction and '"direction"' in interaction
          for token in ('acq_coalesced_count=', 'acq_predecessor_status=', 'acq_predecessor_delta_x=', 'acq_predecessor_age_ms='):
              assert token in cadence
          print('Build234 measurement patch: PASS')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Core/AppIdentity.swift Sources/UI/EmbyHomeCarouselInteractionV3.swift Sources/UI/EmbyHomeCarouselCadenceDiagnosticsV3.swift docs/changelog/CHANGELOG_v0_14_67_build234.md
          git commit -m "Diagnostics: measure carousel acquisition coalesced samples"
          git push origin HEAD:diag/home-carousel-acquisition-coalesced-diagnostics-build234
