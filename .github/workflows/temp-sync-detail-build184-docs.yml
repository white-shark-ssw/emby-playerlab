name: Temp Sync Detail Build184 Docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-sync-detail-build184-docs.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update project evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('docs/project/BUILD_TEST_INDEX.md')
          index = index_path.read_text()
          old_row = '| **Build182 / 0.14.15** | Persistent detail presentation cache | Extends Build181\'s safe presentation snapshot from process-only `NSCache` to `Library/Caches` while retaining live Emby refresh and playback/session boundaries. Dedicated standard MPV Release CI passed and IPA produced. **Real-device cold-relaunch validation pending; not stable yet.** |'
          new_row = '| **Build182 / 0.14.15** | Persistent detail presentation cache | Extends Build181\'s safe presentation snapshot to `Library/Caches` while retaining live Emby refresh and playback/session boundaries. Dedicated Release CI/IPA succeeded; user accepted both detail scrolling and force-quit/relaunch restoration on iPhone 15 Pro Max / iOS 17.0. **Frozen for these two requirements.** |'
          if old_row not in index:
              raise SystemExit('Build182 index row marker missing')
          index = index.replace(old_row, new_row, 1)
          build184_row = '| **Build184 / 0.14.17** | Detail visual hierarchy refinement | Moves “视频信息” below “更多类似” and above the bottom glass media-source card, renames the old media-stream heading, and reduces the main detail section headers to 19 pt bold. Dedicated standard MPV Release CI passed and IPA produced; Build182 scroll/cache and P0 contracts are zero-diff. **Real-device visual validation pending; not stable yet.** |'
          if build184_row not in index:
              index = index.replace(new_row, new_row + '\n' + build184_row, 1)
          old_summary = 'Build179 has been rejected by real-device carousel evidence. Build180 remains the home-carousel test candidate. Build181 is now a useful detail-page diagnostic reference: scroll isolation is clearly improved on device, but its process-only warm cache failed the force-quit/relaunch requirement. Build182 is the current detail-page candidate and does not replace Build178 until target-device validation is accepted.'
          new_summary = 'Build179 has been rejected by real-device carousel evidence. The home-carousel task continues independently. Build181 remains a useful detail-page diagnostic reference. Build182 is real-device accepted and frozen for detail scrolling plus force-quit/relaunch presentation restoration. Build184 is the current detail visual-hierarchy candidate and does not replace Build178 until its UI is accepted on target device.'
          if old_summary in index:
              index = index.replace(old_summary, new_summary, 1)
          start = index.index('### Build182 / OnePlayer 0.14.15 — persistent detail presentation cache')
          end = index.index('An earlier detail 0.14.13 / Build180 package', start)
          section = index[start:end]
          section = section.replace('- evidence level: **Code written / CI passed / IPA produced / real-device pending / not stable**', '- real-device evidence: user confirmed on iPhone 15 Pro Max / iOS 17.0 that the previously reported detail scrolling and force-quit/relaunch loading issues now feel correct and explicitly approved freezing both issues.\n- evidence level: **Code written / CI passed / IPA produced / real-device accepted / frozen for detail scroll + cold-relaunch presentation requirements**')
          index = index[:start] + section + index[end:]
          build184_section = '''### Build184 / OnePlayer 0.14.17 — detail visual hierarchy refinement

- task: `DEV-detail-episode-page-optimization` — Active, pending visual acceptance
- branch: `feat/detail-episode-page-optimization`
- Build182 frozen base / workflow-restored head: `6352671ba843e692c671c66c663c01a43b7848fb`
- UI product commit: `583d156d51e46ca4f913cbd268d18f8cbdb05b2f`
- dedicated standard MPV Release CI source: `0238f2c8fd202df6e7ba52d582b1614c9230eef9`
- workflow-restored branch head: `8ea6fc2347f899bd65bda315305a8091e38b1c3d`
- CI run: `32851745960` — success
- artifact: `OnePlayer-0.14.17-build184-detail-visual-refinement`
- artifact ID: `9564647845`
- artifact digest: `sha256:68e25864307536e15ed79329ae6f11e1018875f74316a050eb4ad88e61c1bd7f`
- IPA: `OnePlayer-0.14.17-build184-detail-visual-refinement-unsigned.ipa`
- IPA SHA-256: `d89953c76b678fe1bc0b9f3fcc8b5b5b3ea430ec74bdd420834b427c91d47eb4`
- MinOS: app/runtime Mach-O validated at iOS 15.0
- product delta: media stream section now follows “更多类似” and precedes the bottom glass media-source summary; title is “视频信息”; primary detail section headers are 19 pt bold. Card body text, Hero, section spacing and media cards are unchanged.
- frozen evidence: `EmbyDetailPerformanceState.swift`, Build176/178 accepted player/order files and P0/Frozen modules are zero-diff from Build182 frozen base; Build182 detail performance/persistent-cache contracts still pass.
- CI note: two earlier attempts failed before Xcode because historical static checks hard-coded the old “音视频字幕信息” title. Only those stale title assertions were updated; no product or Resume/PlaybackInfo contract was relaxed.
- evidence level: **Code written / CI passed / IPA produced / real-device pending / not stable**

'''
          if '### Build184 / OnePlayer 0.14.17 — detail visual hierarchy refinement' not in index:
              index = index.replace('An earlier detail 0.14.13 / Build180 package', build184_section + 'An earlier detail 0.14.13 / Build180 package', 1)
          index_path.write_text(index)

          state_path = Path('docs/project/PROJECT_STATE.md')
          state = state_path.read_text()
          old_intro = '_Last updated after Build181 / OnePlayer 0.14.14 received target-device evidence: detail scrolling is clearly improved, while force-quit/relaunch still loses its process-only warm metadata. Build182 / OnePlayer 0.14.15 now persists the safe detail presentation snapshot to Library/Caches, passed dedicated CI and produced an IPA. Build178 remains the accepted functional baseline pending target-device validation of the active candidates._'
          new_intro = '_Last updated after Build182 / OnePlayer 0.14.15 was accepted on target device and frozen for detail scrolling plus force-quit/relaunch presentation restoration, and Build184 / OnePlayer 0.14.17 passed dedicated Release CI and produced an IPA for the next detail visual-hierarchy refinement. Build178 remains the accepted overall functional baseline._'
          if old_intro in state:
              state = state.replace(old_intro, new_intro, 1)
          old_b182 = 'Build182 / OnePlayer 0.14.15 is the current **detail-page cold-relaunch test candidate**. It preserves Build181 scroll isolation and extends only the safe presentation snapshot to `Library/Caches`; dedicated Release CI passed and IPA was produced. Target-device cold-relaunch validation is pending, so it does not replace Build178.'
          new_b182 = 'Build182 / OnePlayer 0.14.15 is now **real-device accepted and frozen for the two detail performance/cache requirements**: the user accepted the improved vertical scrolling and force-quit/relaunch restoration on iPhone 15 Pro Max / iOS 17.0. It remains a feature-line reference rather than replacing Build178 as the overall merged baseline.'
          if old_b182 in state:
              state = state.replace(old_b182, new_b182 + '\n\nBuild184 / OnePlayer 0.14.17 is the current **detail visual-hierarchy test candidate**. It only reorders/renames the media-information section and slightly reduces main section-header typography; dedicated Release CI passed and IPA was produced. Real-device visual acceptance is pending.', 1)
          s = state.index('### Build182 / OnePlayer 0.14.15 — persistent detail presentation cache')
          e = state.index('An earlier detail 0.14.13 / Build180 package', s)
          sec = state[s:e]
          sec = sec.replace('- evidence level: **Code written / CI passed / IPA produced / real-device pending / not stable**', '- real-device evidence: user accepted the detail scrolling and force-quit/relaunch restoration and explicitly froze both issues on iPhone 15 Pro Max / iOS 17.0.\n- evidence level: **Code written / CI passed / IPA produced / real-device accepted / frozen for these two requirements**')
          state = state[:s] + sec + state[e:]
          b184_state = '''### Build184 / OnePlayer 0.14.17 — detail visual hierarchy refinement

`DEV-detail-episode-page-optimization` remains Active for UI refinement while Build182 performance/cache behavior stays frozen.

- branch: `feat/detail-episode-page-optimization`
- frozen base: Build182 workflow-restored head `6352671ba843e692c671c66c663c01a43b7848fb`
- UI product commit: `583d156d51e46ca4f913cbd268d18f8cbdb05b2f`
- dedicated CI source: `0238f2c8fd202df6e7ba52d582b1614c9230eef9`
- workflow-restored branch head: `8ea6fc2347f899bd65bda315305a8091e38b1c3d`
- CI run: `32851745960` — **success**
- artifact: `OnePlayer-0.14.17-build184-detail-visual-refinement`
- artifact ID: `9564647845`
- IPA SHA-256: `d89953c76b678fe1bc0b9f3fcc8b5b5b3ea430ec74bdd420834b427c91d47eb4`
- MinOS: app/runtime Mach-O validated at iOS 15.0
- evidence level: **Code written / CI passed / IPA produced / real-device pending / not stable**

Build184 changes only the detail visual hierarchy: “视频信息” is below “更多类似” and directly above the bottom glass media-source summary, and main section headers use 19 pt bold. Build182 Hero scroll owner/persistent presentation cache, canonical episode order, playback/session/transport/navigation contracts and media-stream card data remain unchanged.

'''
          if '### Build184 / OnePlayer 0.14.17 — detail visual hierarchy refinement' not in state:
              state = state.replace('An earlier detail 0.14.13 / Build180 package', b184_state + 'An earlier detail 0.14.13 / Build180 package', 1)
          state_path.write_text(state)
          PY
          git diff --check
          git diff -- docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md
      - name: Commit docs and remove helper
        run: |
          set -euo pipefail
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git rm .github/workflows/temp-sync-detail-build184-docs.yml
          git add docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md
          git commit -m "Record Build182 acceptance and Build184 evidence"
          git push origin HEAD:main
