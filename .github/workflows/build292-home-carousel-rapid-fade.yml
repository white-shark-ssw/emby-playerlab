name: Build292 Home Carousel Rapid Swipe and Fade

on:
  push:
    branches: [ci/build292-home-carousel-rapid-fade-20261005]

permissions:
  contents: read

concurrency:
  group: build292-home-carousel-rapid-fade
  cancel-in-progress: true

env:
  PRODUCT_SHA: 23ed1864f63d4701509df98b72d15e67038f801a
  PRODUCT_BRANCH: perf/home-carousel-progress-scope-build286
  BUILD286_SHA: 7e7b2ec944f5c0e74bc291e37683f1529e3d46b4
  BUILD291_SHA: dbeaa9d3472c85a5c238598da3aac41d8e49f43c
  VERSION: 0.15.25
  BUILD_NUMBER: 292

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve native regression harness
        run: cp -R .github/carousel-regression "$RUNNER_TEMP/carousel-regression"

      - name: Checkout and guard exact product source
        run: |
          set -euo pipefail
          git fetch origin "$PRODUCT_BRANCH"
          test "$(git rev-parse "origin/$PRODUCT_BRANCH")" = "$PRODUCT_SHA"
          git checkout --detach "$PRODUCT_SHA"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"

          changed="$(git diff --name-only "$BUILD291_SHA" "$PRODUCT_SHA" | sort)"
          expected="$(printf '%s\n' Sources/Core/AppIdentity.swift Sources/UI/EmbyHomeCarouselNativePresentationV3.swift Sources/UI/EmbyHomeCarouselStateV3.swift docs/changelog/CHANGELOG_v0_15_25_build292.md | sort)"
          test "$changed" = "$expected"
          git diff --check "$BUILD291_SHA" "$PRODUCT_SHA"
          grep -F 'static let sourceVersion = "0.15.25"' Sources/Core/AppIdentity.swift
          ! grep -F 'page.foregroundController.view.frame =' Sources/UI/EmbyHomeCarouselNativePresentationV3.swift
          grep -F 'if foreground.center != center' Sources/UI/EmbyHomeCarouselNativePresentationV3.swift
          grep -F 'if pagePairChanged { layoutPages() }' Sources/UI/EmbyHomeCarouselNativePresentationV3.swift
          grep -F 'directionalVelocity >= 500' Sources/UI/EmbyHomeCarouselStateV3.swift
          grep -F 'distanceProgress >= 0.28 || velocityCommit' Sources/UI/EmbyHomeCarouselStateV3.swift
          grep -F 'duration: 0.22' Sources/UI/EmbyHomeCarouselStateV3.swift
          grep -F 'duration: 0.18' Sources/UI/EmbyHomeCarouselStateV3.swift
          grep -F 'duration: 0.62' Sources/UI/EmbyHomeCarouselStateV3.swift
          grep -F 'timeIntervalSince(lastSettledAt) >= 6' Sources/UI/EmbyHomeCarouselStateV3.swift
          grep -F 'iOS: "15.0"' project.yml
          grep -F 'deploymentTarget: "15.0"' project.yml

      - name: Export exact source snapshot
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          SOURCE_ZIP="OnePlayer-${VERSION}-build${BUILD_NUMBER}-home-carousel-rapid-fade-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" "$PRODUCT_SHA"
          shasum -a 256 "$SOURCE_ZIP" | tee "$SOURCE_ZIP.sha256"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Inject package identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          import re
          from pathlib import Path
          version = "0.15.25"
          build = "292"
          info_path = Path("Config/Info.plist")
          with info_path.open("rb") as handle:
              info = plistlib.load(handle)
          info["CFBundleShortVersionString"] = version
          info["CFBundleVersion"] = build
          with info_path.open("wb") as handle:
              plistlib.dump(info, handle, sort_keys=False)
          project_path = Path("project.yml")
          project = project_path.read_text()
          project = re.sub(r'MARKETING_VERSION: "[^"]+"', f'MARKETING_VERSION: "{version}"', project)
          project = re.sub(r'CURRENT_PROJECT_VERSION: "[^"]+"', f'CURRENT_PROJECT_VERSION: "{build}"', project)
          project_path.write_text(project)
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodegen --version
          pod --version

      - name: UIKit regression with rejected-source negative control
        run: |
          set -euo pipefail
          CONTROL="$RUNNER_TEMP/carousel-regression"
          FIXED="$RUNNER_TEMP/carousel-fixed-tests"
          OLD="$RUNNER_TEMP/carousel-rejected-tests"
          git worktree add --detach "$RUNNER_TEMP/carousel-rejected-source" "$BUILD291_SHA"
          python3 "$CONTROL/prepare.py" "$PWD" "$FIXED"
          python3 "$CONTROL/prepare.py" "$RUNNER_TEMP/carousel-rejected-source" "$OLD"
          (cd "$FIXED" && xcodegen generate)
          (cd "$OLD" && xcodegen generate)
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"] == "iPhone 16 Pro Max"))')"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          set +e
          xcodebuild test -project "$OLD/CarouselRegression.xcodeproj" -scheme CarouselRegression -destination "platform=iOS Simulator,id=$DEVICE_ID" -only-testing:CarouselRegression/CarouselTests/testConsecutiveCommittedSwipesAdvanceWithoutSettlingOrPositionJump -only-testing:CarouselRegression/CarouselTests/testArtworkMaskFadesAcrossHeroBoundaryIntoSolidBase CODE_SIGNING_ALLOWED=NO 2>&1 | tee rejected-native-tests.log
          rejected_status=${PIPESTATUS[0]}
          set -e
          test "$rejected_status" -ne 0
          grep -F 'failed' rejected-native-tests.log
          ! grep -E 'error:.*(cannot|no such|failed to)' rejected-native-tests.log
          xcodebuild test -project "$FIXED/CarouselRegression.xcodeproj" -scheme CarouselRegression -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO 2>&1 | tee fixed-native-tests.log

      - name: Prepare project and dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build unsigned app
        run: |
          set -uo pipefail
          rm -rf build
          set +e
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -n -E '(^|[[:space:]])error:|SwiftCompile|CompileSwift' build.log | tail -n 240 > compiler-errors.txt || true
            echo '===== Build292 compiler diagnostics ====='
            cat compiler-errors.txt
            exit "$status"
          fi

      - name: Upload Build292 compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.15.25-build292-compiler-diagnostics
          path: |
            compiler-errors.txt
            build.log
            fixed-native-tests.log
            rejected-native-tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: Validate identity and minimum OS
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id com.embyplayerlab.app --version "$VERSION" --build "$BUILD_NUMBER" --display-name OnePlayer --minimum-os 15.0 --primary-icon OnePlayerIcon --alternate-icon OnePlayerAltIcon
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" 15.0 17.0 min-os-report.log build.log
          /usr/bin/plutil -p "$APP_PATH/Info.plist" | tee built-info-plist.log

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA_NAME="OnePlayer-${VERSION}-build${BUILD_NUMBER}-home-carousel-rapid-fade-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME" | tee package.log
          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload Build292 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.15.25-build292-home-carousel-rapid-fade
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            fixed-native-tests.log
            rejected-native-tests.log
            built-info-plist.log
            min-os-report.log
            package.log
            build.log
          if-no-files-found: error
          retention-days: 30

