name: Build156 Apply Compile Fixes

on:
  push:
    branches: [lab/pip-samplebuffer-0.13.89]
    paths:
      - ".github/workflows/build156-apply-compile-fixes.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact compile fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pip = Path('Sources/UI/PlayerPictureInPictureController.swift')
          text = pip.read_text()
          replacements = [
              ('ready=\\(self.displayLayer?.isReadyForDisplay ?? false)', 'status=\\(self.displayLayer?.status.rawValue ?? -1)'),
              ('guard controller.isPictureInPicturePossible, displayLayer.isReadyForDisplay else { return }', 'guard controller.isPictureInPicturePossible, displayLayer.status != .failed else { return }'),
              ('layerReady=\\(self.displayLayer?.isReadyForDisplay ?? false)', 'status=\\(self.displayLayer?.status.rawValue ?? -1)'),
          ]
          for old, new in replacements:
              count = text.count(old)
              assert count == 1, (old, count)
              text = text.replace(old, new)
          assert 'isReadyForDisplay' not in text
          pip.write_text(text)

          bridge = Path('Sources/UI/PlayerSampleBufferPiPBridge.swift')
          text = bridge.read_text()
          old = 'CMBlockBufferAppendMemoryBlock(blockBuffer, memoryBlock: nil, blockLength: data.count, blockAllocator: kCFAllocatorDefault, customBlockSource: nil, offsetToData: 0, dataLength: data.count, flags: kCMBlockBufferAssureMemoryNow)'
          new = 'CMBlockBufferAppendMemoryBlock(blockBuffer, memoryBlock: nil, length: data.count, blockAllocator: kCFAllocatorDefault, customBlockSource: nil, offsetToData: 0, dataLength: data.count, flags: 0)'
          assert text.count(old) == 1
          text = text.replace(old, new)
          bridge.write_text(text)
          PY
          git diff --check
          git diff -- Sources/UI/PlayerPictureInPictureController.swift Sources/UI/PlayerSampleBufferPiPBridge.swift
      - name: Commit fixes and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/build156-apply-compile-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources/UI/PlayerPictureInPictureController.swift Sources/UI/PlayerSampleBufferPiPBridge.swift .github/workflows/build156-apply-compile-fixes.yml
          git commit -m 'Build156: fix iOS 17.0 SampleBuffer compile compatibility'
          git push origin HEAD:lab/pip-samplebuffer-0.13.89
