name: One-shot fix episode diagnostic quotes

on:
  push:
    branches: [diag/series-episode-metadata]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/series-episode-metadata
          fetch-depth: 0
      - name: Apply compile fix
        run: |
          set -euo pipefail
          python3 scripts/one_shot_fix_episode_diag_quotes.py
          python3 scripts/check_series_episode_diagnostics.py
          rm -f scripts/one_shot_fix_episode_diag_quotes.py
          rm -f .github/workflows/one-shot-fix-episode-diag-quotes.yml
          git diff --check
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add -A
          git commit -m 'fix: compile series episode diagnostics'
          git push origin HEAD:diag/series-episode-metadata
