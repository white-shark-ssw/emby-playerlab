name: Stamp Playback Architecture Run

on:
  push:
    branches: [feat/playback-architecture-0.13.8]

permissions:
  actions: read
  contents: write

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find matching build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/build
          for attempt in $(seq 1 12); do
            RUN_JSON="$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --limit 20 --json databaseId,status,conclusion,headSha,createdAt,name 2>/dev/null | python3 -c 'import json,sys; rows=json.load(sys.stdin); rows=[x for x in rows if x.get("name")=="Build Playback Architecture IPA"]; print(json.dumps(rows[:1], separators=(",",":")))' || true)"
            if [ "$RUN_JSON" != "[]" ] && [ -n "$RUN_JSON" ]; then break; fi
            sleep 5
          done
          test "$RUN_JSON" != "[]" && test -n "$RUN_JSON"
          printf '%s\n' "$RUN_JSON" > docs/build/playback-architecture-current-run.json
      - name: Publish run pointer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/build/playback-architecture-current-run.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci: stamp playback architecture run'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
