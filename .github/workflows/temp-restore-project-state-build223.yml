name: TEMP Restore PROJECT_STATE after Build223 docs sync

on:
  push:
    branches: [diag/home-carousel-persistent-backdrop-isolation-build223]
    paths:
      - .github/build223-project-state-restore-trigger.txt

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Restore complete PROJECT_STATE from parent
        run: |
          set -euo pipefail
          git checkout HEAD^ -- docs/project/PROJECT_STATE.md
          grep -F 'Last updated after Build223 / 0.14.56 target-device testing' docs/project/PROJECT_STATE.md
          grep -F 'Build223 Home vertical persistent-backdrop A/B' docs/project/PROJECT_STATE.md
          git diff --check

      - name: Commit restore
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/PROJECT_STATE.md
          git commit -m "Restore complete PROJECT_STATE after Build223 result [skip ci]"
          git push origin HEAD:main
