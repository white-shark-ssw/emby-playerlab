name: One-shot user data resume refresh
on:
  push:
    branches:
      - fix/userdata-resume-refresh
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/userdata-resume-refresh
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/patches/userdata_resume_refresh.py
      - name: Run focused regressions
        run: |
          python3 scripts/check_user_data_refresh.py
          python3 scripts/check_detail_resume_button.py
          python3 scripts/check_adaptive_hero_reveal.py
          python3 scripts/check_v0134_detail_navigation.py
      - name: Commit formal changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add Sources/Networking/EmbyAPIClient.swift Sources/Core/EmbyUserDataChange.swift Sources/UI/EmbyMediaDetailView.swift Sources/UI/EmbyServerRootViewV3.swift scripts/check_user_data_refresh.py
          git commit -m "fix: synchronize cleared resume state across detail and home"
          git push origin HEAD:fix/userdata-resume-refresh
