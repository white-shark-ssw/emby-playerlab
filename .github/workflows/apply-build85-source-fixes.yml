name: Apply Build85 Source Fixes

on:
  push:
    branches: [feat/recovery-isolation-0.13.17]
    paths:
      - .github/workflows/apply-build85-source-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recovery-isolation-0.13.17

      - name: Apply MDK HTTP seek and resume-state fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "MDKLab/App/MDKKSAVIOPlayerEngine.swift",
              '''        if let session = sharedTransportSession {
              transportHTTPServer?.resetClientStreams(reason: "mdk-seek-\\(intent.id)")
              Task { @MainActor [weak self, weak player] in
          ''',
              '''        if let session = sharedTransportSession {
              DiagnosticsLogger.shared.playback("MDKSeekHTTP", "id=\\(intent.id) action=preserve-existing-stream-before-native-seek")
              Task { @MainActor [weak self, weak player] in
          ''')

          replace_once(
              "MDKLab/App/MDKKSAVIOPlayerEngine.swift",
              '''        let recoveryTarget = latestDesiredTarget(fallback: fallbackTarget)
              DiagnosticsLogger.shared.playback("MDKSeekWedge", "reason=\\(reason) active=\\(activeNativeSeek?.id ?? -1) queued=\\(queuedLatestSeek?.id ?? -1) latestTarget=\\(String(format: "%.3f", recoveryTarget)) action=rebuild-player-at-latest-target")
              activeNativeSeek = nil
              queuedLatestSeek = nil
              reload(at: recoveryTarget)
          ''',
              '''        let recoveryTarget = latestDesiredTarget(fallback: fallbackTarget)
              DiagnosticsLogger.shared.playback("MDKSeekWedge", "reason=\\(reason) active=\\(activeNativeSeek?.id ?? -1) queued=\\(queuedLatestSeek?.id ?? -1) latestTarget=\\(String(format: "%.3f", recoveryTarget)) action=rebuild-player-at-latest-target")
              transportHTTPServer?.resetClientStreams(reason: "mdk-seek-wedge-\\(reason)")
              activeNativeSeek = nil
              queuedLatestSeek = nil
              reload(at: recoveryTarget)
          ''')

          replace_once(
              "Sources/Transport/TransportHTTPServer.swift",
              '''            var cursor = responseRange.lowerBound
              let chunkSize = 512 * 1024
              while cursor <= responseRange.upperBound, !Task.isCancelled, !isStopped {
                  let length = min(chunkSize, Int(responseRange.upperBound - cursor + 1))
                  let data = try await session.read(offset: cursor, length: length)
                  guard !data.isEmpty else { break }
                  try await send(data, on: connection)
                  cursor += Int64(data.count)
              }

              let sentBytes = max(0, cursor - responseRange.lowerBound)
              if logRequest || sentBytes >= 8 * 1_048_576 {
          ''',
              '''            var cursor = responseRange.lowerBound
              let chunkSize = 512 * 1024
              var terminationReason = "complete"
              while cursor <= responseRange.upperBound {
                  if Task.isCancelled { terminationReason = "task-cancelled"; break }
                  if isStopped { terminationReason = "server-stopped"; break }
                  let length = min(chunkSize, Int(responseRange.upperBound - cursor + 1))
                  let data = try await session.read(offset: cursor, length: length)
                  if data.isEmpty { terminationReason = "empty-read"; break }
                  try await send(data, on: connection)
                  cursor += Int64(data.count)
              }

              let sentBytes = max(0, cursor - responseRange.lowerBound)
              if sentBytes < responseRange.length {
                  DiagnosticsLogger.shared.playback("TransportHTTPIntegrity", "server=\\(logID) start=\\(responseRange.lowerBound) expected=\\(responseRange.length) sent=\\(sentBytes) remaining=\\(responseRange.length - sentBytes) reason=\\(terminationReason)")
              }
              if logRequest || sentBytes >= 8 * 1_048_576 {
          ''')

          replace_once(
              "Sources/UI/EmbyMediaDetailView.swift",
              '''        if let selectedEpisodeID, let selected = episodes.first(where: { $0.id == selectedEpisodeID }) { return selected }
              if let resume = episodes.first(where: { $0.playbackProgress > 0.001 && !$0.isPlayed }) { return resume }
          ''',
              '''        if let selectedEpisodeID, let selected = episodes.first(where: { $0.id == selectedEpisodeID }) { return selected }
              if hasPlaybackPositionOverride { return episodes.first }
              if let resume = episodes.first(where: { $0.playbackProgress > 0.001 && !$0.isPlayed }) { return resume }
          ''')

          replace_once(
              "Sources/UI/EmbyMediaDetailView.swift",
              '''    var primaryPlayButtonShowsResume: Bool {
              guard !displayedPlayed, let playable = primaryPlayableItem else { return false }
              return effectivePlaybackProgress(for: playable) > 0.001
          }
          ''',
              '''    var primaryPlayButtonShowsResume: Bool {
              guard !displayedPlayed, !hasPlaybackPositionOverride, let playable = primaryPlayableItem else { return false }
              return effectivePlaybackProgress(for: playable) > 0.001
          }
          ''')

          replace_once(
              "Sources/UI/EmbyMediaDetailView.swift",
              '''    private func effectivePlaybackPositionTicks(for playable: LibraryItem) -> Int64? {
              if playable.id == item.id && hasPlaybackPositionOverride { return playbackPositionOverrideTicks }
              return playable.userData?.playbackPositionTicks
          }
          ''',
              '''    private func effectivePlaybackPositionTicks(for playable: LibraryItem) -> Int64? {
              if hasPlaybackPositionOverride { return playbackPositionOverrideTicks }
              return playable.userData?.playbackPositionTicks
          }
          ''')

          replace_once(
              "Sources/UI/EmbyMediaDetailView.swift",
              '''        do {
              let info = try await client.playbackInfo(itemId: mediaItem.id)
          ''',
              '''        do {
              if hasPlaybackPositionOverride, mediaItem.id != item.id {
                  try? await client.setPlayed(itemId: mediaItem.id, played: false)
                  DiagnosticsLogger.shared.log("EmbyDetail", "resume override cleared child item=\\(mediaItem.id) before playback")
              }
              let info = try await client.playbackInfo(itemId: mediaItem.id)
          ''')

          p = Path("project.mdklab.yml")
          text = p.read_text()
          if 'MARKETING_VERSION: "0.13.17"' not in text or 'CURRENT_PROJECT_VERSION: "84"' not in text:
              raise SystemExit("project.mdklab.yml: Build84 version markers missing")
          text = text.replace('MARKETING_VERSION: "0.13.17"', 'MARKETING_VERSION: "0.13.18"')
          text = text.replace('CURRENT_PROJECT_VERSION: "84"', 'CURRENT_PROJECT_VERSION: "85"')
          p.write_text(text)
          PY

          git diff --check
          grep -q 'MDKSeekHTTP.*preserve-existing-stream-before-native-seek' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          ! grep -q 'resetClientStreams(reason: "mdk-seek-\\(intent.id)' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -q 'TransportHTTPIntegrity' Sources/Transport/TransportHTTPServer.swift
          grep -q '!hasPlaybackPositionOverride' Sources/UI/EmbyMediaDetailView.swift
          grep -q 'if hasPlaybackPositionOverride { return episodes.first }' Sources/UI/EmbyMediaDetailView.swift
          grep -q 'MARKETING_VERSION: "0.13.18"' project.mdklab.yml
          grep -q 'CURRENT_PROJECT_VERSION: "85"' project.mdklab.yml
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml

      - name: Commit source fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MDKLab/App/MDKKSAVIOPlayerEngine.swift Sources/Transport/TransportHTTPServer.swift Sources/UI/EmbyMediaDetailView.swift project.mdklab.yml
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'fix: preserve MDK HTTP stream across seeks and clear series resume state'
          git push origin HEAD:feat/recovery-isolation-0.13.17
