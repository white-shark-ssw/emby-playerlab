name: Build238 Carousel Release Diagnostics IPA

on:
  push:
    branches: [diag/home-carousel-release-intent-build238]
    paths:
      - ".github/build238-carousel-ci-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build238 branch
        uses: actions/checkout@v4
        with:
          ref: diag/home-carousel-release-intent-build238
          fetch-depth: 0

      - name: Validate exact Build238 scope and retained contracts
        run: |
          set -euo pipefail
          base='6d9243395f273dec224ba695e14d433405345c11'
          git diff --check "$base"...HEAD
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = '6d9243395f273dec224ba695e14d433405345c11'
          allowed = {
              '.github/build238-apply-trigger.txt',
              '.github/build238-carousel-ci-trigger.txt',
              '.github/workflows/temp-apply-build238-release-diagnostics.yml',
              '.github/workflows/temp-build238-carousel-release-diagnostics.yml',
              'scripts/temp_apply_build238_release_diagnostics.py',
              'Sources/Core/AppIdentity.swift',
              'Sources/UI/EmbyHomeCarouselInteractionV3.swift',
              'docs/changelog/CHANGELOG_v0_14_71_build238.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', f'{base}...HEAD'], text=True).splitlines())
          extra = sorted(changed - allowed)
          if extra: raise SystemExit(f'Unexpected Build238 files: {extra}')
          required = {'Sources/Core/AppIdentity.swift', 'Sources/UI/EmbyHomeCarouselInteractionV3.swift', 'docs/changelog/CHANGELOG_v0_14_71_build238.md'}
          missing = sorted(required - changed)
          if missing: raise SystemExit(f'Missing Build238 files: {missing}')
          frozen_prefixes = ('Sources/Player/', 'Sources/Transport/', 'Sources/Cache/', 'Sources/Session/', 'Sources/AVIO/')
          touched_frozen = sorted(path for path in changed if path.startswith(frozen_prefixes))
          if touched_frozen: raise SystemExit(f'Build238 touched Frozen/P0 paths: {touched_frozen}')

          identity = Path('Sources/Core/AppIdentity.swift').read_text()
          assert 'sourceVersion = "0.14.71"' in identity

          interaction = Path('Sources/UI/EmbyHomeCarouselInteractionV3.swift').read_text()
          assert 'actualProgress >= 0.28 || max(actualDistance, predictedDistance) >= width * 0.24' in interaction
          assert 'last_move_delivered_velocity_x=' in interaction
          assert 'last_move_coalesced_velocity_x=' in interaction
          assert 'end_velocity_x=' in interaction
          assert 'predicted_extra_x=' in interaction
          assert 'DiagnosticsLogger.shared.app("HomeCarouselRelease"' in interaction
          assert 'pendingPostAcquisitionBaseline = acquisitionSample.status == "none" && acquisitionSample.count == 1' in interaction
          assert 'postAcquisitionRenderBaselineSample' in interaction
          assert 'Timer' not in interaction and 'DispatchQueue.main.asyncAfter' not in interaction

          hero = Path('Sources/UI/EmbyHomeHeroV3.swift').read_text()
          assert hero.count('.compositingGroup()') == 1
          assert 'ForEach(carouselHeroResidentItems) { item in\n                carouselHeroArtwork' in hero
          assert 'carouselPersistentImage(item: item, size: size)\n            }' in hero
          assert 'carouselPersistentImage(item: item, size: size).opacity(Double(carouselBackdropBlendProgress(transitionProgress)))' in hero
          assert 'carouselPersistentImage(item: item, size: size).opacity(carouselOpacity(for: item.id))' not in hero

          state = Path('Sources/UI/EmbyHomeCarouselStateV3.swift').read_text()
          assert 'withAnimation(.easeOut(duration: 0.22))' in state
          assert 'withAnimation(.easeOut(duration: 0.18))' in state
          assert 'V3HomeCarouselCadenceDiagnostics.shared.end(reason: "settled")' in state
          assert 'V3HomeCarouselCadenceDiagnostics.shared.end(reason: "cancelled-settled")' in state

          cadence = Path('Sources/UI/EmbyHomeCarouselCadenceDiagnosticsV3.swift').read_text()
          assert 'link.preferredFrameRateRange = CAFrameRateRange(minimum: requested, maximum: requested, preferred: requested)' in cadence
          print('Build238 scope/contracts: PASS')
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Prepare OnePlayer app icons
        run: python3 scripts/generate_oneplayer_icons.py

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache | tee package-resolution.log

      - name: Build Release
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            MARKETING_VERSION=0.14.71 \
            CURRENT_PROJECT_VERSION=238 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build238.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id com.embyplayerlab.app --version 0.14.71 --build 238 --display-name OnePlayer --minimum-os 15.0 --primary-icon OnePlayerIcon --alternate-icon OnePlayerAltIcon

      - name: Validate MinOS
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" 15.0 17.0 build238-min-os.log build238.log

      - name: Package unsigned IPA and source snapshot
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA="OnePlayer-0.14.71-build238-release-diagnostics-unsigned.ipa"
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA"
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          SOURCE="OnePlayer-0.14.71-build238-source.zip"
          git archive --format=zip --output "$SOURCE" HEAD
          shasum -a 256 "$SOURCE" | tee "$SOURCE.sha256"
          git rev-parse HEAD | tee build238-source-sha.txt
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"

      - name: Upload Build238 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.71-build238-release-diagnostics
          path: |
            ${{ env.IPA }}
            ${{ env.IPA }}.sha256
            ${{ env.SOURCE }}
            ${{ env.SOURCE }}.sha256
            build238-source-sha.txt
            build238.log
            build238-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30
