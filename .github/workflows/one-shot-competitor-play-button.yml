name: Apply competitor play button

on:
  push:
    branches:
      - feat/competitor-play-button-progress

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/competitor-play-button-progress
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/apply_competitor_play_button.py
      - name: Run detail regression
        run: python3 scripts/check_detail_resume_button.py
      - name: Commit formal source
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add Sources/UI/EmbyMediaDetailView.swift
          git diff --cached --quiet && exit 0
          git commit -m "feat: match competitor translucent progress play button"
          git push origin HEAD:feat/competitor-play-button-progress
