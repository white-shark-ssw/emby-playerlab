name: One-shot detail hero pop fix v2

on:
  push:
    branches:
      - "fix/detail-hero-pop-0134"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: |
          set -euo pipefail
          python3 .github/apply_detail_hero_pop_0134.py
          python3 scripts/check_v0134_detail_navigation.py
          git diff --check
          git diff --stat

      - name: Commit patched source
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add -A
          git commit -m 'fix: unify detail hero and preserve native pop visuals [detail-hero-pop-patched]'
          git push origin HEAD:fix/detail-hero-pop-0134
