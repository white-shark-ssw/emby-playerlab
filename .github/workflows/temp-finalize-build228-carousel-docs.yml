name: TEMP Finalize Carousel Build228 Docs

on:
  push:
    branches: [perf/home-carousel-release-refresh-build228]
    paths:
      - ".github/build228-carousel-finalize-docs-trigger.txt"

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout carousel Build228 branch
        uses: actions/checkout@v4
        with:
          ref: perf/home-carousel-release-refresh-build228
          fetch-depth: 0
          persist-credentials: true

      - name: Record target-device result in feature checkpoint
        run: |
          set -euo pipefail
          python3 scripts/temp_finalize_build228_carousel_docs.py branch
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          if ! git diff --cached --quiet; then
            git commit -m "Docs: accept carousel Build228 release tail for now [skip ci]"
            git push origin HEAD:perf/home-carousel-release-refresh-build228
          fi

      - name: Sync authoritative project docs to main
        run: |
          set -euo pipefail
          cp scripts/temp_finalize_build228_carousel_docs.py /tmp/temp_finalize_build228_carousel_docs.py
          git fetch origin main perf/home-carousel-release-refresh-build228
          git checkout -B main origin/main
          python3 /tmp/temp_finalize_build228_carousel_docs.py main
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md
          git commit -m "Docs: sync carousel Build228 device result [skip ci]"
          git push origin main
