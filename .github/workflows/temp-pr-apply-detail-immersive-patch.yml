name: TEMP Materialize Build262 Carousel Registered

on:
  push:
    branches: [perf/home-carousel-rapid-swipe-120hz-build262]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/home-carousel-rapid-swipe-120hz-build262
          fetch-depth: 0

      - name: Apply Build262 source changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          interaction = Path('Sources/UI/EmbyHomeCarouselInteractionV3.swift')
          text = interaction.read_text()
          old_axis = '''        if axis == nil {
            guard max(abs(translation.width), abs(translation.height)) >= 0.5 else { return }
            axis = abs(translation.width) >= abs(translation.height) ? .horizontal : .vertical
            if axis == .vertical { state = .failed; return }
            guard shouldBeginHorizontal?(translation) == true else { state = .failed; return }
'''
          new_axis = '''        if axis == nil {
            guard let resolvedAxis = resolvedAxis(for: translation) else { return }
            axis = resolvedAxis
            if axis == .vertical { state = .failed; return }
            guard shouldBeginHorizontal?(translation) == true else { state = .failed; return }
'''
          if text.count(old_axis) != 1: raise SystemExit(f'axis block count={text.count(old_axis)}')
          text = text.replace(old_axis, new_axis, 1)

          marker = '    private func recordReleaseMotionSample(translationX: CGFloat, touch: UITouch, event: UIEvent, view: UIView) {\n'
          resolved_axis = '''    private func resolvedAxis(for translation: CGSize) -> V3HomeCarouselTouchAxis? {
        let horizontal = abs(translation.width)
        let vertical = abs(translation.height)
        let dominant = max(horizontal, vertical)
        guard dominant >= 2 else { return nil }
        if horizontal >= vertical * 1.15 { return .horizontal }
        if vertical >= horizontal * 1.15 { return .vertical }
        guard dominant >= 6 else { return nil }
        return horizontal >= vertical ? .horizontal : .vertical
    }

'''
          if text.count(marker) != 1: raise SystemExit('recordReleaseMotionSample marker mismatch')
          text = text.replace(marker, resolved_axis + marker, 1)

          old_home = '''    func shouldBeginNativeCarouselDrag(_ translation: CGSize) -> Bool {
        guard transitionToID == nil || isCarouselDragging else { return false }
        let direction = translation.width < 0 ? 1 : -1
        guard let currentID = currentCarouselItemID else { return false }
        return neighborCarouselItemID(from: currentID, direction: direction) != nil
    }

    func handleNativeCarouselDrag(_ translation: CGSize, width: CGFloat) {
        let horizontal = translation.width
        suppressCarouselTap()
        guard transitionToID == nil || isCarouselDragging else { return }
'''
          new_home = '''    func shouldBeginNativeCarouselDrag(_ translation: CGSize) -> Bool {
        guard prepareCarouselForNewInteractiveDrag() else { return false }
        let direction = translation.width < 0 ? 1 : -1
        guard let currentID = currentCarouselItemID else { return false }
        return neighborCarouselItemID(from: currentID, direction: direction) != nil
    }

    func prepareCarouselForNewInteractiveDrag() -> Bool {
        guard !isCarouselDragging, let targetID = transitionToID else { return true }
        if transitionProgress >= 0.999 {
            DiagnosticsLogger.shared.app("HomeCarouselRapidSwipe", "interrupt=commit-settle target=\\(targetID)")
            settleCarousel(on: targetID)
            return true
        }
        if transitionProgress <= 0.001 {
            DiagnosticsLogger.shared.app("HomeCarouselRapidSwipe", "interrupt=cancel-settle target=\\(targetID)")
            transitionFromID = nil
            transitionToID = nil
            transitionDirection = 1
            carouselLastSettledAt = Date()
            V3HomeCarouselCadenceDiagnostics.shared.end(reason: "cancel-settle-interrupted")
            return true
        }
        return false
    }

    func handleNativeCarouselDrag(_ translation: CGSize, width: CGFloat) {
        let horizontal = translation.width
        suppressCarouselTap()
        guard transitionToID == nil || isCarouselDragging else { return }
'''
          if text.count(old_home) != 1: raise SystemExit(f'home begin block count={text.count(old_home)}')
          interaction.write_text(text.replace(old_home, new_home, 1))

          hero = Path('Sources/UI/EmbyHomeHeroV3.swift')
          text = hero.read_text()
          old_persistent = '''    func persistentCarouselBackdrop(size: CGSize) -> some View {
        ZStack {
            if let item = currentCarouselItem {
                carouselPersistentImage(item: item, size: size)
            }
            if let item = transitionTargetCarouselItem {
                carouselPersistentImage(item: item, size: size).opacity(Double(carouselBackdropBlendProgress(transitionProgress)))
            }

            LinearGradient(
'''
          new_persistent = '''    func persistentCarouselBackdrop(size: CGSize) -> some View {
        ZStack {
            ForEach(carouselHeroResidentItems) { item in
                carouselPersistentImage(item: item, size: size).opacity(carouselOpacity(for: item.id))
            }

            LinearGradient(
'''
          if text.count(old_persistent) != 1: raise SystemExit(f'persistent block count={text.count(old_persistent)}')
          hero.write_text(text.replace(old_persistent, new_persistent, 1))

          identity = Path('Sources/Core/AppIdentity.swift')
          text = identity.read_text()
          if text.count('0.14.49') != 2: raise SystemExit(f'identity count={text.count("0.14.49")}')
          identity.write_text(text.replace('0.14.49', '0.14.95'))
          PY

          python3 - <<'PY'
          from pathlib import Path
          i = Path('Sources/UI/EmbyHomeCarouselInteractionV3.swift').read_text()
          h = Path('Sources/UI/EmbyHomeHeroV3.swift').read_text()
          a = Path('Sources/Core/AppIdentity.swift').read_text()
          assert 'guard dominant >= 2 else { return nil }' in i
          assert 'guard dominant >= 6 else { return nil }' in i
          assert 'prepareCarouselForNewInteractiveDrag()' in i
          assert 'interrupt=commit-settle' in i and 'interrupt=cancel-settle' in i
          assert 'let velocityCommit = directionalVelocity >= 500' in i
          assert 'actualProgress >= 0.28 || velocityCommit' in i
          assert 'ForEach(carouselHeroResidentItems)' in h
          assert h.count('.compositingGroup()') == 1
          assert '.blur(radius: 30)' in h
          assert 'sourceVersion = "0.14.95"' in a
          print('Build262 source assertions OK')
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/temp-pr-apply-detail-immersive-patch.yml
          git rm -f .github/workflows/temp-materialize-build262-carousel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Core/AppIdentity.swift Sources/UI/EmbyHomeCarouselInteractionV3.swift Sources/UI/EmbyHomeHeroV3.swift .github/workflows/temp-pr-apply-detail-immersive-patch.yml
          git commit -m "Build262 improve rapid carousel ownership and persistent residency"
          git push origin HEAD:perf/home-carousel-rapid-swipe-120hz-build262
