name: Temp PR Build134 EX Scrub HUD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build134:
    if: github.event.pull_request.head.ref == 'diag/scrub-hud-ex-0.13.67'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply exact EX scrub HUD patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path('Sources/Core/AppIdentity.swift')
          text = app.read_text()
          if '"0.13.67"' not in text:
              count = text.count('"0.13.66"')
              if count != 2: raise SystemExit(f'AppIdentity mismatch: {count}')
              app.write_text(text.replace('"0.13.66"', '"0.13.67"'))

          player = Path('Sources/UI/PlayerScreen.swift')
          text = player.read_text()
          old_scrub = '                if let feedback = controller.scrubFeedback { feedbackView(feedback).scaleEffect(0.72).zIndex(40) }'
          new_scrub = '''                if let feedback = controller.scrubFeedback {
                    VStack {
                        Spacer()
                        screenScrubFeedbackView(feedback).padding(.bottom, 116)
                    }
                    .allowsHitTesting(false)
                    .zIndex(40)
                }'''
          if 'screenScrubFeedbackView(feedback).padding(.bottom, 116)' not in text:
              if text.count(old_scrub) != 1: raise SystemExit(f'PlayerScreen scrub anchor mismatch: {text.count(old_scrub)}')
              text = text.replace(old_scrub, new_scrub, 1)

          anchor = '    private func rateFeedbackView(_ rate: Double) -> some View {'
          helper = '''    private func screenScrubFeedbackView(_ text: String) -> some View {
        let lines = text.components(separatedBy: "\\n")
        let timeParts = (lines.first ?? "").components(separatedBy: " / ")
        let current = timeParts.first ?? ""
        let duration = timeParts.count > 1 ? timeParts[1] : ""
        let deltaRaw = lines.count > 1 ? lines[1] : ""
        let deltaText = deltaRaw.replacingOccurrences(of: " 秒", with: "s")
        let isBackward = deltaText.trimmingCharacters(in: .whitespacesAndNewlines).hasPrefix("-")

        return VStack(spacing: 2) {
            HStack(spacing: 3) {
                Text(current).foregroundColor(.white)
                if !duration.isEmpty { Text("/ " + duration).foregroundColor(.white.opacity(0.58)) }
            }
            .font(.system(size: 16, weight: .semibold))
            .monospacedDigit()

            if !deltaText.isEmpty {
                HStack(spacing: 4) {
                    Image(systemName: isBackward ? "backward.fill" : "forward.fill")
                    Text(deltaText).monospacedDigit()
                }
                .font(.system(size: 13, weight: .semibold))
                .foregroundColor(Color(red: 0.11, green: 0.91, blue: 0.32))
            }
        }
        .padding(.horizontal, 12)
        .padding(.vertical, 8)
        .frame(minWidth: 142)
        .background(RoundedRectangle(cornerRadius: 11, style: .continuous).fill(Color(red: 0.45, green: 0.43, blue: 0.42).opacity(0.88)))
        .overlay(RoundedRectangle(cornerRadius: 11, style: .continuous).stroke(Color.white.opacity(0.08), lineWidth: 0.5))
        .allowsHitTesting(false)
    }

'''
          if 'private func screenScrubFeedbackView(_ text: String)' not in text:
              if text.count(anchor) != 1: raise SystemExit(f'PlayerScreen helper anchor mismatch: {text.count(anchor)}')
              text = text.replace(anchor, helper + anchor, 1)
          player.write_text(text)

          for temp in [Path('.github/workflows/apply-build134-ex-scrub-hud.yml'), Path('docs/build134-trigger.txt')]:
              if temp.exists(): temp.unlink()
          PY
          git diff --check
          git status --short

      - name: Commit Build134 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Build134: match EX scrub HUD styling'
            git push origin HEAD:diag/scrub-hud-ex-0.13.67
          fi

      - name: Verify Build134 contract
        run: |
          set -euo pipefail
          grep -Fq 'sourceVersion = "0.13.67"' Sources/Core/AppIdentity.swift
          grep -Fq 'screenScrubFeedbackView(feedback).padding(.bottom, 116)' Sources/UI/PlayerScreen.swift
          grep -Fq '.font(.system(size: 16, weight: .semibold))' Sources/UI/PlayerScreen.swift
          grep -Fq '.font(.system(size: 13, weight: .semibold))' Sources/UI/PlayerScreen.swift
          grep -Fq 'Color(red: 0.11, green: 0.91, blue: 0.32)' Sources/UI/PlayerScreen.swift
          grep -Fq 'RoundedRectangle(cornerRadius: 11, style: .continuous)' Sources/UI/PlayerScreen.swift
          grep -Fq 'intent = "doubleTapFastSeek"' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'intent = "scrubReleaseFastSeek"' Sources/Player/MPVPlayerEngine.swift
          test "$(grep -Fc 'mode = "absolute+keyframes"' Sources/Player/MPVPlayerEngine.swift)" -ge 2
          grep -Fq 'private static let fastSeekBurstWindow: CFTimeInterval = 1.0' Sources/Player/PlayerController.swift
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          test ! -e .github/workflows/apply-build134-ex-scrub-hud.yml
          test ! -e docs/build134-trigger.txt

      - name: Select Xcode and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodebuild -version
          swift --version

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build Release for generic iOS device
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.67 CURRENT_PROJECT_VERSION=134 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Locate built app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Validate app identity
        run: |
          set -euo pipefail
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.67' --build '134' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log

      - name: Validate minimum OS
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.67-build134-ex-scrub-hud-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build134 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.67-build134-ex-scrub-hud
          path: |
            OnePlayer-0.13.67-build134-ex-scrub-hud-unsigned.ipa
            OnePlayer-0.13.67-build134-ex-scrub-hud-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
            build.log
          if-no-files-found: error
          retention-days: 14