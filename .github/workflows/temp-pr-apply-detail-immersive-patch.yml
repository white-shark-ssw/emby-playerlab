name: Temp Home UI Polish

on:
  push:
    branches: [feat/home-ui-polish]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align immersive controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/UI/EmbyServerRootViewV3.swift')
          s = p.read_text()
          old = '                            header(immersive: true)\n                                .padding(.top, geometry.safeAreaInsets.top)'
          assert old in s
          p.write_text(s.replace(old, '                            header(immersive: true)', 1))
          PY
      - name: Restore workflow and commit
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/temp-pr-apply-detail-immersive-patch.yml
          git config user.name os-player-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'fix: align immersive home controls' || exit 0
          git push
