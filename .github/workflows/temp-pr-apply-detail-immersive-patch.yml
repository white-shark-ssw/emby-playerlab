name: TEMP Build265 Carousel Image Analysis Dedupe

on:
  push:
    branches: [ci/build265-carousel-20260830]

permissions:
  contents: read

jobs:
  build265:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      PRODUCT_SHA: af92164890e7dc1c869bd586577b39177335df5f
      BASE_SHA: 323a1ba8c76382de7b893d50e3cf17388747b05f
      VERSION: 0.14.98
      BUILD_NUMBER: 265
    steps:
      - name: Checkout exact Build265 product source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Verify exact source and Build265 scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          grep -Fq 'sourceVersion = "0.14.98"' Sources/Core/AppIdentity.swift
          grep -Fq 'private enum V3HomeCarouselImageAnalysisIdentityCache' Sources/UI/EmbyHomeCarouselStateV3.swift
          grep -Fq 'static var identifiersByItemID: [String: ObjectIdentifier] = [:]' Sources/UI/EmbyHomeCarouselStateV3.swift
          grep -Fq 'guard V3HomeCarouselImageAnalysisIdentityCache.identifiersByItemID[itemID] != identifier else { return }' Sources/UI/EmbyHomeCarouselStateV3.swift
          grep -Fq 'V3HomeCarouselImageAnalysisIdentityCache.identifiersByItemID[itemID] = identifier' Sources/UI/EmbyHomeCarouselStateV3.swift
          grep -Fq 'V3HomeCarouselImageAnalysisIdentityCache.identifiersByItemID = V3HomeCarouselImageAnalysisIdentityCache.identifiersByItemID.filter { ids.contains($0.key) }' Sources/UI/EmbyHomeCarouselStateV3.swift
          grep -Fq 'let prefersLight = EmbyImageContrastAnalyzer.prefersLightForeground(for: image)' Sources/UI/EmbyHomeCarouselStateV3.swift
          grep -Fq 'guard dominant >= 2 else { return nil }' Sources/UI/EmbyHomeCarouselInteractionV3.swift
          grep -Fq 'prepareCarouselForNewInteractiveDrag()' Sources/UI/EmbyHomeCarouselInteractionV3.swift
          grep -Fq 'let velocityCommit = directionalVelocity >= 500' Sources/UI/EmbyHomeCarouselInteractionV3.swift
          grep -Fq 'let shouldCommit = actualProgress >= 0.28 || velocityCommit' Sources/UI/EmbyHomeCarouselInteractionV3.swift
          test "$(grep -Fc 'ForEach(carouselHeroResidentItems)' Sources/UI/EmbyHomeHeroV3.swift)" -eq 1
          grep -Fq 'if let item = currentCarouselItem {' Sources/UI/EmbyHomeHeroV3.swift
          grep -Fq 'if let item = transitionTargetCarouselItem {' Sources/UI/EmbyHomeHeroV3.swift
          grep -Fq 'carouselPersistentImage(item: item, size: size).opacity(Double(carouselBackdropBlendProgress(transitionProgress)))' Sources/UI/EmbyHomeHeroV3.swift
          test "$(grep -Fc '.compositingGroup()' Sources/UI/EmbyHomeHeroV3.swift)" -eq 1
          grep -Fq '.blur(radius: 30)' Sources/UI/EmbyHomeHeroV3.swift
          grep -Fq 'maxWidth: 1400' Sources/UI/EmbyHomeCarouselStateV3.swift
          ! grep -Fq 'HomeCarouselReleaseHandoff' Sources/UI/EmbyHomeCarouselInteractionV3.swift
          ! grep -Fq 'homeCarouselPerformanceIsolationEnabled' Sources/UI/EmbyHomeCoreV3.swift
          grep -Fq 'iOS: "15.0"' project.yml
          grep -Fq 'CADisableMinimumFrameDurationOnPhone' Config/Info.plist
          git diff --name-only "$BASE_SHA" HEAD | sort > /tmp/build265-changed.txt
          printf '%s\n' 'Sources/Core/AppIdentity.swift' 'Sources/UI/EmbyHomeCarouselStateV3.swift' | sort > /tmp/build265-expected.txt
          diff -u /tmp/build265-expected.txt /tmp/build265-changed.txt
          git diff --check "$BASE_SHA" HEAD

      - name: Export exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="OnePlayer-0.14.98-build265-${PRODUCT_SHA:0:7}-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" | tee "$SOURCE_ZIP.sha256"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Select Xcode 16.4 and install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodegen --version
          pod --version

      - name: Generate project and resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build Release for generic iOS device
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Locate and validate built app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          /usr/bin/plutil -p "$APP_PATH/Info.plist" | tee built-info-plist.log
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version "$VERSION" --build "$BUILD_NUMBER" --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package and hash unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA="OnePlayer-0.14.98-build265-carousel-image-analysis-dedupe-unsigned.ipa"
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Upload Build265 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.98-build265-carousel-image-analysis-dedupe
          path: |
            ${{ env.IPA }}
            ${{ env.IPA }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            app-validation.log
            min-os-report.log
            built-info-plist.log
            build.log
          if-no-files-found: error
          retention-days: 30
