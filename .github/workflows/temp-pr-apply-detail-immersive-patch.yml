name: TEMP Sync Build264 Carousel Evidence

on:
  push:
    branches: [ci/build264-carousel-20260830]

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync Build262 real-device and Build264 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # BUILD_TEST_INDEX.md
          p = Path('docs/project/BUILD_TEST_INDEX.md')
          t = p.read_text()
          old = '''| **Build262 / 0.14.95** | Home-carousel rapid-swipe ownership + persistent-residency long-frame A/B | **Exact-source CI/IPA verified; target-device pending; not stable.** Exact product source `86ac642ec33ad927a1bc3688824bfe0909b22bab` changes only AppIdentity, `EmbyHomeCarouselInteractionV3.swift` and `EmbyHomeHeroV3.swift`: small spatial axis hysteresis replaces the old 0.5 pt one-sample decision; a new horizontal swipe can take over commit/cancel settle endpoints whose authoritative progress is already 1/0 during delayed cleanup; and the existing current/previous/next resident window is reused for the blurred persistent backdrop as an explicit FPS/long-frame A/B. Build241 `>=500 pt/s` + `>=0.28`, Build231 foreground compositing, Build226 Hero residency, blur30, one UIKit owner and 0.22/0.18 normal settle remain. CI run/job `33311662277 / 99257718260`; artifact `9732204076`, digest `sha256:3558a391076ec952faf93ccdd8be94c2649ebfbf835d228466fae31b0aa8406b`; IPA SHA-256 `0e2a70edb9c5a22df87d0c2a028845dd54b516240f158c205087a0c889133bd5`; source ZIP SHA-256 `b4d6e917478755285e7575e45d71458a3731371dbf05ca9b85a37013f0cf37fa`; bundle `com.embyplayerlab.app`, MinOS 15.0 independently verified. Draft PR #269; real-device rapid-swipe ownership/FPS A/B required before merge. |'''
          new = '''| **Build262 / 0.14.95** | Home-carousel rapid-swipe ownership + persistent-residency A/B | **Target-device tested: interaction/FPS materially positive, persistent presentation hard-freeze rejects the candidate; not stable.** Exact source `86ac642ec33ad927a1bc3688824bfe0909b22bab`; run/job `33311662277 / 99257718260`; artifact `9732204076`; IPA SHA `0e2a70edb9c5a22df87d0c2a028845dd54b516240f158c205087a0c889133bd5`; MinOS 15.0. User repeatedly stress-tested rapid swipes and reports FPS generally ~90–100 instead of Build241 ~30/44 low drops; the log contains 9 real `HomeCarouselRapidSwipe` settle interrupts. However `卡住了.mp4` shows the visual carousel hard-freezing on a blended frame while the matching interval still records 11 releases + 11 `HomeCarousel settled` item changes, proving authoritative interaction/current-item state continues while presentation is frozen. The experimental persistent current/previous/next residency is rejected; PR #269 closed without merge. |
| **Build264 / 0.14.97** | Retain Build262 rapid-swipe fix; roll back persistent residency | **Exact-source CI/IPA verified; target-device pending; not stable.** Directly based on Build262 exact source. Exact product source `323a1ba8c76382de7b893d50e3cf17388747b05f` changes only AppIdentity and `persistentCarouselBackdrop`: Build262 axis hysteresis + rapid-settle takeover remain byte-identical, while persistent backdrop returns to Build241 current+transition-target layering. Accepted Build226 clear-Hero three-slot residency and Build231 foreground compositing remain. Run/job `33315346306 / 99267618336`; artifact `9733296528`, digest `sha256:b3acb0efc4cbbf3b2c05e9cfeb88638aeadf25776f3c1fc6b904f18436855b4f`; IPA SHA `fe8354eaa0cb6afeb59454d6afd31c8e5da3e78bcade1242af499f7db7c51499`; source ZIP SHA `30e8bd7b3c41df3a9b83625da2c6bfdf3d978e64af0a6c5ba6a3cab421dababd`; bundle `com.embyplayerlab.app`, MinOS 15.0 independently verified. Draft PR #272. |'''
          if old not in t: raise SystemExit('BUILD_TEST_INDEX Build262 anchor missing')
          p.write_text(t.replace(old, new, 1))

          # PROJECT_STATE.md
          p = Path('docs/project/PROJECT_STATE.md')
          t = p.read_text()
          old = '_Last updated 2026-08-30: Poster Build263 / 0.14.96 is Code written / CI passed / IPA produced+independently verified and awaits target-device severe-gap attribution testing. Build261 remains the real-device authority: Home 120 Hz motion improved, Library cell lifecycle churn is a proven contributor, and a second fixed-item severe-gap source remains. Home-carousel Build262 is a separate active CI/IPA candidate. Search Build256 and P0 playback/transport contracts remain protected._'
          new = '_Last updated 2026-08-30: Home-carousel Build262 is now target-device tested: rapid-swipe continuity/FPS materially improved, but its experimental persistent three-slot backdrop can hard-freeze visually while interaction/current-item state continues, so Build262 is rejected. Build264 / 0.14.97 retains the Build262 interaction fix and rolls back only persistent residency; exact-source CI/IPA verified, target-device pending. Poster Build263 remains a separate CI/IPA diagnostic candidate. Search Build256 and P0 playback/transport contracts remain protected._'
          if old not in t: raise SystemExit('PROJECT_STATE last-updated anchor missing')
          t = t.replace(old, new, 1)
          old = '## Completed / frozen: Home carousel interaction — Build241 / 0.14.74\n\nWork `DEV-home-carousel-drag-smoothness` is complete. The controlling product/runtime result is **Build241 / OnePlayer 0.14.74**, explicitly selected by the user as the final carousel version after target-device testing on iPhone 15 Pro Max / iOS 17.0.'
          new = '## Active: Home carousel interaction — Build264 / 0.14.97\n\nWork `DEV-home-carousel-drag-smoothness` was reopened by new 2026-08-30 Build241-vs-EX rapid-swipe evidence. Build241 remains the merged visual/behavior baseline, but its former whole-carousel final/frozen status is revoked: repeated rapid horizontal swipes can fall through to Home vertical scrolling and the on-screen FPS indicator can fall to roughly 30/44 while EX holds 120.'
          if old not in t: raise SystemExit('PROJECT_STATE carousel heading anchor missing')
          t = t.replace(old, new, 1)
          anchor = '**Build242 / OnePlayer 0.14.75 is not a final version.**'
          insert = '''**Build262 / OnePlayer 0.14.95 is target-device tested but rejected as a product candidate.** Its small axis hysteresis and settle-endpoint takeover are materially positive: the user reports repeated rapid-swipe FPS generally around 90–100 and the App log records 9 actual `HomeCarouselRapidSwipe` interrupts. But the experimental persistent current/previous/next blurred-backdrop residency introduces a severe hard visual freeze. During the matching stuck-video interval the log continues through 11 releases and 11 `HomeCarousel settled` item changes, so the interaction/current-item owner is still advancing while the presentation is frozen. PR #269 is closed without merge.\n\n**Build264 / OnePlayer 0.14.97 is the current rollback A/B.** Exact source `323a1ba8c76382de7b893d50e3cf17388747b05f` is directly based on Build262 and keeps `EmbyHomeCarouselInteractionV3.swift` unchanged; only AppIdentity and the persistent backdrop differ. Persistent presentation returns to Build241 current+transition-target layering, while accepted clear-Hero three-slot residency remains. Exact-source run/job `33315346306 / 99267618336` passed; artifact `9733296528`; IPA SHA `fe8354eaa0cb6afeb59454d6afd31c8e5da3e78bcade1242af499f7db7c51499`; MinOS 15.0; Draft PR #272; target-device pending.\n\n'''
          if anchor not in t: raise SystemExit('PROJECT_STATE Build242 anchor missing')
          t = t.replace(anchor, insert + anchor, 1)
          old = 'Build241 manual horizontal interaction/presentation remains frozen. New 2026-08-30 target-device evidence has reopened only the automatic-transition scheduling sub-contract: auto-advance overlapping Home vertical inertia causes a repeatable large hitch. Do not retune Build241 manual drag/release/presentation behavior from this evidence.'
          new = 'Build241 is now the historical merged manual-carousel baseline rather than a frozen final. The newer direct EX comparison explicitly reopens manual rapid-swipe ownership/cadence. Build262 proves the new interaction-continuity direction is useful but also rejects persistent blurred three-slot residency because of a hard visual freeze. Build264 keeps the interaction changes and rolls back only that persistent experiment; do not alter the retained 500 pt/s / 0.28 / clear-Hero residency / foreground-compositing contracts without new evidence.'
          if old not in t: raise SystemExit('PROJECT_STATE frozen sentence anchor missing')
          p.write_text(t.replace(old, new, 1))

          # TECHNICAL_DECISIONS.md
          p = Path('docs/project/TECHNICAL_DECISIONS.md')
          t = p.read_text()
          anchor = 'Build242 is the whole-stack Home-performance attribution A/B and does **not** redefine normal carousel behavior.'
          insert = '''**Build262 rapid-swipe real-device decision:** the Build241 one-sample axis decision and post-release cleanup ownership gap are no longer protected as final behavior. Build262 replaces them inside the same UIKit owner with small spatial hysteresis and endpoint takeover. Target-device stress materially validates this direction: the user reports rapid-swipe FPS generally around 90–100 rather than Build241 30/44-class lows, and the log records 9 actual settle interrupts. Preserve this interaction direction into the next candidate; do not revert it merely because Build262 as a whole is rejected.\n\n**Build262 persistent-residency rejection / Build264 rollback:** do not reuse the clear-Hero `carouselHeroResidentItems` window for the full-screen blurred persistent backdrop. The Build262 stuck recording remains visually frozen on a blended frame while its matching log continues through 11 releases and 11 settled current-item changes, which separates the failure from the interaction state owner and points to presentation. Because persistent three-slot residency is the only new Build262 presentation experiment relative to the long-lived Build241 path, Build264 returns persistent presentation to current+transition-target layering only. This rejection applies to persistent blurred residency; it does **not** reject the accepted Build226 clear-Hero current/previous/next residency or Build231 foreground `compositingGroup()`. No timer/watchdog/retry/zIndex recovery layer is authorized.\n\n'''
          if anchor not in t: raise SystemExit('TECHNICAL_DECISIONS Build242 anchor missing')
          p.write_text(t.replace(anchor, insert + anchor, 1))
          PY
          git diff --check
          git diff -- docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md
          git commit -m 'Docs: record Build262 device result and Build264 baseline'
          git push origin HEAD:main
