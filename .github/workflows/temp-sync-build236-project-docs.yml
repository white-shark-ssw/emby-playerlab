name: TEMP Sync Build236 Project Docs

on:
  push:
    branches: [perf/home-carousel-post-acquisition-baseline-build236]
    paths:
      - ".github/build236-docs-sync-trigger.txt"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build236 branch
        uses: actions/checkout@v4
        with:
          ref: perf/home-carousel-post-acquisition-baseline-build236
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh feature checkpoint
        run: |
          set -euo pipefail
          python3 scripts/temp_sync_build236_docs.py branch
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          if ! git diff --cached --quiet; then
            git commit -m "Docs: record Build236 CI IPA baseline"
            git push origin HEAD:perf/home-carousel-post-acquisition-baseline-build236
          fi
          cp scripts/temp_sync_build236_docs.py /tmp/temp_sync_build236_docs.py

      - name: Sync authoritative project docs to main
        run: |
          set -euo pipefail
          git fetch origin main perf/home-carousel-post-acquisition-baseline-build236
          git checkout -B main origin/main
          git pull --ff-only origin main
          python3 /tmp/temp_sync_build236_docs.py main
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected = {
              'docs/project/current/dev/DEV-home-carousel-drag-smoothness.md',
              'docs/project/MODULE_STATUS.md',
              'docs/project/BUILD_TEST_INDEX.md',
              'docs/project/PROJECT_STATE.md',
              'docs/project/TECHNICAL_DECISIONS.md',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          extra = sorted(changed - expected)
          if extra: raise SystemExit(f'Unexpected Build236 main docs: {extra}')
          checkpoint = Path('docs/project/current/dev/DEV-home-carousel-drag-smoothness.md').read_text()
          module = Path('docs/project/MODULE_STATUS.md').read_text()
          index = Path('docs/project/BUILD_TEST_INDEX.md').read_text()
          tech = Path('docs/project/TECHNICAL_DECISIONS.md').read_text()
          assert 'OnePlayer `0.14.69 (236)`' in checkpoint
          assert '7811f34104daaea8734e72404bcb2fadb6fa37f7' in checkpoint
          assert 'Build236 post-acquisition real-predecessor A/B CI/IPA verified' in module
          assert 'Carousel Build236 / 0.14.69' in index
          assert 'Build236 implements the Build234-authorized one-event extension' in tech
          print('Build236 main docs scope: PASS')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md
          if ! git diff --cached --quiet; then
            git commit -m "Docs: sync Build236 carousel test baseline"
            git push origin HEAD:main
          fi
