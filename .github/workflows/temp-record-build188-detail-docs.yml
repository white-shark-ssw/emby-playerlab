name: Record Build188 detail candidate docs

on:
  push:
    branches: [feat/detail-episode-selection-navigation]
    paths:
      - ".github/workflows/temp-record-build188-detail-docs.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record Build188 evidence
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path

          index = Path('docs/project/BUILD_TEST_INDEX.md')
          text = index.read_text()
          row187 = '| **Build187 / 0.14.20** | Exportable carousel drag-cadence diagnostic | Same drag behavior as Build186; routes `HomeCarouselDragTiming` through the existing playback-log export. Dedicated Release CI passed, IPA produced and downloaded checksums verified. **Current carousel diagnostic candidate; real-device evidence pending.** |'
          row188 = '| **Build188 / 0.14.21** | Detail episode selection semantics + full picker return | Detail horizontal cards select-only with blue outline and compact selected-episode summary; main Play/Resume plays the selected episode. Full picker no longer dismisses before playback, so closing player should reveal the same picker/scroll position. Dedicated Release CI/IPA succeeded; **real-device evidence pending.** |'
          if row188 not in text:
              if row187 not in text:
                  raise SystemExit('Build187 carousel row marker missing')
              text = text.replace(row187, row187 + '\n' + row188, 1)
          old_summary = 'Build182 remains real-device accepted/frozen for the two detail performance/cache requirements and is inherited by Build184. Build184 / 0.14.17 is the accepted overall runtime baseline merged to `main`; Build185 is real-device rejected and Build187 / 0.14.20 is the current independent home-carousel diagnostic candidate pending recording plus exported playback log.'
          new_summary = 'Build182 remains real-device accepted/frozen for the two detail performance/cache requirements and is inherited by Build184. Build184 / 0.14.17 is the accepted overall runtime baseline merged to `main`; Build185 is real-device rejected, Build187 / 0.14.20 is the independent home-carousel diagnostic candidate, and Build188 / 0.14.21 is the independent detail/episode-selection candidate. Both newer candidates remain real-device pending and do not replace Build184.'
          if old_summary in text:
              text = text.replace(old_summary, new_summary, 1)
          elif new_summary not in text:
              raise SystemExit('BUILD_TEST_INDEX current-summary marker missing')
          index.write_text(text)

          state = Path('docs/project/PROJECT_STATE.md')
          text = state.read_text()
          first_start = '_Last updated after '
          first_end = '_\n\n## Current functional baseline'
          start = text.find(first_start)
          end = text.find(first_end)
          if start < 0 or end < 0:
              raise SystemExit('PROJECT_STATE last-updated marker missing')
          updated = '_Last updated after Build187 / OnePlayer 0.14.20 completed dedicated Release CI/IPA as the current exportable home-carousel diagnostic candidate and Build188 / OnePlayer 0.14.21 completed dedicated Release CI/IPA as the current detail/episode-selection navigation candidate. Build184 / OnePlayer 0.14.17 remains the accepted overall functional baseline on `main`; neither candidate replaces it until target-device evidence is accepted._'
          text = text[:start] + updated + text[end+1:]
          build184 = 'Build184 / OnePlayer 0.14.17 is **real-device accepted, stable for the completed detail-page requirements, and merged to `main` through PR #255**. It preserves Build182 detail performance/cache behavior and only adds the accepted visual hierarchy changes: `视频信息` below `更多类似`, above the bottom glass media-source summary, with the main section headers at 19 pt bold.'
          build188 = '\n\nBuild188 / OnePlayer 0.14.21 is the current independent **detail/episode-selection navigation candidate**. Detail horizontal episode cards now select only and retain the blue selected outline; a compact 12 pt selected-episode summary appears above the horizontal cards, while the existing main Play/Resume button remains the playback action. Full picker episode playback no longer dismisses the picker or waits 100 ms before resolving playback; the visible picker presents the shared `model.selectedSource`, so closing player should return to the same picker instance/scroll position. Dedicated Release run `32864835934` passed, artifact `9569812832` was produced, and downloaded IPA SHA-256 `c82fcca99162f4840d8b0fccdb7c2f6203426d12901ef5d6ac4f4879db78b9ff` matched the artifact checksum. **Real-device evidence is pending; accepted baseline remains Build184.**'
          if build188.strip() not in text:
              if build184 not in text:
                  raise SystemExit('PROJECT_STATE Build184 marker missing')
              text = text.replace(build184, build184 + build188, 1)
          state.write_text(text)
          PY
          git diff --check
          git diff -- docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md
          git config user.name "OnePlayer Project Control"
          git config user.email "actions@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md
          if git diff --cached --quiet; then
            echo "No doc changes needed"
            exit 0
          fi
          git commit -m "Record Build188 detail test candidate"
          git push origin HEAD:main
