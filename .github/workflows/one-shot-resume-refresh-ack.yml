name: One-shot resume refresh acknowledgement patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/resume-refresh-ack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply refresh acknowledgement patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          core = Path('Sources/Core/EmbyUserDataChange.swift')
          text = core.read_text()
          old = '''enum EmbyUserDataChange {
              static let notification = Notification.Name("com.embyplayerlab.userDataDidChange")
              static let itemIDKey = "itemID"
          }
          '''
          new = '''enum EmbyUserDataChange {
              static let notification = Notification.Name("com.embyplayerlab.userDataDidChange")
              static let itemIDKey = "itemID"
              static let reasonKey = "reason"
              static let manualPlayedReason = "manualPlayed"
              static let playbackStoppedReason = "playbackStopped"
          }
          '''
          if 'playbackStoppedReason' not in text:
              if text.count(old) != 1: raise SystemExit('core patch mismatch')
              core.write_text(text.replace(old, new, 1))

          api = Path('Sources/Networking/EmbyAPIClient.swift')
          text = api.read_text()
          old = '''    func reportStart(source: ResolvedPlaybackSource, position: Double, paused: Bool) async { await report(path: "Sessions/Playing", eventName: nil, source: source, position: position, paused: paused) }
              func reportProgress(source: ResolvedPlaybackSource, position: Double, paused: Bool, eventName: String? = nil) async { await report(path: "Sessions/Playing/Progress", eventName: eventName, source: source, position: position, paused: paused) }
              func reportStopped(source: ResolvedPlaybackSource, position: Double) async { await report(path: "Sessions/Playing/Stopped", eventName: nil, source: source, position: position, paused: true) }
          '''
          new = '''    func reportStart(source: ResolvedPlaybackSource, position: Double, paused: Bool) async { _ = await report(path: "Sessions/Playing", eventName: nil, source: source, position: position, paused: paused) }
              func reportProgress(source: ResolvedPlaybackSource, position: Double, paused: Bool, eventName: String? = nil) async { _ = await report(path: "Sessions/Playing/Progress", eventName: eventName, source: source, position: position, paused: paused) }
              @discardableResult func reportStopped(source: ResolvedPlaybackSource, position: Double) async -> Bool { await report(path: "Sessions/Playing/Stopped", eventName: nil, source: source, position: position, paused: true) }
          '''
          if '@discardableResult func reportStopped' not in text:
              if text.count(old) != 1: raise SystemExit('api report signature patch mismatch')
              text = text.replace(old, new, 1)
          old = '''    private func report(path: String, eventName: String?, source: ResolvedPlaybackSource, position: Double, paused: Bool) async {
          '''
          new = '''    private func report(path: String, eventName: String?, source: ResolvedPlaybackSource, position: Double, paused: Bool) async -> Bool {
          '''
          if 'private func report(path: String, eventName: String?, source: ResolvedPlaybackSource, position: Double, paused: Bool) async -> Bool' not in text:
              if text.count(old) != 1: raise SystemExit('api report return patch mismatch')
              text = text.replace(old, new, 1)
          old = '''        do { let _: EmptyResponse = try await send(path: path, method: "POST", body: body) }
              catch { DiagnosticsLogger.shared.log("Emby", "Report \\(path) failed: \\(error.localizedDescription)") }
          '''
          new = '''        do {
                  let _: EmptyResponse = try await send(path: path, method: "POST", body: body)
                  return true
              } catch {
                  DiagnosticsLogger.shared.log("Emby", "Report \\(path) failed: \\(error.localizedDescription)")
                  return false
              }
          '''
          if 'return true' not in text[text.find('private func report(path:'):text.find('private func send<Response', text.find('private func report(path:'))]:
              if text.count(old) != 1: raise SystemExit('api report body patch mismatch')
              text = text.replace(old, new, 1)
          api.write_text(text)

          player = Path('Sources/Player/PlayerController.swift')
          text = player.read_text()
          old = '''        Task {
                  await client.reportStopped(source: source, position: position)
              }
          '''
          new = '''        let stoppedSource = source
              let stoppedClient = client
              Task {
                  let succeeded = await stoppedClient.reportStopped(source: stoppedSource, position: position)
                  guard succeeded else { return }
                  await MainActor.run {
                      NotificationCenter.default.post(
                          name: EmbyUserDataChange.notification,
                          object: stoppedClient,
                          userInfo: [
                              EmbyUserDataChange.itemIDKey: stoppedSource.itemId,
                              EmbyUserDataChange.reasonKey: EmbyUserDataChange.playbackStoppedReason,
                          ]
                      )
                  }
              }
          '''
          if 'let stoppedSource = source' not in text[:text.find('func togglePlayPause')]:
              if text.count(old) != 1: raise SystemExit('player stop patch mismatch')
              text = text.replace(old, new, 1)
          old = '''            Task { await client.reportStopped(source: source, position: snapshot.position) }
                  return
          '''
          new = '''            let stoppedSource = source
                  let stoppedClient = client
                  let stoppedPosition = snapshot.position
                  Task {
                      let succeeded = await stoppedClient.reportStopped(source: stoppedSource, position: stoppedPosition)
                      guard succeeded else { return }
                      await MainActor.run {
                          NotificationCenter.default.post(
                              name: EmbyUserDataChange.notification,
                              object: stoppedClient,
                              userInfo: [
                                  EmbyUserDataChange.itemIDKey: stoppedSource.itemId,
                                  EmbyUserDataChange.reasonKey: EmbyUserDataChange.playbackStoppedReason,
                              ]
                          )
                      }
                  }
                  return
          '''
          if 'let stoppedPosition = snapshot.position' not in text:
              if text.count(old) != 1: raise SystemExit('player eof patch mismatch')
              text = text.replace(old, new, 1)
          player.write_text(text)

          detail = Path('Sources/UI/EmbyMediaDetailView.swift')
          text = detail.read_text()
          old = '''        .task { await model.load() }
          '''
          new = '''        .task { await model.load() }
              .onReceive(NotificationCenter.default.publisher(for: EmbyUserDataChange.notification)) { notification in
                  guard let source = notification.object as? EmbyAPIClient, source === client,
                        notification.userInfo?[EmbyUserDataChange.reasonKey] as? String == EmbyUserDataChange.playbackStoppedReason,
                        let itemID = notification.userInfo?[EmbyUserDataChange.itemIDKey] as? String else { return }
                  Task { await model.refreshPlaybackUserData(itemID: itemID) }
              }
          '''
          if 'refreshPlaybackUserData(itemID: itemID)' not in text:
              if text.count(old) != 1: raise SystemExit('detail receive patch mismatch')
              text = text.replace(old, new, 1)
          old = '''                NotificationCenter.default.post(name: EmbyUserDataChange.notification, object: client, userInfo: [EmbyUserDataChange.itemIDKey: changedItemID])
          '''
          new = '''                NotificationCenter.default.post(
                      name: EmbyUserDataChange.notification,
                      object: client,
                      userInfo: [
                          EmbyUserDataChange.itemIDKey: changedItemID,
                          EmbyUserDataChange.reasonKey: EmbyUserDataChange.manualPlayedReason,
                      ]
                  )
          '''
          if 'EmbyUserDataChange.manualPlayedReason' not in text:
              if text.count(old) != 1: raise SystemExit('detail manual reason patch mismatch')
              text = text.replace(old, new, 1)
          needle = '''    func play(_ mediaItem: LibraryItem) async {
          '''
          addition = '''    func refreshPlaybackUserData(itemID: String) async {
              do {
                  let refreshed = try await client.libraryItem(itemId: itemID)
                  if item.id == itemID {
                      item = refreshed
                      hasPlaybackPositionOverride = false
                      playbackPositionOverrideTicks = nil
                      syncedPlayed = refreshed.isPlayed
                      desiredPlayed = refreshed.isPlayed
                  } else if let index = episodes.firstIndex(where: { $0.id == itemID }) {
                      episodes[index] = refreshed
                  }
                  DiagnosticsLogger.shared.log("EmbyDetail", "playback userdata refreshed item=\\(itemID) positionTicks=\\(refreshed.userData?.playbackPositionTicks ?? 0)")
              } catch {
                  if !isEmbyRequestCancellation(error) { DiagnosticsLogger.shared.log("EmbyDetail", "playback userdata refresh failed item=\\(itemID): \\(error.localizedDescription)") }
              }
          }

          '''
          if 'func refreshPlaybackUserData(itemID: String)' not in text:
              if text.count(needle) != 1: raise SystemExit('detail refresh method patch mismatch')
              text = text.replace(needle, addition + needle, 1)
          detail.write_text(text)

          home = Path('Sources/UI/EmbyServerRootViewV3.swift')
          text = home.read_text()
          text = text.replace('.refreshable { await model.refresh() }', '.refreshable { await model.refresh(userInitiated: true) }', 1)
          text = text.replace('.onChange(of: refreshToken) { _ in Task { await model.refresh() } }', '.onChange(of: refreshToken) { _ in Task { await model.refresh(userInitiated: true) } }', 1)
          text = text.replace('Button { Task { await model.refresh() } } label: { Label("刷新首页", systemImage: "arrow.clockwise") }', 'Button { Task { await model.refresh(userInitiated: true) } } label: { Label("刷新首页", systemImage: "arrow.clockwise") }', 1)
          old = '''            .onAppear { if !model.hasLoaded { Task { await model.refresh() } } }
          '''
          new = '''            .onAppear {
                  Task {
                      if !model.hasLoaded { await model.refresh() }
                      else { await model.refreshResumeIfNeeded() }
                  }
              }
          '''
          if 'refreshResumeIfNeeded()' not in text[:text.find('private var header')]:
              if text.count(old) != 1: raise SystemExit('home onAppear patch mismatch')
              text = text.replace(old, new, 1)
          old = '''                model.invalidateResumeItem(itemID)
                  Task { await model.refresh() }
          '''
          new = '''                model.markResumeDirty(itemID)
          '''
          if 'model.markResumeDirty(itemID)' not in text:
              if text.count(old) != 1: raise SystemExit('home notification patch mismatch')
              text = text.replace(old, new, 1)
          old = '''    private(set) var hasLoaded = false
          '''
          new = '''    private(set) var hasLoaded = false
              private var resumeDirty = false
              private var dirtyResumeItemIDs = Set<String>()
          '''
          if 'private var resumeDirty = false' not in text:
              if text.count(old) < 1: raise SystemExit('home state patch mismatch')
              # Replace the occurrence inside V3EmbyHomeViewModel only.
              marker = 'private final class V3EmbyHomeViewModel: ObservableObject {'
              idx = text.index(marker)
              tail = text[idx:]
              if tail.count(old) != 1: raise SystemExit('home state scoped mismatch')
              text = text[:idx] + tail.replace(old, new, 1)
          old = '''    func invalidateResumeItem(_ itemID: String) {
              resumeItems.removeAll { $0.id == itemID || $0.seriesId == itemID }
          }

              func refresh() async {
              guard !isLoading else { return }
          '''
          new = '''    func markResumeDirty(_ itemID: String) {
              resumeDirty = true
              dirtyResumeItemIDs.insert(itemID)
              DiagnosticsLogger.shared.log("HomeRefresh", "resume dirty item=\\(itemID)")
          }

              func refreshResumeIfNeeded() async {
              guard resumeDirty else { return }
              await refresh(userInitiated: true)
          }

              func refresh(userInitiated: Bool = false) async {
              if isLoading {
                  guard userInitiated else { return }
                  DiagnosticsLogger.shared.log("HomeRefresh", "user refresh waiting for active refresh")
                  while isLoading { try? await Task.sleep(nanoseconds: 50_000_000) }
              }
              if userInitiated {
                  try? await Task.sleep(nanoseconds: 250_000_000)
                  await refreshResumeOnly()
              }
              guard !isLoading else { return }
          '''
          if 'func markResumeDirty(_ itemID: String)' not in text:
              if text.count(old) != 1: raise SystemExit('home refresh entry patch mismatch')
              text = text.replace(old, new, 1)
          old = '''            resumeItems = uniqueItems(resume).filter { ["movie", "episode"].contains($0.type?.lowercased() ?? "") }
          '''
          new = '''            resumeItems = uniqueItems(resume).filter { ["movie", "episode"].contains($0.type?.lowercased() ?? "") }
                  resumeDirty = false
                  dirtyResumeItemIDs.removeAll()
          '''
          if 'dirtyResumeItemIDs.removeAll()' not in text:
              if text.count(old) != 1: raise SystemExit('home resume assignment patch mismatch')
              text = text.replace(old, new, 1)
          needle = '''    private static func browseItemTypes(for library: LibraryItem) -> [String] {
          '''
          addition = '''    private func refreshResumeOnly() async {
              do {
                  let resume = try await client.resumeItems(limit: 18)
                  resumeItems = uniqueItems(resume).filter { ["movie", "episode"].contains($0.type?.lowercased() ?? "") }
                  DiagnosticsLogger.shared.log("HomeRefresh", "resume refreshed count=\\(resumeItems.count) dirty=\\(resumeDirty) ids=\\(dirtyResumeItemIDs.sorted().joined(separator: ","))")
                  resumeDirty = false
                  dirtyResumeItemIDs.removeAll()
              } catch {
                  if !isEmbyRequestCancellation(error) { errorMessage = error.localizedDescription }
              }
          }

          '''
          if 'private func refreshResumeOnly() async' not in text:
              if text.count(needle) != 1: raise SystemExit('home resume-only patch mismatch')
              text = text.replace(needle, addition + needle, 1)
          home.write_text(text)

          staged = Path('.github/workflows/one-shot-resume-refresh-ack.yml')
          if staged.exists(): staged.unlink()
          PY
          git diff --check
          grep -q 'playbackStoppedReason' Sources/Core/EmbyUserDataChange.swift
          grep -q 'refresh(userInitiated: true)' Sources/UI/EmbyServerRootViewV3.swift
          grep -q 'refreshPlaybackUserData' Sources/UI/EmbyMediaDetailView.swift
          if git diff --quiet; then
            echo 'Already patched.'
            exit 0
          fi
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add -A
          git commit -m 'fix: synchronize resume refresh after playback stop'
          git push origin HEAD:fix/resume-refresh-ack
