name: Apply independent Hero scroll sentinel

on:
  push:
    branches:
      - "fix/hero-raw-scroll-sentinel"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply sentinel patch
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[hero-scroll-sentinel-applied]'; then
            echo 'Patch already applied.'
            exit 0
          fi
          git apply --check .github/hero-sentinel.patch
          git apply .github/hero-sentinel.patch
          python3 scripts/check_v0134_detail_navigation.py
          python3 scripts/check_adaptive_hero_reveal.py
          git diff --check

      - name: Commit source changes
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[hero-scroll-sentinel-applied]'; then exit 0; fi
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add Sources/UI/EmbyMediaDetailView.swift Sources/UI/EmbyEpisodePickerView.swift Sources/UI/ImmersiveUIComponents.swift scripts/check_adaptive_hero_reveal.py
          git commit -m 'fix: measure Hero scroll from independent top sentinel [hero-scroll-sentinel-applied]'
          git push origin HEAD:fix/hero-raw-scroll-sentinel
