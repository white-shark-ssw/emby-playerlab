name: Apply Dual Window Cache

on:
  push:
    branches: [fix/player-startup-cache-window]
    paths:
      - '.github/workflows/apply-dual-window-cache.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-startup-cache-window
          fetch-depth: 0

      - name: Apply frozen cache-window patch
        run: |
          set -euo pipefail
          git apply .github/rolling-cache/other.patch
          git apply .github/rolling-cache/unified-1.patch
          git apply .github/rolling-cache/unified-2.patch
          git apply .github/rolling-cache/unified-3.patch
          git apply .github/rolling-cache/unified-4.patch
          rm -rf .github/rolling-cache
          git diff --check

      - name: Commit source changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Implement bidirectional rolling cache window'
          git push origin HEAD:fix/player-startup-cache-window

      - name: Dispatch final source validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/validate-source.yml/dispatches \
            -d '{"ref":"fix/player-startup-cache-window"}'
