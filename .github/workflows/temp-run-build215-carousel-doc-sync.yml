name: One-shot Run Build215 Carousel Docs Sync

on:
  push:
    branches: [main]
    paths:
      - ".github/build215-carousel-doc-sync-trigger.txt"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Update Build215 project evidence
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 .github/scripts/temp-sync-build215-carousel-docs.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/BUILD_TEST_INDEX.md
          git commit -m "Docs: record Build215 carousel CI and IPA evidence"
          git pull --rebase origin main
          git push origin HEAD:main
