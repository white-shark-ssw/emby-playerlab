name: Build OnePlayer 0.13.79 Build146 Seek Module Cleanup

on:
  workflow_dispatch:
  push:
    branches: [refactor/keyframe-seek-cleanup-0.13.79]
    paths:
      - "Sources/**"
      - "project.mdklab.yml"
      - "Podfile"
      - ".github/workflows/build144-keyframe-timeout-tail.yml"
  pull_request:
    branches: [fix/keyframe-metadata-refill-0.13.78]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build146-keyframe-seek-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/refactor/keyframe-seek-cleanup-0.13.79' || github.head_ref == 'refactor/keyframe-seek-cleanup-0.13.79'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout Build146 source
        uses: actions/checkout@v4
        with:
          ref: refactor/keyframe-seek-cleanup-0.13.79
          fetch-depth: 0

      - name: Verify Build146 transport and seek contract
        run: |
          set -euo pipefail
          grep -Fq 'sourceVersion = "0.13.79"' Sources/Core/AppIdentity.swift
          grep -Fq 'private static let keyframeLookupBudgetMs: Double = 20' Sources/Player/MPVPlayerEngine.swift
          test "$(grep -Fc 'self.command(handle, ["seek", String(format: "%.6f", finalDispatchTarget), mode])' Sources/Player/MPVPlayerEngine.swift)" -eq 1
          ! grep -Fq 'absolute+exact' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'case keyframeMetadata' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'keyframeMetadataRefillBytes: Int64 = 512 * 1024' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'maximumKeyframeMetadataRefillQueue = 16' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'keyframeMetadataMissLogIntervalSeconds: TimeInterval = 5' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'pendingKeyframeMetadataRanges' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'enqueueKeyframeMetadataRefill' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'role: .keyframeMetadata' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'urgent-preempts-keyframe-metadata' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'priority=background-below-urgent' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'mode=cache-read-deferred-unified-refill' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'suppressedMisses=' Sources/Transport/UnifiedMediaTransportSession.swift
          ! grep -Fq 'result=hit mode=cache-only-no-network' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'OnePlayer.Log.Playback.Enabled' Sources/Diagnostics/DiagnosticsLogger.swift
          grep -Fq 'guard UserDefaults.standard.bool(forKey: channel.enabledKey)' Sources/Diagnostics/DiagnosticsLogger.swift
          grep -Fq 'phase=mpv-event-seek owner=claimed' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'reason=no-latest-seek-event-owner' Sources/Player/MPVPlayerEngine.swift
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Sources/Transport/UnifiedMediaTransportSession.swift').read_text()
          start = text.index('    func readCachedMetadata(offset: Int64, length: Int) async -> Data? {')
          end = text.index('\n    func prioritizeSeek(', start)
          body = text[start:end]
          assert 'enqueueKeyframeMetadataRefill' in body
          assert 'installUrgent(' not in body
          assert 'acceptRealDemand(' not in body
          assert 'resolve()' not in body
          assert 'readWhenAvailable' in body and 'timeout: 0' in body
          assert 'print(' not in body
          assert 'os_log' not in body
          assert 'NSLog' not in body
          assert 'DiagnosticsLogger.shared.playback("KeyframeCacheRead"' in body
          assert 'DiagnosticsLogger.shared.playback("KeyframeMetadataRefill"' in body
          assert 'result=hit' not in body
          assert 'scheduleSlots(reason: "keyframe-seek-cleanup")' in body
          seek = Path('Sources/Player/MPVPlayerEngine.swift').read_text()
          seek_start = seek.index('    func seek(to seconds: Double, direction: SeekDirection)')
          seek_end = seek.index('\n    private func claimKeyframeLookupIndex()', seek_start)
          seek_body = seek[seek_start:seek_end]
          assert seek_body.count('self.command(handle, ["seek"') == 1
          assert 'absolute+exact' not in seek_body
          assert 'print(' not in seek_body and 'os_log' not in seek_body and 'NSLog' not in seek_body
          assert text.count('role: .keyframeMetadata') >= 1
          probe = Path('Sources/Player/MPVKeyframeIndexProbe.swift').read_text()
          assert 'previousStatus' not in probe and 'nextStatus' not in probe
          assert 'case value(Double, String)' not in probe
          assert 'private var completed = false' not in probe
          assert 'func load() -> (Bool, Data?)' not in probe
          keyframe_map = Path('Sources/Player/OnePlayerSessionKeyframeMap.swift').read_text()
          assert 'func neighbors(around target: Double) -> OnePlayerKeyframeNeighbors?' in keyframe_map
          assert 'gap: OnePlayerSessionKeyframeGap' not in keyframe_map
          obsolete_paths = [
              ".github/workflows/apply-build134-ex-scrub-hud.yml",
              ".github/workflows/build-ksplayer-lab.yml",
              ".github/workflows/build-player-hud-01366.yml",
              ".github/workflows/build-mdk-file-http-trace-01334.yml",
              ".github/workflows/build-mdk-request-size-01335.yml",
              ".github/workflows/build-mdk-build103-final-01336.yml",
              ".github/workflows/build-mdk-precise-seek-truehd-01336.yml",
              ".github/workflows/build-mdk-seek-ui-haptics-01337.yml",
              ".github/workflows/build-mdk-build105-01338.yml",
              ".github/workflows/build-mdk-build106-01339.yml",
              ".github/workflows/build-mdk-build107-01340.yml",
              ".github/workflows/build-mdk-build108-01341.yml",
              ".github/workflows/build-mdk-build109-01342.yml",
              ".github/workflows/build-mdk-build110-01343.yml",
              ".github/workflows/build-mdk-build111-01344.yml",
              ".github/workflows/build-mdk-build112-01345.yml",
              ".github/workflows/build-mdk-build113-01346.yml",
              ".github/workflows/build-mdk-build114-01347.yml",
              ".github/workflows/build-mdk-build115-01348.yml",
              ".github/workflows/build-mdk-build116-01349.yml",
              ".github/workflows/build-mdk-build117-01350.yml",
              ".github/workflows/build-mdk-build118-01351.yml",
              ".github/workflows/build-seek-strict-trace-01356.yml",
              ".github/workflows/build-seek-incache-ab-01357.yml",
              ".github/workflows/build-mdk-incache-accurate-ab-01358.yml",
              ".github/workflows/build-mdk-decoder-drop-trace-01359.yml",
              ".github/workflows/build-mpv-intent-seek-01364.yml",
              ".github/workflows/build-mpv-fast-seek-01365.yml",
              ".github/workflows/build138-keyframe-index-retry.yml",
              ".github/workflows/build139-keyframe-cache-reader.yml",
              ".github/workflows/build140-keyframe-native-seek-probe.yml",
              ".github/workflows/build143-keyframe-fast-seek.yml",
              "docs/diagnostics/MDK_SEEK_INCACHE_AB.md",
              "scripts/instrument_mdk_file_http_trace.py",
              "scripts/instrument_mdk_seek_sequence_trace.py",
              "scripts/instrument_mdk_bounded_request_01335.py",
              "scripts/instrument_mdk_precise_seek_truehd_01336.py",
              "scripts/instrument_mdk_cold_resume_guard_01336.py",
              "scripts/instrument_mdk_timeout_fallback_01336.py",
              "scripts/instrument_mdk_seek_ui_haptics_01337.py",
              "scripts/instrument_mdk_seek_low_latency_haptics_01338.py",
              "scripts/instrument_mdk_cold_resume_first_frame_01339.py",
              "scripts/instrument_mdk_native_latest_wins_01340.py",
              "scripts/instrument_mdk_ignored_seek_settle_01341.py",
              "scripts/instrument_mdk_two_stage_seek_01342.py",
              "scripts/instrument_mdk_continuous_session_01343.py",
              "scripts/instrument_mdk_seek_transport_tail_01344.py",
              "scripts/instrument_mdk_avio_request_toggle_01345.py",
              "scripts/instrument_player_idle_timer_01346.py",
              "scripts/instrument_mdk_seek_fast_first_01347.py",
              "scripts/instrument_mdk_seek_fast_only_01348.py",
              "scripts/instrument_mdk_seek_frame_landing_fix_01349.py",
              "scripts/instrument_mdk_seek_watchdog_ui_01350.py",
              "scripts/instrument_mdk_seek_audio_ui_01351.py",
              "scripts/apply_build136_seek_fence_probe.py",
              "scripts/apply_build137_compile_fix.py",
              "scripts/apply_build137_seek_event_fence_index.py",
              "scripts/apply_build138_keyframe_index_retry.py",
              "scripts/apply_build139_unified_keyframe_cache_reader.py",
              "scripts/apply_build140_keyframe_native_seek_probe.py",
          ]
          assert not [path for path in obsolete_paths if Path(path).exists()]
          PY
          ! grep -Fq 'UserDefaults' Sources/Player/OnePlayerSessionKeyframeMap.swift
          ! grep -Fq 'FileManager' Sources/Player/OnePlayerSessionKeyframeMap.swift
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          git diff --check

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Create same-target FFmpeg compile contract
        run: |
          set -euo pipefail
          cat > Sources/Player/Build146BackendCompileContract.swift <<'SWIFT'
          #if !canImport(Libavformat)
          #error("Build146 OnePlayer target cannot import Libavformat")
          #endif
          #if !canImport(Libavutil)
          #error("Build146 OnePlayer target cannot import Libavutil")
          #endif
          #if !canImport(Libavcodec)
          #error("Build146 OnePlayer target cannot import Libavcodec")
          #endif
          import Libavformat
          import Libavutil
          import Libavcodec
          enum Build146BackendCompileContract { static func verify() -> UInt32 { avformat_version() ^ avutil_version() ^ avcodec_version() } }
          SWIFT

      - name: Generate project and resolve MPVKit
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Build146 Release
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.79 CURRENT_PROJECT_VERSION=146 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.79' --build '146' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Verify Build146 keyframe backend
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          BIN="$APP_PATH/$EXECUTABLE"
          grep -Fq 'Build146BackendCompileContract.swift' build.log
          grep -Fq 'MPVKeyframeIndexProbe.swift' build.log
          grep -Fq 'OnePlayerSessionKeyframeMap.swift' build.log
          grep -Fq -- '-framework Libavformat' build.log
          grep -Fq -- '-framework Libavutil' build.log
          grep -Fq -- '-framework Libavcodec' build.log
          if ! nm -gU "$BIN" > keyframe-symbols.log 2>&1; then nm "$BIN" > keyframe-symbols.log 2>&1; fi
          grep -Fq '_av_seek_frame' keyframe-symbols.log
          grep -Fq '_av_read_frame' keyframe-symbols.log
          grep -Fq '_av_packet_alloc' keyframe-symbols.log
          grep -Fq '_avformat_open_input' keyframe-symbols.log
          echo 'backend=libavformat-direct strategy=production-ephemeral-verified-gap-index lookup-budget-ms=20 sidecar-current-read=cache-only-no-wait metadata-miss-refill=unified-transport-low-priority refill-bytes=524288 refill-concurrency=1 urgent-preemption=yes logging=playback-switch-gated miss-log=deduplicated real-seek=single-absolute-keyframes persistence=none fence=mpv-event-seek' | tee keyframe-fast-seek-report.log
          rm -f Sources/Player/Build146BackendCompileContract.swift

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.79-build146-keyframe-seek-cleanup-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build146 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.79-build146-keyframe-seek-cleanup
          path: |
            OnePlayer-0.13.79-build146-keyframe-seek-cleanup-unsigned.ipa
            OnePlayer-0.13.79-build146-keyframe-seek-cleanup-unsigned.ipa.sha256
            keyframe-fast-seek-report.log
            keyframe-symbols.log
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build146 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.79-build146-keyframe-seek-cleanup-diagnostics
          path: |
            keyframe-fast-seek-report.log
            keyframe-symbols.log
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: warn
          retention-days: 14
