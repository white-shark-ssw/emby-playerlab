name: Build OnePlayer 0.13.78 Build145 Keyframe Metadata Refill

on:
  workflow_dispatch:
  push:
    branches: [fix/keyframe-metadata-refill-0.13.78]
    paths:
      - "Sources/**"
      - "project.mdklab.yml"
      - "Podfile"
      - ".github/workflows/build144-keyframe-timeout-tail.yml"
  pull_request:
    branches: [fix/keyframe-timeout-tail-0.13.77]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build145-keyframe-metadata-refill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/fix/keyframe-metadata-refill-0.13.78' || github.head_ref == 'fix/keyframe-metadata-refill-0.13.78'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout Build145 source
        uses: actions/checkout@v4
        with:
          ref: fix/keyframe-metadata-refill-0.13.78
          fetch-depth: 0

      - name: Verify Build145 transport and seek contract
        run: |
          set -euo pipefail
          grep -Fq 'sourceVersion = "0.13.78"' Sources/Core/AppIdentity.swift
          grep -Fq 'private static let keyframeLookupBudgetMs: Double = 20' Sources/Player/MPVPlayerEngine.swift
          test "$(grep -Fc 'self.command(handle, ["seek", String(format: "%.6f", finalDispatchTarget), mode])' Sources/Player/MPVPlayerEngine.swift)" -eq 1
          ! grep -Fq 'absolute+exact' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'case keyframeMetadata' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'keyframeMetadataRefillBytes: Int64 = 512 * 1024' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'maximumKeyframeMetadataRefillQueue = 16' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'keyframeMetadataMissLogIntervalSeconds: TimeInterval = 5' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'pendingKeyframeMetadataRanges' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'enqueueKeyframeMetadataRefill' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'role: .keyframeMetadata' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'urgent-preempts-keyframe-metadata' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'priority=background-below-urgent' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'mode=cache-read-deferred-unified-refill' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'suppressedMisses=' Sources/Transport/UnifiedMediaTransportSession.swift
          ! grep -Fq 'result=hit mode=cache-only-no-network' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'OnePlayer.Log.Playback.Enabled' Sources/Diagnostics/DiagnosticsLogger.swift
          grep -Fq 'guard UserDefaults.standard.bool(forKey: channel.enabledKey)' Sources/Diagnostics/DiagnosticsLogger.swift
          grep -Fq 'phase=mpv-event-seek owner=claimed' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'reason=no-latest-seek-event-owner' Sources/Player/MPVPlayerEngine.swift
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Sources/Transport/UnifiedMediaTransportSession.swift').read_text()
          start = text.index('    func readCachedMetadata(offset: Int64, length: Int) async -> Data? {')
          end = text.index('\n    func prioritizeSeek(', start)
          body = text[start:end]
          assert 'enqueueKeyframeMetadataRefill' in body
          assert 'installUrgent(' not in body
          assert 'acceptRealDemand(' not in body
          assert 'resolve()' not in body
          assert 'readWhenAvailable' in body and 'timeout: 0' in body
          assert 'print(' not in body
          assert 'os_log' not in body
          assert 'NSLog' not in body
          assert 'DiagnosticsLogger.shared.playback("KeyframeCacheRead"' in body
          assert 'DiagnosticsLogger.shared.playback("KeyframeMetadataRefill"' in body
          assert 'result=hit' not in body
          assert 'scheduleSlots(reason: "keyframe-metadata-refill")' in body
          seek = Path('Sources/Player/MPVPlayerEngine.swift').read_text()
          seek_start = seek.index('    func seek(to seconds: Double, direction: SeekDirection)')
          seek_end = seek.index('\n    private func claimKeyframeLookupIndex()', seek_start)
          seek_body = seek[seek_start:seek_end]
          assert seek_body.count('self.command(handle, ["seek"') == 1
          assert 'absolute+exact' not in seek_body
          assert 'print(' not in seek_body and 'os_log' not in seek_body and 'NSLog' not in seek_body
          assert text.count('role: .keyframeMetadata') >= 1
          PY
          ! grep -Fq 'UserDefaults' Sources/Player/OnePlayerSessionKeyframeMap.swift
          ! grep -Fq 'FileManager' Sources/Player/OnePlayerSessionKeyframeMap.swift
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          git diff --check

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Create same-target FFmpeg compile contract
        run: |
          set -euo pipefail
          cat > Sources/Player/Build145BackendCompileContract.swift <<'SWIFT'
          #if !canImport(Libavformat)
          #error("Build145 OnePlayer target cannot import Libavformat")
          #endif
          #if !canImport(Libavutil)
          #error("Build145 OnePlayer target cannot import Libavutil")
          #endif
          #if !canImport(Libavcodec)
          #error("Build145 OnePlayer target cannot import Libavcodec")
          #endif
          import Libavformat
          import Libavutil
          import Libavcodec
          enum Build145BackendCompileContract { static func verify() -> UInt32 { avformat_version() ^ avutil_version() ^ avcodec_version() } }
          SWIFT

      - name: Generate project and resolve MPVKit
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Build145 Release
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.78 CURRENT_PROJECT_VERSION=145 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.78' --build '145' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Verify Build145 keyframe backend
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          BIN="$APP_PATH/$EXECUTABLE"
          grep -Fq 'Build145BackendCompileContract.swift' build.log
          grep -Fq 'MPVKeyframeIndexProbe.swift' build.log
          grep -Fq 'OnePlayerSessionKeyframeMap.swift' build.log
          grep -Fq -- '-framework Libavformat' build.log
          grep -Fq -- '-framework Libavutil' build.log
          grep -Fq -- '-framework Libavcodec' build.log
          if ! nm -gU "$BIN" > keyframe-symbols.log 2>&1; then nm "$BIN" > keyframe-symbols.log 2>&1; fi
          grep -Fq '_av_seek_frame' keyframe-symbols.log
          grep -Fq '_av_read_frame' keyframe-symbols.log
          grep -Fq '_av_packet_alloc' keyframe-symbols.log
          grep -Fq '_avformat_open_input' keyframe-symbols.log
          echo 'backend=libavformat-direct strategy=production-ephemeral-verified-gap-index lookup-budget-ms=20 sidecar-current-read=cache-only-no-wait metadata-miss-refill=unified-transport-low-priority refill-bytes=524288 refill-concurrency=1 urgent-preemption=yes logging=playback-switch-gated miss-log=deduplicated real-seek=single-absolute-keyframes persistence=none fence=mpv-event-seek' | tee keyframe-fast-seek-report.log
          rm -f Sources/Player/Build145BackendCompileContract.swift

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.78-build145-keyframe-metadata-refill-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build145 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.78-build145-keyframe-metadata-refill
          path: |
            OnePlayer-0.13.78-build145-keyframe-metadata-refill-unsigned.ipa
            OnePlayer-0.13.78-build145-keyframe-metadata-refill-unsigned.ipa.sha256
            keyframe-fast-seek-report.log
            keyframe-symbols.log
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build145 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.78-build145-keyframe-metadata-refill-diagnostics
          path: |
            keyframe-fast-seek-report.log
            keyframe-symbols.log
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: warn
          retention-days: 14
