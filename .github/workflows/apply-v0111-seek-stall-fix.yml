name: Apply v0.11.1 Seek Stall Fix

on:
  push:
    branches: [chatgpt/v0.11.1-seek-stall-fix]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.11.1-seek-stall-fix
      - name: Apply concrete read refinement
        run: |
          set -euo pipefail
          python3 scripts/refine_v0111_concrete_read.py
          if git diff --quiet; then
            echo "already applied"
            exit 0
          fi
          git config user.name "ChatGPT CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources/Transport/UnifiedMediaTransportSession.swift
          git commit -m "Treat actual demux reads as critical playback demand"
          git push origin HEAD:chatgpt/v0.11.1-seek-stall-fix
