name: Apply v0.11.1 Seek Stall Fix

on:
  push:
    branches: [chatgpt/v0.11.1-seek-stall-fix]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.11.1-seek-stall-fix
      - name: Finalize v0.11.1
        run: |
          set -euo pipefail
          python3 scripts/finalize_v0111.py
          if git diff --quiet; then
            echo "already finalized"
            exit 0
          fi
          git config user.name "ChatGPT CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources/Core/AppIdentity.swift Config/Info.plist project.yml .github/workflows/validate-source.yml .github/workflows/build-unsigned-ipa.yml scripts/check_transport_v3_invariants.py
          git commit -m "Finalize v0.11.1 seek stall regression checks"
          git push origin HEAD:chatgpt/v0.11.1-seek-stall-fix
