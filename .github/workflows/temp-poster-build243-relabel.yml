name: Temp Poster Build243 Relabel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-poster-build243-relabel.yml

permissions:
  contents: write

jobs:
  relabel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Reserve Build243 in current poster checkpoint
        run: |
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/project/current/dev/DEV-poster-grid-smoothness.md')
          text = path.read_text(encoding='utf-8')
          old_status = '**Active — Build229 / 0.14.62 is now target-device tested and overall Library 3×3 hitching still exists. The latest captured 77.2 ms moving hitch occurred about 7.3 s after page apply/snapshot completion and about 0.77 s after the latest image publish, so Build228’s synchronous snapshot write is not the direct trigger for this sample and moving Library persistence off MainActor is not sufficient to solve the whole hitch family. Poster branch head `deba1534e55bfc73f4d3cf43f2682c854a04cb39` materialized a diagnostic-only 0.14.66 / Build233 commit, but Build233 is already owned by the independent Home carousel task; resume identity guard therefore fails and poster development is paused until this candidate identity is explicitly released/reallocated. Not stable.**'
          new_status = '**Active — Build229 / 0.14.62 is target-device tested and overall Library 3×3 hitching still exists. The 77.2 ms non-pagination sample is far outside page-apply/snapshot/image-publish windows, so off-main Library persistence is not sufficient for the whole hitch family. The user has explicitly continued this task after the Build233 collision; current repository checks show Home has advanced through Build242, Aether owns Build235, and Build243 is unallocated. Poster therefore retires its invalid 0.14.66 / Build233 identity and reserves OnePlayer 0.14.76 / Build243 for the already-written measurement-only background-image-work diagnostics. No smoothness fix is claimed; not stable.**'
          if old_status not in text:
              raise SystemExit('current poster checkpoint status guard failed')
          text = text.replace(old_status, new_status, 1)

          marker = '- **Draft PR**: #259\n'
          identity = '- **Retired conflicting poster identity**: OnePlayer `0.14.66 (233)` at `deba1534e55bfc73f4d3cf43f2682c854a04cb39`; no valid poster CI/IPA attribution\n- **Reserved poster diagnostic candidate**: OnePlayer `0.14.76 (243)`; uniqueness rechecked against Active checkpoints, branches and commit search on 2026-08-29\n'
          if identity not in text:
              if marker not in text:
                  raise SystemExit('poster checkpoint metadata marker missing')
              text = text.replace(marker, marker + identity, 1)

          old_collision = '- Home also allocated Build234 and Aether currently reserves Build235, so poster must not silently rename itself to another number without a fresh collision check.\n\n**Identity guard result: FAILED.** Do not run/distribute poster Build233, do not call it a poster candidate, and do not modify product source until the user explicitly resolves the candidate collision.\n\n**Evidence:** Build229 Code written ✅ / CI passed ✅ / IPA produced+verified ✅ / target-device tested ✅ / overall hitch still present ❌ / pagination-specific improvement unproven / stable ❌. Poster `deba1534...` code exists, but candidate identity is invalid and no poster CI/IPA should be claimed.\n\n**Pending:** explicit user decision to release the invalid poster Build233 identity and allocate a new unique poster candidate after rechecking all Active checkpoints / `BUILD_TEST_INDEX.md`.\n\n**Next exact action:** after explicit resolution, restore a unique poster candidate identity from the current branch evidence, rerun exact-scope/source guards, then build the existing background-work diagnostic instrumentation to a verified IPA. Until then, no product-source edits.\n'
          new_collision = '- Home subsequently advanced through Build242; Aether currently reserves Build235. Fresh checks on 2026-08-29 find no Build243 branch, commit or current checkpoint allocation.\n- The user explicitly said to continue the current poster task after the timeout, satisfying the checkpoint’s required decision to release/reallocate the invalid poster Build233 identity.\n\n**Identity guard result after explicit continuation: PASSED for relabel only.** Poster Build233 is retired for attribution; Build243 / 0.14.76 is reserved for the exact already-written diagnostic logic. This does not authorize any additional optimization or behavior change.\n\n**Evidence:** Build229 Code written ✅ / CI passed ✅ / IPA produced+verified ✅ / target-device tested ✅ / overall hitch still present ❌ / pagination-specific improvement unproven / stable ❌. Poster background-work diagnostic code exists at `deba1534...`; it still requires valid Build243 relabel, source guards, CI and IPA before distribution.\n\n**Pending:** relabel only AppIdentity/changelog from invalid poster 233 to reserved poster 243, keep diagnostic runtime logic unchanged, then run exact Build229→Build243 scope/checker and dedicated Release/IPA validation.\n\n**Next exact action:** materialize OnePlayer 0.14.76 / Build243 from `deba1534...` by identity/changelog relabel only; run exact-scope/source guards and a dedicated Xcode 16.4 Release/IPA workflow; verify package identity/MinOS/hashes, then hand the IPA to the user for Library 3×3 diagnostic testing.\n'
          if old_collision not in text:
              raise SystemExit('current poster collision block guard failed')
          text = text.replace(old_collision, new_collision, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git add docs/project/current/dev/DEV-poster-grid-smoothness.md
          git commit -m "Reserve poster Build243 after explicit continuation"
          git push origin HEAD:main
      - name: Relabel poster diagnostics to Build243
        run: |
          git fetch origin perf/poster-grid-smoothness
          git checkout -B perf/poster-grid-smoothness origin/perf/poster-grid-smoothness
          test "$(git rev-parse HEAD)" = "deba1534e55bfc73f4d3cf43f2682c854a04cb39"
          test "$(git rev-parse HEAD^)" = "f5e3e3eb144578c863b172e3bd3a1aa13e5c2177"
          python3 - <<'PY'
          from pathlib import Path

          identity = Path('Sources/Core/AppIdentity.swift')
          text = identity.read_text(encoding='utf-8')
          if text.count('0.14.66') != 2:
              raise SystemExit('unexpected Build233 AppIdentity shape')
          identity.write_text(text.replace('0.14.66', '0.14.76'), encoding='utf-8')

          old = Path('docs/changelog/CHANGELOG_v0_14_66_build233.md')
          new = Path('docs/changelog/CHANGELOG_v0_14_76_build243.md')
          if not old.exists() or new.exists():
              raise SystemExit('unexpected changelog relabel state')
          new.write_text(old.read_text(encoding='utf-8').replace('# OnePlayer 0.14.66 / Build233', '# OnePlayer 0.14.76 / Build243'), encoding='utf-8')
          old.unlink()
          PY
          python3 scripts/check_poster_grid_smoothness.py
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'Sources/Core/AppIdentity.swift',
              'Sources/UI/EmbySharedImageAndNavigation.swift',
              'docs/changelog/CHANGELOG_v0_14_76_build243.md',
              'scripts/check_poster_grid_smoothness.py',
          }
          final = set(subprocess.check_output(['git', 'diff', '--name-only', 'f5e3e3eb144578c863b172e3bd3a1aa13e5c2177'], text=True).splitlines())
          status = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          final.update(line[3:] for line in status if line.startswith('?? '))
          final.discard('docs/changelog/CHANGELOG_v0_14_66_build233.md')
          if final != expected:
              raise SystemExit(f'unexpected Build243 scope before commit: {sorted(final)}')
          PY
          git add Sources/Core/AppIdentity.swift docs/changelog/CHANGELOG_v0_14_66_build233.md docs/changelog/CHANGELOG_v0_14_76_build243.md
          git commit -m "Relabel poster diagnostics as Build243"
          python3 scripts/check_poster_grid_smoothness.py
          test "$(git show HEAD:Sources/Core/AppIdentity.swift | grep -c '0.14.76')" -eq 2
          test "$(git ls-tree -r --name-only HEAD | grep -c '^docs/changelog/CHANGELOG_v0_14_76_build243.md$')" -eq 1
          test "$(git ls-tree -r --name-only HEAD | grep -c '^docs/changelog/CHANGELOG_v0_14_66_build233.md$')" -eq 0
          python3 - <<'PY'
          import subprocess
          expected = {
              'Sources/Core/AppIdentity.swift',
              'Sources/UI/EmbySharedImageAndNavigation.swift',
              'docs/changelog/CHANGELOG_v0_14_76_build243.md',
              'scripts/check_poster_grid_smoothness.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'f5e3e3eb144578c863b172e3bd3a1aa13e5c2177...HEAD'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected committed Build243 scope: {sorted(changed)}')
          PY
          git push origin HEAD:perf/poster-grid-smoothness
          echo "BUILD243_SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Summary
        run: echo "Poster Build243 exact source $BUILD243_SOURCE"
