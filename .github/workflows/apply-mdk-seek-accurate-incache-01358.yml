name: Apply MDK Seek Accurate InCache 0.13.58

on:
  push:
    branches: [diag/mdk-seek-incache-accurate-0.13.58]
    paths:
      - "scripts/migrate_mdk_seek_accurate_incache_01358.py"
      - ".github/workflows/apply-mdk-seek-accurate-incache-01358.yml"
      - "MDKLab/SwiftMDKOnePlayer/Sources/swift-mdk/global.swift"
      - "Sources/Core/AppIdentity.swift"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/mdk-seek-incache-accurate-0.13.58
          fetch-depth: 0
      - name: Apply isolated relative Accurate InCache flag
        run: |
          set -euo pipefail
          python3 scripts/migrate_mdk_seek_accurate_incache_01358.py
          grep -Fq 'case AccurateFromStartInCache = 1026' MDKLab/SwiftMDKOnePlayer/Sources/swift-mdk/global.swift
          grep -Fq 'case FastFromStartInCache = 1282' MDKLab/SwiftMDKOnePlayer/Sources/swift-mdk/global.swift
          grep -Fq 'dispatchedIntent.fastPreview ? .AccurateFromStartInCache : .FromStart' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'nativeMode=\(dispatchedIntent.fastPreview ? "accurate-incache" : "accurate")' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'flagRaw=\(seekFlag.rawValue) cacheAware=\(dispatchedIntent.fastPreview)' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'private let relativeSeekBufferMinMs: Int64 = 50' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'private let seekBufferMinMs: Int64 = 200' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'private let normalBufferMinMs: Int64 = 1_000' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'private let avioRequestSizeBytes = 2 * 1_048_576' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'action=queue-latest-single-native' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'sourceVersion = "0.13.58"' Sources/Core/AppIdentity.swift
          git diff --check
      - name: Commit Build125 source
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source change required'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MDKLab/App/MDKKSAVIOPlayerEngine.swift
          git commit -m 'mdk: test relative Accurate Seek with InCache'
          git push origin HEAD:diag/mdk-seek-incache-accurate-0.13.58
