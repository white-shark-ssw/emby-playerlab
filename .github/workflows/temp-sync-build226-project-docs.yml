name: TEMP Sync Build226 Project Docs

on:
  push:
    branches: [perf/home-carousel-hero-residency-build226]
    paths:
      - ".github/build226-docs-sync-trigger.txt"

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build226 branch
        uses: actions/checkout@v4
        with:
          ref: perf/home-carousel-hero-residency-build226
          fetch-depth: 0
          persist-credentials: true

      - name: Update feature checkpoint
        run: |
          set -euo pipefail
          git fetch origin main
          python3 scripts/temp_sync_build226_docs.py branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          git diff --cached --check
          git commit -m "Docs: record Build225 device result and Build226 evidence [skip ci]"
          git push origin HEAD:perf/home-carousel-hero-residency-build226

      - name: Sync authoritative docs to main
        run: |
          set -euo pipefail
          git fetch origin main perf/home-carousel-hero-residency-build226
          git checkout -B main origin/main
          git show origin/perf/home-carousel-hero-residency-build226:scripts/temp_sync_build226_docs.py > /tmp/temp_sync_build226_docs.py
          python3 /tmp/temp_sync_build226_docs.py main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md
          git diff --cached --check
          git commit -m "Docs: sync Build225 result and Build226 baseline [skip ci]"
          git push origin main
