name: Build OnePlayer 0.13.74 Build141 Nearest Keyframe A-B

on:
  workflow_dispatch:
  push:
    branches: [diag/nearest-keyframe-ab-0.13.74]
    paths:
      - "Sources/**"
      - "scripts/apply_build141_nearest_keyframe_ab.py"
      - "project.mdklab.yml"
      - "Podfile"
      - ".github/workflows/build141-nearest-keyframe-ab.yml"
  pull_request:
    branches: [diag/keyframe-native-seek-probe-0.13.73]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: build141-nearest-keyframe-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/diag/nearest-keyframe-ab-0.13.74' || github.head_ref == 'diag/nearest-keyframe-ab-0.13.74'
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout Build141 experiment
        uses: actions/checkout@v4
        with:
          ref: diag/nearest-keyframe-ab-0.13.74
          fetch-depth: 0

      - name: Apply nearest-keyframe A-B wiring
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_build141_nearest_keyframe_ab.py')
          s = p.read_text()
          s = s.replace('if text.count(reload_anchor) != 1:', 'if reload_anchor not in text:')
          s = s.replace('if count != 1:', 'if count < 1:')
          p.write_text(s)
          PY
          python3 scripts/apply_build141_nearest_keyframe_ab.py
          git diff --check
          git status --short

      - name: Persist Build141 real source
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add Sources/Player/MPVPlayerEngine.swift
          if ! git diff --cached --quiet; then
            git commit -m 'Build141: run bounded nearest-keyframe A-B before fast seek'
            git push origin HEAD:diag/nearest-keyframe-ab-0.13.74
          fi

      - name: Verify Build141 source contract
        run: |
          set -euo pipefail
          grep -Fq 'sourceVersion = "0.13.74"' Sources/Core/AppIdentity.swift
          grep -Fq 'private static let nearestKeyframePreflightBudgetMs: Double = 20' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'seekID.isMultiple(of: 2) ? "nearest" : "control"' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'MPVNearestSeek' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'fallback-time-budget' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'nearest-next' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'nearest-previous-no-change' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'reason=stale-generation' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'String(format: "%.6f", dispatchTarget)' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'ONEPLAYER_KEYFRAME_NATIVE_SEEK_READONLY' Sources/Player/MPVKeyframeIndexProbe.swift
          grep -Fq 'av_seek_frame' Sources/Player/MPVKeyframeIndexProbe.swift
          grep -Fq 'av_read_frame' Sources/Player/MPVKeyframeIndexProbe.swift
          grep -Fq 'func readCachedMetadata(offset: Int64, length: Int) async -> Data?' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'mode=cache-only-no-network' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'phase=mpv-event-seek owner=claimed' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'reason=no-latest-seek-event-owner' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'intent = "doubleTapFastSeek"' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'intent = "scrubReleaseFastSeek"' Sources/Player/MPVPlayerEngine.swift
          test "$(grep -Fc 'mode = "absolute+keyframes"' Sources/Player/MPVPlayerEngine.swift)" -ge 2
          ! grep -Fq 'absolute+exact' Sources/Player/MPVPlayerEngine.swift
          ! grep -Fq 'avformat_index_get_entries_count' Sources/Player/MPVKeyframeIndexProbe.swift
          ! grep -Fq 'avformat_index_get_entry' Sources/Player/MPVKeyframeIndexProbe.swift
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          git diff --check

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Create same-target FFmpeg compile contract
        run: |
          set -euo pipefail
          cat > Sources/Player/Build141BackendCompileContract.swift <<'SWIFT'
          #if !canImport(Libavformat)
          #error("Build141 OnePlayer target cannot import Libavformat")
          #endif
          #if !canImport(Libavutil)
          #error("Build141 OnePlayer target cannot import Libavutil")
          #endif
          #if !canImport(Libavcodec)
          #error("Build141 OnePlayer target cannot import Libavcodec")
          #endif
          import Libavformat
          import Libavutil
          import Libavcodec
          enum Build141BackendCompileContract { static func verify() -> UInt32 { avformat_version() ^ avutil_version() ^ avcodec_version() } }
          SWIFT

      - name: Generate project and resolve MPVKit
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Build141 Release
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.74 CURRENT_PROJECT_VERSION=141 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.74' --build '141' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Verify nearest-keyframe backend
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          BIN="$APP_PATH/$EXECUTABLE"
          grep -Fq 'Build141BackendCompileContract.swift' build.log
          grep -Fq 'MPVKeyframeIndexProbe.swift' build.log
          grep -Fq -- '-framework Libavformat' build.log
          grep -Fq -- '-framework Libavutil' build.log
          grep -Fq -- '-framework Libavcodec' build.log
          if ! nm -gU "$BIN" > keyframe-symbols.log 2>&1; then nm "$BIN" > keyframe-symbols.log 2>&1; fi
          grep -Fq '_av_seek_frame' keyframe-symbols.log
          grep -Fq '_av_read_frame' keyframe-symbols.log
          grep -Fq '_av_packet_alloc' keyframe-symbols.log
          grep -Fq '_avformat_open_input' keyframe-symbols.log
          echo 'backend=libavformat-direct experiment=nearest-keyframe-ab preflight-budget-ms=20 real-seek=single-absolute-keyframes cache=read-only-no-network' | tee keyframe-index-report.log
          rm -f Sources/Player/Build141BackendCompileContract.swift

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.74-build141-nearest-keyframe-ab-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build141 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.74-build141-nearest-keyframe-ab
          path: |
            OnePlayer-0.13.74-build141-nearest-keyframe-ab-unsigned.ipa
            OnePlayer-0.13.74-build141-nearest-keyframe-ab-unsigned.ipa.sha256
            keyframe-index-report.log
            keyframe-symbols.log
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build141 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.74-build141-nearest-keyframe-ab-diagnostics
          path: |
            keyframe-index-report.log
            keyframe-symbols.log
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: warn
          retention-days: 14
