name: One-shot snapshot unwrap v4

on:
  push:
    branches:
      - "fix/detail-hero-pop-0134"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[snapshot-view-unwrapped]'; then exit 0; fi
          python3 -c "from pathlib import Path; p=Path('Sources/UI/ImmersiveUIComponents.swift'); s=p.read_text(); old='        let sourceView = source.view\\n        sourceView.setNeedsLayout()\\n        sourceView.layoutIfNeeded()\\n'; new='        source.loadViewIfNeeded()\\n        guard let sourceView = source.viewIfLoaded else {\\n            DiagnosticsLogger.shared.log(\"NavigationVisual\", \"event=source-snapshot-skip reason=view-not-loaded stack=\\\\(navigationController.viewControllers.count)\")\\n            return\\n        }\\n        sourceView.setNeedsLayout()\\n        sourceView.layoutIfNeeded()\\n'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))"
          python3 scripts/check_v0134_detail_navigation.py
          git diff --check
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add Sources/UI/ImmersiveUIComponents.swift
          git commit -m 'fix: safely unwrap source view for pop snapshot [snapshot-view-unwrapped]'
          git push origin HEAD:fix/detail-hero-pop-0134
