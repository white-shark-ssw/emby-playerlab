name: Temp Apply Library Hub Tabs V1

on:
  push:
    branches:
      - feat/library-hub-tabs-v1
    paths:
      - .github/workflows/temp-apply-library-tabs-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/library-hub-tabs-v1
          fetch-depth: 0
      - name: Apply exact source patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .tmp/library-tabs.patch.gz.b64 | gzip -d > /tmp/library-tabs.patch
          patch -p1 < /tmp/library-tabs.patch
          rm -f .tmp/library-tabs.patch.gz.b64 .github/workflows/temp-apply-library-tabs-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add library hub tab UI"
          git push origin HEAD:feat/library-hub-tabs-v1
