name: One-shot detail hero pop source patch

on:
  push:
    branches:
      - "fix/detail-hero-pop-0134"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and push source-only patch
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[detail-hero-pop-patched]'; then
            echo 'Source patch already applied; no-op.'
            exit 0
          fi
          python3 .github/apply_detail_hero_pop_0134.py
          git checkout -- .github
          python3 scripts/check_v0134_detail_navigation.py
          git diff --check
          git diff --stat
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add Sources/UI/EmbyMediaDetailView.swift Sources/UI/ImmersiveUIComponents.swift scripts/check_v0134_detail_navigation.py
          git commit -m 'fix: unify detail hero and preserve native pop visuals [detail-hero-pop-patched]'
          git push origin HEAD:fix/detail-hero-pop-0134
