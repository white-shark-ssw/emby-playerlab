name: Build OnePlayer 0.13.32 Local Playback

on:
  push:
    branches: [feat/local-file-playback-0.13.32]
  pull_request:
    branches: [feat/recovery-isolation-0.13.17]
  workflow_dispatch:

concurrency:
  group: local-playback-01332-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify working MPV-switch baseline is untouched
        run: |
          set -euo pipefail
          git cat-file -e f7251574141afe47e64258f9823c9b8eaf7707a3^{commit}
          git diff --exit-code f7251574141afe47e64258f9823c9b8eaf7707a3 -- Sources/Player/PlayerController.swift Sources/Player/PlaybackOrchestrator.swift Sources/Player/MPVPlayerEngine.swift Sources/Transport
          grep -Fq 'action=switch-mpv' Sources/Player/PlaybackOrchestrator.swift
          grep -Fq 'MDK native isolation' Sources/Player/PlaybackOrchestrator.swift
          echo 'MPV-switch baseline preserved.'

      - name: Validate local playback source contract
        run: |
          set -euo pipefail
          grep -Fq 'NavigationLink(destination: LocalPlaybackView())' Sources/UI/AppShellView.swift
          grep -Fq 'UIDocumentPickerViewController(forOpeningContentTypes:' Sources/UI/LocalPlaybackView.swift
          grep -Fq 'case mdk' Sources/UI/LocalPlaybackView.swift
          grep -Fq 'case mpv' Sources/UI/LocalPlaybackView.swift
          grep -Fq 'MPVPlayerEngine(sharedTransportSession: nil)' Sources/UI/LocalPlaybackView.swift
          grep -Fq 'KSAVIOPlayerEngine(source: source' Sources/UI/LocalPlaybackView.swift
          grep -Fq 'unifiedTransport=false' Sources/UI/LocalPlaybackView.swift
          grep -Fq 'MARKETING_VERSION: "0.13.32"' project.mdklab.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "99"' project.mdklab.yml
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          grep -Fq 'sourceVersion = "0.13.32"' Sources/Core/AppIdentity.swift

      - name: Select Xcode and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodebuild -version
          swift --version

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build Release for generic iOS device
        id: release_build
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Report compiler failure
        if: steps.release_build.outcome == 'failure'
        run: |
          set -euo pipefail
          grep -nE '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|SwiftCompile|CompileSwift|EmitSwiftModule' build.log | tail -300 || true
          tail -180 build.log || true
          exit 1

      - name: Validate app identity and minimum OS
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.32' --build '99' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.32-build99-local-playback-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload local playback test package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.32-build99-local-playback
          path: |
            OnePlayer-0.13.32-build99-local-playback-unsigned.ipa
            OnePlayer-0.13.32-build99-local-playback-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
            build.log
          if-no-files-found: error
          retention-days: 14
