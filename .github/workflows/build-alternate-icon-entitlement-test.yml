name: Build Alternate Icon Legacy Test

on:
  workflow_dispatch:
  push:
    branches: [fix/trollstore-alternate-icon-ls]

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate legacy alternate icon files
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py

      - name: Download known-good baseline IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir baseline
          gh run download 31892835274 \
            -n OnePlayer-unsigned-1860955710486ed96bd59eabf707401dba0500e4 \
            --dir baseline
          BASELINE_IPA="$(find baseline -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$BASELINE_IPA"
          echo "BASELINE_IPA=$BASELINE_IPA" >> "$GITHUB_ENV"
          shasum -a 256 "$BASELINE_IPA"

      - name: Inject TrollStore-compatible legacy alternate icon metadata
        run: |
          set -euo pipefail
          rm -rf work
          mkdir work
          cd work
          unzip -q "../$BASELINE_IPA"
          APP_PATH="$(find Payload -maxdepth 1 -name '*.app' -print -quit)"
          test -d "$APP_PATH"

          cp ../Resources/Assets.xcassets/OnePlayerAltIcon.appiconset/OnePlayerAlt-60@2x.png "$APP_PATH/OnePlayerAltLegacy60x60@2x.png"
          cp ../Resources/Assets.xcassets/OnePlayerAltIcon.appiconset/OnePlayerAlt-60@3x.png "$APP_PATH/OnePlayerAltLegacy60x60@3x.png"
          cp ../Resources/Assets.xcassets/OnePlayerAltIcon.appiconset/OnePlayerAlt-76@1x.png "$APP_PATH/OnePlayerAltLegacy76x76.png"
          cp ../Resources/Assets.xcassets/OnePlayerAltIcon.appiconset/OnePlayerAlt-76@2x.png "$APP_PATH/OnePlayerAltLegacy76x76@2x.png"

          python3 - "$APP_PATH/Info.plist" <<'PY'
          import plistlib, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          with path.open('rb') as f:
              info = plistlib.load(f)
          alternate = {
              'CFBundleIconFiles': ['OnePlayerAltLegacy60x60', 'OnePlayerAltLegacy76x76'],
              'CFBundleIconName': 'OnePlayerAltIcon',
              'UIPrerenderedIcon': False,
          }
          info.setdefault('CFBundleIcons', {}).setdefault('CFBundleAlternateIcons', {})['OnePlayerAltIcon'] = dict(alternate)
          info.setdefault('CFBundleIcons~ipad', {}).setdefault('CFBundleAlternateIcons', {})['OnePlayerAltIcon'] = dict(alternate)
          with path.open('wb') as f:
              plistlib.dump(info, f, fmt=plistlib.FMT_BINARY)
          PY

          /usr/bin/plutil -p "$APP_PATH/Info.plist" | sed -n '/CFBundleIcons/,+45p'
          test -f "$APP_PATH/OnePlayerAltLegacy60x60@3x.png"
          test -f "$APP_PATH/OnePlayerAltLegacy76x76@2x.png"
          cd ..

      - name: Package test IPA
        run: |
          set -euo pipefail
          cd work
          IPA_NAME="OnePlayer-0.13.3-icon-trollstore-test-${GITHUB_SHA::7}.ipa"
          /usr/bin/zip -qry "../$IPA_NAME" Payload
          cd ..
          /usr/bin/unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload test IPA
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-icon-trollstore-test-${{ github.sha }}
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
