name: Apply Build189 detail selection fixes

on:
  push:
    branches: [feat/detail-episode-selection-navigation]
    paths:
      - ".github/workflows/temp-apply-build189-detail-selection-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/detail-episode-selection-navigation
          fetch-depth: 0
      - name: Apply exact Build189 source fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          detail_path = Path('Sources/UI/EmbyMediaDetailView.swift')
          text = detail_path.read_text()

          old = '''    func selectEpisodeRange(_ offset: Int) { selectedEpisodeRangeOffset = max(0, offset); selectedEpisodeID = nil; episodeScrollTargetID = nil }
'''
          new = '''    func selectEpisodeRange(_ offset: Int) {
        let normalized = max(0, offset)
        selectedEpisodeRangeOffset = normalized
        selectedEpisodeID = episode(at: normalized)?.id
        episodeScrollTargetID = nil
    }
'''
          if text.count(old) != 1:
              raise SystemExit(f'selectEpisodeRange source match count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''    private func applyInitialEpisodeSelection() {
        guard isSeries, !episodes.isEmpty else { return }
        if let initialEpisodeID, let requestedEpisode = episodes.first(where: { $0.id == initialEpisodeID }), let season = seasonNumber(for: requestedEpisode) {
            selectedSeason = season
            selectedEpisodeID = requestedEpisode.id
            if let offset = selectedSeasonEpisodes.firstIndex(where: { $0.id == requestedEpisode.id }) { selectedEpisodeRangeOffset = (offset / 10) * 10 }
            episodeScrollTargetID = requestedEpisode.id
        } else if let playable = primaryPlayableItem, let season = seasonNumber(for: playable) {
            selectedEpisodeID = nil
            selectedSeason = season
            if let offset = selectedSeasonEpisodes.firstIndex(where: { $0.id == playable.id }) { selectedEpisodeRangeOffset = (offset / 10) * 10 }
        } else {
            selectedEpisodeID = nil
            selectedSeason = seasonNumbers.first
            selectedEpisodeRangeOffset = 0
        }
    }
'''
          new = '''    private func applyInitialEpisodeSelection() {
        guard isSeries, !episodes.isEmpty else { return }
        let resumeEpisode = episodes.first(where: { $0.playbackProgress > 0.001 && !$0.isPlayed })
        let requestedEpisode = initialEpisodeID.flatMap { requestedID in episodes.first(where: { $0.id == requestedID }) }
        guard let target = requestedEpisode ?? resumeEpisode ?? episodes.first else { return }
        selectedSeason = seasonNumber(for: target)
        selectedEpisodeID = target.id
        if let offset = selectedSeasonEpisodes.firstIndex(where: { $0.id == target.id }) { selectedEpisodeRangeOffset = (offset / 10) * 10 }
        else { selectedEpisodeRangeOffset = 0 }
        episodeScrollTargetID = target.id
    }
'''
          if text.count(old) != 1:
              raise SystemExit(f'applyInitialEpisodeSelection source match count={text.count(old)}')
          text = text.replace(old, new, 1)
          detail_path.write_text(text)

          identity_path = Path('Sources/Core/AppIdentity.swift')
          identity = identity_path.read_text()
          identity = identity.replace('sourceVersion = "0.14.21"', 'sourceVersion = "0.14.22"')
          identity = identity.replace('?? "0.14.21"', '?? "0.14.22"')
          if '0.14.21' in identity:
              raise SystemExit('stale 0.14.21 remains in AppIdentity')
          identity_path.write_text(identity)

          check_path = Path('scripts/check_detail_episode_selection_navigation.py')
          check = check_path.read_text()
          anchor = '''preview = block(detail, "    private func episodePreviewCard(_ episode: LibraryItem) -> some View {", "    private var seasonsSection: some View {")
picker_row = block(picker, "    private func episodeRow(_ episode: LibraryItem) -> some View {", "    private func formatDuration(_ seconds: Double) -> String {")
'''
          replacement = '''preview = block(detail, "    private func episodePreviewCard(_ episode: LibraryItem) -> some View {", "    private var seasonsSection: some View {")
picker_row = block(picker, "    private func episodeRow(_ episode: LibraryItem) -> some View {", "    private func formatDuration(_ seconds: Double) -> String {")
range_selection = block(detail, "    func selectEpisodeRange(_ offset: Int) {", "    func selectEpisode(_ episode: LibraryItem) {")
initial_selection = block(detail, "    private func applyInitialEpisodeSelection() {", "    private func storeWarmPresentation() {")
'''
          if check.count(anchor) != 1:
              raise SystemExit('contract block anchor missing')
          check = check.replace(anchor, replacement, 1)
          insert_after = '''require('selectedEpisodeRangeOffset = (offset / 10) * 10' in detail, "explicit episode selection must keep the range pill aligned")
'''
          additions = '''require('selectedEpisodeRangeOffset = (offset / 10) * 10' in detail, "explicit episode selection must keep the range pill aligned")
require('selectedEpisodeID = episode(at: normalized)?.id' in range_selection, "range jump must select the first episode in the target range")
require('selectedEpisodeID = nil' not in range_selection, "range jump must not clear the selected episode")
require('let resumeEpisode = episodes.first(where: { $0.playbackProgress > 0.001 && !$0.isPlayed })' in initial_selection, "detail entry must prefer the resumable episode")
require('guard let target = requestedEpisode ?? resumeEpisode ?? episodes.first else { return }' in initial_selection, "detail entry must fall back to the canonical first episode")
require('selectedEpisodeID = target.id' in initial_selection, "detail entry must visibly select its default episode")
require('episodeScrollTargetID = target.id' in initial_selection, "detail entry must scroll the selected default episode into view")
'''
          if check.count(insert_after) != 1:
              raise SystemExit('contract insertion anchor missing')
          check = check.replace(insert_after, additions, 1)
          check_path.write_text(check)
          PY

          cat > docs/changelog/CHANGELOG_v0_14_22_build189.md <<'EOF'
          # OnePlayer 0.14.22 / Build189

          ## Detail default episode selection follow-up

          - Real-device Build188 feedback showed two selection-state gaps: entering a series did not visibly select the resume/default episode, and tapping a quick 10-episode jump cleared the selected episode/title.
          - Series detail entry now selects the existing resumable episode when Emby exposes a nonzero playback position; if no resumable episode exists, it selects the canonical first episode. Explicit `initialEpisodeID` still has highest priority.
          - The selected default episode also becomes the existing horizontal scroll target, so its blue outline/title are visible on entry.
          - Tapping a quick episode-range button now selects the first episode in that range instead of clearing `selectedEpisodeID`; the blue outline, compact selected-episode title and main Play/Resume target remain coherent.
          - No Player/Transport/Cache/PiP, canonical episode ordering, detail performance cache, or iOS deployment behavior is changed.

          Evidence at changelog creation: code written only; CI/IPA/real-device follow-up pending.
          EOF

          git diff --check
          python3 scripts/check_detail_episode_selection_navigation.py
          python3 scripts/check_detail_episode_range_jump.py
          python3 scripts/check_detail_resume_button.py
      - name: Commit Build189 source fixes
        run: |
          git config user.name "OnePlayer CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources/UI/EmbyMediaDetailView.swift Sources/Core/AppIdentity.swift scripts/check_detail_episode_selection_navigation.py docs/changelog/CHANGELOG_v0_14_22_build189.md
          git commit -m "Fix default detail episode selection"
          git push origin HEAD:feat/detail-episode-selection-navigation
