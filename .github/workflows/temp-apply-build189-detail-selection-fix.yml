name: Apply Build189 detail selection fixes

on:
  push:
    branches: [feat/detail-episode-selection-navigation]
    paths:
      - ".github/workflows/temp-apply-build189-detail-selection-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/detail-episode-selection-navigation
          fetch-depth: 0
      - name: Apply exact Build189 source fixes
        run: |
          set -euo pipefail
          python3 scripts/temp_apply_build189_detail_selection_fix.py
          git diff --check
          python3 scripts/check_detail_episode_selection_navigation.py
          python3 scripts/check_detail_episode_range_jump.py
          python3 scripts/check_detail_resume_button.py
      - name: Commit Build189 source fixes
        run: |
          git config user.name "OnePlayer CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources/UI/EmbyMediaDetailView.swift Sources/Core/AppIdentity.swift scripts/check_detail_episode_selection_navigation.py docs/changelog/CHANGELOG_v0_14_22_build189.md
          git commit -m "Fix default detail episode selection"
          git push origin HEAD:feat/detail-episode-selection-navigation
