name: Build173 PiP Seek Completion Release

on:
  push:
    branches: [main]
    paths: [".github/workflows/build-ksplayer-lab.yml"]
  pull_request:
    branches: [main]
    paths: ["docs/ci/build173-trigger.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build173 source
        uses: actions/checkout@v4
        with:
          ref: fix/pip-seek-completion-return-simplify-0.14.6
          fetch-depth: 0

      - name: Validate Build173 contracts
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          base="84ba02b6421ebef1bc43622a11562d1d1305ac04"
          app=Path("Sources/Core/AppIdentity.swift").read_text()
          project=Path("project.yml").read_text()
          pip=Path("Sources/UI/PlayerPiPSessionCoordinator.swift").read_text()

          checks={
            "Build173 version": 'sourceVersion = "0.14.6"' in app,
            "iOS15 deployment": 'iOS: "15.0"' in project and 'deploymentTarget: "15.0"' in project,
            "seek completion token ownership": "PendingSystemSeekCompletion" in pip and "pendingSystemSeekCompletions" in pip,
            "deferred skip completion": "completionPolicy=after-visual-timebase-commit" in pip and "system completion immediate" not in pip,
            "completion after commit diagnostics": "contract=after-timebase-commit" in pip and "completeSystemSeekCompletions(upTo:" in pip,
            "supersede preserves pending completion": 'cancelSeekTransaction(reason: "superseded", releasePendingSystemCompletions: false)' in pip,
            "no periodic return sync": "synchronizeReturnBridgeToMPVAuthorityIfNeeded" not in pip and "visual bridge catchup hold" not in pip and "lastReturnBridgeAuthoritySyncAt" not in pip,
            "one-shot return alignment": "returnBridgeHandoffMeasurement" in pip and "visual bridge final one-shot align" in pip and "returnFinalBridgeAlignmentApplied" in pip,
          }
          for name,ok in checks.items():
            print(("PASS" if ok else "FAIL"),name)
            if not ok: raise SystemExit(f"::error::{name}")

          # The valid skip path may only pass completion into beginSeek; direct completion is allowed only in the invalid-state guard.
          a=pip.index("func pictureInPictureController(_ pictureInPictureController: AVPictureInPictureController, skipByInterval")
          b=pip.index("func pictureInPictureControllerShouldProhibitBackgroundAudioPlayback",a)
          skip=pip[a:b]
          if "beginSeek(delta: delta, systemCompletion: completionHandler" not in skip:
            raise SystemExit("::error::skip completion not owned by seek token")
          if "beginSeek(delta: delta)\n        completionHandler()" in skip or "system completion immediate" in skip:
            raise SystemExit("::error::skip still completes immediately")
          print("PASS AVKit skip completion deferred until visual/timebase commit")

          frozen=[
            "Sources/Player/MPVPlayerEngine.swift",
            "Sources/App/AppOrientationCoordinator.swift",
            "Sources/Player/PlayerSurfacePresentationGate.swift",
            "Sources/UI/MPVPlayerSurface.swift",
            "Sources/UI/PlayerPiPSamplePipeline.swift",
            "Sources/UI/PlayerPiPInlineRendererAdapter.swift",
            "Sources/Transport/TransportSettings.swift",
            "Sources/Transport/UnifiedMediaTransportSession.swift",
            "Sources/UI/CacheSettingsView.swift",
          ]
          diff=subprocess.run(["git","diff","--name-only",base,"HEAD","--",*frozen],capture_output=True,text=True,check=True).stdout.strip()
          if diff: raise SystemExit(f"::error::frozen files changed: {diff}")
          print("PASS MPV, orientation, presentation, pipeline, cache and transport frozen")

          changed=subprocess.run(["git","diff","--name-only",base,"HEAD"],capture_output=True,text=True,check=True).stdout.splitlines()
          allowed={"Sources/Core/AppIdentity.swift","Sources/UI/PlayerPiPSessionCoordinator.swift","docs/changelog/CHANGELOG_v0_14_6_build173.md"}
          unexpected=[p for p in changed if p not in allowed]
          if unexpected: raise SystemExit(f"::error::unexpected changed files: {unexpected}")
          print("PASS Build173 diff boundary")
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Release
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            MARKETING_VERSION=0.14.6 \
            CURRENT_PROJECT_VERSION=173 \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build173.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-Build173-errors-${{ github.sha }}
          path: |
            build173.log
            package-resolution.log
          retention-days: 7

      - name: Locate and validate app
        if: success()
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id "com.embyplayerlab.app" --version "0.14.6" --build "173" --display-name "OnePlayer" --minimum-os "15.0" --primary-icon "OnePlayerIcon" --alternate-icon "OnePlayerAltIcon"

      - name: Validate MinOS
        if: success()
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" build173-min-os.log build173.log

      - name: Package unsigned IPA
        if: success()
        run: |
          set -euo pipefail
          rm -rf Payload && mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-0.14.6-build173-pip-seek-completion-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          SOURCE_ZIP="OnePlayer-0.14.6-build173-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Upload Build173 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.6-build173-pip-seek-completion
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            build173.log
            build173-min-os.log
            package-resolution.log
          retention-days: 30

      - name: Publish Build173 test prerelease
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.14.6-build173-test"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" "$IPA_NAME" "$IPA_NAME.sha256" "$SOURCE_ZIP" "$SOURCE_ZIP.sha256" --target "$SOURCE_SHA" --title "OnePlayer 0.14.6 Build173" --notes "Build173 AVKit PiP seek completion contract + simplified return handoff." --prerelease
