name: Build KSPlayer Lab IPA

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-ksplayer-lab.yml"

permissions:
  contents: read

concurrency:
  group: build135-registered-ks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.ref == 'ci/build135-residual-run'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout CI helper
        uses: actions/checkout@v4
        with:
          ref: ci/build135-residual-run
          path: trigger
          fetch-depth: 1

      - name: Checkout Build135 experiment
        uses: actions/checkout@v4
        with:
          ref: diag/mpv-residual-refine-0.13.68
          path: work
          fetch-depth: 1

      - name: Apply bounded MPV residual refinement
        run: |
          set -euo pipefail
          cd work
          python3 ../trigger/scripts/apply_build135_residual.py
          git diff --check
          grep -Fq 'sourceVersion = "0.13.68"' Sources/Core/AppIdentity.swift
          grep -Fq 'residualRefineMaxSeconds = 1.250' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'mode=absolute+exact' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'phase=complete primaryLanding=' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'event=playback-restart-before-latest-native-dispatch ignored=true' Sources/Player/MPVPlayerEngine.swift
          test "$(grep -Fc 'mode = "absolute+keyframes"' Sources/Player/MPVPlayerEngine.swift)" -ge 2
          grep -Fq 'MPVKit:' project.mdklab.yml
          grep -Fq 'exactVersion: 1.0.0' project.mdklab.yml
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Generate project and resolve dependencies
        working-directory: work
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build Build135 Release
        working-directory: work
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.68 CURRENT_PROJECT_VERSION=135 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Locate and validate app
        run: |
          set -euo pipefail
          APP_PATH="$(find work/build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          python3 work/scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.68' --build '135' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee work/app-validation.log
          chmod +x work/scripts/check_min_os.sh
          work/scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' work/min-os-report.log work/build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.68-build135-mpv-residual-refine-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build135 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.68-build135-mpv-residual-refine
          path: |
            OnePlayer-0.13.68-build135-mpv-residual-refine-unsigned.ipa
            OnePlayer-0.13.68-build135-mpv-residual-refine-unsigned.ipa.sha256
            work/app-validation.log
            work/min-os-report.log
            work/build.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build135 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-build135-diagnostics
          path: |
            work/app-validation.log
            work/min-os-report.log
            work/build.log
          if-no-files-found: warn
          retention-days: 14
