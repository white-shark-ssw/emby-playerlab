name: Build171 PiP Authority Seek Tail Release

on:
  push:
    branches: [main]
    paths: [".github/workflows/build-ksplayer-lab.yml"]
  pull_request:
    branches: [main]
    paths: ["docs/ci/build171-trigger.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build171-pip-authority-seek-tail-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build171 source
        uses: actions/checkout@v4
        with:
          ref: fix/pip-authority-seek-tail-0.14.4
          fetch-depth: 0

      - name: Validate Build171 contracts
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          base = "c33396a56fce774ff7dc586b97c2492bc0e48bfc"
          app = Path("Sources/Core/AppIdentity.swift").read_text()
          project = Path("project.yml").read_text()
          mpv = Path("Sources/Player/MPVPlayerEngine.swift").read_text()
          pip = Path("Sources/UI/PlayerPiPSessionCoordinator.swift").read_text()

          checks = {
              "Build171 version": 'sourceVersion = "0.14.4"' in app,
              "iOS 15 deployment": 'iOS: "15.0"' in project and 'deploymentTarget: "15.0"' in project,
              "MPV native absolute keyframes": 'let mode = "absolute+keyframes"' in mpv and 'absolute+exact' not in mpv,
              "post-restore video PTS baseline": 'pictureInPictureResumeBaselineVideoPTS' in mpv and 'videoPTSAdvanced' in mpv and 'playingFrameSignal' in mpv,
              "PiP seek real target context": 'let requestedTarget: Double' in pip and 'let dispatchTarget: Double' in pip,
              "PiP seek 180ms deadline": 'seekOptimisticDeadlineWorkItem' in pip and 'longTailDeadlineMs=180' in pip and '.now() + 0.18' in pip,
              "PiP seek confidence bounds": 'strictSampleConfidence' in pip and '<= 0.35' in pip and 'longTailSampleConfidence' in pip and '<= 0.65' in pip,
              "no unconditional previous keyframe confidence": 'context.optimisticCommitEnabled = info.previousKeyframe != nil || abs(info.dispatchTarget - info.requestedTarget) > 0.001' not in pip,
              "visual bridge authority sync": 'synchronizeReturnBridgeToMPVAuthorityIfNeeded' in pip and 'drift > 0.08' in pip and 'visual bridge authority rebase' in pip,
              "crossfade waits for aligned bridge": 'abs($0) <= 0.12' in pip and 'visual bridge handoff aligned' in pip,
              "Build170 visual bridge retained": 'system restore accepted before MPV ready policy=samplebuffer-fullscreen-bridge' in pip and 'visual bridge crossfade begin' in pip,
              "PiP X pause-and-suspend retained": 'pause-and-suspend committed' in pip and 'playbackController?.stop()' not in pip,
          }
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL"), name)
              if not ok: raise SystemExit(f"::error::{name}")

          frozen_files = [
              "Sources/App/AppOrientationCoordinator.swift",
              "Sources/Player/PlayerSurfacePresentationGate.swift",
              "Sources/UI/MPVPlayerSurface.swift",
              "Sources/UI/PlayerPiPInlineRendererAdapter.swift",
              "Sources/UI/PlayerPiPSamplePipeline.swift",
              "Sources/UI/PlayerPiPBehaviorState.swift",
              "Sources/Transport/TransportSettings.swift",
              "Sources/Transport/UnifiedMediaTransportSession.swift",
              "Sources/UI/CacheSettingsView.swift",
          ]
          diff = subprocess.run(["git","diff","--name-only",base,"HEAD","--",*frozen_files],capture_output=True,text=True,check=True).stdout.strip()
          if diff: raise SystemExit(f"::error::frozen files changed: {diff}")
          print("PASS orientation, presentation, SampleBuffer pipeline, adapter, shared cache and UnifiedTransport frozen")

          def show_base(path):
              return subprocess.run(["git","show",f"{base}:{path}"],capture_output=True,text=True,check=True).stdout
          def section(text,start,end):
              a=text.index(start); b=text.index(end,a); return text[a:b]

          base_mpv=show_base("Sources/Player/MPVPlayerEngine.swift")
          if section(base_mpv,"    func seek(to seconds: Double, direction: SeekDirection) {","    private func claimKeyframeLookupIndex()") != section(mpv,"    func seek(to seconds: Double, direction: SeekDirection) {","    private func claimKeyframeLookupIndex()"):
              raise SystemExit("::error::MPV native seek function changed")
          print("PASS MPV native seek function byte-for-byte frozen")

          changed=subprocess.run(["git","diff","--name-only",base,"HEAD"],capture_output=True,text=True,check=True).stdout.splitlines()
          allowed={
              "Sources/Core/AppIdentity.swift",
              "Sources/Player/MPVPlayerEngine.swift",
              "Sources/UI/PlayerPiPSessionCoordinator.swift",
              "docs/changelog/CHANGELOG_v0_14_4_build171.md",
          }
          unexpected=[p for p in changed if p not in allowed]
          if unexpected: raise SystemExit(f"::error::unexpected changed files: {unexpected}")
          print("PASS Build171 diff boundary")
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Release for generic iOS device
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            MARKETING_VERSION=0.14.4 \
            CURRENT_PROJECT_VERSION=171 \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build171.log

      - name: Extract Build171 compiler errors
        if: failure()
        run: |
          set +e
          grep -nE '(^|[[:space:]])(error:|fatal error:)' build171.log > build171-errors.log
          if [ ! -s build171-errors.log ]; then tail -n 800 build171.log > build171-errors.log; fi
          sed -n '1,300p' build171-errors.log

      - name: Upload failed Build171 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-Build171-build-errors-${{ github.sha }}
          path: |
            build171.log
            build171-errors.log
            package-resolution.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate and validate app
        if: success()
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id "com.embyplayerlab.app" --version "0.14.4" --build "171" --display-name "OnePlayer" --minimum-os "15.0" --primary-icon "OnePlayerIcon" --alternate-icon "OnePlayerAltIcon"

      - name: Validate iOS 15.0 and iOS 17.0 compatibility
        if: success()
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" build171-min-os.log build171.log

      - name: Package unsigned IPA
        if: success()
        run: |
          set -euo pipefail
          rm -rf Payload && mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-0.14.4-build171-pip-authority-seek-tail-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          SOURCE_ZIP="OnePlayer-0.14.4-build171-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Upload Build171 artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.4-build171-pip-authority-seek-tail
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            build171.log
            build171-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish Build171 test prerelease
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.14.4-build171-test"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" "$IPA_NAME" "$IPA_NAME.sha256" "$SOURCE_ZIP" "$SOURCE_ZIP.sha256" --target "$SOURCE_SHA" --title "OnePlayer 0.14.4 Build171" --notes "Build171 PiP authority alignment and seek-tail guard. Native AVKit double-orientation transition remains intentionally frozen." --prerelease
