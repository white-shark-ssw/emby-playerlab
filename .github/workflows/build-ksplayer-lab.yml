name: Build169 PiP Surface Replay Release

on:
  push:
    branches: [main]
    paths: [".github/workflows/build-ksplayer-lab.yml"]
  pull_request:
    branches: [main]
    paths: ["docs/ci/build169-trigger.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build169-pip-surface-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build169 source
        uses: actions/checkout@v4
        with:
          ref: fix/pip-surface-replay-0.14.2
          fetch-depth: 0

      - name: Validate Build169 contracts
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          base = "60aed83d012ed6b4d7bb0199a9dfcdd4ef492f11"
          app = Path("Sources/Core/AppIdentity.swift").read_text()
          project = Path("project.yml").read_text()
          gate = Path("Sources/Player/PlayerSurfacePresentationGate.swift").read_text()
          surface = Path("Sources/UI/MPVPlayerSurface.swift").read_text()
          pip = Path("Sources/UI/PlayerPiPSessionCoordinator.swift").read_text()
          mpv = Path("Sources/Player/MPVPlayerEngine.swift").read_text()

          checks = {
              "Build169 version": 'sourceVersion = "0.14.2"' in app,
              "iOS 15 deployment": 'iOS: "15.0"' in project and 'deploymentTarget: "15.0"' in project,
              "explicit replay generation": 'replayGeneration' in gate and 'replayGeneration &+= 1' in gate,
              "surface replay resubmits geometry": 'lastHandledReplayGeneration' in surface and 'reason=explicit-gate-replay' in surface,
              "display-link final handoff": 'returnHandoffDisplayLink' in pip and 'handleReturnHandoffDisplayLink' in pip and 'trigger=next-display-link' in pip,
              "wait system stop before release": 'return renderer ready before system stop action=hold-bridge-until-didStop' in pip,
              "MPV absolute keyframes": 'let mode = "absolute+keyframes"' in mpv and 'absolute+exact' not in mpv,
              "vid=no retained": 'name: "vid", value: "no"' in mpv and 'name: "vo", value: "null"' not in mpv,
          }
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL"), name)
              if not ok: raise SystemExit(f"::error::{name}")

          frozen = [
              "Sources/Transport/TransportSettings.swift",
              "Sources/Transport/UnifiedMediaTransportSession.swift",
              "Sources/UI/CacheSettingsView.swift",
          ]
          diff = subprocess.run(["git","diff","--name-only",base,"HEAD","--",*frozen],capture_output=True,text=True,check=True).stdout.strip()
          if diff: raise SystemExit(f"::error::shared cache changed: {diff}")
          print("PASS shared cache frozen")

          def show_base(path):
              return subprocess.run(["git","show",f"{base}:{path}"],capture_output=True,text=True,check=True).stdout
          def section(text,start,end):
              a=text.index(start); b=text.index(end,a); return text[a:b]
          base_mpv=show_base("Sources/Player/MPVPlayerEngine.swift")
          if section(base_mpv,"    func seek(to seconds: Double, direction: SeekDirection) {","    private func claimKeyframeLookupIndex()") != section(mpv,"    func seek(to seconds: Double, direction: SeekDirection) {","    private func claimKeyframeLookupIndex()"):
              raise SystemExit("::error::MPV native seek function changed")
          base_pip=show_base("Sources/UI/PlayerPiPSessionCoordinator.swift")
          if section(base_pip,"    private func beginSeek(delta: Double) {","    private func reset(reason: String") != section(pip,"    private func beginSeek(delta: Double) {","    private func reset(reason: String"):
              raise SystemExit("::error::PiP seek transaction changed")
          print("PASS native seek and PiP seek frozen")
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Release for generic iOS device
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            MARKETING_VERSION=0.14.2 \
            CURRENT_PROJECT_VERSION=169 \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build169.log

      - name: Extract Build169 compiler errors
        if: failure()
        run: |
          set +e
          grep -nE '(^|[[:space:]])(error:|fatal error:)' build169.log > build169-errors.log
          if [ ! -s build169-errors.log ]; then tail -n 800 build169.log > build169-errors.log; fi
          sed -n '1,280p' build169-errors.log

      - name: Upload failed Build169 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-Build169-build-errors-${{ github.sha }}
          path: |
            build169.log
            build169-errors.log
            package-resolution.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate and validate app
        if: success()
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id "com.embyplayerlab.app" --version "0.14.2" --build "169" --display-name "OnePlayer" --minimum-os "15.0" --primary-icon "OnePlayerIcon" --alternate-icon "OnePlayerAltIcon"

      - name: Validate iOS 15.0 and iOS 17.0 compatibility
        if: success()
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" build169-min-os.log build169.log

      - name: Package unsigned IPA
        if: success()
        run: |
          set -euo pipefail
          rm -rf Payload && mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-0.14.2-build169-pip-surface-replay-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          SOURCE_ZIP="OnePlayer-0.14.2-build169-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Upload Build169 artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.2-build169-pip-surface-replay
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            build169.log
            build169-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish Build169 test prerelease
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.14.2-build169-test"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" "$IPA_NAME" "$IPA_NAME.sha256" "$SOURCE_ZIP" "$SOURCE_ZIP.sha256" --target "$SOURCE_SHA" --title "OnePlayer 0.14.2 Build169" --notes "Build169 PiP surface replay and final-frame handoff test IPA. Seek and cache remain frozen." --prerelease
