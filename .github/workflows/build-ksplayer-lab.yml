name: Build KSPlayer Lab IPA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Sources/**"
      - "Config/**"
      - "Resources/**"
      - "project.kslab.yml"
      - "Podfile"
      - ".github/workflows/build-ksplayer-lab.yml"
  push:
    branches: [main, master]
    paths:
      - "Sources/**"
      - "Config/**"
      - "Resources/**"
      - "project.kslab.yml"
      - "Podfile"
      - ".github/workflows/build-ksplayer-lab.yml"

permissions:
  contents: read

concurrency:
  group: build-ksplayer-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Prepare OnePlayer assets
        run: python3 scripts/generate_oneplayer_icons.py

      - name: Validate KSPlayer lab source contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          spec = Path("project.kslab.yml").read_text()
          engine = Path("Sources/Player/PlayerEngine.swift").read_text()
          ks = Path("Sources/Player/KSAVIOPlayerEngine.swift").read_text()
          screen = Path("Sources/UI/PlayerScreen.swift").read_text()
          checks = {
              "iOS 15 deployment": 'iOS: "15.0"' in spec and 'deploymentTarget: "15.0"' in spec,
              "KSPlayer exact 2.3.4": "exactVersion: 2.3.4" in spec,
              "MPVKit excluded from KS lab": "MPVKit" not in spec,
              "experimental engine preference": "case ksAVIO" in engine and "KSPlayer KSME（实验）" in engine,
              "shared AVIO engine": "KSPlayerSparseAVIOContext" in ks and "sharedTransportSession" in ks,
              "hardware decode": "hardwareDecode=true" in ks and "player.playbackRate" in ks,
              "KS surface restored": "KSAVIOPlayerSurface(playerView: view)" in screen,
          }
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL"), name)
              if not ok:
                  raise SystemExit(f"::error::{name}")
          PY

      - name: Generate KSPlayer Lab project
        run: xcodegen generate --spec project.kslab.yml

      - name: Install KTVHTTPCache 3.1.0
        run: pod install --repo-update

      - name: Restore Swift package cache
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: ${{ runner.os }}-ksplayer-2.3.4-ktv-3.1.0-${{ hashFiles('project.kslab.yml', 'Podfile') }}

      - name: Resolve KSPlayer 2.3.4
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee ks-package-resolution.log
          grep -R '"version" : "2.3.4"' EmbyPlayerLab.xcworkspace/xcshareddata/swiftpm/Package.resolved .spm-cache 2>/dev/null | head -n 5 || true

      - name: Verify KSPlayer license and package minimums
        run: |
          set -euo pipefail
          test -f .spm-cache/checkouts/KSPlayer/LICENSE
          grep -q "GNU GENERAL PUBLIC LICENSE" .spm-cache/checkouts/KSPlayer/LICENSE
          grep -q '.iOS(.v13)' .spm-cache/checkouts/KSPlayer/Package.swift
          grep -q '.iOS(.v13)' .spm-cache/checkouts/FFmpegKit/Package.swift
          echo "KSPlayer 2.3.4 public build: GPL-3.0; experiment artifact only." | tee ks-license-report.log
          echo "KSPlayer declared minimum iOS: 13" | tee -a ks-license-report.log
          echo "FFmpegKit declared minimum iOS: 13" | tee -a ks-license-report.log

      - name: Build KSPlayer Lab for generic iOS device
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee ks-build.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py \
            "$APP_PATH" \
            --bundle-id "com.embyplayerlab.app" \
            --version "0.13.3" \
            --build "69" \
            --display-name "OnePlayer" \
            --minimum-os "15.0" \
            --primary-icon "OnePlayerIcon" \
            --alternate-icon "OnePlayerAltIcon"

      - name: Validate runtime and embedded minimum OS
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" ks-min-os-report.log ks-build.log
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          bad = []
          rows = []
          for info in Path('.spm-cache').rglob('Info.plist'):
              if '.xcframework' not in str(info) or 'ios-arm64' not in str(info):
                  continue
              try:
                  data = plistlib.loads(info.read_bytes())
              except Exception:
                  continue
              minimum = data.get('MinimumOSVersion')
              if minimum:
                  rows.append((str(info), str(minimum)))
                  parts = tuple(int(x) for x in str(minimum).split('.')[:2])
                  if parts > (15, 0):
                      bad.append((str(info), str(minimum)))
          Path('ks-framework-min-os-report.log').write_text('\n'.join(f'{v} {p}' for p, v in rows) + '\n')
          if bad:
              raise SystemExit('::error::KSPlayer/FFmpegKit binary target minimum OS exceeds 15.0: ' + repr(bad))
          PY

      - name: Package KSPlayer Lab unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-KSPlayerLab-0.13.3-${GITHUB_SHA::7}-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Export experiment source snapshot
        run: |
          set -euo pipefail
          SOURCE_ZIP="OnePlayer-KSPlayerLab-${GITHUB_SHA::7}-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Upload KSPlayer Lab artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-KSPlayerLab-${{ github.sha }}
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            ks-package-resolution.log
            ks-build.log
            ks-license-report.log
            ks-min-os-report.log
            ks-framework-min-os-report.log
          if-no-files-found: error
          retention-days: 30
