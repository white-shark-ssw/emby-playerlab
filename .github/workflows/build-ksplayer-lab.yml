name: Build166 Shared Cache PiP Release

on:
  push:
    branches: [main]
    paths: [".github/workflows/build-ksplayer-lab.yml"]
  pull_request:
    branches: [main]
    paths: ["docs/ci/build166-trigger.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build166-shared-cache-pip-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build166 source
        uses: actions/checkout@v4
        with:
          ref: fix/pip-handoff-shared-cache-0.13.99

      - name: Validate Build166 source
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          app = Path('Sources/Core/AppIdentity.swift').read_text()
          project = Path('project.yml').read_text()
          mpv = Path('Sources/Player/MPVPlayerEngine.swift').read_text()
          pip = Path('Sources/UI/PlayerPiPSessionCoordinator.swift').read_text()
          orientation = Path('Sources/App/AppOrientationCoordinator.swift').read_text()
          screen = Path('Sources/UI/PlayerScreen.swift').read_text()
          settings = Path('Sources/Transport/TransportSettings.swift').read_text()
          transport = Path('Sources/Transport/UnifiedMediaTransportSession.swift').read_text()
          cacheui = Path('Sources/UI/CacheSettingsView.swift').read_text()
          gesture = Path('Sources/UI/PlaybackGestureOverlay.swift').read_text()
          checks = {
              'Build166 source version': 'sourceVersion = "0.13.99"' in app,
              'iOS 15 deployment': 'iOS: "15.0"' in project and 'deploymentTarget: "15.0"' in project,
              'MPV seek frozen': 'absolute+keyframes' in mpv and 'absolute+exact' not in mpv,
              'shared retention config': 'sharedRetentionMB = max(wifiMB, cellularMB)' in settings and 'diskLimitBytes: sharedRetentionBytes' in settings,
              'active network no longer disables persistent cache': 'cacheMode: sharedRetentionMB > 0 ? .disk : .disabled' in settings and 'keepLast = defaults.bool(forKey: TransportSettingsKey.keepLastCache) && sharedRetentionMB > 0' in settings,
              'active preload separated from retention': 'private func preloadWindowBytes()' in transport and 'private func retentionWindowBytes()' in transport and 'rollingSoftLimitBytes(window: retentionWindow)' in transport,
              'shared cache diagnostic': 'cachePool=shared-across-network' in transport,
              'cache UI semantics': 'Wi-Fi 预加载上限' in cacheui and '蜂窝网络预加载上限' in cacheui and '共用同一份磁盘 Range 缓存' in cacheui,
              'PiP optimistic seek': 'optimistic visual commit' in pip and 'landing validate' in pip and 'authority=pending-mpv-landing' in pip,
              'PiP return cover after fresh frame': 'armPictureInPicturePresentationRelease()' in orientation and 'releasePolicy=after-mpv-fresh-frame' in orientation and 'armed-after-fresh-frame' in pip,
              'PiP X foreground dismissal': 'UIApplication.didBecomeActiveNotification' in screen and 'finalizePiPClosedPlaybackDismissal' in screen,
              'PiP pre-home suspend continuity': 'prepareRendererForHomeAfterSystemStart' in pip and 'after-renderer-suspend-continuity' in pip and 'waitForPictureInPictureSuspendPlaybackContinuity' in mpv,
              'Build161 volume dedupe retained': 'lastAppliedAdjustmentTick' in gesture,
          }
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL'), name)
              if not ok: raise SystemExit(f'::error::{name}')
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Release for generic iOS device
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            MARKETING_VERSION=0.13.99 \
            CURRENT_PROJECT_VERSION=166 \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build166.log

      - name: Extract Build166 compiler errors
        if: failure()
        run: |
          set +e
          grep -nE '(^|[[:space:]])(error:|fatal error:)' build166.log > build166-errors.log
          if [ ! -s build166-errors.log ]; then tail -n 700 build166.log > build166-errors.log; fi
          sed -n '1,260p' build166-errors.log

      - name: Upload failed Build166 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-Build166-build-errors-${{ github.sha }}
          path: |
            build166.log
            build166-errors.log
            package-resolution.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate and validate app
        if: success()
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id "com.embyplayerlab.app" --version "0.13.99" --build "166" --display-name "OnePlayer" --minimum-os "15.0" --primary-icon "OnePlayerIcon" --alternate-icon "OnePlayerAltIcon"

      - name: Validate iOS 15.0 and iOS 17.0 compatibility
        if: success()
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" build166-min-os.log build166.log

      - name: Package unsigned IPA
        if: success()
        run: |
          set -euo pipefail
          rm -rf Payload && mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-0.13.99-build166-shared-cache-pip-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          SOURCE_ZIP="OnePlayer-0.13.99-build166-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Upload Build166 artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.99-build166-shared-cache-pip
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            build166.log
            build166-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish Build166 test prerelease
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.13.99-build166-test"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" "$IPA_NAME" "$IPA_NAME.sha256" "$SOURCE_ZIP" "$SOURCE_ZIP.sha256" --target "$SOURCE_SHA" --title "OnePlayer 0.13.99 Build166" --notes "Build166 shared network cache pool and PiP handoff test IPA. iOS 15.0 Deployment Target remains frozen." --prerelease
