name: Build OnePlayer 0.13.69 Build136 Seek Fence Keyframe Probe

on:
  workflow_dispatch:
  pull_request:
    branches: [diag/scrub-hud-ex-0.13.67]
    types: [opened, synchronize, reopened]
    paths:
      - "Sources/**"
      - "scripts/apply_build136_seek_fence_probe.py"
      - "project.mdklab.yml"
      - "Podfile"
      - ".github/workflows/build-ksplayer-lab.yml"

permissions:
  contents: write

concurrency:
  group: build136-seek-fence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'diag/mpv-seek-fence-keyframe-probe-0.13.69'
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout Build136 experiment
        uses: actions/checkout@v4
        with:
          ref: diag/mpv-seek-fence-keyframe-probe-0.13.69
          fetch-depth: 0

      - name: Apply seek generation fence and keyframe backend probe
        run: |
          set -euo pipefail
          python3 scripts/apply_build136_seek_fence_probe.py
          git diff --check
          git status --short

      - name: Persist Build136 real source
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add Sources/Core/AppIdentity.swift Sources/Player/MPVPlayerEngine.swift Sources/Player/MPVKeyframeIndexProbe.swift
          if ! git diff --cached --quiet; then
            git commit -m 'Build136: add MPV seeking epoch fence and keyframe backend probe'
            git push origin HEAD:diag/mpv-seek-fence-keyframe-probe-0.13.69
          fi

      - name: Verify Build136 source contract
        run: |
          set -euo pipefail
          grep -Fq 'sourceVersion = "0.13.69"' Sources/Core/AppIdentity.swift
          grep -Fq 'private var activeSeekingEpochID: UInt64?' Sources/Player/MPVPlayerEngine.swift
          grep -Fq '("seeking", MPV_FORMAT_FLAG)' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'reason=no-latest-seeking-epoch' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'owner=seeking-epoch' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'OnePlayerKeyframeIndexProbe.runtimeDescription' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'canImport(Libavformat)' Sources/Player/MPVKeyframeIndexProbe.swift
          grep -Fq 'intent = "doubleTapFastSeek"' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'intent = "scrubReleaseFastSeek"' Sources/Player/MPVPlayerEngine.swift
          test "$(grep -Fc 'mode = "absolute+keyframes"' Sources/Player/MPVPlayerEngine.swift)" -ge 2
          ! grep -Fq 'residualRefineMaxSeconds' Sources/Player/MPVPlayerEngine.swift
          ! grep -Fq 'absolute+exact' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          git diff --check

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Generate project and resolve MPVKit
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Build136 Release
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.69 CURRENT_PROJECT_VERSION=136 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.69' --build '136' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Detect keyframe index backend
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          BIN="$APP_PATH/$EXECUTABLE"
          if nm -gU "$BIN" | grep -q 'oneplayer_keyframe_backend_libavformat_direct'; then
            echo 'backend=libavformat-direct' | tee keyframe-backend-report.log
          elif nm -gU "$BIN" | grep -q 'oneplayer_keyframe_backend_unavailable'; then
            echo 'backend=unavailable reason=Libavformat-or-Libavutil-not-importable-from-app-target' | tee keyframe-backend-report.log
          else
            echo 'backend=unknown probe-symbol-missing' | tee keyframe-backend-report.log
            exit 1
          fi
          cat keyframe-backend-report.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.69-build136-seek-fence-keyframe-probe-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build136 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.69-build136-seek-fence-keyframe-probe
          path: |
            OnePlayer-0.13.69-build136-seek-fence-keyframe-probe-unsigned.ipa
            OnePlayer-0.13.69-build136-seek-fence-keyframe-probe-unsigned.ipa.sha256
            keyframe-backend-report.log
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build136 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.69-build136-seek-fence-keyframe-probe-diagnostics
          path: |
            keyframe-backend-report.log
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: warn
          retention-days: 14
