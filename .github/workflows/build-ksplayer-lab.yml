name: Build KSPlayer Lab IPA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ksplayer-lab.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/ci/build161-trigger.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build161-pip-interaction-smoothness
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - name: Checkout Build161 source
        uses: actions/checkout@v4
        with:
          ref: fix/pip-interaction-smoothness-0.13.94

      - name: Record Build161 source SHA
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Validate Build161 frozen contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path('Sources/Core/AppIdentity.swift').read_text()
          project = Path('project.yml').read_text()
          mpv = Path('Sources/Player/MPVPlayerEngine.swift').read_text()
          pip = Path('Sources/UI/PlayerPiPSessionCoordinator.swift').read_text()
          orientation = Path('Sources/App/AppOrientationCoordinator.swift').read_text()
          gesture = Path('Sources/UI/PlaybackGestureOverlay.swift').read_text()
          transport = Path('Sources/Transport/UnifiedMediaTransportSession.swift').read_text()
          checks = {
              'Build161 source version': 'sourceVersion = "0.13.94"' in app,
              'iOS 15 deployment': 'iOS: "15.0"' in project and 'deploymentTarget: "15.0"' in project,
              'MPV fast seek remains keyframes': 'absolute+keyframes' in mpv and 'absolute+exact' not in mpv,
              'PiP visual runs until engine landing': 'keep-visual-running-until-authoritative-engine-landing' in pip,
              'PiP orientation hold': 'beginPictureInPictureRestoreOrientationHold' in orientation and 'orientationHold=until-system-didStop' in pip,
              'volume tick dedupe': 'lastAppliedAdjustmentTick' in gesture,
              'UnifiedTransport still present': 'UnifiedMediaTransportSession' in transport,
          }
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL'), name)
              if not ok: raise SystemExit(f'::error::{name}')
          PY

      - name: Prepare OnePlayer assets
        run: python3 scripts/generate_oneplayer_icons.py

      - name: Generate project
        run: xcodegen generate

      - name: Install KTVHTTPCache 3.1.0
        run: pod install --repo-update

      - name: Restore Swift package cache
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: ${{ runner.os }}-build161-mpvkit-1.0.0-ktv-3.1.0-${{ hashFiles('project.yml', 'Podfile') }}

      - name: Resolve MPVKit
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Release for generic iOS device
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            MARKETING_VERSION=0.13.94 \
            CURRENT_PROJECT_VERSION=161 \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build161.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py \
            "$APP_PATH" \
            --bundle-id "com.embyplayerlab.app" \
            --version "0.13.94" \
            --build "161" \
            --display-name "OnePlayer" \
            --minimum-os "15.0" \
            --primary-icon "OnePlayerIcon" \
            --alternate-icon "OnePlayerAltIcon"

      - name: Validate iOS 15.0 and iOS 17.0 compatibility
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" build161-min-os.log build161.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-0.13.94-build161-pip-interaction-smoothness-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          SOURCE_ZIP="OnePlayer-0.13.94-build161-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Upload Build161 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.94-build161-pip-interaction-smoothness
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            build161.log
            build161-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish Build161 test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.13.94-build161-test"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "$IPA_NAME" \
            "$IPA_NAME.sha256" \
            "$SOURCE_ZIP" \
            "$SOURCE_ZIP.sha256" \
            --target "$SOURCE_SHA" \
            --title "OnePlayer 0.13.94 Build161" \
            --notes "Build161 real-device test IPA. PiP seek smoothness, PiP restore orientation hold, and 1% vertical adjustment dedupe. MPV absolute+keyframes and UnifiedTransport remain frozen. Deployment Target iOS 15.0; iOS 17.0 target device supported." \
            --prerelease

      - name: Summarize Build161 errors
        if: failure()
        run: |
          echo '## Build161 errors' >> "$GITHUB_STEP_SUMMARY"
          grep -nE '(^|[[:space:]])(error:|fatal error:)|::error::' build161.log package-resolution.log 2>/dev/null | head -200 >> "$GITHUB_STEP_SUMMARY" || true
