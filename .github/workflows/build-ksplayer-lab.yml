name: Build168 PiP Handoff Polish Release

on:
  push:
    branches: [main]
    paths: [".github/workflows/build-ksplayer-lab.yml"]
  pull_request:
    branches: [main]
    paths: ["docs/ci/build168-trigger.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build168-pip-polish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build168 source
        uses: actions/checkout@v4
        with:
          ref: fix/pip-handoff-last-frame-0.14.1
          fetch-depth: 0

      - name: Validate Build168 contracts
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          base = "4e3fbd1889f492438bda1399b89ff667947143ef"
          app = Path("Sources/Core/AppIdentity.swift").read_text()
          project = Path("project.yml").read_text()
          mpv = Path("Sources/Player/MPVPlayerEngine.swift").read_text()
          pip = Path("Sources/UI/PlayerPiPSessionCoordinator.swift").read_text()
          host = Path("Sources/UI/PlayerPiPSourceHostView.swift").read_text()

          checks = {
              "Build168 version": 'sourceVersion = "0.14.1"' in app,
              "iOS 15 deployment": 'iOS: "15.0"' in project and 'deploymentTarget: "15.0"' in project,
              "MPV native seek frozen": 'let mode = "absolute+keyframes"' in mpv and 'absolute+exact' not in mpv,
              "vid=no policy retained": 'name: "vid", value: "no"' in mpv and 'pictureInPictureSuspendedVideoID' in mpv,
              "no vo=null": 'name: "vo", value: "null"' not in mpv,
              "paused frame fast signal": 'pausedFrameSignal' in mpv and 'hasTimePosition && viewport != nil' in mpv,
              "bridge hidden before release": 'return bridge hidden before presentation release' in pip,
              "no placeholder glyph": 'UIImage(systemName: "pip")' not in host and 'placeholderImageView' not in host,
          }
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL"), name)
              if not ok: raise SystemExit(f"::error::{name}")

          # Shared cache files must remain byte-for-byte untouched from Build167.
          frozen_files = [
              "Sources/Transport/TransportSettings.swift",
              "Sources/Transport/UnifiedMediaTransportSession.swift",
              "Sources/UI/CacheSettingsView.swift",
          ]
          diff = subprocess.run(["git","diff","--name-only",base,"HEAD","--",*frozen_files],capture_output=True,text=True,check=True).stdout.strip()
          if diff: raise SystemExit(f"::error::shared cache changed: {diff}")
          print("PASS Build166 shared cache frozen")

          def show_base(path):
              return subprocess.run(["git","show",f"{base}:{path}"],capture_output=True,text=True,check=True).stdout
          def section(text,start,end):
              a=text.index(start); b=text.index(end,a); return text[a:b]

          base_mpv=show_base("Sources/Player/MPVPlayerEngine.swift")
          if section(base_mpv,"    func seek(to seconds: Double, direction: SeekDirection) {","    private func claimKeyframeLookupIndex()") != section(mpv,"    func seek(to seconds: Double, direction: SeekDirection) {","    private func claimKeyframeLookupIndex()"):
              raise SystemExit("::error::MPV native seek function changed")
          base_pip=show_base("Sources/UI/PlayerPiPSessionCoordinator.swift")
          if section(base_pip,"    private func beginSeek(delta: Double) {","    private func reset(reason: String") != section(pip,"    private func beginSeek(delta: Double) {","    private func reset(reason: String"):
              raise SystemExit("::error::PiP seek transaction changed")
          print("PASS MPV native seek and PiP seek transaction frozen")
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Release for generic iOS device
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            MARKETING_VERSION=0.14.1 \
            CURRENT_PROJECT_VERSION=168 \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build168.log

      - name: Extract Build168 compiler errors
        if: failure()
        run: |
          set +e
          grep -nE '(^|[[:space:]])(error:|fatal error:)' build168.log > build168-errors.log
          if [ ! -s build168-errors.log ]; then tail -n 800 build168.log > build168-errors.log; fi
          sed -n '1,280p' build168-errors.log

      - name: Upload failed Build168 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-Build168-build-errors-${{ github.sha }}
          path: |
            build168.log
            build168-errors.log
            package-resolution.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate and validate app
        if: success()
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id "com.embyplayerlab.app" --version "0.14.1" --build "168" --display-name "OnePlayer" --minimum-os "15.0" --primary-icon "OnePlayerIcon" --alternate-icon "OnePlayerAltIcon"

      - name: Validate iOS 15.0 and iOS 17.0 compatibility
        if: success()
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" build168-min-os.log build168.log

      - name: Package unsigned IPA
        if: success()
        run: |
          set -euo pipefail
          rm -rf Payload && mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-0.14.1-build168-pip-handoff-polish-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          SOURCE_ZIP="OnePlayer-0.14.1-build168-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Upload Build168 artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.1-build168-pip-handoff-polish
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            build168.log
            build168-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish Build168 test prerelease
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.14.1-build168-test"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" "$IPA_NAME" "$IPA_NAME.sha256" "$SOURCE_ZIP" "$SOURCE_ZIP.sha256" --target "$SOURCE_SHA" --title "OnePlayer 0.14.1 Build168" --notes "Build168 PiP handoff last-frame and paused-restore polish. PiP seek and shared cache remain frozen." --prerelease
