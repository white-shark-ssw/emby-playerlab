name: Build167 PiP Renderer Handoff Release

on:
  push:
    branches: [main]
    paths: [".github/workflows/build-ksplayer-lab.yml"]
  pull_request:
    branches: [main]
    paths: ["docs/ci/build167-trigger.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build167-pip-renderer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build167 source
        uses: actions/checkout@v4
        with:
          ref: fix/pip-renderer-handoff-0.14.0
          fetch-depth: 0

      - name: Validate Build167 contracts
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          BASE_SHA="54b6bb517a3576896515776f9de9b6b494965e5d"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          base = "54b6bb517a3576896515776f9de9b6b494965e5d"
          app = Path("Sources/Core/AppIdentity.swift").read_text()
          project = Path("project.yml").read_text()
          mpv = Path("Sources/Player/MPVPlayerEngine.swift").read_text()
          pip = Path("Sources/UI/PlayerPiPSessionCoordinator.swift").read_text()
          state = Path("Sources/UI/PlayerPiPBehaviorState.swift").read_text()
          screen = Path("Sources/UI/PlayerScreen.swift").read_text()
          wrapper = Path("Sources/UI/PlayerPictureInPictureController.swift").read_text()
          gate = Path("Sources/Player/PlayerSurfacePresentationGate.swift").read_text()
          orientation = Path("Sources/App/AppOrientationCoordinator.swift").read_text()

          checks = {
              "Build167 source version": 'sourceVersion = "0.14.0"' in app,
              "iOS 15 deployment": 'iOS: "15.0"' in project and 'deploymentTarget: "15.0"' in project,
              "MPV native seek frozen": 'let mode = "absolute+keyframes"' in mpv and 'absolute+exact' not in mpv,
              "MPV video-track PiP suspend": 'name: "vid", value: "no"' in mpv and 'pictureInPictureSuspendedVideoID' in mpv,
              "No runtime vo=null PiP switch": 'name: "vo", value: "null"' not in mpv,
              "Real vid reconciliation": 'video state reconciled' in mpv and 'currentVID == "no"' in mpv,
              "PiP X pause-and-suspend": 'pauseAndSuspend' in state and 'backgroundPaused' in state and 'pauseAndSuspendFromPiP' in pip,
              "PiP X does not stop player": 'playbackController?.stop()' not in pip,
              "PiP X does not dismiss PlayerScreen": 'closePlaybackGeneration' not in wrapper and 'pipCloseDismissPending' not in screen and 'finalizePiPClosedPlaybackDismissal' not in screen,
              "Surface replay split from release": 'func replay(targetOrientation:' in gate and 'func armRelease(targetOrientation:' in gate and 'replayPictureInPictureSurface' in orientation,
              "Return MPV authority": 'authority=mpv-snapshot' in pip and 'playbackController?.snapshot.position ?? clock.position()' in pip,
              "Early didStop keeps bridge": 'system-stopped before renderer handoff sourceHost=kept' in pip and 'return completion deferred' in pip,
          }
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL"), name)
              if not ok: raise SystemExit(f"::error::{name}")

          # Freeze Build166 shared cache implementation byte-for-byte.
          cache_files = [
              "Sources/Transport/TransportSettings.swift",
              "Sources/Transport/UnifiedMediaTransportSession.swift",
              "Sources/UI/CacheSettingsView.swift",
          ]
          diff = subprocess.run(["git","diff","--name-only",base,"HEAD","--",*cache_files],capture_output=True,text=True,check=True).stdout.strip()
          print("PASS shared cache frozen" if not diff else f"FAIL shared cache changed: {diff}")
          if diff: raise SystemExit("::error::Build166 shared cache files changed")

          # Freeze MPV native seek function and PiP seek transaction code byte-for-byte from Build166.
          def show_base(path):
              return subprocess.run(["git","show",f"{base}:{path}"],capture_output=True,text=True,check=True).stdout
          def section(text, start, end):
              a=text.index(start); b=text.index(end,a); return text[a:b]
          base_mpv=show_base("Sources/Player/MPVPlayerEngine.swift")
          if section(base_mpv,"    func seek(to seconds: Double, direction: SeekDirection) {","    private func claimKeyframeLookupIndex()") != section(mpv,"    func seek(to seconds: Double, direction: SeekDirection) {","    private func claimKeyframeLookupIndex()"):
              raise SystemExit("::error::MPV native seek function changed")
          base_pip=show_base("Sources/UI/PlayerPiPSessionCoordinator.swift")
          if section(base_pip,"    private func beginSeek(delta: Double) {","    private func reset(reason: String") != section(pip,"    private func beginSeek(delta: Double) {","    private func reset(reason: String"):
              raise SystemExit("::error::PiP seek transaction changed")
          print("PASS MPV native seek and PiP seek transaction frozen")
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Release for generic iOS device
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            MARKETING_VERSION=0.14.0 \
            CURRENT_PROJECT_VERSION=167 \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build167.log

      - name: Extract Build167 compiler errors
        if: failure()
        run: |
          set +e
          grep -nE '(^|[[:space:]])(error:|fatal error:)' build167.log > build167-errors.log
          if [ ! -s build167-errors.log ]; then tail -n 800 build167.log > build167-errors.log; fi
          sed -n '1,280p' build167-errors.log

      - name: Upload failed Build167 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-Build167-build-errors-${{ github.sha }}
          path: |
            build167.log
            build167-errors.log
            package-resolution.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate and validate app
        if: success()
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id "com.embyplayerlab.app" --version "0.14.0" --build "167" --display-name "OnePlayer" --minimum-os "15.0" --primary-icon "OnePlayerIcon" --alternate-icon "OnePlayerAltIcon"

      - name: Validate iOS 15.0 and iOS 17.0 compatibility
        if: success()
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" build167-min-os.log build167.log

      - name: Package unsigned IPA
        if: success()
        run: |
          set -euo pipefail
          rm -rf Payload && mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-0.14.0-build167-pip-renderer-handoff-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          SOURCE_ZIP="OnePlayer-0.14.0-build167-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Upload Build167 artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.0-build167-pip-renderer-handoff
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            build167.log
            build167-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish Build167 test prerelease
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.14.0-build167-test"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" "$IPA_NAME" "$IPA_NAME.sha256" "$SOURCE_ZIP" "$SOURCE_ZIP.sha256" --target "$SOURCE_SHA" --title "OnePlayer 0.14.0 Build167" --notes "Build167 PiP pause-suspend and renderer handoff test IPA. PiP seek and Build166 shared cache are frozen." --prerelease
