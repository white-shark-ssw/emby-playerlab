name: Build KSPlayer Lab IPA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "Sources/**"
      - ".github/workflows/build-ksplayer-lab.yml"

permissions:
  contents: write

concurrency:
  group: build160-native-pip-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout Build160 source
        uses: actions/checkout@v4
        with:
          ref: fix/pip-native-handoff-0.13.93
          fetch-depth: 0

      - name: Finalize Build160 source
        run: |
          set -euo pipefail
          python3 scripts/finalize_build160.py
          git diff --check
          git add Sources/Core/AppIdentity.swift Sources/Player/MPVPlayerEngine.swift Sources/UI/PlayerPiPInlineRendererAdapter.swift Sources/UI/PlayerPiPSessionCoordinator.swift Sources/UI/PlayerScreen.swift docs/changelog/CHANGELOG_v0_13_93_build160.md
          git rm -f scripts/finalize_build160.py
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build160: finalize native PiP timeline and visual handoff"
            git push origin HEAD:fix/pip-native-handoff-0.13.93
          fi

      - name: Verify Build160 contracts
        run: |
          set -euo pipefail
          grep -Fq 'sourceVersion = "0.13.93"' Sources/Core/AppIdentity.swift
          grep -Fq 'insertSubview(host, aboveSubview: sourceView)' Sources/UI/PlayerPiPSessionCoordinator.swift
          grep -Fq 'sourceSurface=visible-native-transition' Sources/UI/PlayerPiPSessionCoordinator.swift
          grep -Fq 'policy=wait-authoritative-engine-landing' Sources/UI/PlayerPiPSessionCoordinator.swift
          grep -Fq 'policy=system-first-cover-until-fresh-frame' Sources/UI/PlayerPiPSessionCoordinator.swift
          grep -Fq 'seek clock-rebase' Sources/UI/PlayerPiPSessionCoordinator.swift
          grep -Fq 'private func beginRestoreHandoffIfPossible()' Sources/UI/PlayerPiPSessionCoordinator.swift
          grep -Fq 'private func finishRestoreHandoffIfReady()' Sources/UI/PlayerPiPSessionCoordinator.swift
          ! grep -Fq 'fresh-frame-before-system-completion' Sources/UI/PlayerPiPSessionCoordinator.swift
          grep -Fq 'PlayerPiPSeekLandingProviding' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'name: "video-pts"' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'fresh-video-frame' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'abs($0) <= 0.75' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'name: "vo", value: "null"' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'name: "vo", value: "gpu-next"' Sources/Player/MPVPlayerEngine.swift
          ! grep -Fq 'vid", value: "no"' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'kCMSampleAttachmentKey_DoNotDisplay' Sources/UI/PlayerPiPSamplePipeline.swift
          test ! -e Sources/UI/PlayerSampleBufferPiPBridge.swift
          test ! -e scripts/finalize_build160.py
          git fetch origin fix/pip-vo-timebase-0.13.92 --depth=1
          test -z "$(git diff --name-only origin/fix/pip-vo-timebase-0.13.92...HEAD -- Sources/Player/PlayerController.swift Sources/Player/KSAVIOPlayerEngine.swift Sources/Transport/UnifiedMediaTransportSession.swift Sources/Player/PlaybackPresentationCoordinator.swift Sources/Player/PlaybackPresentationAdapters.swift MDKLab)"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          def seek_body(text):
              s = text.index('    func seek(to seconds: Double, direction: SeekDirection)')
              e = text.index('\n    private func claimKeyframeLookupIndex()', s)
              return text[s:e]
          head = Path('Sources/Player/MPVPlayerEngine.swift').read_text()
          base = subprocess.check_output(['git','show','origin/fix/pip-vo-timebase-0.13.92:Sources/Player/MPVPlayerEngine.swift'], text=True)
          assert seek_body(head) == seek_body(base)
          assert 'absolute+keyframes' in seek_body(head)
          assert 'absolute+exact' not in seek_body(head)
          PY
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          git diff --check

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: |
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Build160 Release
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.93 CURRENT_PROJECT_VERSION=160 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.93' --build '160' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.93-build160-native-pip-handoff-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build160 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.93-build160-native-pip-handoff
          path: |
            OnePlayer-0.13.93-build160-native-pip-handoff-unsigned.ipa
            OnePlayer-0.13.93-build160-native-pip-handoff-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build160 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.93-build160-native-pip-handoff-failure
          path: |
            build.log
            package-resolution.log
            app-validation.log
            min-os-report.log
          if-no-files-found: ignore
          retention-days: 14
