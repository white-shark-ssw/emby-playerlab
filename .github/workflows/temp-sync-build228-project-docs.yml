name: TEMP Sync Build228 Project Docs

on:
  push:
    branches: [perf/home-carousel-release-refresh-build228]
    paths:
      - ".github/build228-docs-sync-trigger.txt"

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build228 branch
        uses: actions/checkout@v4
        with:
          ref: perf/home-carousel-release-refresh-build228
          fetch-depth: 0
          persist-credentials: true

      - name: Sync authoritative docs to main
        run: |
          set -euo pipefail
          git fetch origin main perf/home-carousel-release-refresh-build228
          git checkout -B main origin/main
          git show origin/perf/home-carousel-release-refresh-build228:scripts/temp_sync_build228_docs.py > /tmp/temp_sync_build228_docs.py

          set +e
          output="$(python3 /tmp/temp_sync_build228_docs.py main 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$output"
            if ! printf '%s\n' "$output" | grep -Fqx 'D012 Build226 anchor missing'; then
              echo "Unexpected Build228 docs helper failure"
              exit "$status"
            fi
          fi

          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/project/TECHNICAL_DECISIONS.md')
          text = p.read_text()
          addition = '''Build226 target-device testing is materially positive: overall horizontal feel is now fairly close to EX and much better than the original, so three-slot Hero residency remains the current presentation direction. Build227 then tested physical-pixel foreground X rounding for slow-drag title shimmer; the title still visibly jitters, so pixel-grid quantization is rejected as a sufficient fix and should not be carried forward without new evidence.

The same Build227 target-device test identifies a separate release-tail issue. Exact source proves the Build219 device-max refresh request previously ended inside `touchesEnded` before `finishNativeCarouselDrag` started the existing commit/cancel animation. Build228 therefore tests only extending that same proven max-refresh request through interactive settle/cancel while reverting Build227 pixel rounding and leaving release duration/easing unchanged. This is a diagnostic candidate, not yet an accepted final release-animation contract.'''
          if addition not in text:
              marker = '\n## D013 —'
              if marker not in text: raise SystemExit('D013 marker missing')
              text = text.replace(marker, '\n\n' + addition + '\n' + marker, 1)
              p.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No Build228 main docs changes produced"; exit 1; }
          git commit -m "Docs: sync Build227 result and Build228 baseline [skip ci]"
          git push origin main
