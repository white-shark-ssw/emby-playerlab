name: Apply Add Emby Password Sync

on:
  push:
    branches: [feat/add-emby-page-optimization]
    paths:
      - .github/workflows/temp-apply-add-emby-password-sync.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/add-emby-page-optimization
          fetch-depth: 0

      - name: Apply password sync patch
        run: python3 tools/temp_add_emby_password_sync.py

      - name: Validate patch scope
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'Sources/Session/SessionStore.swift\nSources/UI/ServerListView.swift' || {
            echo "::error::unexpected product patch scope"
            exit 1
          }

      - name: Commit product patch
        run: |
          set -euo pipefail
          git config user.name white-shark-ssw
          git config user.email houstools@gmail.com
          git add Sources/Session/SessionStore.swift Sources/UI/ServerListView.swift
          git commit -m "Persist and sync Emby passwords for editing"
          git push origin HEAD:feat/add-emby-page-optimization
