name: Build152 Apply Fast Start Patch

on:
  pull_request:
    branches: [feature/playback-transition-airplay-pip-0.13.84]
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/fast-start-pip-0.13.85' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build152 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact PlayerScreen startup patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Sources/UI/PlayerScreen.swift')
          text = path.read_text()

          replacements = [
              ('    @State private var presentationDidAppear = false\n', '    @State private var initialOrientationStarted = false\n'),
              ('            if !orientationReady || isClosing { Color.black.ignoresSafeArea().allowsHitTesting(false) }\n\n            if orientationReady && !isClosing {\n', '            if isClosing { Color.black.ignoresSafeArea().allowsHitTesting(false) }\n\n            if !isClosing {\n'),
              ('            AppOrientationCoordinator.shared.beginPlayerPresentation(source: controller.source)\n        }\n', '            AppOrientationCoordinator.shared.beginPlayerPresentation(source: controller.source)\n            DispatchQueue.main.async { beginInitialOrientationIfNeeded(reason: "onAppear") }\n        }\n'),
              ('''    private func handlePresentationDidAppear() {\n        guard !presentationDidAppear, !isClosing else { return }\n        presentationDidAppear = true\n        DiagnosticsLogger.shared.playback("Lifecycle", "player cover fully appeared; initial orientation may begin")\n        prepareInitialOrientation()\n    }\n\n    private func handlePlayerSurfaceMounted() {\n        guard !isClosing else { return }\n        if !orientationReady {\n            DiagnosticsLogger.shared.playback("PlayerUI", "player surface mounted persistently; waiting for orientation readiness before engine activation")\n            return\n        }\n        guard !playbackStarted else { return }\n        DiagnosticsLogger.shared.playback("PlayerUI", "final-orientation persistent player surface mounted; engine activation may begin")\n        startPlaybackIfNeeded()\n    }\n''', '''    private func handlePresentationDidAppear() { beginInitialOrientationIfNeeded(reason: "viewDidAppear-fallback") }\n\n    private func beginInitialOrientationIfNeeded(reason: String) {\n        guard !initialOrientationStarted, !isClosing else { return }\n        initialOrientationStarted = true\n        DiagnosticsLogger.shared.playback("Lifecycle", "initial orientation begin trigger=\\(reason) playerUIAlreadyVisible=true")\n        prepareInitialOrientation()\n    }\n\n    private func handlePlayerSurfaceMounted() {\n        guard !isClosing, !playbackStarted else { return }\n        DiagnosticsLogger.shared.playback("PlayerUI", "persistent player surface mounted; engine activation begins in parallel orientationReady=\\(orientationReady)")\n        startPlaybackIfNeeded()\n    }\n'''),
              ('        beginOrientationTransition(to: target, reason: "initial", shouldStartPlayback: true)\n', '        beginOrientationTransition(to: target, reason: "initial", shouldStartPlayback: false)\n'),
              ('        guard !playbackStarted, !isClosing, orientationReady else { return }\n', '        guard !playbackStarted, !isClosing else { return }\n'),
              ('        DiagnosticsLogger.shared.playback("PlayerUI", "startup engine activation after mounted final-orientation surface")\n', '        DiagnosticsLogger.shared.playback("PlayerUI", "startup engine activation after persistent surface mount orientationReady=\\(orientationReady)")\n'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check
          grep -Fq 'playerUIAlreadyVisible=true' Sources/UI/PlayerScreen.swift
          grep -Fq 'engine activation begins in parallel' Sources/UI/PlayerScreen.swift
          grep -Fq 'guard !playbackStarted, !isClosing else' Sources/UI/PlayerScreen.swift
          ! grep -Fq 'if !orientationReady || isClosing' Sources/UI/PlayerScreen.swift

      - name: Commit exact startup patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources/UI/PlayerScreen.swift
          git commit -m 'perf: start playback UI and engine before orientation settles'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
