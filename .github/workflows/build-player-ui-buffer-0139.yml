name: Build OnePlayer 0.13.9 Buffer UI

on:
  push:
    branches: [feat/player-ui-buffer-0.13.9]
  pull_request:
    branches: [feat/playback-architecture-0.13.8]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Verify materialized player UI and settings surface
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'cacheByteRanges: controller.transportCacheRanges' Sources/UI/PlayerScreen.swift
          grep -q 'return "自动（高性能优先）"' Sources/Player/PlayerEngine.swift
          grep -q 'return "MDK高性能引擎"' Sources/Player/PlayerEngine.swift
          grep -q 'return "MPV高兼容引擎"' Sources/Player/PlayerEngine.swift
          if grep -q 'NavigationLink(destination: PlaybackLabView())' Sources/UI/OnePlayerSettingsViews.swift; then exit 1; fi

      - name: Select Xcode and tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodebuild -version
          swift --version

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build OnePlayer 0.13.9 Build76
        id: release_build
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Upload release build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.9-build76-release-diagnostics
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report release compiler failure
        if: steps.release_build.outcome == 'failure'
        run: |
          set -euo pipefail
          echo '===== compiler diagnostics ====='
          grep -nE '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|SwiftCompile|CompileSwift' build.log | tail -250 || true
          echo '===== final build tail ====='
          tail -120 build.log || true
          exit 1

      - name: Validate app identity
        id: app_identity
        continue-on-error: true
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.9' --build '76' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'AppIcon' --alternate-icon 'OnePlayerAltIcon' 2>&1 | tee app-validation.log

      - name: Audit minimum OS and embedded frameworks
        id: min_os_audit
        continue-on-error: true
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log 2>&1 | tee min-os-console.log

      - name: Upload app validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.9-build76-app-validation-diagnostics
          path: |
            app-validation.log
            min-os-report.log
            min-os-console.log
          if-no-files-found: warn
          retention-days: 7

      - name: Gate app validation
        if: steps.app_identity.outcome == 'failure' || steps.min_os_audit.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "app_identity=${{ steps.app_identity.outcome }}"
          echo "min_os_audit=${{ steps.min_os_audit.outcome }}"
          echo '===== app-validation.log ====='
          cat app-validation.log 2>/dev/null || true
          echo '===== min-os-console.log ====='
          cat min-os-console.log 2>/dev/null || true
          echo '===== min-os-report.log ====='
          cat min-os-report.log 2>/dev/null || true
          exit 1

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.9-build76-buffer-ui-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.9-build76-buffer-ui
          path: |
            OnePlayer-0.13.9-build76-buffer-ui-unsigned.ipa
            OnePlayer-0.13.9-build76-buffer-ui-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
          if-no-files-found: error
          retention-days: 14
