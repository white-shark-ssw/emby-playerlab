name: Build OnePlayer 0.13.9 Buffer UI

on:
  push:
    branches: [feat/player-ui-buffer-0.13.9]
  pull_request:
    branches: [feat/playback-architecture-0.13.8]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Materialize PlayerScreen timeline cache strip
        run: |
          set -euo pipefail
          python3 scripts/materialize_player_screen_0139.py
          git diff --check
          if ! git diff --quiet -- Sources/UI/PlayerScreen.swift; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Sources/UI/PlayerScreen.swift
            git commit -m 'Show transport cache strip in player timeline'
            git push origin HEAD:feat/player-ui-buffer-0.13.9
          fi

      - name: Verify formal settings surface
        run: |
          set -euo pipefail
          grep -q 'return "自动（高性能优先）"' Sources/Player/PlayerEngine.swift
          grep -q 'return "MDK高性能引擎"' Sources/Player/PlayerEngine.swift
          grep -q 'return "MPV高兼容引擎"' Sources/Player/PlayerEngine.swift
          if grep -q 'NavigationLink(destination: PlaybackLabView())' Sources/UI/OnePlayerSettingsViews.swift; then exit 1; fi
          grep -q 'cacheByteRanges: controller.transportCacheRanges' Sources/UI/PlayerScreen.swift

      - name: Select Xcode and tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodebuild -version
          swift --version

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build OnePlayer 0.13.9 Build76
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Validate app identity and minimum OS
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.9' --build '76' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.9-build76-buffer-ui-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.9-build76-buffer-ui
          path: |
            OnePlayer-0.13.9-build76-buffer-ui-unsigned.ipa
            OnePlayer-0.13.9-build76-buffer-ui-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
          if-no-files-found: error
          retention-days: 14
