name: TEMP Materialize Build269 Carousel Blur Diagnostic

on:
  push:
    branches: [diag/home-carousel-persistent-blur-build269]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/home-carousel-persistent-blur-build269
          fetch-depth: 0
      - name: Apply exact diagnostic delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/UI/EmbyHomeHeroV3.swift')
          s = p.read_text()
          old = '            .scaleEffect(1.12)\n            .blur(radius: 30)\n'
          new = '            .scaleEffect(1.12)\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected one persistent blur anchor, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/temp-build269-carousel-blur.yml').unlink()
          PY
          git diff --check
          test "$(grep -Fc '.blur(radius: 30)' Sources/UI/EmbyHomeHeroV3.swift)" -eq 0
          grep -Fq '.scaleEffect(1.12)' Sources/UI/EmbyHomeHeroV3.swift
          grep -Fq 'sourceVersion = "0.15.2"' Sources/Core/AppIdentity.swift
      - name: Commit exact product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add -A
          git commit -m 'Build269: isolate persistent backdrop blur cost'
          git push origin HEAD:diag/home-carousel-persistent-blur-build269
