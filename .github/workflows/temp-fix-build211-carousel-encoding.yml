name: One-shot Build283 Poster Navigation IPA

on:
  push:
    branches: [ci/poster-build283-navigation]
    paths:
      - ".github/workflows/temp-fix-build211-carousel-encoding.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 39014a03e2681aed3647bdd6d7d7b1c82b8cc4f6
          fetch-depth: 0

      - name: Guard exact Build283 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "39014a03e2681aed3647bdd6d7d7b1c82b8cc4f6"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_poster_grid_offmain_persistence.py
          git diff --check 531d7f53c55e1e3cff44069e9bce3193ac94749a..HEAD
          actual="$(git diff --name-only 531d7f53c55e1e3cff44069e9bce3193ac94749a..HEAD | sort)"
          expected="$(printf '%s\n' Sources/Core/AppIdentity.swift Sources/UI/EmbyServerBrowseV3.swift docs/changelog/CHANGELOG_v0_15_16_build283.md scripts/check_poster_grid_offmain_persistence.py | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::unexpected Build280->283 scope"
            printf 'actual:\n%s\nexpected:\n%s\n' "$actual" "$expected"
            exit 1
          fi

      - name: Export exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="OnePlayer-0.15.16-build283-39014a0-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" | tee "$SOURCE_ZIP.sha256"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Select Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate project and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            MARKETING_VERSION=0.15.16 \
            CURRENT_PROJECT_VERSION=283 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build.log

      - name: Validate and package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then echo '::error::Release app missing'; exit 1; fi
          /usr/bin/plutil -p "$APP_PATH/Info.plist" | tee built-info-plist.txt
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id com.embyplayerlab.app --version 0.15.16 --build 283 --display-name OnePlayer --minimum-os 15.0 --primary-icon OnePlayerIcon --alternate-icon OnePlayerAltIcon
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" 15.0 17.0 min-os-report.log build.log
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA_NAME="OnePlayer-0.15.16-Build283-PosterNavigation.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload Build283 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.15.16-build283-poster-navigation
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            built-info-plist.txt
            min-os-report.log
          if-no-files-found: error
          retention-days: 30
