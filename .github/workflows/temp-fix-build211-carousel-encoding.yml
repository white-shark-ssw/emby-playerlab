name: Sync Build284 Crossover Project State

on:
  push:
    branches:
      - docs/home-carousel-build284-crossover-20260902

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync docs to current main
        run: |
          set -euo pipefail
          cp .github/scripts/sync-build284-project-state.py /tmp/sync-build284-project-state.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B docs-sync origin/main
          python3 /tmp/sync-build284-project-state.py
          git diff --check
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/BUILD_TEST_INDEX.md
          git commit -m "Record Build284 crossover diagnostic baseline"
          git push origin HEAD:main
