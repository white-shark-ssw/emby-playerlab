name: One-shot Preserve Build211 Release Contract

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-fix-build211-carousel-encoding.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/home-carousel-acquisition-relative-build211
          fetch-depth: 0
          persist-credentials: true

      - name: Guard corrected Build211 source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3df8656ac6c3d816245aa1344dd733699f22dee0"

      - name: Preserve touch-down release authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/UI/EmbyHomeCarouselInteractionV3.swift')
          s = p.read_text()
          old = '''    func finishNativeCarouselDrag(_ translation: CGSize, predictedTranslation: CGSize?, width: CGFloat) {
        guard isCarouselDragging, let targetID = transitionToID else { return }
        suppressCarouselTap()
        let actualDistance = abs(translation.width)
        let expectedSign: CGFloat = transitionDirection > 0 ? -1 : 1
        let predictedDistance: CGFloat
        if let predictedTranslation, predictedTranslation.width == 0 || predictedTranslation.width * expectedSign > 0 { predictedDistance = abs(predictedTranslation.width) }
        else { predictedDistance = actualDistance }
        let actualProgress = min(1, max(0, actualDistance / max(1, width)))
        let shouldCommit = actualProgress >= 0.28 || max(actualDistance, predictedDistance) >= width * 0.48
        isCarouselDragging = false
        if shouldCommit { completeInteractiveTransition(to: targetID) }
        else { cancelInteractiveTransition() }
    }
'''
          new = '''    func finishNativeCarouselDrag(_ translation: CGSize, predictedTranslation: CGSize?, width: CGFloat) {
        suppressCarouselTap()
        let actualDistance = abs(translation.width)
        let releaseDirection = isCarouselDragging ? transitionDirection : (translation.width < 0 ? 1 : -1)
        let expectedSign: CGFloat = releaseDirection > 0 ? -1 : 1
        let predictedDistance: CGFloat
        if let predictedTranslation, predictedTranslation.width == 0 || predictedTranslation.width * expectedSign > 0 { predictedDistance = abs(predictedTranslation.width) }
        else { predictedDistance = actualDistance }
        let actualProgress = min(1, max(0, actualDistance / max(1, width)))
        let shouldCommit = actualProgress >= 0.28 || max(actualDistance, predictedDistance) >= width * 0.48
        if !isCarouselDragging {
            guard shouldCommit, let currentID = currentCarouselItemID, let targetID = neighborCarouselItemID(from: currentID, direction: releaseDirection) else { return }
            transitionFromID = currentID
            transitionToID = targetID
            transitionProgress = 0
            transitionDirection = releaseDirection
            completeInteractiveTransition(to: targetID)
            return
        }
        guard let targetID = transitionToID else { return }
        isCarouselDragging = false
        if shouldCommit { completeInteractiveTransition(to: targetID) }
        else { cancelInteractiveTransition() }
    }
'''
          if s.count(old) != 1:
              raise SystemExit(f'Build211 finish anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          c = Path('scripts/check_home_carousel_single_owner.py')
          check = c.read_text()
          anchor = "assert 'let shouldCommit = actualProgress >= 0.28 || max(actualDistance, predictedDistance) >= width * 0.48' in interaction\n"
          if check.count(anchor) != 1:
              raise SystemExit('Build211 contract anchor missing')
          extra = "assert 'let releaseDirection = isCarouselDragging ? transitionDirection : (translation.width < 0 ? 1 : -1)' in interaction\nassert 'if !isCarouselDragging {' in interaction\nassert 'guard shouldCommit, let currentID = currentCarouselItemID, let targetID = neighborCarouselItemID(from: currentID, direction: releaseDirection) else { return }' in interaction\n"
          c.write_text(check.replace(anchor, anchor + extra, 1))
          PY
          python3 scripts/check_home_carousel_single_owner.py
          python3 -m py_compile scripts/check_home_carousel_single_owner.py
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {'Sources/UI/EmbyHomeCarouselInteractionV3.swift', 'scripts/check_home_carousel_single_owner.py'}
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed != expected: raise SystemExit(f'Unexpected Build211 release patch files: {sorted(changed)}')
          PY

      - name: Commit Build211 release preservation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/UI/EmbyHomeCarouselInteractionV3.swift scripts/check_home_carousel_single_owner.py
          git commit -m "Preserve Build211 touch-down release authority"
          git push origin HEAD:perf/home-carousel-acquisition-relative-build211
