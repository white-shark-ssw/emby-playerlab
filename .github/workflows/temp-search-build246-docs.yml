name: Temp Search Build246 Docs

on:
  push:
    branches: ["feat/search-page-optimization"]
    paths:
      - ".github/search-build246-docs-trigger.txt"

permissions:
  contents: write

jobs:
  branch-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-page-optimization
          fetch-depth: 0
      - run: |
          set -euo pipefail
          python3 .github/search-build246-docs.py branch
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add docs/project/current/dev/DEV-search-page-optimization.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Search Build246 CI evidence"
            git push origin HEAD:feat/search-page-optimization
          fi

  main-docs:
    needs: branch-checkpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          set -euo pipefail
          git fetch origin feat/search-page-optimization
          git show origin/feat/search-page-optimization:docs/project/current/dev/DEV-search-page-optimization.md > docs/project/current/dev/DEV-search-page-optimization.md
          git show origin/feat/search-page-optimization:.github/search-build246-docs.py > /tmp/search-build246-docs.py
          python3 /tmp/search-build246-docs.py main
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add docs/project/PROJECT_STATE.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/TECHNICAL_DECISIONS.md docs/project/current/dev/DEV-search-page-optimization.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Search Build245 device result and Build246 evidence"
            git push origin HEAD:main
          fi
