name: Build OnePlayer 0.13.83 Build150 Enhancement Toggle

on:
  workflow_dispatch:
  push:
    branches: [fix/enhancement-toggle-stall-0.13.83]
    paths:
      - "Sources/**"
      - "project.mdklab.yml"
      - "Podfile"
      - ".github/workflows/build150-enhancement-toggle.yml"
  pull_request:
    branches: [fix/adaptive-video-enhancement-0.13.82]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build150-enhancement-toggle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout Build150 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Build150 toggle contracts
        run: |
          set -euo pipefail
          grep -Fq 'sourceVersion = "0.13.83"' Sources/Core/AppIdentity.swift
          python3 - <<'PY'
          from pathlib import Path
          mpv = Path('Sources/Player/MPVPlayerEngine.swift').read_text()
          required = [
              'lastPresentationTimingSignature',
              'phase=enhancement-only',
              'setPropertyIfChanged(handle: handle, name: "scale"',
              'setPropertyIfChanged(handle: handle, name: "cscale"',
              'setPropertyIfChanged(handle: handle, name: "deband"',
              'setPropertyIfChanged(handle: handle, name: "sigmoid-upscaling"',
              'gpu-shader-cache',
              'gpu-shader-cache-dir',
              'preserve_mixing_cache=yes',
          ]
          for item in required:
              assert item in mpv, item
          seek_start = mpv.index('    func seek(to seconds: Double, direction: SeekDirection)')
          seek_end = mpv.index('\n    private func claimKeyframeLookupIndex()', seek_start)
          seek_body = mpv[seek_start:seek_end]
          assert seek_body.count('self.command(handle, ["seek"') == 1
          assert 'absolute+keyframes' in seek_body
          assert 'absolute+exact' not in seek_body
          coordinator = Path('Sources/Player/PlaybackPresentationCoordinator.swift').read_text()
          for item in ['if rate > 2.0 { return [] }', 'if rate > 1.5 { return [.deband] }', 'if rate > 1.05 { return [.deband, .chroma] }', 'return resolvedFullEnhancementFeatures()']:
              assert item in coordinator, item
          PY
          git fetch origin fix/adaptive-video-enhancement-0.13.82 --depth=1
          test -z "$(git diff --name-only origin/fix/adaptive-video-enhancement-0.13.82...HEAD -- Sources/Transport MDKLab Sources/Player/KSAVIOPlayerEngine.swift Sources/Player/PlaybackPresentationAdapters.swift Sources/Player/PlaybackPresentationCoordinator.swift)"
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          git diff --check

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Build150 Release
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.83 CURRENT_PROJECT_VERSION=150 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.83' --build '150' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.83-build150-enhancement-toggle-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build150 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.83-build150-enhancement-toggle
          path: |
            OnePlayer-0.13.83-build150-enhancement-toggle-unsigned.ipa
            OnePlayer-0.13.83-build150-enhancement-toggle-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build150 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.83-build150-enhancement-toggle-failure
          path: |
            build.log
            package-resolution.log
            app-validation.log
            min-os-report.log
          if-no-files-found: ignore
          retention-days: 14
