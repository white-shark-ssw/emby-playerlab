name: Temp Apply Cache Settings V1

on:
  push:
    branches:
      - feat/cache-management-v1
    paths:
      - .github/workflows/temp-apply-cache-settings-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cache-management-v1
          fetch-depth: 0
      - name: Apply exact source edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}")
              p.write_text(text.replace(old, new, count))

          replace(
              "Sources/UI/AppShellView.swift",
              'NavigationLink(destination: PlaceholderSettingsView(title: "缓存")) { settingsRow("缓存", systemImage: "externaldrive") }',
              'NavigationLink(destination: CacheSettingsView()) { settingsRow("缓存", systemImage: "externaldrive") }'
          )

          replace(
              "Sources/UI/EmbyServerBrowseV3.swift",
              'NavigationLink(destination: PlayerSettingsView()) { settingRow("播放设置", value: nil, systemImage: "playpause") }\n                        Divider().padding(.leading, 46)\n                        NavigationLink(destination: PlaybackLabView()) { settingRow("播放器实验室", value: nil, systemImage: "wrench.and.screwdriver") }',
              'NavigationLink(destination: PlayerSettingsView()) { settingRow("播放设置", value: nil, systemImage: "playpause") }\n                        Divider().padding(.leading, 46)\n                        NavigationLink(destination: CacheSettingsView()) { settingRow("缓存管理", value: nil, systemImage: "externaldrive") }\n                        Divider().padding(.leading, 46)\n                        NavigationLink(destination: PlaybackLabView()) { settingRow("播放器实验室", value: nil, systemImage: "wrench.and.screwdriver") }'
          )

          replace(
              "Sources/UI/EmbyMediaDetailView.swift",
              '''                ZStack {\n                    EmbyDetailRemoteImage(url: client.imageURL(itemId: episode.preferredPrimaryImageItemId, maxWidth: 620, tag: episode.preferredPrimaryImageTag), contentMode: .fill)\n                        .frame(width: 174, height: 98)\n                        .clipped()\n                    if episode.playbackProgress > 0 {\n                        VStack { Spacer(); GeometryReader { proxy in Rectangle().fill(Color.blue).frame(width: proxy.size.width * episode.playbackProgress, height: 3) } }\n                    }\n                }''',
              '''                EmbyDetailRemoteImage(url: client.imageURL(itemId: episode.preferredPrimaryImageItemId, maxWidth: 620, tag: episode.preferredPrimaryImageTag), contentMode: .fill)\n                    .frame(width: 174, height: 98)\n                    .clipped()'''
          )

          shared = Path("Sources/UI/EmbySharedImageAndNavigation.swift")
          text = shared.read_text()
          old_load = '''        if let cached = EmbyImageMemoryCache.shared.object(forKey: url as NSURL) {\n            image = cached\n            isLoading = false\n            return\n        }\n        image = nil\n        isLoading = true\n        task = Task { [weak self] in\n            do {\n                let (data, _) = try await URLSession.shared.data(from: url)\n                guard !Task.isCancelled else { return }\n                let loaded = await Task.detached(priority: .utility) { EmbyImageDecoder.decode(data: data, url: url) }.value\n                guard !Task.isCancelled, let loaded else { return }\n                EmbyImageMemoryCache.shared.setObject(loaded, forKey: url as NSURL)\n                await MainActor.run {'''
          new_load = '''        image = nil\n        isLoading = true\n        task = Task { [weak self] in\n            do {\n                var data = await EmbyImageDiskCache.shared.data(for: url)\n                if let cachedData = data {\n                    let cachedImage = await Task.detached(priority: .utility) { EmbyImageDecoder.decode(data: cachedData, url: url) }.value\n                    if let cachedImage {\n                        guard !Task.isCancelled else { return }\n                        await MainActor.run {\n                            guard self?.currentURL == url else { return }\n                            self?.image = cachedImage\n                            self?.isLoading = false\n                        }\n                        return\n                    }\n                    await EmbyImageDiskCache.shared.remove(url)\n                    data = nil\n                }\n\n                if data == nil {\n                    let response = try await URLSession.shared.data(from: url)\n                    data = response.0\n                    await EmbyImageDiskCache.shared.store(response.0, for: url)\n                }\n                guard !Task.isCancelled, let data else { return }\n                let loaded = await Task.detached(priority: .utility) { EmbyImageDecoder.decode(data: data, url: url) }.value\n                guard !Task.isCancelled, let loaded else { return }\n                await MainActor.run {'''
          if text.count(old_load) != 1:
              raise SystemExit(f"shared loader: expected 1 match, found {text.count(old_load)}")
          text = text.replace(old_load, new_load, 1)
          old_cache = '''private final class EmbyImageMemoryCache {\n    static let shared = EmbyImageMemoryCache()\n    private let cache = NSCache<NSURL, UIImage>()\n\n    private init() {\n        cache.countLimit = 420\n        cache.totalCostLimit = 180 * 1024 * 1024\n    }\n\n    func object(forKey key: NSURL) -> UIImage? { cache.object(forKey: key) }\n\n    func setObject(_ image: UIImage, forKey key: NSURL) {\n        let cost = Int(image.size.width * image.size.height * image.scale * image.scale * 4)\n        cache.setObject(image, forKey: key, cost: cost)\n    }\n}\n\n'''
          if text.count(old_cache) != 1:
              raise SystemExit(f"shared memory cache: expected 1 match, found {text.count(old_cache)}")
          shared.write_text(text.replace(old_cache, "", 1))

          replace(
              "Sources/Transport/UnifiedMediaTransportSession.swift",
              '''            if store == nil {\n                let cache = try DownloadFirstSparseStore(\n                    cacheKey: "unified-v1-\\(source.itemId)-\\(source.mediaSource.id)",''',
              '''            if store == nil {\n                let cacheKey = TransportCacheMaintenance.stableVideoCacheKey(for: source)\n                if configuration.keepLastCache { TransportCacheMaintenance.preparePersistentVideoCache(cacheKey: cacheKey) }\n                else { TransportCacheMaintenance.clearPersistentUnifiedVideoCaches() }\n                let cache = try DownloadFirstSparseStore(\n                    cacheKey: cacheKey,'''
          )
          PY

          rm -f .github/workflows/temp-apply-cache-settings-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire cache settings into transport"
          git push origin HEAD:feat/cache-management-v1
