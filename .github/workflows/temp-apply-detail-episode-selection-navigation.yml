name: Apply detail episode selection navigation patch

on:
  push:
    branches: [feat/detail-episode-selection-navigation]
    paths:
      - ".github/workflows/temp-apply-detail-episode-selection-navigation.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/detail-episode-selection-navigation
          fetch-depth: 0
      - name: Apply exact source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Sources/UI/EmbyMediaDetailView.swift')
          text = path.read_text()

          replacements = [
              (
                  '        .fullScreenCover(item: $model.selectedSource) { source in PlayerScreen(source: source, client: client, preference: .automatic) }\n    }\n\n    private func hero(width: CGFloat, viewportHeight: CGFloat, rawScrollMinY: CGFloat) -> some View {',
                  '        .fullScreenCover(item: detailPlaybackSourceBinding) { source in PlayerScreen(source: source, client: client, preference: .automatic) }\n    }\n\n    private var detailPlaybackSourceBinding: Binding<ResolvedPlaybackSource?> {\n        Binding(get: { showAllEpisodes ? nil : model.selectedSource }, set: { model.selectedSource = $0 })\n    }\n\n    private func hero(width: CGFloat, viewportHeight: CGFloat, rawScrollMinY: CGFloat) -> some View {'
              ),
              (
                  '                }\n                .padding(.horizontal, 20)\n\n                ScrollView(.horizontal, showsIndicators: false) {\n                    LazyHStack(alignment: .top, spacing: 12) {\n                        ForEach(model.selectedSeasonEpisodes) { episode in episodePreviewCard(episode).id(episode.id) }',
                  '                }\n                .padding(.horizontal, 20)\n\n                Text(model.selectedEpisodeSelectionSummary ?? " ")\n                    .font(.system(size: 12, weight: .medium))\n                    .foregroundColor(.secondary.opacity(0.86))\n                    .lineLimit(1)\n                    .truncationMode(.tail)\n                    .frame(height: 16, alignment: .leading)\n                    .padding(.horizontal, 20)\n                    .opacity(model.selectedEpisodeSelectionSummary == nil ? 0 : 1)\n\n                ScrollView(.horizontal, showsIndicators: false) {\n                    LazyHStack(alignment: .top, spacing: 12) {\n                        ForEach(model.selectedSeasonEpisodes) { episode in episodePreviewCard(episode).id(episode.id) }'
              ),
              (
                  '        return Button { model.selectEpisode(episode); Task { await model.play(episode) } } label: {',
                  '        return Button { model.selectEpisode(episode) } label: {'
              ),
              (
                  '    var visiblePeople: [EmbyPerson] { Array(item.people.prefix(24)) }',
                  '    var selectedEpisodeSelectionSummary: String? {\n        guard let selectedEpisodeID, let episode = episodes.first(where: { $0.id == selectedEpisodeID }) else { return nil }\n        let trimmed = episode.name.trimmingCharacters(in: .whitespacesAndNewlines)\n        let number = episode.indexNumber ?? selectedSeasonEpisodes.firstIndex(where: { $0.id == episode.id }).map { $0 + 1 }\n        guard let number, number > 0 else { return trimmed.isEmpty ? nil : trimmed }\n        if trimmed.isEmpty || isGenericEpisodeName(trimmed, number: number) { return "第 \\(number) 集" }\n        return "第 \\(number) 集 · \\(trimmed)"\n    }\n\n    var visiblePeople: [EmbyPerson] { Array(item.people.prefix(24)) }'
              ),
              (
                  '    func selectEpisode(_ episode: LibraryItem) { selectedEpisodeID = episode.id }',
                  '    func selectEpisode(_ episode: LibraryItem) {\n        selectedEpisodeID = episode.id\n        if let offset = selectedSeasonEpisodes.firstIndex(where: { $0.id == episode.id }) { selectedEpisodeRangeOffset = (offset / 10) * 10 }\n    }'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one source match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- Sources/UI/EmbyMediaDetailView.swift
      - name: Commit source patch
        run: |
          git config user.name "OnePlayer CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources/UI/EmbyMediaDetailView.swift
          git commit -m "Refine detail episode selection interaction"
          git push origin HEAD:feat/detail-episode-selection-navigation
