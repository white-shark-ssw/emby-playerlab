name: Build232 Carousel Start-Step Diagnostics IPA

on:
  push:
    branches: [diag/home-carousel-start-step-diagnostics-build232]
    paths:
      - ".github/build232-carousel-start-step-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build232 branch
        uses: actions/checkout@v4
        with:
          ref: diag/home-carousel-start-step-diagnostics-build232
          fetch-depth: 0

      - name: Validate exact Build232 diagnostic scope and retained contracts
        run: |
          set -euo pipefail
          base='40a2e26fa16becb6830b400a030e4882300788d4'
          git diff --check "$base"...HEAD
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = '40a2e26fa16becb6830b400a030e4882300788d4'
          allowed = {
              '.github/build232-carousel-start-step-trigger.txt',
              '.github/workflows/temp-build232-carousel-start-step-diagnostics.yml',
              'Sources/Core/AppIdentity.swift',
              'Sources/UI/EmbyHomeCarouselInteractionV3.swift',
              'Sources/UI/EmbyHomeCarouselCadenceDiagnosticsV3.swift',
              'docs/changelog/CHANGELOG_v0_14_65_build232.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', f'{base}...HEAD'], text=True).splitlines())
          extra = sorted(changed - allowed)
          if extra: raise SystemExit(f'Unexpected Build232 files: {extra}')
          required = {'Sources/Core/AppIdentity.swift', 'Sources/UI/EmbyHomeCarouselInteractionV3.swift', 'Sources/UI/EmbyHomeCarouselCadenceDiagnosticsV3.swift', 'docs/changelog/CHANGELOG_v0_14_65_build232.md'}
          missing = sorted(required - changed)
          if missing: raise SystemExit(f'Missing Build232 files: {missing}')
          frozen_prefixes = ('Sources/Player/', 'Sources/Transport/', 'Sources/Cache/', 'Sources/Session/', 'Sources/AVIO/')
          touched_frozen = sorted(path for path in changed if path.startswith(frozen_prefixes))
          if touched_frozen: raise SystemExit(f'Build232 touched Frozen/P0 paths: {touched_frozen}')

          identity = Path('Sources/Core/AppIdentity.swift').read_text()
          assert 'sourceVersion = "0.14.65"' in identity
          interaction = Path('Sources/UI/EmbyHomeCarouselInteractionV3.swift').read_text()
          assert 'touchDownTimestamp = touch.timestamp' in interaction
          assert 'recordFirstRender(translation: renderedTranslation.width, totalTranslation: translation.width, touchTimestamp: touch.timestamp)' in interaction
          assert 'horizontalAcquisitionTranslation = translation.width' in interaction
          assert 'return CGSize(width: translation.width - acquisitionTranslation, height: 0)' in interaction
          assert 'actualProgress >= 0.28' in interaction
          assert 'width * 0.48' in interaction
          assert 'V3HomeCarouselCadenceDiagnostics.shared.end(reason: "ended")' not in interaction
          cadence = Path('Sources/UI/EmbyHomeCarouselCadenceDiagnosticsV3.swift').read_text()
          for token in ('touch_down_to_acquire_ms=', 'acquire_to_first_render_ms=', 'first_render_x=', 'first_total_x='):
              assert token in cadence
          assert 'link.preferredFrameRateRange = CAFrameRateRange(minimum: requested, maximum: requested, preferred: requested)' in cadence
          hero = Path('Sources/UI/EmbyHomeHeroV3.swift').read_text()
          assert hero.count('.compositingGroup()') == 1
          assert 'ForEach(carouselHeroResidentItems) { item in\n                carouselHeroArtwork' in hero
          assert 'if let item = currentCarouselItem {\n                carouselPersistentImage(item: item, size: size).opacity(carouselOpacity(for: item.id))' in hero
          assert 'if let item = transitionTargetCarouselItem {' in hero
          state = Path('Sources/UI/EmbyHomeCarouselStateV3.swift').read_text()
          assert 'V3HomeCarouselCadenceDiagnostics.shared.end(reason: "settled")' in state
          assert 'V3HomeCarouselCadenceDiagnostics.shared.end(reason: "cancelled-settled")' in state
          assert 'UIScreen.main.scale' not in state
          print('Build232 diagnostic scope/contracts: PASS')
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Prepare OnePlayer app icons
        run: python3 scripts/generate_oneplayer_icons.py

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache | tee package-resolution.log

      - name: Build Release
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            MARKETING_VERSION=0.14.65 \
            CURRENT_PROJECT_VERSION=232 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build232.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id com.embyplayerlab.app --version 0.14.65 --build 232 --display-name OnePlayer --minimum-os 15.0 --primary-icon OnePlayerIcon --alternate-icon OnePlayerAltIcon

      - name: Validate MinOS
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" 15.0 17.0 build232-min-os.log build232.log

      - name: Package unsigned IPA and source snapshot
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA="OnePlayer-0.14.65-build232-start-step-diagnostics-unsigned.ipa"
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA"
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          SOURCE="OnePlayer-0.14.65-build232-source.zip"
          git archive --format=zip --output "$SOURCE" HEAD
          shasum -a 256 "$SOURCE" | tee "$SOURCE.sha256"
          git rev-parse HEAD | tee build232-source-sha.txt
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"

      - name: Upload Build232 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.65-build232-start-step-diagnostics
          path: |
            ${{ env.IPA }}
            ${{ env.IPA }}.sha256
            ${{ env.SOURCE }}
            ${{ env.SOURCE }}.sha256
            build232-source-sha.txt
            build232.log
            build232-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30
