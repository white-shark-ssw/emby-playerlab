name: Temp Search Build255 Docs

on:
  push:
    branches: ["feat/search-page-optimization"]
    paths:
      - ".github/search-build255-docs-trigger.txt"

permissions:
  contents: write

jobs:
  branch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-page-optimization
          fetch-depth: 0
      - name: Record Build255 branch evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/project/current/dev/DEV-search-page-optimization.md')
          text = p.read_text()
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('- Status:'):
                  lines[i] = '- Status: Active — Build254 target-device rejected for append twitch; Build255 CI/IPA verified, target-device validation pending'
                  break
          insert_after = '- Build254 IPA SHA-256: `7714f225b55a4c93e96aa35951820d43e6be33fa911e14ff378755ac23884130`'
          build255_lines = [
              '- Build255 exact product source: `99af35f86229ca5fb0cf9699fb41ef1bf5c754d2`',
              '- Build255 identity: **OnePlayer 0.14.88 / Build255**',
              '- Build255 run/job: `33270048487 / 99146794862` — success',
              '- Build255 artifact: `OnePlayer-0.14.88-Build255-Search`, ID `9719867060`, digest `sha256:a39fcdd34b8016f35ac8e952740879cc0e43e2373437a7e3bd2e8d02d1de1a1f`',
              '- Build255 IPA SHA-256: `2dbc76a146d4716eee0965c6861823e0df5592324812584fe261a30afb98019e`',
          ]
          if build255_lines[0] not in lines:
              idx = lines.index(insert_after) + 1
              lines[idx:idx] = build255_lines
          text = '\n'.join(lines).rstrip() + '\n'
          marker = '## Build255 CI / IPA evidence — 2026-08-30'
          if marker not in text:
              text += f'''\n{marker}\n\nExact product source `99af35f86229ca5fb0cf9699fb41ef1bf5c754d2` changes only the Search landing section owner from outer `LazyVStack` to `VStack`. The dynamically growing poster collection remains the existing inner `EmbyPosterGrid`/`LazyVGrid`; the Build254 last-card +6 trigger, `ExcludeItemIds` duplicate exclusion, accepted Movie/Series recommendation request, image caches/pins and Build248 Dock/keyboard behavior are unchanged. No shared poster-grid, Player, MPV, Transport, playback Session Cache, Resume/progress, PiP or Deployment Target code changed.\n\nDedicated Xcode 16.4 Release run/job `33270048487 / 99146794862` passed source validation, MPVKit resolution, Release build, identity verification, IPA packaging/integrity and artifact upload. Artifact `9719867060`, digest `sha256:a39fcdd34b8016f35ac8e952740879cc0e43e2373437a7e3bd2e8d02d1de1a1f`; independently verified IPA SHA-256 `2dbc76a146d4716eee0965c6861823e0df5592324812584fe261a30afb98019e`; bundle `com.embyplayerlab.app`; version `0.14.88 (255)`; `MinimumOSVersion=15.0`. Evidence: **Code written ✅ / CI passed ✅ / IPA produced+verified ✅ / Build255 target-device tested ❌ / stable/frozen ❌**.\n\n## Next exact action\n\nTarget-device test Build255 on iPhone 15 Pro Max / iOS 17.0. Repeatedly scroll through the initial 9 recommendations into successive +6 appends and verify the visible Search container/viewport no longer twitches or jumps while load-more still continues and displayed IDs remain non-duplicate.\n'''
          p.write_text(text.rstrip() + '\n')

          c = Path('docs/changelog/CHANGELOG_v0_14_88_build255.md')
          text = c.read_text()
          text = text.replace('Evidence pending dedicated Xcode 16.4 Release CI/IPA and target-device validation.', 'Dedicated Xcode 16.4 Release CI/IPA passed for exact product source `99af35f86229ca5fb0cf9699fb41ef1bf5c754d2` (run `33270048487`, artifact `9719867060`, IPA SHA-256 `2dbc76a146d4716eee0965c6861823e0df5592324812584fe261a30afb98019e`, MinOS 15.0). Target-device validation remains pending.')
          c.write_text(text.rstrip() + '\n')
          PY
          git diff --check
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add docs/project/current/dev/DEV-search-page-optimization.md docs/changelog/CHANGELOG_v0_14_88_build255.md
          git commit -m "Record Search Build255 CI evidence"
          git push origin HEAD:feat/search-page-optimization

  main-docs:
    runs-on: ubuntu-latest
    needs: branch-docs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync Build254 real-device result and Build255 evidence
        run: |
          set -euo pipefail
          git fetch origin feat/search-page-optimization
          git show origin/feat/search-page-optimization:docs/project/current/dev/DEV-search-page-optimization.md > docs/project/current/dev/DEV-search-page-optimization.md
          python3 - <<'PY'
          from pathlib import Path
          import re

          module = Path('docs/project/MODULE_STATUS.md')
          lines = module.read_text().splitlines()
          found = False
          for i, line in enumerate(lines):
              if line.startswith('| Search page / multi-Emby search |'):
                  lines[i] = '| Search page / multi-Emby search | **Active — Build254 append twitch target-device rejected; Build255 CI/IPA verified, target-device pending** | Build248 Dock/keyboard behavior and Build253 recommendation semantics remain target-device accepted. Build254 incremental +6 loading works but target-device testing found visible container twitch on append, so it is rejected as final. Build255 / 0.14.88 exact source `99af35f86229ca5fb0cf9699fb41ef1bf5c754d2` changes only Search landing outer `LazyVStack` to `VStack`, matching the established paginated poster-page ownership while retaining inner lazy `EmbyPosterGrid`, +6 trigger and duplicate exclusion. Run/job `33270048487 / 99146794862` passed; artifact `9719867060`; IPA SHA-256 `2dbc76a146d4716eee0965c6861823e0df5592324812584fe261a30afb98019e`; MinOS 15.0. Build255 target-device validation pending; not stable. |'
                  found = True
              elif line.startswith('| Other product modules |'):
                  lines[i] = re.sub(r'Search Build\d+', 'Search Build255', line)
          if not found:
              raise SystemExit('Search module row not found')
          module.write_text('\n'.join(lines).rstrip() + '\n')

          state = Path('docs/project/PROJECT_STATE.md')
          text = state.read_text().rstrip()
          marker = '## Search Build254 target-device twitch → Build255 layout-owner correction — 2026-08-30'
          if marker not in text:
              text += f'''\n\n{marker}\n\nBuild254 / 0.14.87 is target-device tested on iPhone 15 Pro Max / iOS 17.0. Incremental +6 recommendation loading and the accepted Movie/Series data contract work, but the user reports the Search recommendation container visibly twitches when a new batch appends. Build254 is therefore rejected as the final incremental-loading candidate and is not stable.\n\nSource inspection found Search landing wrapped the dynamically growing `EmbyPosterGrid` in an additional outer `LazyVStack`. The existing paginated poster page already uses a normal `VStack` around `EmbyPosterGrid`. Build255 / 0.14.88 exact source `99af35f86229ca5fb0cf9699fb41ef1bf5c754d2` makes only that layout-owner correction: outer Search `LazyVStack` → `VStack`; inner poster grid remains lazy and the accepted +6 trigger/data/cache behavior is unchanged.\n\nXcode 16.4 Release run/job `33270048487 / 99146794862` passed. Artifact `9719867060`, digest `sha256:a39fcdd34b8016f35ac8e952740879cc0e43e2373437a7e3bd2e8d02d1de1a1f`; IPA SHA-256 `2dbc76a146d4716eee0965c6861823e0df5592324812584fe261a30afb98019e`; `com.embyplayerlab.app`; `0.14.88 (255)`; MinOS 15.0; IPA integrity passed. Evidence: **Build254 real-device tested ✅ / Build254 append smoothness rejected ❌ / Build255 Code written ✅ / CI passed ✅ / IPA produced+verified ✅ / Build255 target-device pending / not stable**.\n'''
          state.write_text(text.rstrip() + '\n')

          decisions = Path('docs/project/TECHNICAL_DECISIONS.md')
          text = decisions.read_text().rstrip()
          marker = '## Search dynamic poster growth keeps a non-lazy section owner — Build255'
          if marker not in text:
              text += f'''\n\n{marker}\n\n- Search landing must not add an outer `LazyVStack` around its dynamically growing `EmbyPosterGrid`. The poster grid itself remains the lazy owner.\n- Build254 target-device evidence showed visible container twitch when +6 recommendations appended with nested lazy ownership.\n- Build255 follows the established paginated poster-page pattern: normal outer `VStack` + inner lazy `EmbyPosterGrid`. This is a layout-ownership correction only; no timer, scroll-offset compensation, retry/fallback, second cache or shared grid fork is introduced.\n'''
          decisions.write_text(text.rstrip() + '\n')

          index = Path('docs/project/BUILD_TEST_INDEX.md')
          text = index.read_text().rstrip()
          marker = '### Build255 / 0.14.88 — Search append-layout stability candidate'
          if marker not in text:
              text += f'''\n\n{marker}\n\n- Build254 target-device result: incremental +6 recommendation loading works, but the Search recommendation container visibly twitches during append; Build254 rejected as final and not stable.\n- exact Build255 product source: `99af35f86229ca5fb0cf9699fb41ef1bf5c754d2`.\n- runtime delta from Build254: Search landing outer `LazyVStack` → `VStack` only; inner `EmbyPosterGrid` remains lazy and the +6/`ExcludeItemIds` logic is unchanged.\n- run/job: `33270048487 / 99146794862` — success.\n- artifact: `OnePlayer-0.14.88-Build255-Search`, ID `9719867060`, digest `sha256:a39fcdd34b8016f35ac8e952740879cc0e43e2373437a7e3bd2e8d02d1de1a1f`.\n- IPA SHA-256: `2dbc76a146d4716eee0965c6861823e0df5592324812584fe261a30afb98019e`.\n- package: `com.embyplayerlab.app`, `0.14.88 (255)`, `MinimumOSVersion=15.0`, IPA integrity passed.\n- evidence: **Code written ✅ / CI passed ✅ / IPA produced+verified ✅ / Build255 target-device pending / not stable.**\n'''
          index.write_text(text.rstrip() + '\n')
          PY
          git diff --check
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add docs/project/current/dev/DEV-search-page-optimization.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/BUILD_TEST_INDEX.md
          git commit -m "Record Search Build254 device result and Build255 evidence"
          git push origin HEAD:main
