name: Materialize OnePlayer 0.13.17 Recovery Isolation

on:
  push:
    branches:
      - feat/recovery-isolation-0.13.17

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize architecture
        run: |
          python3 scripts/materialize_recovery_isolation_01317.py
          python3 scripts/finalize_recovery_isolation_01317.py
      - name: Commit materialized sources
        run: |
          if git diff --quiet; then
            echo "Already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Transport/UnifiedMediaTransportSession.swift Sources/Transport/TransportHTTPServer.swift Sources/Player/PlaybackOrchestrator.swift Sources/Player/PlayerController.swift MDKLab/App/MDKKSAVIOPlayerEngine.swift project.mdklab.yml
          git commit -m "Materialize Build84 recovery isolation architecture"
          git push origin HEAD:feat/recovery-isolation-0.13.17
