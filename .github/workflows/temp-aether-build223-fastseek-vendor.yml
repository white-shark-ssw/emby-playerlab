name: Patch Aether Vendor For Build223 Fast Seek

on:
  push:
    branches: [feat/aether-multi-engine-comparison]
    paths:
      - .github/workflows/temp-aether-build223-fastseek-vendor.yml

permissions:
  contents: write

jobs:
  patch-vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vendor/aetherengine-oneplayer-6.50.0
          fetch-depth: 0
      - name: Add bounded programmatic seek tolerance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly 1 match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          host = "Sources/AetherEngine/Native/NativeAVPlayerHost.swift"
          engine = "Sources/AetherEngine/AetherEngine.swift"

          replace_once(
              host,
              """    func seek(to seconds: Double) async {\n        _ = await seek(to: seconds, deadlineSeconds: nil)\n    }""",
              """    func seek(to seconds: Double, toleranceSeconds: Double = 0) async {\n        _ = await seek(to: seconds, deadlineSeconds: nil, toleranceSeconds: toleranceSeconds)\n    }"""
          )
          replace_once(
              host,
              """    func seek(to seconds: Double, deadlineSeconds: Double?) async -> Bool {\n        let target = CMTime(seconds: seconds, preferredTimescale: 600)""",
              """    func seek(to seconds: Double, deadlineSeconds: Double?, toleranceSeconds: Double = 0) async -> Bool {\n        let target = CMTime(seconds: seconds, preferredTimescale: 600)\n        let tolerance = CMTime(seconds: max(0, toleranceSeconds), preferredTimescale: 600)"""
          )
          replace_once(
              host,
              """            // Zero tolerances: unbounded tolerances caused AVPlayer to land on arbitrary sync samples for loopback HLS-fMP4 (openradar 44904505).\n            avPlayer.seek(to: target, toleranceBefore: .zero, toleranceAfter: .zero) { [weak self] _ in""",
              """            // Exact remains the default. A caller may opt into a finite bounded tolerance for latency-sensitive seeks; never use unbounded tolerances because AVPlayer can land on arbitrary sync samples for loopback HLS-fMP4 (openradar 44904505).\n            avPlayer.seek(to: target, toleranceBefore: tolerance, toleranceAfter: tolerance) { [weak self] _ in"""
          )

          replace_once(
              engine,
              """    public func seek(to seconds: Double) async {""",
              """    public func seek(to seconds: Double, toleranceSeconds: Double = 0) async {"""
          )
          replace_once(
              engine,
              """            await nativeHost?.seek(to: clockTarget)\n            guard loadGeneration == loadGen, seekGeneration == seekGen else { return }""",
              """            await nativeHost?.seek(to: clockTarget, toleranceSeconds: toleranceSeconds)\n            guard loadGeneration == loadGen, seekGeneration == seekGen else { return }"""
          )
          replace_once(
              engine,
              """            var landed = await nativeHost?.seek(to: clockTarget,\n                                                deadlineSeconds: Self.nativeSeekReconcileBudgetSeconds) ?? true""",
              """            var landed = await nativeHost?.seek(to: clockTarget,\n                                                deadlineSeconds: Self.nativeSeekReconcileBudgetSeconds,\n                                                toleranceSeconds: toleranceSeconds) ?? true"""
          )
          replace_once(
              engine,
              """                    landed = await host.seek(to: clockTarget,\n                                             deadlineSeconds: Self.nativeSeekExtensionBudgetSeconds)""",
              """                    landed = await host.seek(to: clockTarget,\n                                             deadlineSeconds: Self.nativeSeekExtensionBudgetSeconds,\n                                             toleranceSeconds: toleranceSeconds)"""
          )
          PY
          git diff --check
          git diff -- Sources/AetherEngine/AetherEngine.swift Sources/AetherEngine/Native/NativeAVPlayerHost.swift
      - name: Commit vendor patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/AetherEngine/AetherEngine.swift Sources/AetherEngine/Native/NativeAVPlayerHost.swift
          git commit -m "Add bounded programmatic seek tolerance"
          git push origin HEAD:vendor/aetherengine-oneplayer-6.50.0
