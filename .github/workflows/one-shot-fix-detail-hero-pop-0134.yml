name: One-shot detail hero and pop visual fix

on:
  push:
    branches: [fix/detail-hero-pop-0134]

permissions:
  contents: write

concurrency:
  group: one-shot-detail-hero-pop-0134
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[detail-hero-pop-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted detail and navigation visual fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          def replace_between(text: str, start: str, end: str, replacement: str, label: str) -> str:
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"{label}: start marker not found")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"{label}: end marker not found")
              return text[:start_index] + replacement + text[end_index:]

          # 1) Detail Hero: one clear image, native ScrollView elasticity, no internal blurred duplicate.
          path = Path("Sources/UI/EmbyMediaDetailView.swift")
          text = path.read_text()
          text = replace_once(text, "    @State private var heroImageSize: CGSize?\n", "", "remove hero image size state")

          hero = '''    private func hero(width: CGFloat) -> some View {
              let baseHeight = min(488, max(430, width * 1.08))
              let contentWidth = max(0, width - 40)
              return GeometryReader { proxy in
                  let minY = proxy.frame(in: .named("emby-detail-scroll")).minY
                  let stretch = max(0, minY)
                  let upwardScroll = max(0, -minY)
                  let revealProgress = min(1, upwardScroll / 190)
                  let visualHeight = baseHeight + stretch
                  let revealScale = 1.10 - 0.10 * easedReveal(revealProgress)
                  let contrastScrim = heroUsesLightForeground ? Color.black.opacity(0.22) : Color.white.opacity(0.16)

                  ZStack(alignment: .bottom) {
                      EmbyCachedRemoteImage(url: heroImageURL, contentMode: .fill, onImageLoaded: { image in updateHeroImageAnalysis(image) })
                          .frame(width: width, height: visualHeight)
                          .scaleEffect(revealScale, anchor: .center)
                          .clipped()
                          .mask(
                              LinearGradient(
                                  stops: [
                                      .init(color: .black, location: 0.00),
                                      .init(color: .black, location: 0.66),
                                      .init(color: .black.opacity(0.92), location: 0.76),
                                      .init(color: .black.opacity(0.52), location: 0.90),
                                      .init(color: .clear, location: 1.00)
                                  ],
                                  startPoint: .top,
                                  endPoint: .bottom
                              )
                          )

                      LinearGradient(
                          stops: [
                              .init(color: .clear, location: 0.00),
                              .init(color: .clear, location: 0.48),
                              .init(color: contrastScrim.opacity(0.48), location: 0.67),
                              .init(color: contrastScrim, location: 0.82),
                              .init(color: .clear, location: 1.00)
                          ],
                          startPoint: .top,
                          endPoint: .bottom
                      )

                      VStack(spacing: 9) {
                          heroIdentity(width: contentWidth)

                          Text(heroMetadataLine)
                              .font(.system(size: 13.5, weight: .medium))
                              .foregroundColor(heroSecondaryForeground)
                              .multilineTextAlignment(.center)
                              .lineLimit(2)
                              .frame(width: contentWidth)

                          if !model.detailFilters.isEmpty { heroTagScroller(width: width) }

                          if let playableItem = model.primaryPlayableItem {
                              Button { Task { await model.play(playableItem) } } label: {
                                  HStack(spacing: 9) {
                                      if model.isResolvingPlayback { ProgressView().tint(.white) }
                                      else { Image(systemName: "play.fill").font(.system(size: 15, weight: .bold)) }
                                      Text(model.primaryPlayButtonTitle).font(.headline)
                                  }
                                  .foregroundColor(.white)
                                  .frame(width: contentWidth, height: 50)
                                  .background(Color.blue)
                                  .clipShape(RoundedRectangle(cornerRadius: 17, style: .continuous))
                              }
                              .buttonStyle(DetailPressButtonStyle())
                              .disabled(model.isResolvingPlayback)
                          }

                          detailActionRow(width: contentWidth)
                      }
                      .frame(width: width)
                      .padding(.bottom, 6)
                  }
                  .frame(width: width, height: visualHeight)
                  .offset(y: stretch > 0 ? -stretch : 0)
              }
              .frame(width: width, height: baseHeight)
          }

          '''
          text = replace_between(text, "    private func hero(width: CGFloat) -> some View {", "    @ViewBuilder\n    private func heroIdentity", hero, "replace hero")

          backdrop = '''    private var persistentBackdrop: some View {
              GeometryReader { proxy in
                  ZStack {
                      EmbyCachedRemoteImage(url: heroImageURL, contentMode: .fill)
                          .frame(width: proxy.size.width, height: proxy.size.height)
                          .clipped()
                          .scaleEffect(1.06)
                          .blur(radius: 30)
                      LinearGradient(
                          colors: [
                              Color(uiColor: .systemBackground).opacity(colorScheme == .dark ? 0.18 : 0.28),
                              Color(uiColor: .systemBackground).opacity(colorScheme == .dark ? 0.40 : 0.50),
                              Color(uiColor: .systemBackground).opacity(colorScheme == .dark ? 0.60 : 0.68)
                          ],
                          startPoint: .top,
                          endPoint: .bottom
                      )
                  }
                  .frame(width: proxy.size.width, height: proxy.size.height)
                  .clipped()
              }
              .ignoresSafeArea()
          }

          '''
          text = replace_between(text, "    private var persistentBackdrop: some View {", "    private var heroForeground", backdrop, "replace persistent backdrop")

          text = replace_between(text, "    private func heroImageScale(width: CGFloat, height: CGFloat, revealProgress: CGFloat) -> CGFloat {", "    private func easedReveal", "", "remove old hero cover scale")

          update_analysis = '''    private func updateHeroImageAnalysis(_ image: UIImage) {
              let prefersLight = EmbyImageContrastAnalyzer.prefersLightForeground(for: image)
              if heroUsesLightForeground != prefersLight {
                  withAnimation(.easeOut(duration: 0.18)) { heroUsesLightForeground = prefersLight }
              }
          }

          '''
          text = replace_between(text, "    private func updateHeroImageAnalysis(_ image: UIImage) {", "    private var heroImageURL", update_analysis, "simplify image analysis")
          if "heroImageSize" in text or "heroImageScale(" in text:
              raise SystemExit("detail Hero still contains removed size/scale architecture")
          path.write_text(text)

          # 2) Navigation visuals: per-destination navigation-item appearance and source snapshot fallback.
          # Never touch interactivePopGestureRecognizer, its delegate/isEnabled, navigation stack, or transition coordinator.
          path = Path("Sources/UI/ImmersiveUIComponents.swift")
          text = path.read_text()
          navigation = '''private final class ImmersiveNavigationAppearanceViewController: UIViewController {
              private weak var appearanceOwner: UIViewController?
              private var originalStandardAppearance: UINavigationBarAppearance?
              private var originalScrollEdgeAppearance: UINavigationBarAppearance?
              private var originalCompactAppearance: UINavigationBarAppearance?
              private var originalCompactScrollEdgeAppearance: UINavigationBarAppearance?
              private var sourceSnapshot: UIView?
              private weak var sourceSnapshotContainer: UIView?
              private var sourceControllerIdentifier: ObjectIdentifier?

              override func viewWillAppear(_ animated: Bool) {
                  super.viewWillAppear(animated)
                  refreshVisualOwnership()
              }

              override func viewDidAppear(_ animated: Bool) {
                  super.viewDidAppear(animated)
                  refreshVisualOwnership()
              }

              override func viewDidDisappear(_ animated: Bool) {
                  super.viewDidDisappear(animated)
                  restoreNavigationItemAppearance()
                  removeSourceSnapshot(reason: "destination-disappeared")
              }

              func refreshVisualOwnership() {
                  guard viewIfLoaded?.window != nil else { return }
                  applyNavigationItemAppearance()
                  installSourceSnapshotIfNeeded()
              }

              func tearDown() {
                  restoreNavigationItemAppearance()
                  removeSourceSnapshot(reason: "bridge-dismantled")
              }

              private func owningNavigationController() -> UINavigationController? { navigationController }

              private func owningDestinationController() -> UIViewController? {
                  guard let navigationController = owningNavigationController() else { return parent }
                  var current: UIViewController = self
                  while let next = current.parent, next !== navigationController { current = next }
                  if current.parent === navigationController { return current }
                  return navigationController.topViewController
              }

              private func applyNavigationItemAppearance() {
                  guard let owner = owningDestinationController() else { return }
                  if appearanceOwner !== owner {
                      restoreNavigationItemAppearance()
                      appearanceOwner = owner
                      originalStandardAppearance = owner.navigationItem.standardAppearance
                      originalScrollEdgeAppearance = owner.navigationItem.scrollEdgeAppearance
                      originalCompactAppearance = owner.navigationItem.compactAppearance
                      originalCompactScrollEdgeAppearance = owner.navigationItem.compactScrollEdgeAppearance
                  }

                  let appearance = UINavigationBarAppearance()
                  appearance.configureWithTransparentBackground()
                  appearance.backgroundColor = .clear
                  appearance.shadowColor = .clear
                  let backButton = UIBarButtonItemAppearance(style: .plain)
                  backButton.normal.titlePositionAdjustment = UIOffset(horizontal: -1000, vertical: 0)
                  backButton.highlighted.titlePositionAdjustment = UIOffset(horizontal: -1000, vertical: 0)
                  appearance.backButtonAppearance = backButton
                  owner.navigationItem.standardAppearance = appearance
                  owner.navigationItem.scrollEdgeAppearance = appearance
                  owner.navigationItem.compactAppearance = appearance
                  owner.navigationItem.compactScrollEdgeAppearance = appearance
                  DiagnosticsLogger.shared.log("NavigationVisual", "event=destination-nav-appearance stack=\\(owningNavigationController()?.viewControllers.count ?? 0)")
              }

              private func restoreNavigationItemAppearance() {
                  guard let owner = appearanceOwner else { return }
                  owner.navigationItem.standardAppearance = originalStandardAppearance
                  owner.navigationItem.scrollEdgeAppearance = originalScrollEdgeAppearance
                  owner.navigationItem.compactAppearance = originalCompactAppearance
                  owner.navigationItem.compactScrollEdgeAppearance = originalCompactScrollEdgeAppearance
                  DiagnosticsLogger.shared.log("NavigationVisual", "event=destination-nav-restore stack=\\(owner.navigationController?.viewControllers.count ?? 0)")
                  appearanceOwner = nil
                  originalStandardAppearance = nil
                  originalScrollEdgeAppearance = nil
                  originalCompactAppearance = nil
                  originalCompactScrollEdgeAppearance = nil
              }

              private func installSourceSnapshotIfNeeded() {
                  guard let navigationController = owningNavigationController(), let destination = owningDestinationController(),
                        let index = navigationController.viewControllers.firstIndex(where: { $0 === destination }), index > 0 else { return }
                  let source = navigationController.viewControllers[index - 1]
                  let identifier = ObjectIdentifier(source)
                  if sourceControllerIdentifier == identifier, sourceSnapshot != nil { return }
                  removeSourceSnapshot(reason: "source-changed")

                  let sourceView = source.view
                  sourceView.setNeedsLayout()
                  sourceView.layoutIfNeeded()
                  guard sourceView.bounds.width > 1, sourceView.bounds.height > 1 else {
                      DiagnosticsLogger.shared.log("NavigationVisual", "event=source-snapshot-skip reason=empty-bounds stack=\\(navigationController.viewControllers.count)")
                      return
                  }

                  let snapshot: UIView
                  if let hierarchySnapshot = sourceView.snapshotView(afterScreenUpdates: false) {
                      snapshot = hierarchySnapshot
                  } else {
                      let renderer = UIGraphicsImageRenderer(bounds: sourceView.bounds)
                      let image = renderer.image { _ in sourceView.drawHierarchy(in: sourceView.bounds, afterScreenUpdates: false) }
                      snapshot = UIImageView(image: image)
                  }
                  snapshot.frame = sourceView.bounds
                  snapshot.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  snapshot.isUserInteractionEnabled = false
                  snapshot.accessibilityElementsHidden = true
                  sourceView.addSubview(snapshot)
                  sourceView.bringSubviewToFront(snapshot)
                  sourceSnapshot = snapshot
                  sourceSnapshotContainer = sourceView
                  sourceControllerIdentifier = identifier
                  DiagnosticsLogger.shared.log("NavigationVisual", "event=source-snapshot-install stack=\\(navigationController.viewControllers.count) source=\\(type(of: source)) destination=\\(type(of: destination))")
              }

              private func removeSourceSnapshot(reason: String) {
                  guard let snapshot = sourceSnapshot else { return }
                  snapshot.removeFromSuperview()
                  sourceSnapshot = nil
                  sourceSnapshotContainer = nil
                  sourceControllerIdentifier = nil
                  DiagnosticsLogger.shared.log("NavigationVisual", "event=source-snapshot-remove reason=\\(reason)")
              }
          }

          private struct ImmersiveNavigationAppearanceBridge: UIViewControllerRepresentable {
              func makeUIViewController(context: Context) -> ImmersiveNavigationAppearanceViewController {
                  let controller = ImmersiveNavigationAppearanceViewController()
                  controller.view.isUserInteractionEnabled = false
                  controller.view.backgroundColor = .clear
                  return controller
              }

              func updateUIViewController(_ uiViewController: ImmersiveNavigationAppearanceViewController, context: Context) {
                  DispatchQueue.main.async { uiViewController.refreshVisualOwnership() }
              }

              static func dismantleUIViewController(_ uiViewController: ImmersiveNavigationAppearanceViewController, coordinator: ()) { uiViewController.tearDown() }
          }

          '''
          text = replace_between(text, "private final class ImmersiveNavigationAppearanceEntry", "extension View {", navigation, "replace immersive navigation appearance implementation")
          forbidden = ["interactivePopGestureRecognizer", "UIGestureRecognizerDelegate", "transitionCoordinator", "popViewController("]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f"forbidden native navigation ownership token remains: {token}")
          path.write_text(text)

          # 3) Permanent static regression gate for the exact device findings and prior rejected architecture.
          regression = r'''from pathlib import Path


def require(condition: bool, message: str) -> None:
    if not condition:
        raise SystemExit(f"::error::{message}")


detail = Path("Sources/UI/EmbyMediaDetailView.swift").read_text()
nav = Path("Sources/UI/ImmersiveUIComponents.swift").read_text()
grid = Path("Sources/UI/EmbyPosterGrid.swift").read_text()
shared = Path("Sources/UI/EmbySharedImageAndNavigation.swift").read_text()
project = Path("project.yml").read_text()

require('contentMode: .fill, onImageLoaded:' in detail, "Hero must use a single clear fill image that always covers elastic height")
require('contentMode: .fit, onImageLoaded:' not in detail, "Hero must not use fit mode that can expose a second layer during overscroll")
require('.blur(radius: 13)' not in detail, "Hero must not contain the old duplicated blurred image")
require('heroImageScale(' not in detail and 'heroImageSize' not in detail, "fixed-height Hero cover-scale architecture must stay removed")
require('.mask(' in detail and 'location: 1.00' in detail, "Hero clear image must fade continuously into persistent backdrop")
require('GeometryReader { proxy in' in detail and 'persistentBackdrop' in detail, "persistent backdrop must own the viewport")

for forbidden in ['interactivePopGestureRecognizer', 'UIGestureRecognizerDelegate', 'transitionCoordinator', 'popViewController(']:
    require(forbidden not in nav, f"visual navigation layer must never own native pop behavior: {forbidden}")
require('navigationItem.standardAppearance = appearance' in nav, "immersive navigation appearance must be destination-scoped")
require('source-snapshot-install' in nav and 'snapshotView(afterScreenUpdates: false)' in nav, "native interactive pop must have source-page visual snapshot fallback")
require('nativeInteractivePop() -> some View { self }' in nav, "nativeInteractivePop compatibility modifier must remain a no-op")

require('route=cell-link' in grid, "stable per-cell grid route must remain")
require('EmbyGridPosterNavigationLink' in shared, "stable per-cell NavigationLink implementation must remain")
require('EmbyPosterGridNavigationHost' not in grid and 'EmbyPosterGridNavigationHost' not in shared, "rejected reusable hidden grid NavigationLink must not return")
require('iOS: "15.0"' in project and 'deploymentTarget: "15.0"' in project, "Deployment Target must remain iOS 15.0")
print("v0.13.4 detail/navigation visual invariants: OK")
'''
          Path("scripts/check_v0134_detail_navigation.py").write_text(regression)

          # Run the new gate before committing.
          import subprocess
          subprocess.run(["python3", "scripts/check_v0134_detail_navigation.py"], check=True)

          # Hook the gate into normal Validate Source before any expensive Xcode work.
          path = Path(".github/workflows/validate-source.yml")
          text = path.read_text()
          anchor = '''      - name: Select Xcode 16.4
'''
          step = '''      - name: Validate v0.13.4 detail and native-navigation invariants
        run: python3 scripts/check_v0134_detail_navigation.py

'''
          if step not in text:
              text = replace_once(text, anchor, step + anchor, "validate-source regression hook")
          path.write_text(text)

          # One-shot workflow must not survive the patch commit.
          workflow = Path(".github/workflows/one-shot-fix-detail-hero-pop-0134.yml")
          if workflow.exists():
              workflow.unlink()

          print("Targeted detail Hero/native-pop visual patch applied.")
          PY

          python3 scripts/check_v0134_detail_navigation.py
          git diff --check
          git diff --stat

      - name: Commit patched source
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add -A
          git commit -m 'fix: unify detail hero and preserve native pop visuals [detail-hero-pop-patched]'
          git push origin HEAD:fix/detail-hero-pop-0134
