name: Build154 Apply Click Start Patch

on:
  pull_request:
    branches: [fix/fast-start-pip-0.13.85]
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'perf/click-start-parallel-0.13.87' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build154 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply precise Build154 source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          # 1) Carry an already-known resume position with the resolved playback source.
          replace_once('Sources/Models/EmbyModels.swift',
          '''    let playSessionId: String?\n    let url: URL\n    let headers: [String: String]\n}''',
          '''    let playSessionId: String?\n    let initialPlaybackPositionTicks: Int64?\n    let url: URL\n    let headers: [String: String]\n}''')

          # 2) Let the resolver attach that hint without changing existing callers.
          replace_once('Sources/Networking/EmbyAPIClient.swift',
          '''    func resolvePlaybackSource(itemId: String, itemName: String, mediaSource: MediaSource, playSessionId: String?) throws -> ResolvedPlaybackSource {''',
          '''    func resolvePlaybackSource(itemId: String, itemName: String, mediaSource: MediaSource, playSessionId: String?, initialPlaybackPositionTicks: Int64? = nil) throws -> ResolvedPlaybackSource {''')
          replace_once('Sources/Networking/EmbyAPIClient.swift',
          '''        return ResolvedPlaybackSource(itemId: itemId, itemName: itemName, mediaSource: mediaSource, playSessionId: playSessionId, url: finalURL, headers: safeMediaHeaders(mediaSource.requiredHTTPHeaders ?? [:]))''',
          '''        return ResolvedPlaybackSource(itemId: itemId, itemName: itemName, mediaSource: mediaSource, playSessionId: playSessionId, initialPlaybackPositionTicks: initialPlaybackPositionTicks, url: finalURL, headers: safeMediaHeaders(mediaSource.requiredHTTPHeaders ?? [:]))''')

          # 3) PlayerController consumes the hint before making any resume lookup request.
          replace_once('Sources/Player/PlayerController.swift',
          '''    private func resolveInitialPlaybackPosition() async -> Double {\n        do {''',
          '''    private func resolveInitialPlaybackPosition() async -> Double {\n        if let ticks = source.initialPlaybackPositionTicks {\n            let seconds = max(0, Double(ticks) / AppIdentity.ticksPerSecond)\n            let duration = source.mediaSource.durationSeconds ?? 0\n            if duration > 0, seconds / duration >= 0.995 {\n                DiagnosticsLogger.shared.playback("Resume", "item=\\(source.itemId) source-hint treated-as-complete ticks=\\(ticks)")\n                return 0\n            }\n            let resolved = duration > 0 ? min(seconds, duration) : seconds\n            DiagnosticsLogger.shared.playback("Resume", "item=\\(source.itemId) source-hint position=\\(String(format: \"%.3f\", resolved)) duration=\\(String(format: \"%.3f\", duration))")\n            return resolved\n        }\n        do {''')

          # 4) Remember the detail page's already-existing PlaybackInfo response for a short click-time fast path.
          replace_once('Sources/UI/EmbyMediaDetailView.swift',
          '''    @Published var mediaSources: [MediaSource] = []\n    @Published var mediaMetadataItem: LibraryItem?\n    @Published private var desiredFavorite: Bool''',
          '''    @Published var mediaSources: [MediaSource] = []\n    @Published var mediaMetadataItem: LibraryItem?\n    private var mediaPlaySessionId: String?\n    private var mediaPlaybackInfoLoadedAt: Date?\n    @Published private var desiredFavorite: Bool''')

          replace_once('Sources/UI/EmbyMediaDetailView.swift',
          '''        guard let mediaItem else {\n            mediaSources = []\n            mediaMetadataItem = nil\n            return\n        }\n        do {\n            let info = try await client.playbackInfo(itemId: mediaItem.id)\n            mediaSources = info.mediaSources\n            mediaMetadataItem = mediaItem\n        } catch {''',
          '''        guard let mediaItem else {\n            mediaSources = []\n            mediaMetadataItem = nil\n            mediaPlaySessionId = nil\n            mediaPlaybackInfoLoadedAt = nil\n            return\n        }\n        do {\n            let info = try await client.playbackInfo(itemId: mediaItem.id)\n            mediaSources = info.mediaSources\n            mediaMetadataItem = mediaItem\n            mediaPlaySessionId = info.playSessionId\n            mediaPlaybackInfoLoadedAt = Date()\n        } catch {''')

          old_play = '''    func play(_ mediaItem: LibraryItem) async {\n        guard !isResolvingPlayback else { return }\n        isResolvingPlayback = true\n        errorMessage = nil\n        defer { isResolvingPlayback = false }\n        do {\n            if hasPlaybackPositionOverride, mediaItem.id != item.id {\n                try? await client.setPlayed(itemId: mediaItem.id, played: false)\n                DiagnosticsLogger.shared.log("EmbyDetail", "resume override cleared child item=\\(mediaItem.id) before playback")\n            }\n            let info = try await client.playbackInfo(itemId: mediaItem.id)\n            guard let source = info.mediaSources.first(where: { $0.supportsDirectPlay == true }) ?? info.mediaSources.first else { throw EmbyAPIError.noMediaSource }\n            selectedSource = try client.resolvePlaybackSource(itemId: mediaItem.id, itemName: mediaItem.name, mediaSource: source, playSessionId: info.playSessionId)\n        } catch {\n            if !isEmbyRequestCancellation(error) { errorMessage = error.localizedDescription }\n        }\n    }'''

          new_play = '''    func play(_ mediaItem: LibraryItem) async {\n        guard !isResolvingPlayback else { return }\n        isResolvingPlayback = true\n        errorMessage = nil\n        defer { isResolvingPlayback = false }\n        do {\n            if hasPlaybackPositionOverride, mediaItem.id != item.id {\n                try? await client.setPlayed(itemId: mediaItem.id, played: false)\n                DiagnosticsLogger.shared.log("EmbyDetail", "resume override cleared child item=\\(mediaItem.id) before playback")\n            }\n\n            let initialTicks: Int64 = {\n                if hasPlaybackPositionOverride { return max(0, playbackPositionOverrideTicks ?? 0) }\n                if mediaItem.isPlayed { return 0 }\n                return max(0, mediaItem.userData?.playbackPositionTicks ?? 0)\n            }()\n\n            let resolved: ResolvedPlaybackSource\n            if mediaMetadataItem?.id == mediaItem.id,\n               let cachedSource = mediaSources.first(where: { $0.supportsDirectPlay == true }) ?? mediaSources.first,\n               let loadedAt = mediaPlaybackInfoLoadedAt,\n               Date().timeIntervalSince(loadedAt) <= 60 {\n                resolved = try client.resolvePlaybackSource(itemId: mediaItem.id, itemName: mediaItem.name, mediaSource: cachedSource, playSessionId: mediaPlaySessionId, initialPlaybackPositionTicks: initialTicks)\n                DiagnosticsLogger.shared.playback("StartupFastPath", "click source reused item=\\(mediaItem.id) playbackInfoAgeMs=\\(Int(Date().timeIntervalSince(loadedAt) * 1000)) resumeTicks=\\(initialTicks)")\n            } else {\n                let info = try await client.playbackInfo(itemId: mediaItem.id)\n                guard let source = info.mediaSources.first(where: { $0.supportsDirectPlay == true }) ?? info.mediaSources.first else { throw EmbyAPIError.noMediaSource }\n                resolved = try client.resolvePlaybackSource(itemId: mediaItem.id, itemName: mediaItem.name, mediaSource: source, playSessionId: info.playSessionId, initialPlaybackPositionTicks: initialTicks)\n                DiagnosticsLogger.shared.playback("StartupFastPath", "click source refreshed item=\\(mediaItem.id) resumeTicks=\\(initialTicks)")\n            }\n\n            PlaybackClickResolveRegistry.shared.arm(source: resolved)\n            selectedSource = resolved\n        } catch {\n            if !isEmbyRequestCancellation(error) { errorMessage = error.localizedDescription }\n        }\n    }'''
          replace_once('Sources/UI/EmbyMediaDetailView.swift', old_play, new_play)

          # 5) RedirectResolver joins a click-started 0-0 resolve instead of starting another one after PlayerScreen appears.
          replace_once('Sources/Transport/RedirectResolver.swift',
          '''struct RedirectResolver {\n    func resolve(source: ResolvedPlaybackSource) async throws -> TransportResolvedResource {\n        let configuration = URLSessionConfiguration.ephemeral''',
          '''struct RedirectResolver {\n    func resolve(source: ResolvedPlaybackSource) async throws -> TransportResolvedResource {\n        if let task = PlaybackClickResolveRegistry.shared.task(for: source) {\n            DiagnosticsLogger.shared.playback("StartupFastPath", "transport resolve joined click-prewarm item=\\(source.itemId)")\n            do { return try await task.value }\n            catch {\n                PlaybackClickResolveRegistry.shared.discard(source: source)\n                throw error\n            }\n        }\n        return try await resolveNetwork(source: source)\n    }\n\n    func resolveNetwork(source: ResolvedPlaybackSource) async throws -> TransportResolvedResource {\n        let configuration = URLSessionConfiguration.ephemeral''')

          # 6) Version.
          replace_once('Sources/Core/AppIdentity.swift', 'static let sourceVersion = "0.13.85"', 'static let sourceVersion = "0.13.87"')
          replace_once('Sources/Core/AppIdentity.swift', '?? "0.13.85"', '?? "0.13.87"')

          # 7) New click-only resolve registry. It is never armed before play().
          Path('Sources/Transport/PlaybackClickResolveRegistry.swift').write_text('''import Foundation\n\nfinal class PlaybackClickResolveRegistry: @unchecked Sendable {\n    static let shared = PlaybackClickResolveRegistry()\n\n    private struct Entry {\n        let createdAt: Date\n        let task: Task<TransportResolvedResource, Error>\n    }\n\n    private let lock = NSLock()\n    private var entries: [String: Entry] = [:]\n    private let ttl: TimeInterval = 10\n\n    private init() {}\n\n    func arm(source: ResolvedPlaybackSource) {\n        let key = Self.key(for: source)\n        lock.lock()\n        purgeExpiredLocked(now: Date())\n        if entries[key] != nil {\n            lock.unlock()\n            return\n        }\n        let task = Task(priority: .userInitiated) { try await RedirectResolver().resolveNetwork(source: source) }\n        entries[key] = Entry(createdAt: Date(), task: task)\n        lock.unlock()\n        DiagnosticsLogger.shared.playback("StartupFastPath", "click transport resolve armed item=\\(source.itemId) range=0-0")\n    }\n\n    func task(for source: ResolvedPlaybackSource) -> Task<TransportResolvedResource, Error>? {\n        lock.lock()\n        defer { lock.unlock() }\n        purgeExpiredLocked(now: Date())\n        return entries[Self.key(for: source)]?.task\n    }\n\n    func discard(source: ResolvedPlaybackSource) {\n        lock.lock()\n        entries.removeValue(forKey: Self.key(for: source))\n        lock.unlock()\n    }\n\n    private func purgeExpiredLocked(now: Date) {\n        entries = entries.filter { now.timeIntervalSince($0.value.createdAt) <= ttl }\n    }\n\n    private static func key(for source: ResolvedPlaybackSource) -> String {\n        "\\(source.itemId)|\\(source.mediaSource.id)|\\(source.url.absoluteString)"\n    }\n}\n''')
          PY

      - name: Verify precise diff
        shell: bash
        run: |
          git diff --check
          grep -q 'initialPlaybackPositionTicks' Sources/Models/EmbyModels.swift
          grep -q 'source-hint position=' Sources/Player/PlayerController.swift
          grep -q 'click source reused' Sources/UI/EmbyMediaDetailView.swift
          grep -q 'click transport resolve armed' Sources/Transport/PlaybackClickResolveRegistry.swift
          grep -q 'transport resolve joined click-prewarm' Sources/Transport/RedirectResolver.swift
          grep -q 'bytes=0-0' Sources/Transport/RedirectResolver.swift
          ! grep -q 'StartupBootstrap' Sources/Transport/RedirectResolver.swift

      - name: Commit Build154 source and remove temporary runner
        shell: bash
        run: |
          rm .github/workflows/build154-apply-click-start.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Sources .github/workflows/build154-apply-click-start.yml
          git commit -m 'Build154 optimize click-triggered startup'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
