name: One-shot sync Build210 poster evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-sync-build210-poster-docs.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Patch current project authority docs
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path
          import re

          module = Path('docs/project/MODULE_STATUS.md')
          s = module.read_text(encoding='utf-8')
          new_poster = '| Poster 3-column / poster-heavy scroll smoothness | **Active — Build209 real-device diagnostics exposed single-owner attribution defect; Build210 CI/IPA verified; real-device pending** | Build209 / 0.14.42 target-device App log produced three verified Home motion-overlapping long frames: 78.8 ms (`delta_y=5.33`), 38.1 ms (`delta_y=1.33`) and 67.2 ms (`delta_y=-61.33`, velocity 1012.3). The same session reached shared-grid load-ahead around 20:01:29.642 / `StartIndex=60` at 20:01:29.650 but logged zero `scroll_route=grid` hitches. Exact Build209 source explains the diagnostic defect: one global observed scroll owner can be overwritten by Home/grid probes remaining in the navigation hierarchy, so zero grid records are not evidence of a smooth grid. Build210 / 0.14.43 is diagnostic-only: it keeps one shared `CADisplayLink` and the same ≥30 ms + real-motion gate, but registers each Home/grid scroll owner independently and attributes each long frame to the owner actually moving; logs add `registered_scrolls` and `moving_scrolls`. Exact source `9d8fd6a62e6e7d281d4fae5ab8442754a6362f47`; run/job `33009322419 / 98311176681` passed; artifact ID `9621956333`; IPA SHA-256 `813811fe0301cd8c942511e3e7786c184a80966960bf029ed3366d6edaa23701`; source ZIP `ba59a91128e1b2b1730942966f19fdb364f52552a552c1cf60b8b19ce128a775`; MinOS 15.0. Performance root cause remains unresolved; Build210 is not a claimed fix or stable build. |'
          s, n = re.subn(r'^\| Poster 3-column / poster-heavy scroll smoothness \|.*$', new_poster, s, count=1, flags=re.M)
          if n != 1: raise SystemExit('MODULE_STATUS poster row anchor mismatch')
          new_other = '| Other product modules | Active parallel work | Build199 / 0.14.32 remains the accepted overall runtime baseline. Home-carousel Build208 / 0.14.41 and poster-scroll Build210 / 0.14.43 diagnostics are separate Active lines with independent branches/evidence; neither is implied accepted by Build199. Build210 reuses Build209 Home/grid probes but changes only shared diagnostic ownership; final integration of shared infrastructure must resync and rerun affected validation. |'
          s, n = re.subn(r'^\| Other product modules \|.*$', new_other, s, count=1, flags=re.M)
          if n != 1: raise SystemExit('MODULE_STATUS other row anchor mismatch')
          module.write_text(s, encoding='utf-8')

          index = Path('docs/project/BUILD_TEST_INDEX.md')
          s = index.read_text(encoding='utf-8')
          new209 = '| **Build209 / 0.14.42** | Motion-aware poster-scroll diagnostics | Target-device App log captured three verified Home motion hitches (78.8 / 38.1 / 67.2 ms), but zero grid hitches despite a proven grid load-ahead event. Exact source revealed one global scroll-owner slot, so Home/grid probes can overwrite each other. Real-device diagnostic tested; grid attribution incomplete; not stable. |'
          s, n = re.subn(r'^\| \*\*Build209 / 0\.14\.42\*\* \|.*$', new209, s, count=1, flags=re.M)
          if n != 1: raise SystemExit('BUILD_TEST_INDEX Build209 row anchor mismatch')
          if '| **Build210 / 0.14.43** |' not in s:
              s = s.replace(new209 + '\n', new209 + '\n| **Build210 / 0.14.43** | Multi-owner poster-scroll diagnostics | **Current poster diagnostic candidate.** Keeps one shared display link and the same ≥30 ms real-motion gate, but samples all registered Home/grid scroll owners and attributes a hitch to the owner actually moving; CI/IPA independently verified, target-device pending. Diagnostic-only; not stable. |\n', 1)

          start = s.index('### Build209 — current motion-aware diagnostic candidate')
          end = s.index('\n## Accepted foundation evidence', start)
          detail = '''### Build209 — target-device motion capture; grid attribution incomplete

- identity: **0.14.42 / 209**; exact source `e95d73b75938ad92f2c4d7f06a3ba2d441bb92f4`.
- run/job `33006881819 / 98302809290`; artifact ID `9621031556`; IPA SHA-256 `85f6649352718a8cac2b269ee090e19bfbb173881845462ed1493e1d90129572`.
- target-device App log `OnePlayer-App-1787774511.log` contains three motion-gated Home records: **78.8 ms** (`delta_y=5.33`), **38.1 ms** (`delta_y=1.33`), and **67.2 ms** (`delta_y=-61.33`, `velocity_y=1012.3`). These prove real Home long frames while content is moving.
- the same session reached grid load-ahead: the later hitch's `load_ahead_age_ms=15376.1` back-calculates to ~20:01:29.642, matching a grid `StartIndex=60` request at 20:01:29.650.
- nevertheless Build209 emitted **0** `scroll_route=grid` hitches.
- exact source has one global `observedScrollView / observedScrollOwnerID / observedScrollRoute / lastScrollOffsetY`; Home and grid probes can overwrite that slot as either reattaches during layout/navigation. Therefore Build209's zero grid records are not evidence that grid scrolling is smooth.
- evidence: **Code written / CI passed / IPA produced+verified / real-device diagnostic tested / Home motion stalls verified / grid attribution incomplete / performance root cause unresolved / not stable.**

### Build210 — current multi-owner diagnostic candidate

- identity: **0.14.43 / 210**; exact source **`9d8fd6a62e6e7d281d4fae5ab8442754a6362f47`**.
- exact Build209→Build210 delta is four files only: AppIdentity, shared image/navigation diagnostics, Build210 changelog, checker.
- retains exactly one shared poster `CADisplayLink` and the same gap ≥30 ms + real `delta_y != 0` gate.
- each probe now registers an independent weak `UIScrollView`, route and previous offset in `scrollObservations[UUID]`; every display tick samples all registered owners.
- if multiple owners move, dragging is preferred over decelerating over programmatic moving, then larger absolute delta wins. Logs add `registered_scrolls` and `moving_scrolls`.
- legacy single-owner fields are absent. Home/grid probe placement, scroll physics, image policy, NavigationLink/lazy behavior, carousel owner and P0 playback/transport/cache/session are unchanged.
- an initial contents-API write truncated the shared file, but exact diff caught it before CI. Repair run/job `33009161632 / 98310624611` restored exact Build209 source then applied only the intended diagnostic patch; no truncated package was tested or distributed.
- exact-source run/job: **`33009322419 / 98311176681` — success**.
- artifact `OnePlayer-0.14.43-build210-poster-multi-owner-diagnostics`; ID **`9621956333`**.
- artifact digest / independent ZIP SHA-256: **`d6ba61a5a2f6f635e316db81e3d6d520ae4710b972d652f3df579818f7cc7c32`**.
- IPA SHA-256: **`813811fe0301cd8c942511e3e7786c184a80966960bf029ed3366d6edaa23701`**.
- source ZIP SHA-256: **`ba59a91128e1b2b1730942966f19fdb364f52552a552c1cf60b8b19ce128a775`**.
- independent validation: IPA/source integrity PASS; bundle `com.embyplayerlab.app`; OnePlayer `0.14.43 (210)`; MinOS 15.0; source has multi-owner observation, `registered_scrolls/moving_scrolls`, exactly one poster display link, no legacy single-owner fields, and complete shared source.
- evidence: **Code written ✅ / exact scope+Frozen guard ✅ / CI passed ✅ / IPA produced+verified ✅ / target-device diagnostic pending / performance fix not claimed / not stable.**
'''
          s = s[:start] + detail + s[end:]
          index.write_text(s, encoding='utf-8')

          state = Path('docs/project/PROJECT_STATE.md')
          s = state.read_text(encoding='utf-8')
          s = re.sub(r'^_Last updated.*_$', '_Last updated after poster-scroll Build209 target-device motion diagnostics exposed a single-owner Home/grid attribution defect, and Build210 / 0.14.43 completed CI/IPA with multi-owner scroll diagnostics. Build199 remains the latest real-device accepted overall baseline. Home-carousel Build208 and poster-scroll Build210 remain independent Active candidates._', s, count=1, flags=re.M)
          start = s.index('## Active: Poster-heavy scrolling smoothness')
          end = s.index('\n## Parallel integration rule', start)
          poster = '''## Active: Poster-heavy scrolling smoothness

Work: `DEV-poster-grid-smoothness`.

- Build202 / 0.14.35 and Build204 / 0.14.37 were target-device rejected; visible stop/catch-up hitch remained on Home and library 3×3.
- Build206 / 0.14.39 App log ruled out immediate cell entry/image commit/load-ahead as a universal trigger but lacked real motion state.
- Build209 / 0.14.42 added actual vertical motion gating. Latest target-device App log contains three verified Home motion-overlapping long frames: **78.8 ms**, **38.1 ms**, **67.2 ms**; the 67.2 ms frame had `delta_y=-61.33` and velocity 1012.3.
- The Build209 session also reached shared-grid load-ahead around 20:01:29.642 / `StartIndex=60` at 20:01:29.650, yet emitted zero grid-route hitches. Exact source has only one global observed scroll-owner slot, so Home/grid probes can overwrite each other; Build209 grid attribution is invalid/incomplete.
- Build210 / 0.14.43 is the current diagnostic-only candidate. Exact source **`9d8fd6a62e6e7d281d4fae5ab8442754a6362f47`** replaces only the single-owner diagnostic state with independent weak observations for all registered Home/grid scroll views. It retains one shared `CADisplayLink`, the same ≥30 ms + real-motion gate, and logs `registered_scrolls` / `moving_scrolls`.
- Build210 exact-source run/job **`33009322419 / 98311176681`** passed; artifact ID **`9621956333`**; artifact digest `d6ba61a5a2f6f635e316db81e3d6d520ae4710b972d652f3df579818f7cc7c32`; IPA SHA-256 `813811fe0301cd8c942511e3e7786c184a80966960bf029ed3366d6edaa23701`; source ZIP `ba59a91128e1b2b1730942966f19fdb364f52552a552c1cf60b8b19ce128a775`; MinOS 15.0.
- Build210 changes no scroll physics, image policy, navigation/lazy behavior, carousel owner or P0 player/transport/cache/session path.
- evidence: **Build209 real-device diagnostic tested; Build210 Code written / exact scope+Frozen guard / CI passed / IPA produced+verified / target-device pending / performance root cause unresolved / not stable.**

Next action: target-device Build210 App-log capture on both Home and library 3×3. First verify grid movement is correctly attributed as `scroll_route=grid` with multi-owner counts; only then use the corrected Home/grid long-frame correlations to justify a performance-source change.
'''
          s = s[:start] + poster + s[end:]
          state.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md

      - name: Commit authority-doc updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md
          git commit -m "Record Build209 device evidence and Build210 diagnostic baseline"
          git push origin HEAD:main
