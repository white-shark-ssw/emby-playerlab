name: Build MPV Compare IPA

on:
  workflow_dispatch:
  push:
    branches: [feat/mpv-compare-0.13.7-work]
  pull_request:
    branches: [ci/mpv-compare-0.13.7-base]

permissions:
  contents: read

concurrency:
  group: mpv-compare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize logs
        run: |
          : > build.log
          : > package-resolution.log
          : > pods-install.log
          : > app-validation.log
          : > min-os-report.log
          : > package.log

      - name: Apply MPV 0.13.7 comparison patch
        run: |
          set -euo pipefail
          python3 scripts/apply_mpv_compare_0137.py
          grep -q 'MARKETING_VERSION: "0.13.7"' project.yml
          grep -q 'CURRENT_PROJECT_VERSION: "74"' project.yml
          grep -q 'private var seekGeneration: UInt64 = 0' Sources/Player/MPVPlayerEngine.swift
          grep -q 'MPVSeekEvent' Sources/Player/MPVPlayerEngine.swift
          grep -q 'event=playback-restart' Sources/Player/MPVPlayerEngine.swift
          grep -q 'static let sourceVersion = "0.13.7"' Sources/Core/AppIdentity.swift

      - name: Export exact patched source snapshot
        run: |
          set -euo pipefail
          SOURCE_DIR="$(mktemp -d)"
          rsync -a --exclude '.git' --exclude 'build' --exclude '.spm-cache' ./ "$SOURCE_DIR/OnePlayer/"
          SOURCE_ZIP="OnePlayer-MPVCompare-0.13.7-build74-${GITHUB_SHA::7}-source.zip"
          ditto -c -k --sequesterRsrc --keepParent "$SOURCE_DIR/OnePlayer" "$SOURCE_ZIP"
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"
          rm -rf "$SOURCE_DIR"

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Prepare OnePlayer assets
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          python3 - <<'PY'
          from pathlib import Path
          project = Path('project.yml').read_text()
          engine = Path('Sources/Player/MPVPlayerEngine.swift').read_text()
          checks = {
              'iOS 15 deployment': 'iOS: "15.0"' in project and 'deploymentTarget: "15.0"' in project,
              'MPV compare version': 'MARKETING_VERSION: "0.13.7"' in project and 'CURRENT_PROJECT_VERSION: "74"' in project,
              'MPVKit 1.0.0 pinned': 'exactVersion: 1.0.0' in project,
              'MPV unified transport': 'MPVUnifiedStreamBridge' in engine and 'prioritizeSeek' in engine,
              'MPV seek ID telemetry': 'seekGeneration' in engine and 'MPVSeekEvent' in engine and 'MPVSeekLanding' in engine,
              'MPV behavior unchanged': 'absolute+keyframes' in engine and 'self.command(handle, ["seek"' in engine,
              'MPV rate health': 'MPVRateHealth' in engine,
          }
          for name, ok in checks.items():
              print(f'{name}: {"OK" if ok else "FAIL"}')
              if not ok:
                  raise SystemExit(f'::error::{name} failed')
          PY

      - name: Generate project
        run: xcodegen generate

      - name: Install KTVHTTPCache 3.1.0
        run: |
          set -euo pipefail
          set -o pipefail
          pod install --repo-update 2>&1 | tee pods-install.log

      - name: Restore Swift package cache
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: ${{ runner.os }}-mpv-compare-1.0.0-ktv-3.1.0-${{ hashFiles('project.yml', 'Podfile') }}

      - name: Resolve MPVKit 1.0.0
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build MPV compare for generic iOS device
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py \
            "$APP_PATH" \
            --bundle-id "com.embyplayerlab.app" \
            --version "0.13.7" \
            --build "74" \
            --display-name "OnePlayer" \
            --minimum-os "15.0" \
            --primary-icon "OnePlayerIcon" \
            --alternate-icon "OnePlayerAltIcon" 2>&1 | tee app-validation.log

      - name: Validate runtime minimum OS
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" min-os-report.log build.log

      - name: Package MPV compare unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-MPVCompare-0.13.7-${GITHUB_SHA::7}-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME" | tee package.log
          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload MPV compare artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-MPVCompare-${{ github.sha }}
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            min-os-report.log
            app-validation.log
            package-resolution.log
            build.log
          if-no-files-found: error
          retention-days: 30

      - name: Summarize failure
        if: failure()
        run: |
          {
            echo '## MPV compare build diagnostics'
            echo '```text'
            grep -nEi '(^|[[:space:]])(error:|fatal error:)|::error::| failed:' build.log package-resolution.log pods-install.log app-validation.log min-os-report.log package.log | head -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
