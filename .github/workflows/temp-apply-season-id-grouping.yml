name: Temp Apply SeasonId Episode Grouping

on:
  push:
    branches:
      - fix/season-id-episode-grouping
    paths:
      - '.github/workflows/temp-apply-season-id-grouping.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/temp_apply_season_id_grouping.py

      - name: Run regression check
        run: python3 scripts/check_season_id_episode_grouping.py

      - name: Commit source fix
        run: |
          set -euo pipefail
          git config user.name 'os-player-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/temp-apply-season-id-grouping.yml scripts/temp_apply_season_id_grouping.py
          git add Sources/UI/EmbyMediaDetailView.swift scripts/check_season_id_episode_grouping.py
          git commit -m 'fix: group episodes by Emby season id'
          git push origin HEAD:fix/season-id-episode-grouping
