name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ipa-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: |
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate project
        run: xcodegen generate

      - name: Install pods
        run: pod install --repo-update

      - name: Archive unsigned app
        run: |
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/EmbyPlayerLab.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            archive

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/EmbyPlayerLab.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r EmbyPlayerLab-${{ github.ref_name }}-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EmbyPlayerLab-${{ github.ref_name }}-unsigned-ipa
          path: build/*.ipa
          retention-days: 14
