name: Record Build219 Aether Device Evidence

on:
  push:
    branches: [feat/aether-multi-engine-comparison]
    paths:
      - .github/workflows/temp-aether-build219-device-evidence.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Aether real-device evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          tested = "b1a06cb2b3dc9cf715fc5d49a7b324780aa23981"
          run_job = "33096553966 / 98602865604"
          artifact = "9656814369"
          ipa_sha = "8df11d2db597fd6841a3708976824b21879ee0d47257c1766d1704cc4196d06d"

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          checkpoint = Path("docs/project/current/dev/DEV-aether-multi-engine-comparison.md")
          text = checkpoint.read_text()
          heading = "\n## Frozen / do-not-touch\n"
          section = '''
## Build219 real-device result — first Aether comparison

User supplied a Build219 playback log from the target iPhone 15 Pro Max / iOS 17.0. This is the first real-device Aether evidence and changes the task state from CI/IPA-only to real-device tested.

### Seek result

- 14 Aether `SeekEvent.landed` completions were recorded; 13 were classified as `bufferHit=true` by the engine adapter.
- Completion latency: minimum **370.9 ms**, median **865.2 ms**, mean **1001.5 ms**, maximum **2261.3 ms**. The 13 buffer-hit seeks still had a median of **915.6 ms**.
- Precision is excellent: median absolute target→rendered error was about **0.614 ms**, maximum **2.239 ms**.
- Therefore the user's observation is confirmed: Build219 Aether Seek is very precise but has a high, repeatedly visible latency. The sample is not literally fixed-duration; it spans ~0.37–2.26 s, but most seeks pay a heavy common path.

### Transport churn identified from log + exact Build219 source

This candidate has a host-bridge defect that confounds any conclusion about Aether's intrinsic Seek floor:

- The log contains **2917 observed** `[Resume] exact-byte authority confirmed` events and the same number of observed `[SeekTransportTrace] phase=actor-enter ... target=0.000 duration=0.000` events; diagnostics backpressure also dropped **4328 + 409** events, so the true count is higher.
- During the ~70 s session, observed Transport activity was **5413 Range task starts / 5364 task cancellations / 49 completed sequential tasks**.
- `AetherTransportIOReader.read()` calls `confirmConcretePlaybackByte(current)` after every successful read (normally 256 KiB in this log).
- `UnifiedResumeAuthority.confirmConcretePlaybackByte()` reuses the user-seek authority path by calling `prioritizeSeek(position: 0, duration: 0)` and then `prioritizeOffset(offset)`.
- That combination makes ordinary Aether sequential consumption repeatedly create a fake pending user-seek token; the following byte-offset demand then reanchors the cache window and cancels/restarts healthy 115/CDN sequential lanes.
- MPV does not use this method per read: `MPVUnifiedStreamBridge` only confirms playback-byte authority after a sustained post-seek read cluster. Build219's Aether per-read call is therefore not an inherited P0 transport contract and should not be retained.

Concrete example: the first +10 s seek requested target 11.800 while Aether already reported a playable range extending to ~73.733 s (`bufferHit=true`). It still took **1132.6 ms**; during that interval the transport repeatedly reanchored/cancelled slot 0, and the seek landed only after a fresh CDN first chunk arrived (~680 ms for that request). This proves at least part of the high latency is self-inflicted by the adapter/transport interaction, not simply “Aether exact Seek is slow”.

The best observed landed time is still ~371 ms, so Aether itself may retain a non-trivial exact-seek floor after the transport churn is removed. That must be measured in a clean follow-up build rather than guessed now.

### Other Build219 device evidence

- STRM/redirect transport resolved successfully as HTTP **206**, `redirects=2`, `range=true`, `looksLike115=true`; active media ranges came directly from `cdnfhnfile.115cdn.net`.
- No playback `error`, `failed`, `stall`, `premature EOF`, media EOF, network read timeout or Aether recovery event appears in this session.
- Startup: click→transport resolve ready was ~**1037 ms**; Aether `load begin`→`load ready` was ~**106 ms**; timeline was advancing with ~73 s reported forward playable by 17:37:43.712Z.
- User changed playback rate through 3×, 4×, 5×, 6× and 8× in this log without an Aether error/stall record.
- Emby progress/report calls are not separately exposed by this log surface, so this file alone is not evidence to accept or reject Resume/Progress synchronization.

**Evidence after this log:** Code written / CI passed / IPA produced+verified / **real-device tested with Aether Seek-latency defect confirmed** / not stable.
'''
          if "## Build219 real-device result — first Aether comparison" not in text:
              if heading not in text:
                  raise SystemExit("checkpoint heading missing")
              checkpoint.write_text(text.replace(heading, "\n" + section + heading, 1))

          replace_once(
              str(checkpoint),
              "- [ ] Real-device comparison completed.\n- [ ] Stable/frozen decision made.\n",
              "- [x] First real-device Aether comparison/log analysis completed; high Seek latency + per-read transport reanchor defect confirmed.\n- [ ] Clean post-fix Aether↔MPV comparison completed.\n- [ ] Stable/frozen decision made.\n"
          )
          replace_once(
              str(checkpoint),
              "- **Real-device tested:** No.\n- **Stable / frozen:** No.\n\n## Next exact action\n\nInstall Build219 / 0.14.52 on iPhone 15 Pro Max / iOS 17.0 and compare Aether against the retained MPV authority on startup/first frame, normal and rapid double-tap Seek, scrub Seek, STRM→302→115/CDN Range behavior, cache hit/miss, abnormal short media, background/resume and Emby Resume/Progress. Record only observed device evidence; do not promote Aether to automatic authority from CI/IPA alone.\n",
              "- **Real-device tested:** Yes — first target-device log confirms very accurate but high-latency Aether Seek and a Build219 per-read transport reanchor/cancellation defect.\n- **Stable / frozen:** No.\n\n## Next exact action\n\nMake one minimal Aether-bridge correction: ordinary successful `AetherTransportIOReader.read()` must not call the user-seek authority path on every read. Preserve exact-byte demand and the existing UnifiedTransport ownership; do not add timers/retries/fallbacks or time→byte guessing. Then package a new unique build and repeat the same Aether Seek test to separate the remaining intrinsic Aether exact-seek latency from the Build219 adapter-induced transport churn.\n"
          )

          module = "docs/project/MODULE_STATUS.md"
          old = "| Aether | **Active experimental candidate — Build219 CI/IPA verified; real-device pending** | AetherEngine 6.50.0 is manually selectable in normal OnePlayer; MPV remains default/automatic authority. Build219 / 0.14.52 exact source `" + tested + "` passed Xcode 26.3 Release CI (`" + run_job + "`) and produced artifact `" + artifact + "`; IPA SHA-256 `" + ipa_sha + "`, MinOS 16.0. Uses existing UnifiedTransport exact-byte IOReader demand and does not add a second 115/CDN network stack. PiP/audio/subtitle capabilities remain conservatively unclaimed. No real-device result yet; not stable. |"
          new = "| Aether | **Active experimental — Build219 real-device Seek-latency defect confirmed** | AetherEngine 6.50.0 is manually selectable; MPV remains default/automatic authority. Build219 source `" + tested + "` passed CI/IPA, then target-device logging confirmed extremely accurate Seek (median abs error ~0.614 ms, max ~2.239 ms) but high landed latency (median ~865 ms, max ~2261 ms). Exact source+log inspection found the Build219 Aether bridge calls `confirmConcretePlaybackByte` after every successful ~256 KiB read; that helper creates a fake `prioritizeSeek(0,0)` token and repeatedly reanchors/cancels healthy UnifiedTransport lanes. Observed ~70 s session: 5413 task starts / 5364 cancellations / 49 finishes, plus diagnostics backpressure drops. STRM→206→115 CDN client-direct path succeeded and no Aether error/stall/EOF/timeout was recorded. Requires one minimal bridge correction + clean retest; not stable. |"
          replace_once(module, old, new)

          state = Path("docs/project/PROJECT_STATE.md")
          text = state.read_text()
          start = text.index("\n## Active: Aether manual playback-engine comparison\n")
          end = text.index("\n## Parallel integration rule\n", start)
          replacement = '''
## Active: Aether manual playback-engine comparison

Work: `DEV-aether-multi-engine-comparison`.

Build219 / OnePlayer 0.14.52 exact source `''' + tested + '''` passed Xcode 26.3 Release CI (`''' + run_job + '''`) and produced verified artifact `''' + artifact + '''`, IPA SHA-256 `''' + ipa_sha + '''`, MinOS 16.0. AetherEngine 6.50.0 remains manual-only; MPV remains default/automatic authority.

First target-device Aether log is now available. Seek precision is excellent (14 landed events, median absolute target error ~0.614 ms, max ~2.239 ms), but latency is high: 370.9–2261.3 ms, median 865.2 ms; 13/14 were adapter-classified buffer hits and their median remained 915.6 ms. Exact Build219 source inspection identifies a host-bridge defect that prevents treating those times as pure Aether cost: every successful `AetherTransportIOReader.read()` calls `confirmConcretePlaybackByte`, which invokes `prioritizeSeek(0,0)` and then byte reprioritization. Ordinary 256 KiB sequential reads therefore repeatedly become fake user-seek/reanchor events, cancelling healthy 115/CDN bulk lanes. The ~70 s observed log contains 5413 Range task starts, 5364 cancellations and only 49 sequential finishes; diagnostics backpressure dropped at least 4737 additional events.

Other device evidence is positive but not yet acceptance: transport resolved HTTP 206 with two redirects to direct `115cdn.net`, no media error/stall/EOF/read-timeout/recovery event appears, and playback-rate changes through 8× did not produce an Aether failure record. Emby Resume/Progress is not separately proven by this log surface.

Current evidence: **Code written / CI passed / IPA produced+verified / real-device tested with Aether Seek-latency + per-read transport-churn defect confirmed / not stable**. Next action is a minimal Aether bridge correction only, followed by a new-build retest to measure the remaining intrinsic Aether exact-seek floor.
'''
          state.write_text(text[:start] + replacement + text[end:])

          index = "docs/project/BUILD_TEST_INDEX.md"
          old = "| **Build219 / 0.14.52** | Aether manual multi-engine comparison candidate | **CI/IPA verified; real-device pending; not stable.** AetherEngine 6.50.0 is manually selectable while MPV remains default/automatic authority. Exact source `" + tested + "`; Xcode 26.3 run/job `" + run_job + "` success; artifact `" + artifact + "` (`sha256:f2e984c56ebf1b74a7eaf39ff43f08cee2e9a0edaa0ae65d6406d2fefd2fc75a`); IPA SHA-256 `" + ipa_sha + "`; source ZIP SHA-256 `61148b209d543c233502c8412f9448fffa143a97f5753c25595626c72b3e31e4`; MinOS 16.0. Aether uses existing UnifiedTransport exact-byte IOReader demand; no time→byte approximation, NAS relay, automatic fallback or PiP redesign. |"
          new = "| **Build219 / 0.14.52** | Aether manual multi-engine comparison candidate | **CI/IPA verified + first target-device log analyzed; Seek-latency defect confirmed; not stable.** Aether Seek landed 14 times with excellent precision (median abs error ~0.614 ms, max ~2.239 ms) but 370.9–2261.3 ms latency (median 865.2 ms; 13 buffer-hit median 915.6 ms). Exact source/log inspection found `AetherTransportIOReader.read()` calls `confirmConcretePlaybackByte` on every successful ~256 KiB read, which creates `prioritizeSeek(0,0)` and repeated UnifiedTransport reanchors: observed 5413 Range task starts / 5364 cancellations / 49 finishes, with 4737 diagnostics events dropped by backpressure. STRM→206→115 CDN client-direct resolution succeeded; no Aether error/stall/EOF/read-timeout appeared. Fix the bridge minimally and retest before judging Aether's intrinsic exact-seek floor. |"
          replace_once(index, old, new)

          decisions = Path("docs/project/TECHNICAL_DECISIONS.md")
          text = decisions.read_text()
          marker = "This is **CI/IPA evidence only**: Aether remains experimental until target-device behavior is reported, and frozen MPV fast Seek/PiP/STRM→302→115/CDN contracts remain unchanged."
          replacement = marker + "\n\nBuild219 target-device logging adds one correction to this contract: **ordinary Aether sequential reads must not manufacture user-seek authority.** The first adapter called `confirmConcretePlaybackByte` after every successful read; that helper calls `prioritizeSeek(0,0)` and then `prioritizeOffset`, producing thousands of fake pending-seek/reanchor events and cancelling healthy CDN lanes. This behavior is rejected by real-device evidence. The fix must remain exact-byte and minimal: remove/gate the per-read authority promotion rather than adding time→byte estimates, retries, timers, fallback or a second transport owner. A clean post-fix test is required before attributing the remaining Seek latency to Aether itself."
          if replacement not in text:
              if marker not in text:
                  raise SystemExit("D019 marker missing")
              decisions.write_text(text.replace(marker, replacement, 1))

          PY
          git diff --check
          git diff -- docs/project/current/dev/DEV-aether-multi-engine-comparison.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/BUILD_TEST_INDEX.md docs/project/TECHNICAL_DECISIONS.md

      - name: Commit device evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project
          git commit -m "Record Build219 Aether device seek evidence"
          git push origin HEAD:feat/aether-multi-engine-comparison
