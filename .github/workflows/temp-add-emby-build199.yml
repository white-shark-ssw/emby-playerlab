name: Build199 Add Emby Password Sync

on:
  push:
    branches: [feat/add-emby-page-optimization]
    paths:
      - .github/workflows/temp-add-emby-build199.yml

concurrency:
  group: build199-add-emby-password-sync
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize logs
        run: |
          : > build.log
          : > package-resolution.log
          : > pods-install.log
          : > app-validation.log
          : > min-os-report.log
          : > contract.log
          : > package.log

      - name: Validate Build199 accepted-baseline and password-sync contracts
        run: |
          set -euo pipefail
          BASE="e577995e6075091804d55bc7013d684569ce5f90"
          git merge-base --is-ancestor "$BASE" HEAD
          python3 - <<'PY' 2>&1 | tee contract.log
          import subprocess
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(f"::error::{message}")

          base = "e577995e6075091804d55bc7013d684569ce5f90"
          changed = set(subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines())
          product = {
              "Sources/App/RootView.swift",
              "Sources/Core/KeychainStore.swift",
              "Sources/Session/SessionStore.swift",
              "Sources/UI/EmbyServerRootViewV3.swift",
              "Sources/UI/ServerListView.swift",
          }
          allowed = product | {".github/workflows/temp-add-emby-build199.yml"}
          require(changed <= allowed, f"unexpected delta from accepted Build195 main: {sorted(changed - allowed)}")
          require(product <= changed, "expected Add Emby product files missing from Build195 delta")
          require(not any(path.startswith(("Sources/Player/", "Sources/Transport/", "Sources/Cache/")) for path in changed), "frozen playback/transport/cache file changed")
          require("Sources/UI/EmbyHomeModelV3.swift" not in changed and "Sources/UI/EmbyHomeCoreV3.swift" not in changed, "cached-first startup must reuse existing Home snapshots")

          identity = Path("Sources/Core/AppIdentity.swift").read_text()
          ui = Path("Sources/UI/ServerListView.swift").read_text()
          session = Path("Sources/Session/SessionStore.swift").read_text()
          root = Path("Sources/App/RootView.swift").read_text()
          server_root = Path("Sources/UI/EmbyServerRootViewV3.swift").read_text()
          keychain = Path("Sources/Core/KeychainStore.swift").read_text()
          project = Path("project.yml").read_text()

          require('sourceVersion = "0.14.28"' in identity, "accepted Build195 AppIdentity was not inherited")
          require('iOS: "15.0"' in project and 'deploymentTarget: "15.0"' in project, "Deployment Target must remain iOS 15.0")
          require('initialPassword: sessionStore.password(for: stored)' in ui, "Edit password must be prefilled from Keychain")
          require('_password = State(initialValue: initialPassword ?? "")' in ui, "Edit password state prefill missing")
          require('password == initialPassword ? nil : password' in ui, "unchanged password must not force reauthentication")
          require('func updateServer(_ stored: EmbySession, serverTexts: [String], password: String? = nil' in session, "optional password update contract missing")
          require('func password(for stored: EmbySession) -> String?' in session, "password lookup API missing")
          require('OnePlayer.ServerPassword.' in session and 'OnePlayer.SyncedServerPassword.' in session, "separate local/synchronizable password accounts missing")
          require('try KeychainStore.set(password, account: passwordAccount(tokenAccount))' in session, "local Keychain password persistence missing")
          require('try KeychainStore.setSynchronizable(password, account: syncedPasswordAccount(tokenAccount))' in session, "iCloud Keychain password persistence missing")
          require('KeychainStore.removeSynchronizable(account: syncedPasswordAccount(tokenAccount))' in session, "iCloud-off password removal missing")
          require('removePassword(tokenAccount: stored.tokenAccount)' in session, "server deletion must remove password credentials")
          require('auth.user.id == stored.user.id' in session, "password changes must preserve stored user identity")
          synced_record = session.split("private struct SyncedServerRecord: Codable {", 1)[1].split("private enum SessionStoreError", 1)[0]
          require("password" not in synced_record.lower(), "password must not be embedded in synchronized JSON registry")
          require('UserDefaults.standard.set(password' not in session and 'UserDefaults.standard.setValue(password' not in session, "password must not enter UserDefaults")
          require('kSecAttrSynchronizable' in keychain and 'kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly' in keychain, "local/synchronizable Keychain primitives missing")
          require('rememberRouteWinner(winner, for: stored)' in session, "runtime winner persistence missing")
          require('autoStartedClient = try? sessionStore.client(for: stored)' in root and 'initialClient: autoStartedClient' in root, "cached-first auto-start missing")
          require('keepsCachedHomeOnRouteFailure' in server_root and 'if !keepsCachedHomeOnRouteFailure { close() }' in server_root, "cached-home failure contract missing")
          print("Build199 accepted Build195 + Add Emby password sync/frozen contracts: OK")
          PY

      - name: Export exact CI source
        run: |
          set -euo pipefail
          SOURCE_ZIP="OnePlayer-0.14.32-build199-add-emby-password-sync-${GITHUB_SHA::7}-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Prepare OnePlayer icons
        run: python3 scripts/generate_oneplayer_icons.py

      - name: Generate project
        run: xcodegen generate

      - name: Install KTVHTTPCache 3.1.0
        run: |
          set -euo pipefail
          set -o pipefail
          pod install --repo-update 2>&1 | tee pods-install.log

      - name: Resolve MPVKit
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build standard MPV Release
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            MARKETING_VERSION=0.14.32 \
            CURRENT_PROJECT_VERSION=199 \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo "::error::Release .app not produced"
            exit 1
          fi
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py \
            "$APP_PATH" \
            --bundle-id "com.embyplayerlab.app" \
            --version "0.14.32" \
            --build "199" \
            --display-name "OnePlayer" \
            --minimum-os "15.0" \
            --primary-icon "OnePlayerIcon" \
            --alternate-icon "OnePlayerAltIcon" 2>&1 | tee app-validation.log

      - name: Validate runtime MinOS
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-0.14.32-build199-add-emby-password-sync-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME" 2>&1 | tee package.log
          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload Build199 candidate
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.32-build199-add-emby-password-sync
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            contract.log
            app-validation.log
            min-os-report.log
          if-no-files-found: error
          retention-days: 30

      - name: Summarize failure
        if: failure()
        run: |
          {
            echo "## Build199 diagnostics"
            echo '```text'
            grep -nEi '(^|[[:space:]])(error:|fatal error:)|::error::| failed:|ERROR ' contract.log build.log package-resolution.log pods-install.log app-validation.log min-os-report.log package.log | head -220 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
