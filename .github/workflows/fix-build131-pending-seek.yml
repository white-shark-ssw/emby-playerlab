name: Fix Build131 PendingSeek Compile

on:
  push:
    branches:
      - diag/mpv-intent-seek-0.13.64

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/mpv-intent-seek-0.13.64
          fetch-depth: 0
      - name: Patch startup PendingSeek diagnostics only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Sources/Player/MPVPlayerEngine.swift')
          text = path.read_text()
          old = 'pendingSeek = startPosition > 0 ? PendingSeek(id: 0, requestedAt: CACurrentMediaTime(), target: startPosition, bufferHit: false) : nil'
          new = 'pendingSeek = startPosition > 0 ? PendingSeek(id: 0, requestedAt: CACurrentMediaTime(), target: startPosition, bufferHit: false, intent: "startupResume", mode: "loadfile-start") : nil'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one startup PendingSeek initializer, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- Sources/Player/MPVPlayerEngine.swift
      - name: Commit compile-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Player/MPVPlayerEngine.swift
          git commit -m "Fix Build131 startup seek diagnostics initializer"
          git push origin HEAD:diag/mpv-intent-seek-0.13.64
