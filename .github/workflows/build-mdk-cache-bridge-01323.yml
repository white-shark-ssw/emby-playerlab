name: Build OnePlayer 0.13.23 MDK Cache Bridge

on:
  pull_request:
    branches: [feat/recovery-isolation-0.13.17]

concurrency:
  group: mdk-cache-bridge-01323-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'validate/mdk-cache-bridge-0.13.23'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recovery-isolation-0.13.17
          fetch-depth: 0

      - name: Materialize and audit Build90 cache bridge
        run: |
          set -euo pipefail
          python3 scripts/materialize_mdk_cache_bridge_01323.py
          git diff --check
          grep -Fq 'private var mdkDirectHTTPABActive: Bool { false }' Sources/Player/PlayerController.swift
          grep -Fq 'mode=unified-localhost-v2 sharedTransportPassed=true highSpeedCache=true nasMediaProxy=false' Sources/Player/PlayerController.swift
          grep -Fq 'sharedTransportSession: transportContext?.session' Sources/Player/PlayerController.swift
          grep -Fq 'Connection: keep-alive' Sources/Transport/TransportHTTPServer.swift
          grep -Fq 'Keep-Alive: timeout=30, max=100' Sources/Transport/TransportHTTPServer.swift
          grep -Fq 'isComplete: false' Sources/Transport/TransportHTTPServer.swift
          grep -Fq 'async -> Bool' Sources/Transport/TransportHTTPServer.swift
          ! grep -Fq 'statusBanner(title: "疑似提前结束"' Sources/UI/PlayerScreen.swift
          ! grep -Fq 'statusBanner(title: "播放停滞恢复"' Sources/UI/PlayerScreen.swift
          grep -Fq 'Premature EOF stays diagnostic-only' Sources/UI/PlayerScreen.swift
          grep -Fq 'Stall recovery stays diagnostic-only' Sources/UI/PlayerScreen.swift
          grep -Fq 'MARKETING_VERSION: "0.13.23"' project.mdklab.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "90"' project.mdklab.yml
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          grep -Fq 'sourceVersion = "0.13.23"' Sources/Core/AppIdentity.swift

      - name: Select Xcode and tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodebuild -version
          swift --version

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build OnePlayer 0.13.23 Build90
        id: release_build
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.23-build90-mdk-cache-bridge-release-diagnostics
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report compiler failure
        if: steps.release_build.outcome == 'failure'
        run: |
          set -euo pipefail
          grep -nE '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|SwiftCompile|CompileSwift|EmitSwiftModule' build.log | tail -300 || true
          tail -180 build.log || true
          exit 1

      - name: Validate app identity and minimum OS
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.23' --build '90' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.23-build90-mdk-cache-bridge-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload final test package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.23-build90-mdk-cache-bridge
          path: |
            OnePlayer-0.13.23-build90-mdk-cache-bridge-unsigned.ipa
            OnePlayer-0.13.23-build90-mdk-cache-bridge-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
          if-no-files-found: error
          retention-days: 14

      - name: Persist validated Build90 source to experiment branch
        continue-on-error: true
        run: |
          set -euo pipefail
          git diff -- MDKLab/App/MDKKSAVIOPlayerEngine.swift Sources/Player/PlayerController.swift Sources/UI/PlayerScreen.swift Sources/Transport/TransportHTTPServer.swift Sources/Core/AppIdentity.swift project.mdklab.yml > /tmp/build90-runtime.patch
          if test ! -s /tmp/build90-runtime.patch; then
            echo 'Build90 source already materialized.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin feat/recovery-isolation-0.13.17
          git reset --hard origin/feat/recovery-isolation-0.13.17
          git apply --3way /tmp/build90-runtime.patch
          git add Sources/Player/PlayerController.swift Sources/UI/PlayerScreen.swift Sources/Transport/TransportHTTPServer.swift Sources/Core/AppIdentity.swift project.mdklab.yml
          git diff --cached --check
          git commit -m 'fix: restore MDK unified cache bridge and silence recovery banners'
          git push origin HEAD:feat/recovery-isolation-0.13.17
