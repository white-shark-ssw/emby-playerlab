name: Validate OnePlayer 0.13.16 Playback Byte Authority Final

on:
  push:
    branches: [feat/playback-byte-authority-0.13.16]
  pull_request:
    branches: [feat/transport-stream-guard-0.13.15]

concurrency:
  group: playback-byte-authority-final-01316-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Materialize final Build83 architecture
        run: |
          set -euo pipefail
          python3 scripts/materialize_playback_byte_authority_01316.py
          python3 scripts/finalize_playback_byte_authority_01316.py
          if [ "${{ github.event_name }}" = "push" ] && ! git diff --quiet -- Sources/Transport/PlaybackDemandCoordinator.swift Sources/Transport/TransportDataSession.swift Sources/Transport/TransportTypes.swift Sources/Transport/UnifiedMediaTransportSession.swift Sources/Player/PlayerController.swift Sources/Player/PlaybackOrchestrator.swift Sources/Transport/TransportHTTPServer.swift MDKLab/App/MDKKSAVIOPlayerEngine.swift project.mdklab.yml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Sources/Transport/PlaybackDemandCoordinator.swift Sources/Transport/TransportDataSession.swift Sources/Transport/TransportTypes.swift Sources/Transport/UnifiedMediaTransportSession.swift Sources/Player/PlayerController.swift Sources/Player/PlaybackOrchestrator.swift Sources/Transport/TransportHTTPServer.swift MDKLab/App/MDKKSAVIOPlayerEngine.swift project.mdklab.yml
            git commit -m 'Finalize playback byte authority architecture'
            git push origin HEAD
          fi

      - name: Verify authority architecture and frozen buffer timeline
        run: |
          set -euo pipefail
          test "$(git hash-object Sources/UI/BufferedTimelineSlider.swift)" = '4c0c772d104fb6b1537e9d89604acbc563114f62'
          grep -q 'observeDependency(offset:' Sources/Transport/PlaybackDemandCoordinator.swift
          grep -q 'confirmPlaybackProgress(position:' Sources/Transport/PlaybackDemandCoordinator.swift
          grep -q 'func reportPlaybackProgress(position: Double, isBuffering: Bool)' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -q 'source=engine-clock+real-byte' Sources/Transport/UnifiedMediaTransportSession.swift
          ! grep -q 'demandCoordinator.observe(offset:' Sources/Transport/UnifiedMediaTransportSession.swift
          ! grep -q 'if concretePlaybackDemand, !resumeHistoricalDependency { recordPlaybackDemand' Sources/Transport/UnifiedMediaTransportSession.swift
          ! grep -q 'advanceCacheWindowCenterFromRecentDemand' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -q 'recentNetworkFailureAgeSeconds' Sources/Transport/TransportTypes.swift
          grep -q 'transportStarved' Sources/Player/PlaybackOrchestrator.swift
          grep -q 'native-seek-current-after-network-eof' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -q 'TransportHTTPActivity' Sources/Transport/TransportHTTPServer.swift
          grep -q 'requestRate=' Sources/Transport/TransportHTTPServer.swift
          grep -q 'MARKETING_VERSION: "0.13.16"' project.mdklab.yml
          grep -q 'CURRENT_PROJECT_VERSION: "83"' project.mdklab.yml
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml

      - name: Select Xcode and tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodebuild -version
          swift --version

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build OnePlayer 0.13.16 Build83
        id: release_build
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.16-build83-final-release-diagnostics
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report compiler failure
        if: steps.release_build.outcome == 'failure'
        run: |
          set -euo pipefail
          grep -nE '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|SwiftCompile|CompileSwift' build.log | tail -250 || true
          tail -120 build.log || true
          exit 1

      - name: Validate app identity and minimum OS
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.16' --build '83' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.16-build83-playback-byte-authority-final-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload final test package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.16-build83-playback-byte-authority-final
          path: |
            OnePlayer-0.13.16-build83-playback-byte-authority-final-unsigned.ipa
            OnePlayer-0.13.16-build83-playback-byte-authority-final-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
          if-no-files-found: error
          retention-days: 14
