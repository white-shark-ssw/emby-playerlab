name: Build OnePlayer 0.13.73 Build140 Keyframe Native Seek Probe

on:
  workflow_dispatch:
  push:
    branches: [diag/keyframe-native-seek-probe-0.13.73]
    paths:
      - "Sources/**"
      - "scripts/apply_build140_keyframe_native_seek_probe.py"
      - "project.mdklab.yml"
      - "Podfile"
      - ".github/workflows/build140-keyframe-native-seek-probe.yml"
  pull_request:
    branches: [diag/keyframe-index-cache-reader-0.13.72]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: build140-keyframe-native-seek-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/diag/keyframe-native-seek-probe-0.13.73' || github.head_ref == 'diag/keyframe-native-seek-probe-0.13.73'
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout Build140 experiment
        uses: actions/checkout@v4
        with:
          ref: diag/keyframe-native-seek-probe-0.13.73
          fetch-depth: 0

      - name: Apply native-seek observation wiring
        run: |
          set -euo pipefail
          python3 scripts/apply_build140_keyframe_native_seek_probe.py
          git diff --check
          git status --short

      - name: Persist Build140 real source
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add Sources/Player/MPVPlayerEngine.swift
          if ! git diff --cached --quiet; then
            git commit -m 'Build140: observe native-seek keyframe neighbors after landing'
            git push origin HEAD:diag/keyframe-native-seek-probe-0.13.73
          fi

      - name: Verify Build140 source contract
        run: |
          set -euo pipefail
          grep -Fq 'sourceVersion = "0.13.73"' Sources/Core/AppIdentity.swift
          grep -Fq 'ONEPLAYER_KEYFRAME_NATIVE_SEEK_READONLY' Sources/Player/MPVKeyframeIndexProbe.swift
          grep -Fq 'av_seek_frame' Sources/Player/MPVKeyframeIndexProbe.swift
          grep -Fq 'av_read_frame' Sources/Player/MPVKeyframeIndexProbe.swift
          grep -Fq 'AVSEEK_FLAG_BACKWARD' Sources/Player/MPVKeyframeIndexProbe.swift
          grep -Fq 'AV_PKT_FLAG_KEY' Sources/Player/MPVKeyframeIndexProbe.swift
          grep -Fq 'mode=native-seek-cache-only' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'theoreticalGain=' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'self.logKeyframeIndexObservation(seekID: pending.id, target: pending.target, actual: actualPosition)' Sources/Player/MPVPlayerEngine.swift
          ! grep -Fq 'self.logKeyframeIndexObservation(seekID: seekID, target: target)' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'func readCachedMetadata(offset: Int64, length: Int) async -> Data?' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'mode=cache-only-no-network' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'phase=mpv-event-seek owner=claimed' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'reason=no-latest-seek-event-owner' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'intent = "doubleTapFastSeek"' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'intent = "scrubReleaseFastSeek"' Sources/Player/MPVPlayerEngine.swift
          test "$(grep -Fc 'mode = "absolute+keyframes"' Sources/Player/MPVPlayerEngine.swift)" -ge 2
          ! grep -Fq 'absolute+exact' Sources/Player/MPVPlayerEngine.swift
          ! grep -Fq 'avformat_index_get_entries_count' Sources/Player/MPVKeyframeIndexProbe.swift
          ! grep -Fq 'avformat_index_get_entry' Sources/Player/MPVKeyframeIndexProbe.swift
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          git diff --check

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Create same-target FFmpeg compile contract
        run: |
          set -euo pipefail
          cat > Sources/Player/Build140BackendCompileContract.swift <<'SWIFT'
          #if !canImport(Libavformat)
          #error("Build140 OnePlayer target cannot import Libavformat")
          #endif
          #if !canImport(Libavutil)
          #error("Build140 OnePlayer target cannot import Libavutil")
          #endif
          #if !canImport(Libavcodec)
          #error("Build140 OnePlayer target cannot import Libavcodec")
          #endif
          import Libavformat
          import Libavutil
          import Libavcodec
          enum Build140BackendCompileContract { static func verify() -> UInt32 { avformat_version() ^ avutil_version() ^ avcodec_version() } }
          SWIFT

      - name: Generate project and resolve MPVKit
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Build140 Release
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.73 CURRENT_PROJECT_VERSION=140 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.73' --build '140' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Verify native-seek keyframe backend
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          BIN="$APP_PATH/$EXECUTABLE"
          grep -Fq 'Build140BackendCompileContract.swift' build.log
          grep -Fq 'MPVKeyframeIndexProbe.swift' build.log
          grep -Fq -- '-framework Libavformat' build.log
          grep -Fq -- '-framework Libavutil' build.log
          grep -Fq -- '-framework Libavcodec' build.log
          if ! nm -gU "$BIN" > keyframe-symbols.log 2>&1; then nm "$BIN" > keyframe-symbols.log 2>&1; fi
          grep -Fq '_av_seek_frame' keyframe-symbols.log
          grep -Fq '_av_read_frame' keyframe-symbols.log
          grep -Fq '_av_packet_alloc' keyframe-symbols.log
          grep -Fq '_av_packet_unref' keyframe-symbols.log
          grep -Fq '_avformat_open_input' keyframe-symbols.log
          echo 'backend=libavformat-direct probe=native-seek-keyframe-neighbors cache=read-only-no-network observation=post-landing' | tee keyframe-index-report.log
          rm -f Sources/Player/Build140BackendCompileContract.swift

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.73-build140-keyframe-native-seek-probe-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build140 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.73-build140-keyframe-native-seek-probe
          path: |
            OnePlayer-0.13.73-build140-keyframe-native-seek-probe-unsigned.ipa
            OnePlayer-0.13.73-build140-keyframe-native-seek-probe-unsigned.ipa.sha256
            keyframe-index-report.log
            keyframe-symbols.log
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build140 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.73-build140-keyframe-native-seek-probe-diagnostics
          path: |
            keyframe-index-report.log
            keyframe-symbols.log
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: warn
          retention-days: 14
