name: Apply Transport v3 Core

on:
  push:
    branches: [chatgpt/v0.11.0-transport-v3]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.11.0-transport-v3
      - name: Apply Transport v3 core migration
        run: |
          set -euo pipefail
          python3 scripts/apply_transport_v3_core.py
          if git diff --quiet; then
            echo "Transport v3 core already applied"
            exit 0
          fi
          git config user.name "ChatGPT CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources/Transport/UnifiedMediaTransportSession.swift Sources/Player/PlaybackOrchestrator.swift Sources/Player/PlayerEngine.swift Sources/Player/PlayerController.swift Sources/Player/MPVPlayerEngine.swift Sources/Core/AppIdentity.swift Config/Info.plist project.yml
          git commit -m "Transport v3: route automatic playback through persistent unified IO"
          git push origin HEAD:chatgpt/v0.11.0-transport-v3
