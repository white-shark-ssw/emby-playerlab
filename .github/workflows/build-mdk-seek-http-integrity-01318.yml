name: Build OnePlayer 0.13.18 MDK Seek HTTP Integrity

on:
  push:
    branches: [feat/recovery-isolation-0.13.17]
    paths:
      - .github/workflows/build-mdk-seek-http-integrity-01318.yml

concurrency:
  group: mdk-seek-http-integrity-01318-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recovery-isolation-0.13.17

      - name: Record Build85 run id
        run: |
          set -euo pipefail
          mkdir -p .ci
          printf 'run_id=%s\ntrigger_commit=%s\n' '${{ github.run_id }}' '${{ github.sha }}' > .ci/build85-run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ci/build85-run.txt
          git commit -m 'ci: record Build85 workflow run' || true
          git push origin HEAD:feat/recovery-isolation-0.13.17

      - name: Verify Build85 MDK seek and resume architecture
        run: |
          set -euo pipefail
          test "$(git hash-object Sources/UI/BufferedTimelineSlider.swift)" = '4c0c772d104fb6b1537e9d89604acbc563114f62'
          grep -q 'MDKSeekHTTP.*preserve-existing-stream-before-native-seek' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          ! grep -Fq 'resetClientStreams(reason: "mdk-seek-\(intent.id)")' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'resetClientStreams(reason: "mdk-seek-wedge-\(reason)")' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'TransportHTTPIntegrity' Sources/Transport/TransportHTTPServer.swift
          grep -Fq 'terminationReason = "task-cancelled"' Sources/Transport/TransportHTTPServer.swift
          grep -Fq '!hasPlaybackPositionOverride' Sources/UI/EmbyMediaDetailView.swift
          grep -Fq 'if hasPlaybackPositionOverride { return episodes.first }' Sources/UI/EmbyMediaDetailView.swift
          grep -Fq 'resume override cleared child item=' Sources/UI/EmbyMediaDetailView.swift
          grep -Fq 'PrematureEOFRecoveryCoordinator' Sources/Player/PrematureEOFRecoveryCoordinator.swift
          grep -Fq 'maximumPendingEvents = 2_048' Sources/Diagnostics/DiagnosticsLogger.swift
          grep -Fq 'MARKETING_VERSION: "0.13.18"' project.mdklab.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "85"' project.mdklab.yml
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml

      - name: Select Xcode and tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodebuild -version
          swift --version

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build OnePlayer 0.13.18 Build85
        id: release_build
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.18-build85-mdk-seek-http-integrity-release-diagnostics
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report compiler failure
        if: steps.release_build.outcome == 'failure'
        run: |
          set -euo pipefail
          grep -nE '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|SwiftCompile|CompileSwift' build.log | tail -250 || true
          tail -120 build.log || true
          exit 1

      - name: Validate app identity and minimum OS
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.18' --build '85' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.18-build85-mdk-seek-http-integrity-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload final test package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.18-build85-mdk-seek-http-integrity
          path: |
            OnePlayer-0.13.18-build85-mdk-seek-http-integrity-unsigned.ipa
            OnePlayer-0.13.18-build85-mdk-seek-http-integrity-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
          if-no-files-found: error
          retention-days: 14

      - name: Record successful Build85 receipt
        run: |
          set -euo pipefail
          SHA_LINE="$(cat OnePlayer-0.13.18-build85-mdk-seek-http-integrity-unsigned.ipa.sha256)"
          printf 'run_id=%s\ncommit=%s\nsha256=%s\n' '${{ github.run_id }}' '${{ github.sha }}' "$SHA_LINE" > .ci/build85-success.txt
          git add .ci/build85-success.txt
          git commit -m 'ci: record Build85 successful artifact' || exit 0
          git push origin HEAD:feat/recovery-isolation-0.13.17
