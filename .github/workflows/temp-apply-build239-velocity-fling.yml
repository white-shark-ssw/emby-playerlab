name: TEMP Apply Build239 Velocity Fling

on:
  push:
    branches: [perf/home-carousel-velocity-fling-build239]
    paths: [.github/build239-apply-trigger.txt]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build239 branch
        uses: actions/checkout@v4
        with:
          ref: perf/home-carousel-velocity-fling-build239
          fetch-depth: 0
      - name: Apply Build239 compile-only Hero call fix
        run: python3 scripts/temp_apply_build239_velocity_fling.py
      - name: Commit Build239 compile-only fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Sources/UI/EmbyHomeHeroV3.swift
          git diff --cached --quiet && { echo 'No Build239 compile fix produced'; exit 1; }
          git commit -m "Carousel: align Hero release velocity call"
          git push origin HEAD:perf/home-carousel-velocity-fling-build239
