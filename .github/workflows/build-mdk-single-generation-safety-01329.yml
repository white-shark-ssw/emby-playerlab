name: Build OnePlayer 0.13.29 MDK Single Generation Safety

on:
  pull_request:
    branches: [feat/recovery-isolation-0.13.17]

concurrency:
  group: mdk-single-generation-safety-01329-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'validate/mdk-single-generation-safety-0.13.29'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recovery-isolation-0.13.17
          fetch-depth: 0

      - name: Materialize and audit Build96 single-generation safety
        run: |
          set -euo pipefail
          python3 scripts/materialize_mdk_single_generation_safety_01329.py
          git diff --check
          grep -Fq 'action=quarantine-session-switch-mpv' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'sameProcessMDKRebuild=false' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'MDK session unsafe seek failure' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'MDK session unsafe premature EOF' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'sessionUnsafe=true action=switch-mpv-immediate' Sources/Player/PlaybackOrchestrator.swift
          grep -Fq 'private let renderStateDispatchInterval: TimeInterval = 1.0 / 30.0' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'multipleRequests=1 shortSeekSize=' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'reconnect=off-localhost' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'transport=preserve-live-unified settleMs=0 fastFallback=true' Sources/Player/PlayerController.swift
          grep -Fq 'MARKETING_VERSION: "0.13.29"' project.mdklab.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "96"' project.mdklab.yml
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          grep -Fq 'sourceVersion = "0.13.29"' Sources/Core/AppIdentity.swift
          python3 - <<'PY'
          from pathlib import Path
          engine = Path('MDKLab/App/MDKKSAVIOPlayerEngine.swift').read_text()
          orchestrator = Path('Sources/Player/PlaybackOrchestrator.swift').read_text()
          assert 'action=rebuild-responsive-mdk-generation' not in engine
          assert 'action=quarantine-eos-generation-and-rebuild' not in engine
          assert 'self.recoverWedgedSeek(reason: "negative-callback-' not in engine
          assert 'reload(at: position)' not in engine[engine.index('func recoverStall'):engine.index('func transportMetrics')]
          assert 'normalized.contains("mdk session unsafe")' in orchestrator
          print('Build96 same-session MDK rebuild paths disabled after unsafe failure')
          PY

      - name: Select Xcode and tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodebuild -version
          swift --version

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build OnePlayer 0.13.29 Build96
        id: release_build
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.29-build96-mdk-single-generation-safety-release-diagnostics
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report compiler failure
        if: steps.release_build.outcome == 'failure'
        run: |
          set -euo pipefail
          grep -nE '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|SwiftCompile|CompileSwift|EmitSwiftModule' build.log | tail -300 || true
          tail -180 build.log || true
          exit 1

      - name: Validate app identity and minimum OS
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.29' --build '96' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.29-build96-mdk-single-generation-safety-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload final test package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.29-build96-mdk-single-generation-safety
          path: |
            OnePlayer-0.13.29-build96-mdk-single-generation-safety-unsigned.ipa
            OnePlayer-0.13.29-build96-mdk-single-generation-safety-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
          if-no-files-found: error
          retention-days: 14

      - name: Persist validated Build96 source to experiment branch
        continue-on-error: true
        run: |
          set -euo pipefail
          git diff -- MDKLab/App/MDKKSAVIOPlayerEngine.swift Sources/Player/PlaybackOrchestrator.swift Sources/Core/AppIdentity.swift project.mdklab.yml > /tmp/build96-runtime.patch
          if test ! -s /tmp/build96-runtime.patch; then
            echo 'Build96 source already materialized.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin feat/recovery-isolation-0.13.17
          git reset --hard origin/feat/recovery-isolation-0.13.17
          git apply --3way /tmp/build96-runtime.patch
          git add MDKLab/App/MDKKSAVIOPlayerEngine.swift Sources/Player/PlaybackOrchestrator.swift Sources/Core/AppIdentity.swift project.mdklab.yml
          git diff --cached --check
          git commit -m 'fix: quarantine unsafe MDK session instead of rebuilding player'
          git push origin HEAD:feat/recovery-isolation-0.13.17
