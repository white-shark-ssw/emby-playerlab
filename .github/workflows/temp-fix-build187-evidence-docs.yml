name: Temp fix Build187 evidence docs

on:
  push:
    branches: [perf/home-carousel-native-touch-build189-from187]
    paths:
      - ".github/workflows/temp-fix-build187-evidence-docs.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct stale Build187 evidence labels
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('docs/project/current/dev/DEV-home-carousel-drag-smoothness.md')
          s = p.read_text()
          old = '- validation: **Code written / CI passed / IPA produced / real-device pending / not stable**.'
          new = '- validation: **Code written / CI passed / IPA produced / real-device tested / diagnostic gate confirmed / not stable**.'
          if old not in s:
              raise SystemExit('checkpoint stale Build187 validation line not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('docs/project/TECHNICAL_DECISIONS.md')
          s = p.read_text()
          old = 'Evidence: Build185 = **real-device rejected**; Build186 = **CI/IPA, not distributed for diagnosis**; Build187 = **Code written / CI passed / IPA produced / real-device pending / not stable**.'
          new = 'Evidence: Build185 = **real-device rejected**; Build186 = **CI/IPA, not distributed for diagnosis**; Build187 = **Code written / CI passed / IPA produced / real-device tested / diagnostic gate confirmed / not stable**.'
          if old not in s:
              raise SystemExit('D012 stale Build187 evidence line not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name "OnePlayer Docs Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md docs/project/TECHNICAL_DECISIONS.md
          git commit -m "Correct Build187 diagnostic evidence labels"
          git push origin HEAD:main
