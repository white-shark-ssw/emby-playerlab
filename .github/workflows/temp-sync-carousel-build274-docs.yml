name: Sync carousel Build271 device and Build274 docs

on:
  push:
    branches: [docs/carousel-build271-device-build274-20260831]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          path: helper

      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: work

      - name: Patch current project docs
        run: |
          set -euo pipefail
          cp helper/scripts/temp_sync_carousel_build274_docs.py work/temp_sync_carousel_build274_docs.py
          cd work
          python3 temp_sync_carousel_build274_docs.py
          rm temp_sync_carousel_build274_docs.py

      - name: Verify docs-only scope
        run: |
          set -euo pipefail
          cd work
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/current/dev/DEV-home-carousel-drag-smoothness.md | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          grep -F 'Build271 target-device pipeline result — 2026-08-31' docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          grep -F 'Build274 / 0.15.7 — full carousel-tree 120 Hz probe' docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          grep -F '| **Build274 / 0.15.7** | Full real carousel-tree device-max progress probe |' docs/project/BUILD_TEST_INDEX.md
          grep -F 'carousel Build273 is invalid/retired because poster-grid had already allocated Build273' docs/project/TECHNICAL_DECISIONS.md

      - name: Commit docs to main
        run: |
          set -euo pipefail
          cd work
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          git commit -m 'Record Build271 device evidence and Build274 probe [skip ci]'
          git push origin HEAD:main
