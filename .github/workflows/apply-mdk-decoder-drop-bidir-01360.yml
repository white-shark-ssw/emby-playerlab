name: Apply MDK Decoder Drop Bidir 0.13.60

on:
  push:
    branches: [diag/mdk-decoder-drop-bidir-0.13.60]
    paths:
      - "scripts/migrate_mdk_decoder_drop_bidir_01360.py"
      - ".github/workflows/apply-mdk-decoder-drop-bidir-01360.yml"
      - "Sources/Core/AppIdentity.swift"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/mdk-decoder-drop-bidir-0.13.60
          fetch-depth: 0
      - name: Apply bidir decoder-drop experiment
        run: |
          set -euo pipefail
          python3 scripts/migrate_mdk_decoder_drop_bidir_01360.py
          grep -Fq 'value: "drop=bidir"' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'value: "drop=auto"' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'accurate-incache-bidir' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'scope=relative-native-seek-only' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'dispatchedIntent.fastPreview ? .AccurateFromStartInCache : .FromStart' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'swift_mdk.logLevel = .All' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'sourceVersion = "0.13.60"' Sources/Core/AppIdentity.swift
          git diff --check
      - name: Commit Build127 runtime source
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No runtime source change required'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MDKLab/App/MDKKSAVIOPlayerEngine.swift
          git commit -m 'mdk: test bidir decoder drop during relative accurate seek'
          git push origin HEAD:diag/mdk-decoder-drop-bidir-0.13.60
