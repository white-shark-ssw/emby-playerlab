name: Temp Sync Build228 Poster Evidence Docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sync-build228-poster-docs.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact docs base
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "ec2afba9a0803b1633d98a20710236127841bd79"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/temp-sync-build228-poster-docs.yml"

      - name: Sync Build228 project evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          SOURCE = "20f0edaf30c3c9161a79f64fd29dbc79c199473e"
          RUN = "33154400536"
          BUILD_JOB = "98793625194"
          CLEANUP_JOB = "98794424866"
          ARTIFACT_ID = "9679088491"
          ARTIFACT = "OnePlayer-0.14.61-build228-poster-timing-diagnostics"
          ARTIFACT_SHA = "5707ec64fc70e4a4d59ac3ee44ee4532b1fe7a8e6d1e325cbcd81c1f867847cf"
          IPA_SHA = "538b84bf03c0fb6c0887cf780f8cf8d0a31ae137005a937bd2e89e89cbb6771f"
          SOURCE_SHA = "f7f02b26b6a2dc2b56e075c5696da308d88902b2ab9e3f0d10198c36adc01234"

          def replace_unique(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def insert_before_unique(path, marker, block):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f"{path}: expected one marker, got {count}: {marker!r}")
              p.write_text(text.replace(marker, block + "\n\n" + marker, 1), encoding="utf-8")

          def insert_after_table_row_prefix(path, prefix, row):
              p = Path(path)
              lines = p.read_text(encoding="utf-8").splitlines()
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f"{path}: expected one row prefix {prefix!r}, got {len(matches)}")
              if row in lines:
                  raise SystemExit(f"{path}: Build228 row already present")
              lines.insert(matches[0] + 1, row)
              p.write_text("\n".join(lines) + "\n", encoding="utf-8")

          # Current work checkpoint.
          checkpoint = "docs/project/current/dev/DEV-poster-grid-smoothness.md"
          p = Path(checkpoint)
          lines = p.read_text(encoding="utf-8").splitlines()
          status_indices = [i for i, line in enumerate(lines) if line.startswith("**Active — Build220 / 0.14.53")]
          if len(status_indices) != 1:
              raise SystemExit("poster checkpoint status anchor mismatch")
          lines[status_indices[0]] = "**Active — Build228 / 0.14.61 measurement-only candidate is exact-source CI/IPA verified and awaits target-device diagnostics. Build220 remains the controlling real-device A/B result: the intended 3×3 route felt ‘基本一样’, so the UIKit observation bypass is rejected as a sufficient smoothness fix. Build228 does not add another smoothing patch; it measures the still-unobserved MainActor image publish → Combine sink → UIKit image adoption path and separately measures library pagination apply + synchronous persistent snapshot write. Real-device result is pending; not stable.**"
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")

          build228_block = f"""## Build228 / 0.14.61 — MainActor image/pagination timing diagnostics

Build228 is the measurement-only successor required by the Build220 target-device result. Build227 / 0.14.60 is owned by the independent Home-carousel task, so poster diagnostics use the next verified-free identity.

- exact tested source: **`{SOURCE}`**
- branch / Draft PR: `perf/poster-grid-smoothness` / #259
- exact Build220→Build228 source/check delta before the changelog commit: `AppIdentity`, `EmbyServerBrowseV3`, `EmbySharedImageAndNavigation`, poster checker; Build228 source snapshot also includes its changelog
- no `EmbyHomeCoreV3.swift`, `EmbyHomeHeroV3.swift`, `EmbyHomeCarouselStateV3.swift`, `EmbyHomeCarouselInteractionV3.swift`, Player, MPV, PiP, UnifiedTransport, playback Cache or Emby Session changes
- existing image loading/cache/decode/request sizing, UIKit surface behavior, poster layout, native navigation, page ownership, persistence behavior and scroll physics remain unchanged
- deployment target remains iOS 15.0

### Measurement contract

The existing motion-gated `PosterScrollHitch` detector remains unchanged. Only when it reports a >=30 ms moving-frame gap, Build228 emits a paired `PosterScrollTiming` record containing:

- synchronous `@Published image` publication duration;
- publish-start → Combine sink start;
- UIKit surface `setImage` duration;
- publish-start → surface completion;
- library page apply duration plus reset/start/received/applied counts;
- existing synchronous persistent snapshot duration after page apply.

This closes the Build220 timing blind spot without changing runtime smoothing behavior. It is diagnostic evidence only, not a fix.

### CI / IPA evidence

- exact-source run / build job: **`{RUN} / {BUILD_JOB}` — success**
- cleanup job: **`{CLEANUP_JOB}` — success**; one-shot workflow removed from `main`
- Xcode 16.4 Release build: PASS
- bundle identity: `com.embyplayerlab.app`, OnePlayer **0.14.61 (228)**
- built `MinimumOSVersion=15.0`; runtime MinOS audit PASS
- artifact: `{ARTIFACT}`; ID **`{ARTIFACT_ID}`**
- GitHub artifact digest / independently downloaded artifact ZIP SHA-256: **`{ARTIFACT_SHA}`**
- IPA SHA-256: **`{IPA_SHA}`**
- source ZIP SHA-256: **`{SOURCE_SHA}`**
- artifact ZIP, IPA and source ZIP integrity independently verified; embedded checksum files match independent calculation
- `tested-source.txt` independently verified as `{SOURCE}`
- source snapshot independently confirms `PosterScrollTiming`, publish/surface timing, page apply/snapshot timing, and contains no Build228 temporary workflow

**Build228 evidence: Code written ✅ / exact scope+checker ✅ / CI passed ✅ / IPA produced+independently verified ✅ / target-device tested ❌ / smoothness improvement not claimed / stable or frozen ❌.**

### Next target-device action

Install Build228 on iPhone 15 Pro Max / iOS 17.0 and repeat the same library 3×3 drag path used for Build220. Reproduce visible hitches both while fresh 378px posters are arriving and around long-list load-ahead/pagination, then export the App diagnostic log. Correlate each `PosterScrollHitch` with the paired `PosterScrollTiming`:

1. high/fresh `publish_duration_ms`, `publish_to_sink_ms`, `surface_set_ms` or `publish_to_surface_ms` supports the MainActor image-adoption path;
2. high/fresh `page_apply_duration_ms` supports page result application;
3. high/fresh `snapshot_duration_ms` supports synchronous presentation-cache persistence for that sample;
4. if all three groups are low or stale at the hitch, provisionally clear these measured paths and move measurement elsewhere rather than adding a speculative performance patch.

Build212 remains the historical guardrail: persistent page cache cannot explain every 3×3 hitch because that hitch family predates Build213."""
          insert_before_unique(checkpoint, "## Parallel safety", build228_block)

          # Replace the now-completed old next-action section without rewriting history above it.
          p = Path(checkpoint)
          text = p.read_text(encoding="utf-8")
          start = text.find("## Next exact action\n")
          end = text.find("\n## Do not repeat", start)
          if start == -1 or end == -1:
              raise SystemExit("poster checkpoint next-action section anchors missing")
          next_section = """## Next exact action

1. Install Build228 / 0.14.61 from artifact `OnePlayer-0.14.61-build228-poster-timing-diagnostics` on iPhone 15 Pro Max / iOS 17.0.
2. Repeat the same Library 3×3 dragging path as Build220, including fresh poster arrival and the `StartIndex` load-ahead/pagination boundary.
3. Export the App log and pair every `PosterScrollHitch` with its adjacent `PosterScrollTiming` record.
4. Decide the next code change only from those timings. Do not add another smoothing/pacing/cache candidate until the measured MainActor image-adoption and pagination/persistence costs are separated.
5. Keep Home-carousel ownership separate and do not touch Player / Transport / playback Cache / Session P0 contracts."""
          p.write_text(text[:start] + next_section + text[end:], encoding="utf-8")

          # MODULE_STATUS: update only the poster row and parallel summary row.
          module = "docs/project/MODULE_STATUS.md"
          p = Path(module)
          lines = p.read_text(encoding="utf-8").splitlines()
          poster_idx = [i for i, line in enumerate(lines) if line.startswith("| Poster 3-column / poster-heavy scroll smoothness |")]
          if len(poster_idx) != 1:
              raise SystemExit("MODULE_STATUS poster row anchor mismatch")
          lines[poster_idx[0]] = f"| Poster 3-column / poster-heavy scroll smoothness | **Active — Build228 measurement-only CI/IPA verified; target-device timing test pending** | Build220 remains the controlling real-device result: intended 3×3 scrolling felt **‘基本一样’**, rejecting the UIKit surrounding-observation bypass as sufficient. Build228 / 0.14.61 exact source `{SOURCE}` adds no new smoothing behavior; it measures MainActor `@Published image` publication → Combine sink → UIKit image adoption and separately library page apply + synchronous persistent snapshot duration, emitted as paired `PosterScrollTiming` only when the existing motion-gated >=30 ms hitch detector fires. Run/job `{RUN} / {BUILD_JOB}` succeeded; artifact `{ARTIFACT_ID}`; IPA SHA-256 `{IPA_SHA}`; source ZIP SHA-256 `{SOURCE_SHA}`; MinOS 15.0 and artifact/source integrity independently verified. Real-device pending; not stable. |"
          other_idx = [i for i, line in enumerate(lines) if line.startswith("| Other product modules |")]
          if len(other_idx) != 1:
              raise SystemExit("MODULE_STATUS other-product row anchor mismatch")
          lines[other_idx[0]] = "| Other product modules | Active parallel work | Build216 / 0.14.49 remains the latest accepted overall runtime baseline. Home-carousel Build226 is materially positive and Build227 is the current CI/IPA-verified foreground text-presentation A/B pending target-device test. Poster-scroll Build228 is a separate measurement-only CI/IPA-verified candidate pending target-device timing logs. Build227 and Build228 ownership remains separated; neither changes Player/Transport/playback Cache/Session P0/Frozen source. |"
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")

          # BUILD_TEST_INDEX: add milestone row after Build227 without disturbing chronology/history.
          build_index = "docs/project/BUILD_TEST_INDEX.md"
          build228_row = f"| **Build228 / 0.14.61** | Poster-grid MainActor image/pagination timing diagnostics | **Exact-source CI/IPA verified; target-device pending; diagnostic only, not stable.** Exact source `{SOURCE}`; run/build job `{RUN} / {BUILD_JOB}`; cleanup job `{CLEANUP_JOB}` success; artifact `{ARTIFACT_ID}` (`{ARTIFACT}`), artifact SHA-256 `{ARTIFACT_SHA}`, IPA SHA-256 `{IPA_SHA}`, source ZIP SHA-256 `{SOURCE_SHA}`, MinOS 15.0. Adds paired `PosterScrollTiming` for synchronous image publish→Combine→UIKit adoption and library page apply/persistent snapshot timing without changing smoothing behavior. Build220 real-device ‘基本一样’ remains the controlling A/B result. |"
          insert_after_table_row_prefix(build_index, "| **Build227 / 0.14.60**", build228_row)

          # PROJECT_STATE: preserve accepted baseline and carousel authority; add Build228 poster evidence.
          project = "docs/project/PROJECT_STATE.md"
          p = Path(project)
          lines = p.read_text(encoding="utf-8").splitlines()
          if not lines or not lines[2].startswith("_Last updated after"):
              raise SystemExit("PROJECT_STATE header anchor mismatch")
          lines[2] = "_Last updated after Build228 / 0.14.61 poster timing diagnostics reached exact-source CI/IPA verification. Build216 remains the accepted overall runtime baseline. Home-carousel Build227 remains a separate CI/IPA-verified A/B pending target-device testing. Poster Build220 remains the controlling real-device rejection (‘基本一样’); Build228 adds measurement only and awaits target-device timing logs._"
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")

          old_next = "Next: make the next poster build diagnostic-only. Measure MainActor image-assignment duration including synchronous Combine→`UIImageView` delivery and publish bursts, and separately measure pagination result application plus persistent snapshot serialization/write. Do not introduce another smoothing patch until those costs are separated. Home remains owned by the independent carousel task."
          new_next = f"""Build228 / 0.14.61 now implements exactly that measurement-only step. Exact tested source **`{SOURCE}`**; dedicated run/build job **`{RUN} / {BUILD_JOB}`** succeeded; artifact **`{ARTIFACT_ID}`** (`{ARTIFACT}`); independently verified IPA SHA-256 `{IPA_SHA}`, source ZIP SHA-256 `{SOURCE_SHA}`, built MinOS 15.0. The existing hitch detector is unchanged and emits paired `PosterScrollTiming` data for synchronous MainActor image publication→Combine→UIKit adoption plus library page apply and persistent snapshot timing. No smoothing behavior is changed. Evidence: **Code written / exact scope+checker / CI passed / IPA produced+independently verified / target-device pending / not stable**.

Next: install Build228 on iPhone 15 Pro Max / iOS 17.0, repeat the Build220 3×3 drag + fresh-poster + pagination-boundary reproduction, export the App log, and correlate each `PosterScrollHitch` with its paired `PosterScrollTiming`. Do not make another performance patch until those measurements identify or clear the remaining MainActor image/pagination paths. Home remains owned by the independent carousel task."""
          replace_unique(project, old_next, new_next)
          PY

      - name: Validate docs-only scope and commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          checkpoint = Path('docs/project/current/dev/DEV-poster-grid-smoothness.md').read_text(encoding='utf-8')
          module = Path('docs/project/MODULE_STATUS.md').read_text(encoding='utf-8')
          index = Path('docs/project/BUILD_TEST_INDEX.md').read_text(encoding='utf-8')
          state = Path('docs/project/PROJECT_STATE.md').read_text(encoding='utf-8')
          for needle in ['20f0edaf30c3c9161a79f64fd29dbc79c199473e', 'Build228 evidence: Code written ✅', 'PosterScrollTiming']:
              if needle not in checkpoint: raise SystemExit(f'missing checkpoint evidence: {needle}')
          if 'Build228 measurement-only CI/IPA verified' not in module: raise SystemExit('missing module status')
          if index.count('| **Build228 / 0.14.61** |') != 1: raise SystemExit('Build228 index row mismatch')
          if 'Build228 / 0.14.61 now implements exactly that measurement-only step' not in state: raise SystemExit('missing project state evidence')
          PY
          git rm .github/workflows/temp-sync-build228-poster-docs.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/current/dev/DEV-poster-grid-smoothness.md .github/workflows/temp-sync-build228-poster-docs.yml | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/current/dev/DEV-poster-grid-smoothness.md
          git commit -m "Docs: record Build228 poster timing baseline [skip ci]"
          git push origin HEAD:main
