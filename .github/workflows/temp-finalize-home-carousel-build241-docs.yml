name: TEMP Finalize Home Carousel Build241 Docs

on:
  push:
    branches:
      - docs/finalize-home-carousel-build241

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: docs/finalize-home-carousel-build241
          fetch-depth: 0

      - name: Reset worktree to current main but keep helper script
        run: |
          set -euo pipefail
          cp scripts/temp_finalize_home_carousel_docs.py /tmp/finalize_carousel_docs.py
          git fetch origin main
          git checkout --detach origin/main
          cp /tmp/finalize_carousel_docs.py scripts/temp_finalize_home_carousel_docs.py

      - name: Finalize carousel project documentation
        run: |
          set -euo pipefail
          python3 scripts/temp_finalize_home_carousel_docs.py
          rm scripts/temp_finalize_home_carousel_docs.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project
          git diff --cached --check
          git diff --cached --name-status
          git commit -m 'Finalize Build241 Home carousel project state'
          git push origin HEAD:main
