name: Temp sync Build220 poster with accepted main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sync-build220-poster.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync exact Build220 poster candidate onto accepted Build216 main
        shell: bash
        run: |
          set -euo pipefail
          BASE_MAIN=6a3f52bd8b91995a01f0c908887ffb375d8ec737
          OLD_POSTER=2c23b4d6c85d579e8cdd84afa61fa64530f44170
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main perf/poster-grid-smoothness
          test "$(git rev-parse origin/perf/poster-grid-smoothness)" = "$OLD_POSTER"
          if git branch -r | grep -Ei '/[^ ]*build220' | grep -v 'perf/poster-grid-smoothness'; then
            echo 'Build220 branch identity collision detected' >&2
            exit 1
          fi
          if git grep -n 'Build220' origin/main -- docs/project/current/dev docs/project/BUILD_TEST_INDEX.md 2>/dev/null | grep -v 'DEV-poster-grid-smoothness'; then
            echo 'Build220 project identity collision detected' >&2
            exit 1
          fi
          git checkout -B perf/poster-grid-smoothness origin/perf/poster-grid-smoothness
          set +e
          git merge --no-commit "$BASE_MAIN"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            printf 'merge conflicts:\n%s\n' "$conflicts"
            test "$conflicts" = "Sources/Core/AppIdentity.swift"
            git checkout --ours Sources/Core/AppIdentity.swift
            git add Sources/Core/AppIdentity.swift
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          rm -f docs/changelog/CHANGELOG_v0_14_52_build219.md
          git add -A
          git commit -m "Sync Build220 poster candidate with accepted main"
          python3 scripts/check_poster_grid_smoothness.py
          git diff --check "$BASE_MAIN" HEAD
          actual="$(git diff --name-only "$BASE_MAIN" HEAD | sort)"
          expected="$(printf '%s\n' \
            Sources/Core/AppIdentity.swift \
            Sources/UI/EmbyPersonMediaView.swift \
            Sources/UI/EmbyPosterGrid.swift \
            Sources/UI/EmbyServerSharedV3.swift \
            Sources/UI/EmbySharedImageAndNavigation.swift \
            docs/changelog/CHANGELOG_v0_14_53_build220.md \
            scripts/check_poster_grid_smoothness.py | sort)"
          printf 'Build220 tree diff:\n%s\n' "$actual"
          test "$actual" = "$expected"
          grep -F 'static let sourceVersion = "0.14.53"' Sources/Core/AppIdentity.swift
          grep -F 'backgroundColor = image == nil ? .secondarySystemBackground : .clear' Sources/UI/EmbySharedImageAndNavigation.swift
          for forbidden in Sources/UI/EmbyHomeCoreV3.swift Sources/UI/EmbyHomeHeroV3.swift Sources/UI/EmbyHomeCarouselStateV3.swift Sources/UI/EmbyHomeCarouselInteractionV3.swift Sources/Player Sources/Transport; do
            if printf '%s\n' "$actual" | grep -F "$forbidden"; then exit 1; fi
          done
          git push origin HEAD:perf/poster-grid-smoothness
          git rev-parse HEAD | tee /tmp/build220_head
      - name: Remove one-shot sync helper
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-sync-build220-poster.yml
          git commit -m "Remove Build220 poster sync helper"
          git push origin main
