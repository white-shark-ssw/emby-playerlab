name: Sync carousel Build274 device and Build275 docs

on:
  push:
    branches: [docs/carousel-build274-device-build275-20260831]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: docs/carousel-build274-device-build275-20260831
          path: helper
          fetch-depth: 1

      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          fetch-depth: 0

      - name: Patch current project docs
        working-directory: repo
        run: python3 ../helper/scripts/temp_sync_carousel_build275_docs.py

      - name: Verify docs-only scope
        working-directory: repo
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/current/dev/DEV-home-carousel-drag-smoothness.md | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          grep -F 'CAROUSEL ≈90 / TREE FULL ≈90' docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          grep -F 'Build275 / 0.15.8' docs/project/MODULE_STATUS.md
          grep -F 'Build275 / 0.15.8' docs/project/PROJECT_STATE.md
          grep -F '**Build275 / 0.15.8**' docs/project/BUILD_TEST_INDEX.md
          grep -F '## D023 — Full-tree ceiling reproduced; split the two real transition observer scopes' docs/project/TECHNICAL_DECISIONS.md

      - name: Commit docs to main
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add docs/project
          git commit -m 'Record Build274 device result and Build275 probe [skip ci]'
          git push origin HEAD:main
