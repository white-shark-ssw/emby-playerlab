name: Build OnePlayer 0.13.84 Build151 Playback UI AirPlay PiP

on:
  workflow_dispatch:
  push:
    branches: [feature/playback-transition-airplay-pip-0.13.84]
    paths:
      - "Sources/**"
      - "project.mdklab.yml"
      - "Podfile"
      - ".github/workflows/build151-playback-transition-pip.yml"
  pull_request:
    branches: [fix/enhancement-toggle-stall-0.13.83]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build151-playback-ui-airplay-pip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout Build151 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Build151 UI contracts
        run: |
          set -euo pipefail
          grep -Fq 'sourceVersion = "0.13.84"' Sources/Core/AppIdentity.swift
          python3 - <<'PY'
          from pathlib import Path

          caps = Path('Sources/UI/PlayerExperienceState.swift').read_text()
          mpv_case = caps[caps.index('        case .mpv:'):caps.index('        case .ksAVIO:')]
          mdk_case = caps[caps.index('        case .ksAVIO:'):]
          assert 'supportsSystemRoutePicker: true' in mpv_case
          assert 'supportsPictureInPicture: true' in mpv_case
          assert 'supportsSystemRoutePicker: true' in mdk_case
          assert 'supportsPictureInPicture: true' in mdk_case

          route = Path('Sources/UI/PlayerSystemRoutePicker.swift').read_text()
          assert 'AVRoutePickerView' in route
          assert 'prioritizesVideoDevices = true' in route

          pip = Path('Sources/UI/PlayerPictureInPictureController.swift').read_text()
          for token in ['AVPictureInPictureVideoCallViewController', 'activeVideoCallSourceView:', 'contentViewController:', 'custom renderer source=MPV', 'custom renderer source=MDK']:
              assert token in pip, token

          mpv_surface = Path('Sources/UI/MPVPlayerSurface.swift').read_text()
          assert 'takeDisplayLayerForPictureInPicture' in mpv_surface
          assert 'restoreDisplayLayerAfterPictureInPicture' in mpv_surface
          mdk_surface = Path('Sources/UI/KSAVIOPlayerSurface.swift').read_text()
          assert 'takePlayerViewForPictureInPicture' in mdk_surface
          assert 'restorePlayerViewAfterPictureInPicture' in mdk_surface

          transition = Path('Sources/UI/ResolvedPlaybackFullscreenCover.swift').read_text()
          assert 'Binding<ResolvedPlaybackSource?>' in transition
          assert '.overFullScreen' in transition
          assert '.crossDissolve' in transition

          mpv = Path('Sources/Player/MPVPlayerEngine.swift').read_text()
          seek_start = mpv.index('    func seek(to seconds: Double, direction: SeekDirection)')
          seek_end = mpv.index('\n    private func claimKeyframeLookupIndex()', seek_start)
          seek_body = mpv[seek_start:seek_end]
          assert seek_body.count('self.command(handle, ["seek"') == 1
          assert 'absolute+keyframes' in seek_body
          assert 'absolute+exact' not in seek_body
          PY
          git fetch origin fix/enhancement-toggle-stall-0.13.83 --depth=1
          test -z "$(git diff --name-only origin/fix/enhancement-toggle-stall-0.13.83...HEAD -- Sources/Transport Sources/Player/MPVPlayerEngine.swift Sources/Player/KSAVIOPlayerEngine.swift Sources/Player/PlayerController.swift Sources/Player/PlaybackPresentationCoordinator.swift Sources/Player/PlaybackPresentationAdapters.swift MDKLab)"
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          git diff --check

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Build151 Release
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.84 CURRENT_PROJECT_VERSION=151 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.84' --build '151' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.84-build151-playback-ui-airplay-pip-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build151 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.84-build151-playback-ui-airplay-pip
          path: |
            OnePlayer-0.13.84-build151-playback-ui-airplay-pip-unsigned.ipa
            OnePlayer-0.13.84-build151-playback-ui-airplay-pip-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build151 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.84-build151-playback-ui-airplay-pip-failure
          path: |
            build.log
            package-resolution.log
            app-validation.log
            min-os-report.log
          if-no-files-found: ignore
          retention-days: 14
