name: One-shot Sync Build215 Real-device Result

on:
  push:
    branches: [main]
    paths:
      - ".github/build215-glass-vs-paper-trigger.txt"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Sync Build215 real-device evidence
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 .github/scripts/temp-sync-build215-glass-vs-paper.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/current/dev/DEV-home-carousel-drag-smoothness.md | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          git commit -m "Docs: record Build215 real-device tactile result"
          git push origin HEAD:main
