name: Temporary Build219 Real-device Docs Sync

on:
  push:
    branches: [diag/home-carousel-120hz-request-build219]
    paths:
      - ".github/build219-realdevice-doc-sync-trigger.txt"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact Build219 real-device project docs
        run: |
          set -euo pipefail
          git fetch origin diag/home-carousel-120hz-request-build219
          git show origin/diag/home-carousel-120hz-request-build219:scripts/temp_sync_build219_realdevice_docs.py > /tmp/sync_build219_docs.py
          python3 /tmp/sync_build219_docs.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md
          git commit -m "Docs: record Build219 real-device carousel cadence result"
          git push origin HEAD:main
