name: Apply MPV Portrait and Resume Bootstrap Fix

on:
  push:
    branches: [fix/mpv-portrait-layout-resume-bootstrap]
    paths:
      - '.github/workflows/apply-mpv-portrait-resume-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch MPV viewport diagnostics and resume bootstrap gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          engine_path = Path('Sources/Player/MPVPlayerEngine.swift')
          text = engine_path.read_text()
          old = '''    func setVideoGeometry(panscan: Double, aspectOverride: String?) {
              let clampedPanscan = min(1, max(0, panscan))
              setPropertyAsync(name: "video-unscaled", value: "no")
              setPropertyAsync(name: "video-aspect-override", value: aspectOverride ?? "no")
              setPropertyAsync(name: "panscan", value: String(format: "%.3f", clampedPanscan))
              DiagnosticsLogger.shared.log("MPVVideo", "geometry panscan=\\(String(format: "%.3f", clampedPanscan)) aspect=\\(aspectOverride ?? "source")")
          }
          '''
          new = '''    func setVideoGeometry(panscan: Double, aspectOverride: String?) {
              let clampedPanscan = min(1, max(0, panscan))
              setPropertyAsync(name: "video-unscaled", value: "no")
              setPropertyAsync(name: "video-aspect-override", value: aspectOverride ?? "no")
              setPropertyAsync(name: "panscan", value: String(format: "%.3f", clampedPanscan))
              DiagnosticsLogger.shared.log("MPVVideo", "geometry panscan=\\(String(format: "%.3f", clampedPanscan)) aspect=\\(aspectOverride ?? "source")")
              queue.asyncAfter(deadline: .now() + 0.12) { [weak self] in
                  guard let self, let handle = self.mpv, !self.isStopping else { return }
                  self.logVideoOutputGeometry(handle: handle, reason: "layout")
              }
          }
          '''
          if old not in text:
              raise SystemExit('::error::setVideoGeometry block not found')
          text = text.replace(old, new, 1)

          marker = '''    private func logVideoState(handle: OpaquePointer, reason: String) {
              let width = getStringProperty(handle: handle, name: "width") ?? "nil"
              let height = getStringProperty(handle: handle, name: "height") ?? "nil"
              let dwidth = getStringProperty(handle: handle, name: "dwidth") ?? "nil"
              let dheight = getStringProperty(handle: handle, name: "dheight") ?? "nil"
              let rotate = getStringProperty(handle: handle, name: "video-rotate") ?? "nil"
              let aspect = getStringProperty(handle: handle, name: "video-aspect") ?? "nil"
              let hwdec = getStringProperty(handle: handle, name: "hwdec-current") ?? "nil"
              let params = getStringProperty(handle: handle, name: "video-out-params") ?? getStringProperty(handle: handle, name: "video-params") ?? "nil"
              DiagnosticsLogger.shared.log("MPVVideoState", "reason=\\(reason) size=\\(width)x\\(height) display=\\(dwidth)x\\(dheight) rotate=\\(rotate) aspect=\\(aspect) hwdec=\\(hwdec) params=\\(params)")
          }
          '''
          addition = marker + '''\n    private func logVideoOutputGeometry(handle: OpaquePointer, reason: String) {
              let osdWidth = getStringProperty(handle: handle, name: "osd-width") ?? "nil"
              let osdHeight = getStringProperty(handle: handle, name: "osd-height") ?? "nil"
              let dwidth = getStringProperty(handle: handle, name: "dwidth") ?? "nil"
              let dheight = getStringProperty(handle: handle, name: "dheight") ?? "nil"
              let panscan = getStringProperty(handle: handle, name: "panscan") ?? "nil"
              let aspectOverride = getStringProperty(handle: handle, name: "video-aspect-override") ?? "nil"
              DiagnosticsLogger.shared.log("MPVViewport", "reason=\\(reason) osd=\\(osdWidth)x\\(osdHeight) display=\\(dwidth)x\\(dheight) panscan=\\(panscan) aspectOverride=\\(aspectOverride)")
          }
          '''
          if marker not in text:
              raise SystemExit('::error::logVideoState block not found')
          text = text.replace(marker, addition, 1)
          engine_path.write_text(text)

          transport_path = Path('Sources/Transport/UnifiedMediaTransportSession.swift')
          text = transport_path.read_text()
          marker = '''        let resumeHistoricalDependency: Bool = {
              guard concretePlaybackDemand, !pendingUserSeek, Date() <= initialResumeHistoryGuardUntil, let resumeAnchor = initialResumeAnchorByte else { return false }
              return range.upperBound + initialResumeHistoryDependencyMaxBytes < resumeAnchor
          }()
          '''
          addition = marker + '''        let resumeHeadGuard = awaitingInitialResumeDemand ? initialResumeHeadGuardBytes(resourceLength: resource.contentLength) : 0
          let resumeBootstrapHead = awaitingInitialResumeDemand && concretePlaybackDemand && range.lowerBound < resumeHeadGuard
          if resumeBootstrapHead {
              let boundedUpper = min(resource.contentLength, min(range.upperBound, safeAdd(range.lowerBound, metadataUrgentBlockBytes)))
              let bounded = range.lowerBound..<max(range.lowerBound + 1, boundedUpper)
              DiagnosticsLogger.shared.playback(
                  "Resume",
                  "bootstrap head range=\\(range.lowerBound)-\\(range.upperBound) bounded=\\(bounded.lowerBound)-\\(bounded.upperBound) headGuard=\\(resumeHeadGuard) reason=\\(reason) action=urgent-only-keep-gate"
              )
              if !store.contains(bounded) { installUrgent(range: bounded, metadata: true, reason: "resume-bootstrap-head") }
              scheduleSlots(reason: "resume-bootstrap-head")
              return
          }
          '''
          if marker not in text:
              raise SystemExit('::error::resumeHistoricalDependency block not found')
          text = text.replace(marker, addition, 1)
          old = '''            let resumeHeadGuard = initialResumeHeadGuardBytes(resourceLength: resource.contentLength)
              let resumeAuthority = reason == "byte-offset" || range.lowerBound >= resumeHeadGuard
          '''
          new = '''            let resumeHeadGuard = initialResumeHeadGuardBytes(resourceLength: resource.contentLength)
              let resumeAuthority = range.lowerBound >= resumeHeadGuard
          '''
          if old not in text:
              raise SystemExit('::error::resumeAuthority block not found')
          text = text.replace(old, new, 1)
          transport_path.write_text(text)
          PY

      - name: Commit source fixes
        run: |
          set -euo pipefail
          git config user.name 'oneplayer-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add Sources/Player/MPVPlayerEngine.swift Sources/Transport/UnifiedMediaTransportSession.swift
          git commit -m 'Fix portrait renderer resize and resume bootstrap gating'
          git push origin HEAD:fix/mpv-portrait-layout-resume-bootstrap
