name: Build297 Library Poster Wall Regression and IPA

on:
  push:
    branches: [ci/build297-poster-wall-return-20261007]

permissions:
  contents: read

concurrency:
  group: build297-poster-wall-return
  cancel-in-progress: true

env:
  PRODUCT_SHA: 896bc61ad6972d789ef095f6eb46cbdf1b56301c
  PRODUCT_BRANCH: perf/poster-wall-library-build295
  BASE_SHA: 5064d1897ab0e199d53ed59853d5f9b87e95d422
  DOCK_BASE_SHA: 119ab10eee869488b97415746a0243f51953eba0
  VERSION: 0.15.30
  BUILD_NUMBER: 297

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout and guard exact product source
        run: |
          set -euo pipefail
          git fetch origin "$PRODUCT_BRANCH"
          test "$(git rev-parse "origin/$PRODUCT_BRANCH")" = "$PRODUCT_SHA"
          git checkout --detach "$PRODUCT_SHA"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"

          changed="$(git diff --name-only "$BASE_SHA" "$PRODUCT_SHA" | sort)"
          expected="$(printf '%s\n' Sources/Core/AppIdentity.swift Sources/UI/EmbyServerBrowseV3.swift Sources/UI/EmbyPosterWall.swift Sources/UI/EmbyImagePreparation.swift Sources/UI/EmbyDetailPerformanceState.swift Sources/UI/EmbyMediaDetailView.swift Tests/PosterWallRegression/prepare.py Tests/PosterWallRegression/PosterTests.swift Tests/PosterWallRegression/APIStub.swift Tests/PosterWallRegression/MotionHost.swift Tests/PosterWallRegression/MotionUITests.swift Tests/PosterWallRegression/ReturnHost.swift docs/changelog/CHANGELOG_v0_15_30_build297.md docs/project/current/dev/DEV-poster-grid-smoothness.md | sort)"
          test "$changed" = "$expected"
          git diff --check "$BASE_SHA" "$PRODUCT_SHA"
          python3 scripts/check_server_dock_refactor.py "$DOCK_BASE_SHA"
          grep -F 'static let sourceVersion = "0.15.30"' Sources/Core/AppIdentity.swift
          ! grep -F 'page.foregroundController.view.frame =' Sources/UI/EmbyHomeCarouselNativePresentationV3.swift
          grep -F 'if foreground.center != center' Sources/UI/EmbyHomeCarouselNativePresentationV3.swift
          grep -F 'if pagePairChanged { layoutPages() }' Sources/UI/EmbyHomeCarouselNativePresentationV3.swift
          grep -F 'directionalVelocity >= 500' Sources/UI/EmbyHomeCarouselStateV3.swift
          grep -F 'distanceProgress >= 0.28 || velocityCommit' Sources/UI/EmbyHomeCarouselStateV3.swift
          grep -F 'duration: 0.22' Sources/UI/EmbyHomeCarouselStateV3.swift
          grep -F 'duration: 0.18' Sources/UI/EmbyHomeCarouselStateV3.swift
          grep -F 'duration: 0.62' Sources/UI/EmbyHomeCarouselStateV3.swift
          grep -F 'timeIntervalSince(lastSettledAt) >= 6' Sources/UI/EmbyHomeCarouselStateV3.swift
          grep -F 'iOS: "15.0"' project.yml
          grep -F 'deploymentTarget: "15.0"' project.yml

      - name: Export exact source snapshot
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          SOURCE_ZIP="OnePlayer-${VERSION}-build${BUILD_NUMBER}-poster-wall-return-section-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" "$PRODUCT_SHA"
          shasum -a 256 "$SOURCE_ZIP" | tee "$SOURCE_ZIP.sha256"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Inject package identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          import re
          from pathlib import Path
          version = "0.15.30"
          build = "297"
          info_path = Path("Config/Info.plist")
          with info_path.open("rb") as handle:
              info = plistlib.load(handle)
          info["CFBundleShortVersionString"] = version
          info["CFBundleVersion"] = build
          with info_path.open("wb") as handle:
              plistlib.dump(info, handle, sort_keys=False)
          project_path = Path("project.yml")
          project = project_path.read_text()
          project = re.sub(r'MARKETING_VERSION: "[^"]+"', f'MARKETING_VERSION: "{version}"', project)
          project = re.sub(r'CURRENT_PROJECT_VERSION: "[^"]+"', f'CURRENT_PROJECT_VERSION: "{build}"', project)
          project_path.write_text(project)
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodegen --version
          pod --version

      - name: Guard retained native Dock and carousel evidence
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only 20d52f7706d9abf914facf50359df8ccb336fd09 "$PRODUCT_SHA" -- Tests/ServerDockRegression Sources/UI/ServerDock.swift Sources/UI/EmbyHomeCarouselNativePresentationV3.swift Sources/UI/EmbyHomeCarouselStateV3.swift Sources/UI/EmbyHomeCoreV3.swift Sources/UI/ImmersiveUIComponents.swift Sources/UI/EmbyServerRootViewV3.swift)"
          git show "$GITHUB_SHA:ci/retained-build295-native.log" > fixed-native-tests.log
          grep -F 'Executed 18 tests, with 0 failures' fixed-native-tests.log
          echo "Retained production native sources byte-identical to passing run37474393518/job112306217313. Poster/native dependency guards preserve this passing evidence."

      - name: Run old-policy negative control
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 Tests/PosterWallRegression/prepare.py "$PWD" "$RUNNER_TEMP/PosterWallRegression"
          xcodegen generate --spec "$RUNNER_TEMP/PosterWallRegression/project.yml"
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if runtime.endswith("iOS-18-5") for x in devices if x["name"] == "iPhone 16 Pro Max"))')"
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ['RUNNER_TEMP']) / 'PosterWallRegression/LibraryModel.swift'
          text = path.read_text()
          guard = '        if tab == .items && liveItemsSortBy == sortBy { return }\n'
          assert text.count(guard) == 1
          path.write_text(text.replace(guard, ''))
          PY
          cd "$RUNNER_TEMP/PosterWallRegression"
          set +e
          xcodebuild test -project PosterWallRegression.xcodeproj -scheme PosterWallRegression -only-testing:PosterWallRegression/PosterWallTests/testSameLivePageReappearancePreservesItemsRevisionReplacementAndFrontier -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$GITHUB_WORKSPACE/poster-return-negative.log"
          negative=${PIPESTATUS[0]}
          set -e
          test "$negative" -ne 0
          grep -E 'testSameLivePageReappearancePreservesItemsRevisionReplacementAndFrontier.*started' "$GITHUB_WORKSPACE/poster-return-negative.log"
          grep -F 'XCTAssertEqual failed' "$GITHUB_WORKSPACE/poster-return-negative.log"
          grep -E 'Executed 1 test, with [1-9][0-9]* failures' "$GITHUB_WORKSPACE/poster-return-negative.log"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Run actual-source 16 unit tests
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 Tests/PosterWallRegression/prepare.py "$PWD" "$RUNNER_TEMP/PosterWallRegression"
          cd "$RUNNER_TEMP/PosterWallRegression"
          set +e
          xcodebuild test -project PosterWallRegression.xcodeproj -scheme PosterWallRegression -only-testing:PosterWallRegression -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$GITHUB_WORKSPACE/poster-native-tests.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" = 0
          grep -F 'Executed 16 tests, with 0 failures' "$GITHUB_WORKSPACE/poster-native-tests.log"
      - name: Run actual-source 3 native UI tests
        timeout-minutes: 12
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/PosterWallRegression"
          set +e
          xcodebuild test -project PosterWallRegression.xcodeproj -scheme PosterMotionUITests -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$GITHUB_WORKSPACE/poster-motion-ui-tests.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" = 0
          grep -F 'Executed 3 tests, with 0 failures' "$GITHUB_WORKSPACE/poster-motion-ui-tests.log"

      - name: Prepare project and dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build unsigned app
        run: |
          set -uo pipefail
          rm -rf build
          set +e
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -n -E '(^|[[:space:]])error:|SwiftCompile|CompileSwift' build.log | tail -n 240 > compiler-errors.txt || true
            echo '===== Build297 compiler diagnostics ====='
            cat compiler-errors.txt
            exit "$status"
          fi

      - name: Upload Build297 compiler diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.15.30-build297-compiler-diagnostics
          path: |
            compiler-errors.txt
            build.log
            fixed-native-tests.log
            poster-return-negative.log
            poster-native-tests.log
            poster-motion-ui-tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: Validate identity and minimum OS
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id com.embyplayerlab.app --version "$VERSION" --build "$BUILD_NUMBER" --display-name OnePlayer --minimum-os 15.0 --primary-icon OnePlayerIcon --alternate-icon OnePlayerAltIcon
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" 15.0 17.0 min-os-report.log build.log
          /usr/bin/plutil -p "$APP_PATH/Info.plist" | tee built-info-plist.log

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA_NAME="OnePlayer-${VERSION}-build${BUILD_NUMBER}-poster-wall-return-section-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME" | tee package.log
          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload Build297 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.15.30-build297-poster-wall-return-section
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            fixed-native-tests.log
            poster-return-negative.log
            poster-native-tests.log
            poster-motion-ui-tests.log
            built-info-plist.log
            min-os-report.log
            package.log
            build.log
          if-no-files-found: error
          retention-days: 30

