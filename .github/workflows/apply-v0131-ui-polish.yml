name: Apply v0.13.1 UI polish

on:
  push:
    branches: [dev/v0.13.1-ui-polish]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply UI, identity, icon and version fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))

          def replace_all(path, replacements):
              text = read(path)
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"missing expected text in {path}: {old[:100]!r}")
                  text = text.replace(old, new)
              write(path, text)

          # Compact top-level app UI typography.
          replace_all("Sources/UI/AppShellView.swift", [
              ('VStack(alignment: .leading, spacing: 28)', 'VStack(alignment: .leading, spacing: 20)'),
              ('.font(.system(size: 44, weight: .bold))', '.font(.largeTitle.weight(.bold))'),
              ('.padding(.top, 26)', '.padding(.top, 14)'),
              ('.font(.system(size: 21))', '.font(.system(size: 18))'),
              ('.font(.system(size: 20))', '.font(.body)'),
              ('.frame(minHeight: 64)', '.frame(minHeight: 54)'),
          ])

          replace_all("Sources/UI/ServerListView.swift", [
              ('.font(.system(size: 29, weight: .light))', '.font(.system(size: 24, weight: .light))'),
              ('.font(.system(size: 24, weight: .medium))', '.font(.system(size: 20, weight: .medium))'),
              ('.font(.system(size: 44, weight: .bold))', '.font(.largeTitle.weight(.bold))'),
              ('.font(.system(size: 21))', '.font(.system(size: 17))'),
              ('.font(.system(size: 20))\n                            .textInputAutocapitalization', '.font(.body)\n                            .textInputAutocapitalization'),
              ('.font(.system(size: 46, weight: .light))', '.font(.system(size: 38, weight: .light))'),
              ('.font(.system(size: 20, weight: .semibold))', '.font(.headline)'),
              ('.frame(maxWidth: .infinity, minHeight: 154, alignment: .leading)', '.frame(maxWidth: .infinity, minHeight: 132, alignment: .leading)'),
              ('.clipShape(RoundedRectangle(cornerRadius: 20, style: .continuous))', '.clipShape(RoundedRectangle(cornerRadius: 16, style: .continuous))'),
          ])

          # Replace the custom UIViewController-backed refresh container with the native iOS 15 ScrollView refresh path.
          root_path = "Sources/UI/EmbyServerRootView.swift"
          root = read(root_path)
          old_home = '''                RefreshableScrollView(refreshToken: refreshToken, scrollToTopToken: scrollToTopToken, onRefresh: { await model.refresh() }) {
                    LazyVStack(alignment: .leading, spacing: 30) {
                        serverHeader

                        if model.isLoading && model.libraries.isEmpty {
                            ProgressView().frame(maxWidth: .infinity).padding(.top, 80)
                        } else {
                            if !model.libraries.isEmpty {
                                homeSectionTitle("我的媒体")
                                horizontalLibraries
                            }

                            if !model.resumeItems.isEmpty {
                                homeSectionTitle("继续观看")
                                horizontalLandscapeItems(model.resumeItems)
                            }

                            ForEach(model.libraries.prefix(6)) { library in
                                if let items = model.latestByLibrary[library.id], !items.isEmpty {
                                    HStack {
                                        homeSectionTitle(library.name)
                                        Spacer()
                                        NavigationLink("更多", destination: LibraryBrowserView(library: library, client: client))
                                            .foregroundColor(.blue)
                                    }
                                    posterRow(items)
                                }
                            }

                            if let error = model.errorMessage {
                                Text(error)
                                    .font(.footnote)
                                    .foregroundColor(.red)
                                    .padding(.horizontal, 16)
                            }
                        }
                    }
                    .padding(.bottom, 34)
                }'''
          new_home = '''                ScrollViewReader { proxy in
                    ScrollView {
                        LazyVStack(alignment: .leading, spacing: 24) {
                            Color.clear.frame(height: 1).id("home-top")
                            serverHeader

                            if model.isLoading && model.libraries.isEmpty {
                                ProgressView().frame(maxWidth: .infinity).padding(.top, 80)
                            } else {
                                if !model.libraries.isEmpty {
                                    homeSectionTitle("我的媒体")
                                    horizontalLibraries
                                }

                                if !model.resumeItems.isEmpty {
                                    homeSectionTitle("继续观看")
                                    horizontalLandscapeItems(model.resumeItems)
                                }

                                ForEach(model.libraries.prefix(6)) { library in
                                    if let items = model.latestByLibrary[library.id], !items.isEmpty {
                                        HStack {
                                            homeSectionTitle(library.name)
                                            Spacer()
                                            NavigationLink("更多", destination: LibraryBrowserView(library: library, client: client))
                                                .foregroundColor(.blue)
                                                .padding(.trailing, 16)
                                        }
                                        posterRow(items)
                                    }
                                }

                                if let error = model.errorMessage {
                                    Text(error)
                                        .font(.footnote)
                                        .foregroundColor(.red)
                                        .padding(.horizontal, 16)
                                }
                            }
                        }
                        .padding(.bottom, 34)
                    }
                    .refreshable { await model.refresh() }
                    .onChange(of: refreshToken) { _ in Task { await model.refresh() } }
                    .onChange(of: scrollToTopToken) { _ in
                        withAnimation(.easeOut(duration: 0.2)) { proxy.scrollTo("home-top", anchor: .top) }
                    }
                }'''
          if old_home not in root:
              raise SystemExit("home refresh block did not match")
          root = root.replace(old_home, new_home, 1)
          root = root.replace('''                    }
                    serverTabBar''', '''                    }
                    .frame(maxWidth: .infinity, maxHeight: .infinity)
                    serverTabBar''', 1)
          root = root.replace('            .onChange(of: refreshToken) { _ in }\n', '')
          root = root.replace('.font(.system(size: 26, weight: .regular))', '.font(.system(size: 22, weight: .regular))')
          root = root.replace('.font(.system(size: 28))\n                .foregroundColor(.green)', '.font(.system(size: 24))\n                .foregroundColor(.green)', 1)
          root = root.replace('.font(.system(size: 23, weight: .semibold))', '.font(.headline)')
          root = root.replace('.font(.system(size: 27, weight: .bold))', '.font(.title2.weight(.bold))')
          root = root.replace('Text(title).font(.system(size: 40, weight: .bold))', 'Text(title).font(.title2.weight(.bold))')
          root = root.replace('.padding(.top, 16)\n}', '.padding(.top, 8)\n}', 1)
          root = root.replace('.font(.system(size: 17, weight: .medium))', '.font(.subheadline.weight(.medium))')
          root = root.replace('Text(item.name).font(.system(size: 16)).lineLimit(1)', 'Text(item.name).font(.subheadline).lineLimit(1)')
          root = root.replace('.frame(minHeight: 62)', '.frame(minHeight: 54)')
          if 'RefreshableScrollView(' in root:
              raise SystemExit("custom RefreshableScrollView call still present")
          write(root_path, root)
          Path("Sources/UI/RefreshableScrollView.swift").unlink(missing_ok=True)

          # Make every system-facing app name resolve to OS player.
          replace_once("Config/Info.plist", '<key>CFBundleName</key>\n\t<string>$(PRODUCT_NAME)</string>', '<key>CFBundleName</key>\n\t<string>OS player</string>')
          replace_all("Sources/Core/AppIdentity.swift", [
              ('static let clientName = "Emby Player Lab"', 'static let clientName = "OS player"'),
              ('static let sourceVersion = "0.13.0"', 'static let sourceVersion = "0.13.1"'),
              ('?? "0.13.0"', '?? "0.13.1"'),
          ])

          # Version bump keeps iOS/TrollStore system caches from treating this as the same installed build.
          replace_all("project.yml", [
              ('MARKETING_VERSION: "0.13.0"', 'MARKETING_VERSION: "0.13.1"'),
              ('CURRENT_PROJECT_VERSION: "66"', 'CURRENT_PROJECT_VERSION: "67"'),
          ])
          replace_all("Config/Info.plist", [
              ('<string>0.13.0</string>', '<string>0.13.1</string>'),
              ('<string>66</string>', '<string>67</string>'),
          ])

          # Rotate every physical app-icon asset filename so all iOS system surfaces consume one fresh icon generation.
          contents_path = Path("Resources/Assets.xcassets/AppIcon.appiconset/Contents.json")
          contents = json.loads(contents_path.read_text())
          for image in contents.get("images", []):
              filename = image.get("filename")
              if filename:
                  if not filename.startswith("Icon-"):
                      raise SystemExit(f"unexpected app icon filename: {filename}")
                  image["filename"] = "OSIcon-v0131-" + filename[len("Icon-"):]
          contents_path.write_text(json.dumps(contents, indent=2) + "\n")

          Path("scripts/version_os_player_icons.py").write_text('''from pathlib import Path
import json
import shutil


def main() -> None:
    icon_dir = Path("Resources/Assets.xcassets/AppIcon.appiconset")
    contents = json.loads((icon_dir / "Contents.json").read_text())
    copied = 0
    for image in contents.get("images", []):
        target_name = image.get("filename")
        if not target_name:
            continue
        prefix = "OSIcon-v0131-"
        if not target_name.startswith(prefix):
            raise SystemExit(f"unexpected versioned icon name: {target_name}")
        source_name = "Icon-" + target_name[len(prefix):]
        source = icon_dir / source_name
        target = icon_dir / target_name
        if not source.exists():
            raise SystemExit(f"missing generated source icon: {source}")
        shutil.copyfile(source, target)
        copied += 1
    print(f"OS player versioned icon assets prepared: {copied}")


if __name__ == "__main__":
    main()
''')

          # Update workflows for the fresh icon asset names and add a regression gate for this exact UI defect class.
          for workflow in [".github/workflows/validate-source.yml", ".github/workflows/build-unsigned-ipa.yml"]:
              text = read(workflow)
              old = '''      - name: Generate OS player app icons
        run: python3 scripts/generate_os_player_icons.py'''
              new = '''      - name: Generate OS player app icons
        run: |
          python3 scripts/generate_os_player_icons.py
          python3 scripts/version_os_player_icons.py'''
              if old not in text:
                  raise SystemExit(f"icon generation step mismatch in {workflow}")
              text = text.replace(old, new, 1)
              anchor = '''      - name: Audit v0.12.7 MPV rotation regressions
        run: python3 scripts/check_v0127_mpv_rotation.py
'''
              addition = anchor + '''
      - name: Audit v0.13.1 UI regressions
        run: python3 scripts/check_v0131_ui_regressions.py
'''
              if anchor not in text:
                  raise SystemExit(f"audit anchor missing in {workflow}")
              text = text.replace(anchor, addition, 1)
              write(workflow, text)

          # Bump release/build metadata in the unsigned-IPA workflow.
          build_path = ".github/workflows/build-unsigned-ipa.yml"
          build = read(build_path)
          build = build.replace("0.13.0", "0.13.1")
          build = build.replace("build66", "build67")
          build = build.replace("Build 66", "Build 67")
          build = build.replace('"build":66', '"build":67')
          write(build_path, build)

          # Historical feature gates should follow the current release metadata without changing their transport assertions.
          historical = [
              "scripts/check_transport_v3_invariants.py",
              "scripts/check_scheduler_v2_invariants.py",
              "scripts/check_live_lane_startup_invariants.py",
              "scripts/check_v0123_regressions.py",
              "scripts/check_v0124_regressions.py",
              "scripts/check_v0126_frontier_rescue.py",
              "scripts/check_v0127_mpv_rotation.py",
          ]
          for path in historical:
              text = read(path)
              text = text.replace("0.13.0", "0.13.1")
              text = text.replace('CURRENT_PROJECT_VERSION: "66"', 'CURRENT_PROJECT_VERSION: "67"')
              text = text.replace('<string>66</string>', '<string>67</string>')
              text = text.replace("build66", "build67")
              write(path, text)

          Path("scripts/check_v0131_ui_regressions.py").write_text('''from pathlib import Path
import json


def require(condition: bool, message: str) -> None:
    if not condition:
        raise SystemExit(f"v0.13.1 UI regression failed: {message}")


root = Path("Sources/UI/EmbyServerRootView.swift").read_text()
server_list = Path("Sources/UI/ServerListView.swift").read_text()
shell = Path("Sources/UI/AppShellView.swift").read_text()
info = Path("Config/Info.plist").read_text()
identity = Path("Sources/Core/AppIdentity.swift").read_text()
project = Path("project.yml").read_text()
validate = Path(".github/workflows/validate-source.yml").read_text()
build = Path(".github/workflows/build-unsigned-ipa.yml").read_text()
icons = json.loads(Path("Resources/Assets.xcassets/AppIcon.appiconset/Contents.json").read_text())

require("RefreshableScrollView(" not in root, "home must not use the custom bounded UIKit refresh container")
require(not Path("Sources/UI/RefreshableScrollView.swift").exists(), "obsolete bounded refresh wrapper must be removed")
require(".refreshable { await model.refresh() }" in root, "native iOS 15 pull-to-refresh missing")
require(".frame(maxWidth: .infinity, maxHeight: .infinity)" in root, "server content region must fill all space above the tab bar")
require('proxy.scrollTo("home-top", anchor: .top)' in root, "home tab scroll-to-top behavior missing")
require(".font(.system(size: 40" not in root and ".font(.system(size: 44" not in root, "oversized fixed page title returned")
require(".font(.system(size: 44" not in server_list and ".font(.system(size: 44" not in shell, "oversized outer-shell title returned")
require("<key>CFBundleDisplayName</key>\n\t<string>OS player</string>" in info, "display name mismatch")
require("<key>CFBundleName</key>\n\t<string>OS player</string>" in info, "bundle name mismatch")
require('static let clientName = "OS player"' in identity, "Emby client identity mismatch")
require(project.count('MARKETING_VERSION: "0.13.1"') == 2, "marketing version mismatch")
require(project.count('CURRENT_PROJECT_VERSION: "67"') == 2, "build number mismatch")
require('<string>0.13.1</string>' in info and '<string>67</string>' in info, "Info.plist version/build mismatch")
require('sourceVersion = "0.13.1"' in identity, "AppIdentity source version mismatch")
filenames = [image.get("filename", "") for image in icons.get("images", []) if image.get("filename")]
require(len(filenames) == 18 and all(name.startswith("OSIcon-v0131-") for name in filenames), "all icon slots must use fresh v0.13.1 filenames")
require(Path("scripts/version_os_player_icons.py").exists(), "versioned icon preparation script missing")
for workflow in [validate, build]:
    require("check_v0131_ui_regressions.py" in workflow, "v0.13.1 UI audit missing from workflow")
    require("version_os_player_icons.py" in workflow, "fresh icon preparation missing from workflow")
require('IPA_NAME="EmbyPlayerLab-0.13.1-${GITHUB_SHA::7}-unsigned.ipa"' in build, "IPA filename mismatch")
require('RELEASE_TAG="v0.13.1-build67-dev"' in build, "release tag mismatch")
require('RELEASE_IPA="OS-player-v0.13.1-build67-${GITHUB_SHA::7}-unsigned.ipa"' in build, "release IPA mismatch")
require('iOS: "15.0"' in project and 'deploymentTarget: "15.0"' in project, "Deployment Target must remain iOS 15.0")

print("v0.13.1 UI regressions: OK")
''')

          print("v0.13.1 UI polish applied")
          PY

      - name: Commit applied changes and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v0131-ui-polish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "v0.13.1: fix shell sizing scrolling and system identity"
          git push origin HEAD:dev/v0.13.1-ui-polish
