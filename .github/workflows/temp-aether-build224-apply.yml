name: Apply Build224 Aether Fast Seek App Patch

on:
  push:
    branches: [feat/aether-multi-engine-comparison]
    paths:
      - .github/workflows/temp-aether-build224-apply.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate
        run: |
          set -euo pipefail
          python3 .github/scripts/temp_apply_aether_build224.py
          git diff --check
          grep -n 'revision: 7422d45727f3bea9a4aa1b616138448488a394d8' project.yml
          grep -n 'MARKETING_VERSION: "0.14.57"' project.yml
          grep -n 'CURRENT_PROJECT_VERSION: "224"' project.yml
          grep -n 'toleranceSeconds = 0.75\|toleranceSeconds: toleranceSeconds' Sources/Player/AetherPlayerEngine.swift
          grep -n 'maxSupportedPlaybackRate' Sources/Player/AetherPlayerEngine.swift Sources/Player/PlaybackRateBridge.swift Sources/UI/PlayerScreen.swift
          git diff -- Sources/Player/AetherPlayerEngine.swift Sources/Player/PlaybackRateBridge.swift Sources/UI/PlayerControlPanelViews.swift Sources/UI/PlayerFloatingPanelViews.swift Sources/UI/PlayerScreen.swift project.yml
      - name: Commit app patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Player/AetherPlayerEngine.swift Sources/Player/PlaybackRateBridge.swift Sources/UI/PlayerControlPanelViews.swift Sources/UI/PlayerFloatingPanelViews.swift Sources/UI/PlayerScreen.swift project.yml
          git commit -m "Add bounded Aether fast seek for Build224"
          git push origin HEAD:feat/aether-multi-engine-comparison
