name: One-shot sync Build210 poster evidence v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-sync-build210-poster-docs-v2.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Patch current authority docs
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          echo '' | base64 -d >/tmp/sync.py
          python3 /tmp/sync.py
          git diff --check
      - name: Commit authority-doc updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md
          git commit -m "Record Build209 device evidence and Build210 diagnostic baseline"
          git push origin HEAD:main
