name: Sync carousel Build275 control and Build277 docs

on:
  push:
    branches: [docs/carousel-build275-control-build277-20260831]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: docs/carousel-build275-control-build277-20260831
          path: helper

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: work

      - name: Patch current project docs
        run: python3 helper/.github/scripts/temp-sync-carousel-build277.py work

      - name: Verify docs-only scope
        working-directory: work
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/current/dev/DEV-home-carousel-drag-smoothness.md | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          grep -F 'Build275 same-package' docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          grep -F '1446640b0d9cec5cb2f39d36cff0bfeca4efd31d' docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          grep -F '33336619261 / 99324579844' docs/project/BUILD_TEST_INDEX.md
          grep -F 'D024 — Build275 isolates carousel cadence to real input→progress publication' docs/project/TECHNICAL_DECISIONS.md

      - name: Commit docs to main
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          git commit -m 'Record Build275 input boundary and Build277 probe [skip ci]'
          git push origin HEAD:main
