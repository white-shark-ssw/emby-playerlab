name: One-shot reallocate poster diagnostics to Build209

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-reallocate-poster-build209.yml"

permissions:
  contents: write

jobs:
  reallocate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/poster-grid-smoothness
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact colliding poster Build208 source and global Build209 vacancy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dd568ae2d24c8bcab434d7078c5bf1a740668f30"
          git fetch origin main
          if git show origin/main:docs/project/BUILD_TEST_INDEX.md | grep -E 'Build209|0\.14\.42' >/dev/null; then
            echo 'Build209 / 0.14.42 already allocated in BUILD_TEST_INDEX' >&2
            exit 1
          fi
          if git show origin/main:docs/project/current/dev/DEV-home-carousel-drag-smoothness.md | grep -E 'Build209|0\.14\.42' >/dev/null; then
            echo 'Build209 / 0.14.42 already allocated by carousel task' >&2
            exit 1
          fi

      - name: Reallocate identity only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          identity = Path('Sources/Core/AppIdentity.swift')
          s = identity.read_text(encoding='utf-8')
          if s.count('static let sourceVersion = "0.14.41"') != 1 or s.count('?? "0.14.41"') != 1:
              raise SystemExit('colliding poster Build208 identity anchor mismatch')
          s = s.replace('static let sourceVersion = "0.14.41"', 'static let sourceVersion = "0.14.42"', 1)
          s = s.replace('?? "0.14.41"', '?? "0.14.42"', 1)
          identity.write_text(s, encoding='utf-8')

          old = Path('docs/changelog/CHANGELOG_v0_14_41_build208.md')
          if not old.exists():
              raise SystemExit('poster Build208 changelog missing')
          old.unlink()
          Path('docs/changelog/CHANGELOG_v0_14_42_build209.md').write_text('''# OnePlayer 0.14.42 / Build209

## Motion-aware poster scroll diagnostics

- Build206 App-log capture proved immediate cell appearance, image commit and grid load-ahead are not a universal cross-page trigger, but its display-link gaps were not tied to actual vertical motion.
- A poster diagnostic package was briefly built as 0.14.41 / Build208, then retired before distribution because the independent Home-carousel task already owns Build208 / 0.14.41.
- Build209 keeps the same motion-aware diagnostic runtime code and gives the poster task a unique identity.
- `PosterScrollHitch` is emitted only when the display gap is at least 30 ms and the real vertical content offset changed across that gap.
- Each hitch adds `scroll_route`, `phase`, `offset_y`, `delta_y` and `velocity_y`, while retaining cell/image/load-ahead timing fields.
- Home and all shared 3-column poster grids register only a transparent, non-interactive scroll-owner probe; scroll physics, image policy, navigation, carousel gesture ownership and playback/transport paths are unchanged.
- Deployment target remains iOS 15.0.
''', encoding='utf-8')
          PY
          python3 scripts/check_poster_grid_smoothness.py
          python3 -m py_compile scripts/check_poster_grid_smoothness.py
          rm -rf scripts/__pycache__
          git diff --check

      - name: Guard identity-only reallocation and commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
              'Sources/Core/AppIdentity.swift',
              'docs/changelog/CHANGELOG_v0_14_41_build208.md',
              'docs/changelog/CHANGELOG_v0_14_42_build209.md',
          }
          paths = {line[3:] for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()}
          if paths != expected:
              raise SystemExit(f'Build209 reallocation expected exact identity/changelog delta, got: {sorted(paths)}')
          print('Build209 identity reallocation scope: PASS')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Core/AppIdentity.swift docs/changelog/CHANGELOG_v0_14_41_build208.md docs/changelog/CHANGELOG_v0_14_42_build209.md
          git commit -m "Reallocate poster motion diagnostics to Build209"
          git push origin HEAD:perf/poster-grid-smoothness
