name: Apply detail resume UI

on:
  push:
    branches:
      - fix/detail-media-reveal-and-resume-button

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/detail-media-reveal-and-resume-button
          fetch-depth: 0
      - name: Apply detail UI patch
        run: python3 .github/apply_detail_resume_ui.py
      - name: Run focused regressions
        run: |
          python3 scripts/check_detail_resume_button.py
          python3 scripts/check_detail_media_metadata.py
          python3 scripts/check_adaptive_hero_reveal.py
          python3 scripts/check_v0134_detail_navigation.py
          python3 scripts/check_detail_episode_range_jump.py
      - name: Commit formal source change
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add Sources/UI/EmbyMediaDetailView.swift
          git commit -m "fix: clip detail metadata reveal and refresh resume UI"
          git push origin HEAD:fix/detail-media-reveal-and-resume-button
