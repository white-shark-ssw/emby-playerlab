name: TEMP Sync Build223 Project Docs

on:
  push:
    branches: [diag/home-carousel-persistent-backdrop-isolation-build223]
    paths:
      - .github/build223-docs-sync-trigger.txt

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync Build223 durable project state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          build_index = Path('docs/project/BUILD_TEST_INDEX.md')
          text = build_index.read_text()
          build223 = "| **Build223 / 0.14.56** | Home vertical persistent-backdrop isolation | **CI/IPA verified; target-device A/B pending; diagnostic only, not stable.** Based on accepted Build216/main product behavior, immersive Home no longer mounts the always-on full-screen `persistentCarouselBackdrop`; Hero, preload, normal auto-advance, horizontal interaction and all P0/Frozen paths remain unchanged. Tested source `af54d693d91303ea9bd201b5525e24f3e15ad931`; run/job `33110117601 / 98650408622`; artifact `9662245993`; artifact SHA-256 `cdc741253866243bf2f2ae111e46807e64a5deefecdc30d46ee6a75f31a0eba1`; IPA SHA-256 `a925714dceb138df7808079b5784f3337afe92245bd790c42c290eac82ccd73c`; source ZIP SHA-256 `b14860b0a5889b39be17eeac8aeacf0621c6c68784058f463f00eae3057a5432`; OnePlayer 0.14.56 (223), MinOS 15.0 independently verified. |"
          if build223 not in text:
              marker = '| **Build222 / 0.14.55** | Home vertical offscreen auto-advance isolation |'
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit('Build222 index marker not found')
              end = text.find('\n', pos)
              text = text[:end+1] + build223 + '\n' + text[end+1:]
              build_index.write_text(text)

          state = Path('docs/project/PROJECT_STATE.md')
          text = state.read_text()
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('_Last updated '):
                  lines[i] = '_Last updated after Build223 / 0.14.56 Home vertical persistent-backdrop isolation CI/IPA verification. Build216 remains the latest real-device accepted overall runtime baseline. Build223 is a diagnostic Home candidate awaiting target-device testing; Build222 offscreen auto-advance isolation was real-device ineffective. Poster Build220 remains real-device ineffective for the intended 3×3 smoothness A/B._'
                  break
          else:
              raise SystemExit('PROJECT_STATE last-updated line not found')
          text = '\n'.join(lines) + '\n'
          if '### Build223 Home vertical persistent-backdrop A/B' not in text:
              insert_at = text.find('\n## Active: Poster-heavy scrolling smoothness')
              if insert_at < 0:
                  raise SystemExit('poster section marker not found')
              section = '''\n### Build223 Home vertical persistent-backdrop A/B\n\nBuild223 / 0.14.56 is the next independent Home vertical diagnostic from accepted Build216/main behavior, not a stack on Build221 or Build222. Its only runtime presentation change is that immersive Home no longer mounts the always-on full-screen `persistentCarouselBackdrop`; `persistentCarouselBackdrop` / `carouselPersistentImage` and the existing 30pt blur implementation remain in source, `carouselPreloadLayer` stays mounted, Hero artwork is unchanged, normal Build216 auto-advance behavior remains, and horizontal interaction/P0/Frozen paths are untouched. Dedicated Xcode 16.4 run/job `33110117601 / 98650408622` succeeded; tested source `af54d693d91303ea9bd201b5525e24f3e15ad931`; artifact `9662245993`; IPA SHA-256 `a925714dceb138df7808079b5784f3337afe92245bd790c42c290eac82ccd73c`; source ZIP SHA-256 `b14860b0a5889b39be17eeac8aeacf0621c6c68784058f463f00eae3057a5432`; OnePlayer 0.14.56 (223) and MinOS 15.0 were independently re-opened/verified. Evidence: **Code written / exact scope+Frozen guard / CI passed / IPA produced+verified / real-device pending / diagnostic only / not stable**. Next vertical action is target-device A/B of Home vertical scrolling.\n'''
              text = text[:insert_at] + section + text[insert_at:]
          old = 'Build216 is the accepted overall runtime baseline after the detail episode-range inertia closeout. Home-carousel Build221 and poster-scroll Build220 remain independent Active lines with separate branches/evidence.'
          new = 'Build216 is the accepted overall runtime baseline after the detail episode-range inertia closeout. Home-carousel Build223 is the latest CI/IPA-verified vertical diagnostic candidate; Build221 remains a separate horizontal A/B; poster-scroll Build220 remains an independent Active line. These keep separate branches/evidence.'
          if old in text:
              text = text.replace(old, new, 1)
          state.write_text(text)
          PY
          git diff --check
          git diff -- docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md

      - name: Commit docs to main without product CI
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md
          if git diff --cached --quiet; then
            echo "Docs already synchronized"
            exit 0
          fi
          git commit -m "Sync Build223 project evidence [skip ci]"
          git push origin HEAD:main
