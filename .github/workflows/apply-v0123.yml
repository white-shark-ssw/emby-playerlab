name: Apply v0.12.3

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.12.3-seek-anchor-mpv-crash
      - name: Apply frozen v0.12.3 patch
        run: |
          set -euo pipefail
          python3 scripts/apply_v0123.py
          python3 scripts/check_v0123_regressions.py
          git config user.name "ChatGPT CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources Config project.yml scripts/check_transport_v3_invariants.py scripts/check_scheduler_v2_invariants.py scripts/check_live_lane_startup_invariants.py scripts/check_v0122_regressions.py scripts/check_v0123_regressions.py docs/review/SELF_REVIEW_v0_12_3.md
          git commit -m "Implement v0.12.3 seek anchor and MPV crash fixes"
          git push origin HEAD:chatgpt/v0.12.3-seek-anchor-mpv-crash
