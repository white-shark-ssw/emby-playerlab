name: TEMP Build223 Home Persistent Root Isolation

on:
  push:
    branches: [diag/home-carousel-persistent-root-build223]
    paths: [.github/build223-home-persistent-trigger.txt]

permissions:
  contents: write

jobs:
  build223:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: diag/home-carousel-persistent-root-build223
          fetch-depth: 0

      - name: Apply exact patch and commit tested source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/temp_apply_build223.py
          git rm .github/workflows/temp-build223-home-persistent-root.yml .github/build223-home-persistent-trigger.txt
          git add -A
          git diff --cached --check
          git commit -m "Diag: isolate Home persistent root backdrop"
          git push origin HEAD:diag/home-carousel-persistent-root-build223
          echo "TESTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify exact Build223 scope and source contracts
        run: |
          set -euo pipefail
          BASE_SHA=da5ad1dc6341481b12b8ae3e8b85cc5e5bb31a05
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"..HEAD | sort)
          expected=(
            Sources/Core/AppIdentity.swift
            Sources/UI/EmbyHomeCoreV3.swift
            docs/changelog/CHANGELOG_v0_14_56_build223.md
            scripts/check_home_vertical_persistent_isolation.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf 'Changed paths:\n%s\n' "${changed[*]}"
          [[ "${changed[*]}" == "${expected_sorted[*]}" ]]
          python3 scripts/check_home_vertical_persistent_isolation.py
          ! git diff --name-only "$BASE_SHA"..HEAD | grep -E 'Player|Transport|Cache|Session|MPV|PiP|EmbyHomeHeroV3|EmbyHomeCarouselInteractionV3|EmbyHomeCarouselStateV3|EmbyHomeHeroScrollStateV3' || exit 1
          test ! -e .github/workflows/temp-build223-home-persistent-root.yml
          test ! -e .github/build223-home-persistent-trigger.txt
          test ! -e scripts/temp_apply_build223.py

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Generate icons and Xcode project
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate

      - name: Install KTVHTTPCache
        run: |
          set -euo pipefail
          pod install --repo-update

      - name: Resolve MPVKit
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build unsigned Release app
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            MARKETING_VERSION=0.14.56 \
            CURRENT_PROJECT_VERSION=223 \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build

      - name: Validate app identity and MinOS
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id com.embyplayerlab.app --version 0.14.56 --build 223 --display-name OnePlayer --minimum-os 15.0 --primary-icon OnePlayerIcon --alternate-icon OnePlayerAltIcon
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" 15.0 17.0 min-os-report.log /dev/null

      - name: Package IPA and exact source
        run: |
          set -euo pipefail
          SOURCE_ZIP="OnePlayer-0.14.56-build223-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-0.14.56-build223-home-persistent-root-isolation-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"
          echo "TESTED_SHA=$TESTED_SHA"
          cat "$IPA_NAME.sha256"
          cat "$SOURCE_ZIP.sha256"

      - name: Upload Build223 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.56-build223-home-persistent-root-isolation
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            min-os-report.log
          if-no-files-found: error
          retention-days: 30
