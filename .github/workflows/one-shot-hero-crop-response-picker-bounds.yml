name: Apply Hero crop response and picker bounds tuning

on:
  push:
    branches:
      - fix/hero-crop-response-picker-bounds
    paths:
      - '.github/workflows/one-shot-hero-crop-response-picker-bounds.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hero-crop-response-picker-bounds
          fetch-depth: 0
      - name: Apply source patch
        run: |
          python .github/apply_hero_crop_response_picker_bounds.py
          python scripts/check_adaptive_hero_reveal.py
          python scripts/check_v0134_detail_navigation.py
          git diff --check
      - name: Commit source changes
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add Sources/UI/ImmersiveUIComponents.swift Sources/UI/EmbyEpisodePickerView.swift scripts/check_adaptive_hero_reveal.py
          git commit -m 'fix: soften Hero crop and stabilize picker bounds'
          git push origin HEAD:fix/hero-crop-response-picker-bounds
