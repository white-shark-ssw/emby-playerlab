name: Temp apply Build190 carousel release fix

on:
  push:
    branches: [fix/home-carousel-native-release-build190]
    paths:
      - ".github/workflows/temp-apply-build190-carousel-release.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-carousel-native-release-build190
      - name: Apply Build190 release ownership fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          native_path = Path('Sources/UI/EmbyHomeCarouselNativeDragV3.swift')
          s = native_path.read_text()
          old = '''            let axis = onSample?(translation)\n            if state == .possible {\n                if axis == .vertical { state = .failed; return }\n                if axis == .horizontal { state = .began }\n            } else if state == .began || state == .changed, axis == .horizontal {\n                state = .changed\n            }\n'''
          new = '''            let axis = onSample?(translation)\n            if axis == .vertical { state = .failed; return }\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    override func touchesEnded(_ touches: Set<UITouch>, with event: UIEvent) {\n        if state == .began || state == .changed { state = .ended }\n        else { state = .failed }\n    }\n\n    override func touchesCancelled(_ touches: Set<UITouch>, with event: UIEvent) {\n        if state == .began || state == .changed { state = .cancelled }\n        else { state = .failed }\n    }\n\n    override func reset() {\n'''
          new = '''    override func touchesEnded(_ touches: Set<UITouch>, with event: UIEvent) { state = .failed }\n\n    override func touchesCancelled(_ touches: Set<UITouch>, with event: UIEvent) { state = .failed }\n\n    override func canPrevent(_ preventedGestureRecognizer: UIGestureRecognizer) -> Bool { false }\n\n    override func canBePrevented(by preventingGestureRecognizer: UIGestureRecognizer) -> Bool { false }\n\n    override func reset() {\n'''
          assert old in s
          native_path.write_text(s.replace(old, new, 1))

          state_path = Path('Sources/UI/EmbyHomeCarouselStateV3.swift')
          s = state_path.read_text()
          start = s.index('    func carouselDragGesture(width: CGFloat) -> some Gesture {')
          end = s.index('    func suppressCarouselTap() {', start)
          replacement = '''    func carouselDragGesture(width: CGFloat) -> some Gesture {\n        DragGesture(minimumDistance: 0, coordinateSpace: .local)\n            .onEnded { value in\n                let dragAxis = carouselTransitionState.dragAxis\n                carouselTransitionState.finishDragDiagnostics(axis: dragAxis, endTranslation: value.translation)\n                carouselTransitionState.dragAxis = nil\n                guard dragAxis == .horizontal, isCarouselDragging, let targetID = transitionToID else { return }\n                suppressCarouselTap()\n                let predicted = abs(value.predictedEndTranslation.width)\n                let shouldCommit = transitionProgress >= 0.28 || predicted >= width * 0.48\n                isCarouselDragging = false\n                if shouldCommit { completeInteractiveTransition(to: targetID) }\n                else { cancelInteractiveTransition() }\n            }\n    }\n\n'''
          state_path.write_text(s[:start] + replacement + s[end:])

          app_path = Path('Sources/Core/AppIdentity.swift')
          s = app_path.read_text()
          assert 'sourceVersion = "0.14.22"' in s and '?? "0.14.22"' in s
          app_path.write_text(s.replace('sourceVersion = "0.14.22"', 'sourceVersion = "0.14.23"', 1).replace('?? "0.14.22"', '?? "0.14.23"', 1))

          Path('docs/changelog/CHANGELOG_v0_14_23_build190.md').write_text('''# OnePlayer 0.14.23 / Build190\n\n- 修复 Build189 真机暴露的“手指松开后轮播停在中间 progress、不再完整切换/回弹”。\n- Build189 native recognizer 横向时进入 `.began/.changed`，但 settle 仍只由 SwiftUI `DragGesture.onEnded` 负责；真机证明两者竞争后 release owner 可能收不到结束。\n- Build190 将 native recognizer 改为被动 raw/coalesced-touch sampler：横向采样时保持 `.possible`，不 claim 手势，并明确不 prevent / 不被其他 recognizer prevent；纵向仍立即 fail 让首页 ScrollView 继续主导。\n- SwiftUI `DragGesture` 删除逐帧 `onChanged` 状态写入，只保留原 `onEnded`、`predictedEndTranslation`、0.28 progress / 0.48×width predicted commit 和原 complete/cancel settle。\n- 因此移动 progress 只有 native 一个 owner，松手 settle 只有 SwiftUI 一个 owner；不引入 fallback、timer、watchdog、debounce、throttle 或插值。\n- 保留整页 foreground 横向平移、左右反向穿越中心、自动轮播、详情点击和 persistent backdrop 视觉合同。\n- Player、MPV、PiP、Transport、Cache、Emby Session/Resume、115/302/Range 均不修改；Deployment Target 保持 iOS 15.0。\n''')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/UI/EmbyHomeCarouselNativeDragV3.swift Sources/UI/EmbyHomeCarouselStateV3.swift Sources/Core/AppIdentity.swift docs/changelog/CHANGELOG_v0_14_23_build190.md
          git commit -m "Fix Build190 carousel release ownership"
          git push origin HEAD:fix/home-carousel-native-release-build190
