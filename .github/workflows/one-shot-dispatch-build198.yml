name: One-shot dispatch Build198 IPA

on:
  push:
    branches: [perf/home-carousel-single-owner-build198]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact Build198 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run temp-build198-carousel-ci.yml --repo "$GITHUB_REPOSITORY" --ref perf/home-carousel-single-owner-build198
