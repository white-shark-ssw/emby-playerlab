name: Build OnePlayer 0.13.80 Build147 Playback Settings UI
# Build147 isolated UI test package; playback core remains frozen.

on:
  workflow_dispatch:
  push:
    branches: [ui/playback-settings-polish-0.13.80]
    paths:
      - "Sources/**"
      - "project.mdklab.yml"
      - "Podfile"
      - ".github/workflows/build147-playback-settings-ui.yml"
  pull_request:
    branches: [refactor/keyframe-seek-cleanup-0.13.79]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build147-playback-settings-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout Build147 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Build147 UI and playback contracts
        run: |
          set -euo pipefail
          grep -Fq 'sourceVersion = "0.13.80"' Sources/Core/AppIdentity.swift
          grep -Fq 'return "MPV高兼容引擎"' Sources/Player/PlayerEngine.swift
          grep -Fq 'return "MDK高性能引擎"' Sources/Player/PlayerEngine.swift
          grep -Fq 'var result: [PlayerEnginePreference] = []' Sources/Player/PlayerEngine.swift
          grep -Fq 'result.append(.mpv)' Sources/Player/PlayerEngine.swift
          grep -Fq 'result.append(.ksAVIO)' Sources/Player/PlayerEngine.swift
          grep -Fq 'guard let preference = rawValue.flatMap(PlayerEnginePreference.init(rawValue:)), selectableCases.contains(preference) else { return defaultPreference }' Sources/Player/PlayerEngine.swift
          grep -Fq 'MPV高兼容引擎为默认选择；MDK高性能引擎可手动切换。' Sources/UI/PlayerSettingsView.swift
          grep -Fq 'private let forwardPageAnimation' Sources/UI/PlayerPlaybackSettingsPopover.swift
          grep -Fq 'private let backwardPageAnimation' Sources/UI/PlayerPlaybackSettingsPopover.swift
          grep -Fq 'private var submenuTransition: AnyTransition' Sources/UI/PlayerPlaybackSettingsPopover.swift
          grep -Fq '.opacity(page == .root ? 1 : 0.30)' Sources/UI/PlayerPlaybackSettingsPopover.swift
          grep -Fq 'showMotionSmoothing' Sources/UI/PlayerPlaybackSettingsPopover.swift
          grep -Fq 'showRoot' Sources/UI/PlayerPlaybackSettingsPopover.swift
          python3 - <<'PY'
          from pathlib import Path
          engine = Path('Sources/Player/PlayerEngine.swift').read_text()
          start = engine.index('    static var selectableCases: [PlayerEnginePreference] {')
          end = engine.index('\n    static var automaticCompatibilityKind:', start)
          selectable = engine[start:end]
          assert '.automatic' not in selectable
          assert '.resourceLoaderAVPlayer' not in selectable
          assert '.transportAVPlayer' not in selectable
          assert '.avPlayer' not in selectable
          assert selectable.index('result.append(.mpv)') < selectable.index('result.append(.ksAVIO)')
          popover = Path('Sources/UI/PlayerPlaybackSettingsPopover.swift').read_text()
          assert '.animation(pageAnimation, value: page)' not in popover
          assert 'offset(x: 10, y: 2)' in popover
          seek = Path('Sources/Player/MPVPlayerEngine.swift').read_text()
          seek_start = seek.index('    func seek(to seconds: Double, direction: SeekDirection)')
          seek_end = seek.index('\n    private func claimKeyframeLookupIndex()', seek_start)
          seek_body = seek[seek_start:seek_end]
          assert seek_body.count('self.command(handle, ["seek"') == 1
          assert 'absolute+keyframes' in seek_body
          assert 'absolute+exact' not in seek_body
          PY
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          git diff --check

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Build147 Release
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.80 CURRENT_PROJECT_VERSION=147 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.80' --build '147' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.80-build147-playback-settings-ui-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build147 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.80-build147-playback-settings-ui
          path: |
            OnePlayer-0.13.80-build147-playback-settings-ui-unsigned.ipa
            OnePlayer-0.13.80-build147-playback-settings-ui-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build147 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.80-build147-playback-settings-ui-failure
          path: |
            build.log
            package-resolution.log
            app-validation.log
            min-os-report.log
          if-no-files-found: ignore
          retention-days: 14
