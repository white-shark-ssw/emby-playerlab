name: Build OnePlayer 0.13.76 Build143 Keyframe Fast Seek

on:
  workflow_dispatch:
  push:
    branches: [refactor/keyframe-fast-seek-0.13.76]
    paths:
      - "Sources/**"
      - "project.mdklab.yml"
      - "Podfile"
      - ".github/workflows/build143-keyframe-fast-seek.yml"
  pull_request:
    branches: [diag/nearest-keyframe-session-index-0.13.75]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build143-keyframe-fast-seek-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/refactor/keyframe-fast-seek-0.13.76' || github.head_ref == 'refactor/keyframe-fast-seek-0.13.76'
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout Build143 source
        uses: actions/checkout@v4
        with:
          ref: refactor/keyframe-fast-seek-0.13.76
          fetch-depth: 0

      - name: Verify production seek contract
        run: |
          set -euo pipefail
          grep -Fq 'sourceVersion = "0.13.76"' Sources/Core/AppIdentity.swift
          grep -Fq 'private static let keyframeLookupBudgetMs: Double = 20' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'private let sessionKeyframeMap = OnePlayerSessionKeyframeMap()' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'MPVFastSeek' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'backfillKeyframeGapAfterLanding' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'session-gap-nearest-next' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'probe-nearest-next' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'fallback-time-budget' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'final class OnePlayerSessionKeyframeMap' Sources/Player/OnePlayerSessionKeyframeMap.swift
          grep -Fq 'maximumGapCount = 4096' Sources/Player/OnePlayerSessionKeyframeMap.swift
          grep -Fq 'session-gap-cache' Sources/Player/OnePlayerSessionKeyframeMap.swift
          grep -Fq 'ONEPLAYER_KEYFRAME_NATIVE_SEEK_READONLY' Sources/Player/MPVKeyframeIndexProbe.swift
          grep -Fq 'func readCachedMetadata(offset: Int64, length: Int) async -> Data?' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'mode=cache-only-no-network' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'phase=mpv-event-seek owner=claimed' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'reason=no-latest-seek-event-owner' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'intent = "doubleTapFastSeek"' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'intent = "scrubReleaseFastSeek"' Sources/Player/MPVPlayerEngine.swift
          test "$(grep -Fc 'mode = "absolute+keyframes"' Sources/Player/MPVPlayerEngine.swift)" -ge 2
          test "$(grep -Fc 'self.command(handle, ["seek", String(format: "%.6f", dispatchTarget), mode])' Sources/Player/MPVPlayerEngine.swift)" -eq 1
          ! grep -Fq 'absolute+exact' Sources/Player/MPVPlayerEngine.swift
          ! grep -Fq 'experimentArm' Sources/Player/MPVPlayerEngine.swift
          ! grep -Fq 'control-baseline' Sources/Player/MPVPlayerEngine.swift
          ! grep -Fq 'seekID.isMultiple(of: 2)' Sources/Player/MPVPlayerEngine.swift
          ! grep -Fq 'MPVNearestSeek' Sources/Player/MPVPlayerEngine.swift
          ! grep -Fq 'nearestPreflight' Sources/Player/MPVPlayerEngine.swift
          ! grep -Fq 'action=observe-only' Sources/Player/MPVPlayerEngine.swift
          ! grep -Fq 'fallback-buffer-miss' Sources/Player/MPVPlayerEngine.swift
          ! grep -Fq 'UserDefaults' Sources/Player/OnePlayerSessionKeyframeMap.swift
          ! grep -Fq 'FileManager' Sources/Player/OnePlayerSessionKeyframeMap.swift
          test ! -e scripts/apply_build141_nearest_keyframe_ab.py
          test ! -e scripts/apply_build142_session_keyframe_index.py
          test ! -e scripts/apply_build143_keyframe_fast_seek_cleanup.py
          test ! -e .github/workflows/build141-nearest-keyframe-ab.yml
          test ! -e .github/workflows/build142-session-keyframe-index.yml
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          git diff --check

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Create same-target FFmpeg compile contract
        run: |
          set -euo pipefail
          cat > Sources/Player/Build143BackendCompileContract.swift <<'SWIFT'
          #if !canImport(Libavformat)
          #error("Build143 OnePlayer target cannot import Libavformat")
          #endif
          #if !canImport(Libavutil)
          #error("Build143 OnePlayer target cannot import Libavutil")
          #endif
          #if !canImport(Libavcodec)
          #error("Build143 OnePlayer target cannot import Libavcodec")
          #endif
          import Libavformat
          import Libavutil
          import Libavcodec
          enum Build143BackendCompileContract { static func verify() -> UInt32 { avformat_version() ^ avutil_version() ^ avcodec_version() } }
          SWIFT

      - name: Generate project and resolve MPVKit
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Build143 Release
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.76 CURRENT_PROJECT_VERSION=143 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.76' --build '143' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Verify production keyframe backend
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          BIN="$APP_PATH/$EXECUTABLE"
          grep -Fq 'Build143BackendCompileContract.swift' build.log
          grep -Fq 'MPVKeyframeIndexProbe.swift' build.log
          grep -Fq 'OnePlayerSessionKeyframeMap.swift' build.log
          grep -Fq -- '-framework Libavformat' build.log
          grep -Fq -- '-framework Libavutil' build.log
          grep -Fq -- '-framework Libavcodec' build.log
          if ! nm -gU "$BIN" > keyframe-symbols.log 2>&1; then nm "$BIN" > keyframe-symbols.log 2>&1; fi
          grep -Fq '_av_seek_frame' keyframe-symbols.log
          grep -Fq '_av_read_frame' keyframe-symbols.log
          grep -Fq '_av_packet_alloc' keyframe-symbols.log
          grep -Fq '_avformat_open_input' keyframe-symbols.log
          echo 'backend=libavformat-direct strategy=production-ephemeral-verified-gap-index lookup-budget-ms=20 real-seek=single-absolute-keyframes cache=read-only-no-network persistence=none fence=mpv-event-seek' | tee keyframe-fast-seek-report.log
          rm -f Sources/Player/Build143BackendCompileContract.swift

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.76-build143-keyframe-fast-seek-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build143 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.76-build143-keyframe-fast-seek
          path: |
            OnePlayer-0.13.76-build143-keyframe-fast-seek-unsigned.ipa
            OnePlayer-0.13.76-build143-keyframe-fast-seek-unsigned.ipa.sha256
            keyframe-fast-seek-report.log
            keyframe-symbols.log
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build143 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.76-build143-keyframe-fast-seek-diagnostics
          path: |
            keyframe-fast-seek-report.log
            keyframe-symbols.log
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: warn
          retention-days: 14
