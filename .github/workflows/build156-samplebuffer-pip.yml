name: Build OnePlayer 0.13.92 Build159 PiP VO Timebase

on:
  pull_request:
    branches: [refactor/pip-session-0.13.91]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: build159-pip-vo-timebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout Build159 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize MPV PiP VO lifecycle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Sources/Player/MPVPlayerEngine.swift')
          text = path.read_text()
          old_decl = 'final class MPVPlayerEngine: PlayerEngine, PlaybackPresentationEngineAdapter {'
          new_decl = 'final class MPVPlayerEngine: PlayerEngine, PlaybackPresentationEngineAdapter, PlayerPiPInlineRendererControlling {'
          if old_decl in text:
              text = text.replace(old_decl, new_decl)

          field_anchor = '    private var lastPresentationTimingSignature: PresentationTimingSignature?\n'
          if 'private var pictureInPictureRendererSuspended = false' not in text:
              if text.count(field_anchor) != 1: raise SystemExit('MPV PiP field anchor mismatch')
              text = text.replace(field_anchor, field_anchor + '    private var pictureInPictureRendererSuspended = false\n', 1)

          if 'func suspendInlineRendererForPictureInPicture' not in text:
              anchor = '''    func play() { setPropertyAsync(name: "pause", value: "no") }
    func pause() { setPropertyAsync(name: "pause", value: "yes") }

    func setPlaybackRate(_ rate: Double) {'''
              if text.count(anchor) != 1: raise SystemExit('MPV play/pause anchor mismatch')
              methods = '''    func play() { setPropertyAsync(name: "pause", value: "no") }
    func pause() { setPropertyAsync(name: "pause", value: "yes") }

    func suspendInlineRendererForPictureInPicture(completion: @escaping (Bool) -> Void) {
        queue.async { [weak self] in
            guard let self, let handle = self.mpv, !self.isStopping else { DispatchQueue.main.async { completion(false) }; return }
            if self.pictureInPictureRendererSuspended { DispatchQueue.main.async { completion(true) }; return }
            let previousVO = self.getStringProperty(handle: handle, name: "current-vo") ?? "unknown"
            guard self.setPropertyChecked(handle: handle, name: "vo", value: "null") else {
                DiagnosticsLogger.shared.log("MPVPiP", "vo suspend request failed previousVO=\(previousVO)")
                DispatchQueue.main.async { completion(false) }
                return
            }
            self.waitForPictureInPictureVO(handle: handle, target: "null", attempt: 0) { [weak self] ready, currentVO in
                guard let self else { DispatchQueue.main.async { completion(false) }; return }
                self.pictureInPictureRendererSuspended = ready
                DiagnosticsLogger.shared.log("MPVPiP", "vo suspend ready=\(ready) previousVO=\(previousVO) currentVO=\(currentVO) decoderPreserved=true")
                DispatchQueue.main.async { completion(ready) }
            }
        }
    }

    func resumeInlineRendererAfterPictureInPicture(completion: @escaping (Bool) -> Void) {
        queue.async { [weak self] in
            guard let self, let handle = self.mpv, !self.isStopping else { DispatchQueue.main.async { completion(false) }; return }
            guard self.pictureInPictureRendererSuspended else { DispatchQueue.main.async { completion(true) }; return }
            guard self.setPropertyChecked(handle: handle, name: "vo", value: "gpu-next") else {
                DiagnosticsLogger.shared.log("MPVPiP", "vo restore request failed")
                DispatchQueue.main.async { completion(false) }
                return
            }
            self.waitForPictureInPictureVO(handle: handle, target: "gpu-next", attempt: 0) { [weak self] ready, currentVO in
                guard let self else { DispatchQueue.main.async { completion(false) }; return }
                if ready { self.pictureInPictureRendererSuspended = false }
                let drawable = self.displayLayer.drawableSize
                DiagnosticsLogger.shared.log("MPVPiP", "vo restore ready=\(ready) currentVO=\(currentVO) drawable=\(Int(drawable.width))x\(Int(drawable.height)) decoderPreserved=true")
                DispatchQueue.main.async { completion(ready) }
            }
        }
    }

    private func waitForPictureInPictureVO(handle: OpaquePointer, target: String, attempt: Int, completion: @escaping (Bool, String) -> Void) {
        guard let currentHandle = mpv, currentHandle == handle, !isStopping else { completion(false, "detached"); return }
        let currentVO = getStringProperty(handle: handle, name: "current-vo") ?? "unknown"
        let voMatched = target == "null" ? currentVO.contains("null") : currentVO.contains("gpu-next")
        let drawable = displayLayer.drawableSize
        let drawableReady = target == "null" || (drawable.width > 1 && drawable.height > 1)
        if voMatched && drawableReady { completion(true, currentVO); return }
        guard attempt < 20 else { completion(false, currentVO); return }
        queue.asyncAfter(deadline: .now() + 0.01) { [weak self] in
            self?.waitForPictureInPictureVO(handle: handle, target: target, attempt: attempt + 1, completion: completion)
        }
    }

    func setPlaybackRate(_ rate: Double) {'''
              text = text.replace(anchor, methods, 1)

              fallback = '''    func play() {}
    func pause() {}
    func setVideoGeometry(panscan: Double, aspectOverride: String?) {}'''
              if text.count(fallback) != 1: raise SystemExit('MPV fallback anchor mismatch')
              replacement = '''    func play() {}
    func pause() {}
    func suspendInlineRendererForPictureInPicture(completion: @escaping (Bool) -> Void) { completion(false) }
    func resumeInlineRendererAfterPictureInPicture(completion: @escaping (Bool) -> Void) { completion(false) }
    func setVideoGeometry(panscan: Double, aspectOverride: String?) {}'''
              text = text.replace(fallback, replacement, 1)

          path.write_text(text)
          PY
          git diff --check
          git add Sources/Player/MPVPlayerEngine.swift
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build159: add MPV PiP video-output lifecycle"
            git push origin HEAD:fix/pip-vo-timebase-0.13.92
          fi

      - name: Verify Build159 contracts
        run: |
          set -euo pipefail
          grep -Fq 'sourceVersion = "0.13.92"' Sources/Core/AppIdentity.swift
          grep -Fq 'homePolicy=didStart-immediate' Sources/UI/PlayerPiPSessionCoordinator.swift
          grep -Fq 'displayLayer.flush()' Sources/UI/PlayerPiPSessionCoordinator.swift
          ! grep -Fq 'CMTimebaseSetTime(timebase, time: CMTime(seconds: playbackController.snapshot.position' Sources/UI/PlayerPiPSessionCoordinator.swift
          grep -Fq 'PlayerEngine, PlaybackPresentationEngineAdapter, PlayerPiPInlineRendererControlling' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'name: "vo", value: "null"' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'name: "vo", value: "gpu-next"' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'decoderPreserved=true' Sources/Player/MPVPlayerEngine.swift
          ! grep -Fq 'vid", value: "no"' Sources/Player/MPVPlayerEngine.swift
          ! grep -Fq 'PlayerPiPInlineRendererControlling' Sources/UI/MPVPlayerSurface.swift
          grep -Fq 'kCMSampleAttachmentKey_DoNotDisplay' Sources/UI/PlayerPiPSamplePipeline.swift
          test ! -e Sources/UI/PlayerSampleBufferPiPBridge.swift

          git fetch origin refactor/pip-session-0.13.91 --depth=1
          test -z "$(git diff --name-only origin/refactor/pip-session-0.13.91...HEAD -- Sources/Player/PlayerController.swift Sources/Player/KSAVIOPlayerEngine.swift Sources/Transport/UnifiedMediaTransportSession.swift Sources/Player/PlaybackPresentationCoordinator.swift Sources/Player/PlaybackPresentationAdapters.swift MDKLab)"

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          def seek_body(text):
              s = text.index('    func seek(to seconds: Double, direction: SeekDirection)')
              e = text.index('\n    private func claimKeyframeLookupIndex()', s)
              return text[s:e]
          head = Path('Sources/Player/MPVPlayerEngine.swift').read_text()
          base = subprocess.check_output(['git', 'show', 'origin/refactor/pip-session-0.13.91:Sources/Player/MPVPlayerEngine.swift'], text=True)
          assert seek_body(head) == seek_body(base)
          assert 'absolute+keyframes' in seek_body(head)
          assert 'absolute+exact' not in seek_body(head)
          PY

          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          git diff --check

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Build159 Release
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.92 CURRENT_PROJECT_VERSION=159 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.92' --build '159' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.92-build159-pip-vo-timebase-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build159 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.92-build159-pip-vo-timebase
          path: |
            OnePlayer-0.13.92-build159-pip-vo-timebase-unsigned.ipa
            OnePlayer-0.13.92-build159-pip-vo-timebase-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build159 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.92-build159-pip-vo-timebase-failure
          path: |
            build.log
            package-resolution.log
            app-validation.log
            min-os-report.log
          if-no-files-found: ignore
          retention-days: 14
