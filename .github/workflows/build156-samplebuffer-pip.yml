name: Build OnePlayer 0.13.90 Build157 PiP Lifecycle

on:
  workflow_dispatch:
  push:
    branches: [fix/pip-home-mpv-resume-0.13.90]
    paths:
      - "Sources/**"
      - "project.mdklab.yml"
      - "Podfile"
      - ".github/workflows/build156-samplebuffer-pip.yml"
  pull_request:
    branches: [lab/pip-samplebuffer-0.13.89]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build157-pip-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout Build157 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Build157 contracts
        run: |
          set -euo pipefail
          grep -Fq 'sourceVersion = "0.13.90"' Sources/Core/AppIdentity.swift
          grep -Fq 'ContentSource(sampleBufferDisplayLayer:' Sources/UI/PlayerPictureInPictureController.swift
          grep -Fq 'AVPictureInPictureSampleBufferPlaybackDelegate' Sources/UI/PlayerPictureInPictureController.swift
          grep -Fq 'suspendVideoOutputForPictureInPicture' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'resumeVideoOutputFromPictureInPicture' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'name: "vid", value: "no"' Sources/Player/MPVPlayerEngine.swift
          grep -Fq 'NSSelectorFromString("suspend")' Sources/UI/PlayerPictureInPictureController.swift
          grep -Fq 'restoreUserInterfaceForPictureInPictureStopWithCompletionHandler' Sources/UI/PlayerPictureInPictureController.swift
          ! grep -Fq 'switchEngine(to: .transportAVPlayer' Sources/UI/PlayerPictureInPictureController.swift
          ! grep -Fq 'AVPictureInPictureController(playerLayer:' Sources/UI/PlayerPictureInPictureController.swift
          ! grep -Fq 'activeVideoCallSourceView:' Sources/UI/PlayerPictureInPictureController.swift

          git fetch origin lab/pip-samplebuffer-0.13.89 --depth=1
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          head = Path('Sources/Player/MPVPlayerEngine.swift').read_text()
          base = subprocess.check_output(['git','show','origin/lab/pip-samplebuffer-0.13.89:Sources/Player/MPVPlayerEngine.swift'], text=True)
          def seek_body(text):
              start = text.index('    func seek(to seconds: Double, direction: SeekDirection)')
              end = text.index('\n    private func claimKeyframeLookupIndex()', start)
              return text[start:end]
          assert seek_body(head) == seek_body(base)
          controller = Path('Sources/Player/PlayerController.swift').read_text()
          start = controller.index('    func seek(by offset: Double)')
          end = controller.index('\n    func beginScrubbing()', start)
          body = controller[start:end]
          assert 'engine.seek(to: target' in body
          assert 'absolute+keyframes' in seek_body(head)
          assert 'absolute+exact' not in seek_body(head)
          PY
          test -z "$(git diff --name-only origin/lab/pip-samplebuffer-0.13.89...HEAD -- Sources/Player/PlayerController.swift Sources/Player/KSAVIOPlayerEngine.swift Sources/Player/PlaybackPresentationCoordinator.swift Sources/Player/PlaybackPresentationAdapters.swift Sources/Transport/UnifiedMediaTransportSession.swift Sources/UI/PlayerSampleBufferPiPBridge.swift MDKLab)"
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          git diff --check

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Build157 Release
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.90 CURRENT_PROJECT_VERSION=157 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.90' --build '157' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.90-build157-pip-lifecycle-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build157 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.90-build157-pip-lifecycle
          path: |
            OnePlayer-0.13.90-build157-pip-lifecycle-unsigned.ipa
            OnePlayer-0.13.90-build157-pip-lifecycle-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build157 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.90-build157-pip-lifecycle-failure
          path: |
            build.log
            package-resolution.log
            app-validation.log
            min-os-report.log
          if-no-files-found: ignore
          retention-days: 14
