name: Temp Search PR264 MPV Compile

on:
  push:
    branches: ["feat/search-page-optimization"]
    paths:
      - ".github/search-pr264-compile-trigger.txt"

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout exact Search product source
        uses: actions/checkout@v4
        with:
          ref: cf8be3562687ed65a8cf63c62ad3dda3150d3cde

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate assets and project
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update

      - name: Resolve MPVKit
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Compile Search product source
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build 2>&1 | tee search-compile.log

      - name: Verify minimum deployment setting
        run: |
          set -euo pipefail
          grep -F 'IPHONEOS_DEPLOYMENT_TARGET = 15.0' <(xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -showBuildSettings -clonedSourcePackagesDirPath .spm-cache)

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Search-PR264-compile-${{ github.sha }}
          path: search-compile.log
          if-no-files-found: warn
          retention-days: 14
