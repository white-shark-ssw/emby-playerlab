name: Finalize v0.12.6 Build 64

on:
  push:
    branches: [dev/v0.12.6-frontier-rescue]

permissions:
  contents: write

concurrency:
  group: finalize-v0126
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[v0.12.6-final]') && !contains(github.event.head_commit.message, '[v0.12.6-debug]') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.12.6-frontier-rescue

      - name: Run finalizer and capture result
        run: |
          set +e
          python3 scripts/finalize_v0126.py > finalize-v0126.log 2>&1
          STATUS=$?
          cat finalize-v0126.log
          if [ "$STATUS" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add finalize-v0126.log
            git commit -m 'Capture v0.12.6 finalizer failure [v0.12.6-debug]'
            git push origin HEAD:dev/v0.12.6-frontier-rescue
            exit 0
          fi

          python3 scripts/check_transport_scheduler_invariants.py
          python3 scripts/check_transport_v3_invariants.py
          python3 scripts/check_seek_stall_invariants.py
          python3 scripts/check_transport_stability_invariants.py
          python3 scripts/check_scheduler_v2_invariants.py
          python3 scripts/check_live_lane_startup_invariants.py
          python3 scripts/check_v0122_regressions.py
          python3 scripts/check_v0123_regressions.py
          python3 scripts/check_v0124_regressions.py
          python3 scripts/check_v0126_frontier_rescue.py
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "regression gate failed with status $STATUS" >> finalize-v0126.log
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add finalize-v0126.log
            git commit -m 'Capture v0.12.6 regression failure [v0.12.6-debug]'
            git push origin HEAD:dev/v0.12.6-frontier-rescue
            exit 0
          fi

          rm -f finalize-v0126.log scripts/finalize_v0126.py .github/workflows/finalize-v0126.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'v0.12.6 Build 64: frontier rescue and urgent hedge [v0.12.6-final]'
          git push origin HEAD:dev/v0.12.6-frontier-rescue
