name: Temp apply detail immersive feature patch

on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-apply-detail-immersive-feature-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/detail-immersive-toggle-navigation-race-20260811
          fetch-depth: 0
      - name: Patch feature branch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          root = Path('Sources/UI/EmbyServerRootViewV3.swift')
          text = root.read_text()
          text = replace_once(text, '''                    }
                    .frame(width: geometry.size.width, height: fullHeight, alignment: .top)
                    .ignoresSafeArea(.container, edges: .bottom)
''', '''                    }
                    .environment(\\.serverDockContent, AnyView(serverTabBar))
                    .frame(width: geometry.size.width, height: fullHeight, alignment: .top)
                    .ignoresSafeArea(.container, edges: .bottom)
''', 'server dock environment injection')
          root.write_text(text)

          detail = Path('Sources/UI/EmbyMediaDetailView.swift')
          text = detail.read_text()
          text = replace_once(text, '''        GeometryReader { geometry in
            let fullHeight = geometry.size.height + geometry.safeAreaInsets.bottom
            ZStack(alignment: .top) {
''', '''        GeometryReader { geometry in
            ZStack(alignment: .top) {
''', 'detail fullHeight declaration')
          count = text.count('.frame(width: geometry.size.width, height: fullHeight)')
          if count != 2:
              raise SystemExit(f'detail fullHeight frames: expected 2 matches, got {count}')
          text = text.replace('.frame(width: geometry.size.width, height: fullHeight)', '.frame(width: geometry.size.width, height: geometry.size.height)')
          text = replace_once(text, '        .hidesServerDockWhileVisible()\n', '        .detailPagePresentation()\n        .onAppear { DiagnosticsLogger.shared.log("NavigationRace", "event=detail-appear item=\\(model.item.id)") }\n        .onDisappear { DiagnosticsLogger.shared.log("NavigationRace", "event=detail-disappear item=\\(model.item.id)") }\n', 'detail presentation modifier')
          detail.write_text(text)

          workflow = Path('.github/workflows/one-shot-detail-immersive-patch.yml')
          if workflow.exists(): workflow.unlink()
          PY
          git diff --check
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add -A
          git commit -m 'feat: wire immersive detail viewport and dock mode [detail-immersive-patched]'
          git push origin HEAD:chatgpt/detail-immersive-toggle-navigation-race-20260811
