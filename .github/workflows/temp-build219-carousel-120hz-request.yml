name: Build219 Carousel 120Hz Request IPA

on:
  push:
    branches: [diag/home-carousel-120hz-request-build219]
    paths:
      - ".github/build219-carousel-120hz-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build219 branch
        uses: actions/checkout@v4
        with:
          ref: diag/home-carousel-120hz-request-build219
          fetch-depth: 0

      - name: Validate exact Build219 scope and retained contracts
        run: |
          set -euo pipefail
          base='ab65b795b8e99d2eeb61cbfc8740bc18c82c49a4'
          git diff --check "$base"...HEAD
          python3 scripts/check_home_carousel_single_owner.py
          python3 - <<'PY'
          import subprocess
          base = 'ab65b795b8e99d2eeb61cbfc8740bc18c82c49a4'
          allowed = {
              '.github/build219-carousel-120hz-trigger.txt',
              '.github/workflows/temp-build219-carousel-120hz-request.yml',
              'Sources/Core/AppIdentity.swift',
              'Sources/UI/EmbyHomeCarouselCadenceDiagnosticsV3.swift',
              'docs/changelog/CHANGELOG_v0_14_52_build219.md',
              'scripts/check_home_carousel_single_owner.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', f'{base}...HEAD'], text=True).splitlines())
          extra = sorted(changed - allowed)
          if extra:
              raise SystemExit(f'Unexpected Build219 files: {extra}')
          required = {
              'Sources/Core/AppIdentity.swift',
              'Sources/UI/EmbyHomeCarouselCadenceDiagnosticsV3.swift',
              'docs/changelog/CHANGELOG_v0_14_52_build219.md',
              'scripts/check_home_carousel_single_owner.py',
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(f'Missing Build219 files: {missing}')
          frozen_prefixes = ('Sources/Player/', 'Sources/Transport/', 'Sources/Cache/', 'Sources/Session/', 'Sources/AVIO/')
          touched_frozen = sorted(path for path in changed if path.startswith(frozen_prefixes))
          if touched_frozen:
              raise SystemExit(f'Build219 touched Frozen/P0 paths: {touched_frozen}')
          forbidden = {
              'Sources/UI/EmbyHomeCarouselInteractionV3.swift',
              'Sources/UI/EmbyHomeCarouselStateV3.swift',
              'Sources/UI/EmbyHomeHeroV3.swift',
              'Sources/UI/EmbyHomeCoreV3.swift',
              'Sources/UI/EmbySharedImageAndNavigation.swift',
          }
          touched_forbidden = sorted(changed & forbidden)
          if touched_forbidden:
              raise SystemExit(f'Build219 unexpectedly changed retained/shared owners: {touched_forbidden}')
          print('Build219 exact 120Hz-request diagnostic scope: PASS')
          PY
          echo "BUILD219_SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Prepare OnePlayer app icons
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache | tee package-resolution.log

      - name: Build Release
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            MARKETING_VERSION=0.14.52 \
            CURRENT_PROJECT_VERSION=219 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build219.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id com.embyplayerlab.app --version 0.14.52 --build 219 --display-name OnePlayer --minimum-os 15.0 --primary-icon OnePlayerIcon --alternate-icon OnePlayerAltIcon

      - name: Validate MinOS
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" 15.0 17.0 build219-min-os.log build219.log

      - name: Package unsigned IPA and source snapshot
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA="OnePlayer-0.14.52-build219-home-carousel-120hz-request-unsigned.ipa"
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA"
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          SOURCE="OnePlayer-0.14.52-build219-source.zip"
          git archive --format=zip --output "$SOURCE" HEAD
          shasum -a 256 "$SOURCE" | tee "$SOURCE.sha256"
          printf '%s\n' "$BUILD219_SOURCE" > build219-source-sha.txt
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"

      - name: Upload Build219 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.52-build219-home-carousel-120hz-request
          path: |
            ${{ env.IPA }}
            ${{ env.IPA }}.sha256
            ${{ env.SOURCE }}
            ${{ env.SOURCE }}.sha256
            build219-source-sha.txt
            build219.log
            build219-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30
