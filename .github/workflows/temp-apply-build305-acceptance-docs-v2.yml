name: Apply Build305 Acceptance Docs V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-apply-build305-acceptance-docs-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rewrite durable acceptance docs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          state = Path('docs/project/PROJECT_STATE.md')
          s = state.read_text()
          lines = s.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('_Last updated'):
                  lines[i] = '_Last updated 2026-10-09: Build305 / 0.15.38 的 Library 递归媒体查询修复已获目标真机确认并通过 PR #293 合并；该任务本身已完成。由于同一 Build305 会话立即暴露 Home → 详情/库页 → 返回时已加载海报图片被清空后重新采用的新回归，当前 **accepted overall baseline 仍保持 Build303**，新问题由独立 `DEV-home-return-poster-retention` / Build306 处理。_'
                  break
          s = '\n'.join(lines) + '\n'
          marker = 'Historical dated entries below preserve their original evidence levels;'
          section = '''## Accepted feature milestone — Build305 / 0.15.38 Library media-only root\n\n- Product source: `3476a3d9a8976ef483bb9d9e2317d0d2e442f8bb`; CI run/job `37832789044 / 113502123244` success; 53 tests / 0 failures; artifact `11574533261`; IPA SHA-256 `f843cd2ace20f9aa15f447c8d98e4935211a033b65e4493dd649fde30b9e53d4`; MinOS 15.0.\n- Target-device result on 2026-10-09: user explicitly confirmed the prior Folder/intermediate-page problem is fixed.\n- Durable contract: explicit `includeItemTypes` remains authoritative; only recursive Library-content requests with an empty type scope default to `Movie,Series,Video`; non-recursive Folder browsing remains unrestricted and retains the existing Folder owner/path.\n- Build304 routing remains only a bounded safety path if a browsable Folder legitimately reaches the root; no client-side Folder flattening, second loader or detail-internal workaround is part of the accepted design.\n- PR #293 merged at `91b705ca3b62064957169ea8bd2dff71ccc1e180`.\n- Evidence: **Code written ✅ / CI passed ✅ / IPA produced+verified ✅ / real-device tested ✅ / feature task accepted ✅ / merged ✅**.\n- This is a feature milestone, not a promotion of Build305 to accepted overall baseline, because the separate Home-return poster-retention regression was reported immediately afterward and remains Active under Build306.\n\n'''
          if '## Accepted feature milestone — Build305 / 0.15.38 Library media-only root' not in s:
              s = s.replace(marker, section + marker, 1)
          state.write_text(s)

          module = Path('docs/project/MODULE_STATUS.md')
          s = module.read_text()
          row = '| Library recursive media-only content / Folder routing | **Stable — Build305 target-device accepted / merged** | Build305 / 0.15.38 exact source `3476a3d9a8976ef483bb9d9e2317d0d2e442f8bb`; CI `37832789044 / 113502123244`, 53/0; artifact `11574533261`; IPA SHA-256 `f843cd2ace20f9aa15f447c8d98e4935211a033b65e4493dd649fde30b9e53d4`; MinOS15. User confirmed the prior Folder/intermediate-page issue fixed on 2026-10-09; PR#293 merged `91b705ca3b62064957169ea8bd2dff71ccc1e180`. Recursive empty-scope Library content defaults to Movie/Series/Video; explicit scopes and non-recursive Folder browsing remain authoritative. Separate Home-return poster retention regression is not part of this module\'s acceptance. |\n'
          if 'Library recursive media-only content / Folder routing' not in s:
              anchor = '| Poster 3-column / poster-heavy scroll smoothness |'
              pos = s.find(anchor)
              end = s.find('\n', pos)
              if pos < 0 or end < 0: raise SystemExit('MODULE_STATUS anchor missing')
              s = s[:end+1] + row + s[end+1:]
          module.write_text(s)

          index = Path('docs/project/BUILD_TEST_INDEX.md')
          s = index.read_text()
          section = '''## Accepted feature milestone — Build305 / 0.15.38\n\n`DEV-meaningless-detail-routing` is complete for its scoped Library-content problem. Exact product source `3476a3d9a8976ef483bb9d9e2317d0d2e442f8bb`; dedicated CI `37832789044 / 113502123244` passed with 53 tests / 0 failures; artifact `11574533261`, digest `sha256:9ae178b9492534d0357bfcf3a7ddc8fcada49b1a49380019ef76dbc53b040b53`; IPA SHA-256 `f843cd2ace20f9aa15f447c8d98e4935211a033b65e4493dd649fde30b9e53d4`; source ZIP SHA-256 `a6ef12cff823c2d9b959635e079176cd1d18dc11ab535b3151c255bbf9a4ca11`; MinOS 15.0.\n\nTarget-device 2026-10-09: user explicitly confirmed the prior Folder/intermediate-page issue fixed. Accepted query contract: recursive empty-scope Library content uses `Movie,Series,Video`; explicit scopes remain unchanged; non-recursive Folder browsing remains unrestricted. PR #293 merged at `91b705ca3b62064957169ea8bd2dff71ccc1e180`.\n\nEvidence: **Code written ✅ / CI passed ✅ / IPA produced+verified ✅ / real-device tested ✅ / scoped task accepted ✅ / merged ✅**.\n\nBuild305 is **not** promoted to accepted overall baseline because the same device session exposed a separate Home-return poster-artwork blank/reload regression. That work is Active as `DEV-home-return-poster-retention` / reserved Build306.\n\n'''
          marker = 'Historical dated entries below preserve their original evidence levels;'
          if '## Accepted feature milestone — Build305 / 0.15.38' not in s:
              s = s.replace(marker, section + marker, 1)
          index.write_text(s)

          decisions = Path('docs/project/TECHNICAL_DECISIONS.md')
          s = decisions.read_text()
          section = '''## D011A — Recursive Library content is media-only; Folder browsing remains explicit\n\nFor normal Library content, an empty caller-supplied type scope is normalized only when the request is recursive: `Movie,Series,Video`. Explicit `includeItemTypes` values remain authoritative. Dedicated Folder browsing remains the existing non-recursive path and is intentionally not forced media-only.\n\nThis decision comes from Build304/305 target-device evidence for movie libraries where one physical Folder contains multiple videos. Client-side Folder flattening, global Folder suppression, a second loader, or hiding Folder behavior inside detail UI are rejected. Build305 / 0.15.38 was target-device accepted for this scoped behavior on 2026-10-09 and merged through PR #293.\n\n'''
          if '## D011A — Recursive Library content is media-only' not in s:
              s = s.replace('## D012 — Home-carousel', section + '## D012 — Home-carousel', 1)
          decisions.write_text(s)
          PY
          rm -f docs/project/current/dev/DEV-meaningless-detail-routing.md
          rm -f scripts/build305_acceptance_docs.patch
          rm -f .github/workflows/temp-apply-build305-acceptance-docs.yml
          rm -f .github/workflows/temp-apply-build305-acceptance-docs-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close out accepted Build305 Library routing"
          git push origin HEAD:main
