name: Temp Apply Scroll Performance

on:
  push:
    branches: [perf/promotion-scroll-smoothness]
    paths:
      - '.github/workflows/temp-apply-scroll-performance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply performance patch
        run: python3 .github/apply_scroll_performance.py

      - name: Run performance regression check
        run: python3 scripts/check_scroll_performance.py

      - name: Commit source changes and remove staging files
        run: |
          set -euo pipefail
          git config user.name 'os-player-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/apply_scroll_performance.py .github/workflows/temp-apply-scroll-performance.yml
          git add Config/Info.plist Sources/UI/EmbySharedImageAndNavigation.swift Sources/UI/EmbyServerRootViewV3.swift Sources/UI/EmbyPosterGrid.swift scripts/check_scroll_performance.py
          git commit -m 'perf: unlock ProMotion and reduce scroll work'
          git push origin HEAD:perf/promotion-scroll-smoothness
