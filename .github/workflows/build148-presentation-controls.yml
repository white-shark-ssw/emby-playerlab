name: Build OnePlayer 0.13.81 Build148 Presentation Controls

on:
  workflow_dispatch:
  push:
    branches: [fix/presentation-controls-0.13.81]
    paths:
      - "Sources/**"
      - "project.mdklab.yml"
      - "Podfile"
      - ".github/workflows/build148-presentation-controls.yml"
  pull_request:
    branches: [ui/playback-settings-polish-0.13.80]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build148-presentation-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout Build148 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Build148 presentation contracts
        run: |
          set -euo pipefail
          grep -Fq 'sourceVersion = "0.13.81"' Sources/Core/AppIdentity.swift
          grep -Fq 'return sourceFPS < target - 0.5 ? target : nil' Sources/Player/PlaybackPresentationCoordinator.swift
          ! grep -Fq 'case sharpen' Sources/Player/PlaybackPresentationCoordinator.swift
          grep -Fq 'let framesPerSecond: Double' Sources/UI/DisplayRefreshRateMonitor.swift
          grep -Fq '@Published private(set) var measuredFramesPerSecond: Double' Sources/UI/DisplayRefreshRateMonitor.swift
          grep -Fq 'measuredFramesPerSecond = clamped' Sources/UI/DisplayRefreshRateMonitor.swift
          ! grep -Fq 'framesPerSecond = clamped' Sources/UI/DisplayRefreshRateMonitor.swift
          ! grep -Fq 'onPreferencesChanged()' Sources/UI/PlayerPlaybackSettingsPopover.swift
          python3 - <<'PY'
          from pathlib import Path
          coordinator = Path('Sources/Player/PlaybackPresentationCoordinator.swift').read_text()
          assert 'case .fps60:\n            target = min(60, displayFPS)' in coordinator
          assert 'case .fps120:\n            target = min(120, displayFPS)' in coordinator
          assert 'guard let sourceFPS, sourceFPS.isFinite, sourceFPS > 0 else { return target }' in coordinator
          assert 'sourceFPS < target - 0.5 ? target : nil' in coordinator
          monitor = Path('Sources/UI/DisplayRefreshRateMonitor.swift').read_text()
          assert '@Published private(set) var framesPerSecond' not in monitor
          assert 'controlTarget=' in monitor
          popover = Path('Sources/UI/PlayerPlaybackSettingsPopover.swift').read_text()
          assert popover.count('onPreferencesChanged()') == 0
          seek = Path('Sources/Player/MPVPlayerEngine.swift').read_text()
          seek_start = seek.index('    func seek(to seconds: Double, direction: SeekDirection)')
          seek_end = seek.index('\n    private func claimKeyframeLookupIndex()', seek_start)
          seek_body = seek[seek_start:seek_end]
          assert seek_body.count('self.command(handle, ["seek"') == 1
          assert 'absolute+keyframes' in seek_body
          assert 'absolute+exact' not in seek_body
          PY
          git fetch origin ui/playback-settings-polish-0.13.80 --depth=1
          test -z "$(git diff --name-only origin/ui/playback-settings-polish-0.13.80...HEAD -- MDKLab Sources/Player/KSAVIOPlayerEngine.swift Sources/Player/PlaybackPresentationAdapters.swift)"
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          git diff --check

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Build148 Release
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.81 CURRENT_PROJECT_VERSION=148 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.81' --build '148' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.81-build148-presentation-controls-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build148 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.81-build148-presentation-controls
          path: |
            OnePlayer-0.13.81-build148-presentation-controls-unsigned.ipa
            OnePlayer-0.13.81-build148-presentation-controls-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build148 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.81-build148-presentation-controls-failure
          path: |
            build.log
            package-resolution.log
            app-validation.log
            min-os-report.log
          if-no-files-found: ignore
          retention-days: 14
