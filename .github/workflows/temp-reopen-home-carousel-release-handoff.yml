name: TEMP Reopen Home Carousel Release Handoff

on:
  push:
    branches: [docs/home-carousel-release-handoff-reopen-20260829]
    paths: [.github/home-carousel-release-handoff-trigger.txt]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: docs/home-carousel-release-handoff-reopen-20260829
          fetch-depth: 0
      - name: Prepare helper and latest main
        run: |
          set -euo pipefail
          cp scripts/temp_reopen_home_carousel_release_handoff.py /tmp/temp_reopen_home_carousel_release_handoff.py
          git fetch origin main
          git checkout -B main origin/main
      - name: Apply current evidence
        run: python3 /tmp/temp_reopen_home_carousel_release_handoff.py
      - name: Validate and push docs
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={
            'docs/project/current/dev/DEV-home-carousel-drag-smoothness.md',
            'docs/project/MODULE_STATUS.md',
            'docs/project/PROJECT_STATE.md',
            'docs/project/TECHNICAL_DECISIONS.md',
            'docs/project/BUILD_TEST_INDEX.md'
          }
          if changed != allowed:
              raise SystemExit(f'docs scope mismatch changed={sorted(changed)}')
          print('release-handoff docs scope: PASS')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/project
          git commit -m "Docs: reopen carousel release handoff continuity"
          git push origin HEAD:main
