name: TEMP Sync Build222 Device Evidence

on:
  push:
    branches: [main]
    paths: [.github/build222-device-sync-trigger.txt]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync Build222 real-device evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path
          import re

          checkpoint = Path('docs/project/current/dev/DEV-home-carousel-drag-smoothness.md')
          text = checkpoint.read_text()
          status = '''## Status\n\n**Active — Build221 / 0.14.54 remains the current horizontal-carousel CI/IPA-verified A/B with target-device testing pending. Independent sibling Build222 / 0.14.55 has now been target-device tested for Home vertical isolation and is not accepted: pausing new automatic carousel transitions whenever Home is scrolled away from the top did not materially remove the user's perceived vertical hitching. Build222 therefore rejects offscreen auto-advance alone as a sufficient Home fix; the next vertical A/B should isolate the always-mounted full-screen persistent backdrop before changing preload or other carousel owners.**'''
          text, n = re.subn(r'## Status\n\n\*\*Active —.*?\*\*', status, text, count=1, flags=re.S)
          if n != 1: raise SystemExit('checkpoint status marker mismatch')
          build222 = '''\n## Build222 / 0.14.55 — Home vertical auto-advance isolation real-device result\n\nBuild222 is an independent sibling A/B from the accepted Build216/main product baseline; it does **not** stack Build221's horizontal persistent-drag isolation. It changes only the automatic transition gate: `autoAdvanceCarouselIfNeeded()` returns while `abs(homeRawScrollMinY) > 0.5`, so new 6-second auto transitions do not begin after Home has scrolled away from the top. Manual horizontal carousel interaction, Hero rendering, persistent backdrop mounting, preload, page slots, acquisition-relative motion, 120 Hz request and release/settle contracts are unchanged.\n\n- branch: `diag/home-carousel-vertical-idle-build222`\n- tested source: `694221315c727ea055ea3b5ef7a9ea03a260fe80`\n- durable cleanup head: `f2a7221abb737552984e65f906637f36923e0cd3` (temporary workflow + trigger deletion only after packaging)\n- run/job: `33101409110 / 98619779746` — success\n- artifact ID: `9658757261`\n- artifact ZIP SHA-256: `e797e36a53174225eb37cb31d0986fe3b5b2c4b64a137882b3c9354ce3e51d92`\n- IPA SHA-256: `8cf6d454bf7eec64207875e9c20a1bbc6b125578f11fb777bfdda4fa6b5c5bfe`\n- source ZIP SHA-256: `0c1264c20547ac3bef698f0407fd6437d8643abef33ac2201e54818c92f7b3cb`\n- OnePlayer `0.14.55 (222)`, bundle and MinOS 15.0 independently verified.\n\nTarget-device feedback: **“好像我还是能感受到卡顿感”**. This is controlling evidence; Build222 is not a successful Home smoothness fix. The supplied recording `RPReplay_Final1787854824.mp4` is 510×1108, 30fps, 272 frames, ~9.07s. Frame tracking shows the clearest near-zero→large-movement transitions around ~2.70s and ~5.20s coincide with a new visible touch indicator / new swipe start, so those two transitions are **not** valid app-hitch samples. Continuous single-swipe segments do not expose the earlier clean one-recorded-frame macro hold/catch-up signature at 30fps, but 30fps cannot resolve the target device's 120Hz micro-stutter and does not override the user's tactile result.\n\nConclusion: **offscreen auto-advance is not sufficient as the Home root cause.** The remaining architecture candidate is the root-level, always-mounted `persistentCarouselBackdrop`: even away from Hero it keeps a full-screen 1400px image with `scaleEffect(1.12)` + `blur(radius: 30)` behind the moving Home scroll. `carouselPreloadLayer` also remains mounted and requests 1400px artwork for every carousel item, but it should be isolated separately rather than changed in the same A/B.\n\n**Build222 evidence: Code written ✅ / exact scope+protected-path guard ✅ / CI passed ✅ / IPA produced+verified ✅ / target-device tested ✅ / perceived vertical hitching remains ❌ / auto-advance-only isolation rejected as sufficient ✅ / not stable.**\n'''
          if '## Build222 / 0.14.55' not in text:
              marker = '\n## Next exact action\n'
              if marker not in text: raise SystemExit('checkpoint next-action marker missing')
              text = text.replace(marker, build222 + marker, 1)
          text = re.sub(r'## Next exact action\n.*?\Z', '''## Next exact action\n\nKeep Build221 as the separate horizontal-drag A/B pending device test. For Home vertical smoothness, do not tune auto-advance further. The next independent sibling A/B should isolate only the always-mounted full-screen persistent backdrop while Home is vertically away from Hero, leaving preload, Hero, horizontal gesture/state ownership and all Build215/219 contracts unchanged. If that materially improves vertical scrolling, persistent blur/composition becomes a causal architecture component; if not, reject it before testing preload separately.\n''', text, flags=re.S)
          checkpoint.write_text(text)

          module = Path('docs/project/MODULE_STATUS.md')
          text = module.read_text()
          replacement = '| Home carousel interaction | **Active — Build221 horizontal A/B pending; Build222 vertical auto-advance isolation real-device ineffective** | Build221 / 0.14.54 remains CI/IPA verified and pending target-device horizontal-drag testing. Independent Build222 / 0.14.55 paused new automatic carousel transitions whenever Home was scrolled away from the top, but target-device feedback still reports perceivable Home vertical hitching. Build222 therefore rejects offscreen auto-advance alone as a sufficient Home fix. Its 30fps recording does not show a clean continuous-swipe macro hold/catch-up; the strongest near-zero→jump points coincide with new swipe starts, so tactile 120Hz feedback remains authoritative. Next vertical A/B should isolate the always-mounted full-screen persistent backdrop only; do not mix this with Build221 or preload changes. Not stable. |'
          text, n = re.subn(r'^\| Home carousel interaction \|.*$', replacement, text, count=1, flags=re.M)
          if n != 1: raise SystemExit('module carousel row mismatch')
          module.write_text(text)

          index = Path('docs/project/BUILD_TEST_INDEX.md')
          text = index.read_text()
          row = '| **Build222 / 0.14.55** | Home vertical offscreen auto-advance isolation | **Target-device tested; perceived Home vertical hitching remains; A/B rejected as sufficient.** New automatic carousel transitions are blocked after Home scrolls away from top, while persistent backdrop/preload/Hero/horizontal interaction remain unchanged. Tested source `694221315c727ea055ea3b5ef7a9ea03a260fe80`; run/job `33101409110 / 98619779746`; artifact `9658757261`; IPA SHA-256 `8cf6d454bf7eec64207875e9c20a1bbc6b125578f11fb777bfdda4fa6b5c5bfe`; MinOS 15.0. Recording is 510×1108@30fps; obvious near-zero→jump points align with new swipe starts, so they are not counted as app hitches. User tactile result controls. Not stable. |'
          if '**Build222 / 0.14.55**' not in text:
              m = re.search(r'^\| \*\*Build221 / 0\.14\.54\*\*.*$', text, flags=re.M)
              if not m: raise SystemExit('Build221 index row missing')
              text = text[:m.end()] + '\n' + row + text[m.end():]
          index.write_text(text)

          state = Path('docs/project/PROJECT_STATE.md')
          text = state.read_text()
          block = '''\n### Build222 Home vertical architecture A/B result\n\nIndependent Build222 / 0.14.55 tested one narrow lifecycle hypothesis from the accepted Build216/main product baseline: once Home has scrolled away from the top, `autoAdvanceCarouselIfNeeded()` no longer starts a new automatic transition. It intentionally leaves persistent backdrop, preload, Hero and horizontal interaction unchanged and does not stack Build221. CI/IPA passed (`33101409110 / 98619779746`, artifact `9658757261`, tested source `694221315c727ea055ea3b5ef7a9ea03a260fe80`, IPA SHA-256 `8cf6d454bf7eec64207875e9c20a1bbc6b125578f11fb777bfdda4fa6b5c5bfe`, MinOS 15.0). Target-device feedback still perceives Home vertical hitching, so offscreen auto-advance alone is rejected as a sufficient fix. The supplied 30fps recording cannot prove the remaining 120Hz micro-stutter; its clearest zero→jump points coincide with new swipe starts. Next vertical A/B should isolate the root-level always-mounted persistent backdrop only, keeping preload and Build221 separate.\n'''
          if '### Build222 Home vertical architecture A/B result' not in text:
              marker = '\n## Active: Poster-heavy scrolling smoothness\n'
              if marker not in text: raise SystemExit('project state poster marker missing')
              text = text.replace(marker, block + marker, 1)
          state.write_text(text)
          PY
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md
          git diff --cached --check
          git commit -m "Record Build222 Home vertical device result"
          git push origin main
