name: One-shot dispatch Build Unsigned IPA v2

on:
  push:
    branches: [feat/home-ui-polish]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact feature head build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-unsigned-ipa.yml --repo "$GITHUB_REPOSITORY" --ref feat/home-ui-polish
