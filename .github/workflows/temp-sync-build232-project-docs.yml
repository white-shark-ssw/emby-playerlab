name: TEMP Sync Build232 Carousel Docs

on:
  push:
    branches: [diag/home-carousel-start-step-diagnostics-build232]
    paths:
      - ".github/build232-docs-sync-trigger.txt"

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build232 branch
        uses: actions/checkout@v4
        with:
          ref: diag/home-carousel-start-step-diagnostics-build232
          fetch-depth: 0
          persist-credentials: true

      - name: Update Build232 feature checkpoint
        run: |
          set -euo pipefail
          git fetch origin main
          python3 scripts/temp_sync_build232_docs.py branch
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          if ! git diff --cached --quiet; then
            git commit -m "Docs: record Build231 device success and Build232 diagnostic"
            git push origin HEAD:diag/home-carousel-start-step-diagnostics-build232
          fi

      - name: Sync authoritative Build232 docs to main
        run: |
          set -euo pipefail
          cp scripts/temp_sync_build232_docs.py /tmp/temp_sync_build232_docs.py
          git fetch origin main diag/home-carousel-start-step-diagnostics-build232
          git checkout -B main origin/main
          python3 /tmp/temp_sync_build232_docs.py main
          git diff --check
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md
          if ! git diff --cached --quiet; then
            git commit -m "Docs: sync carousel Build231 result and Build232 baseline [skip ci]"
            git push origin HEAD:main
          fi
