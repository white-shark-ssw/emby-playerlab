name: Build OnePlayer 0.13.86 Build153 Startup Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [perf/startup-range-bootstrap-0.13.86]
    paths:
      - "Sources/**"
      - "project.mdklab.yml"
      - "Podfile"
      - ".github/workflows/build153-startup-bootstrap.yml"
  pull_request:
    branches: [fix/fast-start-pip-0.13.85]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build153-startup-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout Build153 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Build153 contracts
        run: |
          set -euo pipefail
          grep -Fq 'sourceVersion = "0.13.86"' Sources/Core/AppIdentity.swift
          grep -Fq 'final class StartupRangeBootstrapCache' Sources/Transport/RedirectResolver.swift
          grep -Fq 'requestedBytes = StartupRangeBootstrapCache.shared.requestedBytes' Sources/Transport/RedirectResolver.swift
          grep -Fq 'request.setValue("bytes=0-\(requestedBytes - 1)"' Sources/Transport/RedirectResolver.swift
          grep -Fq 'StartupBootstrap' Sources/Transport/RedirectResolver.swift
          ! grep -Fq 'request.setValue("bytes=0-0"' Sources/Transport/RedirectResolver.swift
          grep -Fq 'StartupRangeBootstrapCache.shared.arm(cacheKey: cacheKey, maximumBytes: 1 * 1_048_576)' Sources/Transport/PlaybackTransportContext.swift
          grep -Fq 'StartupRangeBootstrapCache.shared.take(cacheKey: cacheKey' Sources/Transport/DownloadFirstSparseStore.swift
          grep -Fq 'avoid-second-head-range' Sources/Transport/DownloadFirstSparseStore.swift

          git fetch origin fix/fast-start-pip-0.13.85 --depth=1
          test -z "$(git diff --name-only origin/fix/fast-start-pip-0.13.85...HEAD -- Sources/Transport/UnifiedMediaTransportSession.swift Sources/Player/PlayerController.swift Sources/Player/MPVPlayerEngine.swift Sources/Player/KSAVIOPlayerEngine.swift Sources/Player/PlaybackPresentationCoordinator.swift Sources/Player/PlaybackPresentationAdapters.swift Sources/UI/PlayerPictureInPictureController.swift Sources/UI/MPVPlayerSurface.swift Sources/UI/KSAVIOPlayerSurface.swift MDKLab)"

          python3 - <<'PY'
          from pathlib import Path
          mpv = Path('Sources/Player/MPVPlayerEngine.swift').read_text()
          start = mpv.index('    func seek(to seconds: Double, direction: SeekDirection)')
          end = mpv.index('\n    private func claimKeyframeLookupIndex()', start)
          body = mpv[start:end]
          assert body.count('self.command(handle, ["seek"') == 1
          assert 'absolute+keyframes' in body
          assert 'absolute+exact' not in body
          PY

          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          git diff --check

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Build153 Release
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.86 CURRENT_PROJECT_VERSION=153 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.86' --build '153' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.86-build153-startup-bootstrap-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build153 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.86-build153-startup-bootstrap
          path: |
            OnePlayer-0.13.86-build153-startup-bootstrap-unsigned.ipa
            OnePlayer-0.13.86-build153-startup-bootstrap-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build153 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.86-build153-startup-bootstrap-failure
          path: |
            build.log
            package-resolution.log
            app-validation.log
            min-os-report.log
          if-no-files-found: ignore
          retention-days: 14
