name: Build OnePlayer 0.13.13 Transport Cache Timeline

on:
  push:
    branches: [feat/transport-cache-timeline-0.13.13]
  pull_request:
    branches: [feat/playback-buffer-ranges-0.13.12]

concurrency:
  group: transport-cache-timeline-01313-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Verify transport cache timeline contract
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'let cacheByteRanges: \[ClosedRange<Double>\]' Sources/UI/BufferedTimelineSlider.swift
          grep -q 'normalizedCacheRanges' Sources/UI/BufferedTimelineSlider.swift
          grep -q 'cacheByteRanges: controller.transportCacheRanges' Sources/UI/PlayerScreen.swift
          grep -q 'cachedByteRanges()' Sources/Player/PlayerController.swift
          grep -q 'Color.white.opacity(0.68)' Sources/UI/BufferedTimelineSlider.swift
          if grep -q 'bufferState.verifiedHistoryRanges' Sources/UI/BufferedTimelineSlider.swift; then exit 1; fi
          if grep -q 'bufferState.livePlayableRanges' Sources/UI/BufferedTimelineSlider.swift; then exit 1; fi
          grep -q 'MARKETING_VERSION: "0.13.13"' project.mdklab.yml
          grep -q 'CURRENT_PROJECT_VERSION: "80"' project.mdklab.yml

      - name: Select Xcode and tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodebuild -version
          swift --version

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build OnePlayer 0.13.13 Build80
        id: release_build
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Upload release build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.13-build80-release-diagnostics
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report release compiler failure
        if: steps.release_build.outcome == 'failure'
        run: |
          set -euo pipefail
          grep -nE '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|SwiftCompile|CompileSwift' build.log | tail -250 || true
          tail -120 build.log || true
          exit 1

      - name: Validate app identity and minimum OS
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.13' --build '80' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.13-build80-transport-cache-timeline-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.13-build80-transport-cache-timeline
          path: |
            OnePlayer-0.13.13-build80-transport-cache-timeline-unsigned.ipa
            OnePlayer-0.13.13-build80-transport-cache-timeline-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
          if-no-files-found: error
          retention-days: 14
