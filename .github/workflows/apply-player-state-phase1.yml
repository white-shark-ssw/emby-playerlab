name: Apply Player State Phase1

on:
  pull_request:
    branches: [ci/mdk-seek-audio-ui-0.13.51]
    paths:
      - "scripts/migrate_flat_player_state_phase1.py"
      - ".github/workflows/apply-player-state-phase1.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply state-ownership phase1
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/migrate_flat_player_state_phase1.py
          python3 scripts/migrate_flat_player_state_phase1.py
          git diff --check
          grep -Fq 'var renderedPosition: Double? = nil' Sources/Player/PlayerEngine.swift
          grep -Fq 'renderedPosition: lastRenderedTimestamp' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'action=queue-latest-single-native' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          ! grep -Fq 'MDKSeekPreempt' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'presentationPosition(for: value)' Sources/Player/PlayerController.swift
          ! grep -Fq 'liveTrackHeight' Sources/UI/BufferedTimelineSlider.swift

      - name: Commit migrated source
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add -- Sources/Player/PlayerEngine.swift MDKLab/App/MDKKSAVIOPlayerEngine.swift Sources/Player/PlayerController.swift Sources/UI/BufferedTimelineSlider.swift
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: separate rendered position and native seek ownership"
          git push origin "HEAD:${HEAD_BRANCH}"
