name: Sync Build224 Aether Evidence

on:
  push:
    branches: [feat/aether-multi-engine-comparison]
    paths:
      - .github/workflows/temp-build224-aether-fastseek.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply authoritative docs update
        run: |
          set -euo pipefail
          python3 scripts/temp_sync_build224_aether_docs.py
          git diff --check
      - name: Commit docs and clean Aether helpers
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-aether-build223-fastseek-vendor.yml
          rm -f .github/workflows/temp-aether-build224-apply.yml
          rm -f .github/workflows/temp-aether-build224-docsync.yml
          rm -f .github/workflows/temp-build224-aether-fastseek.yml
          rm -f scripts/temp_sync_build224_aether_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/current/dev/DEV-aether-multi-engine-comparison.md docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md .github/workflows scripts
          git commit -m "Record Build224 Aether fast-seek evidence"
          git push origin HEAD:feat/aether-multi-engine-comparison
