name: One-shot direct crop scroll model

on:
  push:
    branches:
      - "fix/direct-crop-scroll-consumption"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply direct crop scroll model
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[direct-crop-scroll-applied]'; then
            echo 'Patch already applied.'
            exit 0
          fi
          printf '\n' >> .github/direct-crop-scroll.patch
          git apply --check .github/direct-crop-scroll.patch
          git apply .github/direct-crop-scroll.patch
          cat > scripts/check_adaptive_hero_reveal.py <<'PY'
          from pathlib import Path


          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(f"::error::{message}")


          metrics = Path("Sources/UI/ImmersiveUIComponents.swift").read_text()
          detail = Path("Sources/UI/EmbyMediaDetailView.swift").read_text()
          picker = Path("Sources/UI/EmbyEpisodePickerView.swift").read_text()
          nav = Path("Sources/UI/ImmersiveUIComponents.swift").read_text()
          project = Path("project.yml").read_text()

          require("struct AdaptiveHeroRevealMetrics" in metrics, "shared adaptive Hero reveal metrics are missing")
          require("coverSize.height * (initialScale - fullScale)" in metrics, "crop travel must come from actual rendered image geometry")
          require("initialScale - consumedCropScroll / coverSize.height" in metrics, "image scale must follow raw finger/scroll displacement directly")
          require("consumedCropScroll(upwardScroll:" in metrics, "shared crop-scroll consumption is missing")
          require("eased(" not in metrics and "revealDistance(" not in metrics and "progress(upwardScroll:" not in metrics, "percentage/easing reveal timeline must stay removed")
          require("UIScreen.main.bounds" not in metrics and "iPhone 15" not in metrics, "Hero geometry must not depend on a device model or physical resolution")
          require("initialScale: CGFloat = 1.10" in metrics, "tested 0% Hero crop must remain unchanged")
          require("return min(1, min(widthScale, heightScale))" in metrics, "full reveal must reach true aspect-fit for both wide and narrow backdrops")

          require("heroConsumedCropScroll" in detail, "detail page must retain consumed crop scroll for layout compensation")
          require("baseHeight + heroConsumedCropScroll" in detail, "detail content must stay below the pinned Hero until crop reaches zero")
          require("stretch > 0 ? -stretch : consumedCropScroll" in detail, "detail Hero must pin during crop release and preserve elastic overscroll")
          require("AdaptiveHeroConsumedScrollPreferenceKey" in detail, "detail Hero must feed consumed displacement back into layout")
          require("location: clearImageBottom" in detail, "detail clear image must keep continuous fade into backdrop")
          require("contentMode: .fill" in detail and "contentMode: .fit, onImageLoaded:" not in detail, "detail reveal must remain one continuous image path")

          require("pickerHeroConsumedCropScroll" in picker, "episode picker must retain consumed crop scroll for layout compensation")
          require("baseHeight + pickerHeroConsumedCropScroll" in picker, "episode list must stay below pinned Hero until crop reaches zero")
          require("stretch > 0 ? -stretch : consumedCropScroll" in picker, "episode picker must share pin-then-exit and elastic behavior")
          require("AdaptiveHeroConsumedScrollPreferenceKey" in picker, "episode picker must share raw-displacement layout compensation")
          require("location: clearImageBottom" in picker, "episode picker clear image must keep continuous fade into backdrop")

          for forbidden in ["interactivePopGestureRecognizer", "UIGestureRecognizerDelegate", "transitionCoordinator", "popViewController("]:
              require(forbidden not in metrics, f"Hero visual geometry must never own native navigation: {forbidden}")
          require("nativeInteractivePop() -> some View { self }" in nav, "native interactive pop compatibility modifier must remain a no-op")
          require('iOS: "15.0"' in project and 'deploymentTarget: "15.0"' in project, "Deployment Target must remain iOS 15.0")
          print("direct crop-scroll consumption invariants: OK")
          PY
          python3 scripts/check_v0134_detail_navigation.py
          python3 scripts/check_adaptive_hero_reveal.py
          git diff --check
          git diff --stat

      - name: Commit source changes
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[direct-crop-scroll-applied]'; then exit 0; fi
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add Sources/UI/ImmersiveUIComponents.swift Sources/UI/EmbyMediaDetailView.swift Sources/UI/EmbyEpisodePickerView.swift scripts/check_adaptive_hero_reveal.py
          git commit -m 'fix: consume scroll through real Hero crop before exit [direct-crop-scroll-applied]'
          git push origin HEAD:fix/direct-crop-scroll-consumption
