name: Apply Build290 Home Dock Layout Fix

on:
  push:
    branches: [ci/build289-home-carousel-native-20261005]

permissions:
  contents: write

concurrency:
  group: build290-home-dock-patch
  cancel-in-progress: true

env:
  PREVIOUS_PRODUCT_SHA: 0f5a1893988e20e0dcfe21d0395abe194c2340e6
  PRODUCT_BRANCH: perf/home-carousel-progress-scope-build286

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact product patch
        run: |
          set -euo pipefail
          git fetch origin "$PRODUCT_BRANCH"
          test "$(git rev-parse "origin/$PRODUCT_BRANCH")" = "$PREVIOUS_PRODUCT_SHA"
          git checkout -B "$PRODUCT_BRANCH" "origin/$PRODUCT_BRANCH"
          python3 - <<'PY'
          from pathlib import Path
          core_path = Path("Sources/UI/EmbyHomeCoreV3.swift")
          core = core_path.read_text()
          old = "                }\n                .background(Color(uiColor: .systemBackground).ignoresSafeArea())\n"
          new = "                }\n                .frame(width: geometry.size.width, height: geometry.size.height, alignment: .top)\n                .background(Color(uiColor: .systemBackground).ignoresSafeArea())\n"
          if core.count(old) != 1:
              raise SystemExit(f"unexpected Home root layout match count: {core.count(old)}")
          core_path.write_text(core.replace(old, new, 1))
          identity_path = Path("Sources/Core/AppIdentity.swift")
          identity = identity_path.read_text()
          if identity.count('"0.15.22"') != 2:
              raise SystemExit("unexpected AppIdentity version count")
          identity_path.write_text(identity.replace('"0.15.22"', '"0.15.23"'))
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' Sources/Core/AppIdentity.swift Sources/UI/EmbyHomeCoreV3.swift | sort)"
          printf 'Build290 fix paths:\n%s\n' "$changed"
          test "$changed" = "$expected"
          grep -F '.frame(width: geometry.size.width, height: geometry.size.height, alignment: .top)' Sources/UI/EmbyHomeCoreV3.swift
          grep -F 'static let sourceVersion = "0.15.23"' Sources/Core/AppIdentity.swift
          git config user.name "OnePlayer CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources/Core/AppIdentity.swift Sources/UI/EmbyHomeCoreV3.swift
          git commit -m "fix: constrain Home layout around native carousel"
          git push origin "HEAD:$PRODUCT_BRANCH"
