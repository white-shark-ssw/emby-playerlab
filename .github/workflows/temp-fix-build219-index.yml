name: Temporary Build219 Index Fix

on:
  push:
    branches: [diag/home-carousel-120hz-request-build219]
    paths:
      - ".github/build219-index-fix-trigger.txt"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Remove duplicate Build216 index row
        run: |
          set -euo pipefail
          git fetch origin diag/home-carousel-120hz-request-build219
          git show origin/diag/home-carousel-120hz-request-build219:scripts/temp_fix_build219_index_duplicate.py > /tmp/fix_index.py
          python3 /tmp/fix_index.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md
          git commit -m "Docs: remove duplicate Build216 index row"
          git push origin HEAD:main
