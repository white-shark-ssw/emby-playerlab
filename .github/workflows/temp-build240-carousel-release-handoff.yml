name: Build240 Carousel Release Handoff Diagnostic IPA

on:
  push:
    branches: [diag/home-carousel-release-handoff-build240]
    paths: [.github/build240-carousel-ci-trigger.txt]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build240 branch
        uses: actions/checkout@v4
        with:
          ref: diag/home-carousel-release-handoff-build240
          fetch-depth: 0
      - name: Validate exact Build240 scope and retained contracts
        run: |
          set -euo pipefail
          base='3deafb22f21f310e9ec6a73cb721a47bd11b512d'
          git diff --check "$base"...HEAD
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='3deafb22f21f310e9ec6a73cb721a47bd11b512d'
          changed=set(subprocess.check_output(['git','diff','--name-only',f'{base}...HEAD'],text=True).splitlines())
          allowed={
            '.github/build240-apply-trigger.txt','.github/build240-carousel-ci-trigger.txt',
            '.github/workflows/temp-apply-build240-release-handoff.yml','.github/workflows/temp-build240-carousel-release-handoff.yml',
            'scripts/temp_apply_build240_release_handoff.py','Sources/Core/AppIdentity.swift',
            'Sources/UI/EmbyHomeCarouselCadenceDiagnosticsV3.swift','Sources/UI/EmbyHomeCarouselInteractionV3.swift',
            'docs/changelog/CHANGELOG_v0_14_73_build240.md'
          }
          extra=sorted(changed-allowed)
          if extra: raise SystemExit(f'Unexpected Build240 files: {extra}')
          frozen_prefixes=('Sources/Player/','Sources/Transport/','Sources/Cache/','Sources/Session/','Sources/AVIO/')
          touched=sorted(p for p in changed if p.startswith(frozen_prefixes))
          if touched: raise SystemExit(f'Build240 touched Frozen/P0 paths: {touched}')
          identity=Path('Sources/Core/AppIdentity.swift').read_text()
          assert 'sourceVersion = "0.14.73"' in identity
          interaction=Path('Sources/UI/EmbyHomeCarouselInteractionV3.swift').read_text()
          assert 'let velocityCommit = directionalVelocity >= 600' in interaction
          assert 'let shouldCommit = actualProgress >= 0.28 || velocityCommit' in interaction
          assert interaction.count('beginReleaseHandoff(') == 2
          assert 'max(actualDistance, predictedDistance)' not in interaction
          assert 'onHorizontalEnded?(translation, latestMoveDeliveredVelocityX)' in interaction
          assert 'pendingPostAcquisitionBaseline = acquisitionSample.status == "none" && acquisitionSample.count == 1' in interaction
          diag=Path('Sources/UI/EmbyHomeCarouselCadenceDiagnosticsV3.swift').read_text()
          assert 'struct V3HomeCarouselCadenceRenderProbe: UIViewRepresentable, Animatable' in diag
          assert 'HomeCarouselReleaseHandoff' in diag
          assert 'recordReleaseDisplaySample(timestamp: link.timestamp, gapMS: gapMS)' in diag
          assert 'CADisplayLink(target: self, selector: #selector(displayLinkTick(_:)))' in diag
          assert 'Timer' not in diag
          state=Path('Sources/UI/EmbyHomeCarouselStateV3.swift').read_text()
          assert 'withAnimation(.easeOut(duration: 0.22))' in state
          assert 'withAnimation(.easeOut(duration: 0.18))' in state
          assert 'V3HomeCarouselCadenceDiagnostics.shared.end(reason: "settled")' in state
          hero=Path('Sources/UI/EmbyHomeHeroV3.swift').read_text()
          assert hero.count('.compositingGroup()') == 1
          assert 'ForEach(carouselHeroResidentItems) { item in\n                carouselHeroArtwork' in hero
          print('Build240 scope/contracts: PASS')
          PY
      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
      - name: Prepare OnePlayer app icons
        run: python3 scripts/generate_oneplayer_icons.py
      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache | tee package-resolution.log
      - name: Build Release
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.14.73 CURRENT_PROJECT_VERSION=240 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build240.log
      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id com.embyplayerlab.app --version 0.14.73 --build 240 --display-name OnePlayer --minimum-os 15.0 --primary-icon OnePlayerIcon --alternate-icon OnePlayerAltIcon
      - name: Validate MinOS
        run: |
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" 15.0 17.0 build240-min-os.log build240.log
      - name: Package unsigned IPA and source snapshot
        run: |
          set -euo pipefail
          rm -rf Payload && mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA="OnePlayer-0.14.73-build240-release-handoff-diagnostic-unsigned.ipa"
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA"
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          SOURCE="OnePlayer-0.14.73-build240-source.zip"
          git archive --format=zip --output "$SOURCE" HEAD
          shasum -a 256 "$SOURCE" | tee "$SOURCE.sha256"
          git rev-parse HEAD | tee build240-source-sha.txt
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"
      - name: Upload Build240 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.73-build240-release-handoff-diagnostic
          path: |
            ${{ env.IPA }}
            ${{ env.IPA }}.sha256
            ${{ env.SOURCE }}
            ${{ env.SOURCE }}.sha256
            build240-source-sha.txt
            build240.log
            build240-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30
