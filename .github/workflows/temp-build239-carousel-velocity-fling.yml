name: Build239 Carousel Velocity Fling IPA

on:
  push:
    branches: [perf/home-carousel-velocity-fling-build239]
    paths: [.github/build239-carousel-ci-trigger.txt]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build239 branch
        uses: actions/checkout@v4
        with:
          ref: perf/home-carousel-velocity-fling-build239
          fetch-depth: 0
      - name: Validate exact Build239 scope and retained contracts
        run: |
          set -euo pipefail
          base='c2fdeb070cdb652eb25a96e8ff39edd6e7f6234f'
          git diff --check "$base"...HEAD
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='c2fdeb070cdb652eb25a96e8ff39edd6e7f6234f'
          changed=set(subprocess.check_output(['git','diff','--name-only',f'{base}...HEAD'],text=True).splitlines())
          allowed={
            '.github/build239-apply-trigger.txt','.github/build239-carousel-ci-trigger.txt',
            '.github/workflows/temp-apply-build239-velocity-fling.yml','.github/workflows/temp-build239-carousel-velocity-fling.yml',
            'scripts/temp_apply_build239_velocity_fling.py','Sources/Core/AppIdentity.swift','Sources/UI/EmbyHomeCarouselInteractionV3.swift','Sources/UI/EmbyHomeHeroV3.swift',
            'docs/changelog/CHANGELOG_v0_14_72_build239.md'
          }
          extra=sorted(changed-allowed)
          if extra: raise SystemExit(f'Unexpected Build239 files: {extra}')
          frozen_prefixes=('Sources/Player/','Sources/Transport/','Sources/Cache/','Sources/Session/','Sources/AVIO/')
          touched=sorted(p for p in changed if p.startswith(frozen_prefixes))
          if touched: raise SystemExit(f'Build239 touched Frozen/P0 paths: {touched}')
          identity=Path('Sources/Core/AppIdentity.swift').read_text()
          assert 'sourceVersion = "0.14.72"' in identity
          interaction=Path('Sources/UI/EmbyHomeCarouselInteractionV3.swift').read_text()
          assert 'func finishNativeCarouselDrag(_ translation: CGSize, releaseVelocityX: CGFloat?, width: CGFloat)' in interaction
          assert 'let velocityCommit = directionalVelocity >= 600' in interaction
          assert 'let shouldCommit = actualProgress >= 0.28 || velocityCommit' in interaction
          assert 'width * 0.24' not in interaction
          assert 'max(actualDistance, predictedDistance)' not in interaction
          assert 'onHorizontalEnded?(translation, latestMoveDeliveredVelocityX)' in interaction
          assert 'HomeCarouselReleaseDecision' in interaction
          assert 'pendingPostAcquisitionBaseline = acquisitionSample.status == "none" && acquisitionSample.count == 1' in interaction
          assert 'postAcquisitionRenderBaselineSample' in interaction
          assert 'Timer' not in interaction and 'DispatchQueue.main.asyncAfter' not in interaction
          hero=Path('Sources/UI/EmbyHomeHeroV3.swift').read_text()
          assert 'onHorizontalEnded: { translation, releaseVelocityX in finishNativeCarouselDrag(translation, releaseVelocityX: releaseVelocityX, width: width) }' in hero
          assert hero.count('.compositingGroup()') == 1
          assert 'ForEach(carouselHeroResidentItems) { item in\n                carouselHeroArtwork' in hero
          assert 'carouselPersistentImage(item: item, size: size)\n            }' in hero
          assert 'carouselPersistentImage(item: item, size: size).opacity(Double(carouselBackdropBlendProgress(transitionProgress)))' in hero
          assert 'carouselPersistentImage(item: item, size: size).opacity(carouselOpacity(for: item.id))' not in hero
          state=Path('Sources/UI/EmbyHomeCarouselStateV3.swift').read_text()
          assert 'withAnimation(.easeOut(duration: 0.22))' in state
          assert 'withAnimation(.easeOut(duration: 0.18))' in state
          assert 'V3HomeCarouselCadenceDiagnostics.shared.end(reason: "settled")' in state
          assert 'V3HomeCarouselCadenceDiagnostics.shared.end(reason: "cancelled-settled")' in state
          print('Build239 scope/contracts: PASS')
          PY
      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
      - name: Prepare OnePlayer app icons
        run: python3 scripts/generate_oneplayer_icons.py
      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache | tee package-resolution.log
      - name: Build Release
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.14.72 CURRENT_PROJECT_VERSION=239 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build239.log
      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id com.embyplayerlab.app --version 0.14.72 --build 239 --display-name OnePlayer --minimum-os 15.0 --primary-icon OnePlayerIcon --alternate-icon OnePlayerAltIcon
      - name: Validate MinOS
        run: |
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" 15.0 17.0 build239-min-os.log build239.log
      - name: Package unsigned IPA and source snapshot
        run: |
          set -euo pipefail
          rm -rf Payload && mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA="OnePlayer-0.14.72-build239-velocity-fling-unsigned.ipa"
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA"
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          SOURCE="OnePlayer-0.14.72-build239-source.zip"
          git archive --format=zip --output "$SOURCE" HEAD
          shasum -a 256 "$SOURCE" | tee "$SOURCE.sha256"
          git rev-parse HEAD | tee build239-source-sha.txt
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"
      - name: Upload Build239 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.72-build239-velocity-fling
          path: |
            ${{ env.IPA }}
            ${{ env.IPA }}.sha256
            ${{ env.SOURCE }}
            ${{ env.SOURCE }}.sha256
            build239-source-sha.txt
            build239.log
            build239-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30
