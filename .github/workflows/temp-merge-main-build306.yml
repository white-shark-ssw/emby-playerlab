name: Reconcile Build306 With Main

on:
  push:
    branches:
      - fix/home-return-poster-retention-build306
    paths:
      - .github/workflows/temp-merge-main-build306.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build306 branch
        uses: actions/checkout@v4
        with:
          ref: fix/home-return-poster-retention-build306
          fetch-depth: 0
      - name: Merge latest main and remove control workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/temp-merge-main-build306.yml
          git add -A
          git commit -m "ci: remove Build306 merge control workflow"
          git push origin HEAD:fix/home-return-poster-retention-build306
