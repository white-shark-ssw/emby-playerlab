name: One-shot CI Audit Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-audit-repair-once
  cancel-in-progress: true

# Existing on main before this trigger commit so GitHub Actions will register the push event.
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair CI audit architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build_path = Path('.github/workflows/build-unsigned-ipa.yml')
          build = build_path.read_text()
          marker = '      - name: Export exact source snapshot\n'
          audit_steps = '''      # Historical source audits are mirrored here only so retained regression scripts can\n      # recognize both CI entry points. They are intentionally non-blocking for IPA packaging;\n      # Validate Source remains the authoritative source-regression gate.\n      - name: Audit Transport v3 invariants\n        continue-on-error: true\n        run: python3 scripts/check_transport_v3_invariants.py\n\n      - name: Audit seek stall invariants\n        continue-on-error: true\n        run: python3 scripts/check_seek_stall_invariants.py\n\n      - name: Audit transport stability invariants\n        continue-on-error: true\n        run: python3 scripts/check_transport_stability_invariants.py\n\n      - name: Audit Scheduler v2 invariants\n        continue-on-error: true\n        run: python3 scripts/check_scheduler_v2_invariants.py\n\n      - name: Audit live lane/startup invariants\n        continue-on-error: true\n        run: python3 scripts/check_live_lane_startup_invariants.py\n\n      - name: Audit v0.12.4 scheduler regressions\n        continue-on-error: true\n        run: python3 scripts/check_v0124_regressions.py\n\n      - name: Audit v0.12.6 frontier rescue regressions\n        continue-on-error: true\n        run: python3 scripts/check_v0126_frontier_rescue.py\n\n      - name: Audit v0.12.7 MPV rotation regressions\n        continue-on-error: true\n        run: python3 scripts/check_v0127_mpv_rotation.py\n\n      - name: Audit v0.13.1 UI regressions\n        continue-on-error: true\n        run: python3 scripts/check_v0131_ui_regressions.py\n\n'''
          if 'Historical source audits are mirrored here only' not in build:
              if marker not in build:
                  raise SystemExit('build workflow insertion marker not found')
              build = build.replace(marker, audit_steps + marker, 1)
              build_path.write_text(build)

          validate_path = Path('.github/workflows/validate-source.yml')
          validate = validate_path.read_text()
          start_marker = '      - name: Audit transport scheduler invariants\n'
          end_marker = '      - name: Select Xcode 16.4\n'
          start = validate.find(start_marker)
          end = validate.find(end_marker, start if start >= 0 else 0)
          aggregate = '''      - name: Audit all source invariants\n        run: |\n          set -uo pipefail\n          : > source-audit.log\n          failed=0\n          audits=(\n            "Audit transport scheduler invariants|check_transport_scheduler_invariants.py"\n            "Audit Transport v3 invariants|check_transport_v3_invariants.py"\n            "Audit seek stall invariants|check_seek_stall_invariants.py"\n            "Audit transport stability invariants|check_transport_stability_invariants.py"\n            "Audit Scheduler v2 invariants|check_scheduler_v2_invariants.py"\n            "Audit live lane/startup invariants|check_live_lane_startup_invariants.py"\n            "Audit retained v0.12.2 regressions|check_v0122_regressions.py"\n            "Audit v0.12.3 seek/cache/MPV regressions|check_v0123_regressions.py"\n            "Audit v0.12.4 scheduler regressions|check_v0124_regressions.py"\n            "Audit v0.12.6 frontier rescue regressions|check_v0126_frontier_rescue.py"\n            "Audit v0.12.7 MPV rotation regressions|check_v0127_mpv_rotation.py"\n            "Audit v0.13.1 UI regressions|check_v0131_ui_regressions.py"\n            "Audit v0.13.2 UI regressions|check_v0132_ui_regressions.py"\n          )\n          for item in "${audits[@]}"; do\n            name="${item%%|*}"\n            script="${item#*|}"\n            echo "===== $name ($script) =====" | tee -a source-audit.log\n            python3 "scripts/$script" 2>&1 | tee -a source-audit.log\n            rc=${PIPESTATUS[0]}\n            if ((rc != 0)); then\n              echo "::error::$name failed with exit code $rc" | tee -a source-audit.log\n              failed=1\n            else\n              echo "PASS: $name" | tee -a source-audit.log\n            fi\n          done\n          exit "$failed"\n\n'''
          if start >= 0 and end > start:
              validate = validate[:start] + aggregate + validate[end:]
          elif '      - name: Audit all source invariants\n' not in validate:
              raise SystemExit('validate workflow audit block markers not found')

          if '          : > source-audit.log\n' not in validate:
              validate = validate.replace('          : > pods-install.log\n', '          : > pods-install.log\n          : > source-audit.log\n', 1)
          validate = validate.replace('check_v0124_scheduler_regressions.py', 'check_v0124_regressions.py')
          old_grep = "grep -nE '(^|[[:space:]])(error:|fatal error:)' validate-build.log build-settings.log package-resolution.log pods-install.log mpv-module-maps.log | head -100 || true"
          new_grep = "grep -nE '(^|[[:space:]])(error:|fatal error:)|::error::| failed with exit code ' source-audit.log validate-build.log build-settings.log package-resolution.log pods-install.log mpv-module-maps.log | head -160 || true"
          validate = validate.replace(old_grep, new_grep)
          if '            source-audit.log\n' not in validate:
              validate = validate.replace('            validate-build.log\n', '            source-audit.log\n            validate-build.log\n', 1)
          validate_path.write_text(validate)
          PY

      - name: Commit repaired workflows and remove one-shot job
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/ci-audit-repair-once.yml
          git add .github/workflows/build-unsigned-ipa.yml .github/workflows/validate-source.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'ci: make source audits exhaustive without blocking IPA packaging'
          git push origin HEAD:main
