name: Apply Build133 Player HUD

on:
  pull_request:
    branches: [diag/mpv-fast-seek-0.13.65]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'diag/player-hud-tune-0.13.66'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/player-hud-tune-0.13.66
          fetch-depth: 0

      - name: Apply Build133 HUD source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}")
              p.write_text(text.replace(old, new))

          app = Path('Sources/Core/AppIdentity.swift')
          text = app.read_text()
          count = text.count('"0.13.65"')
          if count != 2:
              raise SystemExit(f'AppIdentity: expected 2 version literals, found {count}')
          app.write_text(text.replace('"0.13.65"', '"0.13.66"'))

          replace_exact(
              'Sources/UI/PlayerScreen.swift',
              '                if let feedback = controller.scrubFeedback { feedbackView(feedback) }',
              '                if let feedback = controller.scrubFeedback { feedbackView(feedback).scaleEffect(0.72).zIndex(40) }'
          )
          replace_exact(
              'Sources/UI/PlayerScreen.swift',
              '                        feedbackView(feedback).scaleEffect(0.55).padding(.bottom, 96)',
              '                        feedbackView(feedback).scaleEffect(0.55).padding(.bottom, 50)'
          )
          PY

          rm .github/workflows/apply-build133-player-hud.yml
          git diff --check
          git status --short

      - name: Commit Build133 HUD changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Core/AppIdentity.swift Sources/UI/PlayerScreen.swift .github/workflows/apply-build133-player-hud.yml
          git commit -m "Build133: tune player seek and scrub HUD"
          git push origin HEAD:diag/player-hud-tune-0.13.66
