name: Build OnePlayer 0.13.31 MDK Resume Detail Refresh

on:
  pull_request:
    branches: [feat/recovery-isolation-0.13.17]

concurrency:
  group: mdk-resume-detail-refresh-01331-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'validate/mdk-resume-detail-refresh-0.13.31'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recovery-isolation-0.13.17
          fetch-depth: 0

      - name: Materialize Build98 and audit first-round fixes
        run: |
          set -euo pipefail
          python3 scripts/materialize_mdk_resume_detail_refresh_01331.py
          git diff --check
          grep -Fq 'refreshPlaybackUserDataAfterPlayerDismiss()' Sources/UI/EmbyMediaDetailView.swift
          grep -Fq 'phase=convergence' Sources/UI/EmbyMediaDetailView.swift
          grep -Fq '.fullScreenCover(item: $model.selectedSource, onDismiss:' Sources/UI/EmbyMediaDetailView.swift
          grep -Fq 'private let prepareWatchdogSeconds: TimeInterval = 3.0' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'private let firstFrameWatchdogSeconds: TimeInterval = 2.0' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'watchdogQueue=independent renderBridge=offscreen-texture' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'action=switch-mpv skipNativeStop=true' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'sameProcessMDKRebuild=false' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'persistentEngineRouting=false' Sources/Player/PlayerController.swift
          grep -Fq 'MARKETING_VERSION: "0.13.31"' project.mdklab.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "98"' project.mdklab.yml
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          grep -Fq 'sourceVersion = "0.13.31"' Sources/Core/AppIdentity.swift
          python3 - <<'PY'
          from pathlib import Path
          engine = Path('MDKLab/App/MDKKSAVIOPlayerEngine.swift').read_text()
          detail = Path('Sources/UI/EmbyMediaDetailView.swift').read_text()
          assert 'DispatchQueue.main.asyncAfter(deadline: .now() + prepareWatchdogSeconds)' not in engine
          assert 'DispatchQueue.main.asyncAfter(deadline: .now() + firstFrameWatchdogSeconds)' not in engine
          assert 'quarantineCurrentGeneration(reason: "prepare-timeout"' in engine
          assert 'quarantineCurrentGeneration(reason: "first-frame-timeout"' in engine
          assert 'player dismissed; authoritative playback userdata refresh' in detail
          assert detail.count('refreshPlaybackUserDataAfterPlayerDismiss()') >= 2
          print('Build98 first-round regression checks OK')
          PY

      - name: Select Xcode and tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodebuild -version
          swift --version

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build OnePlayer 0.13.31 Build98
        id: release_build
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.31-build98-first-round-release-diagnostics
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report compiler failure
        if: steps.release_build.outcome == 'failure'
        run: |
          set -euo pipefail
          grep -nE '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|SwiftCompile|CompileSwift|EmitSwiftModule' build.log | tail -300 || true
          tail -180 build.log || true
          exit 1

      - name: Validate app identity and minimum OS
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.31' --build '98' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.31-build98-first-round-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload final test package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.31-build98-first-round
          path: |
            OnePlayer-0.13.31-build98-first-round-unsigned.ipa
            OnePlayer-0.13.31-build98-first-round-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
          if-no-files-found: error
          retention-days: 14

      - name: Persist validated Build98 source to experiment branch
        continue-on-error: true
        run: |
          set -euo pipefail
          git diff -- Sources/UI/EmbyMediaDetailView.swift Sources/Core/AppIdentity.swift project.mdklab.yml > /tmp/build98-runtime.patch
          if test ! -s /tmp/build98-runtime.patch; then
            echo 'Build98 source already materialized.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin feat/recovery-isolation-0.13.17
          git reset --hard origin/feat/recovery-isolation-0.13.17
          git apply --3way /tmp/build98-runtime.patch
          git add Sources/UI/EmbyMediaDetailView.swift Sources/Core/AppIdentity.swift project.mdklab.yml
          git diff --cached --check
          git commit -m 'fix: refresh detail playback state after dismiss and preserve MDK startup isolation'
          git push origin HEAD:feat/recovery-isolation-0.13.17
