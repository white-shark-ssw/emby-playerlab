name: Apply Transport v2 Refinement

on:
  push:
    branches: [chatgpt/v0.10.0-transport-v2]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.10.0-transport-v2
      - name: Apply idempotent Transport v2 refinement
        run: |
          set -euo pipefail
          python3 scripts/refine_transport_v2.py
          if git diff --quiet; then
            echo "Transport v2 refinement already applied"
            exit 0
          fi
          git config user.name "ChatGPT CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources/Cache/EPLKTVCacheBridge.m Sources/Cache/KTVCachePlaybackSession.swift Sources/Player/PlayerController.swift
          git commit -m "Refine v0.10.0 Transport v2 after self-review"
          git push origin HEAD:chatgpt/v0.10.0-transport-v2
