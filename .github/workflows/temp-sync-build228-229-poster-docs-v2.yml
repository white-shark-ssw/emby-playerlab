name: Temp Sync Build228 229 Poster Docs V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sync-build228-229-poster-docs-v2.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "54074cf875a1005399b57245d663e08521942d11"
          python3 .github/temp-sync-build228-229-poster-docs.py
          git diff --check
      - name: Commit authority update and remove helpers
        run: |
          set -euo pipefail
          git config user.name white-shark-ssw
          git config user.email houstools@gmail.com
          git rm .github/workflows/temp-sync-build228-229-poster-docs.yml
          git rm .github/workflows/temp-sync-build228-229-poster-docs-v2.yml
          git rm .github/temp-sync-build228-229-poster-docs.py
          git add docs/project/current/dev/DEV-poster-grid-smoothness.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md
          git commit -m "Record Build228 device evidence and Build229 baseline"
          git push origin HEAD:main
