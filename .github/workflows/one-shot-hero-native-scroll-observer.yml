name: Apply native Hero scroll observer

on:
  push:
    branches:
      - fix/hero-native-scroll-observer
    paths:
      - '.github/workflows/one-shot-hero-native-scroll-observer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hero-native-scroll-observer
          fetch-depth: 0
      - name: Fix observer access level and validate invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Sources/UI/ImmersiveUIComponents.swift')
          s = p.read_text()
          old = 'private final class AdaptiveHeroScrollProbeUIView: UIView {'
          new = 'final class AdaptiveHeroScrollProbeUIView: UIView {'
          if old not in s:
              raise SystemExit('expected private probe declaration not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python scripts/check_adaptive_hero_reveal.py
          python scripts/check_v0134_detail_navigation.py
          git diff --check
      - name: Commit source fix
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add Sources/UI/ImmersiveUIComponents.swift
          git commit -m 'fix: expose Hero scroll probe type to UIViewRepresentable witnesses'
          git push origin HEAD:fix/hero-native-scroll-observer
