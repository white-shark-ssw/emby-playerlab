name: Temp Search Build254 IPA

on:
  push:
    branches: ["feat/search-page-optimization"]
    paths:
      - ".github/search-build254-ipa-trigger.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Search branch
        uses: actions/checkout@v4
        with:
          ref: feat/search-page-optimization
          fetch-depth: 0

      - name: Implement Search recommendation incremental loading
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          api = Path('Sources/Networking/EmbyLibraryHubAPI.swift')
          text = api.read_text()
          old = '''    func searchLandingRecommendations(limit: Int = 9, includeItemTypes: [String] = []) async throws -> [LibraryItem] {
              var query = libraryHubCommonFields + [
                  URLQueryItem(name: "Recursive", value: "true"),
                  URLQueryItem(name: "Limit", value: String(max(1, min(100, limit)))),
                  URLQueryItem(name: "SortBy", value: "Random"),
              ]
              if !includeItemTypes.isEmpty { query.append(URLQueryItem(name: "IncludeItemTypes", value: includeItemTypes.joined(separator: ","))) }
              let page: EmbyItemPage = try await libraryHubRequest(path: "Users/\\(try libraryHubUserID())/Items", query: query)
              return libraryHubDeduplicated(page.items)
          }
          '''
          new = '''    func searchLandingRecommendations(limit: Int = 9, includeItemTypes: [String] = [], excludeItemIds: [String] = []) async throws -> [LibraryItem] {
              var query = libraryHubCommonFields + [
                  URLQueryItem(name: "Recursive", value: "true"),
                  URLQueryItem(name: "Limit", value: String(max(1, min(100, limit)))),
                  URLQueryItem(name: "SortBy", value: "Random"),
              ]
              if !includeItemTypes.isEmpty { query.append(URLQueryItem(name: "IncludeItemTypes", value: includeItemTypes.joined(separator: ","))) }
              if !excludeItemIds.isEmpty { query.append(URLQueryItem(name: "ExcludeItemIds", value: excludeItemIds.joined(separator: ","))) }
              let page: EmbyItemPage = try await libraryHubRequest(path: "Users/\\(try libraryHubUserID())/Items", query: query)
              return libraryHubDeduplicated(page.items)
          }
          '''
          if old not in text: raise SystemExit('searchLandingRecommendations source block not found')
          api.write_text(text.replace(old, new, 1))

          preloader = Path('Sources/UI/EmbySearchRecommendationPreloader.swift')
          text = preloader.read_text()
          old = '''enum V3SearchRecommendationPolicy {
              static let itemTypes = ["Movie", "Series"]
              static let preloadLimit = 9
          '''
          new = '''enum V3SearchRecommendationPolicy {
              static let itemTypes = ["Movie", "Series"]
              static let preloadLimit = 9
              static let loadMoreLimit = 6
          '''
          if old not in text: raise SystemExit('recommendation policy block not found')
          text = text.replace(old, new, 1)

          anchor = '''    func recommendations(for stored: EmbySession, client: EmbyAPIClient) async throws -> [LibraryItem] {
              if let items = itemsBySessionID[stored.id] { return items }
              if let task = tasksBySessionID[stored.id] {
                  let loaded = try await task.value
                  accept(loaded, sessionID: stored.id)
                  return loaded.items
              }

              let task = Task { try await Self.fetchRecommendations(client: client) }
              tasksBySessionID[stored.id] = task
              do {
                  let loaded = try await task.value
                  accept(loaded, sessionID: stored.id)
                  return loaded.items
              } catch {
                  tasksBySessionID[stored.id] = nil
                  throw error
              }
          }
          '''
          replacement = anchor + '''
              func moreRecommendations(client: EmbyAPIClient, excluding itemIDs: [String]) async throws -> [LibraryItem] {
                  let requestedTypes = V3SearchRecommendationPolicy.itemTypes
                  let items = try await client.searchLandingRecommendations(limit: V3SearchRecommendationPolicy.loadMoreLimit, includeItemTypes: requestedTypes, excludeItemIds: itemIDs)
                  let urls = items.compactMap { item in
                      client.imageURL(itemId: item.preferredPrimaryImageItemId, maxWidth: V3SearchRecommendationPolicy.posterImageMaxWidth, tag: item.preferredPrimaryImageTag)
                  }
                  warmPosterImages(urls)
                  DiagnosticsLogger.shared.log("Search", "recommendation load-more random-items excluded=\\(itemIDs.count) returned=\\(items.count)")
                  return Array(items.prefix(V3SearchRecommendationPolicy.loadMoreLimit))
              }
          '''
          if anchor not in text: raise SystemExit('preloader recommendations anchor not found')
          preloader.write_text(text.replace(anchor, replacement, 1))

          experience = Path('Sources/UI/EmbySearchExperienceV3.swift')
          text = experience.read_text()
          old = '''    private var searchGeneration = 0
              private var recommendationGeneration = 0
              private var recommendationPosterImages: [String: UIImage] = [:]
          '''
          new = '''    private var searchGeneration = 0
              private var recommendationGeneration = 0
              private var isLoadingMoreRecommendations = false
              private var recommendationPosterImages: [String: UIImage] = [:]
          '''
          if old not in text: raise SystemExit('recommendation state anchor not found')
          text = text.replace(old, new, 1)

          old = '''        if !recommendationsEnabled {
                  recommendationGeneration += 1
                  isLoadingRecommendations = false
              } else {
                  hasMoreRecommendations = true
              }
          '''
          new = '''        if !recommendationsEnabled {
                  recommendationGeneration += 1
                  isLoadingRecommendations = false
                  isLoadingMoreRecommendations = false
              } else {
                  hasMoreRecommendations = true
              }
          '''
          if old not in text: raise SystemExit('toggleRecommendations block not found')
          text = text.replace(old, new, 1)

          old = '''    func loadRecommendations(session: EmbySession, client: EmbyAPIClient) async {
              guard recommendationsEnabled, !isLoadingRecommendations else { return }
              recommendationGeneration += 1
              let generation = recommendationGeneration
              isLoadingRecommendations = true
              defer { if generation == recommendationGeneration { isLoadingRecommendations = false } }

              do {
                  let items = try await V3SearchRecommendationPreloader.shared.recommendations(for: session, client: client)
                  guard generation == recommendationGeneration, recommendationsEnabled else { return }
                  recommendationItems = items
                  hasMoreRecommendations = false
              } catch {
                  guard generation == recommendationGeneration else { return }
                  hasMoreRecommendations = false
                  if !isEmbyRequestCancellation(error) { DiagnosticsLogger.shared.log("Search", "recommendations failed: \\(error.localizedDescription)") }
              }
          }

              func recommendationPosterImage(for itemID: String) -> UIImage? { recommendationPosterImages[itemID] }
          '''
          new = '''    func loadRecommendations(session: EmbySession, client: EmbyAPIClient) async {
              guard recommendationsEnabled, !isLoadingRecommendations else { return }
              recommendationGeneration += 1
              let generation = recommendationGeneration
              isLoadingRecommendations = true
              defer { if generation == recommendationGeneration { isLoadingRecommendations = false } }

              do {
                  let items = try await V3SearchRecommendationPreloader.shared.recommendations(for: session, client: client)
                  guard generation == recommendationGeneration, recommendationsEnabled else { return }
                  recommendationItems = items
                  hasMoreRecommendations = items.count >= V3SearchRecommendationPolicy.preloadLimit
              } catch {
                  guard generation == recommendationGeneration else { return }
                  hasMoreRecommendations = false
                  if !isEmbyRequestCancellation(error) { DiagnosticsLogger.shared.log("Search", "recommendations failed: \\(error.localizedDescription)") }
              }
          }

              func loadMoreRecommendations(client: EmbyAPIClient) async {
                  guard recommendationsEnabled, hasMoreRecommendations, !isLoadingRecommendations, !isLoadingMoreRecommendations, !recommendationItems.isEmpty else { return }
                  let generation = recommendationGeneration
                  let excludedIDs = recommendationItems.map(\\.id)
                  isLoadingMoreRecommendations = true
                  defer { if generation == recommendationGeneration { isLoadingMoreRecommendations = false } }

                  do {
                      let batch = try await V3SearchRecommendationPreloader.shared.moreRecommendations(client: client, excluding: excludedIDs)
                      guard generation == recommendationGeneration, recommendationsEnabled else { return }
                      let existingIDs = Set(recommendationItems.map(\\.id))
                      let newItems = batch.filter { !existingIDs.contains($0.id) }
                      recommendationItems.append(contentsOf: newItems)
                      hasMoreRecommendations = batch.count == V3SearchRecommendationPolicy.loadMoreLimit && newItems.count == batch.count
                      DiagnosticsLogger.shared.log("Search", "recommendation load-more appended=\\(newItems.count) total=\\(recommendationItems.count) hasMore=\\(hasMoreRecommendations)")
                  } catch {
                      guard generation == recommendationGeneration else { return }
                      if !isEmbyRequestCancellation(error) { DiagnosticsLogger.shared.log("Search", "recommendation load-more failed: \\(error.localizedDescription)") }
                  }
              }

              func recommendationPosterImage(for itemID: String) -> UIImage? { recommendationPosterImages[itemID] }
          '''
          if old not in text: raise SystemExit('loadRecommendations block not found')
          text = text.replace(old, new, 1)

          old = '''                    EmbyPosterDetailLink(item: item, client: currentClient) {
                              V3SearchRecommendationPosterCard(item: item, client: currentClient, pinnedImage: model.recommendationPosterImage(for: item.id)) { image in
                                  model.pinRecommendationPosterImage(image, for: item.id)
                              }
                          }
          '''
          new = '''                    EmbyPosterDetailLink(item: item, client: currentClient) {
                              V3SearchRecommendationPosterCard(item: item, client: currentClient, pinnedImage: model.recommendationPosterImage(for: item.id)) { image in
                                  model.pinRecommendationPosterImage(image, for: item.id)
                              }
                              .onAppear {
                                  guard model.hasMoreRecommendations, item.id == model.recommendationItems.last?.id else { return }
                                  Task { await model.loadMoreRecommendations(client: currentClient) }
                              }
                          }
          '''
          if old not in text: raise SystemExit('recommendation card block not found')
          experience.write_text(text.replace(old, new, 1))

          checkpoint = Path('docs/project/current/dev/DEV-search-page-optimization.md')
          text = checkpoint.read_text()
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('- Status:'):
                  lines[i] = '- Status: Active — Build253 recommendation data path target-device accepted; Build254 incremental recommendation candidate implementation/CI in progress'
                  break
          text = '\n'.join(lines).rstrip() + '\n'
          marker = '## Build253 target-device acceptance → Build254 incremental recommendations — 2026-08-30'
          if marker not in text:
              text += f'''\n{marker}\n\nThe user target-device tested Build253 / OnePlayer 0.14.86 and confirmed all 9 Search landing recommendations are normal playable movie/series items. This accepts the Search recommendation data source contract: `/Users/{{userId}}/Items` + `SortBy=Random` + `Recursive=true` + `IncludeItemTypes=Movie,Series`. Build248 Dock/keyboard behavior remains accepted. Search remains Active because the user now requests continued recommendation loading while scrolling.\n\nBuild254 reserves OnePlayer 0.14.87 / Build254. It preserves the accepted first 9 exactly, then requests 6 more only when the current last recommendation card reaches the lazy-grid viewport. The follow-up request uses the same normal Items/Random/Movie+Series contract plus Emby's supported `ExcludeItemIds` containing every already-visible recommendation ID. New unique items append in place; no `StartIndex + Random`, timer, debounce, retry, fallback, watchdog, second cache or load-more ProgressView is added. Newly fetched posters reuse the existing persistent `EmbyImageDiskCache`, decoded image pool and Search-lifetime pinning.\n'''
          checkpoint.write_text(text)

          changelog = Path('docs/changelog/CHANGELOG_v0_14_87_build254.md')
          changelog.write_text('''# OnePlayer 0.14.87 / Build254\n\n- Preserve the Build253 target-device-accepted Search recommendation source: normal `/Users/{userId}/Items` with `SortBy=Random`, `Recursive=true`, and `IncludeItemTypes=Movie,Series`.\n- Keep the accepted first recommendation wall at 9 items.\n- When the current last recommendation card enters the lazy-grid viewport, request 6 additional recommendations using the same endpoint plus `ExcludeItemIds` for all already-visible recommendation IDs, then append only new IDs.\n- Reuse the existing persistent image cache, decoded image pool and Search-lifetime poster pins for newly appended recommendations.\n- No `StartIndex + Random`, timer, debounce, retry, fallback, watchdog, second cache or load-more ProgressView.\n- Preserve the Build248 target-device-accepted Search Dock/keyboard behavior.\n- No Player, MPV, STRM/302/115 Transport, playback Session Cache, Resume/progress, credentials, PiP or Deployment Target changes.\n\nEvidence pending dedicated Xcode 16.4 Release CI/IPA and target-device validation.\n''')
          PY
          git diff --check
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add Sources/Networking/EmbyLibraryHubAPI.swift Sources/UI/EmbySearchRecommendationPreloader.swift Sources/UI/EmbySearchExperienceV3.swift docs/project/current/dev/DEV-search-page-optimization.md docs/changelog/CHANGELOG_v0_14_87_build254.md
          git commit -m "Add Search incremental recommendations"
          git push origin HEAD:feat/search-page-optimization
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "$SOURCE_SHA" | tee build254-source-sha.txt

      - name: Validate Search Build254 source
        run: |
          set -euo pipefail
          swiftc -parse Sources/Networking/EmbyLibraryHubAPI.swift
          swiftc -parse Sources/UI/EmbySearchRecommendationPreloader.swift
          swiftc -parse Sources/UI/EmbySearchExperienceV3.swift
          grep -F 'excludeItemIds: [String] = []' Sources/Networking/EmbyLibraryHubAPI.swift
          grep -F 'URLQueryItem(name: "ExcludeItemIds", value: excludeItemIds.joined(separator: ","))' Sources/Networking/EmbyLibraryHubAPI.swift
          grep -F 'static let preloadLimit = 9' Sources/UI/EmbySearchRecommendationPreloader.swift
          grep -F 'static let loadMoreLimit = 6' Sources/UI/EmbySearchRecommendationPreloader.swift
          grep -F 'func moreRecommendations(client: EmbyAPIClient, excluding itemIDs: [String])' Sources/UI/EmbySearchRecommendationPreloader.swift
          grep -F 'func loadMoreRecommendations(client: EmbyAPIClient)' Sources/UI/EmbySearchExperienceV3.swift
          grep -F 'item.id == model.recommendationItems.last?.id' Sources/UI/EmbySearchExperienceV3.swift
          grep -F 'client.searchLandingRecommendations(limit: V3SearchRecommendationPolicy.loadMoreLimit' Sources/UI/EmbySearchRecommendationPreloader.swift
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Sources/Networking/EmbyLibraryHubAPI.swift').read_text()
          start = text.index('func searchLandingRecommendations')
          end = text.index('func movieRecommendations', start)
          body = text[start:end]
          assert 'SortBy", value: "Random"' in body
          assert 'IncludeItemTypes' in body
          assert 'ExcludeItemIds' in body
          assert 'StartIndex' not in body
          text = Path('Sources/UI/EmbySearchExperienceV3.swift').read_text()
          assert 'ProgressView' in text
          load_more_start = text.index('func loadMoreRecommendations(client: EmbyAPIClient)')
          load_more_end = text.index('func recommendationPosterImage', load_more_start)
          assert 'ProgressView' not in text[load_more_start:load_more_end]
          PY
          git diff --check

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate assets and project
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update

      - name: Resolve MPVKit
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build Search Build254 Release app
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache MARKETING_VERSION=0.14.87 CURRENT_PROJECT_VERSION=254 IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build254.log

      - name: Locate and verify Search Build254 app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          /usr/bin/plutil -p "$APP_PATH/Info.plist" | tee built-info-plist.log
          python3 - "$APP_PATH/Info.plist" <<'PY'
          import plistlib, sys
          p = plistlib.load(open(sys.argv[1], 'rb'))
          expected = {'CFBundleIdentifier':'com.embyplayerlab.app','CFBundleShortVersionString':'0.14.87','CFBundleVersion':'254','MinimumOSVersion':'15.0'}
          for key, value in expected.items():
              actual = str(p.get(key))
              if actual != value: raise SystemExit(f'::error::{key} expected {value}, got {actual}')
          print('Search Build254 identity verification: PASS')
          PY

      - name: Package and verify Search Build254 IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA_NAME="OnePlayer-0.14.87-Build254-Search.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME" | tee package.log
          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload Search Build254 candidate
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.87-Build254-Search
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            build254-source-sha.txt
            built-info-plist.log
            package.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload Search Build254 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.87-Build254-Search-diagnostics
          path: |
            build254.log
            build254-source-sha.txt
            built-info-plist.log
            package.log
          if-no-files-found: warn
          retention-days: 14
