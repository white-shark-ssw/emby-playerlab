name: Build OnePlayer 0.13.19 MDK Native Isolation

on:
  pull_request:
    branches: [feat/recovery-isolation-0.13.17]

concurrency:
  group: mdk-native-isolation-01319-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'validate/mdk-native-isolation-0.13.19'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recovery-isolation-0.13.17
          fetch-depth: 0

      - name: Materialize Build86 source in isolated workspace
        run: |
          set -euo pipefail
          python3 scripts/materialize_mdk_native_isolation_01319.py
          python3 scripts/patch_mdk_native_isolation_01319_round2.py
          git diff --check
          grep -Fq 'path: MDKLab/SwiftMDKOnePlayer' project.mdklab.yml
          grep -Fq 'PlayerMetalLayerRenderer' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'backend=CAMetalLayer mainNativeCall=false' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'stateTimer: DispatchSourceTimer?' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'action=isolated-native-stop mainResponsive=true' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          ! grep -Fq 'class MDKRenderView: MTKView' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          ! grep -Fq 'player.renderVideo(vid: self)' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          ! grep -Fq 'player.map { seconds($0.position) }' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'MDK native isolation render timeout' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'failureIsolation=triggered action=switch-mpv' Sources/Player/PlaybackOrchestrator.swift
          ! grep -Fq '.testTarget(' MDKLab/SwiftMDKOnePlayer/Package.swift
          grep -Fq 'sourceVersion = "0.13.19"' Sources/Core/AppIdentity.swift
          grep -Fq 'MARKETING_VERSION: "0.13.19"' project.mdklab.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "86"' project.mdklab.yml
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          test "$(git hash-object Sources/UI/BufferedTimelineSlider.swift)" = '4c0c772d104fb6b1537e9d89604acbc563114f62'

      - name: Select Xcode and tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodebuild -version
          swift --version

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build OnePlayer 0.13.19 Build86
        id: release_build
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.19-build86-mdk-native-isolation-release-diagnostics
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report compiler failure
        if: steps.release_build.outcome == 'failure'
        run: |
          set -euo pipefail
          grep -nE '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|SwiftCompile|CompileSwift|EmitSwiftModule' build.log | tail -300 || true
          tail -160 build.log || true
          exit 1

      - name: Validate app identity and minimum OS
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.19' --build '86' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.19-build86-mdk-native-isolation-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Commit validated Build86 source to experiment branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MDKLab/SwiftMDKOnePlayer MDKLab/App/MDKKSAVIOPlayerEngine.swift Sources/Player/PlaybackOrchestrator.swift Sources/UI/PlayerScreen.swift Sources/Core/AppIdentity.swift project.mdklab.yml
          if git diff --cached --quiet; then
            echo 'Build86 source already materialized.'
          else
            git commit -m 'fix: isolate MDK native rendering from main thread'
            git push origin HEAD:feat/recovery-isolation-0.13.17
          fi

      - name: Upload final test package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.19-build86-mdk-native-isolation
          path: |
            OnePlayer-0.13.19-build86-mdk-native-isolation-unsigned.ipa
            OnePlayer-0.13.19-build86-mdk-native-isolation-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
          if-no-files-found: error
          retention-days: 14
