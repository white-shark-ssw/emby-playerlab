name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: build-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize diagnostic logs
        run: |
          : > build.log
          : > package-resolution.log
          : > mpv-module-maps.log
          : > pods-install.log
          : > app-validation.log
          : > built-info-plist.log
          : > min-os-report.log
          : > package.log

      - name: Export exact source snapshot
        run: |
          set -euo pipefail
          SOURCE_ZIP="OS-player-v0.13.3-build69-${GITHUB_SHA::7}-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          shasum -a 256 "$SOURCE_ZIP" | tee "$SOURCE_ZIP.sha256"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"
          du -h "$SOURCE_ZIP"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: OS-player-source-${{ github.sha }}
          path: |
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Prepare packaging assets
        run: |
          set -euo pipefail
          python3 scripts/generate_os_player_icons.py
          python3 scripts/version_os_player_icons.py
          python3 - <<'PY'
          import json
          import plistlib
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(f"::error::{message}")

          project = Path("project.yml").read_text()
          require('iOS: "15.0"' in project, "project.yml deploymentTarget.iOS must remain 15.0")
          require('deploymentTarget: "15.0"' in project, "application deploymentTarget must remain 15.0")
          require('PRODUCT_BUNDLE_IDENTIFIER: com.embyplayerlab.app' in project, "unexpected PRODUCT_BUNDLE_IDENTIFIER")
          require('PRODUCT_NAME: "OS player"' in project, "unexpected PRODUCT_NAME")
          require('ASSETCATALOG_COMPILER_APPICON_NAME: OSPlayerIcon' in project, "OSPlayerIcon is not configured as app icon")

          with Path("Config/Info.plist").open("rb") as handle:
              info = plistlib.load(handle)
          require(info.get("CFBundleDisplayName") == "OS player", "source CFBundleDisplayName must be OS player")
          require(str(info.get("CFBundleShortVersionString")) == "0.13.3", "source version must be 0.13.3")
          require(str(info.get("CFBundleVersion")) == "69", "source build must be 69")

          contents_path = Path("Resources/Assets.xcassets/OSPlayerIcon.appiconset/Contents.json")
          require(contents_path.is_file(), "OSPlayerIcon Contents.json is missing")
          contents = json.loads(contents_path.read_text())
          filenames = [image.get("filename", "") for image in contents.get("images", []) if image.get("filename")]
          require(len(filenames) == 18, f"OSPlayerIcon must contain 18 named icon slots, got {len(filenames)}")
          missing = [name for name in filenames if not (contents_path.parent / name).is_file()]
          require(not missing, f"OSPlayerIcon image files are missing: {missing}")
          print("Packaging source preflight: OK")
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install KTVHTTPCache 3.1.0
        run: |
          set -euo pipefail
          set -o pipefail
          pod install --repo-update 2>&1 | tee pods-install.log

      - name: Restore Swift package cache
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: ${{ runner.os }}-mpvkit-1.0.0-ktv-3.1.0-${{ hashFiles('project.yml', 'Podfile') }}

      - name: Resolve MPVKit
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Inspect package module maps
        if: always()
        run: |
          set -u
          if [[ ! -d .spm-cache ]]; then
            echo ".spm-cache does not exist after package resolution." | tee mpv-module-maps.log
            exit 0
          fi
          MODULE_MAP_LIST="$(mktemp)"
          find .spm-cache \( -path '*/Modules/module.modulemap' -o -path '*/module.modulemap' \) -type f | sort > "$MODULE_MAP_LIST"
          if [[ ! -s "$MODULE_MAP_LIST" ]]; then
            echo "No module.modulemap files found under .spm-cache." | tee mpv-module-maps.log
            rm -f "$MODULE_MAP_LIST"
            exit 0
          fi
          {
            while IFS= read -r file; do
              echo "===== $file ====="
              sed -n '1,120p' "$file"
            done < "$MODULE_MAP_LIST"
          } | tee mpv-module-maps.log
          rm -f "$MODULE_MAP_LIST"

      - name: Build unsigned app
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build.log

      - name: Locate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo "::error::Release .app was not produced under build/DerivedData/Build/Products/Release-iphoneos"
            exit 1
          fi
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found $APP_PATH"

      - name: Validate built app structure
        run: |
          set -euo pipefail
          set -o pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          {
            echo "App path: $APP_PATH"
            echo "===== plutil -p Info.plist ====="
            /usr/bin/plutil -p "$APP_PATH/Info.plist"
          } 2>&1 | tee built-info-plist.log

          python3 scripts/validate_built_app.py \
            "$APP_PATH" \
            --bundle-id "com.embyplayerlab.app" \
            --version "0.13.3" \
            --build "69" 2>&1 | tee app-validation.log

      # Package first. A successful .app must always produce a downloadable TrollStore test IPA.
      # Compatibility certification runs afterwards and may keep the job/release red without deleting this artifact.
      - name: Package and verify TrollStore test IPA
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="EmbyPlayerLab-0.13.3-${GITHUB_SHA::7}-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          {
            echo "IPA: $IPA_NAME"
            /usr/bin/unzip -t "$IPA_NAME"
            APP_DIR="$(basename "${{ steps.app.outputs.path }}")"
            if ! /usr/bin/unzip -Z1 "$IPA_NAME" | grep -Fx "Payload/$APP_DIR/Info.plist" >/dev/null; then
              echo "::error::IPA does not contain Payload/$APP_DIR/Info.plist"
              exit 1
            fi
            shasum -a 256 "$IPA_NAME"
            du -h "$IPA_NAME"
          } 2>&1 | tee package.log
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"

      - name: Upload TrollStore test IPA
        uses: actions/upload-artifact@v4
        with:
          name: EmbyPlayerLab-unsigned-${{ github.sha }}
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Validate runtime minimum OS and linked static objects
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" min-os-report.log build.log

      - name: Publish compatibility-certified dev IPA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="v0.13.3-build69-dev"
          RELEASE_IPA="OS-player-v0.13.3-build69-${GITHUB_SHA::7}-unsigned.ipa"
          cp "$IPA_NAME" "$RELEASE_IPA"
          shasum -a 256 "$RELEASE_IPA" | tee "$RELEASE_IPA.sha256"
          gh release delete "$RELEASE_TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$RELEASE_TAG" \
            "$RELEASE_IPA" \
            "$RELEASE_IPA.sha256" \
            --target "$GITHUB_SHA" \
            --title "OS player v0.13.3 Build 69" \
            --notes "Compatibility-certified TrollStore test build for OS player v0.13.3 Build 69 from $GITHUB_SHA" \
            --prerelease

      - name: Summarize failure
        if: failure()
        run: |
          {
            echo "## Build/packaging diagnostics"
            echo '```text'
            grep -nEi '(^|[[:space:]])(error:|fatal error:)|::error::| failed:|ERROR ' build.log package-resolution.log pods-install.log mpv-module-maps.log app-validation.log built-info-plist.log min-os-report.log package.log | head -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write build report
        if: always()
        run: |
          printf '{"version":"0.13.3","build":69,"commit":"%s","runId":%s,"runNumber":%s,"status":"%s","deploymentTarget":"15.0","requiredDeviceIOS":"17.0"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "${{ job.status }}" > build-report.json
          cat build-report.json

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmbyPlayerLab-build-diagnostics-${{ github.sha }}
          path: |
            build.log
            package-resolution.log
            pods-install.log
            mpv-module-maps.log
            app-validation.log
            built-info-plist.log
            min-os-report.log
            package.log
            build-report.json
          if-no-files-found: error
          retention-days: 30
