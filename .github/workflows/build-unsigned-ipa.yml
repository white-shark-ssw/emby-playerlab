name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: build-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize diagnostic logs
        run: |
          : > build.log
          : > package-resolution.log
          : > mpv-module-maps.log
          : > pods-install.log

      - name: Audit transport scheduler invariants
        run: python3 scripts/check_transport_scheduler_invariants.py

      - name: Audit Transport v3 invariants
        run: python3 scripts/check_transport_v3_invariants.py

      - name: Audit seek stall invariants
        run: python3 scripts/check_seek_stall_invariants.py

      - name: Audit transport stability invariants
        run: python3 scripts/check_transport_stability_invariants.py

      - name: Audit Scheduler v2 invariants
        run: python3 scripts/check_scheduler_v2_invariants.py

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install KTVHTTPCache 3.1.0
        run: |
          set -euo pipefail
          set -o pipefail
          pod install --repo-update 2>&1 | tee pods-install.log

      - name: Restore Swift package cache
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: ${{ runner.os }}-mpvkit-0.41.0-n8.1.2-ktv-3.1.0-${{ hashFiles('project.yml', 'Podfile') }}

      - name: Resolve MPVKit
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Inspect package module maps
        if: always()
        run: |
          set -u
          if [[ ! -d .spm-cache ]]; then
            echo ".spm-cache does not exist after package resolution." | tee mpv-module-maps.log
            exit 0
          fi
          MODULE_MAP_LIST="$(mktemp)"
          find .spm-cache \( -path '*/Modules/module.modulemap' -o -path '*/module.modulemap' \) -type f | sort > "$MODULE_MAP_LIST"
          if [[ ! -s "$MODULE_MAP_LIST" ]]; then
            echo "No module.modulemap files found under .spm-cache." | tee mpv-module-maps.log
            rm -f "$MODULE_MAP_LIST"
            exit 0
          fi
          {
            while IFS= read -r file; do
              echo "===== $file ====="
              sed -n '1,120p' "$file"
            done < "$MODULE_MAP_LIST"
          } | tee mpv-module-maps.log
          rm -f "$MODULE_MAP_LIST"

      - name: Build unsigned app
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build.log

      - name: Summarize compiler errors
        if: failure()
        run: |
          {
            echo "## First compiler errors"
            echo '```text'
            grep -nE '(^|[[:space:]])(error:|fatal error:)' build.log package-resolution.log pods-install.log mpv-module-maps.log | head -100 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Locate app
        if: success()
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found $APP_PATH"

      - name: Validate minimum OS
        if: success()
        run: |
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0"

      - name: Package TrollStore IPA
        if: success()
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="EmbyPlayerLab-0.12.0-${GITHUB_SHA::7}-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"
          du -h "$IPA_NAME"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EmbyPlayerLab-unsigned-${{ github.sha }}
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
          retention-days: 30

      - name: Publish latest dev IPA
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "$IPA_NAME" EmbyPlayerLab-dev-latest.ipa
          shasum -a 256 EmbyPlayerLab-dev-latest.ipa | tee EmbyPlayerLab-dev-latest.ipa.sha256
          gh release delete dev-latest --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create dev-latest \
            EmbyPlayerLab-dev-latest.ipa \
            EmbyPlayerLab-dev-latest.ipa.sha256 \
            --target "$GITHUB_SHA" \
            --title "Latest Dev Build" \
            --notes "Automated TrollStore test build from $GITHUB_SHA" \
            --prerelease

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmbyPlayerLab-build-logs-${{ github.sha }}
          path: |
            build.log
            package-resolution.log
            pods-install.log
            mpv-module-maps.log
          if-no-files-found: error
          retention-days: 14
