name: Apply MDK Seek InCache A/B 0.13.57

on:
  pull_request:
    branches: [diag/mdk-seek-trace-0.13.56]
    paths:
      - "scripts/migrate_mdk_seek_incache_ab_01357.py"
      - ".github/workflows/apply-mdk-seek-incache-ab-01357.yml"
      - "MDKLab/SwiftMDKOnePlayer/Sources/swift-mdk/global.swift"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply isolated relative Fast InCache flag
        run: |
          set -euo pipefail
          python3 scripts/migrate_mdk_seek_incache_ab_01357.py
          grep -Fq 'case InCache = 1024' MDKLab/SwiftMDKOnePlayer/Sources/swift-mdk/global.swift
          grep -Fq 'case FastFromStartInCache = 1282' MDKLab/SwiftMDKOnePlayer/Sources/swift-mdk/global.swift
          grep -Fq 'dispatchedIntent.fastPreview ? .FastFromStartInCache : .FromStart' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'flagRaw=\(seekFlag.rawValue) cacheAware=\(dispatchedIntent.fastPreview)' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'private let relativeSeekBufferMinMs: Int64 = 50' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'private let seekBufferMinMs: Int64 = 200' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'private let normalBufferMinMs: Int64 = 1_000' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'private let avioRequestSizeBytes = 2 * 1_048_576' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'action=queue-latest-single-native' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          git diff --check
      - name: Commit A/B source
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source change required'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MDKLab/App/MDKKSAVIOPlayerEngine.swift
          git commit -m 'mdk: test relative Fast Seek with InCache'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
