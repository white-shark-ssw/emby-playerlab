name: One-shot Build210 Poster Multi-Owner Diagnostics IPA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-build210-main-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout exact Build210 source
        uses: actions/checkout@v4
        with:
          ref: 9d8fd6a62e6e7d281d4fae5ab8442754a6362f47
          fetch-depth: 0

      - name: Validate Build210 diagnostic source contract
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9d8fd6a62e6e7d281d4fae5ab8442754a6362f47"
          python3 scripts/check_poster_grid_smoothness.py
          python3 -m py_compile scripts/check_poster_grid_smoothness.py
          rm -rf scripts/__pycache__
          git diff --check
          python3 - <<'PY'
          import subprocess
          base = 'e95d73b75938ad92f2c4d7f06a3ba2d441bb92f4'
          expected = {
              'Sources/Core/AppIdentity.swift',
              'Sources/UI/EmbySharedImageAndNavigation.swift',
              'docs/changelog/CHANGELOG_v0_14_43_build210.md',
              'scripts/check_poster_grid_smoothness.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', f'{base}...HEAD'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'Build210 expected exact four-file delta, got: {sorted(changed)}')
          frozen = ('Sources/Player/', 'Sources/Transport/', 'Sources/Cache/', 'Sources/Session/', 'Sources/AVIO/')
          touched = sorted(p for p in changed if p.startswith(frozen))
          if touched:
              raise SystemExit(f'Build210 touched frozen/P0 paths: {touched}')
          forbidden_carousel = {
              'Sources/UI/EmbyHomeCarouselInteractionV3.swift',
              'Sources/UI/EmbyHomeCarouselStateV3.swift',
              'Sources/UI/EmbyHomeHeroV3.swift',
              'Sources/UI/EmbyHomeCoreV3.swift',
          }
          touched_carousel = sorted(changed & forbidden_carousel)
          if touched_carousel:
              raise SystemExit(f'Build210 touched active carousel owner/adjacent files: {touched_carousel}')
          identity = open('Sources/Core/AppIdentity.swift', encoding='utf-8').read()
          if 'static let sourceVersion = "0.14.43"' not in identity or '?? "0.14.43"' not in identity:
              raise SystemExit('Build210 AppIdentity mismatch')
          shared = open('Sources/UI/EmbySharedImageAndNavigation.swift', encoding='utf-8').read()
          required = [
              'private var scrollObservations: [UUID: ScrollObservation] = [:]',
              'let deltaY = currentOffsetY - observation.lastOffsetY',
              'guard let sample = movingSamples.max(by:',
              'scroll_route=\\(sample.route)',
              'registered_scrolls=\\(scrollObservations.count)',
              'moving_scrolls=\\(movingSamples.count)',
          ]
          for needle in required:
              if needle not in shared:
                  raise SystemExit(f'Build210 multi-owner diagnostic missing: {needle}')
          for legacy in ('observedScrollOwnerID', 'observedScrollRoute', 'lastScrollOffsetY'):
              if legacy in shared:
                  raise SystemExit(f'Build210 legacy single-owner diagnostic remains: {legacy}')
          if shared.count('CADisplayLink(target: self') != 1:
              raise SystemExit('Build210 must retain one shared poster CADisplayLink')
          if len(shared.splitlines()) < 690:
              raise SystemExit('Build210 shared source unexpectedly truncated')
          print('Build210 exact diagnostic delta scope: PASS')
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Prepare OnePlayer app icons
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache | tee package-resolution.log

      - name: Build Release
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            MARKETING_VERSION=0.14.43 \
            CURRENT_PROJECT_VERSION=210 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build210.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id com.embyplayerlab.app --version 0.14.43 --build 210 --display-name OnePlayer --minimum-os 15.0 --primary-icon OnePlayerIcon --alternate-icon OnePlayerAltIcon

      - name: Validate MinOS
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" 15.0 17.0 build210-min-os.log build210.log

      - name: Package unsigned IPA and source snapshot
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA="OnePlayer-0.14.43-build210-poster-multi-owner-diagnostics-unsigned.ipa"
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA"
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          SOURCE="OnePlayer-0.14.43-build210-source.zip"
          git archive --format=zip --output "$SOURCE" HEAD
          shasum -a 256 "$SOURCE" | tee "$SOURCE.sha256"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"

      - name: Upload Build210 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.43-build210-poster-multi-owner-diagnostics
          path: |
            ${{ env.IPA }}
            ${{ env.IPA }}.sha256
            ${{ env.SOURCE }}
            ${{ env.SOURCE }}.sha256
            build210.log
            build210-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30
