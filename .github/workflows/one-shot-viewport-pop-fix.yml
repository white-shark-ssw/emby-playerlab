name: One-shot viewport and pop fix

on:
  push:
    branches: [chatgpt/fix-detail-viewport-pop-stall-20260812]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[viewport-pop-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-detail-viewport-pop-stall-20260812
          fetch-depth: 0
      - name: Apply viewport and interactive-pop fix
        run: |
          set -euo pipefail
          python3 scripts/apply_viewport_pop_fix.py
          git diff --check
      - name: Commit source fix
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add -A
          git commit -m 'fix: correct detail viewport and native pop stall [viewport-pop-fixed]'
          git push origin HEAD:chatgpt/fix-detail-viewport-pop-stall-20260812
