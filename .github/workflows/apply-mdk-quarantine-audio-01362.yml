name: Apply MDK Quarantine Audio Fix 0.13.62

on:
  push:
    branches: [fix/mdk-quarantine-audio-0.13.62]
    paths:
      - "scripts/migrate_mdk_quarantine_audio_01362.py"
      - ".github/workflows/apply-mdk-quarantine-audio-01362.yml"
      - "Sources/Core/AppIdentity.swift"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mdk-quarantine-audio-0.13.62
          fetch-depth: 0
      - name: Apply quarantine audio fix
        run: |
          set -euo pipefail
          python3 scripts/migrate_mdk_quarantine_audio_01362.py
          grep -Fq 'OnePlayer.MDK.QuarantineAudio' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'MDKQuarantineAudio' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'player.mute = true' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'quarantineMuted=true' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          ! grep -Fq 'player.setProperty(name: "video.decoder"' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'dispatchedIntent.fastPreview ? .AccurateFromStartInCache : .FromStart' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'sourceVersion = "0.13.62"' Sources/Core/AppIdentity.swift
          git diff --check
      - name: Commit Build129 runtime source
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No runtime source change required'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MDKLab/App/MDKKSAVIOPlayerEngine.swift
          git commit -m 'mdk: mute quarantined player without forcing native stop'
          git push origin HEAD:fix/mdk-quarantine-audio-0.13.62
