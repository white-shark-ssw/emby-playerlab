name: Apply v0.9.6 Hotfix

on:
  push:
    branches: [chatgpt/v0.9.6]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.9.6
      - name: Apply final cooldown refinement
        run: |
          set -euo pipefail
          python3 scripts/refine_v096_cooldown.py
          if git diff --quiet; then
            echo "v0.9.6 cooldown refinement already applied"
            exit 0
          fi
          git config user.name "ChatGPT CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources/Transport/UnifiedMediaTransportSession.swift
          git commit -m "Refine v0.9.6 metadata cooldown gate"
          git push origin HEAD:chatgpt/v0.9.6
