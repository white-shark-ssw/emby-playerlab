name: Build228 Carousel Release Refresh IPA

on:
  push:
    branches: [perf/home-carousel-release-refresh-build228]
    paths:
      - ".github/build228-carousel-release-refresh-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build228 branch
        uses: actions/checkout@v4
        with:
          ref: perf/home-carousel-release-refresh-build228
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact Build228 release-refresh patch
        run: |
          set -euo pipefail
          python3 scripts/temp_apply_build228.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Core/AppIdentity.swift Sources/UI/EmbyHomeCarouselInteractionV3.swift Sources/UI/EmbyHomeCarouselStateV3.swift
          if ! git diff --cached --quiet; then
            git commit -m "Perf: retain carousel max refresh through release tail"
            git push origin HEAD:perf/home-carousel-release-refresh-build228
          fi
          echo "BUILD228_SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate exact Build228 scope and retained contracts
        run: |
          set -euo pipefail
          base='f9f1ecf6334c14641dbdf780a5b09a118495b8ec'
          git diff --check "$base"...HEAD
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = 'f9f1ecf6334c14641dbdf780a5b09a118495b8ec'
          allowed = {
              '.github/build228-carousel-release-refresh-trigger.txt',
              '.github/workflows/temp-build228-carousel-release-refresh.yml',
              'Sources/Core/AppIdentity.swift',
              'Sources/UI/EmbyHomeCarouselInteractionV3.swift',
              'Sources/UI/EmbyHomeCarouselStateV3.swift',
              'docs/changelog/CHANGELOG_v0_14_61_build228.md',
              'scripts/temp_apply_build228.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', f'{base}...HEAD'], text=True).splitlines())
          extra = sorted(changed - allowed)
          if extra: raise SystemExit(f'Unexpected Build228 files: {extra}')
          required = {'Sources/Core/AppIdentity.swift', 'Sources/UI/EmbyHomeCarouselInteractionV3.swift', 'Sources/UI/EmbyHomeCarouselStateV3.swift', 'docs/changelog/CHANGELOG_v0_14_61_build228.md'}
          missing = sorted(required - changed)
          if missing: raise SystemExit(f'Missing Build228 files: {missing}')
          frozen_prefixes = ('Sources/Player/', 'Sources/Transport/', 'Sources/Cache/', 'Sources/Session/', 'Sources/AVIO/')
          touched_frozen = sorted(path for path in changed if path.startswith(frozen_prefixes))
          if touched_frozen: raise SystemExit(f'Build228 touched Frozen/P0 paths: {touched_frozen}')
          forbidden = {'Sources/UI/EmbyHomeHeroV3.swift', 'Sources/UI/EmbyHomeCoreV3.swift', 'Sources/UI/EmbySharedImageAndNavigation.swift'}
          touched_forbidden = sorted(changed & forbidden)
          if touched_forbidden: raise SystemExit(f'Build228 unexpectedly changed retained presentation/shared owners: {touched_forbidden}')

          identity = Path('Sources/Core/AppIdentity.swift').read_text()
          assert 'sourceVersion = "0.14.61"' in identity
          state = Path('Sources/UI/EmbyHomeCarouselStateV3.swift').read_text()
          assert 'var carouselHeroResidentItems: [LibraryItem]' in state
          assert 'V3HomeCarouselCadenceDiagnostics.shared.end(reason: "settled")' in state
          assert 'V3HomeCarouselCadenceDiagnostics.shared.end(reason: "cancelled-settled")' in state
          assert 'UIScreen.main.scale' not in state
          interaction = Path('Sources/UI/EmbyHomeCarouselInteractionV3.swift').read_text()
          assert 'V3HomeCarouselCadenceDiagnostics.shared.end(reason: "ended")' not in interaction
          assert 'V3HomeCarouselCadenceDiagnostics.shared.end(reason: "cancelled")' not in interaction
          assert 'ended-no-transition' in interaction
          assert 'ended-no-target' in interaction
          assert 'cancelled-no-transition' in interaction
          assert 'horizontalAcquisitionTranslation = translation.width' in interaction
          assert 'return CGSize(width: translation.width - acquisitionTranslation, height: 0)' in interaction
          assert 'actualProgress >= 0.28' in interaction
          assert 'width * 0.48' in interaction
          hero = Path('Sources/UI/EmbyHomeHeroV3.swift').read_text()
          assert 'ForEach(carouselHeroResidentItems) { item in' in hero
          assert '.offset(x: carouselForegroundOffset(for: item.id, width: width))' in hero
          cadence = Path('Sources/UI/EmbyHomeCarouselCadenceDiagnosticsV3.swift').read_text()
          assert 'link.preferredFrameRateRange = CAFrameRateRange(minimum: requested, maximum: requested, preferred: requested)' in cadence
          print('Build228 release-tail max-refresh scope/contracts: PASS')
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Prepare OnePlayer app icons
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache | tee package-resolution.log

      - name: Build Release
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            MARKETING_VERSION=0.14.61 \
            CURRENT_PROJECT_VERSION=228 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build228.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id com.embyplayerlab.app --version 0.14.61 --build 228 --display-name OnePlayer --minimum-os 15.0 --primary-icon OnePlayerIcon --alternate-icon OnePlayerAltIcon

      - name: Validate MinOS
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" 15.0 17.0 build228-min-os.log build228.log

      - name: Package unsigned IPA and source snapshot
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA="OnePlayer-0.14.61-build228-release-refresh-unsigned.ipa"
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA"
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          SOURCE="OnePlayer-0.14.61-build228-source.zip"
          git archive --format=zip --output "$SOURCE" HEAD
          shasum -a 256 "$SOURCE" | tee "$SOURCE.sha256"
          printf '%s\n' "$BUILD228_SOURCE" > build228-source-sha.txt
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"

      - name: Upload Build228 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.61-build228-release-refresh
          path: |
            ${{ env.IPA }}
            ${{ env.IPA }}.sha256
            ${{ env.SOURCE }}
            ${{ env.SOURCE }}.sha256
            build228-source-sha.txt
            build228.log
            build228-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30
