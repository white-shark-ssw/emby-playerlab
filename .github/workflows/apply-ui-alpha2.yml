name: Apply UI Alpha2 Poster Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ui-alpha2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch shared poster card and release publishing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Sources/UI/EmbyServerRootViewV3.swift')
          text = path.read_text()
          old = '''private struct V3PosterCard: View {
              let item: LibraryItem
              let client: EmbyAPIClient
              let width: CGFloat?
              var body: some View {
                  VStack(alignment: .leading, spacing: 4) {
                      ZStack(alignment: .bottomLeading) {
                          V3RemoteImage(url: client.imageURL(itemId: item.id, maxWidth: 440, tag: item.primaryImageTag), contentMode: .fill)
                              .frame(maxWidth: .infinity)
                              .aspectRatio(2.0 / 3.0, contentMode: .fill)
                              .clipped()
                          if item.playbackProgress > 0 { GeometryReader { proxy in VStack { Spacer(); Rectangle().fill(Color.blue).frame(width: proxy.size.width * item.playbackProgress, height: 3) } } }
                          if let count = item.userData?.unplayedItemCount, count > 0 {
                              VStack { HStack { Spacer(); Text("\\(count)").font(.caption2.weight(.bold)).foregroundColor(.white).padding(6).background(Color.blue).clipShape(Circle()) }; Spacer() }.padding(5)
                          } else if item.isPlayed {
                              VStack { HStack { Spacer(); Image(systemName: "checkmark").font(.caption2.weight(.bold)).foregroundColor(.white).padding(6).background(Color.green).clipShape(Circle()) }; Spacer() }.padding(5)
                          }
                      }
                      .background(Color(uiColor: .secondarySystemBackground))
                      .clipShape(RoundedRectangle(cornerRadius: 8, style: .continuous))
                      Text(item.name).font(.subheadline).lineLimit(1).frame(maxWidth: .infinity, alignment: .leading)
                      if let year = item.productionYear { Text(String(year)).font(.caption).foregroundColor(.secondary).frame(maxWidth: .infinity, alignment: .leading) }
                  }
                  .frame(width: width, alignment: .leading)
                  .frame(maxWidth: width == nil ? .infinity : nil, alignment: .leading)
                  .clipped()
              }
          }'''.replace('          ', '')

          new = '''private struct V3PosterCard: View {
              @Environment(\\.embyPosterGridCellWidth) private var gridCellWidth
              let item: LibraryItem
              let client: EmbyAPIClient
              let width: CGFloat?

              private var resolvedWidth: CGFloat? { width ?? gridCellWidth }
              private var posterHeight: CGFloat? {
                  guard let resolvedWidth = resolvedWidth else { return nil }
                  return resolvedWidth / EmbyPosterGridMetrics.posterAspectRatio
              }

              var body: some View {
                  VStack(alignment: .leading, spacing: 4) {
                      ZStack(alignment: .bottomLeading) {
                          V3RemoteImage(
                              url: client.imageURL(itemId: item.preferredPrimaryImageItemId, maxWidth: 440, tag: item.preferredPrimaryImageTag),
                              contentMode: .fill
                          )
                          .frame(width: resolvedWidth, height: posterHeight)
                          .clipped()
                          if item.playbackProgress > 0 { GeometryReader { proxy in VStack { Spacer(); Rectangle().fill(Color.blue).frame(width: proxy.size.width * item.playbackProgress, height: 3) } } }
                          if let count = item.userData?.unplayedItemCount, count > 0 {
                              VStack { HStack { Spacer(); Text("\\(count)").font(.caption2.weight(.bold)).foregroundColor(.white).padding(6).background(Color.blue).clipShape(Circle()) }; Spacer() }.padding(5)
                          } else if item.isPlayed {
                              VStack { HStack { Spacer(); Image(systemName: "checkmark").font(.caption2.weight(.bold)).foregroundColor(.white).padding(6).background(Color.green).clipShape(Circle()) }; Spacer() }.padding(5)
                          }
                      }
                      .frame(width: resolvedWidth, height: posterHeight)
                      .background(Color(uiColor: .secondarySystemBackground))
                      .clipShape(RoundedRectangle(cornerRadius: 10, style: .continuous))
                      Text(item.name).font(.subheadline).lineLimit(1).frame(width: resolvedWidth, alignment: .leading)
                      if let year = item.productionYear { Text(String(year)).font(.caption).foregroundColor(.secondary).frame(width: resolvedWidth, alignment: .leading) }
                  }
                  .frame(width: resolvedWidth, alignment: .leading)
                  .clipped()
              }
          }'''.replace('          ', '')

          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one V3PosterCard block, found {text.count(old)}')
          path.write_text(text.replace(old, new))

          build_path = Path('.github/workflows/build-unsigned-ipa.yml')
          build = build_path.read_text()
          old_condition = "if: github.event_name == 'push' && github.ref == 'refs/heads/main'"
          new_condition = "if: github.ref == 'refs/heads/main'"
          if build.count(old_condition) != 1:
              raise SystemExit(f'expected release condition once, found {build.count(old_condition)}')
          build_path.write_text(build.replace(old_condition, new_condition))
          PY

      - name: Commit final UI patch
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-ui-alpha2.yml
          git config user.name 'os-player-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add Sources/UI/EmbyServerRootViewV3.swift .github/workflows/build-unsigned-ipa.yml
          git commit -m 'fix: normalize poster geometry and publish main builds'
          git push
