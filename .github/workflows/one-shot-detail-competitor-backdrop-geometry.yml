name: Apply detail competitor backdrop geometry

on:
  push:
    branches:
      - feat/detail-competitor-backdrop-geometry
    paths:
      - '.github/workflows/one-shot-detail-competitor-backdrop-geometry.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/detail-competitor-backdrop-geometry
          fetch-depth: 0
      - name: Apply source patch
        run: |
          python .github/apply_detail_competitor_backdrop_geometry.py
          python scripts/check_adaptive_hero_reveal.py
          python scripts/check_v0134_detail_navigation.py
          git diff --check
      - name: Commit source changes
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add Sources/UI/ImmersiveUIComponents.swift Sources/UI/EmbyMediaDetailView.swift scripts/check_adaptive_hero_reveal.py
          git commit -m 'feat: decouple detail backdrop geometry from Hero foreground'
          git push origin HEAD:feat/detail-competitor-backdrop-geometry
