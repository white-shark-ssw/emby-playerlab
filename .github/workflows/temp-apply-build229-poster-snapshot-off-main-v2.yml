name: Temp Apply Build229 Poster Snapshot Off Main V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-apply-build229-poster-snapshot-off-main-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact poster branch
        run: |
          git fetch origin perf/poster-grid-smoothness
          git checkout perf/poster-grid-smoothness
          test "$(git rev-parse HEAD)" = "20f0edaf30c3c9161a79f64fd29dbc79c199473e"
      - name: Apply exact Build229 patch
        run: |
          cat > /tmp/build229.patch <<'PATCH'
