@@ -0,0 +1,11 @@
+# OnePlayer 0.14.62 / Build229
+
+## Poster grid pagination snapshot off-main candidate
+
+- Target-device Build228 log captured a real 55.1 ms `grid / phase=dragging` long frame after `StartIndex=60`.
+- The same sample measured image publish / Combine→UIKit adoption at 0.0 ms and pagination apply at 0.3 ms, while synchronous page snapshot persistence took 39.7 ms and completed about 8 ms before the hitch.
+- Build229 keeps the accepted Build213 persistent-page cache semantics but changes only Library snapshot serialization + atomic disk write execution: the `@MainActor` library model still captures the immutable snapshot in state order, then awaits a serial utility queue for JSON conversion and disk write.
+- The serial queue preserves write ordering; no timer, retry, fallback, debounce, throttle, watchdog, duplicate state or new cache is added.
+- Favorites persistence is unchanged because the controlling hitch evidence is the Library pagination path.
+- Poster image policy, Home carousel owner files, Player / MPV / PiP, UnifiedTransport, playback Cache / Session and STRM→302→115/CDN client-direct contracts are unchanged.
+- Deployment Target remains iOS 15.0.
PATCH
          git apply --check /tmp/build229.patch
          git apply /tmp/build229.patch
      - name: Validate source contract and exact scope
        run: |
          python3 scripts/check_poster_grid_smoothness.py
          git diff --check
          python3 - <<'PY'
          import subprocess
          paths = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {
              'Sources/Core/AppIdentity.swift',
              'Sources/UI/EmbyPagePersistentCache.swift',
              'Sources/UI/EmbyServerBrowseV3.swift',
              'scripts/check_poster_grid_smoothness.py',
              'docs/changelog/CHANGELOG_v0_14_62_build229.md',
          }
          if paths != expected:
              raise SystemExit(f'unexpected Build229 scope: {sorted(paths)}')
          forbidden = ['Sources/Player/', 'Sources/Transport/', 'Sources/Cache/', 'EmbyHomeCoreV3.swift', 'EmbyHomeHeroV3.swift', 'EmbyHomeCarouselStateV3.swift', 'EmbyHomeCarouselInteractionV3.swift']
          if any(any(token in path for token in forbidden) for path in paths):
              raise SystemExit(f'forbidden Build229 path: {sorted(paths)}')
          PY
      - name: Commit Build229 candidate
        run: |
          git config user.name white-shark-ssw
          git config user.email houstools@gmail.com
          git add Sources/Core/AppIdentity.swift Sources/UI/EmbyPagePersistentCache.swift Sources/UI/EmbyServerBrowseV3.swift scripts/check_poster_grid_smoothness.py docs/changelog/CHANGELOG_v0_14_62_build229.md
          git commit -m "Move library snapshot persistence off main thread"
          git push origin HEAD:perf/poster-grid-smoothness

  cleanup:
    if: always()
    needs: apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-shot helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --ff-only origin main
          git rm -f .github/workflows/temp-apply-build229-poster-snapshot-off-main-v2.yml
          git commit -m "Remove Build229 poster snapshot helper v2"
          git push origin main
