name: One-shot Finalize Build213 Closeout Docs

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/temp-finalize-build213-closeout.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard accepted merge and retired conflicts
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2303505ad4403182f5315d33c54f402903c809d2 HEAD
          test ! -e docs/project/current/dev/DEV-page-cache-optimization.md
          test ! -e .github/workflows/temp-apply-build213-poster-display-uikit.yml
          test ! -e .github/scripts/temp-build213-poster-display-uikit.py
          test ! -e .github/build213-poster-trigger.txt

      - name: Finalize authoritative Build213 merge evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          merge_sha = "2303505ad4403182f5315d33c54f402903c809d2"

          def replace_exact(path: str, old: str, new: str, expected: int = 1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "docs/project/PROJECT_STATE.md",
              "- Final merge commit: **pending until PR #260 is merged in this closeout cycle**",
              f"- Final merge commit: `{merge_sha}`",
          )
          replace_exact(
              "docs/project/PROJECT_STATE.md",
              "- Evidence: **Code written / CI passed / IPA produced / real-device accepted / stable for the accepted Favorites + Library page-persistence milestone / merge pending in this closeout cycle**",
              "- Evidence: **Code written / CI passed / IPA produced / real-device accepted / stable for the accepted Favorites + Library page-persistence milestone / merged to main**",
          )

          replace_exact(
              "docs/project/MODULE_STATUS.md",
              "| Favorites / library page persistent presentation cache | **Stable at Build213 / target-device accepted; PR #260 merge pending** |",
              "| Favorites / library page persistent presentation cache | **Stable at Build213 / merged to main** |",
          )
          replace_exact(
              "docs/project/MODULE_STATUS.md",
              "No Player/MPV/PiP, UnifiedTransport, playback Session Cache, Home-carousel or shared poster-image owner changes. |",
              f"No Player/MPV/PiP, UnifiedTransport, playback Session Cache, Home-carousel or shared poster-image owner changes. PR #260 merged at `{merge_sha}`. |",
          )

          replace_exact(
              "docs/project/BUILD_TEST_INDEX.md",
              "Dedicated standard MPV CI/IPA passed; first milestone stable and closing through PR #260.",
              f"Dedicated standard MPV CI/IPA passed; first milestone stable and merged through PR #260 at `{merge_sha}`.",
          )
          replace_exact(
              "docs/project/BUILD_TEST_INDEX.md",
              "- final merge commit: **pending until PR #260 is merged in this closeout cycle**",
              f"- final merge commit: `{merge_sha}`",
          )
          replace_exact(
              "docs/project/BUILD_TEST_INDEX.md",
              "- evidence: **Code written / CI passed / IPA produced / real-device accepted / stable for the accepted page-cache milestone / merge pending in this closeout cycle**",
              "- evidence: **Code written / CI passed / IPA produced / real-device accepted / stable for the accepted page-cache milestone / merged to main**",
          )
          replace_exact(
              "docs/project/BUILD_TEST_INDEX.md",
              "- Build213: Favorites + Library 7-tab persistent presentation warm cache; dedicated MPV CI/IPA passed and target-device accepted; PR #260 closeout.",
              f"- Build213: Favorites + Library 7-tab persistent presentation warm cache; dedicated MPV CI/IPA passed and target-device accepted; merged PR #260 at `{merge_sha}`.",
          )
          replace_exact(
              "docs/project/BUILD_TEST_INDEX.md",
              "- evidence: **Code written ✅ / CI passed ✅ / IPA produced ✅ / real-device accepted ✅ / first milestone stable ✅ / merge pending in this closeout cycle**.",
              "- evidence: **Code written ✅ / CI passed ✅ / IPA produced ✅ / real-device accepted ✅ / first milestone stable ✅ / merged to main ✅**.",
          )
          PY

      - name: Validate docs-only closeout and self-delete
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/temp-finalize-build213-closeout.yml
          changed="$(git diff HEAD --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/temp-finalize-build213-closeout.yml docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md | sort)"
          test "$changed" = "$expected"
          grep -F '2303505ad4403182f5315d33c54f402903c809d2' docs/project/PROJECT_STATE.md >/dev/null
          grep -F 'Stable at Build213 / merged to main' docs/project/MODULE_STATUS.md >/dev/null
          grep -F 'merged to main ✅' docs/project/BUILD_TEST_INDEX.md >/dev/null
          ! grep -F 'merge pending in this closeout cycle' docs/project/PROJECT_STATE.md >/dev/null
          ! grep -F 'merge pending in this closeout cycle' docs/project/BUILD_TEST_INDEX.md >/dev/null

      - name: Commit finalized project state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/PROJECT_STATE.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md
          git commit -m "Finalize merged Build213 project state"
          git push origin HEAD:main
