name: Temp Fix Carousel Image Flash

on:
  push:
    branches:
      - fix/carousel-disk-cache-flash
    paths:
      - .github/workflows/temp-fix-carousel-image-flash.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/carousel-disk-cache-flash
          fetch-depth: 0
      - name: Apply exact flash fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}")
              p.write_text(text.replace(old, new, count))

          shared = "Sources/UI/EmbySharedImageAndNavigation.swift"
          replace(
              shared,
              "import ImageIO\n\nprivate final class EmbyCachedImageLoader: ObservableObject {",
              '''import ImageIO\n\nfinal class EmbyDecodedImageRenderPool: @unchecked Sendable {\n    static let shared = EmbyDecodedImageRenderPool()\n    private let cache = NSCache<NSURL, UIImage>()\n\n    private init() {\n        cache.countLimit = 64\n        cache.totalCostLimit = 96 * 1024 * 1024\n    }\n\n    func image(for url: URL) -> UIImage? { cache.object(forKey: url as NSURL) }\n\n    func store(_ image: UIImage, for url: URL) {\n        let cost = Int(image.size.width * image.size.height * image.scale * image.scale * 4)\n        cache.setObject(image, forKey: url as NSURL, cost: cost)\n    }\n\n    func clear() { cache.removeAllObjects() }\n}\n\nprivate final class EmbyCachedImageLoader: ObservableObject {'''
          )

          replace(
              shared,
              '''        guard let url else {\n            image = nil\n            isLoading = false\n            return\n        }\n        image = nil\n        isLoading = true''',
              '''        guard let url else {\n            image = nil\n            isLoading = false\n            return\n        }\n        if let rendered = EmbyDecodedImageRenderPool.shared.image(for: url) {\n            image = rendered\n            isLoading = false\n            return\n        }\n        image = nil\n        isLoading = true'''
          )

          replace(
              shared,
              '''                    if let cachedImage {\n                        guard !Task.isCancelled else { return }\n                        await MainActor.run {''',
              '''                    if let cachedImage {\n                        guard !Task.isCancelled else { return }\n                        EmbyDecodedImageRenderPool.shared.store(cachedImage, for: url)\n                        await MainActor.run {'''
          )

          replace(
              shared,
              '''                guard !Task.isCancelled, let loaded else { return }\n                await MainActor.run {''',
              '''                guard !Task.isCancelled, let loaded else { return }\n                EmbyDecodedImageRenderPool.shared.store(loaded, for: url)\n                await MainActor.run {'''
          )

          replace(
              "Sources/UI/CacheSettingsView.swift",
              '''    private func clearImages() async {\n        await EmbyImageDiskCache.shared.clear()\n        statusMessage = "图片缓存已清除"''',
              '''    private func clearImages() async {\n        await EmbyImageDiskCache.shared.clear()\n        EmbyDecodedImageRenderPool.shared.clear()\n        statusMessage = "图片缓存已清除"'''
          )
          PY

          rm -f .github/workflows/temp-fix-carousel-image-flash.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: prevent carousel image flash after disk cache handoff"
          git push origin HEAD:fix/carousel-disk-cache-flash
