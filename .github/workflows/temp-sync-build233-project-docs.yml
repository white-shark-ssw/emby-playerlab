name: TEMP Sync Build233 Carousel Docs

on:
  push:
    branches: [perf/home-carousel-acquisition-first-frame-build233]
    paths:
      - ".github/build233-docs-sync-trigger.txt"

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build233 branch
        uses: actions/checkout@v4
        with:
          ref: perf/home-carousel-acquisition-first-frame-build233
          fetch-depth: 0
          persist-credentials: true

      - name: Update Build233 feature checkpoint
        run: |
          set -euo pipefail
          git fetch origin main
          python3 scripts/temp_sync_build233_docs.py branch
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          if ! git diff --cached --quiet; then
            git commit -m "Docs: record Build232 device result and Build233 candidate"
            git push origin HEAD:perf/home-carousel-acquisition-first-frame-build233
          fi

      - name: Sync authoritative Build233 docs to main
        run: |
          set -euo pipefail
          cp scripts/temp_sync_build233_docs.py /tmp/temp_sync_build233_docs.py
          git fetch origin main perf/home-carousel-acquisition-first-frame-build233
          git checkout -B main origin/main
          python3 /tmp/temp_sync_build233_docs.py main
          git diff --check
          git add docs/project/current/dev/DEV-home-carousel-drag-smoothness.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md
          if ! git diff --cached --quiet; then
            git commit -m "Docs: sync carousel Build232 result and Build233 baseline [skip ci]"
            git push origin HEAD:main
          fi
