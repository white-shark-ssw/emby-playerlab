name: Temp Search Build251 Global Suggestions

on:
  push:
    branches: ["feat/search-page-optimization"]
    paths:
      - ".github/search-build251-global-suggestions-trigger.txt"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-page-optimization
          fetch-depth: 0
      - name: Apply global Suggestions Search recommendation path
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          api = Path('Sources/Networking/EmbyLibraryHubAPI.swift')
          text = api.read_text()
          old = '''    func librarySuggestions(parentId: String, limit: Int = 20, includeItemTypes: [String] = []) async throws -> [LibraryItem] {
        var query = libraryHubCommonFields + [
            URLQueryItem(name: "ParentId", value: parentId),
            URLQueryItem(name: "Recursive", value: "true"),
            URLQueryItem(name: "Limit", value: String(max(1, min(100, limit)))),
        ]
        if !includeItemTypes.isEmpty { query.append(URLQueryItem(name: "IncludeItemTypes", value: includeItemTypes.joined(separator: ","))) }
        let page: EmbyItemPage = try await libraryHubRequest(path: "Users/\\(try libraryHubUserID())/Suggestions", query: query)
        return libraryHubDeduplicated(page.items)
    }
'''
          new = '''    func librarySuggestions(parentId: String? = nil, limit: Int = 20, includeItemTypes: [String] = []) async throws -> [LibraryItem] {
        var query = libraryHubCommonFields + [
            URLQueryItem(name: "Recursive", value: "true"),
            URLQueryItem(name: "Limit", value: String(max(1, min(100, limit)))),
        ]
        if let parentId, !parentId.isEmpty { query.append(URLQueryItem(name: "ParentId", value: parentId)) }
        if !includeItemTypes.isEmpty { query.append(URLQueryItem(name: "IncludeItemTypes", value: includeItemTypes.joined(separator: ","))) }
        let page: EmbyItemPage = try await libraryHubRequest(path: "Users/\\(try libraryHubUserID())/Suggestions", query: query)
        return libraryHubDeduplicated(page.items)
    }
'''
          if old not in text:
              raise SystemExit('librarySuggestions baseline not found')
          api.write_text(text.replace(old, new, 1))

          preloader = Path('Sources/UI/EmbySearchRecommendationPreloader.swift')
          text = preloader.read_text()
          start = text.index('    private static func fetchRecommendations(client: EmbyAPIClient) async throws -> LoadedRecommendations {')
          end = text.index('\n    private func warmPosterImages', start)
          replacement = '''    private static func fetchRecommendations(client: EmbyAPIClient) async throws -> LoadedRecommendations {
        let requestedTypes = V3SearchRecommendationPolicy.itemTypes
        let suggestions = try await client.librarySuggestions(limit: V3SearchRecommendationPolicy.preloadLimit, includeItemTypes: requestedTypes)
        let accepted = suggestions.filter { V3SearchRecommendationPolicy.allows($0, requestedTypes: requestedTypes) }
        let nilTypeCount = suggestions.filter { $0.type == nil }.count
        DiagnosticsLogger.shared.log("Search", "recommendation warm global requested=\\(requestedTypes.joined(separator: ",")) returned=\\(suggestions.count) nilType=\\(nilTypeCount) accepted=\\(accepted.count)")
        return LoadedRecommendations(items: Array(accepted.prefix(V3SearchRecommendationPolicy.preloadLimit)), client: client)
    }
'''
          preloader.write_text(text[:start] + replacement + text[end:])
          PY
          swiftc -parse Sources/Networking/EmbyLibraryHubAPI.swift
          swiftc -parse Sources/UI/EmbySearchRecommendationPreloader.swift
          git diff --check
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add Sources/Networking/EmbyLibraryHubAPI.swift Sources/UI/EmbySearchRecommendationPreloader.swift
          git commit -m "Use global Emby Suggestions for Search recommendations"
          git push origin HEAD:feat/search-page-optimization
