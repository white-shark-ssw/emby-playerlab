name: Temp Apply Build229 Poster Snapshot Off Main V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-apply-build229-poster-snapshot-off-main-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact poster source
        run: |
          git show origin/main:.github/temp-build229.patch > /tmp/build229.patch
          echo "aa804209699093dfa13596813e364cbf5e2e7de931ba9c5cedb7430f6b70ca6c  /tmp/build229.patch" | sha256sum -c -
          git fetch origin perf/poster-grid-smoothness
          git checkout perf/poster-grid-smoothness
          test "$(git rev-parse HEAD)" = "20f0edaf30c3c9161a79f64fd29dbc79c199473e"
      - name: Apply exact Build229 patch
        run: |
          git apply --check /tmp/build229.patch
          git apply /tmp/build229.patch
      - name: Validate source and scope
        run: |
          python3 scripts/check_poster_grid_smoothness.py
          git diff --check
          python3 - <<'PY'
          import subprocess
          paths = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
              'Sources/Core/AppIdentity.swift',
              'Sources/UI/EmbyPagePersistentCache.swift',
              'Sources/UI/EmbyServerBrowseV3.swift',
              'scripts/check_poster_grid_smoothness.py',
              'docs/changelog/CHANGELOG_v0_14_62_build229.md',
          }
          if paths != expected:
              raise SystemExit(f'unexpected Build229 scope: {sorted(paths)}')
          forbidden = ('Sources/Player/', 'Sources/Transport/', 'Sources/Cache/', 'EmbyHomeCoreV3.swift', 'EmbyHomeHeroV3.swift', 'EmbyHomeCarouselStateV3.swift', 'EmbyHomeCarouselInteractionV3.swift')
          for path in paths:
              if any(token in path for token in forbidden):
                  raise SystemExit(f'forbidden Build229 path: {path}')
          PY
      - name: Commit Build229 candidate
        run: |
          git config user.name white-shark-ssw
          git config user.email houstools@gmail.com
          git add Sources/Core/AppIdentity.swift Sources/UI/EmbyPagePersistentCache.swift Sources/UI/EmbyServerBrowseV3.swift scripts/check_poster_grid_smoothness.py docs/changelog/CHANGELOG_v0_14_62_build229.md
          git commit -m "Move library snapshot persistence off main thread"
          git push origin HEAD:perf/poster-grid-smoothness

  cleanup:
    if: always()
    needs: apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-shot helpers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --ff-only origin main
          git rm -f .github/workflows/temp-apply-build229-poster-snapshot-off-main-v3.yml .github/temp-build229.patch
          git commit -m "Remove Build229 poster patch helpers"
          git push origin main
