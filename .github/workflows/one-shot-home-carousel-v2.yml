name: One-shot home carousel v2

on:
  push:
    branches: [feat/home-ui-polish]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-ui-polish
          fetch-depth: 0

      - name: Apply home carousel v2
        run: |
          set -euo pipefail
          git apply scripts/home-carousel-v2/source1.patch
          python3 scripts/home-carousel-v2/apply_v2.py
          python3 scripts/check_home_immersive_carousel.py
          python3 scripts/check_home_ui_polish.py
          python3 scripts/check_home_horizontal_tap_routing.py
          python3 scripts/check_v0134_detail_navigation.py
          python3 scripts/check_adaptive_hero_reveal.py
          python3 scripts/check_detail_resume_button.py
          git diff --check

      - name: Commit final source only
        run: |
          set -euo pipefail
          rm -rf scripts/home-carousel-v2 scripts/home-carousel-v2-parts
          rm -f .github/workflows/one-shot-home-carousel-v2.yml
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: rebuild immersive home carousel'
          git push origin HEAD:feat/home-ui-polish
