name: Temp Sync Build220 Poster Real Device

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sync-build220-poster-real-device.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Build220 poster evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path
          import re

          dev = Path('docs/project/current/dev/DEV-poster-grid-smoothness.md')
          text = dev.read_text()
          text = re.sub(r'\*\*Active — Build220 / 0\.14\.53.*?\*\*', '**Active — Build220 / 0.14.53 has now been target-device tested for the intended 3×3 route and is not accepted as a smoothness fix. The user reports the tactile result is “基本一样”. The supplied App log still records a real grid dragging hitch at 33.3 ms and a second 74.1 ms moving hitch. Build220 therefore rejects the hypothesis that bypassing surrounding SwiftUI poster-cell observation of the display-image loader is sufficient. The exact source/CI/IPA evidence remains valid, but the candidate is real-device ineffective and not stable. No Home-carousel owner file changed.**', text, count=1, flags=re.S)
          text = text.replace('- **Accepted overall baseline**: OnePlayer **0.14.32 / Build199**, PR #256, merge `730faecf30f7cdbfa7bf4670022dd2e1f3a8de9b`', '- **Accepted overall baseline**: OnePlayer **0.14.49 / Build216**, PR #261, merge `f5ad126b7b47e9713b1949780a6507fb3f0ca50f`')
          marker = '### Build220 target-device result — 2026-08-27'
          if marker not in text:
              block = '''### Build220 target-device result — 2026-08-27

User verdict on the intended 3×3 scrolling A/B: **“体感来说：基本一样”**. This is the controlling real-device result; Build220 must not be described as a grid smoothness improvement.

Uploaded App log: `OnePlayer-App-1787845216.log`. It is short but contains two `PosterScrollHitch` records on the grid route:

1. **33.3 ms**, `phase=dragging`, `offset_y=3506.00`, `delta_y=5.33`, `visible=12`. The latest poster event was item `29670` only **171.7 ms** earlier and is also the load-ahead trigger. The latest image commit was item `29668`, `Primary`, `MaxWidth=378`, `source=network`, `role=display`, **35.8 ms** before the hitch. The `StartIndex=60` page request began about **164 ms** before the hitch.
2. **74.1 ms**, `phase=moving`, `offset_y=3639.33`, `delta_y=1.00`, `velocity_y=0.0`. The latest image commit was already **1010.1 ms** old and the latest cell/load-ahead event **1146.1 ms** old, so this second sample is not evidence of an immediate image-publish trigger and is weaker than the dragging sample for user-touch attribution.

Exact Build220 source matters for interpretation. The display-only path no longer makes the surrounding SwiftUI poster cell observe loader image changes, but `EmbyCachedImageLoader` still performs `self.image = loaded` on the MainActor. That `@Published` assignment synchronously delivers to the UIKit surface's Combine sink, which then calls `UIImageView.image = image`. Current diagnostics timestamp `imageDidCommit` only **after** the assignment; they do not measure the assignment/publisher/sink/UI image-adoption duration or bursts of several commits. Therefore Build220 falsifies “SwiftUI poster-cell observation is the primary sufficient cause”, but does **not** yet isolate whether the remaining cost is the MainActor publish/Combine→UIImageView adoption/compositor path.

The first hitch also occurs immediately after grid load-ahead starts `StartIndex=60`. On the accepted Build216 baseline, library pagination applies new items on a `@MainActor` model and then synchronously serializes/writes the persistent page snapshot. That path is worth measuring for this pagination-adjacent sample. However it cannot be the universal historical cause: Build212 captured the same 3×3 hitch family before the Build213 persistent-page-cache milestone existed. Do not replace the image-path evidence with a cache-only theory.

**Build220 evidence now: Code written ✅ / synchronized exact scope+checker ✅ / CI passed ✅ / IPA produced+verified ✅ / target-device tested ✅ / user reports 3×3 basically unchanged ❌ / grid UIKit observation-bypass hypothesis rejected as sufficient ✅ / root cause still unresolved / not stable.**

Next diagnostic should be measurement-only: time the MainActor `@Published image` assignment including synchronous Combine delivery to the UIKit surface, record image-publish bursts around long frames, and separately time pagination result application plus persistent snapshot serialization/write. Do not add another smoothing patch until those costs are separated.

'''
              text = text.replace('## Parallel safety\n', block + '## Parallel safety\n')
          text = text.replace('**Evidence: Code written ✅ / synchronized exact 7-path scope + checker ✅ / CI passed ✅ / IPA produced + independently verified ✅ / target-device grid A/B pending ❌ / stable or frozen ❌.**', '**Evidence: Code written ✅ / synchronized exact 7-path scope + checker ✅ / CI passed ✅ / IPA produced + independently verified ✅ / target-device tested ✅ / user reports 3×3 basically unchanged ❌ / stable or frozen ❌.**')
          text = re.sub(r'## Next exact action\n\n.*?\n\n## Do not repeat', '''## Next exact action

1. Treat Build220 as a real-device ineffective grid candidate; do not merge or tune the UIKit surface blindly.
2. Add measurement-only diagnostics for MainActor `image` publication / synchronous Combine→`UIImageView` adoption duration and nearby publish bursts.
3. Add separate timing for pagination result application and Build213 page-persistent snapshot serialization/write, because the first Build220 dragging hitch is pagination-adjacent.
4. Preserve Build212 as the historical guardrail: persistent page cache cannot be the universal cause because the grid hitch family predates Build213.
5. Keep Home-carousel ownership separate and do not touch Player / Transport / Cache / Session P0 contracts.

## Do not repeat''', text, count=1, flags=re.S)
          dev.write_text(text)

          module = Path('docs/project/MODULE_STATUS.md')
          text = module.read_text()
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('| Poster 3-column / poster-heavy scroll smoothness |'):
                  lines[i] = '| Poster 3-column / poster-heavy scroll smoothness | **Active — Build220 target-device tested; 3×3 feels basically unchanged; UIKit observation bypass rejected as sufficient** | Build220 / 0.14.53 exact source `6198466a749a54603a67c6c32bc0efcf9d7e2082` remains CI/IPA verified (`33083504023 / 98556783889`, artifact `9651230376`, MinOS 15.0), but the user reports the intended 3×3 A/B is **“基本一样”**. `OnePlayer-App-1787845216.log` still records a 33.3 ms grid `phase=dragging` hitch 35.8 ms after `network/display/Primary/378` image commit and 171.7 ms after the latest cell/load-ahead trigger, plus a 74.1 ms `phase=moving` hitch with image age 1010.1 ms. Build220 therefore shows that bypassing surrounding SwiftUI poster-cell observation alone does not materially solve the grid hitch. The remaining MainActor `@Published image` → Combine sink → `UIImageView.image` adoption cost is not measured; the first sample is also pagination-adjacent, so pagination apply/persistent-snapshot timing should be measured separately. Build212 predates Build213 persistent cache, so cache cannot be the universal historical cause. No new performance patch is justified until these timings are separated. Not stable. |'
              if line.startswith('| Other product modules |'):
                  lines[i] = '| Other product modules | Active parallel work | Build216 / 0.14.49 remains the latest accepted overall runtime baseline. Home-carousel Build219 / 0.14.52 is the separate real-device diagnostic-tested high-refresh line; poster-scroll Build220 / 0.14.53 is now real-device tested and ineffective for 3×3 smoothness. Build220 does not modify Home carousel owner files. `EmbySharedImageAndNavigation.swift` remains shared infrastructure, so whichever Active task integrates second must resync against then-current `main` and rerun affected validation. |'
          module.write_text('\n'.join(lines) + '\n')

          index = Path('docs/project/BUILD_TEST_INDEX.md')
          text = index.read_text()
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('| **Build220 / 0.14.53** |'):
                  lines[i] = '| **Build220 / 0.14.53** | Corrected poster grid UIKit display A/B | **Target-device tested; 3×3 smoothness basically unchanged; not accepted.** Exact source `6198466a749a54603a67c6c32bc0efcf9d7e2082`; run/job `33083504023 / 98556783889`; artifact `9651230376`; IPA SHA-256 `a73a33866745418663d1dcc35634f5b21b0a73436a91f40ed8a4f6dc6bbcf574`; MinOS 15.0. User verdict: “基本一样”. App log retains a 33.3 ms grid dragging hitch (`network/display/Primary/378` commit age 35.8 ms; cell/load-ahead age 171.7 ms) and a 74.1 ms moving hitch. Bypassing surrounding SwiftUI poster-cell observation is rejected as a sufficient fix. Next step is measurement-only around MainActor image publish/Combine→UIImageView adoption and pagination/persistent-cache apply; not stable. |'
          index.write_text('\n'.join(lines) + '\n')

          state = Path('docs/project/PROJECT_STATE.md')
          text = state.read_text()
          text = re.sub(r'_Last updated after Build220 / 0\.14\.53 poster-grid CI/IPA verification\..*?_', '_Last updated after Build220 / 0.14.53 poster-grid target-device testing. Build216 remains the latest real-device accepted overall runtime baseline. Home-carousel remains an independent diagnostic line. Poster Build220 is CI/IPA verified but the intended 3×3 A/B feels basically unchanged and still logs grid long frames, so the UIKit observation-bypass candidate is rejected as a sufficient smoothness fix and remains Active/not stable._', text, count=1)
          poster = '''## Active: Poster-heavy scrolling smoothness

Work: `DEV-poster-grid-smoothness`.

- Build212 remains the route-split evidence authority: Home hitches correlate with the separate 1400px carousel image path, while 11 real grid dragging hitches correlated with newly visible `network/display/Primary/378` publication. Home and grid are separate runtime paths.
- Build218 introduced the grid/display-only UIKit image surface so surrounding SwiftUI poster cells no longer observe display-loader image publication. Home remained visibly hitchy and the package exposed a shared transparent-Logo background regression; the latter was corrected without touching carousel owner source.
- Build220 / 0.14.53 exact tested source **`6198466a749a54603a67c6c32bc0efcf9d7e2082`** is synchronized onto accepted Build216 main and carries that transparency correction. Exact seven-path scope/checker passed; run/job **`33083504023 / 98556783889`** success; artifact **`9651230376`**; artifact SHA-256 `fc1cd17fe974b6e35b2eda03eb32718ca3fca6fa4034406016385a9aa5c1f729`; IPA SHA-256 `a73a33866745418663d1dcc35634f5b21b0a73436a91f40ed8a4f6dc6bbcf574`; source ZIP SHA-256 `7c222973433e8e94608946fc5ffda4e5ec4442a9c6200be4b98e84d680695fad`; OnePlayer 0.14.53 (220), MinOS 15.0 independently verified.
- **2026-08-27 target-device result:** user reports the intended 3×3 scrolling feel is **“基本一样”**. This is controlling evidence; Build220 is not accepted as a smoothness improvement.
- Uploaded `OnePlayer-App-1787845216.log` contains two grid hitch records. The stronger user-drag sample is **33.3 ms**, `phase=dragging`, `delta_y=5.33`; latest `network/display/Primary/378` commit age **35.8 ms**, latest cell/load-ahead age **171.7 ms**, and the `StartIndex=60` request began about 164 ms before the hitch. A second **74.1 ms** `phase=moving` sample has image age **1010.1 ms** and cell/load-ahead age **1146.1 ms**, so it does not support an immediate image-publish trigger.
- Exact source shows Build220 still assigns decoded images to `@Published image` on the MainActor; that synchronous assignment delivers through Combine to the UIKit surface and then `UIImageView.image`. Current `imageDidCommit` timing is recorded only after the assignment and does not measure this publish/sink/adoption cost or bursts. Thus Build220 rejects only the surrounding SwiftUI poster-cell observation hypothesis as sufficient; it does not clear the remaining main-thread image-adoption/compositor path.
- The first sample is also pagination-adjacent. Build216's library page model applies appended items on MainActor and synchronously persists the page snapshot. That should be timed separately, but Build212 predates Build213 persistent caching, so persistence cannot be the universal historical cause of the 3×3 hitch family.
- Current evidence: **Code written / synchronized scope+checker / CI passed / IPA produced+verified / target-device tested / 3×3 basically unchanged / candidate rejected as sufficient / root cause unresolved / not stable**.

Next: make the next poster build diagnostic-only. Measure MainActor image-assignment duration including synchronous Combine→`UIImageView` delivery and publish bursts, and separately measure pagination result application plus persistent snapshot serialization/write. Do not introduce another smoothing patch until those costs are separated. Home remains owned by the independent carousel task.

'''
          text = re.sub(r'## Active: Poster-heavy scrolling smoothness\n.*?\n## Parallel integration rule\n', poster + '## Parallel integration rule\n', text, count=1, flags=re.S)
          state.write_text(text)
          PY
          git diff --check
          git diff -- docs/project/current/dev/DEV-poster-grid-smoothness.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md
          git add docs/project/current/dev/DEV-poster-grid-smoothness.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md
          git commit -m "Docs: record Build220 poster real-device result"
          git push origin main
          git pull --ff-only origin main
          git rm .github/workflows/temp-sync-build220-poster-real-device.yml
          git commit -m "Remove Build220 poster evidence sync helper"
          git push origin main
