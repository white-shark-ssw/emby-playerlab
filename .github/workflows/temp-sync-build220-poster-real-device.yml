name: Temp Sync Build220 Poster Real Device

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-sync-build220-poster-real-device.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Build220 poster evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          python3 scripts/temp_sync_build220_poster_real_device.py
          git diff --check
          git add docs/project/current/dev/DEV-poster-grid-smoothness.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md
          git commit -m "Docs: record Build220 poster real-device result"
          git push origin main
          git pull --ff-only origin main
          git rm .github/workflows/temp-sync-build220-poster-real-device.yml scripts/temp_sync_build220_poster_real_device.py
          git commit -m "Remove Build220 poster evidence sync helpers"
          git push origin main
