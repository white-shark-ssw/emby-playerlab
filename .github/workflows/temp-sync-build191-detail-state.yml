name: Sync Build191 detail project state

on:
  push:
    branches: [feat/detail-episode-selection-navigation]
    paths:
      - ".github/workflows/temp-sync-build191-detail-state.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/detail-episode-selection-navigation
          fetch-depth: 0
      - name: Sync Build191 reservation to main
        run: |
          set -euo pipefail
          cp scripts/temp_sync_build191_detail_state.py /tmp/temp_sync_build191_detail_state.py
          git fetch origin main
          git checkout -B main origin/main
          python3 /tmp/temp_sync_build191_detail_state.py
          git diff --check
          git config user.name "OnePlayer CI"
          git config user.email "actions@users.noreply.github.com"
          git add docs/project/current/dev/DEV-detail-episode-selection-navigation.md docs/project/MODULE_STATUS.md
          git commit -m "Reserve Build191 detail summary candidate"
          git push origin HEAD:main
