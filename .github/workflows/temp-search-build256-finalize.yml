name: Temp Search Build256 Finalize

on:
  push:
    branches: ["feat/search-page-optimization"]
    paths:
      - ".github/search-build256-finalize-trigger.txt"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-page-optimization
          fetch-depth: 0
      - name: Merge current main and record target-device acceptance
        run: |
          set -euo pipefail
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git fetch origin main
          git merge origin/main -X ours --no-edit
          python3 - <<'PY'
          from pathlib import Path

          checkpoint = Path('docs/project/current/dev/DEV-search-page-optimization.md')
          text = checkpoint.read_text()
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('- Status:'):
                  lines[i] = '- Status: Completed — Build256 target-device accepted; final Search contract ready for merge'
                  break
          text = '\n'.join(lines).rstrip()
          marker = '## Build256 target-device acceptance — 2026-08-30'
          if marker not in text:
              text += f'''\n\n{marker}\n\nThe user accepted Build256 / OnePlayer 0.14.89 on the target device as the final Search implementation. Accepted behavior: app startup performs no Search recommendation fetch; entering Search creates a fresh Search lifetime and loads the initial 9 Movie/Series recommendations; incremental random recommendation loading continues in +6 batches without duplicates or the Build254 container twitch; opening a recommendation detail and returning preserves the already-loaded recommendation dataset while Search remains the selected Dock page; manually switching Dock away from Search destroys that Search dataset; re-entering Search creates a fresh lifetime and fetches a new initial 9. Build248 Dock/keyboard behavior, Build253 Items+Random recommendation authority, Build254 ExcludeItemIds pagination contract, and Build255 non-lazy outer section owner are all retained.\n\nFinal accepted Build256 evidence: exact product source `723d803c70326dee49aabc75f15ce445b7de947e`; Xcode 16.4 Release run/job `33271528610 / 99150738764`; artifact `9720282077`; artifact digest `sha256:e9c3f0756cb4dbd7a0fa9f2785594fa3df7e41964f472426a14e6c50a231615e`; IPA SHA-256 `01cf29fa117df904307286066c131d68be0e89b8f8f4a26b8b960c29ae6afce5`; `com.embyplayerlab.app`; `0.14.89 (256)`; `MinimumOSVersion=15.0`; IPA integrity passed. Evidence: **Code written ✅ / CI passed ✅ / IPA produced+verified ✅ / target-device tested ✅ / user accepted ✅ / stable pending merge ✅**.\n'''
          checkpoint.write_text(text.rstrip() + '\n')

          c = Path('docs/changelog/CHANGELOG_v0_14_89_build256.md')
          ct = c.read_text().rstrip()
          acceptance = '\n\n- Target-device acceptance: PASS on iPhone 15 Pro Max / iOS 17.0. Build256 is the final accepted Search behavior and is ready for merge.'
          if 'Target-device acceptance: PASS' not in ct: ct += acceptance
          c.write_text(ct.rstrip() + '\n')
          PY
          git diff --check
          git add docs/project/current/dev/DEV-search-page-optimization.md docs/changelog/CHANGELOG_v0_14_89_build256.md
          git commit -m "Accept Search Build256 on target device" || true
          git push origin HEAD:feat/search-page-optimization
