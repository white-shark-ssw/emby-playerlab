name: Build OnePlayer 0.13.33 MDK Online Input Diagnostics

on:
  push:
    branches: [ci/mdk-online-input-diagnostics-0.13.33]
    paths:
      - "scripts/instrument_mdk_online_input.py"
      - ".github/workflows/build-mdk-online-input-01333.yml"
  workflow_dispatch:

concurrency:
  group: mdk-online-input-01333-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify known-good MDK to MPV switch baseline
        run: |
          set -euo pipefail
          git cat-file -e f7251574141afe47e64258f9823c9b8eaf7707a3^{commit}
          git diff --exit-code f7251574141afe47e64258f9823c9b8eaf7707a3 -- Sources/Player/PlayerController.swift Sources/Player/PlaybackOrchestrator.swift Sources/Player/MPVPlayerEngine.swift MDKLab/App/MDKKSAVIOPlayerEngine.swift
          grep -Fq 'action=switch-mpv' Sources/Player/PlaybackOrchestrator.swift
          grep -Fq 'TransportHTTPServer' MDKLab/App/MDKKSAVIOPlayerEngine.swift
          echo 'Playback engine baseline preserved; only CI-time transport diagnostics will be injected.'

      - name: Inject online input diagnostics and diagnostic identity
        run: |
          set -euo pipefail
          python3 scripts/instrument_mdk_online_input.py
          grep -Fq 'UnifiedReadTrace' Sources/Transport/UnifiedMediaTransportSession.swift
          grep -Fq 'TransportRangeTrace' Sources/Transport/RangeHTTPClient.swift
          grep -Fq 'MARKETING_VERSION: "0.13.33"' project.mdklab.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "100"' project.mdklab.yml
          grep -Fq 'sourceVersion = "0.13.33"' Sources/Core/AppIdentity.swift
          grep -R -n 'final class TransportHTTPServer\|class TransportHTTPServer\|struct TransportHTTPServer' Sources MDKLab || true

      - name: Select Xcode and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodebuild -version
          swift --version

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build Release for generic iOS device
        id: release_build
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Report compiler failure
        if: steps.release_build.outcome == 'failure'
        run: |
          set -euo pipefail
          grep -nE '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|SwiftCompile|CompileSwift|EmitSwiftModule' build.log | tail -300 || true
          tail -200 build.log || true
          exit 1

      - name: Validate app identity and minimum OS
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.33' --build '100' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log
          strings "$APP_PATH/OnePlayer" | grep -F 'UnifiedReadTrace' >/dev/null
          strings "$APP_PATH/OnePlayer" | grep -F 'TransportRangeTrace' >/dev/null

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.33-build100-mdk-online-input-diag-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload diagnostic package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.33-build100-mdk-online-input-diag
          path: |
            OnePlayer-0.13.33-build100-mdk-online-input-diag-unsigned.ipa
            OnePlayer-0.13.33-build100-mdk-online-input-diag-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
            build.log
          if-no-files-found: error
          retention-days: 14
