name: Cleanup v0.11.2 Duplicates

on:
  push:
    branches: [chatgpt/v0.11.2-transport-stability]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.11.2-transport-stability
      - name: Collapse duplicate finalization inserts
        run: |
          set -euo pipefail
          python3 scripts/cleanup_v0112_duplicates.py
          if git diff --quiet; then
            echo "already clean"
            exit 0
          fi
          git config user.name "ChatGPT CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources/Player/PlayerController.swift
          git commit -m "Remove duplicate full-cache promotion inserts"
          git push origin HEAD:chatgpt/v0.11.2-transport-stability
