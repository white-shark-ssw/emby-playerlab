name: Close Build306 Acceptance Docs

on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-close-build306-acceptance.yml]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record Build306 target-device acceptance and remove checkpoint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          merge_sha = "dca5f145612301c071619ee2d57fd80d46bf726a"
          source_sha = "20dac5ce21e7d3261794dc62827b90fa07b048fb"
          run_job = "37839047724 / 113523454935"
          artifact = "11577437579"
          ipa_sha = "414dac7cfb8026bd42219251b6f700d53733bb6680540d4b1b58e822368f2b15"
          source_zip_sha = "443c44566e0e3a33bdcbec8e4a4a9b4ba2a5437d51238f3d304fd28dc7189111"
          digest = "sha256:dce68eb07b7f8dc469051e68fdae3eb33b28e6e4cd835739b9404034a92fa8cc"

          p = Path("docs/project/PROJECT_STATE.md")
          s = p.read_text()
          s, n = re.subn(r"_Last updated[^\n]*_", "_Last updated 2026-10-09: **Build306 / 0.15.39 is now the accepted overall baseline.** The user completed target-device validation and reported no remaining issue for both Home → detail → back and Home → Library → back. PR #294 is merged; the Home poster temporary-suspension lifecycle is accepted/frozen._", s, count=1)
          assert n == 1
          replacement = f'''## Current accepted overall baseline — Build306 / 0.15.39\n\n- Product: **OnePlayer 0.15.39 / Build306**, target-device accepted on 2026-10-09.\n- Exact tested product source: `{source_sha}`; dedicated CI run/job `{run_job}` passed with **54 tests / 0 failures**.\n- Artifact `{artifact}`, digest `{digest}`; IPA SHA-256 `{ipa_sha}`; source ZIP SHA-256 `{source_zip_sha}`; bundle/version/build `com.embyplayerlab.app`, `0.15.39 / 306`; MinOS **15.0**.\n- Target-device result: user completed validation and reported **“验证完了，没问题了”** for the required Home → detail → back and Home → Library → back paths. The previously visible black/blank poster reload sweep no longer reproduces in the accepted session.\n- Accepted behavior: temporary shared-poster page suspension may cancel image demand and preserve offsets, but keeps already-displayed artwork/card binding resident; true row/cell reuse remains destructive and releases artwork.\n- PR #294 merged at `{merge_sha}`. No second cache/state owner, Home metadata reload, navigation replacement, Player/Transport/Cache/Emby Session or P0 playback change was introduced.\n- Evidence: **Code written ✅ / CI passed ✅ / IPA produced+verified ✅ / real-device tested ✅ / task accepted ✅ / merged ✅ / Home poster suspension stable-frozen ✅**.\n\n'''
          s, n = re.subn(r"## Current accepted overall baseline — Build303.*?(?=## Accepted feature milestone — Build305 / 0\.15\.38 Library media-only root)", replacement, s, count=1, flags=re.S)
          assert n == 1
          s = s.replace("- This is a feature milestone, not a promotion of Build305 to accepted overall baseline, because the separate Home-return poster-retention regression was reported immediately afterward and remains Active under Build306.", "- Build305 remains the accepted Library feature milestone. The separate Home-return poster-retention regression was subsequently resolved and target-device accepted in Build306, which is now the accepted overall baseline.")
          s, n = re.subn(r"## Current candidate — Build306 / 0\.15\.39 Home return poster retention.*?(?=Historical dated entries below)", "", s, count=1, flags=re.S)
          assert n == 1
          p.write_text(s)

          p = Path("docs/project/MODULE_STATUS.md")
          s = p.read_text()
          old = next(line for line in s.splitlines() if line.startswith("| Home poster temporary navigation suspension |"))
          new = f"| Home poster temporary navigation suspension | **Stable / frozen — Build306 target-device accepted / merged** | Build306 / 0.15.39 exact tested source `{source_sha}`; 54/0 regression; CI `{run_job}`; artifact `{artifact}`; IPA SHA-256 `{ipa_sha}`; MinOS15. User completed target-device validation on 2026-10-09 with no remaining issue for Home→detail→back and Home→Library→back. Temporary page suspension retains already-present artwork/card binding while true reuse remains destructive. PR#294 merged `{merge_sha}`. No second cache/state owner, Home loader/navigation, Player/Transport/Cache/Emby Session or P0 change. Reopen only on new regression evidence. |"
          s = s.replace(old, new)
          s = s.replace("Build303 /0.15.36 is the accepted overall baseline.", "Build306 /0.15.39 is the accepted overall baseline.")
          p.write_text(s)

          p = Path("docs/project/BUILD_TEST_INDEX.md")
          s = p.read_text()
          top = f'''## Latest accepted overall baseline — Build306 / 0.15.39\n\nOnePlayer 0.15.39 / Build306 was target-device accepted on 2026-10-09 after the user completed both Home → detail → back and Home → Library → back validation and reported no remaining issue. Exact tested source `{source_sha}`; CI `{run_job}` passed with **54 tests / 0 failures**; artifact `{artifact}` digest `{digest}`; IPA SHA-256 `{ipa_sha}`; source ZIP SHA-256 `{source_zip_sha}`; bundle `com.embyplayerlab.app`; MinOS15.0. PR #294 merged at `{merge_sha}`.\n\nAccepted lifecycle contract: temporary shared-poster page suspension keeps already-displayed artwork/card binding resident while cancelling image demand/prefetch and preserving offsets; real row/cell reuse remains destructive. Evidence: **Code written ✅ / CI passed ✅ / IPA produced+verified ✅ / real-device tested ✅ / task accepted ✅ / merged ✅ / stable-frozen ✅**.\n\n'''
          s, n = re.subn(r"## Latest accepted overall baseline — Build303 /0\.15\.36.*?(?=## Accepted feature milestone — Build305 / 0\.15\.38)", top, s, count=1, flags=re.S)
          assert n == 1
          s = s.replace("Build305 is **not** promoted to accepted overall baseline because the same device session exposed a separate Home-return poster-artwork blank/reload regression. That work is Active as `DEV-home-return-poster-retention` / reserved Build306.", "Build305 remains the accepted Library feature milestone. Build306 subsequently resolved the separate Home-return poster-artwork regression and is now the accepted overall baseline.")
          s, n = re.subn(r"## Candidate — Build306 / 0\.15\.39 Home return poster retention.*?(?=Historical dated entries below)", "", s, count=1, flags=re.S)
          assert n == 1
          p.write_text(s)

          p = Path("docs/project/TECHNICAL_DECISIONS.md")
          s = p.read_text()
          old = "This distinction is deliberately inside the existing `EmbyPosterSectionsController` / `EmbyPosterHorizontalRow` owner. Do not solve return blanking by forcing Home metadata refresh, adding a second image cache/state owner, delaying rebind with a timer/watchdog, disabling real offscreen reuse, or replacing native navigation. Build306 is the first implementation/CI proof of this decision; real-device acceptance is still pending, so this decision remains candidate-level until target-device confirmation."
          new = f"This distinction is deliberately inside the existing `EmbyPosterSectionsController` / `EmbyPosterHorizontalRow` owner. Do not solve return blanking by forcing Home metadata refresh, adding a second image cache/state owner, delaying rebind with a timer/watchdog, disabling real offscreen reuse, or replacing native navigation. Build306 / 0.15.39 was target-device accepted on 2026-10-09 for both Home → detail → back and Home → Library → back, and PR #294 merged at `{merge_sha}`. This lifecycle distinction is now stable/frozen unless new device regression evidence appears."
          assert old in s
          p.write_text(s.replace(old, new))

          p = Path("docs/changelog/CHANGELOG_v0_15_39_build306.md")
          s = p.read_text()
          old = "Evidence: **Code written ✅ / CI passed ✅ / IPA produced+independently verified ✅ / Build306 target-device validation pending ❌ / stable-frozen ❌.**"
          new = f"Target-device acceptance on 2026-10-09: the user completed both Home → detail → back and Home → Library → back validation and reported **“验证完了，没问题了”**; the prior black/blank poster reload sweep no longer reproduces in the accepted session. PR #294 merged at `{merge_sha}`.\n\nEvidence: **Code written ✅ / CI passed ✅ / IPA produced+independently verified ✅ / real-device tested ✅ / task accepted ✅ / merged ✅ / stable-frozen ✅.**"
          assert old in s
          p.write_text(s.replace(old, new))

          checkpoint = Path("docs/project/current/dev/DEV-home-return-poster-retention.md")
          assert checkpoint.exists()
          checkpoint.unlink()

          workflow = Path(".github/workflows/temp-close-build306-acceptance.yml")
          assert workflow.exists()
          workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "docs: close accepted Build306 home poster return task"
          git push origin HEAD:main
