name: Temp Search Build256 IPA v2

on:
  push:
    branches: ["feat/search-page-optimization"]
    paths:
      - ".github/search-build256-ipa-v2-trigger.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Search branch
        uses: actions/checkout@v4
        with:
          ref: feat/search-page-optimization
          fetch-depth: 0

      - name: Apply Search Build256 lifetime correction
        run: |
          set -euo pipefail
          python3 .github/search-build256-apply.py
          git diff --check
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add Sources/App/RootView.swift Sources/UI/EmbySearchRecommendationPreloader.swift Sources/UI/EmbySearchExperienceV3.swift Sources/UI/EmbyServerRootViewV3.swift docs/project/current/dev/DEV-search-page-optimization.md docs/changelog/CHANGELOG_v0_14_89_build256.md
          git commit -m "Preserve Search recommendations through detail navigation"
          git push origin HEAD:feat/search-page-optimization
          git rev-parse HEAD | tee build256-source-sha.txt

      - name: Validate Search Build256 source
        run: |
          set -euo pipefail
          swiftc -parse Sources/App/RootView.swift Sources/UI/EmbySearchRecommendationPreloader.swift Sources/UI/EmbySearchExperienceV3.swift Sources/UI/EmbyServerRootViewV3.swift
          grep -q '@ObservedObject private var model: V3GlobalSearchViewModel' Sources/UI/EmbySearchExperienceV3.swift
          grep -q 'recommendationItems.isEmpty' Sources/UI/EmbySearchExperienceV3.swift
          grep -q '@State private var searchModel: V3GlobalSearchViewModel?' Sources/UI/EmbyServerRootViewV3.swift
          ! grep -q 'V3SearchRecommendationPreloader.shared.start' Sources/App/RootView.swift
          ! grep -q 'itemsBySessionID' Sources/UI/EmbySearchRecommendationPreloader.swift
          git diff --check

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate assets and project
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update

      - name: Resolve MPVKit
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build Search Build256 Release app
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache MARKETING_VERSION=0.14.89 CURRENT_PROJECT_VERSION=256 IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build256.log

      - name: Verify app identity
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          python3 - "$APP_PATH/Info.plist" <<'PY'
          import plistlib, sys
          p = plistlib.load(open(sys.argv[1], 'rb'))
          expected = {'CFBundleIdentifier':'com.embyplayerlab.app','CFBundleShortVersionString':'0.14.89','CFBundleVersion':'256','MinimumOSVersion':'15.0'}
          for k,v in expected.items():
              if str(p.get(k)) != v: raise SystemExit(f'{k}: {p.get(k)} != {v}')
          PY

      - name: Package Search Build256 IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA_NAME="OnePlayer-0.14.89-Build256-Search.ipa"
          zip -qry "$IPA_NAME" Payload
          unzip -t "$IPA_NAME" | tee package.log
          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload Search Build256 candidate
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.89-Build256-Search
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            build256-source-sha.txt
            package.log
          if-no-files-found: error
          retention-days: 30
