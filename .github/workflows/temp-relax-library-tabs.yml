name: Temp Relax Library Tabs

on:
  push:
    branches:
      - tune/library-tabs-relax-round2
    paths:
      - .github/workflows/temp-relax-library-tabs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tune/library-tabs-relax-round2
      - name: Relax tab spacing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/UI/EmbyServerBrowseV3.swift')
          s = p.read_text()
          old = '''        ScrollView(.horizontal, showsIndicators: false) {
            HStack(spacing: 14) {'''
          new = '''        ScrollView(.horizontal, showsIndicators: false) {
            HStack(spacing: 18) {'''
          if s.count(old) != 1: raise SystemExit(f'unexpected tab spacing context count: {s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''            }
            .padding(.horizontal, 12)
        }
        .frame(height: 44)'''
          new = '''            }
            .padding(.horizontal, 14)
        }
        .frame(height: 44)'''
          if s.count(old) != 1: raise SystemExit(f'unexpected tab padding context count: {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/temp-relax-library-tabs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ui: relax library tab spacing"
          git push origin HEAD:tune/library-tabs-relax-round2
