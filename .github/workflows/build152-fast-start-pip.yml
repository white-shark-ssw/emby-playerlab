name: Build OnePlayer 0.13.85 Build152 Fast Start PiP

on:
  workflow_dispatch:
  push:
    branches: [fix/fast-start-pip-0.13.85]
    paths:
      - "Sources/**"
      - "project.mdklab.yml"
      - "Podfile"
      - ".github/workflows/build152-fast-start-pip.yml"
  pull_request:
    branches: [feature/playback-transition-airplay-pip-0.13.84]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build152-fast-start-pip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout Build152 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Build152 contracts
        run: |
          set -euo pipefail
          grep -Fq 'sourceVersion = "0.13.85"' Sources/Core/AppIdentity.swift
          python3 - <<'PY'
          from pathlib import Path

          screen = Path('Sources/UI/PlayerScreen.swift').read_text()
          required_screen = [
              'initialOrientationStarted',
              'playerUIAlreadyVisible=true',
              'engine activation begins in parallel',
              'beginOrientationTransition(to: target, reason: "initial", shouldStartPlayback: false)',
              'guard !playbackStarted, !isClosing else { return }',
              'DispatchQueue.main.async { beginInitialOrientationIfNeeded(reason: "onAppear") }',
          ]
          for token in required_screen:
              assert token in screen, token
          assert 'if !orientationReady || isClosing' not in screen
          assert 'if orientationReady && !isClosing' not in screen

          transition = Path('Sources/UI/ResolvedPlaybackFullscreenCover.swift').read_text()
          assert 'fullscreen player present transition=immediate' in transition
          assert 'presenter.present(host, animated: false)' in transition

          pip = Path('Sources/UI/PlayerPictureInPictureController.swift').read_text()
          for token in [
              'inline-preserved=true',
              'phase=content-visible',
              'override func viewDidAppear',
              'custom renderer source ready; starting system PiP with inline renderer still attached',
              'custom renderer start timeout',
          ]:
              assert token in pip, token
          prepared = pip.index('custom renderer prepared source=MPV inline-preserved=true')
          transferred = pip.index('custom renderer transferred source=MPV phase=content-visible')
          assert prepared < transferred

          mpv_surface = Path('Sources/UI/MPVPlayerSurface.swift').read_text()
          assert 'displayLayerHostedExternally' in mpv_surface
          assert 'MPV renderer detached after PiP content became visible' in mpv_surface
          mdk_surface = Path('Sources/UI/KSAVIOPlayerSurface.swift').read_text()
          assert 'playerViewHostedExternally' in mdk_surface
          assert 'MDK renderer detached after PiP content became visible' in mdk_surface

          mpv = Path('Sources/Player/MPVPlayerEngine.swift').read_text()
          seek_start = mpv.index('    func seek(to seconds: Double, direction: SeekDirection)')
          seek_end = mpv.index('\n    private func claimKeyframeLookupIndex()', seek_start)
          seek_body = mpv[seek_start:seek_end]
          assert seek_body.count('self.command(handle, ["seek"') == 1
          assert 'absolute+keyframes' in seek_body
          assert 'absolute+exact' not in seek_body
          PY
          git fetch origin feature/playback-transition-airplay-pip-0.13.84 --depth=1
          test -z "$(git diff --name-only origin/feature/playback-transition-airplay-pip-0.13.84...HEAD -- Sources/Transport Sources/Player/MPVPlayerEngine.swift Sources/Player/KSAVIOPlayerEngine.swift Sources/Player/PlayerController.swift Sources/Player/PlaybackPresentationCoordinator.swift Sources/Player/PlaybackPresentationAdapters.swift MDKLab)"
          test ! -e .github/workflows/build152-apply-faststart-patch.yml
          test ! -e docs/changelog/BUILD152.tmp
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET: "15.0"' project.mdklab.yml
          git diff --check

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate --spec project.mdklab.yml
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache 2>&1 | tee package-resolution.log

      - name: Build Build152 Release
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache IPHONEOS_DEPLOYMENT_TARGET=15.0 MARKETING_VERSION=0.13.85 CURRENT_PROJECT_VERSION=152 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id 'com.embyplayerlab.app' --version '0.13.85' --build '152' --display-name 'OnePlayer' --minimum-os '15.0' --primary-icon 'OnePlayerIcon' --alternate-icon 'OnePlayerAltIcon' | tee app-validation.log
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" '15.0' '17.0' min-os-report.log build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA='OnePlayer-0.13.85-build152-fast-start-pip-unsigned.ipa'
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/shasum -a 256 "$IPA" > "$IPA.sha256"
          cat "$IPA.sha256"

      - name: Upload Build152 package
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.85-build152-fast-start-pip
          path: |
            OnePlayer-0.13.85-build152-fast-start-pip-unsigned.ipa
            OnePlayer-0.13.85-build152-fast-start-pip-unsigned.ipa.sha256
            app-validation.log
            min-os-report.log
            build.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build152 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.13.85-build152-fast-start-pip-failure
          path: |
            build.log
            package-resolution.log
            app-validation.log
            min-os-report.log
          if-no-files-found: ignore
          retention-days: 14
