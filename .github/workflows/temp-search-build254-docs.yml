name: Temp Search Build254 Docs

on:
  push:
    branches: ["feat/search-page-optimization"]
    paths:
      - ".github/search-build254-docs-trigger.txt"

permissions:
  contents: write

jobs:
  branch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-page-optimization
          fetch-depth: 0
      - name: Record Build254 branch evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checkpoint = Path('docs/project/current/dev/DEV-search-page-optimization.md')
          text = checkpoint.read_text()
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('- Status:'):
                  lines[i] = '- Status: Active — Build253 initial 9 recommendations target-device accepted; Build254 incremental +6 candidate CI/IPA verified, target-device pending'
                  break
          text = '\n'.join(lines).rstrip() + '\n'
          fields = '''- Build254 exact product source: `addddc6611a6210437271e4e6715aa88986afa23`\n- Build254 identity: **OnePlayer 0.14.87 / Build254**\n- Build254 run/job: `33268846116 / 99143580223` — success\n- Build254 artifact: `OnePlayer-0.14.87-Build254-Search`, ID `9719501314`, digest `sha256:3acf642efefccc6b6ea440e6e383bfb2b6cb80a449ca52d89efc39a909d2dc3f`\n- Build254 IPA SHA-256: `7714f225b55a4c93e96aa35951820d43e6be33fa911e14ff378755ac23884130`\n'''
          if '- Build254 exact product source:' not in text:
              anchor = '- Built/target MinOS: iOS 15.0\n'
              text = text.replace(anchor, fields + anchor, 1)
          marker = '## Build254 CI / IPA evidence — 2026-08-30'
          if marker not in text:
              text += f'''\n{marker}\n\nExact product source `addddc6611a6210437271e4e6715aa88986afa23` preserves the Build253 first 9 recommendation request and adds only incremental +6 retrieval using the same `/Users/{{userId}}/Items` + `SortBy=Random` + `Recursive=true` + `IncludeItemTypes=Movie,Series` contract with `ExcludeItemIds` for all already-visible IDs. The current last lazy-grid card triggers the request; returned unique IDs append in place. No `StartIndex + Random`, timer, debounce, retry, fallback, watchdog, second cache or load-more ProgressView was added.\n\nXcode 16.4 Release run/job `33268846116 / 99143580223` passed source validation, MPVKit resolution, Release build, packaged identity verification and IPA integrity. Artifact `9719501314`, digest `sha256:3acf642efefccc6b6ea440e6e383bfb2b6cb80a449ca52d89efc39a909d2dc3f`; IPA SHA-256 `7714f225b55a4c93e96aa35951820d43e6be33fa911e14ff378755ac23884130`; bundle `com.embyplayerlab.app`; version `0.14.87 (254)`; MinOS 15.0. Evidence: **Code written ✅ / CI passed ✅ / IPA produced+independently verified ✅ / incremental load-more real-device tested ❌ / not stable**.\n\n## Next exact action\n\nTarget-device test Build254. Verify the accepted first 9 remain fast/correct, reaching the last visible recommendation appends 6 new non-duplicate Movie/Series items, repeated downward scrolling continues in +6 batches without container twitch, earlier posters remain resident/cached, and the accepted Dock/keyboard behavior is unchanged.\n'''
          checkpoint.write_text(text)

          changelog = Path('docs/changelog/CHANGELOG_v0_14_87_build254.md')
          c = changelog.read_text()
          c = c.replace('Evidence pending dedicated Xcode 16.4 Release CI/IPA and target-device validation.', 'Evidence: Xcode 16.4 Release CI passed and IPA produced/verified; incremental recommendation loading still requires target-device validation.')
          changelog.write_text(c)
          PY
          git diff --check
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add docs/project/current/dev/DEV-search-page-optimization.md docs/changelog/CHANGELOG_v0_14_87_build254.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Search Build254 CI evidence"
            git push origin HEAD:feat/search-page-optimization
          fi

  main-docs:
    needs: branch-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync Build253 acceptance and Build254 evidence to main
        run: |
          set -euo pipefail
          git fetch origin feat/search-page-optimization
          git show origin/feat/search-page-optimization:docs/project/current/dev/DEV-search-page-optimization.md > docs/project/current/dev/DEV-search-page-optimization.md
          python3 - <<'PY'
          from pathlib import Path
          import re

          module = Path('docs/project/MODULE_STATUS.md')
          lines = module.read_text().splitlines()
          found = False
          for i, line in enumerate(lines):
              if line.startswith('| Search page / multi-Emby search |'):
                  lines[i] = '| Search page / multi-Emby search | **Active — Build253 first 9 target-device accepted; Build254 CI/IPA verified, incremental load-more target-device pending** | Build248 Dock/keyboard behavior remains target-device accepted. Build253 / 0.14.86 is target-device accepted for Search recommendation semantics: all 9 initial cards were normal media from `/Users/{userId}/Items` + `SortBy=Random` + `Recursive=true` + `IncludeItemTypes=Movie,Series`. Build254 / 0.14.87 exact source `addddc6611a6210437271e4e6715aa88986afa23` preserves that first 9 and adds +6 append-only batches using the same query plus `ExcludeItemIds` for already-visible IDs when the last lazy-grid card appears. No `StartIndex + Random`, load-more spinner, retry/fallback/timer/watchdog or second cache. Run/job `33268846116 / 99143580223` passed; artifact `9719501314`; IPA SHA-256 `7714f225b55a4c93e96aa35951820d43e6be33fa911e14ff378755ac23884130`; MinOS 15.0 verified. Incremental loading is not target-device tested or stable yet. |'
                  found = True
              elif line.startswith('| Other product modules |'):
                  lines[i] = re.sub(r'Search Build\d+', 'Search Build254', line)
          if not found:
              raise SystemExit('Search module row not found')
          module.write_text('\n'.join(lines) + '\n')

          state = Path('docs/project/PROJECT_STATE.md')
          current = state.read_text().rstrip()
          marker = '## Search Build253 acceptance → Build254 incremental recommendations — 2026-08-30'
          if marker not in current:
              current += f'''\n\n{marker}\n\nBuild253 / 0.14.86 is target-device accepted for Search recommendation content: the user confirmed all 9 initial cards are normal playable media. The authority remains normal `/Users/{{userId}}/Items` with `Recursive=true`, `SortBy=Random`, and `IncludeItemTypes=Movie,Series`; `/Suggestions` remains rejected for this Search role.\n\nBuild254 / 0.14.87 exact source `addddc6611a6210437271e4e6715aa88986afa23` adds only incremental recommendation loading: the accepted first 9 remain unchanged; when the current last lazy-grid card enters the viewport, OnePlayer requests 6 more with the same Items/Random/Movie+Series contract plus `ExcludeItemIds` containing every already-visible recommendation ID, then appends only new IDs. Newly fetched poster URLs are warmed through the existing `EmbyImageDiskCache`/decoded pool; no new cache, `StartIndex + Random`, timer, debounce, retry, fallback, watchdog or load-more ProgressView was introduced. Build248 Dock/keyboard behavior is unchanged.\n\nXcode 16.4 Release run/job `33268846116 / 99143580223` passed. Artifact `9719501314`, digest `sha256:3acf642efefccc6b6ea440e6e383bfb2b6cb80a449ca52d89efc39a909d2dc3f`; IPA SHA-256 `7714f225b55a4c93e96aa35951820d43e6be33fa911e14ff378755ac23884130`; `com.embyplayerlab.app`; `0.14.87 (254)`; MinOS 15.0; IPA integrity passed. Evidence: **Build253 initial recommendation semantics real-device accepted ✅ / Build254 Code written ✅ / CI passed ✅ / IPA produced+verified ✅ / incremental load-more target-device pending / not stable**.\n'''
          state.write_text(current + '\n')

          decisions = Path('docs/project/TECHNICAL_DECISIONS.md')
          current = decisions.read_text().rstrip()
          marker = '## Random Search recommendations paginate by exclusion, not random StartIndex — Build254'
          if marker not in current:
              current += f'''\n\n{marker}\n\n- The accepted Search recommendation authority remains `/Users/{{userId}}/Items` + `SortBy=Random` + `Recursive=true` + `IncludeItemTypes=Movie,Series`.\n- Incremental Search recommendation batches do **not** use `StartIndex` against random sorting. The next small batch uses `ExcludeItemIds` for every recommendation already displayed and appends only new IDs.\n- Initial batch remains 9; incremental batch is 6. A single in-flight state prevents duplicate simultaneous load-more requests. There is no timer/debounce/retry/fallback/watchdog or load-more spinner.\n- Existing Search image persistence/decoded-image ownership remains authoritative; no second cache is introduced.\n'''
          decisions.write_text(current + '\n')

          index = Path('docs/project/BUILD_TEST_INDEX.md')
          current = index.read_text().rstrip()
          marker = '### Build254 / 0.14.87 — Search incremental recommendation candidate'
          if marker not in current:
              current += f'''\n\n{marker}\n\n- Build253 / 0.14.86 target-device result: initial 9 Search recommendations are all normal media; `Items + Random + Movie,Series` recommendation semantics accepted.\n- exact Build254 product source: `addddc6611a6210437271e4e6715aa88986afa23`.\n- change: preserve the accepted first 9; last lazy-grid card requests +6 from the same Items/Random/Movie+Series query using `ExcludeItemIds` for all currently displayed recommendation IDs; append only new IDs.\n- no `StartIndex + Random`, load-more spinner, retry/fallback/timer/watchdog or second cache.\n- run/job: `33268846116 / 99143580223` — success.\n- artifact: `OnePlayer-0.14.87-Build254-Search`, ID `9719501314`, digest `sha256:3acf642efefccc6b6ea440e6e383bfb2b6cb80a449ca52d89efc39a909d2dc3f`.\n- IPA SHA-256: `7714f225b55a4c93e96aa35951820d43e6be33fa911e14ff378755ac23884130`.\n- package: `com.embyplayerlab.app`, `0.14.87 (254)`, `MinimumOSVersion=15.0`, IPA integrity passed.\n- evidence: **Code written ✅ / CI passed ✅ / IPA produced+verified ✅ / incremental load-more target-device pending / not stable.**\n'''
          index.write_text(current + '\n')
          PY
          git diff --check
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add docs/project/current/dev/DEV-search-page-optimization.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/BUILD_TEST_INDEX.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Search Build253 acceptance and Build254 evidence"
            git push origin HEAD:main
          fi
