name: TEMP Sync Build223 Real Device Result

on:
  push:
    branches: [diag/home-carousel-persistent-backdrop-isolation-build223]
    paths:
      - .github/build223-real-device-docs-trigger.txt

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update Build223 durable project state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          module = Path('docs/project/MODULE_STATUS.md')
          text = module.read_text()
          old = '| Home carousel interaction | **Active — Build223 vertical persistent-backdrop A/B CI/IPA verified; Build221 horizontal A/B also pending target-device test** | Build222 / 0.14.55 target-device testing rejected offscreen auto-advance alone as a sufficient Home vertical fix. Build223 / 0.14.56 now isolates the next measured variable from accepted Build216/main product behavior: immersive Home no longer mounts the always-on full-screen `persistentCarouselBackdrop`, while Hero, preload, normal auto-advance, horizontal interaction and all P0/Frozen paths remain unchanged. Dedicated run/job `33110117601 / 98650408622` succeeded; artifact `9662245993`; IPA SHA-256 `a925714dceb138df7808079b5784f3337afe92245bd790c42c290eac82ccd73c`; MinOS 15.0 independently verified. Target-device vertical A/B is pending; not stable. Build221 remains the separate horizontal drag-time persistent isolation candidate and must not be combined before direct testing. |'
          new = '| Home carousel interaction | **Active — Build223 vertical persistent-backdrop A/B target-device ineffective; Build221 horizontal A/B still pending** | Build223 / 0.14.56 was target-device tested on iPhone 15 Pro Max / iOS 17.0: Home vertical scrolling still has obvious perceptible jitter, so removing the always-mounted full-screen `persistentCarouselBackdrop` is rejected as a sufficient fix. The same diagnostic unintentionally changes the Dock appearance because the unchanged `.ultraThinMaterial` Dock no longer has the full-screen backdrop behind it; the resulting gray/translucent strip is a diagnostic visual regression and must not be retained. Build222 offscreen auto-advance was already rejected. Next vertical candidate must restore the accepted Build216 presentation/Dock contract and isolate only one remaining carousel-owned presentation component. Build221 remains the separate horizontal lane. Not stable. |'
          assert old in text
          text = text.replace(old, new)
          old2 = '| Other product modules | Active parallel work | Build216 / 0.14.49 remains the latest accepted overall runtime baseline. Home-carousel Build223 / 0.14.56 is now the latest CI/IPA-verified Home vertical diagnostic candidate but is not real-device accepted; poster-scroll Build220 / 0.14.53 is real-device tested and ineffective for 3×3 smoothness. Build220 does not modify Home carousel owner files. `EmbySharedImageAndNavigation.swift` remains shared infrastructure, so whichever Active task integrates second must resync against then-current `main` and rerun affected validation. |'
          new2 = '| Other product modules | Active parallel work | Build216 / 0.14.49 remains the latest accepted overall runtime baseline. Home-carousel Build223 / 0.14.56 is now target-device tested and rejected as a sufficient vertical-smoothness fix; poster-scroll Build220 / 0.14.53 is also real-device tested and ineffective for 3×3 smoothness. Build221 remains a separate horizontal carousel A/B pending target-device test. `EmbySharedImageAndNavigation.swift` remains shared infrastructure, so whichever Active task integrates second must resync against then-current `main` and rerun affected validation. |'
          assert old2 in text
          module.write_text(text.replace(old2, new2))

          index = Path('docs/project/BUILD_TEST_INDEX.md')
          text = index.read_text()
          old = '| **Build223 / 0.14.56** | Home vertical persistent-backdrop isolation | **CI/IPA verified; target-device A/B pending; diagnostic only, not stable.** Based on accepted Build216/main product behavior, immersive Home no longer mounts the always-on full-screen `persistentCarouselBackdrop`; Hero, preload, normal auto-advance, horizontal interaction and all P0/Frozen paths remain unchanged. Tested source `af54d693d91303ea9bd201b5525e24f3e15ad931`; run/job `33110117601 / 98650408622`; artifact `9662245993`; artifact SHA-256 `cdc741253866243bf2f2ae111e46807e64a5deefecdc30d46ee6a75f31a0eba1`; IPA SHA-256 `a925714dceb138df7808079b5784f3337afe92245bd790c42c290eac82ccd73c`; source ZIP SHA-256 `b14860b0a5889b39be17eeac8aeacf0621c6c68784058f463f00eae3057a5432`; OnePlayer 0.14.56 (223), MinOS 15.0 independently verified. |'
          new = '| **Build223 / 0.14.56** | Home vertical persistent-backdrop isolation | **Target-device tested; obvious vertical jitter remains; A/B rejected as sufficient; unintended Dock visual regression; not stable.** Immersive Home removed only the always-on full-screen `persistentCarouselBackdrop`; Hero, preload, normal auto-advance, horizontal interaction and P0/Frozen paths remained unchanged. User still felt obvious Home vertical jitter on iPhone 15 Pro Max / iOS 17.0. Dock source was unchanged, but its `.ultraThinMaterial` lost the full-screen backdrop behind it and became a visible gray/translucent strip; this is not an intentional Dock redesign and must not be retained. Tested source `af54d693d91303ea9bd201b5525e24f3e15ad931`; run/job `33110117601 / 98650408622`; artifact `9662245993`; IPA SHA-256 `a925714dceb138df7808079b5784f3337afe92245bd790c42c290eac82ccd73c`; MinOS 15.0. |'
          assert old in text
          index.write_text(text.replace(old, new))

          state = Path('docs/project/PROJECT_STATE.md')
          text = state.read_text()
          first = text.splitlines()[2]
          replacement = '_Last updated after Build223 / 0.14.56 target-device testing. Build216 remains the latest real-device accepted overall runtime baseline. Build223 persistent-backdrop removal did not materially remove Home vertical jitter and also exposed an unintended Dock material/background visual regression, so the candidate is rejected as sufficient and must not be retained. Build221 remains the separate horizontal A/B pending target-device testing._'
          text = text.replace(first, replacement, 1)
          marker = 'Evidence: **Code written / exact scope+Frozen guard / CI passed / IPA produced+verified / real-device pending / diagnostic only / not stable**. Next vertical action is target-device A/B of Home vertical scrolling.'
          replacement2 = 'Target-device result on iPhone 15 Pro Max / iOS 17.0: **obvious Home vertical jitter remains**, so persistent full-screen removal is rejected as a sufficient fix. The unchanged Home Dock still uses `.ultraThinMaterial`; removing the full-screen backdrop changed the surface behind that material and produced the reported gray/translucent Dock strip. This is an unintended Build223 diagnostic visual regression, not an intentional Dock redesign, and must not be carried forward. Evidence: **Code written / exact scope+Frozen guard / CI passed / IPA produced+verified / real-device tested / hypothesis rejected as sufficient / Dock visual regression observed / not stable**. Next vertical candidate must restore the accepted Build216 background/Dock presentation and isolate one remaining carousel-owned presentation component at a time.'
          assert marker in text
          state.write_text(text.replace(marker, replacement2))
          PY
          git diff --check
          git diff -- docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md

      - name: Commit docs to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md
          git commit -m "Record Build223 target-device rejection [skip ci]"
          git push origin HEAD:main
