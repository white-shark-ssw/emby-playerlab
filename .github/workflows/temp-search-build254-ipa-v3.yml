name: Temp Search Build254 IPA v3

on:
  push:
    branches: ["feat/search-page-optimization"]
    paths:
      - ".github/search-build254-ipa-v3-trigger.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Search branch
        uses: actions/checkout@v4
        with:
          ref: feat/search-page-optimization
          fetch-depth: 0

      - name: Apply Search Build254 runtime changes
        run: |
          set -euo pipefail
          python3 .github/search-build254-apply.py
          git diff --check
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add Sources/Networking/EmbyLibraryHubAPI.swift Sources/UI/EmbySearchRecommendationPreloader.swift Sources/UI/EmbySearchExperienceV3.swift docs/project/current/dev/DEV-search-page-optimization.md docs/changelog/CHANGELOG_v0_14_87_build254.md
          git commit -m "Add Search incremental recommendations"
          git push origin HEAD:feat/search-page-optimization
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "$SOURCE_SHA" | tee build254-source-sha.txt

      - name: Validate Search Build254 source
        run: |
          set -euo pipefail
          swiftc -parse Sources/Networking/EmbyLibraryHubAPI.swift
          swiftc -parse Sources/UI/EmbySearchRecommendationPreloader.swift
          swiftc -parse Sources/UI/EmbySearchExperienceV3.swift
          grep -F 'excludeItemIds: [String] = []' Sources/Networking/EmbyLibraryHubAPI.swift
          grep -F 'URLQueryItem(name: "ExcludeItemIds", value: excludeItemIds.joined(separator: ","))' Sources/Networking/EmbyLibraryHubAPI.swift
          grep -F 'static let preloadLimit = 9' Sources/UI/EmbySearchRecommendationPreloader.swift
          grep -F 'static let loadMoreLimit = 6' Sources/UI/EmbySearchRecommendationPreloader.swift
          grep -F 'func moreRecommendations(client: EmbyAPIClient, excluding itemIDs: [String])' Sources/UI/EmbySearchRecommendationPreloader.swift
          grep -F 'func loadMoreRecommendations(client: EmbyAPIClient)' Sources/UI/EmbySearchExperienceV3.swift
          grep -F 'item.id == model.recommendationItems.last?.id' Sources/UI/EmbySearchExperienceV3.swift
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Sources/Networking/EmbyLibraryHubAPI.swift').read_text()
          start = text.index('func searchLandingRecommendations')
          end = text.index('func movieRecommendations', start)
          body = text[start:end]
          assert 'SortBy", value: "Random"' in body
          assert 'IncludeItemTypes' in body
          assert 'ExcludeItemIds' in body
          assert 'StartIndex' not in body
          text = Path('Sources/UI/EmbySearchExperienceV3.swift').read_text()
          load_more_start = text.index('func loadMoreRecommendations(client: EmbyAPIClient)')
          load_more_end = text.index('func recommendationPosterImage', load_more_start)
          assert 'ProgressView' not in text[load_more_start:load_more_end]
          PY
          git diff --check

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Generate assets and project
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update

      - name: Resolve MPVKit
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build Search Build254 Release app
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath .spm-cache MARKETING_VERSION=0.14.87 CURRENT_PROJECT_VERSION=254 IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' clean build 2>&1 | tee build254.log

      - name: Locate and verify Search Build254 app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          /usr/bin/plutil -p "$APP_PATH/Info.plist" | tee built-info-plist.log
          python3 - "$APP_PATH/Info.plist" <<'PY'
          import plistlib, sys
          p = plistlib.load(open(sys.argv[1], 'rb'))
          expected = {'CFBundleIdentifier':'com.embyplayerlab.app','CFBundleShortVersionString':'0.14.87','CFBundleVersion':'254','MinimumOSVersion':'15.0'}
          for key, value in expected.items():
              actual = str(p.get(key))
              if actual != value: raise SystemExit(f'::error::{key} expected {value}, got {actual}')
          print('Search Build254 identity verification: PASS')
          PY

      - name: Package and verify Search Build254 IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA_NAME="OnePlayer-0.14.87-Build254-Search.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME" | tee package.log
          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload Search Build254 candidate
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.87-Build254-Search
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            build254-source-sha.txt
            built-info-plist.log
            package.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload Search Build254 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.87-Build254-Search-diagnostics
          path: |
            build254.log
            build254-source-sha.txt
            built-info-plist.log
            package.log
          if-no-files-found: warn
          retention-days: 14
