name: TEMP Build222 Home Vertical Isolation

on:
  push:
    branches: [diag/home-carousel-vertical-idle-build222]
    paths:
      - .github/build222-home-vertical-trigger.txt

permissions:
  contents: write

jobs:
  build222:
    runs-on: macos-15
    timeout-minutes: 150
    env:
      BASE_SHA: fa3a6fb6a8ecd1d01e96d7ea9a203f7dde2437db
      VERSION: 0.14.55
      BUILD: 222
      ARTIFACT_NAME: OnePlayer-0.14.55-build222-home-vertical-carousel-isolation

    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: diag/home-carousel-vertical-idle-build222

      - name: Apply exact Build222 patch and commit tested source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/temp_apply_build222.py
          python3 scripts/check_home_vertical_carousel_isolation.py
          git diff --check
          git add Sources/Core/AppIdentity.swift Sources/UI/EmbyHomeCarouselStateV3.swift docs/changelog/CHANGELOG_v0_14_55_build222.md scripts/check_home_vertical_carousel_isolation.py scripts/temp_apply_build222.py
          git commit -m "Diag: pause Home auto carousel away from top"
          git push origin HEAD:diag/home-carousel-vertical-idle-build222
          echo "TESTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify exact task scope and protected paths
        run: |
          set -euo pipefail
          python3 scripts/check_home_vertical_carousel_isolation.py
          git diff --check
          actual="$(git diff --name-only "$BASE_SHA"..HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/build222-home-vertical-trigger.txt' \
            '.github/workflows/temp-build222-home-vertical-isolation.yml' \
            'Sources/Core/AppIdentity.swift' \
            'Sources/UI/EmbyHomeCarouselStateV3.swift' \
            'docs/changelog/CHANGELOG_v0_14_55_build222.md' \
            'scripts/check_home_vertical_carousel_isolation.py' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Unexpected Build222 scope"
            echo "--- expected ---"
            printf '%s\n' "$expected"
            echo "--- actual ---"
            printf '%s\n' "$actual"
            exit 1
          fi
          if printf '%s\n' "$actual" | grep -E '^(Sources/Player|Sources/Transport|Sources/Cache|Sources/Session)/' >/dev/null; then
            echo "::error::Build222 touched protected playback/transport/cache/session source"
            exit 1
          fi
          test "$(git diff "$BASE_SHA"..HEAD -- Sources/UI/EmbyHomeCarouselStateV3.swift | grep -c '^+        guard abs(homeRawScrollMinY) <= 0.5 else { return }$')" -eq 1

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Generate icons and Xcode project
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate

      - name: Install KTVHTTPCache
        run: |
          set -euo pipefail
          pod install --repo-update

      - name: Resolve MPVKit
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Build unsigned Release app
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build

      - name: Validate app identity and MinOS
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo "::error::Release app not found"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          python3 scripts/validate_built_app.py "$APP_PATH" \
            --bundle-id "com.embyplayerlab.app" \
            --version "$VERSION" \
            --build "$BUILD" \
            --display-name "OnePlayer" \
            --minimum-os "15.0" \
            --primary-icon "OnePlayerIcon" \
            --alternate-icon "OnePlayerAltIcon"
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "$APP_PATH" "15.0" "17.0" min-os-report.log build/DerivedData/Build/Products/Release-iphoneos

      - name: Package IPA and exact source
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          IPA_NAME="OnePlayer-${VERSION}-build${BUILD}-home-vertical-carousel-isolation-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          SOURCE_ZIP="OnePlayer-${VERSION}-build${BUILD}-source.zip"
          git archive --format=zip --output "$SOURCE_ZIP" HEAD
          /usr/bin/unzip -t "$SOURCE_ZIP"
          shasum -a 256 "$SOURCE_ZIP" > "$SOURCE_ZIP.sha256"
          {
            echo "tested_sha=$TESTED_SHA"
            echo "base_sha=$BASE_SHA"
            echo "version=$VERSION"
            echo "build=$BUILD"
            cat "$IPA_NAME.sha256"
            cat "$SOURCE_ZIP.sha256"
          } > build222-metadata.txt
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Upload Build222 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_ZIP }}.sha256
            build222-metadata.txt
            min-os-report.log
          if-no-files-found: error
          retention-days: 30
