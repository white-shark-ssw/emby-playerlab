name: Sync Build219 Aether Evidence Docs

on:
  push:
    branches: [feat/aether-multi-engine-comparison]
    paths:
      - .github/workflows/temp-aether-build219-doc-sync.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch authoritative project docs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          RUN = "33096553966"
          JOB = "98602865604"
          SOURCE = "b1a06cb2b3dc9cf715fc5d49a7b324780aa23981"
          ARTIFACT = "9656814369"
          ARTIFACT_DIGEST = "f2e984c56ebf1b74a7eaf39ff43f08cee2e9a0edaa0ae65d6406d2fefd2fc75a"
          IPA_SHA = "8df11d2db597fd6841a3708976824b21879ee0d47257c1766d1704cc4196d06d"
          SOURCE_SHA = "61148b209d543c233502c8412f9448fffa143a97f5753c25595626c72b3e31e4"

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          checkpoint = "docs/project/current/dev/DEV-aether-multi-engine-comparison.md"
          replace_once(
              checkpoint,
              "### Compile fix\n\n- Commit `90557148e66e1d074cc2831dcb8023ea22dde7e0` adds only the missing explicit `.aether` capability case.\n- No speculative concurrency refactor or unrelated warning cleanup was included.\n- A fresh Build219 Release run is required; rerunning the old attempt itself is invalid because it would use the old source SHA.\n",
              "### Compile fix\n\n- Commit `90557148e66e1d074cc2831dcb8023ea22dde7e0` adds only the missing explicit `.aether` capability case.\n- No speculative concurrency refactor or unrelated warning cleanup was included.\n- The original one-shot materialization workflow was then made rerunnable without touching product source; an initial validation-order mistake was corrected before the successful run.\n\n### Successful Build219 candidate\n\n- Exact tested repository source: `" + SOURCE + "`.\n- Workflow run/job: `" + RUN + " / " + JOB + "` — **success**.\n- Release compile, package resolution, IPA identity validation and artifact upload all passed.\n- Product artifact: `OnePlayer-0.14.52-build219-aether-" + SOURCE + "`; ID `" + ARTIFACT + "`; artifact digest `sha256:" + ARTIFACT_DIGEST + "`.\n- IPA: `OnePlayer-0.14.52-build219-aether-b1a06cb-unsigned.ipa`; SHA-256 `" + IPA_SHA + "`.\n- Source ZIP SHA-256: `" + SOURCE_SHA + "`.\n- Built identity: `CFBundleIdentifier=com.embyplayerlab.app`, `CFBundleShortVersionString=0.14.52`, `CFBundleVersion=219`, `MinimumOSVersion=16.0`.\n- Local post-download verification reproduced the IPA SHA-256 exactly and `unzip -t` reported no compressed-data errors.\n- Evidence is now **Code written / CI passed / IPA produced+verified / real-device not yet tested / not stable**.\n"
          )
          replace_once(checkpoint, "- [ ] Product CI passed.\n- [ ] IPA produced.\n", "- [x] Product CI passed (`" + RUN + " / " + JOB + "`).\n- [x] IPA produced and independently verified (artifact `" + ARTIFACT + "`).\n")
          replace_once(
              checkpoint,
              "- **CI passed:** No — first product run `33086503411` failed during App Release compile; retry on fixed source is pending.\n- **IPA produced:** No.\n- **Real-device tested:** No.\n- **Stable / frozen:** No.\n\n## Next exact action\n\nRun a fresh Build219 / 0.14.52 Release workflow from the fixed branch head, preserving Xcode 26.3, Aether 6.50.0, one-FFmpeg wiring and MinOS 16.0. If it fails, fix only the first actual compiler/linker blocker. If it succeeds, validate the packaged IPA identity/MinOS/SHA, record exact run/job/artifact/source evidence, and send the IPA for iPhone 15 Pro Max / iOS 17.0 real-device comparison.\n",
              "- **CI passed:** Yes — Build219 run/job `" + RUN + " / " + JOB + "` succeeded on exact source `" + SOURCE + "`.\n- **IPA produced:** Yes — artifact `" + ARTIFACT + "`; IPA SHA-256 `" + IPA_SHA + "`; MinOS 16.0 verified.\n- **Real-device tested:** No.\n- **Stable / frozen:** No.\n\n## Next exact action\n\nInstall Build219 / 0.14.52 on iPhone 15 Pro Max / iOS 17.0 and compare Aether against the retained MPV authority on startup/first frame, normal and rapid double-tap Seek, scrub Seek, STRM→302→115/CDN Range behavior, cache hit/miss, abnormal short media, background/resume and Emby Resume/Progress. Record only observed device evidence; do not promote Aether to automatic authority from CI/IPA alone.\n"
          )

          module = "docs/project/MODULE_STATUS.md"
          replace_once(
              module,
              "| MDK | Experimental / manual | Manual backup/experimental engine, not normal automatic authority. |\n",
              "| MDK | Experimental / manual | Manual backup/experimental engine, not normal automatic authority. |\n| Aether | **Active experimental candidate — Build219 CI/IPA verified; real-device pending** | AetherEngine 6.50.0 is manually selectable in normal OnePlayer; MPV remains default/automatic authority. Build219 / 0.14.52 exact source `" + SOURCE + "` passed Xcode 26.3 Release CI (`" + RUN + " / " + JOB + "`) and produced artifact `" + ARTIFACT + "`; IPA SHA-256 `" + IPA_SHA + "`, MinOS 16.0. Uses existing UnifiedTransport exact-byte IOReader demand and does not add a second 115/CDN network stack. PiP/audio/subtitle capabilities remain conservatively unclaimed. No real-device result yet; not stable. |\n"
          )

          decisions = Path("docs/project/TECHNICAL_DECISIONS.md")
          text = decisions.read_text()
          if "## D019 — Aether is manual-only and shares exact-byte UnifiedTransport" not in text:
              text += "\n## D019 — Aether is manual-only and shares exact-byte UnifiedTransport\n\nAetherEngine 6.50.0 is integrated as a manually selectable experimental engine for comparison; MPV remains the default/automatic playback authority. Aether does not receive an automatic fallback role. Its custom `IOReader` consumes the existing `PlaybackTransportContext` / UnifiedTransport session and reprioritizes only exact byte offsets supplied by the demuxer/current reader cursor; it must never use time→byte proportional guessing or a separate 115/CDN networking stack.\n\nThe selected Aether release requires iOS 16 and newer SDK/toolchain APIs. Direct iOS15 static import was proven incompatible, while a runtime loader shim/local compatibility fork was rejected as non-minimal; therefore the Aether comparison candidate raises only this product line to MinOS 16.0 and uses Xcode 26.3. Build219 / OnePlayer 0.14.52 exact source `" + SOURCE + "` passed Release CI (`" + RUN + " / " + JOB + "`) and produced verified artifact `" + ARTIFACT + "`, IPA SHA-256 `" + IPA_SHA + "`. This is **CI/IPA evidence only**: Aether remains experimental until target-device behavior is reported, and frozen MPV fast Seek/PiP/STRM→302→115/CDN contracts remain unchanged.\n"
              decisions.write_text(text)

          index = "docs/project/BUILD_TEST_INDEX.md"
          marker = "\n## Current accepted baseline\n"
          row = "| **Build219 / 0.14.52** | Aether manual multi-engine comparison candidate | **CI/IPA verified; real-device pending; not stable.** AetherEngine 6.50.0 is manually selectable while MPV remains default/automatic authority. Exact source `" + SOURCE + "`; Xcode 26.3 run/job `" + RUN + " / " + JOB + "` success; artifact `" + ARTIFACT + "` (`sha256:" + ARTIFACT_DIGEST + "`); IPA SHA-256 `" + IPA_SHA + "`; source ZIP SHA-256 `" + SOURCE_SHA + "`; MinOS 16.0. Aether uses existing UnifiedTransport exact-byte IOReader demand; no time→byte approximation, NAS relay, automatic fallback or PiP redesign. |\n"
          p = Path(index)
          text = p.read_text()
          if row not in text:
              if marker not in text:
                  raise SystemExit(f"{index}: marker missing")
              text = text.replace(marker, "\n" + row + marker, 1)
              p.write_text(text)

          state = "docs/project/PROJECT_STATE.md"
          p = Path(state)
          text = p.read_text()
          heading = "\n## Parallel integration rule\n"
          section = "\n## Active: Aether manual playback-engine comparison\n\nWork: `DEV-aether-multi-engine-comparison`.\n\nBuild219 / OnePlayer 0.14.52 is the first normal-App Aether comparison package. Exact source `" + SOURCE + "` passed Xcode 26.3 Release CI (`" + RUN + " / " + JOB + "`) and produced artifact `" + ARTIFACT + "`; IPA SHA-256 `" + IPA_SHA + "`, source ZIP SHA-256 `" + SOURCE_SHA + "`, built MinOS 16.0. AetherEngine 6.50.0 is manual-only; MPV remains default/automatic authority. Aether reuses existing UnifiedTransport/Session Cache through exact-byte IOReader demand; NAS relay, a second 115/CDN network stack and time→byte proportional Seek are forbidden. Frozen PiP is not redesigned and Aether currently does not claim PiP/audio-track/subtitle-selection capability.\n\nCurrent evidence: **Code written / CI passed / IPA produced+verified / real-device not yet tested / not stable**. Build216 remains the latest accepted overall runtime baseline until the user reports Build219 target-device behavior.\n"
          if section not in text:
              if heading not in text:
                  raise SystemExit(f"{state}: heading missing")
              p.write_text(text.replace(heading, section + heading, 1))
          PY
          git diff --check
          git diff -- docs/project/current/dev/DEV-aether-multi-engine-comparison.md docs/project/MODULE_STATUS.md docs/project/TECHNICAL_DECISIONS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md

      - name: Commit docs evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project
          git commit -m "Record Build219 Aether CI and IPA evidence"
          git push origin HEAD:feat/aether-multi-engine-comparison
