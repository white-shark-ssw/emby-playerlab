name: TEMP Freeze Build239 Carousel Docs

on:
  push:
    branches: [docs/home-carousel-build239-freeze-work-20260829]
    paths: [.github/build239-freeze-docs-trigger.txt]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs helper branch
        uses: actions/checkout@v4
        with:
          ref: docs/home-carousel-build239-freeze-work-20260829
          fetch-depth: 0
      - name: Prepare helper and latest main
        run: |
          set -euo pipefail
          cp scripts/temp_freeze_build239_carousel_docs.py /tmp/temp_freeze_build239_carousel_docs.py
          git fetch origin main
          git checkout -B main origin/main
      - name: Apply Build239 freeze docs
        run: python3 /tmp/temp_freeze_build239_carousel_docs.py
      - name: Validate and push docs
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={
            'docs/project/current/dev/DEV-home-carousel-drag-smoothness.md',
            'docs/project/MODULE_STATUS.md','docs/project/PROJECT_STATE.md',
            'docs/project/TECHNICAL_DECISIONS.md','docs/project/BUILD_TEST_INDEX.md'
          }
          extra=changed-allowed
          if extra: raise SystemExit(f'unexpected docs changes: {sorted(extra)}')
          missing=allowed-changed
          if missing: raise SystemExit(f'missing docs changes: {sorted(missing)}')
          print('Build239 freeze docs scope: PASS')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/project
          git commit -m "Docs: freeze Home carousel at Build239"
          git push origin HEAD:main
