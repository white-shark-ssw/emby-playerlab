name: Build216 Detail Range Inertia IPA

on:
  push:
    branches: [fix/detail-episode-range-inertia-build216]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout Build216 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Build216 detail scope and inherited contracts
        run: |
          set -euo pipefail
          python3 scripts/check_detail_episode_selection_navigation.py
          python3 scripts/check_detail_episode_range_jump.py
          python3 scripts/check_detail_page_performance.py
          python3 scripts/check_adaptive_hero_reveal.py
          python3 scripts/check_season_id_episode_grouping.py
          python3 scripts/check_player_episode_season_grouping.py
          python3 scripts/check_series_episode_ordering.py
          python3 -m py_compile scripts/check_detail_episode_selection_navigation.py scripts/check_detail_episode_range_jump.py scripts/check_detail_page_performance.py
          git diff --check 81ab52793d9fd64ffcef7302c6e0b2d71754ac75...HEAD
          python3 - <<'PY'
          import subprocess
          base = '81ab52793d9fd64ffcef7302c6e0b2d71754ac75'
          allowed = {
              '.github/workflows/temp-build216-detail-range-inertia-ci.yml',
              'Sources/Core/AppIdentity.swift',
              'Sources/UI/EmbyDetailEpisodeScrollControl.swift',
              'Sources/UI/EmbyMediaDetailView.swift',
              'docs/changelog/CHANGELOG_v0_14_49_build216.md',
              'scripts/check_detail_episode_selection_navigation.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', f'{base}...HEAD'], text=True).splitlines())
          extra = sorted(changed - allowed)
          missing = sorted((allowed - {'.github/workflows/temp-build216-detail-range-inertia-ci.yml'}) - changed)
          if extra:
              raise SystemExit(f'Unexpected Build216 files: {extra}')
          if missing:
              raise SystemExit(f'Missing Build216 files: {missing}')
          frozen_prefixes = ('Sources/Player/', 'Sources/Transport/', 'Sources/Cache/', 'Sources/Session/', 'Sources/AVIO/')
          touched_frozen = sorted(path for path in changed if path.startswith(frozen_prefixes))
          if touched_frozen:
              raise SystemExit(f'Build216 touched frozen/P0 paths: {touched_frozen}')
          frozen_files = [
              'Sources/UI/EmbyDetailPerformanceState.swift',
              'Sources/UI/EmbyEpisodePickerView.swift',
          ]
          for path in frozen_files:
              result = subprocess.run(['git', 'diff', '--quiet', base, 'HEAD', '--', path])
              if result.returncode != 0:
                  raise SystemExit(f'Build216 changed frozen inherited file: {path}')
          print('Build216 exact delta/frozen scope: PASS')
          PY

      - name: Select Xcode 16.4 and install tools
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Prepare OnePlayer app icons
        run: |
          set -euo pipefail
          python3 scripts/generate_oneplayer_icons.py

      - name: Generate project and install dependencies
        run: |
          set -euo pipefail
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache | tee package-resolution.log

      - name: Build Release
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            MARKETING_VERSION=0.14.49 \
            CURRENT_PROJECT_VERSION=216 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build216.log

      - name: Locate and validate app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id com.embyplayerlab.app --version 0.14.49 --build 216 --display-name OnePlayer --minimum-os 15.0 --primary-icon OnePlayerIcon --alternate-icon OnePlayerAltIcon

      - name: Validate MinOS
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" 15.0 17.0 build216-min-os.log build216.log

      - name: Package unsigned IPA and source snapshot
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA="OnePlayer-0.14.49-build216-detail-range-inertia-unsigned.ipa"
          /usr/bin/zip -qry "$IPA" Payload
          /usr/bin/unzip -t "$IPA"
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          SOURCE="OnePlayer-0.14.49-build216-source.zip"
          git archive --format=zip --output "$SOURCE" HEAD
          shasum -a 256 "$SOURCE" | tee "$SOURCE.sha256"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"

      - name: Upload Build216 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.49-build216-detail-range-inertia
          path: |
            ${{ env.IPA }}
            ${{ env.IPA }}.sha256
            ${{ env.SOURCE }}
            ${{ env.SOURCE }}.sha256
            build216.log
            build216-min-os.log
            package-resolution.log
          if-no-files-found: error
          retention-days: 30
