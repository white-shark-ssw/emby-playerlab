name: Finalize Build191 detail merge

on:
  push:
    branches: [feat/detail-episode-selection-navigation]
    paths:
      - ".github/workflows/temp-finalize-build191-detail-merge.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/detail-episode-selection-navigation
          fetch-depth: 0
      - name: Update accepted Build191 project state
        run: |
          set -euo pipefail
          cp scripts/temp_finalize_build191_detail_merge.py /tmp/temp_finalize_build191_detail_merge.py
          git fetch origin main
          git checkout -B main origin/main
          python3 /tmp/temp_finalize_build191_detail_merge.py
          rm docs/project/current/dev/DEV-detail-episode-selection-navigation.md
          git diff --check
          git config user.name "OnePlayer CI"
          git config user.email "actions@users.noreply.github.com"
          git add docs/project/PROJECT_STATE.md docs/project/MODULE_STATUS.md docs/project/TECHNICAL_DECISIONS.md docs/project/BUILD_TEST_INDEX.md docs/project/current/dev/DEV-detail-episode-selection-navigation.md
          git commit -m "Finalize Build191 detail acceptance"
          git push origin HEAD:main
