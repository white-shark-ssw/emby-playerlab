name: Repair Alpha1 Source

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch EmbyServerRootViewV3
        run: |
          set -euo pipefail
          git show cbcce04669e81160c2bcffb1026197c301ccfc2a:Sources/UI/EmbyServerRootViewV3.swift > Sources/UI/EmbyServerRootViewV3.swift
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Sources/UI/EmbyServerRootViewV3.swift')
          text = path.read_text()
          old = '''                for library in libraries {\n                    group.addTask {\n                        do {\n                            let types = Self.browseItemTypes(for: library)\n'''
          new = '''                for library in libraries {\n                    let types = Self.browseItemTypes(for: library)\n                    group.addTask {\n                        do {\n'''
          if old not in text:
              raise SystemExit('expected MainActor task-group pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/repair-alpha1.yml .github/repair-alpha1-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/UI/EmbyServerRootViewV3.swift .github/workflows/repair-alpha1.yml .github/repair-alpha1-trigger.txt || true
          git commit -m "fix: resolve alpha1 MainActor compile error"
          git push origin HEAD:main
