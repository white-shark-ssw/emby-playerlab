name: Aether Xcode Target Spike

on:
  push:
    branches: [feat/aether-multi-engine-comparison]
    paths:
      - .github/workflows/temp-aether-xcode-target-spike.yml

jobs:
  spike:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_26.3.app
          xcodebuild -version
          brew install xcodegen
      - name: Prepare exact Aether source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 6.50.0 https://github.com/superuser404notfound/AetherEngine.git vendor/AetherEngine
          test "$(git -C vendor/AetherEngine rev-parse HEAD)" = "546287f2eef7d810b3947070839a85c653f79e46"
      - name: Create iOS 15 host probe
        run: |
          set -euo pipefail
          mkdir -p spike/App
          cat > spike/App/SpikeApp.swift <<'SWIFT'
          import UIKit
          import AetherEngine
          import Libmpv
          @main final class SpikeApp: UIResponder, UIApplicationDelegate {
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil) -> Bool {
                  if #available(iOS 16.0, *) { _ = try? AetherEngine() }
                  return true
              }
          }
          SWIFT
          cat > spike/project.yml <<'YAML'
          name: AetherVendoredTargetSpike
          options:
            deploymentTarget:
              iOS: "15.0"
            xcodeVersion: "26.3"
          packages:
            MPVKit:
              url: https://github.com/mpvkit/MPVKit.git
              exactVersion: 1.0.0
          targets:
            AetherEngine:
              type: library.static
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: ../vendor/AetherEngine/Sources/AetherEngine
              dependencies:
                - package: MPVKit
                  product: MPVKit
              settings:
                base:
                  PRODUCT_MODULE_NAME: AetherEngine
                  SWIFT_VERSION: "6.0"
                  OTHER_SWIFT_FLAGS: "$(inherited) -module-alias Dovi=Libdovi"
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
                  DEVELOPMENT_TEAM: ""
            SpikeApp:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: App
              dependencies:
                - target: AetherEngine
                - package: MPVKit
                  product: MPVKit
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.embyplayerlab.aetherxctargetspike
                  SWIFT_VERSION: "5.0"
                  GENERATE_INFOPLIST_FILE: YES
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
                  DEVELOPMENT_TEAM: ""
          YAML
          cd spike
          xcodegen generate
      - name: Resolve and build Release
        run: |
          set -euo pipefail
          cd spike
          xcodebuild -resolvePackageDependencies -project AetherVendoredTargetSpike.xcodeproj -scheme SpikeApp -clonedSourcePackagesDirPath ../.spm-spike 2>&1 | tee ../resolve.log
          xcodebuild -project AetherVendoredTargetSpike.xcodeproj -scheme SpikeApp -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ../build/AetherVendoredTarget -clonedSourcePackagesDirPath ../.spm-spike CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' build 2>&1 | tee ../build.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-xcode-target-spike-${{ github.sha }}
          path: |
            resolve.log
            build.log
          retention-days: 7