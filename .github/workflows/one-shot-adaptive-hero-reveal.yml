name: One-shot adaptive Hero reveal patch

on:
  push:
    branches:
      - "feat/adaptive-hero-reveal"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply adaptive Hero source patch
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[adaptive-hero-patched]'; then
            echo 'Adaptive Hero source patch already applied; no-op.'
            exit 0
          fi
          python3 scripts/apply_adaptive_hero_reveal.py
          python3 scripts/check_v0134_detail_navigation.py
          python3 scripts/check_adaptive_hero_reveal.py
          git diff --check
          git diff --stat
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add Sources/UI/ImmersiveUIComponents.swift Sources/UI/EmbyMediaDetailView.swift Sources/UI/EmbyEpisodePickerView.swift scripts/check_adaptive_hero_reveal.py
          git commit -m 'feat: add adaptive crop reveal to detail and episode picker [adaptive-hero-patched]'
          git push origin HEAD:feat/adaptive-hero-reveal
