name: Temp Search Build250 Docs
on:
  push:
    branches: ["feat/search-page-optimization"]
    paths: [".github/search-build250-docs-trigger.txt"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-page-optimization
          fetch-depth: 0
      - name: Sync Search Build250 docs
        run: |
          set -euo pipefail
          python3 .github/search-build250-docs.py
          git diff --check
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add docs/project/PROJECT_STATE.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/TECHNICAL_DECISIONS.md
          git commit -m "Document Search Build250 evidence"
          git push origin HEAD:feat/search-page-optimization
