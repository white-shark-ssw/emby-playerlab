name: Temp Search Build245 Docs

on:
  push:
    branches: ["feat/search-page-optimization"]
    paths:
      - ".github/search-build245-docs-trigger.txt"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append Build244 and Build245 Search evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/project/BUILD_TEST_INDEX.md')
          text = path.read_text()
          marker = '## Search page Build244/Build245 evidence — 2026-08-29'
          if marker not in text:
              block = '''\n\n## Search page Build244/Build245 evidence — 2026-08-29\n\n### Build244 / 0.14.77 — first competitor-aligned Search candidate\n\n- Exact tested source: `0710fa4cf0a59dbf7e6748e951db2e3cddf2b82c`; run/job `33251653411 / 99098250151`; artifact `9714601161`; IPA SHA-256 `a48d317f3caee89564789bca657da8700953f76a58fcff792562bbb67b146d05`; MinOS 15.0.\n- Target-device result on iPhone 15 Pro Max / iOS 17.0: Search history/recommendation/menu direction works, but the candidate is rejected as final because the gear is too large, keyboard still pushes the Dock, one-target Search does not directly enter full results, recommendations are capped/filtered, and landing geometry remains visibly too large/low versus the supplied competitor.\n- Evidence: **Code written ✅ / CI passed ✅ / IPA produced+verified ✅ / real-device tested ✅ / rejected as final ✅ / not stable.**\n\n### Build245 / 0.14.78 — Search follow-up candidate\n\n- Exact tested product source: `4c5f286ee870589bd2eac05119a516631a31391a`; cleanup branch head after temporary CI removal: `e45c82f41d3dcf3a7d72c7f4e510627fbeada20f`.\n- Scope: 40% smaller gear; tighter competitor-aligned Search title/input/history geometry; Search keyboard safe-area ownership moved onto the root `GeometryReader`; exactly one active Emby target routes directly to the full paginated 3-column result page; Emby Suggestions start at 12 with no media-type filter and increase requested Limit by 6 near the end. Shared poster-grid source is untouched.\n- Run/job: **`33253244567 / 99102435848` — success**.\n- Artifact: `OnePlayer-0.14.78-Build245-Search`; ID **`9715042997`**; digest **`sha256:7b4fc1baab92d4a05feb3c7a1d9989ab688c6bf01a00907d51ca863abe431ffd`**.\n- IPA SHA-256: **`19f69ca62928a65fb23bfdb44c67a916a7ba9edea20c3c3755f0875bb65a6514`**.\n- Source ZIP SHA-256: **`31b116e57265aee94bcfb577dc60f0fb86e61739728d50a94e536299db936349`**.\n- Independent verification: embedded hashes reproduced; IPA `unzip -t` passed; bundle `com.embyplayerlab.app`; OnePlayer `0.14.78 (245)`; `MinimumOSVersion=15.0`.\n- Evidence: **Code written ✅ / CI passed ✅ / IPA produced+independently verified ✅ / real-device pending / not stable.**\n'''
              path.write_text(text.rstrip() + block + '\n')
          PY
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add docs/project/BUILD_TEST_INDEX.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Search Build244 and Build245 evidence"
          git push origin HEAD:main
