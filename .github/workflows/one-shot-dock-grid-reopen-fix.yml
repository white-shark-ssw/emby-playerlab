name: One-shot dock and grid reopen fix

on:
  push:
    branches: [chatgpt/fix-dock-position-grid-reopen-race-20260812]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[dock-grid-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-dock-position-grid-reopen-race-20260812
          fetch-depth: 0
      - name: Apply Dock and grid navigation fix
        run: |
          set -euo pipefail
          python3 scripts/apply_dock_grid_reopen_fix.py
          git diff --check
      - name: Commit source fix
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align detail dock and stabilize grid reopen [dock-grid-fixed]'
          git push origin HEAD:chatgpt/fix-dock-position-grid-reopen-race-20260812
