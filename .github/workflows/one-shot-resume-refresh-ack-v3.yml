name: One-shot resume refresh acknowledgement patch v3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/resume-refresh-ack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fix runner and apply source patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/one_shot_resume_refresh_ack.py')
          text = p.read_text()
          old = '''if "private var resumeDirty = false" not in tail:
              tail = replace_once(
                  tail,
                  ''' + "'''" + '''    private(set) var hasLoaded = false\n''' + "'''" + ''',
                  ''' + "'''" + '''    private(set) var hasLoaded = false\n    private var resumeDirty = false\n    private var dirtyResumeItemIDs = Set<String>()\n''' + "'''" + ''',
                  "home dirty state",
              )
          '''
          new = '''if "private var resumeDirty = false" not in tail:
              old_state = "    private(set) var hasLoaded = false\\n"
              new_state = "    private(set) var hasLoaded = false\\n    private var resumeDirty = false\\n    private var dirtyResumeItemIDs = Set<String>()\\n"
              state_index = tail.find(old_state)
              if state_index < 0:
                  raise SystemExit("home dirty state: marker missing")
              tail = tail[:state_index] + new_state + tail[state_index + len(old_state):]
          '''
          if old not in text:
              raise SystemExit('runner patch block not found')
          p.write_text(text.replace(old, new, 1))
          PY
          python3 scripts/one_shot_resume_refresh_ack.py
          rm -f .github/workflows/one-shot-resume-refresh-ack-v3.yml
          git diff --check
          grep -q 'playbackStoppedReason' Sources/Core/EmbyUserDataChange.swift
          grep -q 'refresh(userInitiated: true)' Sources/UI/EmbyServerRootViewV3.swift
          grep -q 'refreshPlaybackUserData' Sources/UI/EmbyMediaDetailView.swift
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add -A
          git commit -m 'fix: synchronize resume refresh after playback stop'
          git push origin HEAD:fix/resume-refresh-ack
