name: One-shot apply Build208 poster motion diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-apply-build208-poster-motion-diagnostics.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/poster-grid-smoothness
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact Build206 diagnostic head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "351c62694ac25404c2bd4eb36a03314dd58ffed2"

      - name: Materialize Build208 motion-aware diagnostics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          shared = Path('Sources/UI/EmbySharedImageAndNavigation.swift')
          s = shared.read_text(encoding='utf-8')
          start_marker = 'final class EmbyPosterScrollHitchDiagnostics: NSObject {'
          end_marker = 'private final class EmbyCachedImageLoader: ObservableObject {'
          if s.count(start_marker) != 1 or s.count(end_marker) != 1:
              raise SystemExit('Build206 diagnostics anchor mismatch')
          start = s.index(start_marker)
          end = s.index(end_marker)
          replacement = '''final class EmbyPosterScrollHitchDiagnostics: NSObject {
              static let shared = EmbyPosterScrollHitchDiagnostics()

              private struct PosterEvent {
                  let itemID: String
                  let route: String
                  let timestamp: CFTimeInterval
              }

              private var displayLink: CADisplayLink?
              private var lastDisplayTimestamp: CFTimeInterval?
              private var visiblePosterCount = 0
              private var lastCellAppear: PosterEvent?
              private var lastImageCommitAt: CFTimeInterval?
              private var lastLoadAhead: PosterEvent?
              private weak var observedScrollView: UIScrollView?
              private var observedScrollOwnerID: UUID?
              private var observedScrollRoute = "none"
              private var lastScrollOffsetY: CGFloat?

              private override init() {}

              func posterDidAppear(itemID: String, route: String) {
                  precondition(Thread.isMainThread)
                  visiblePosterCount += 1
                  lastCellAppear = PosterEvent(itemID: itemID, route: route, timestamp: CACurrentMediaTime())
                  ensureDisplayLink()
              }

              func posterDidDisappear() {
                  precondition(Thread.isMainThread)
                  visiblePosterCount = max(0, visiblePosterCount - 1)
                  if visiblePosterCount == 0 { stopDisplayLink() }
              }

              func imageDidCommit() {
                  precondition(Thread.isMainThread)
                  lastImageCommitAt = CACurrentMediaTime()
              }

              func loadAheadDidTrigger(itemID: String) {
                  precondition(Thread.isMainThread)
                  lastLoadAhead = PosterEvent(itemID: itemID, route: "grid-load-ahead", timestamp: CACurrentMediaTime())
              }

              func observeVerticalScrollView(_ scrollView: UIScrollView, ownerID: UUID, route: String) {
                  precondition(Thread.isMainThread)
                  if observedScrollOwnerID != ownerID || observedScrollView !== scrollView {
                      observedScrollOwnerID = ownerID
                      observedScrollView = scrollView
                      lastScrollOffsetY = scrollView.contentOffset.y
                  }
                  observedScrollRoute = route
              }

              func stopObservingVerticalScrollView(ownerID: UUID) {
                  precondition(Thread.isMainThread)
                  guard observedScrollOwnerID == ownerID else { return }
                  observedScrollOwnerID = nil
                  observedScrollView = nil
                  observedScrollRoute = "none"
                  lastScrollOffsetY = nil
              }

              private func ensureDisplayLink() {
                  guard displayLink == nil else { return }
                  lastDisplayTimestamp = nil
                  lastScrollOffsetY = observedScrollView?.contentOffset.y
                  let link = CADisplayLink(target: self, selector: #selector(displayLinkTick(_:)))
                  link.add(to: .main, forMode: .common)
                  displayLink = link
              }

              private func stopDisplayLink() {
                  displayLink?.invalidate()
                  displayLink = nil
                  lastDisplayTimestamp = nil
                  lastScrollOffsetY = observedScrollView?.contentOffset.y
              }

              @objc private func displayLinkTick(_ link: CADisplayLink) {
                  let scrollView = observedScrollView
                  let currentOffsetY = scrollView?.contentOffset.y
                  let deltaY = currentOffsetY.flatMap { current in lastScrollOffsetY.map { current - $0 } } ?? 0
                  lastScrollOffsetY = currentOffsetY
                  guard let previous = lastDisplayTimestamp else {
                      lastDisplayTimestamp = link.timestamp
                      return
                  }
                  let gap = link.timestamp - previous
                  lastDisplayTimestamp = link.timestamp
                  guard gap >= 0.030 else { return }
                  guard let scrollView, deltaY != 0 else { return }
                  let now = link.timestamp
                  let cellAge = lastCellAppear.map { max(0, (now - $0.timestamp) * 1000) } ?? -1
                  let imageAge = lastImageCommitAt.map { max(0, (now - $0) * 1000) } ?? -1
                  let loadAheadAge = lastLoadAhead.map { max(0, (now - $0.timestamp) * 1000) } ?? -1
                  let gapText = String(format: "%.1f", gap * 1000)
                  let offsetText = String(format: "%.2f", scrollView.contentOffset.y)
                  let deltaText = String(format: "%.2f", deltaY)
                  let velocityText = String(format: "%.1f", scrollView.panGestureRecognizer.velocity(in: scrollView).y)
                  let cellAgeText = String(format: "%.1f", cellAge)
                  let imageAgeText = String(format: "%.1f", imageAge)
                  let loadAheadAgeText = String(format: "%.1f", loadAheadAge)
                  let phase = scrollView.isDragging ? "dragging" : (scrollView.isDecelerating ? "decelerating" : "moving")
                  let lastCellID = lastCellAppear?.itemID ?? "none"
                  let lastCellRoute = lastCellAppear?.route ?? "none"
                  let lastLoadAheadID = lastLoadAhead?.itemID ?? "none"
                  DiagnosticsLogger.shared.log("PosterScrollHitch", "frame_gap_ms=\\(gapText) scroll_route=\\(observedScrollRoute) phase=\\(phase) offset_y=\\(offsetText) delta_y=\\(deltaText) velocity_y=\\(velocityText) visible=\\(visiblePosterCount) last_cell=\\(lastCellID) cell_route=\\(lastCellRoute) cell_age_ms=\\(cellAgeText) image_age_ms=\\(imageAgeText) load_ahead=\\(lastLoadAheadID) load_ahead_age_ms=\\(loadAheadAgeText)")
              }
          }

          final class EmbyPosterScrollMotionProbeView: UIView {
              var hierarchyDidChange: ((UIView) -> Void)?

              override func didMoveToSuperview() {
                  super.didMoveToSuperview()
                  hierarchyDidChange?(self)
              }

              override func didMoveToWindow() {
                  super.didMoveToWindow()
                  hierarchyDidChange?(self)
              }

              override func layoutSubviews() {
                  super.layoutSubviews()
                  hierarchyDidChange?(self)
              }
          }

          struct EmbyPosterScrollMotionProbe: UIViewRepresentable {
              let route: String

              func makeCoordinator() -> Coordinator { Coordinator(route: route) }

              func makeUIView(context: Context) -> EmbyPosterScrollMotionProbeView {
                  let view = EmbyPosterScrollMotionProbeView(frame: .zero)
                  view.backgroundColor = .clear
                  view.isUserInteractionEnabled = false
                  view.hierarchyDidChange = { [weak coordinator = context.coordinator] probe in coordinator?.attach(from: probe) }
                  DispatchQueue.main.async { [weak coordinator = context.coordinator, weak view] in
                      guard let view else { return }
                      coordinator?.attach(from: view)
                  }
                  return view
              }

              func updateUIView(_ uiView: EmbyPosterScrollMotionProbeView, context: Context) {
                  context.coordinator.route = route
                  DispatchQueue.main.async { [weak coordinator = context.coordinator, weak uiView] in
                      guard let uiView else { return }
                      coordinator?.attach(from: uiView)
                  }
              }

              static func dismantleUIView(_ uiView: EmbyPosterScrollMotionProbeView, coordinator: Coordinator) {
                  uiView.hierarchyDidChange = nil
                  coordinator.detach()
              }

              final class Coordinator {
                  let ownerID = UUID()
                  var route: String
                  private weak var scrollView: UIScrollView?

                  init(route: String) { self.route = route }

                  func attach(from probe: UIView) {
                      guard let scrollView = ancestorVerticalScrollView(from: probe) else { return }
                      if self.scrollView !== scrollView {
                          if self.scrollView != nil { EmbyPosterScrollHitchDiagnostics.shared.stopObservingVerticalScrollView(ownerID: ownerID) }
                          self.scrollView = scrollView
                      }
                      EmbyPosterScrollHitchDiagnostics.shared.observeVerticalScrollView(scrollView, ownerID: ownerID, route: route)
                  }

                  func detach() {
                      EmbyPosterScrollHitchDiagnostics.shared.stopObservingVerticalScrollView(ownerID: ownerID)
                      scrollView = nil
                  }

                  private func ancestorVerticalScrollView(from probe: UIView) -> UIScrollView? {
                      var current: UIView? = probe
                      while let view = current {
                          if let scrollView = view as? UIScrollView, !scrollView.isPagingEnabled { return scrollView }
                          current = view.superview
                      }
                      return nil
                  }
              }
          }

          '''
          s = s[:start] + replacement + s[end:]
          shared.write_text(s, encoding='utf-8')

          grid = Path('Sources/UI/EmbyPosterGrid.swift')
          g = grid.read_text(encoding='utf-8')
          old = '        .background(GeometryReader { proxy in Color.clear.preference(key: EmbyPosterGridWidthPreferenceKey.self, value: proxy.size.width) })\n        .onPreferenceChange(EmbyPosterGridWidthPreferenceKey.self) { width in\n'
          new = '        .background(GeometryReader { proxy in Color.clear.preference(key: EmbyPosterGridWidthPreferenceKey.self, value: proxy.size.width) })\n        .background(EmbyPosterScrollMotionProbe(route: "grid"))\n        .onPreferenceChange(EmbyPosterGridWidthPreferenceKey.self) { width in\n'
          if g.count(old) != 1:
              raise SystemExit('Build206 grid probe anchor mismatch')
          grid.write_text(g.replace(old, new, 1), encoding='utf-8')

          home = Path('Sources/UI/EmbyHomeCoreV3.swift')
          h = home.read_text(encoding='utf-8')
          old = '                    ZStack {\n                        V3HomeScrollOffsetObserver { value in\n'
          new = '                    ZStack {\n                        EmbyPosterScrollMotionProbe(route: "home")\n                        V3HomeScrollOffsetObserver { value in\n'
          if h.count(old) != 1:
              raise SystemExit('Build206 Home scroll-owner anchor mismatch')
          home.write_text(h.replace(old, new, 1), encoding='utf-8')

          identity = Path('Sources/Core/AppIdentity.swift')
          i = identity.read_text(encoding='utf-8')
          if i.count('static let sourceVersion = "0.14.39"') != 1 or i.count('?? "0.14.39"') != 1:
              raise SystemExit('Build206 identity anchor mismatch')
          i = i.replace('static let sourceVersion = "0.14.39"', 'static let sourceVersion = "0.14.41"', 1)
          i = i.replace('?? "0.14.39"', '?? "0.14.41"', 1)
          identity.write_text(i, encoding='utf-8')

          checker = Path('scripts/check_poster_grid_smoothness.py')
          c = checker.read_text(encoding='utf-8')
          person_line = 'person_source = Path("Sources/UI/EmbyPersonMediaView.swift").read_text(encoding="utf-8")\n'
          if c.count(person_line) != 1:
              raise SystemExit('checker person-source anchor mismatch')
          c = c.replace(person_line, person_line + 'home_source = Path("Sources/UI/EmbyHomeCoreV3.swift").read_text(encoding="utf-8")\n', 1)
          old_diag = '''required_diagnostics = [
              "final class EmbyPosterScrollHitchDiagnostics: NSObject",
              "private var displayLink: CADisplayLink?",
              "guard gap >= 0.030 else { return }",
              "DiagnosticsLogger.shared.log(\\"PosterScrollHitch\\"",
              "posterDidAppear(itemID: item.id, route: gridNavigationState == nil ? \\"row\\" : \\"grid\\")",
              "EmbyPosterScrollHitchDiagnostics.shared.imageDidCommit()",
              "EmbyPosterScrollHitchDiagnostics.shared.loadAheadDidTrigger(itemID: item.id)",
          ]
          '''
          new_diag = '''required_diagnostics = [
              "final class EmbyPosterScrollHitchDiagnostics: NSObject",
              "private var displayLink: CADisplayLink?",
              "func observeVerticalScrollView(_ scrollView: UIScrollView, ownerID: UUID, route: String)",
              "let deltaY = currentOffsetY.flatMap { current in lastScrollOffsetY.map { current - $0 } } ?? 0",
              "guard gap >= 0.030 else { return }",
              "guard let scrollView, deltaY != 0 else { return }",
              r"scroll_route=\\(observedScrollRoute) phase=\\(phase) offset_y=\\(offsetText) delta_y=\\(deltaText) velocity_y=\\(velocityText)",
              "DiagnosticsLogger.shared.log(\\"PosterScrollHitch\\"",
              "posterDidAppear(itemID: item.id, route: gridNavigationState == nil ? \\"row\\" : \\"grid\\")",
              "EmbyPosterScrollHitchDiagnostics.shared.imageDidCommit()",
              "EmbyPosterScrollHitchDiagnostics.shared.loadAheadDidTrigger(itemID: item.id)",
          ]
          '''
          if c.count(old_diag) != 1:
              raise SystemExit('Build206 checker diagnostics anchor mismatch')
          c = c.replace(old_diag, new_diag, 1)
          old_single = '''if image_source.count('DiagnosticsLogger.shared.log("PosterScrollHitch"') != 1:
              raise SystemExit("PosterScrollHitch must log only after one centralized display-link gap detector")
          if image_source.count("CADisplayLink(target: self") != 1:
              raise SystemExit("Build206 must own exactly one poster-scroll CADisplayLink implementation")
          '''
          new_single = '''if image_source.count('DiagnosticsLogger.shared.log("PosterScrollHitch"') != 1:
              raise SystemExit("PosterScrollHitch must log only after one centralized display-link gap detector")

          if 'EmbyPosterScrollMotionProbe(route: "grid")' not in grid_source:
              raise SystemExit("3-column grid must register its vertical scroll owner for motion-gated hitch diagnostics")
          if 'EmbyPosterScrollMotionProbe(route: "home")' not in home_source:
              raise SystemExit("Home poster-heavy scroll must register its vertical scroll owner for motion-gated hitch diagnostics")
          if image_source.count("CADisplayLink(target: self") != 1:
              raise SystemExit("poster diagnostics must keep exactly one shared CADisplayLink implementation")
          '''
          if c.count(old_single) != 1:
              raise SystemExit('Build206 checker singleton anchor mismatch')
          checker.write_text(c.replace(old_single, new_single, 1), encoding='utf-8')

          Path('docs/changelog/CHANGELOG_v0_14_41_build208.md').write_text('''# OnePlayer 0.14.41 / Build208

          ## Motion-aware poster scroll diagnostics

          - Build206 App-log capture proved immediate cell appearance, image commit and grid load-ahead are not a universal cross-page trigger, but its display-link gaps were not tied to actual vertical motion.
          - Build208 remains diagnostic-only. It samples the real ancestor vertical `UIScrollView` from the existing shared display-link path.
          - `PosterScrollHitch` is emitted only when the display gap is at least 30 ms and the vertical content offset actually changed across that gap.
          - Each hitch adds `scroll_route`, `phase`, `offset_y`, `delta_y` and `velocity_y`, while retaining cell/image/load-ahead timing fields.
          - Home and all shared 3-column poster grids register only a transparent, non-interactive scroll-owner probe; scroll physics, image policy, navigation, carousel gesture ownership and playback/transport paths are unchanged.
          - Deployment target remains iOS 15.0.
          ''', encoding='utf-8')
          PY
          python3 scripts/check_poster_grid_smoothness.py
          python3 -m py_compile scripts/check_poster_grid_smoothness.py
          rm -rf scripts/__pycache__
          git diff --check

      - name: Guard exact diagnostic-only scope and commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {
              'Sources/Core/AppIdentity.swift',
              'Sources/UI/EmbyHomeCoreV3.swift',
              'Sources/UI/EmbyPosterGrid.swift',
              'Sources/UI/EmbySharedImageAndNavigation.swift',
              'docs/changelog/CHANGELOG_v0_14_41_build208.md',
              'scripts/check_poster_grid_smoothness.py',
          }
          paths = {line[3:] for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()}
          if paths != allowed:
              raise SystemExit(f'Build208 expected exact six-file delta, got: {sorted(paths)}')
          frozen_prefixes = ('Sources/Player/', 'Sources/Transport/', 'Sources/Cache/', 'Sources/Session/', 'Sources/AVIO/')
          touched_frozen = sorted(path for path in paths if path.startswith(frozen_prefixes))
          if touched_frozen:
              raise SystemExit(f'Build208 touched frozen/P0 paths: {touched_frozen}')
          forbidden_carousel = {'Sources/UI/EmbyHomeCarouselInteractionV3.swift', 'Sources/UI/EmbyHomeCarouselStateV3.swift', 'Sources/UI/EmbyHomeHeroV3.swift'}
          touched_carousel = sorted(paths & forbidden_carousel)
          if touched_carousel:
              raise SystemExit(f'Build208 touched active carousel owner files: {touched_carousel}')
          print('Build208 materializer scope: PASS')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Core/AppIdentity.swift Sources/UI/EmbyHomeCoreV3.swift Sources/UI/EmbyPosterGrid.swift Sources/UI/EmbySharedImageAndNavigation.swift scripts/check_poster_grid_smoothness.py docs/changelog/CHANGELOG_v0_14_41_build208.md
          git commit -m "Correlate poster hitches with vertical motion"
          git push origin HEAD:perf/poster-grid-smoothness
