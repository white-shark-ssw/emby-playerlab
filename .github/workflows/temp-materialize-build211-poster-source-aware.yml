# one-shot trigger
name: One-shot materialize Build211 poster source-aware diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-materialize-build211-poster-source-aware.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9d8fd6a62e6e7d281d4fae5ab8442754a6362f47
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact Build211 diagnostic patch
        run: |
          set -euo pipefail
          expected=9d8fd6a62e6e7d281d4fae5ab8442754a6362f47
          branch=perf/poster-grid-smoothness
          remote_head=$(git ls-remote origin "refs/heads/${branch}" | awk '{print $1}')
          test "$remote_head" = "$expected"
          git fetch origin main
          git show origin/main:scripts/temp_build211_source_aware.patch > /tmp/build211.patch
          git apply --check /tmp/build211.patch
          git apply /tmp/build211.patch
          python3 scripts/check_poster_grid_smoothness.py
          python3 -m py_compile scripts/check_poster_grid_smoothness.py
          rm -rf scripts/__pycache__
          git diff --check
          mapfile -t changed < <(git diff --name-only "$expected")
          printf '%s\n' "${changed[@]}"
          expected_files=(
            Sources/Core/AppIdentity.swift
            Sources/UI/EmbySharedImageAndNavigation.swift
            docs/changelog/CHANGELOG_v0_14_44_build211.md
            scripts/check_poster_grid_smoothness.py
          )
          test "${#changed[@]}" -eq "${#expected_files[@]}"
          for file in "${expected_files[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fx "$file" >/dev/null; done
          ! printf '%s\n' "${changed[@]}" | grep -E 'Player|UnifiedTransport|Cache|Session|EmbyHome(Core|Hero|Carousel)|EmbyPosterGrid\.swift' >/dev/null

      - name: Commit Build211 diagnostic source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Core/AppIdentity.swift Sources/UI/EmbySharedImageAndNavigation.swift docs/changelog/CHANGELOG_v0_14_44_build211.md scripts/check_poster_grid_smoothness.py
          git commit -m "Add Build211 source-aware poster diagnostics"
          git push origin HEAD:perf/poster-grid-smoothness
