name: Temp sync Build190 carousel docs

on:
  push:
    branches: [fix/home-carousel-native-release-build190]
    paths:
      - ".github/workflows/temp-sync-build190-carousel-docs.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync Build190 carousel authority docs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ps = Path('docs/project/PROJECT_STATE.md')
          s = ps.read_text()
          s = re.sub(r'^_Last updated.*?_$', '_Last updated after Build189 / OnePlayer 0.14.22 was real-device rejected because releasing a native-sampled drag could leave the carousel frozen at an intermediate progress, and Build190 / OnePlayer 0.14.23 completed dedicated Release CI/IPA with single-owner movement/release semantics. Build188 / OnePlayer 0.14.21 remains the independent detail/episode-selection navigation candidate. Build184 / OnePlayer 0.14.17 remains the accepted overall functional baseline on `main`; neither Build188 nor Build190 replaces it until target-device evidence is accepted._', s, count=1, flags=re.M)
          s = re.sub(r'Build180 / OnePlayer 0\.14\.13 is a \*\*historical partial-improvement carousel build\*\*:.*?Build189 / OnePlayer 0\.14\.22 is now the valid independent carousel native-touch candidate with CI/IPA evidence\.', 'Build180 / OnePlayer 0.14.13 is a **historical partial-improvement carousel build**: real-device testing confirmed reversal continuity improved, but initial motion still felt coarse, so it was not accepted. Build185 / OnePlayer 0.14.18 restored the required page-slide interaction but was also **real-device rejected**. Build187 / OnePlayer 0.14.20 completed the diagnostic gate on real device: first useful SwiftUI horizontal samples were already about 4.33/8.00/15.67/11.00pt with maxFPS=120 and Low Power Mode off. Build189 / OnePlayer 0.14.22 proved native raw/coalesced sampling could drive intermediate progress, but was **real-device rejected** because releasing the finger could leave that partial transition frozen instead of completing/cancelling. Build190 / OnePlayer 0.14.23 is now the valid independent carousel candidate with CI/IPA evidence.', s, count=1)
          section = '''### Build190 / OnePlayer 0.14.23 — home-carousel native movement + SwiftUI release ownership\n\n`DEV-home-carousel-drag-smoothness` remains Active. Build190 directly fixes the Build189 target-device release-settle regression without reverting native fine-grained movement sampling.\n\n- Build189 real-device result: **rejected** — drag progress followed the finger, but releasing could leave the page frozen at the exact intermediate progress; supplied recording was 9.07 s / 30 fps and showed repeated partial-transition freezes\n- source cause: Build189 native recognizer entered `.began/.changed` for horizontal motion while complete/cancel remained exclusively in SwiftUI `DragGesture.onEnded`\n- branch: `fix/home-carousel-native-release-build190`\n- dedicated CI source: `8effb767af988c9bb4e6230ffc8b1a7f664c2619`\n- Release-workflow-restored head: `817897ef6bd95d710657c3d12acc4d48ec8f2d39`\n- CI run: **`32873473886` — success**\n- artifact: `OnePlayer-0.14.23-build190-home-carousel-native-release`; ID `9573068806`; digest `sha256:355afc63f6b87251fce6c200af4796733bff8b947a27e71293e596745467437e`\n- IPA SHA-256: `873abefa8c585ba577222a00d6feb99639bf3aa60861334d178eb8b4a26a24ba`; source ZIP SHA-256: `e9491fbf27610421d46e1fd1325be1d8d86c6e6d7010adfd721ae542a34fd0cb`\n- MinOS: 15.0\n- implementation: native raw/coalesced sampler remains the sole movement-progress owner but no longer claims horizontal recognition; SwiftUI removes per-frame `onChanged` writes and remains the sole `onEnded` / `predictedEndTranslation` / commit-cancel owner\n- unchanged: 0.28 progress / 0.48×width predicted commit, full-page foreground travel, reversal continuity, backdrop/auto-advance/detail click, Player/PiP/Transport/Cache/Emby session contracts\n- evidence level: **Code written / CI passed / IPA produced / real-device pending / not stable**\n\n'''
          if '### Build190 / OnePlayer 0.14.23 — home-carousel native movement + SwiftUI release ownership' not in s:
              s = s.replace('### Build189 / OnePlayer 0.14.22 — home-carousel native-touch input\n', section + '### Build189 / OnePlayer 0.14.22 — home-carousel native-touch input\n', 1)
          ps.write_text(s)

          ms = Path('docs/project/MODULE_STATUS.md')
          s = ms.read_text()
          s = re.sub(r'^\| Home carousel interaction \|.*$', '| Home carousel interaction | **Active Build190 release-owner candidate; Build189 real-device rejected** | Build187 proved SwiftUI initial horizontal samples arrive already at 4–16pt. Build189 native raw/coalesced movement exposed a release regression: lifting the finger could freeze the carousel at intermediate progress because native recognition competed with the SwiftUI-only settle owner. Build190 keeps native movement sampling passive and leaves only SwiftUI `onEnded` as commit/cancel owner; dedicated Release CI passed and IPA was produced. Real-device validation is pending. |', s, count=1, flags=re.M)
          s = re.sub(r'^\| Other product modules \| Active parallel work \|.*$', '| Other product modules | Active parallel work | Build184 / 0.14.17 is the accepted overall runtime baseline on `main`. Build190 / 0.14.23 carousel release-owner candidate and Build188 / 0.14.21 detail episode-selection are independent real-device-pending lines; neither replaces Build184 until accepted. |', s, count=1, flags=re.M)
          ms.write_text(s)

          bi = Path('docs/project/BUILD_TEST_INDEX.md')
          s = bi.read_text()
          s = re.sub(r'^\| \*\*Build189 / 0\.14\.22\*\* \|.*$', '| **Build189 / 0.14.22** | Carousel native raw/coalesced-touch input | Native movement sampling worked, but **real-device rejected:** releasing a drag could leave the carousel frozen at the intermediate progress instead of completing/cancelling. Source inspection showed native recognition was competing with the SwiftUI-only release owner. |', s, count=1, flags=re.M)
          if '| **Build190 / 0.14.23** |' not in s:
              s = s.replace('| **Build189 / 0.14.22** | Carousel native raw/coalesced-touch input | Native movement sampling worked, but **real-device rejected:** releasing a drag could leave the carousel frozen at the intermediate progress instead of completing/cancelling. Source inspection showed native recognition was competing with the SwiftUI-only release owner. |', '| **Build189 / 0.14.22** | Carousel native raw/coalesced-touch input | Native movement sampling worked, but **real-device rejected:** releasing a drag could leave the carousel frozen at the intermediate progress instead of completing/cancelling. Source inspection showed native recognition was competing with the SwiftUI-only release owner. |\n| **Build190 / 0.14.23** | Passive native movement sampling + single SwiftUI release owner | Native raw/coalesced samples remain the only progress writer; native recognizer no longer claims horizontal recognition, while SwiftUI keeps the original predicted `onEnded` commit/cancel semantics. Dedicated Release CI passed, IPA produced and downloaded checksums verified. **Real-device pending.** |', 1)
          s = re.sub(r'Build182 remains real-device accepted/frozen.*?neither replaces Build184\.', 'Build182 remains real-device accepted/frozen for the two detail performance/cache requirements and is inherited by Build184. Build184 / 0.14.17 is the accepted overall runtime baseline merged to `main`; Build187 completed the carousel diagnostic gate, Build189 is real-device rejected for the release-settle regression, Build190 / 0.14.23 is the current independent home-carousel candidate, and Build188 / 0.14.21 remains the independent detail/episode-selection candidate. Build188 and Build190 remain real-device pending and neither replaces Build184.', s, count=1)
          bi.write_text(s)

          td = Path('docs/project/TECHNICAL_DECISIONS.md')
          s = td.read_text()
          add = '''\nBuild189 target-device testing added a second ownership constraint. Native raw/coalesced touch sampling successfully drove partial progress, but the custom recognizer also entered `.began/.changed` while complete/cancel remained exclusively in SwiftUI `DragGesture.onEnded`. The supplied recording showed the carousel repeatedly staying frozen at the exact partial progress after finger release. Therefore a native movement sampler must not also claim the horizontal gesture if SwiftUI remains the release/prediction authority.\n\nBuild190 establishes the corrected single-owner split: native raw/coalesced touch capture is a **passive movement sampler only** and does not enter `.began/.changed`; it explicitly cannot prevent or be prevented by other recognizers and fails at touch end. SwiftUI `DragGesture` no longer writes per-frame progress and remains the sole release owner using the existing `predictedEndTranslation`, 0.28 progress / 0.48×width predicted commit thresholds, and existing complete/cancel settle. This avoids both duplicate movement writers and a missing release owner without introducing fallback, timer, watchdog, debounce, throttle or interpolation. Build190 passed dedicated Release CI and produced IPA; real-device acceptance is still pending.\n'''
          if 'Build189 target-device testing added a second ownership constraint.' not in s:
              s = s.replace('\n## D013 — Detail high-rate scroll and warm presentation stay scoped and presentation-only\n', add + '\n## D013 — Detail high-rate scroll and warm presentation stay scoped and presentation-only\n', 1)
          td.write_text(s)

          cp = Path('docs/project/current/dev/DEV-home-carousel-drag-smoothness.md')
          s = cp.read_text()
          append = '''\n\n## Build189 real-device release regression / Build190 candidate\n\n- **Build189 real-device result — REJECTED**：用户安装 0.14.22 / Build189 后提供 `RPReplay_Final1787675510.mp4`（510×1108 / 30 fps / 9.07 s），明确报告“不能完整切换，滑到哪里就定格在那里”。录屏多次显示手动 progress 能随拖动到中间位置，但松手后没有 complete/cancel settle，页面停在两页之间。\n- **Source evidence**：Build189 native recognizer 横向采样时进入 `.began/.changed`，而 complete/cancel 的唯一入口仍是 SwiftUI `carouselDragGesture(...).onEnded`，形成结束所有权竞争。\n- **Build190 architecture**：native raw/coalesced sampler 保留，但横向时保持 passive；`canPrevent` / `canBePrevented` 均为 false，touch end/cancel 只令 sampler `.failed`。SwiftUI `DragGesture` 删除全部 per-frame `onChanged` progress 写入，只保留原 `onEnded`、`predictedEndTranslation`、0.28 / 0.48×width commit 与原 complete/cancel。移动 progress 单 owner = native；release settle 单 owner = SwiftUI。\n- **Build / branch**：OnePlayer **0.14.23 / Build190**；`fix/home-carousel-native-release-build190`。\n- **CI source / run**：`8effb767af988c9bb4e6230ffc8b1a7f664c2619`；run **`32873473886` success**；Release workflow restored at `817897ef6bd95d710657c3d12acc4d48ec8f2d39`.\n- **Artifact**：`OnePlayer-0.14.23-build190-home-carousel-native-release`；ID `9573068806`；digest `sha256:355afc63f6b87251fce6c200af4796733bff8b947a27e71293e596745467437e`。IPA SHA-256 **`873abefa8c585ba577222a00d6feb99639bf3aa60861334d178eb8b4a26a24ba`**；source ZIP SHA-256 `e9491fbf27610421d46e1fd1325be1d8d86c6e6d7010adfd721ae542a34fd0cb`；MinOS 15.0。\n- **Evidence**：Build189 = **real-device rejected / not stable**；Build190 = **Code written / CI passed / IPA produced / real-device pending / not stable**。\n- **Next exact action**：真机先验证松手必定完整 commit/cancel，再重新比较极小起滑、慢拖、连续反向与 EX 的细腻度。\n'''
          if '## Build189 real-device release regression / Build190 candidate' not in s:
              s += append
          cp.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/PROJECT_STATE.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/TECHNICAL_DECISIONS.md docs/project/current/dev/DEV-home-carousel-drag-smoothness.md
          git commit -m "Record Build189 rejection and Build190 carousel candidate"
          git push origin HEAD:main
