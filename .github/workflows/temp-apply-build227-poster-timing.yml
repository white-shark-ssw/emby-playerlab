name: One-shot Apply Build228 Poster Timing Diagnostics

on:
  push:
    branches: ["perf/poster-grid-smoothness"]
    paths:
      - ".github/workflows/temp-apply-build227-poster-timing.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact poster branch
        uses: actions/checkout@v4
        with:
          ref: perf/poster-grid-smoothness
          fetch-depth: 0

      - name: Guard Build220 source and Build228 allocation
        env:
          CONTROL_PARENT: 5958321b6756443152f2db2faf290e6c48caf3fb
          SOURCE_BASE: 6198466a749a54603a67c6c32bc0efcf9d7e2082
          WORKFLOW_PATH: .github/workflows/temp-apply-build227-poster-timing.yml
        run: |
          set -euo pipefail
          git fetch origin perf/poster-grid-smoothness
          test "$(git rev-parse HEAD^)" = "$CONTROL_PARENT"
          test "$(git diff --name-only "$SOURCE_BASE"..HEAD)" = "$WORKFLOW_PATH"
          grep -F 'static let sourceVersion = "0.14.53"' Sources/Core/AppIdentity.swift >/dev/null
          grep -F 'imageCancellable = loader.$image.sink { [weak self] image in self?.surface?.setImage(image) }' Sources/UI/EmbySharedImageAndNavigation.swift >/dev/null
          grep -F 'private func fetchPage(tab: V3LibraryTab, reset: Bool) async {' Sources/UI/EmbyServerBrowseV3.swift >/dev/null
          test -z "$(git ls-remote --heads origin '*build228*')"

      - name: Apply measurement-only timing instrumentation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def block(*lines: str) -> str:
              return "\n".join(lines)

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def insert_after_matching_line(path: str, needle: str, new_line: str) -> None:
              p = Path(path)
              lines = p.read_text(encoding="utf-8").splitlines()
              matches = [index for index, line in enumerate(lines) if needle in line]
              if len(matches) != 1:
                  raise SystemExit(f"{path}: expected one matching line for {needle!r}, got {len(matches)}")
              lines.insert(matches[0] + 1, new_line)
              p.write_text("\n".join(lines) + "\n", encoding="utf-8")

          identity = Path("Sources/Core/AppIdentity.swift")
          identity_text = identity.read_text(encoding="utf-8")
          if identity_text.count("0.14.53") != 2:
              raise SystemExit("unexpected Build220 AppIdentity version count")
          identity.write_text(identity_text.replace("0.14.53", "0.14.61"), encoding="utf-8")

          image_path = "Sources/UI/EmbySharedImageAndNavigation.swift"

          timed_image_event = block(
              "    private struct TimedImageEvent {",
              "        let itemID: String",
              "        let imageType: String",
              "        let maxWidth: String",
              "        let source: String",
              "        let durationMS: Double",
              "        let timestamp: CFTimeInterval",
              "    }",
          )
          timing_events = block(
              "    private struct TimedImagePublishEvent {",
              "        let image: ImageEvent",
              "        let durationMS: Double",
              "    }",
              "",
              "    private struct SurfaceImageEvent {",
              "        let image: ImageEvent",
              "        let publishToSinkMS: Double",
              "        let setImageDurationMS: Double",
              "        let publishToSurfaceMS: Double",
              "    }",
              "",
              "    private struct PageApplyEvent {",
              "        let route: String",
              "        let reset: Bool",
              "        let startIndex: Int",
              "        let receivedCount: Int",
              "        let appliedCount: Int",
              "        let durationMS: Double",
              "        let timestamp: CFTimeInterval",
              "    }",
              "",
              "    private struct PageSnapshotEvent {",
              "        let route: String",
              "        let durationMS: Double",
              "        let timestamp: CFTimeInterval",
              "    }",
          )
          replace_once(image_path, timed_image_event, timed_image_event + "\n\n" + timing_events)

          old_properties = block(
              "    private var lastImageCommit: ImageEvent?",
              "    private var lastImageCallback: TimedImageEvent?",
          )
          new_properties = block(
              "    private var lastImageCommit: ImageEvent?",
              "    private var lastImagePublish: TimedImagePublishEvent?",
              "    private var lastImageSurface: SurfaceImageEvent?",
              "    private var lastImageCallback: TimedImageEvent?",
              "    private var lastPageApply: PageApplyEvent?",
              "    private var lastPageSnapshot: PageSnapshotEvent?",
          )
          replace_once(image_path, old_properties, new_properties)

          image_commit = block(
              "    func imageDidCommit(url: URL, source: String, role: String) {",
              "        precondition(Thread.isMainThread)",
              "        let context = imageContext(url)",
              "        lastImageCommit = ImageEvent(itemID: context.itemID, imageType: context.imageType, maxWidth: context.maxWidth, source: source, role: role, timestamp: CACurrentMediaTime())",
              "    }",
          )
          timing_methods = block(
              "    func imagePublishDidComplete(url: URL, source: String, role: String, durationMS: Double) {",
              "        precondition(Thread.isMainThread)",
              "        let context = imageContext(url)",
              "        let image = ImageEvent(itemID: context.itemID, imageType: context.imageType, maxWidth: context.maxWidth, source: source, role: role, timestamp: CACurrentMediaTime())",
              "        lastImagePublish = TimedImagePublishEvent(image: image, durationMS: durationMS)",
              "    }",
              "",
              "    func imageSurfaceDidAdopt(url: URL?, source: String, role: String, publishStartedAt: CFTimeInterval?, sinkStartedAt: CFTimeInterval, completedAt: CFTimeInterval) {",
              "        precondition(Thread.isMainThread)",
              "        guard let url, let publishStartedAt else { return }",
              "        let context = imageContext(url)",
              "        let image = ImageEvent(itemID: context.itemID, imageType: context.imageType, maxWidth: context.maxWidth, source: source, role: role, timestamp: completedAt)",
              "        lastImageSurface = SurfaceImageEvent(image: image, publishToSinkMS: max(0, (sinkStartedAt - publishStartedAt) * 1000), setImageDurationMS: max(0, (completedAt - sinkStartedAt) * 1000), publishToSurfaceMS: max(0, (completedAt - publishStartedAt) * 1000))",
              "    }",
              "",
              "    func pageApplyDidComplete(route: String, reset: Bool, startIndex: Int, receivedCount: Int, appliedCount: Int, durationMS: Double) {",
              "        precondition(Thread.isMainThread)",
              "        lastPageApply = PageApplyEvent(route: route, reset: reset, startIndex: startIndex, receivedCount: receivedCount, appliedCount: appliedCount, durationMS: durationMS, timestamp: CACurrentMediaTime())",
              "    }",
              "",
              "    func pageSnapshotDidComplete(route: String, durationMS: Double) {",
              "        precondition(Thread.isMainThread)",
              "        lastPageSnapshot = PageSnapshotEvent(route: route, durationMS: durationMS, timestamp: CACurrentMediaTime())",
              "    }",
          )
          replace_once(image_path, image_commit, image_commit + "\n\n" + timing_methods)

          timing_summary = block(
              "    private func timingSummary(now: CFTimeInterval) -> String {",
              "        let publish = lastImagePublish",
              "        let surface = lastImageSurface",
              "        let pageApply = lastPageApply",
              "        let pageSnapshot = lastPageSnapshot",
              "        let publishAgeText = String(format: \"%.1f\", publish.map { max(0, (now - $0.image.timestamp) * 1000) } ?? -1)",
              "        let publishDurationText = String(format: \"%.1f\", publish?.durationMS ?? -1)",
              "        let surfaceAgeText = String(format: \"%.1f\", surface.map { max(0, (now - $0.image.timestamp) * 1000) } ?? -1)",
              "        let publishToSinkText = String(format: \"%.1f\", surface?.publishToSinkMS ?? -1)",
              "        let surfaceSetText = String(format: \"%.1f\", surface?.setImageDurationMS ?? -1)",
              "        let publishToSurfaceText = String(format: \"%.1f\", surface?.publishToSurfaceMS ?? -1)",
              "        let pageApplyAgeText = String(format: \"%.1f\", pageApply.map { max(0, (now - $0.timestamp) * 1000) } ?? -1)",
              "        let pageApplyDurationText = String(format: \"%.1f\", pageApply?.durationMS ?? -1)",
              "        let pageSnapshotAgeText = String(format: \"%.1f\", pageSnapshot.map { max(0, (now - $0.timestamp) * 1000) } ?? -1)",
              "        let pageSnapshotDurationText = String(format: \"%.1f\", pageSnapshot?.durationMS ?? -1)",
              "        let publishItem = publish?.image.itemID ?? \"none\"",
              "        let publishSource = publish?.image.source ?? \"none\"",
              "        let publishRole = publish?.image.role ?? \"none\"",
              "        let surfaceItem = surface?.image.itemID ?? \"none\"",
              "        let surfaceSource = surface?.image.source ?? \"none\"",
              "        let surfaceRole = surface?.image.role ?? \"none\"",
              "        let pageRoute = pageApply?.route ?? \"none\"",
              "        let pageReset = pageApply.map { $0.reset ? \"1\" : \"0\" } ?? \"none\"",
              "        let pageStart = pageApply.map { String($0.startIndex) } ?? \"none\"",
              "        let pageReceived = pageApply.map { String($0.receivedCount) } ?? \"none\"",
              "        let pageApplied = pageApply.map { String($0.appliedCount) } ?? \"none\"",
              "        let snapshotRoute = pageSnapshot?.route ?? \"none\"",
              r'        return "publish_item=\(publishItem) publish_source=\(publishSource) publish_role=\(publishRole) publish_age_ms=\(publishAgeText) publish_duration_ms=\(publishDurationText) surface_item=\(surfaceItem) surface_source=\(surfaceSource) surface_role=\(surfaceRole) surface_age_ms=\(surfaceAgeText) publish_to_sink_ms=\(publishToSinkText) surface_set_ms=\(surfaceSetText) publish_to_surface_ms=\(publishToSurfaceText) page_route=\(pageRoute) page_reset=\(pageReset) page_start=\(pageStart) page_received=\(pageReceived) page_applied=\(pageApplied) page_apply_age_ms=\(pageApplyAgeText) page_apply_duration_ms=\(pageApplyDurationText) snapshot_route=\(snapshotRoute) snapshot_age_ms=\(pageSnapshotAgeText) snapshot_duration_ms=\(pageSnapshotDurationText)"',
              "    }",
          )
          image_context_signature = "    private func imageContext(_ url: URL) -> (itemID: String, imageType: String, maxWidth: String) {"
          replace_once(image_path, image_context_signature, timing_summary + "\n\n" + image_context_signature)
          insert_after_matching_line(image_path, 'DiagnosticsLogger.shared.log("PosterScrollHitch"', '        DiagnosticsLogger.shared.log("PosterScrollTiming", timingSummary(now: now))')

          publish_context = block(
              "    struct PublishContext {",
              "        let url: URL",
              "        let source: String",
              "        let role: String",
              "    }",
          )
          publish_context_timed = block(
              "    struct PublishContext {",
              "        let url: URL",
              "        let source: String",
              "        let role: String",
              "        let startedAt: CFTimeInterval",
              "    }",
          )
          replace_once(image_path, publish_context, publish_context_timed)

          replace_once(image_path, '            lastPublishContext = PublishContext(url: url, source: "memory", role: diagnosticRole)', '            let publishStartedAt = CACurrentMediaTime()\n            lastPublishContext = PublishContext(url: url, source: "memory", role: diagnosticRole, startedAt: publishStartedAt)')
          replace_once(image_path, "            image = rendered", "            image = rendered\n            let publishDurationMS = (CACurrentMediaTime() - publishStartedAt) * 1000")
          replace_once(image_path, '            EmbyPosterScrollHitchDiagnostics.shared.imageDidCommit(url: url, source: "memory", role: diagnosticRole)', '            EmbyPosterScrollHitchDiagnostics.shared.imageDidCommit(url: url, source: "memory", role: diagnosticRole)\n            EmbyPosterScrollHitchDiagnostics.shared.imagePublishDidComplete(url: url, source: "memory", role: diagnosticRole, durationMS: publishDurationMS)')

          replace_once(image_path, '                            self.lastPublishContext = PublishContext(url: url, source: "disk", role: diagnosticRole)', '                            let publishStartedAt = CACurrentMediaTime()\n                            self.lastPublishContext = PublishContext(url: url, source: "disk", role: diagnosticRole, startedAt: publishStartedAt)')
          replace_once(image_path, "                            self.image = cachedImage", "                            self.image = cachedImage\n                            let publishDurationMS = (CACurrentMediaTime() - publishStartedAt) * 1000")
          replace_once(image_path, '                            EmbyPosterScrollHitchDiagnostics.shared.imageDidCommit(url: url, source: "disk", role: diagnosticRole)', '                            EmbyPosterScrollHitchDiagnostics.shared.imageDidCommit(url: url, source: "disk", role: diagnosticRole)\n                            EmbyPosterScrollHitchDiagnostics.shared.imagePublishDidComplete(url: url, source: "disk", role: diagnosticRole, durationMS: publishDurationMS)')

          replace_once(image_path, '                    self.lastPublishContext = PublishContext(url: url, source: "network", role: diagnosticRole)', '                    let publishStartedAt = CACurrentMediaTime()\n                    self.lastPublishContext = PublishContext(url: url, source: "network", role: diagnosticRole, startedAt: publishStartedAt)')
          replace_once(image_path, "                    self.image = loaded", "                    self.image = loaded\n                    let publishDurationMS = (CACurrentMediaTime() - publishStartedAt) * 1000")
          replace_once(image_path, '                    EmbyPosterScrollHitchDiagnostics.shared.imageDidCommit(url: url, source: "network", role: diagnosticRole)', '                    EmbyPosterScrollHitchDiagnostics.shared.imageDidCommit(url: url, source: "network", role: diagnosticRole)\n                    EmbyPosterScrollHitchDiagnostics.shared.imagePublishDidComplete(url: url, source: "network", role: diagnosticRole, durationMS: publishDurationMS)')

          old_sink = '            imageCancellable = loader.$image.sink { [weak self] image in self?.surface?.setImage(image) }'
          new_sink = block(
              "            imageCancellable = loader.$image.sink { [weak self] image in",
              "                guard let self, let surface = self.surface else { return }",
              "                let publishContext = self.loader.lastPublishContext",
              "                let sinkStartedAt = CACurrentMediaTime()",
              "                surface.setImage(image)",
              "                let completedAt = CACurrentMediaTime()",
              "                guard image != nil else { return }",
              "                EmbyPosterScrollHitchDiagnostics.shared.imageSurfaceDidAdopt(url: publishContext?.url, source: publishContext?.source ?? \"unknown\", role: publishContext?.role ?? \"display\", publishStartedAt: publishContext?.startedAt, sinkStartedAt: sinkStartedAt, completedAt: completedAt)",
              "            }",
          )
          replace_once(image_path, old_sink, new_sink)

          browse_path = "Sources/UI/EmbyServerBrowseV3.swift"
          replace_once(browse_path, "import UIKit\n", "import UIKit\nimport QuartzCore\n")
          network_line = "            let page = try await client.libraryHubItemsPage(parentId: library.id, limit: pageSize, startIndex: start, recursive: true, sortBy: sortBy, includeItemTypes: query.types, filters: query.filters)"
          replace_once(browse_path, network_line, network_line + "\n            let applyStartedAt = CACurrentMediaTime()")
          filtered_line = '            let filtered = page.items.filter { allowed.isEmpty || allowed.contains($0.type?.lowercased() ?? "") }'
          replace_once(browse_path, filtered_line, filtered_line + "\n            var appliedCount = 0")
          unique_line = "                let unique = filtered.filter { seen.insert($0.id).inserted }"
          replace_once(browse_path, unique_line, unique_line + "\n                appliedCount = unique.count")
          new_items_line = "                let newItems = filtered.filter { state.seenItemIDs.insert($0.id).inserted }"
          replace_once(browse_path, new_items_line, new_items_line + "\n                appliedCount = newItems.count")
          page_tail = block(
              "            pageStates[tab] = state",
              "            loadedTabs.insert(tab)",
              "            persistSnapshot()",
          )
          measured_page_tail = block(
              "            pageStates[tab] = state",
              "            loadedTabs.insert(tab)",
              '            let diagnosticRoute = "library-\\(tab.rawValue)"',
              "            EmbyPosterScrollHitchDiagnostics.shared.pageApplyDidComplete(route: diagnosticRoute, reset: reset, startIndex: start, receivedCount: page.items.count, appliedCount: appliedCount, durationMS: (CACurrentMediaTime() - applyStartedAt) * 1000)",
              "            let snapshotStartedAt = CACurrentMediaTime()",
              "            persistSnapshot()",
              "            EmbyPosterScrollHitchDiagnostics.shared.pageSnapshotDidComplete(route: diagnosticRoute, durationMS: (CACurrentMediaTime() - snapshotStartedAt) * 1000)",
          )
          replace_once(browse_path, page_tail, measured_page_tail)

          check_path = "scripts/check_poster_grid_smoothness.py"
          poster_source_line = 'poster_source = Path("Sources/UI/EmbyServerSharedV3.swift").read_text(encoding="utf-8")'
          replace_once(check_path, poster_source_line, poster_source_line + '\nbrowse_source = Path("Sources/UI/EmbyServerBrowseV3.swift").read_text(encoding="utf-8")')
          final_print = 'print("poster grid smoothness source contract: PASS")'
          timing_checks = block(
              "required_timing_diagnostics = [",
              '    "imagePublishDidComplete(url:",',
              '    "imageSurfaceDidAdopt(url:",',
              '    "DiagnosticsLogger.shared.log(\\\"PosterScrollTiming\\\"",',
              '    "publish_duration_ms=",',
              '    "publish_to_sink_ms=",',
              '    "surface_set_ms=",',
              '    "publish_to_surface_ms=",',
              '    "page_apply_duration_ms=",',
              '    "snapshot_duration_ms=",',
              "]",
              "for needle in required_timing_diagnostics:",
              "    if needle not in image_source:",
              '        raise SystemExit(f"missing poster timing diagnostic contract: {needle}")',
              "",
              "required_pagination_timing = [",
              '    "import QuartzCore",',
              '    "let applyStartedAt = CACurrentMediaTime()",',
              '    "EmbyPosterScrollHitchDiagnostics.shared.pageApplyDidComplete(route: diagnosticRoute",',
              '    "let snapshotStartedAt = CACurrentMediaTime()",',
              '    "EmbyPosterScrollHitchDiagnostics.shared.pageSnapshotDidComplete(route: diagnosticRoute",',
              "]",
              "for needle in required_pagination_timing:",
              "    if needle not in browse_source:",
              '        raise SystemExit(f"missing pagination timing contract: {needle}")',
              "",
          )
          replace_once(check_path, final_print, timing_checks + "\n" + final_print)
          PY

      - name: Validate source-only Build228 scope
        env:
          SOURCE_BASE: 6198466a749a54603a67c6c32bc0efcf9d7e2082
          WORKFLOW_PATH: .github/workflows/temp-apply-build227-poster-timing.yml
        run: |
          set -euo pipefail
          python3 scripts/check_poster_grid_smoothness.py
          python3 -m py_compile scripts/check_poster_grid_smoothness.py
          git diff --check
          changed="$(git diff --name-only "$SOURCE_BASE" | sort)"
          expected="$(printf '%s\n' "$WORKFLOW_PATH" Sources/Core/AppIdentity.swift Sources/UI/EmbyServerBrowseV3.swift Sources/UI/EmbySharedImageAndNavigation.swift scripts/check_poster_grid_smoothness.py | sort)"
          printf 'Build228 one-shot changed paths:\n%s\n' "$changed"
          test "$changed" = "$expected"
          ! printf '%s\n' "$changed" | grep -E 'Sources/(Player|Transport|Session|Cache)/|Sources/UI/(EmbyHomeCoreV3|EmbyHomeHeroV3|EmbyHomeCarouselStateV3|EmbyHomeCarouselInteractionV3|Player|MPV|PlayerPiP)' >/dev/null
          grep -F 'static let sourceVersion = "0.14.61"' Sources/Core/AppIdentity.swift >/dev/null
          grep -F 'DiagnosticsLogger.shared.log("PosterScrollTiming"' Sources/UI/EmbySharedImageAndNavigation.swift >/dev/null
          grep -F 'publish_to_sink_ms=' Sources/UI/EmbySharedImageAndNavigation.swift >/dev/null
          grep -F 'page_apply_duration_ms=' Sources/UI/EmbySharedImageAndNavigation.swift >/dev/null
          grep -F 'pageSnapshotDidComplete(route: diagnosticRoute' Sources/UI/EmbyServerBrowseV3.swift >/dev/null

      - name: Commit Build228 timing diagnostics and remove one-shot workflow
        env:
          SOURCE_BASE: 6198466a749a54603a67c6c32bc0efcf9d7e2082
          WORKFLOW_PATH: .github/workflows/temp-apply-build227-poster-timing.yml
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$WORKFLOW_PATH"
          git add Sources/Core/AppIdentity.swift Sources/UI/EmbyServerBrowseV3.swift Sources/UI/EmbySharedImageAndNavigation.swift scripts/check_poster_grid_smoothness.py
          git diff --cached --check
          git commit -m "Add Build228 poster timing diagnostics"
          changed="$(git diff --name-only "$SOURCE_BASE"..HEAD | sort)"
          expected="$(printf '%s\n' Sources/Core/AppIdentity.swift Sources/UI/EmbyServerBrowseV3.swift Sources/UI/EmbySharedImageAndNavigation.swift scripts/check_poster_grid_smoothness.py | sort)"
          test "$changed" = "$expected"
          git push origin HEAD:perf/poster-grid-smoothness
