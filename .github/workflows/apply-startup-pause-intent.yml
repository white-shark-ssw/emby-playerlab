name: Apply startup pause intent fix

on:
  push:
    branches:
      - fix/startup-pause-intent

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/startup-pause-intent
          fetch-depth: 0

      - name: Apply focused PlayerController fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Sources/Player/PlayerController.swift")
          text = path.read_text()
          old = '''        engine.prepare(url: source.url, headers: source.headers, preferredForwardBuffer: preferredForwardBuffer, startPosition: position)
          if engineKind == .mpv { DiagnosticsLogger.shared.log("MPVLifecycle", "prepare returned item=\\(source.itemId)") }
          engine.play()
          if let session = transportContext?.session { Task { await session.setPlaybackAdvancing(true) } }
          playbackSessionStarted = true
'''
          new = '''        let shouldPlay = userWantsPlayback
          engine.prepare(url: source.url, headers: source.headers, preferredForwardBuffer: preferredForwardBuffer, startPosition: position)
          if engineKind == .mpv { DiagnosticsLogger.shared.log("MPVLifecycle", "prepare returned item=\\(source.itemId)") }
          if shouldPlay { engine.play() }
          else { engine.pause() }
          if let session = transportContext?.session { Task { await session.setPlaybackAdvancing(shouldPlay) } }
          playbackSessionStarted = true
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected startEngine block once, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old_report = '        Task { await client.reportStart(source: source, position: position, paused: false) }'
          new_report = '        Task { await client.reportStart(source: source, position: position, paused: !shouldPlay) }'
          if text.count(old_report) != 1:
              raise SystemExit(f"expected reportStart once, found {text.count(old_report)}")
          text = text.replace(old_report, new_report, 1)
          path.write_text(text)
          PY

          rm .github/workflows/apply-startup-pause-intent.yml
          git diff --check
          git diff -- Sources/Player/PlayerController.swift

      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Player/PlayerController.swift .github/workflows/apply-startup-pause-intent.yml
          git commit -m "Honor pause intent during startup"
          git push origin HEAD:fix/startup-pause-intent
