name: Sync Build196 Add Emby Docs

on:
  push:
    branches: [feat/add-emby-page-optimization]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature helper
        uses: actions/checkout@v4
        with:
          ref: feat/add-emby-page-optimization
          fetch-depth: 0
      - name: Copy helper
        run: cp .github/temp-build196-docs.py /tmp/build196-docs.py
      - name: Checkout latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - name: Update authoritative docs
        run: |
          set -euo pipefail
          python3 /tmp/build196-docs.py
          git diff --check
      - name: Guard and push
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "::error::main advanced during docs update"; exit 1; }
          git config user.name "OnePlayer CI"
          git config user.email "actions@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/TECHNICAL_DECISIONS.md docs/project/PROJECT_STATE.md docs/project/current/dev/DEV-add-emby-page-optimization.md
          git commit -m "Record Build196 Add Emby candidate"
          git push origin HEAD:main
