name: Sync Build222 Aether Evidence Docs

on:
  push:
    branches: [feat/aether-multi-engine-comparison]
    paths:
      - .github/workflows/temp-aether-build222-doc-sync.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch docs
        run: |
          set -euo pipefail
          python3 .github/scripts/temp-sync-aether-build222-docs.py
          git diff --check
          git diff -- docs/project/current/dev/DEV-aether-multi-engine-comparison.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/BUILD_TEST_INDEX.md docs/project/TECHNICAL_DECISIONS.md
      - name: Commit docs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project
          git commit -m "Record Build222 Aether seek-fix evidence"
          git push origin HEAD:feat/aether-multi-engine-comparison
