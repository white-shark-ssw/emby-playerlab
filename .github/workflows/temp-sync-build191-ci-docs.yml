name: Sync Build191 CI project docs

on:
  push:
    branches: [feat/detail-episode-selection-navigation]
    paths:
      - ".github/workflows/temp-sync-build191-ci-docs.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/detail-episode-selection-navigation
          fetch-depth: 0
      - name: Sync Build191 CI evidence to main
        run: |
          set -euo pipefail
          cp scripts/temp_record_build191_detail_docs.py /tmp/temp_record_build191_detail_docs.py
          git fetch origin main
          git checkout -B main origin/main
          python3 /tmp/temp_record_build191_detail_docs.py
          git diff --check
          git config user.name "OnePlayer CI"
          git config user.email "actions@users.noreply.github.com"
          git add docs/project/current/dev/DEV-detail-episode-selection-navigation.md docs/project/MODULE_STATUS.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md
          git commit -m "Record Build191 detail CI candidate"
          git push origin HEAD:main
