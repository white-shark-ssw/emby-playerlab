# one-shot trigger
name: One-shot materialize Build212 poster source-aware diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-materialize-build212-poster-source-aware.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9d8fd6a62e6e7d281d4fae5ab8442754a6362f47
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact Build212 diagnostic patch
        run: |
          set -euo pipefail
          expected=9d8fd6a62e6e7d281d4fae5ab8442754a6362f47
          branch=perf/poster-grid-smoothness
          remote_head=$(git ls-remote origin "refs/heads/${branch}" | awk '{print $1}')
          test "$remote_head" = "$expected"
          git fetch origin main
          git show origin/main:scripts/temp_build211_source_aware.patch > /tmp/build212.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/build212.patch')
          s = p.read_text(encoding='utf-8')
          s = s.replace('0.14.44', '0.14.45').replace('build211', 'build212').replace('Build211', 'Build212').replace('v0_14_44_build212', 'v0_14_45_build212')
          p.write_text(s, encoding='utf-8')
          PY
          git apply --check /tmp/build212.patch
          git apply /tmp/build212.patch
          python3 scripts/check_poster_grid_smoothness.py
          python3 -m py_compile scripts/check_poster_grid_smoothness.py
          rm -rf scripts/__pycache__
          git diff --check
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          printf '%s\n' "${changed[@]}"
          expected_files=(
            Sources/Core/AppIdentity.swift
            Sources/UI/EmbySharedImageAndNavigation.swift
            docs/changelog/CHANGELOG_v0_14_45_build212.md
            scripts/check_poster_grid_smoothness.py
          )
          test "${#changed[@]}" -eq "${#expected_files[@]}"
          for file in "${expected_files[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fx "$file" >/dev/null; done
          ! printf '%s\n' "${changed[@]}" | grep -E 'Player|UnifiedTransport|Cache|Session|EmbyHome(Core|Hero|Carousel)|EmbyPosterGrid\.swift' >/dev/null
          grep -F 'static let sourceVersion = "0.14.45"' Sources/Core/AppIdentity.swift >/dev/null
          grep -F '# OnePlayer 0.14.45 / Build212' docs/changelog/CHANGELOG_v0_14_45_build212.md >/dev/null

      - name: Commit Build212 diagnostic source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Core/AppIdentity.swift Sources/UI/EmbySharedImageAndNavigation.swift docs/changelog/CHANGELOG_v0_14_45_build212.md scripts/check_poster_grid_smoothness.py
          git commit -m "Add Build212 source-aware poster diagnostics"
          git push origin HEAD:perf/poster-grid-smoothness
