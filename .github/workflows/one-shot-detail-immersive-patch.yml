name: One-shot detail immersive patch

on:
  push:
    branches:
      - chatgpt/detail-immersive-toggle-navigation-race-20260811

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/detail-immersive-toggle-navigation-race-20260811
          fetch-depth: 0
      - name: Apply source patch
        run: python3 scripts/apply_detail_immersive_feature.py
      - name: Commit source patch
        run: |
          set -euo pipefail
          git diff --check
          grep -n 'serverDockContent' Sources/UI/EmbyServerRootViewV3.swift
          grep -n 'detailPagePresentation' Sources/UI/EmbyMediaDetailView.swift
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add -A
          git commit -m 'feat: wire immersive detail viewport and dock mode [detail-immersive-patched]'
          git push origin HEAD:chatgpt/detail-immersive-toggle-navigation-race-20260811
