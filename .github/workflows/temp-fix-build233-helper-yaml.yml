name: Temp Fix Build233 Helper YAML

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-fix-build233-helper-yaml.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix summary block
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/temp-apply-build233-poster-background-work-diagnostics-v2.yml')
          text = path.read_text(encoding='utf-8')
          old = '      - name: Summary\n        run: echo "Build233 source: ${BUILD233_SOURCE:-unknown}"\n'
          new = '      - name: Summary\n        run: |\n          echo "Build233 source: ${BUILD233_SOURCE:-unknown}"\n'
          if text.count(old) != 1:
              raise SystemExit('Build233 helper summary line did not match exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temp-apply-build233-poster-background-work-diagnostics-v2.yml
          git commit -m "Fix Build233 helper workflow YAML"
          git push origin main

  cleanup:
    needs: fix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove YAML fix helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          if [[ -f .github/workflows/temp-fix-build233-helper-yaml.yml ]]; then
            git rm .github/workflows/temp-fix-build233-helper-yaml.yml
            git commit -m "Remove Build233 YAML fix helper [skip ci]"
            git push origin main
          fi
