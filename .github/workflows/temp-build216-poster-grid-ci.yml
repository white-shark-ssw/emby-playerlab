name: One-shot Build218 Poster Grid IPA

on:
  push:
    branches: ["perf/poster-grid-smoothness"]
    paths:
      - ".github/workflows/temp-build216-poster-grid-ci.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout poster branch bootstrap
        uses: actions/checkout@v4
        with:
          ref: perf/poster-grid-smoothness
          fetch-depth: 0

      - name: Apply exact Build218 compiler fix and finalize source
        id: source
        run: |
          set -euo pipefail
          BASE=1ba28379296819c9f28ddd7578633c8f9f08de8d
          python3 - <<'PY'
          from pathlib import Path

          source = Path("Sources/UI/EmbySharedImageAndNavigation.swift")
          text = source.read_text(encoding="utf-8")
          old = "    func configure(contentMode: ContentMode, placeholderSystemImage: String) {"
          new = "    func configure(contentMode: SwiftUI.ContentMode, placeholderSystemImage: String) {"
          if text.count(old) != 1:
              raise SystemExit(f"expected one UIKit surface ContentMode signature, found {text.count(old)}")
          source.write_text(text.replace(old, new), encoding="utf-8")

          checker = Path("scripts/check_poster_grid_smoothness.py")
          text = checker.read_text(encoding="utf-8")
          anchor = '    "private final class EmbyCachedDisplayImageSurfaceView: UIView",\n'
          addition = anchor + '    "func configure(contentMode: SwiftUI.ContentMode, placeholderSystemImage: String)",\n'
          if text.count(anchor) != 1:
              raise SystemExit("checker UIKit surface anchor changed")
          text = text.replace(anchor, addition)
          guard_anchor = 'if "@StateObject" in display_fast_path or ".onReceive(" in display_fast_path:\n'
          guard = 'if "func configure(contentMode: ContentMode," in display_fast_path:\n    raise SystemExit("UIKit display surface must explicitly use SwiftUI.ContentMode")\n'
          if text.count(guard_anchor) != 1:
              raise SystemExit("checker display fast-path guard anchor changed")
          checker.write_text(text.replace(guard_anchor, guard + guard_anchor), encoding="utf-8")

          changelog = Path("docs/changelog/CHANGELOG_v0_14_49_build216.md")
          text = changelog.read_text(encoding="utf-8")
          text = text.replace("# OnePlayer 0.14.49 / Build216", "# OnePlayer 0.14.51 / Build218")
          text = text.replace("Build216 is based", "Build218 is based")
          text += "\n- Build218 compiler correction: the UIKit display surface now explicitly accepts `SwiftUI.ContentMode`, avoiding the `UIView.ContentMode` name shadowing proven by the retired poster Build216 Release compiler log. No runtime behavior is added by this correction.\n"
          text += "- Poster Build217 identity was retired before distribution after the independent Home-carousel cadence task claimed Build217; Build218 is the next verified-free poster identity.\n"
          Path("docs/changelog/CHANGELOG_v0_14_51_build218.md").write_text(text, encoding="utf-8")
          changelog.unlink()
          PY

          grep -F 'static let sourceVersion = "0.14.51"' Sources/Core/AppIdentity.swift >/dev/null
          grep -F '?? "0.14.51"' Sources/Core/AppIdentity.swift >/dev/null
          grep -F 'func configure(contentMode: SwiftUI.ContentMode, placeholderSystemImage: String)' Sources/UI/EmbySharedImageAndNavigation.swift >/dev/null
          ! grep -F 'func configure(contentMode: ContentMode, placeholderSystemImage: String)' Sources/UI/EmbySharedImageAndNavigation.swift >/dev/null
          python3 scripts/check_poster_grid_smoothness.py
          python3 -m py_compile scripts/check_poster_grid_smoothness.py
          git diff --check

          git rm .github/workflows/temp-build216-poster-grid-ci.yml
          git add Sources/Core/AppIdentity.swift Sources/UI/EmbySharedImageAndNavigation.swift scripts/check_poster_grid_smoothness.py docs/changelog/CHANGELOG_v0_14_51_build218.md
          git add -u docs/changelog/CHANGELOG_v0_14_49_build216.md

          changed="$(git diff --cached "$BASE" --name-only | sort)"
          expected="$(printf '%s\n' Sources/Core/AppIdentity.swift Sources/UI/EmbyPersonMediaView.swift Sources/UI/EmbyPosterGrid.swift Sources/UI/EmbyServerSharedV3.swift Sources/UI/EmbySharedImageAndNavigation.swift docs/changelog/CHANGELOG_v0_14_51_build218.md scripts/check_poster_grid_smoothness.py | sort)"
          printf 'Build218 final tree paths before commit:\n%s\n' "$changed"
          test "$changed" = "$expected"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" = "7"
          ! printf '%s\n' "$changed" | grep -E 'Sources/(Player|Transport|Session|Cache)/|Sources/UI/(EmbyHomeCoreV3|EmbyHomeHeroV3|EmbyHomeCarouselStateV3|EmbyHomeCarouselInteractionV3|Player|MPV|PlayerPiP)' >/dev/null
          git diff --cached --quiet "$BASE" -- Sources/UI/EmbyPagePersistentCache.swift Sources/UI/EmbyServerBrowseV3.swift project.yml Config/Info.plist

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prepare Build218 poster UIKit display candidate"
          TEST_SOURCE="$(git rev-parse HEAD)"
          echo "TEST_SOURCE=$TEST_SOURCE" >> "$GITHUB_ENV"
          echo "test_source=$TEST_SOURCE" >> "$GITHUB_OUTPUT"

          changed="$(git diff "$BASE"..HEAD --name-only | sort)"
          test "$changed" = "$expected"
          git diff --check "$BASE"..HEAD
          python3 scripts/check_poster_grid_smoothness.py
          git push origin HEAD:perf/poster-grid-smoothness

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document
          xcodegen --version
          pod --version

      - name: Prepare app and dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEST_SOURCE"
          python3 scripts/generate_oneplayer_icons.py
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace EmbyPlayerLab.xcworkspace -scheme EmbyPlayerLab -clonedSourcePackagesDirPath .spm-cache

      - name: Release build
        id: release
        continue-on-error: true
        run: |
          set -euo pipefail
          set -o pipefail
          test "$(git rev-parse HEAD)" = "$TEST_SOURCE"
          rm -rf build
          xcodebuild \
            -workspace EmbyPlayerLab.xcworkspace \
            -scheme EmbyPlayerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            MARKETING_VERSION=0.14.51 \
            CURRENT_PROJECT_VERSION=218 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee build.log

      - name: Upload Build218 compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build218-poster-compile-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after compile failure
        if: steps.release.outcome != 'success'
        run: |
          grep -nE '(^|: )(error:|fatal error:)' build.log | tail -80 || true
          exit 1

      - name: Locate and validate built app
        if: steps.release.outcome == 'success'
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          /usr/bin/plutil -p "$APP_PATH/Info.plist"
          python3 scripts/validate_built_app.py "$APP_PATH" --bundle-id "com.embyplayerlab.app" --version "0.14.51" --build "218" --display-name "OnePlayer" --minimum-os "15.0" --primary-icon "OnePlayerIcon" --alternate-icon "OnePlayerAltIcon"

      - name: Validate MinOS
        if: steps.release.outcome == 'success'
        run: |
          set -euo pipefail
          chmod +x scripts/check_min_os.sh
          scripts/check_min_os.sh "${{ steps.app.outputs.path }}" "15.0" "17.0" min-os-report.log build.log

      - name: Package exact IPA and source
        if: steps.release.outcome == 'success'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEST_SOURCE"
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          IPA_NAME="OnePlayer-0.14.51-build218-poster-grid-uikit-unsigned.ipa"
          SOURCE_NAME="OnePlayer-0.14.51-build218-source.zip"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          git archive --format=zip --output "$SOURCE_NAME" "$TEST_SOURCE"
          /usr/bin/unzip -t "$IPA_NAME"
          /usr/bin/unzip -t "$SOURCE_NAME"
          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"
          shasum -a 256 "$SOURCE_NAME" | tee "$SOURCE_NAME.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_NAME=$SOURCE_NAME" >> "$GITHUB_ENV"

      - name: Upload Build218 artifact
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OnePlayer-0.14.51-build218-poster-grid-uikit
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.SOURCE_NAME }}
            ${{ env.SOURCE_NAME }}.sha256
            build.log
            min-os-report.log
          if-no-files-found: error
          retention-days: 30
