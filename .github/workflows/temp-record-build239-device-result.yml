name: TEMP Record Build239 Device Result

on:
  push:
    branches: [perf/home-carousel-velocity-fling-build239]
    paths: [.github/build239-device-result-trigger.txt]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build239 branch
        uses: actions/checkout@v4
        with:
          ref: perf/home-carousel-velocity-fling-build239
          fetch-depth: 0
      - name: Prepare helper and latest main
        run: |
          set -euo pipefail
          cp scripts/temp_record_build239_device_result.py /tmp/temp_record_build239_device_result.py
          git fetch origin main
          git checkout -B main origin/main
      - name: Apply Build239 device result docs
        run: python3 /tmp/temp_record_build239_device_result.py
      - name: Validate and push docs
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={
            'docs/project/current/dev/DEV-home-carousel-drag-smoothness.md',
            'docs/project/MODULE_STATUS.md','docs/project/PROJECT_STATE.md',
            'docs/project/TECHNICAL_DECISIONS.md','docs/project/BUILD_TEST_INDEX.md'
          }
          extra=changed-allowed
          if extra: raise SystemExit(f'unexpected docs changes: {sorted(extra)}')
          if changed != allowed: raise SystemExit(f'missing docs changes: {sorted(allowed-changed)}')
          print('Build239 device-result docs scope: PASS')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/project
          git commit -m "Docs: accept Build239 velocity fling result"
          git push origin HEAD:main